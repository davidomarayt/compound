  - slug: contractor-vs-salary-calculator
    title: Contractor Day Rate vs Salary Calculator Ireland 2026
    category: Tax & Take-Home Pay
    formula: contractor_vs_salary
    summary: Compare an indicative single-person PAYE salary with self-employed contractor profit and take-home, then estimate the day rate that matches the employee net cash result.
    meta_description: Contractor vs salary calculator Ireland 2026. Compare employee salary with contractor day-rate revenue, business costs, tax and an indicative break-even day rate.
    updated: 2026-09-22
    basic_note: "Basic mode uses €5,000 of annual contractor business costs, no contractor pension contribution and the 2026 single-person tax assumptions."
    advanced_note: "Advanced mode lets you replace the business-cost assumption and include a contractor pension contribution. The break-even rate still excludes the value of employee benefits."
    fields:
      - {id: salary, label: Employee gross salary, type: number, prefix: "€", default: 70000, min: 0, step: 1000, section_start: Employee}
      - {id: day_rate, label: Contractor day rate, type: number, prefix: "€", suffix: "/day", default: 450, min: 0, step: 10, section_start: Contractor}
      - {id: billable_days, label: Billable days per year, type: number, default: 220, min: 0, max: 366, step: 1, help: "Use genuinely billable days, not simply 365 minus weekends. Allow for holidays, public holidays, sick time, administration, training and gaps between assignments where relevant."}
      - {id: contractor_costs, label: Allowable contractor business costs, type: number, prefix: "€", default: 5000, min: 0, step: 500, advanced: true, section_start: Advanced contractor assumptions}
      - {id: contractor_pension, label: Contractor pension contribution used for Income Tax illustration, type: number, prefix: "€", default: 0, min: 0, step: 500, advanced: true, help: "This is an illustrative tax input and does not test Revenue's pension age/earnings limits."}
    results:
      - {id: employee_net, label: Estimated employee take-home}
      - {id: contractor_revenue, label: Contractor gross revenue}
      - {id: contractor_profit, label: Contractor profit before pension}
      - {id: contractor_net, label: Indicative contractor take-home}
      - {id: net_difference, label: Difference in estimated annual take-home}
      - {id: break_even_day_rate, label: Day rate matching employee net cash, advanced: true}
    guide: |
      ## Start with annual economics, not the headline day rate

      A contractor day rate is not comparable with an employee's daily salary by simple division. The contractor must first generate enough billable revenue to cover non-billable days and allowable business costs, and then pay tax, USC and PRSI on the resulting profit.

      This calculator annualises the contractor side using the billable days you enter. That assumption is often more important than a small change in the day rate. A €500 day rate for 220 billable days is a very different annual business from the same rate for 170 billable days.

      ## Tax assumptions used

      The employee side uses the 2026 single-person PAYE standard-rate band and standard personal/employee credits, standard USC and Class A PRSI.

      The contractor side is modelled as self-employed trading income. It uses the standard 2026 USC bands, including the additional 3% USC surcharge on relevant non-PAYE income above €100,000, the personal and Earned Income Tax Credits, and the Department of Social Protection's **4.2375% blended Class S rate for 2026 self-employed income**, subject to the €650 minimum where applicable.

      This is deliberately a self-employed comparison. It is not a limited-company extraction model.

      ## The break-even day rate is a cash comparison only

      Advanced results include a calculated day rate at which the modelled contractor net cash approximately matches the employee take-home figure, holding billable days, contractor costs and the contractor pension input constant.

      That is **not** the rate at which contracting becomes economically equivalent to employment. Employee compensation may also include paid annual leave, public holidays, employer pension contributions, sick pay, redundancy rights, insurance, bonuses, health cover and other benefits. Contractors may also carry accounting, professional-indemnity, equipment and downtime costs not captured by the default €5,000 assumption.

      A practical comparison should therefore value those items separately and add a risk margin rather than treating the displayed break-even day rate as a quote recommendation.

      ## Employment status is a separate legal question

      A contract calling someone a contractor does not by itself decide employment status. The real working relationship matters. This calculator does not determine whether an engagement is employment or self-employment for tax or employment-law purposes.

    sources:
      - {title: "Revenue — 2026 tax rates, bands and credits", url: "https://www.revenue.ie/en/personal-tax-credits-reliefs-and-exemptions/tax-relief-charts/index.aspx"}
      - {title: "Revenue — 2026 USC rates", url: "https://www.revenue.ie/en/jobs-and-pensions/usc/standard-rates-thresholds.aspx"}
      - {title: "Department of Social Protection — PRSI Class S rates", url: "https://www.gov.ie/en/department-of-social-protection/publications/prsi-class-s-rates/"}
