name: Initialise reviewed WMM native library
on:
  push:
    branches: ['feat/wmm-native-explorer-20261113']
    paths: ['.github/wmm-native-bootstrap.py', '.github/workflows/wmm-native-initialise.yml']
permissions:
  contents: write
  actions: read
jobs:
  initialise:
    if: github.repository == 'davidomarayt/compound' && github.ref == 'refs/heads/feat/wmm-native-explorer-20261113'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: wmm-public-source-evidence
          path: wmm-source-evidence
          run-id: 43388890985
          github-token: ${{ github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install jinja2 pyyaml pytest
      - name: Import verified evidence and generate native routes
        env:
          WMM_EVIDENCE_DIR: wmm-source-evidence
        run: python .github/wmm-native-bootstrap.py
      - run: python scripts/sync_wmm_views.py --check
      - run: python -m pytest -q tests/test_wmm_explorer.py tests/test_wheres_my_money.py
      - run: node tests/wheres_my_money.cjs
      - run: node --check compound/site/static/wheres-my-money.js && node --check compound/site/static/wmm-explorer.js
      - name: Commit generated library to the feature branch only
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- content/pages/wmm-*.md content/public-spending-2026.json content/public-spending-detail-2026.json content/public-spending-sources/2026 compound/site/templates/_wmm_spending_data.html compound/site/templates/page.html compound/site/templates/wheres_my_money.html compound/site/templates/finance.html compound/site/templates/tools.html compound/site/static/wheres-my-money.js compound/site/static/wmm/public-spending-2026.csv scripts/capture_public_spending.py
          git -c core.whitespace=blank-at-eol,blank-at-eof,space-before-tab,cr-at-eol diff --cached --check
          git commit -m 'Build 44 native public spending pages from verified source snapshot'
          askpass="$RUNNER_TEMP/wmm-askpass.sh"
          cat > "$askpass" <<'ASKPASS'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$GITHUB_TOKEN" ;;
          esac
          ASKPASS
          chmod 700 "$askpass"
          GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 git push origin HEAD:feat/wmm-native-explorer-20261113
          rm -f "$askpass"
          git rev-parse HEAD
