<section class="earnings-section" id="earnings-latest-release">
  <div class="earnings-heading"><h2>{{ release.period }} results</h2><span>Period ended {{ release.ended }}</span></div>
  <p>{{ release.summary }}</p>
  <p class="earnings-directory-source"><a href="{{ release.source }}" rel="noopener">Read the company’s results</a> · Published <time datetime="{{ release.published }}">{{ release.published }}</time></p>
</section>
