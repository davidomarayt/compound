{% from '_wmm_explorer_context.html' import wmm_data, sector, programme, years, is_method with context %}
<meta property="og:type" content="website"><meta property="og:title" content="{{ page.title }}"><meta property="og:description" content="{{ page.meta_description }}"><meta property="og:url" content="{{ site_url }}{{ page.url }}"><meta property="og:site_name" content="Compound"><meta name="twitter:card" content="summary">
<script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"{{ 'WebPage' if programme or is_method else 'CollectionPage' }}","@id":{{ (site_url ~ page.url ~ '#page')|tojson }},"name":{{ page.title|tojson }},"description":{{ page.meta_description|tojson }},"url":{{ (site_url ~ page.url)|tojson }},"inLanguage":"en-IE","isPartOf":{"@id":"{{ site_url }}/#website"},"dateModified":"{{ wmm_data.updated }}","publisher":{"@id":"{{ site_url }}/#organization"}},{"@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"name":"Compound","item":"{{ site_url }}/"},{"@type":"ListItem","position":2,"name":"Where's My Money?","item":"{{ site_url }}/wheres-my-money/"},{"@type":"ListItem","position":3,"name":{{ ('Methodology' if is_method else 'Public spending')|tojson }},"item":{{ (site_url ~ ('/wheres-my-money/methodology/' if is_method else '/wheres-my-money/spending/'))|tojson }}}{% if sector %},{"@type":"ListItem","position":4,"name":{{ sector.name|tojson }},"item":{{ (site_url ~ sector.url)|tojson }}}{% endif %}{% if programme %},{"@type":"ListItem","position":5,"name":{{ programme.name|tojson }},"item":{{ (site_url ~ programme.url)|tojson }}}{% endif %}]}{% if not is_method %},{"@type":"Dataset","name":{{ (page.title ~ ' — published expenditure series')|tojson }},"description":"Published euro amounts, reproduced and organised by Compound. 2026 figures are estimates, not actual expenditure. See the page methodology for scope and missing detail.","url":{{ (site_url ~ page.url)|tojson }},"temporalCoverage":"{{ years[0] }}/2026","dateModified":"{{ wmm_data.updated }}","isAccessibleForFree":true,"citation":{{ (sector.source if sector else wmm_data.source)|tojson }},"variableMeasured":"Gross public expenditure in euro","measurementTechnique":"Transcription of published official chart values; no estimated allocation of missing component lines"}{% endif %}]}</script>
