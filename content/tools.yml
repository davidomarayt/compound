    formula: lifetime_cost
    summary: Project the cumulative cost of your current lifestyle from today to a chosen age, including housing, food, transport, travel, childcare and recurring major purchases.
    meta_description: Lifetime cost calculator Ireland. Project housing, food, transport, childcare, travel and other spending from your current age to a chosen age with inflation.
    updated: 2026-09-22
    fields:
      - {id: current_age, label: Current age, type: number, default: 30, min: 18, max: 100, step: 1, section_start: Time horizon}
      - {id: end_age, label: Project spending to age, type: number, default: 80, min: 19, max: 110, step: 1}
      - {id: inflation, label: Annual spending inflation assumption, type: number, suffix: "%", default: 2.5, min: -5, max: 15, step: 0.1}
      - {id: housing_monthly, label: Housing cost per month today, type: number, prefix: "€", default: 1800, min: 0, step: 50, section_start: Housing}
      - {id: housing_until, label: Current housing cost continues until age, type: number, default: 65, min: 18, max: 110, step: 1}
      - {id: food_monthly, label: Groceries / household essentials per month, type: number, prefix: "€", default: 700, min: 0, step: 25, section_start: Recurring household spending}
      - {id: utilities_monthly, label: Utilities / home services per month, type: number, prefix: "€", default: 350, min: 0, step: 25}
      - {id: transport_monthly, label: Transport running cost per month, type: number, prefix: "€", default: 500, min: 0, step: 25}
      - {id: leisure_monthly, label: Leisure, eating out and subscriptions per month, type: number, prefix: "€", default: 500, min: 0, step: 25}
      - {id: travel_annual, label: Holidays / travel per year, type: number, prefix: "€", default: 4000, min: 0, step: 100}
      - {id: insurance_health_annual, label: Insurance and health costs per year, type: number, prefix: "€", default: 3500, min: 0, step: 100}
      - {id: childcare_annual, label: Net childcare / child-related recurring cost per year today, type: number, prefix: "€", default: 0, min: 0, step: 100, section_start: Childcare}
      - {id: childcare_years, label: Years that childcare / child cost continues, type: number, default: 0, min: 0, max: 30, step: 1}
      - {id: major_purchase, label: Recurring major purchase cost today (for example replacement car), type: number, prefix: "€", default: 25000, min: 0, step: 500, section_start: Major purchases}
      - {id: major_interval, label: Years between major purchases, type: number, default: 8, min: 1, max: 40, step: 1}
      - {id: other_monthly, label: Other recurring spending per month, type: number, prefix: "€", default: 300, min: 0, step: 25}
    results:
      - {id: years, label: Years modelled}
      - {id: today_annual, label: Current annual lifestyle cost}
      - {id: lifetime_nominal, label: Total projected cash spending}
      - {id: lifetime_today_money, label: Equivalent total at today's prices}
      - {id: housing_total, label: Projected housing spend}
      - {id: major_total, label: Projected recurring major purchases}
    guide: |
      ## A lifetime cost is a planning lens, not a bill

      This calculator asks what your current lifestyle could cost if broad spending patterns continued from your current age to the age you choose. Recurring expenses rise with the inflation assumption, while housing can be stopped at a chosen age and childcare can be limited to a chosen number of years.

      “Projected cash spending” is the sum of future inflated euro amounts. “Today's-money spending” keeps each category at today's price level so you can see the underlying volume of lifestyle spending without inflation.

      ## Why this can be useful

      A €500 monthly decision can look small next to a salary, but over 40 or 50 years it becomes a major lifetime allocation. The same applies to cars, housing, travel and recurring subscriptions.

      The chart shows cumulative cash spending by age. Use the tool to compare lifestyles rather than to forecast your exact future. It deliberately does not assume investment returns, taxes, inheritance, State Pension or salary growth.

      For context, the CSO's 2022–2023 Household Budget Survey estimated average weekly household expenditure at €1,007.47, but spending varied materially by income, tenure, household type and location. The calculator therefore uses your own inputs rather than treating the national average as a target.

      The inflation field is also an editable scenario assumption. Ireland's CPI was 3.7% higher year-on-year in August 2026, while the Eurosystem's medium-term price-stability objective is 2% HICP inflation. Neither figure is a forecast for the next several decades.
    sources:
      - {title: "CSO — Household Budget Survey 2022–2023 key findings", url: "https://www.cso.ie/en/releasesandpublications/ep/p-hbs/householdbudgetsurvey2022-2023/keyfindings/"}
      - {title: "CSO — Consumer Price Index August 2026", url: "https://www.cso.ie/en/releasesandpublications/ep/p-cpi/consumerpriceindexaugust2026/"}
      - {title: "Central Bank of Ireland — Eurosystem price-stability objective", url: "https://www.centralbank.ie/monetary-policy/policy-setting"}
      - {title: "CCPC — Building your personal budget plan", url: "https://www.ccpc.ie/manage-your-money/day-to-day-finances/budgeting-resources/building-your-personal-budget-plan"}


  - slug: car-finance-calculator
    title: Car Finance Calculator Ireland — Loan vs PCP vs Hire Purchase
    category: EV & Motoring
    formula: car_finance
    summary: Compare a personal car loan, hire purchase and PCP using the same car price, deposit and finance assumptions, with an optional advanced mode for fees, mileage and end-value equity.
    meta_description: Car finance calculator Ireland comparing personal loan vs hire purchase vs PCP. Compare monthly payments, balloon payments, total cost, ownership and advanced PCP mileage/equity scenarios.
    updated: 2026-09-22
    basic_note: "Basic mode compares loan, HP and PCP using the same car price, deposit and comparison term. Fees and end-of-PCP assumptions stay at the stated defaults."
    advanced_note: "Advanced mode lets you use the actual term and fees for each quote, plus PCP mileage, condition charges and an estimated end value."
    fields:
      - {id: car_price, label: Car cash price, type: number, prefix: "€", default: 40000, min: 0, step: 500, section_start: Core comparison}
      - {id: deposit, label: Cash deposit / trade-in used upfront, type: number, prefix: "€", default: 8000, min: 0, step: 500}
      - {id: term_years, label: Comparison term, type: number, suffix: years, default: 4, min: 1, max: 10, step: 1}
      - {id: loan_rate, label: Personal car-loan annual rate, type: number, suffix: "%", default: 6.5, min: 0, max: 30, step: 0.1}
      - {id: hp_rate, label: Hire Purchase annual rate, type: number, suffix: "%", default: 6.9, min: 0, max: 30, step: 0.1}
      - {id: pcp_rate, label: PCP annual rate, type: number, suffix: "%", default: 4.9, min: 0, max: 30, step: 0.1}
      - {id: pcp_balloon, label: PCP final balloon / GMFV, type: number, prefix: "€", default: 18000, min: 0, step: 500, help: "The amount left to pay at the end if you want to own the car."}

      - {id: loan_term_years, label: Personal-loan term, type: number, suffix: years, default: 4, min: 1, max: 10, step: 1, advanced: true, section_start: Advanced quote details}
      - {id: hp_term_years, label: HP term, type: number, suffix: years, default: 4, min: 1, max: 10, step: 1, advanced: true}
      - {id: pcp_term_years, label: PCP term, type: number, suffix: years, default: 3, min: 1, max: 7, step: 1, advanced: true}
      - {id: loan_fee, label: Personal-loan setup / admin fees, type: number, prefix: "€", default: 0, min: 0, step: 25, advanced: true}
      - {id: hp_doc_fee, label: HP documentation / setup fee, type: number, prefix: "€", default: 75, min: 0, step: 25, advanced: true}
      - {id: hp_completion_fee, label: HP completion / option-to-purchase fee, type: number, prefix: "€", default: 75, min: 0, step: 25, advanced: true}
      - {id: pcp_doc_fee, label: PCP documentation / setup fee, type: number, prefix: "€", default: 75, min: 0, step: 25, advanced: true}
      - {id: pcp_completion_fee, label: PCP fee if you buy the car at the end, type: number, prefix: "€", default: 75, min: 0, step: 25, advanced: true}
      - {id: estimated_value, label: Estimated car value at the end of the PCP term, type: number, prefix: "€", default: 21000, min: 0, step: 500, advanced: true, section_start: PCP end-of-term assumptions, help: "Used to estimate PCP equity versus the GMFV. It is an assumption, not a guaranteed resale value."}
      - {id: annual_mileage_limit, label: PCP annual mileage allowance, type: number, suffix: "km/year", default: 15000, min: 0, step: 1000, advanced: true}
      - {id: expected_annual_mileage, label: Your expected annual mileage, type: number, suffix: "km/year", default: 18000, min: 0, step: 1000, advanced: true}
      - {id: excess_km_charge, label: Assumed PCP excess-mileage charge, type: number, prefix: "€", suffix: "/km", default: 0.10, min: 0, step: 0.01, advanced: true}
      - {id: condition_charge, label: Assumed end-of-PCP condition / damage charge, type: number, prefix: "€", default: 0, min: 0, step: 100, advanced: true}

    results:
      - {id: loan_monthly, label: Personal loan monthly repayment}
      - {id: hp_monthly, label: Hire Purchase monthly repayment}
      - {id: pcp_monthly, label: PCP monthly repayment}
      - {id: loan_total, label: Personal loan total paid}
      - {id: hp_total, label: HP total paid to own}
      - {id: pcp_keep_total, label: PCP total paid if you keep the car}
      - {id: pcp_return_total, label: PCP total paid if you return the car}
      - {id: pcp_equity, label: Estimated PCP equity versus balloon}
      - {id: ownership_summary, label: Ownership at the end}

    guide: |
      ## Loan vs HP vs PCP: what do they actually mean?

      **Personal car loan:** you borrow money from a bank, credit union or other lender and use it to buy the car. You normally own the car from the day you buy it. The loan exists separately from the vehicle.

      **Hire Purchase (HP):** the finance company is the legal owner while the agreement is running. You make the agreed deposit and repayments and become the legal owner after the final payment is made. Traditional HP normally pays down most or all of the financed balance through the regular instalments, although some HP agreements can include a final payment.

      **Personal Contract Plan (PCP):** PCP is similar to HP but deliberately leaves a large amount unpaid until the end. That final amount is often called the **balloon payment** or **Guaranteed Minimum Future Value (GMFV)**. Monthly repayments can therefore look lower even though a substantial amount remains outstanding.

      ## Basic calculation

      The default view asks only for the core numbers:

      - car cash price;
      - deposit or trade-in used upfront;
      - one comparison term;
      - the annual rate for each finance type; and
      - the PCP balloon / GMFV.

      Compound then estimates the monthly payments and the total amount paid if you ultimately own the vehicle.

      For a like-for-like Basic comparison, the same deposit and term are applied to all three options. The personal loan and HP use standard amortising-payment mathematics. PCP uses a balloon-payment calculation where the GMFV remains outstanding at the end.

      ## Advanced calculation

      Switch to **Advanced calculation** when you have actual dealer/lender quotations. You can then use separate terms for the personal loan, HP and PCP and include setup, documentation and completion fees.

      Advanced mode also lets you model the part of PCP that is often overlooked: what happens to the car at the end.

      You can enter:

      - your expected end-of-term car value;
      - annual PCP mileage allowance;
      - expected mileage;
      - an assumed excess-mileage charge; and
      - an assumed condition/damage charge.

      If estimated market value is above the balloon, the difference is shown as **potential equity**. If the car is worth less than the balloon, the calculator shows negative equity versus buying the car outright. The actual trade-in value is determined by the market and vehicle condition, not by this calculator.

      ## What happens at the end of a PCP?

      CCPC describes three common choices:

      1. **Pay the balloon and keep the car.** You then become the owner.
      2. **Return the car.** You generally avoid the balloon, but mileage, condition and other contractual requirements can produce charges.
      3. **Trade it into another deal.** If the car is worth more than the balloon, that difference may provide equity towards another car. If it is worth less, there may be no equity.

      This is why the calculator shows both **PCP total if kept** and **PCP total if returned** instead of pretending there is one single PCP cost.

      ## Ownership matters

      With a personal loan you normally own the vehicle from the start. With HP and PCP the finance company remains the legal owner until the final required payment is made.

      HP and PCP agreements also have consumer-credit rights that do not work in exactly the same way as a personal loan. The CCPC explains the **half rule**, which can allow a consumer to end an HP/PCP agreement early by returning the car while limiting liability to half the hire-purchase price, subject to the agreement, arrears and damage obligations.

      ## Why monthly payment can be misleading

      A PCP can have the lowest monthly repayment simply because a large part of the purchase price has been postponed into the balloon. That is not the same thing as being the cheapest way to own the car.

      The graph therefore compares **cumulative cash paid if the vehicle is ultimately kept**. For PCP, the line jumps at the end when the balloon is paid.

      ## Important calculation limitation

      This is a comparison model rather than a lender quotation. Real APR calculations can incorporate fee timing and other contractual details. If a mandatory fee is already reflected in an APR quoted by the lender, entering it again in Advanced mode can overstate the total cost.

      Always compare the lender's own **total amount payable**, fees, balloon/GMFV, mileage conditions and early-termination terms before signing an agreement.

    sources:
      - {title: "CCPC — Paying for your car: loan, HP and PCP", url: "https://www.ccpc.ie/manage-your-money/borrowing-money/car-loans-and-car-finance/paying-for-your-car"}
      - {title: "CCPC — Hire Purchase explained", url: "https://www.ccpc.ie/manage-your-money/borrowing-money/car-loans-and-car-finance/hire-purchase"}
      - {title: "CCPC — Personal Contract Plan explained", url: "https://www.ccpc.ie/manage-your-money/borrowing-money/car-loans-and-car-finance/personal-contract-plan"}
      - {title: "CCPC — Problems making car repayments and the half rule", url: "https://www.ccpc.ie/manage-your-money/managing-debt/problems-making-car-repayments"}


  - slug: nutrition-needs-calculator
    title: Nutrition Needs Calculator — Energy, Protein & Macros
    category: Health
    formula: nutrition_needs
    summary: Estimate resting energy, activity-adjusted maintenance needs, protein and an evidence-grounded macro illustration in one calculator.
    meta_description: Nutrition needs calculator using Mifflin-St Jeor, EFSA physical activity levels and protein reference values. Estimate resting energy, maintenance calories, protein and macros.
    updated: 2026-09-22
    fields:
      - id: sex
        label: Sex used by the Mifflin–St Jeor equation
        type: select
        default: male
        options:
          - {value: male, label: Male}
          - {value: female, label: Female}
        help: "The published equation uses different constants for male and female adults. This is a limitation of the equation, not a complete description of an individual."
      - {id: age, label: Age, type: number, suffix: years, default: 35, min: 18, max: 80, step: 1}
      - {id: weight, label: Weight, type: number, suffix: kg, default: 75, min: 30, max: 300, step: 0.1}
      - {id: height, label: Height, type: number, suffix: cm, default: 175, min: 120, max: 230, step: 0.1}
      - id: activity
        label: Physical activity level (PAL)
        type: select
        default: "1.6"
        options:
          - {value: "1.4", label: Low active / sedentary — PAL 1.4}
          - {value: "1.6", label: Moderately active — PAL 1.6}
          - {value: "1.8", label: Active — PAL 1.8}
          - {value: "2.0", label: Very active — PAL 2.0}
        help: "EFSA uses these PAL values when illustrating adult energy requirements. Self-selecting an activity category is still approximate."
      - id: energy_scenario
        label: Energy scenario to display
        type: select
        default: maintain
        options:
          - {value: maintain, label: Estimated maintenance energy}
          - {value: lower10, label: Illustrative 10% below maintenance — not a prescribed deficit}
          - {value: higher10, label: Illustrative 10% above maintenance — not a prescribed surplus}
      - id: protein_context
        section_start: Protein & macros
        label: Protein context
        type: select
        default: general
        options:
          - {value: general, label: General adult reference intake}
          - {value: resistance, label: Regular resistance-training context}
        help: "The general reference uses EFSA's 0.83 g/kg population reference intake. The resistance-training option uses approximately 1.6 g/kg as an evidence point from a large meta-analysis, not a personalised prescription."
    results:
      - {id: resting, label: Estimated resting energy expenditure}
      - {id: maintenance, label: Estimated maintenance energy}
      - {id: target, label: Selected energy scenario}
      - {id: protein, label: Protein reference / evidence point}
      - {id: fat, label: Illustrative fat at 30% of energy}
      - {id: carbs, label: Carbohydrate remainder in this illustration}
      - {id: fibre, label: WHO adult dietary fibre reference}
    guide: |
      ## What this calculator is — and is not

      This tool combines several related nutrition calculations on one page so you do not need separate BMR, TDEE, protein and macro calculators.

      It is designed for **generally healthy adults** as an educational planning tool. It is not intended for pregnancy, breastfeeding, under-18s, people with an eating disorder, or people who need medical nutrition therapy. In those situations, energy and nutrient needs should be assessed appropriately by a clinician or dietitian.

      ## Resting energy: Mifflin–St Jeor

      The resting-energy estimate uses the **Mifflin–St Jeor equation**, published in the *American Journal of Clinical Nutrition* in 1990. A systematic review comparing commonly used equations found Mifflin–St Jeor more likely than the alternatives assessed to estimate measured resting metabolic rate within 10% in non-obese and obese adults, while also emphasising meaningful individual errors.

      That uncertainty matters. A calculated value such as 1,650 kcal/day should be read as an estimate, not as a measurement of your metabolism. **Indirect calorimetry** is the reference method when an accurate clinical measurement is needed.

      ## From resting energy to maintenance energy

      Total energy needs depend heavily on movement and activity. EFSA describes Physical Activity Level (PAL) as total daily energy use relative to resting energy and uses PAL values such as **1.4, 1.6, 1.8 and 2.0** to illustrate low-active through very-active adult lifestyles.

      Compound multiplies the resting-energy estimate by the PAL you select. The weakest part of this calculation may be the activity selection itself: two people who both choose “moderately active” can have quite different true energy expenditure.

      ## Why the ±10% scenarios are labelled illustrative

      The 10% lower and higher options are **mathematical scenarios**, not weight-loss or weight-gain prescriptions. Appropriate energy intake can depend on health, training, body composition, medications, pregnancy status, previous dieting and other factors this calculator does not know.

      ## Protein: general health versus resistance training

      EFSA's adult Population Reference Intake for protein is **0.83 g per kg of body weight per day**. This is intended to cover the needs of the large majority of generally healthy adults consuming a mixed European diet.

      For people doing resistance training, a 2018 systematic review, meta-analysis and meta-regression found that increases in fat-free mass with protein supplementation during resistance training plateaued at around **1.62 g/kg/day**, with the confidence interval extending higher. Compound therefore uses **1.6 g/kg/day as an evidence point** in the resistance-training option. It should not be interpreted as a minimum requirement for every gym user or proof that more protein is always better.

      ## Does protein timing matter?

      Total daily protein intake appears more important than treating a tiny post-workout window as mandatory. A 2025 meta-analysis directly comparing protein consumed before versus after exercise found no important difference in exercise-induced changes in lean body mass. A protein-containing meal around training is sensible, but the calculator does not pretend minute-by-minute timing can be reduced to one superior rule.

      ## The macro illustration

      Protein contributes approximately 4 kcal per gram. For the remaining macro illustration, Compound shows total fat at **30% of the selected energy figure**, consistent with WHO guidance that adults limit total fat intake to 30% of total energy or less for prevention of unhealthy weight gain. Carbohydrate is then the mathematical remainder after protein and fat.

      This is not a claim that every person should eat exactly 30% fat or that macro percentages determine diet quality. WHO emphasises **quality as well as quantity**: carbohydrate should come primarily from whole grains, vegetables, fruits and pulses; adults should consume at least **25 g/day of naturally occurring dietary fibre** and at least **400 g/day of fruit and vegetables**.

      ## Use the result as a range of questions, not a precise prescription

      Useful follow-up questions include:

      - Does your actual body weight remain broadly stable around the estimated maintenance intake over several weeks?
      - Is your chosen activity level realistic?
      - Are you meeting protein needs through a varied diet?
      - Are fibre, fruit, vegetables and food quality getting lost behind the macro numbers?
      - Are you using the tool in a situation where professional nutrition advice would be safer?

      The more precise the number looks, the easier it is to forget the uncertainty behind it. The purpose of the calculator is to make the assumptions visible.

    sources:
      - {title: "Mifflin et al. 1990 — A new predictive equation for resting energy expenditure", url: "https://pubmed.ncbi.nlm.nih.gov/2305711/"}
      - {title: "Frankenfield et al. — systematic review of resting metabolic rate prediction equations", url: "https://pubmed.ncbi.nlm.nih.gov/15883556/"}
      - {title: "EFSA — Dietary Reference Values and Physical Activity Level", url: "https://www.efsa.europa.eu/en/topics/topic/dietary-reference-values"}
      - {title: "EFSA — adult protein Population Reference Intake", url: "https://www.efsa.europa.eu/en/press/news/120209"}
      - {title: "Morton et al. 2018 — protein supplementation and resistance training meta-analysis", url: "https://pubmed.ncbi.nlm.nih.gov/28698222/"}
      - {title: "Casuso and Goossens 2025 — protein timing before versus after exercise meta-analysis", url: "https://pubmed.ncbi.nlm.nih.gov/40647175/"}
      - {title: "WHO — updated guidance on fats and carbohydrates", url: "https://www.who.int/news/item/17-07-2023-who-updates-guidelines-on-fats-and-carbohydrates"}

  - slug: pregnancy-due-date-calculator
    title: Pregnancy Due Date & Timeline Calculator Ireland
    category: Family & Life Planning
    formula: pregnancy_timeline
    summary: Estimate a pregnancy due date, gestational age, trimester and key timeline dates from the last menstrual period or a clinician-assigned due date.
    meta_description: Pregnancy due date calculator Ireland. Estimate gestational age, trimester, conception date and pregnancy milestones, with HSE and obstetric dating guidance.
    updated: 2026-09-22
    fields:
      - id: lmp
        label: First day of your last menstrual period (LMP)
        type: date
        optional: true
        help: "If you do not have an assigned due date from your maternity team, the calculator uses the conventional 280-day estimate from LMP."
      - id: assigned_due_date
        label: Due date assigned by your clinician or dating scan (optional)
        type: date
        optional: true
        help: "If entered, this takes priority over the LMP calculation. First-trimester ultrasound is more accurate for establishing or confirming gestational age than LMP alone."
    results:
      - {id: due_date, label: Estimated / assigned due date}
      - {id: gestational_age, label: Gestational age today}
      - {id: trimester, label: Trimester today}
      - {id: conception_estimate, label: Approximate conception date from dating convention}
      - {id: week12, label: 12-week point}
      - {id: anatomy_window, label: HSE fetal anatomy scan window}
      - {id: week37, label: 37-week point}
      - {id: week42, label: 42-week point}
    guide: |
      ## How pregnancy dating works

      Pregnancy is conventionally dated from the **first day of the last menstrual period (LMP)** rather than from the date of conception. The standard LMP calculation assumes a pregnancy length of **280 days, or 40 weeks**.

      That convention also assumes a regular 28-day menstrual cycle with ovulation around day 14. Real cycles and ovulation dates vary, and people may not recall the LMP exactly. That is why a calendar calculation is an estimate rather than a clinical measurement.

      ## Ultrasound dating is more accurate early in pregnancy

      The American College of Obstetricians and Gynecologists, together with the American Institute of Ultrasound in Medicine and the Society for Maternal–Fetal Medicine, states that **first-trimester ultrasound up to 13 weeks and 6 days is the most accurate method to establish or confirm gestational age**. Crown–rump-length dating in this period is typically accurate to about **±5–7 days**.

      HSE says all pregnant women in Ireland are offered a dating scan and that this should be done **before 15 weeks**. The standard LMP method assumes a 28-day cycle with ovulation around day 14, so later or earlier ovulation, irregular cycles or uncertain menstrual dates can make the scan and LMP estimates differ.

      If your maternity team has already assigned a due date from the clinical record or dating scan, enter that in the optional field. Compound then uses that date for the timeline rather than trying to override it with an LMP calculation. Once an EDD has been established, later scans should not be used casually to keep changing the date because later fetal size increasingly reflects growth as well as gestational age.

      The HSE's own pregnancy calculator similarly describes its result as an estimate based on a 40-week pregnancy. ACOG notes that only about **1 in 20 women give birth on the exact estimated due date**, so the EDD should be understood as a clinical timeline anchor rather than a prediction of the exact birth day.

      ## What the conception date means

      The conception date displayed here is **not a claim about the exact day fertilisation occurred**. It is simply the date 266 days before the due date — equivalent to approximately two weeks after LMP in the conventional 28-day model.

      Ovulation varies, sperm can survive for several days, and pregnancy dating is deliberately based on gestational age rather than an attempt to identify a precise conception date.

      ## Timeline milestones

      The tool shows calendar points that are useful for orientation:

      - **12 weeks** — a simple gestational milestone, not a guaranteed appointment date.
      - **18 to 22 weeks** — the HSE says the fetal anatomy/anomaly scan is usually offered in this window.
      - **37 weeks** — the beginning of the early-term period in common obstetric terminology.
      - **40 weeks** — the estimated due date.
      - **42 weeks** — a calendar milestone two weeks after the due date.

      Your actual appointments and management should follow your maternity team's plan, not a website timeline.

      ## Important limitations

      This calculator cannot assess pregnancy viability, fetal growth, scan findings, bleeding, pain, reduced movements or any other clinical concern. A due date is also not a prediction of the exact day a baby will be born.

      If the dates here differ from the dates given by your maternity team, use the dates in your clinical record and ask your midwife, GP or obstetric team if you are unsure.

    sources:
      - {title: "HSE — Pregnancy due date calculator", url: "https://www2.hse.ie/pregnancy-birth/baby-development-pregnancy-stages/stages/due-date-calculator/"}
      - {title: "HSE — Dating scan, offered before 15 weeks", url: "https://www2.hse.ie/pregnancy-birth/scans-tests/ultrasound-scans/dating-scan/"}
      - {title: "HSE — Fetal anatomy scan, usually 18 to 22 weeks", url: "https://www2.hse.ie/pregnancy-birth/scans-tests/ultrasound-scans/fetal-anatomy-scan/"}
      - {title: "ACOG/AIUM/SMFM — Methods for Estimating the Due Date", url: "https://www.acog.org/clinical/clinical-guidance/committee-opinion/articles/2017/05/methods-for-estimating-the-due-date"}
      - {title: "ACOG — How Your Fetus Grows During Pregnancy", url: "https://www.acog.org/womens-health/faqs/how-your-fetus-grows-during-pregnancy"}

  - slug: alcohol-units-calories-cost-calculator
    title: Alcohol Standard Drinks, Calories & Cost Calculator Ireland
    category: Health
    formula: alcohol_ireland
    summary: Convert common drinks into Irish standard drinks, grams of alcohol, alcohol-derived calories and annual spending, then model a reduction scenario.
    meta_description: Alcohol calculator Ireland. Estimate Irish standard drinks, grams of alcohol, alcohol-derived calories, annual spend and savings from drinking less.
    updated: 2026-09-22
    fields:
      - id: guideline_group
        label: Optional comparison with current HSE weekly low-risk guideline
        type: select
        default: none
        options:
          - {value: none, label: Do not compare}
          - {value: woman, label: HSE guideline for women}
          - {value: man, label: HSE guideline for men}
      - {id: beer_pints, label: Pints of beer / stout / cider per week, type: number, default: 2, min: 0, step: 0.5, section_start: Beer / cider}
      - {id: beer_abv, label: Beer / stout / cider strength, type: number, suffix: "% ABV", default: 4.5, min: 0, max: 20, step: 0.1}
      - {id: wine_glasses, label: Glasses of wine per week, type: number, default: 0, min: 0, step: 0.5, section_start: Wine}
      - {id: wine_ml, label: Wine glass size, type: number, suffix: ml, default: 175, min: 25, max: 500, step: 25}
      - {id: wine_abv, label: Wine strength, type: number, suffix: "% ABV", default: 12.5, min: 0, max: 30, step: 0.1}
      - {id: spirits, label: Spirit measures per week, type: number, default: 0, min: 0, step: 0.5, section_start: Spirits}
      - {id: spirit_ml, label: Spirit measure size, type: number, suffix: ml, default: 35.5, min: 10, max: 200, step: 0.5}
      - {id: spirit_abv, label: Spirit strength, type: number, suffix: "% ABV", default: 40, min: 0, max: 95, step: 0.1}
      - {id: cans, label: Large cans / bottles per week, type: number, default: 0, min: 0, step: 0.5, section_start: Cans / bottles}
      - {id: can_ml, label: Can / bottle size, type: number, suffix: ml, default: 500, min: 50, max: 2000, step: 10}
      - {id: can_abv, label: Can / bottle strength, type: number, suffix: "% ABV", default: 4.3, min: 0, max: 20, step: 0.1}
      - {id: weekly_spend, label: What you spend on alcohol in a typical week, type: number, prefix: "€", default: 30, min: 0, step: 1, section_start: Cost & reduction}
      - {id: reduction_pct, label: Model reducing intake and spend by, type: number, suffix: "%", default: 25, min: 0, max: 100, step: 5}
    results:
      - {id: standard_drinks, label: Irish standard drinks per week}
      - {id: grams, label: Pure alcohol per week}
      - {id: guideline, label: HSE guideline comparison}
      - {id: weekly_kcal, label: Calories from alcohol itself per week}
      - {id: annual_kcal, label: Calories from alcohol itself per year}
      - {id: annual_spend, label: Annual alcohol spend at entered amount}
      - {id: reduced_drinks, label: Standard drinks after modelled reduction}
      - {id: annual_saving, label: Annual cash saving from modelled reduction}
    guide: |
      ## Ireland uses a 10 g standard drink

      In Ireland, **one standard drink contains 10 grams of pure alcohol**. That differs from the UK “unit”, which contains 8 grams.

      Compound calculates grams of alcohol from the amount and strength of each drink using the formula in Ireland's Public Health (Alcohol) Act labelling guidance:

      **volume in mL × ABV as a decimal × 0.789 = grams of alcohol**

      The result is then divided by 10 to give Irish standard drinks.

      This is more accurate than assuming “one glass equals one drink”. For example, the HSE notes that a pint of 4.5% beer/stout/cider is roughly **two Irish standard drinks**, while a 100 mL glass of 12.5% wine is roughly one.

      ## Current HSE weekly low-risk guidance

      The HSE currently advises no more than **11 standard drinks per week for women** and **17 for men**, spread across the week, with at least 2–3 alcohol-free days. It also advises not drinking more than **6 standard drinks on any one occasion**.

      The HSE explicitly states that **there is no level of alcohol use that is safe for health** and that drinking less reduces risk. It also notes that the evidence for its weekly low-risk guidelines is under review in 2026.

      This calculator can compare your weekly total with the current guideline if you choose a comparison group. It cannot determine whether your drinking pattern is safe, because it does not know how drinks are distributed across occasions or your individual health circumstances.

      ## What the calorie number means

      Ethanol provides approximately **7 kcal per gram**. The calculator therefore shows the energy supplied by the alcohol itself.

      It deliberately does **not** label that number as the total calories in your drinks. Beer, cider, wine, liqueurs and mixers can contain additional carbohydrate, sugar or other energy. Brand-specific nutrition information is needed for a more complete calorie total.

      ## Irish alcohol labels and the grams figure

      Ireland has legislated for comprehensive alcohol labels that will include the **grams of alcohol** and **energy value** in the product alongside health warnings. The relevant Section 12 labelling requirements are currently scheduled to commence on **3 September 2028**, following the 2025 amendment to the original commencement order.

      When those labels are in force, the grams figure will map directly onto Ireland's standard-drink definition: divide grams of alcohol by 10. For example, 17 g of alcohol is 1.7 Irish standard drinks.

      ## The money calculation is deliberately simple

      Enter what you actually spend in a normal week. The annual figure multiplies that by 52. The reduction scenario then applies the percentage you select to both the entered spend and calculated alcohol amount.

      It is an illustration of what a sustained change would mean over a year, not a prediction that spending or drinking will remain identical every week.

      ## What this calculator does not do

      It does not estimate blood alcohol concentration, tell you whether you can drive, diagnose alcohol dependence or recommend a personalised “safe” amount.

      The HSE warns that even one standard drink can put some people over the legal driving limit. Do not use a drinks calculator to decide whether you are safe to drive.

      The HSE also advises avoiding alcohol during pregnancy. If alcohol is causing problems in your life or you are concerned about your intake, use HSE alcohol supports or speak with a healthcare professional.

      ## Method and limitations

      The calculator converts each entered drink into grams of pure alcohol using volume × ABV × 0.789, then divides the total by 10 to express the result in Irish standard drinks. Alcohol-derived calories are estimated at approximately 7 kcal per gram. The annual spending and reduction scenarios simply scale the weekly figures entered by the user.

      It does not model drinking pattern across individual days, food intake, body size, medicines, pregnancy, liver function, tolerance, blood alcohol concentration or driving fitness. The HSE guideline comparison is population-level guidance rather than a personalised safety assessment.

    sources:
      - {title: "HSE — Weekly low-risk alcohol guidelines and Irish standard drink definition", url: "https://www2.hse.ie/living-well/alcohol/health/improve-your-health/weekly-low-risk-alcohol-guidelines/"}
      - {title: "HSE — Drinks calculator", url: "https://www2.hse.ie/living-well/alcohol/drinks-calculator/"}
      - {title: "HSE — Alcohol, weight and nutrition", url: "https://www2.hse.ie/living-well/alcohol/health/effects-on-your-body/weight-gain/"}
      - {title: "Irish Statute Book — Public Health (Alcohol) Act 2018, section 12 grams-of-alcohol formula", url: "https://www.irishstatutebook.ie/eli/2018/act/24/section/12/enacted/en/html"}
      - {title: "Irish Statute Book — Section 12 labelling commencement moved to 3 September 2028", url: "https://www.irishstatutebook.ie/eli/isbc/2018_24.html"}
      - {title: "HSE — Public Health Alcohol Labelling FAQ", url: "https://www.hse.ie/eng/services/publications/environmentalhealth/public-alcohol-act-section-22-faqs.pdf"}
      - {title: "Schutz 2000 — alcohol provides about 7.1 kcal/g", url: "https://pubmed.ncbi.nlm.nih.gov/11115785/"}
