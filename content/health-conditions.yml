evidence:
  eczema:
  - value: About 10%
    period: Reported by HIQA in 2026
    population: Adults in Ireland
    note: Approximate estimate for atopic dermatitis. HIQA notes that reliable Irish data are scarce.
    source: hiqa_teledermatology
    locator: page 84, Eczema (atopic dermatitis)
    measure: prevalence
  eczema-babies-children:
  - value: About 20%
    period: Reported by HIQA in 2026
    population: Children in Ireland
    note: Approximate estimate for atopic dermatitis. HIQA notes that reliable Irish data are scarce.
    source: hiqa_teledermatology
    locator: page 84, Eczema (atopic dermatitis)
    measure: prevalence
  psoriasis:
  - value: 1.72%
    period: Ireland profile accessed November 2026
    population: All ages in Ireland
    note: Modelled estimate for physician-diagnosed psoriasis. The reported uncertainty range is 0.65% to 4.49%.
    source: psoriasis_atlas
    locator: Overall, physician or dermatologist diagnosed prevalence
    measure: prevalence
  hidradenitis-suppurativa:
  - value: 221 of 15,547 (1.4%)
    period: Six-month study in 2015, reported by HIQA in 2026
    population: Patients seen at four Irish dermatology clinics
    note: Clinic-based proportion. The people attending dermatology clinics differ from the general population.
    source: hiqa_teledermatology
    locator: page 85, Hidradenitis suppurativa
    measure: prevalence
  rosacea:
  - value: 2.7%
    period: 2010 study, reported by HIQA in 2026
    population: Sample of 1,000 workers in Ireland
    note: Study estimate for papulopustular rosacea, the subtype associated with bumps and pustules. HIQA says national prevalence for rosacea is unknown.
    source: hiqa_teledermatology
    locator: page 87, Rosacea
    measure: prevalence
  acne:
  - value: 23.2%
    period: 2021 model estimate, reported by HIQA in 2026
    population: People aged 15 to 19 in Ireland
    note: Global Burden of Disease model estimate. HIQA also reports 14.5% for ages 10 to 14 and 9.1% for ages 20 to 24. These are age-specific estimates.
    source: hiqa_teledermatology
    locator: section on acne
    measure: prevalence
  polio:
