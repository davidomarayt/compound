name: ci
on: [push, pull_request]
# Cancel redundant test runs when multiple content improvements land on the same branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - run: python -m py_compile scripts/news_images.py
      - run: python -m py_compile scripts/earnings.py
      - run: python -m py_compile scripts/earnings_backfill.py
      - run: python -m py_compile scripts/global_earnings_watch.py
      - run: python -m py_compile scripts/sp500_registry.py
      - run: node --check compound/site/static/earnings-directory.js
      - run: node --check compound/site/static/wealth-hub.js
      - run: node --check compound/site/static/tools.js
      - run: node --check compound/site/static/wheres-my-money.js
      - run: node --check compound/site/static/spending-explorer.js
      - run: pytest -q tests/test_spending_votes.py
      - run: node --check compound/site/static/wheres-my-money-ads.js
      - run: node tests/wheres_my_money.cjs
      - run: node --check compound/site/static/mortgage-calculator.js
      - run: node --check compound/site/static/debt-repayment.js
      - run: node tests/tools_arithmetic.cjs
      - run: node tests/solar_funnel_attribution.cjs
      - run: node --check compound/site/static/pia-providers.js
      - run: node tests/pia_provider_fees.cjs

  performance:
    needs: test
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -e .
      - name: Restore incremental article and Discover-image cache
        uses: actions/cache@v4
        with:
          path: .cache/compound-article-html
          key: article-render-audit-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            article-render-audit-v1-${{ runner.os }}-
      - name: Restore verified editorial image cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/news-images
          key: editorial-images-v1-${{ runner.os }}-${{ hashFiles('scripts/news_images.py') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            editorial-images-v1-${{ runner.os }}-${{ hashFiles('scripts/news_images.py') }}-
            editorial-images-v1-${{ runner.os }}-
      - name: Render approved bespoke covers for the performance audit
        run: python scripts/render_editorial_heroes.py
      - name: Attach images to published News stories
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python scripts/news_images.py
      # Persist validated, source-fingerprinted image bytes after a successful pass.
      # Restore-only previously reused an old snapshot indefinitely; each clean
      # article edit could redownload all approved pinned photos from Wikimedia.
      # Never save after a failed image pass or bypass its existing checks.
      - name: Save verified editorial image cache
        uses: actions/cache/save@v4
        with:
          path: .cache/news-images
          key: editorial-images-v1-${{ runner.os }}-${{ hashFiles('scripts/news_images.py') }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Normalise approved private-company archival images
        run: python scripts/normalise_private_company_images.py
      - run: compound build
        env:
          SITE_BASE_URL: https://compound.ie
          PREVIEW_BASE_URL: https://compound.ie
          COMPOUND_AUDIT_MODE: "1"
          COMPOUND_ARTICLE_CACHE_DIR: .cache/compound-article-html
      - name: Validate 12 November private-company static content in audit mode
        run: COMPOUND_AUDIT_MODE=1 python scripts/verify_private_company_publications.py
      - name: Assert published electricity news routes exist
        run: |
          test -s public/news/no-energy-credit-budget-2027-electricity-bills-winter/index.html
          test -s public/news/social-democrats-400-energy-credit-budget-2027/index.html
          grep -Fq 'https://compound.ie/news/no-energy-credit-budget-2027-electricity-bills-winter/' public/news/no-energy-credit-budget-2027-electricity-bills-winter/index.html
          grep -Fq 'was NOT included in Budget 2027' public/news/social-democrats-400-energy-credit-budget-2027/index.html
      # Lighthouse takes ~4 minutes, so it runs once per Dublin day: on the first
      # CI run of the day, and again later only if no run today has passed it yet.
      # The build and content checks above still run on every publish.
      # If the GitHub API can't be read, Lighthouse runs (fail safe).
      - name: Decide whether Lighthouse already passed today (Dublin time)
        id: lighthouse_gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          LIGHTHOUSE_STEP: Run Lighthouse CI against representative mobile pages
        run: |
          set -u
          today=$(TZ=Europe/Dublin date +%F)
          since=$(date -u -d "TZ=\"Europe/Dublin\" $today 00:00" +%Y-%m-%dT%H:%M:%SZ)
          echo "Looking for a passing Lighthouse run since $since (Dublin midnight)"
          found=""
          run_ids=$(gh api -X GET "repos/$REPO/actions/workflows/ci.yml/runs" \
            -f created=">=$since" -f status=success -f per_page=100 \
            --jq '.workflow_runs[].id' 2>/dev/null || true)
          for id in $run_ids; do
            [ "$id" = "${{ github.run_id }}" ] && continue
            hit=$(gh api "repos/$REPO/actions/runs/$id/jobs" --jq \
              '.jobs[] | select(.name == "performance" and .conclusion == "success")
                | .steps[] | select(.name == env.LIGHTHOUSE_STEP and .conclusion == "success")
                | .name' 2>/dev/null || true)
            if [ -n "$hit" ]; then found="$id"; break; fi
          done
          if [ -n "$found" ]; then
            echo "Lighthouse already passed today in run $found; skipping it for this publish."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "No passing Lighthouse run yet today; running it now."
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Run Lighthouse CI against representative mobile pages
        id: lighthouse
        if: steps.lighthouse_gate.outputs.run != 'false'
        continue-on-error: true
        run: npx --yes @lhci/cli@0.14.0 autorun --config=.lighthouserc.json
      - name: Print Lighthouse diagnostics
        if: always() && steps.lighthouse_gate.outputs.run != 'false'
        run: python scripts/lighthouse_diagnostics.py .lighthouseci
      - name: Enforce Lighthouse thresholds
        if: steps.lighthouse.outcome == 'failure'
        run: exit 1
