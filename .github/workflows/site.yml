# Builds the static site from content/ and publishes it to GitHub Pages whenever an article is
# committed to the publishing branch. The bot's DEPLOY_COMMAND does the commit and push; this does
# the rest. Enable once in the repo: Settings -> Pages -> Source: GitHub Actions.
name: site
on:
  push:
    branches: ["claude/clever-babbage-uibieq"]
    paths: ["content/**", "compound/site/**", "scripts/news_images.py", "scripts/render_editorial_heroes.py", "scripts/verify_solar_mobile.py", ".github/workflows/site.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-v2
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - name: Render approved custom editorial covers
        run: python scripts/render_editorial_heroes.py
      - name: Attach images to published News stories
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python scripts/news_images.py
      - name: Verify approved TV licence stock photograph
        run: |
          test -s compound/site/static/images/evergreen/ireland-tv-licence-decline-2026.jpg
          python - <<'PY'
          from PIL import Image
          p = 'compound/site/static/images/evergreen/ireland-tv-licence-decline-2026.jpg'
          with Image.open(p) as img:
              img.verify()
          with Image.open(p) as img:
              assert img.width >= 1000 and img.height >= 500, img.size
          print('Approved TV licence image validated')
          PY
      - run: compound build
        env:
          SITE_BASE_URL: https://compound.ie
          PREVIEW_BASE_URL: https://compound.ie
      - name: Verify bespoke household image is the rendered article cover
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          asset = Path("public/static/images/news/one-income-vs-two-incomes-ireland-2027.jpg")
          assert asset.is_file(), "Missing article-specific hero; generic cover forbidden"
          with Image.open(asset) as image:
              assert image.size == (1600, 900), image.size
              assert image.format == "JPEG"
          page = Path("public/news/one-income-vs-two-incomes-ireland-2027/index.html").read_text()
          assert 'src="/static/images/news/one-income-vs-two-incomes-ireland-2027.jpg"' in page
          assert "Illustration: Compound.ie" in page
          assert 'property="og:image"' in page and 'name="twitter:image"' in page
          assert "wealth-household-income-split-2027.svg" in page
          print("PASS: bespoke cover, comparison graphic and OG/Twitter metadata all rendered")
          PY
      - name: Verify first Mag 7 editorial story, bespoke Roadster cover and social metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          cover = Path("public/static/images/news/tesla-roadster-reveal-investment-case-2026.jpg")
          page = Path("public/news/tesla-roadster-reveal-2026-investor-economics/index.html")
          assert cover.is_file() and cover.stat().st_size > 50000, "Original Roadster illustration missing or empty"
          with Image.open(cover) as im:
              assert im.format == "JPEG" and im.size == (1600, 900)
          assert page.is_file(), "Tesla Roadster research URL missing"
          html = page.read_text(encoding="utf-8")
          assert '/static/images/news/tesla-roadster-reveal-investment-case-2026.jpg' in html
          assert "Original editorial illustration" in html
          assert 'property="og:image"' in html and 'name="twitter:image"' in html
          assert "0.21%" in html and "2.11%" in html
          assert '/stocks/tsla/' in html
          print("PASS: Mag 7 editorial article, independent image, source-backed model and OG/Twitter metadata")
          PY
      - name: Verify Mag 7 and thirteen additional earnings SEO profiles
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "pytest>=8,<10"
          python -m pytest -q tests/test_earnings_seo.py tests/test_one_company_earnings.py tests/test_recent_earnings.py
          python - <<'PY'
          from pathlib import Path
          from compound.site.earnings_seo import ORDER, fiscal_period_display
          from compound.site.earnings_view import load_company_report
          root = Path("public")
          sitemap = (root / "sitemap.xml").read_text()
          hub = (root / "wealth/earnings/index.html").read_text()
          assert 'Explore the latest earnings from leading companies' in hub
          assert hub.count('data-earnings-recent-card') == 10
          assert 'data-earnings-report-search' in hub
          assert '/static/earnings-report-search.js?v=1' in hub
          assert "10 most recently filed reports" in hub
          import json, re
          match = re.search(r'<script type="application/json" data-earnings-report-index>(.*?)</script>', hub, re.S)
          assert match, "Missing searchable verified reports archive"
          index = json.loads(match.group(1))
          assert len(index) > 10, "Archive must include reports beyond ten most recent"
          assert len({entry['url'] for entry in index}) == len(index), "Duplicate company URLs"
          assert index == sorted(index, key=lambda entry: (
              entry["filed"], entry["ended"], entry["ticker"]), reverse=True)
          assert any(entry['ticker'] == 'NVDA' for entry in index)
          assert len(ORDER) == 20
          for ticker in ORDER:
              path = f"stocks/{ticker.lower()}/index.html"
              page = (root / path).read_text()
              assert page.count('<h1>') == 1, ticker
              assert "Earnings Results</h1>" in page, ticker
              report = load_company_report(Path("content"), ticker)
              period = fiscal_period_display(report)
              assert period["display"] in page, ticker
              assert period["subtitle"] in page, ticker
              if period["is_cross_year"]:
                  assert f'{period["display"]} Earnings ({period["month_year"]})' in page, ticker
              else:
                  assert f'{period["display"]} Earnings: Revenue &amp; EPS' in page, ticker
              assert 'name="description"' in page, ticker
              assert "How much did" in page and "Revenue, earnings and EPS growth" in page, ticker
              assert 'dateModified' in page and 'citation' in page, ticker
              assert 'Original SEC report for ' + period["display"] in page, ticker
              assert 'rel="canonical"' in page, ticker
              assert 'name="robots" content="noindex,follow"' not in page, ticker
              assert f'<loc>https://compound.ie/stocks/{ticker.lower()}/</loc>' in sitemap, ticker
              assert f'href="/stocks/{ticker.lower()}/"' in hub, ticker
          assert "Q2 FY2027 (July 2026)" in hub
          assert "Q1 FY2027 (August 2026)" in hub
          print("PASS: All 20 SEC-backed earnings profiles have fiscal and calendar year labels")
          PY
      - name: Validate interactive 360-degree solar direction tool
        shell: bash
        run: |
          set -euo pipefail
          node --check compound/site/static/solar-orientation.js
          node --check compound/site/static/solar-project.js
          node --check compound/site/static/solar-lead-intake.js
          node --check compound/site/static/solar-private-pilot.js
          grep -Fq 'data-solar-project' public/solar/get-quotes/index.html
          grep -Fq 'solar-project.js?v=3' public/solar/get-quotes/index.html
          grep -Fq 'solar-project.css?v=3' public/solar/get-quotes/index.html
          grep -Fq 'data-orientation-embedded' public/solar/get-quotes/index.html
          grep -Fq 'data-sp-face-button="2"' public/solar/get-quotes/index.html
          ! grep -Fq 'data-or="request"' public/solar/get-quotes/index.html
          ! grep -Fq 'data-or="request"' public/solar/roof-direction/index.html
          ! grep -Fq 'photovoltaic-geographic-information-system.ec.europa.eu' public/solar/get-quotes/index.html
          ! grep -Fq 'photovoltaic-geographic-information-system.ec.europa.eu' public/solar/roof-direction/index.html
          ! grep -Fq "window.open(" compound/site/static/solar-orientation.js
          ! grep -Fq "q('request')" compound/site/static/solar-orientation.js
          grep -Fq 'data-or="chart-amount"' public/solar/get-quotes/index.html
          grep -Fq 'data-sor-month="0"' public/solar/get-quotes/index.html
          grep -Fq 'data-sor-month="11"' public/solar/get-quotes/index.html
          grep -Fq 'data-sor-month="0"' public/solar/roof-direction/index.html
          grep -Fq 'data-sor-month="11"' public/solar/roof-direction/index.html
          ! grep -Fq '<canvas data-or="chart"' public/solar/get-quotes/index.html
          ! grep -Fq '<canvas data-or="chart"' public/solar/roof-direction/index.html
          grep -Fq 'class="sol-project-optional"' public/solar/get-quotes/index.html
          grep -Fq 'More roof or access details' public/solar/get-quotes/index.html
          grep -Fq 'Additional system preferences' public/solar/get-quotes/index.html
          grep -Fq 'data-sp="material"' public/solar/get-quotes/index.html
          grep -Fq 'data-sp="demand"' public/solar/get-quotes/index.html
          grep -Fq 'data-sp="battery"' public/solar/get-quotes/index.html
          ! grep -Fq 'data-sp="board"' public/solar/get-quotes/index.html
          ! grep -Fq 'data-sp="eircode"' public/solar/get-quotes/index.html
          grep -Fq '/static/solar-lead-intake.js?v=2' public/solar/get-quotes/index.html
          ! grep -Fq 'sol-project-photo-guide' public/solar/get-quotes/index.html
          ! grep -Fq 'data-sp="photoRoof"' public/solar/get-quotes/index.html


          python - <<'PY'
          from pathlib import Path
          page = Path("public/solar/roof-direction/index.html")
          hub = Path("public/solar/index.html")
          sitemap = Path("public/sitemap.xml")
          checks = {
              "new roof direction route": page.is_file() and page.stat().st_size > 0,
              "page canonical": page.is_file() and "https://compound.ie/solar/roof-direction/" in page.read_text(),
              "interactive compass": page.is_file() and "data-solar-orientation" in page.read_text(),
              "calculator JavaScript": page.is_file() and "/static/solar-orientation.js?v=6" in page.read_text(),
              "calculator stylesheet": page.is_file() and "/static/solar-orientation.css?v=3" in page.read_text(),
              "solar hub links to tool": hub.is_file() and "/solar/roof-direction/" in hub.read_text(),
              "sitemap indexable entry": sitemap.is_file() and "https://compound.ie/solar/roof-direction/" in sitemap.read_text(),
          }
          for label, result in checks.items():
              print(f'{"PASS" if result else "FAIL"}: {label}', flush=True)
          if page.exists():
              html = page.read_text()
              marker = html.find('rel="canonical"')
              print("Rendered canonical excerpt:", html[max(0, marker - 35):marker + 220] if marker >= 0 else "NO CANONICAL TAG", flush=True)
              print("Path in rendered HTML:", '/solar/roof-direction/' in html, flush=True)
          if sitemap.exists():
              print("Sitemap roof entries:", [line.strip() for line in sitemap.read_text().splitlines() if 'roof-direction' in line][:3], flush=True)
          required = ("new roof direction route", "page canonical", "interactive compass",
                      "calculator JavaScript", "calculator stylesheet", "solar hub links to tool",
                      "sitemap indexable entry")
          missing = [key for key in required if not checks[key]]
          if missing:
              raise SystemExit("Missing critical solar page checks: " + ", ".join(missing))
          PY
      - name: Ensure Budget 2027 electricity article and corrected proposal are in the publish artifact
        shell: bash
        run: |
          set -euo pipefail
          test -s public/news/no-energy-credit-budget-2027-electricity-bills-winter/index.html
          test -s public/news/heat-pump-grant-14500-oil-vs-heat-pump-ireland/index.html
          test -s public/news/boiler-scrappage-grant-ireland-2027/index.html
          grep -Fq '€14,500' public/news/heat-pump-grant-14500-oil-vs-heat-pump-ireland/index.html
          grep -Fq '/solar-payback-calculator/' public/news/heat-pump-grant-14500-oil-vs-heat-pump-ireland/index.html
          grep -Fq '€14,500' public/wealth/heat-pumps-ireland/index.html
          grep -Fq 'no longer just a proposal' public/news/boiler-scrappage-grant-ireland-2027/index.html
          test -s public/news/social-democrats-400-energy-credit-budget-2027/index.html
          grep -Fq 'https://compound.ie/news/no-energy-credit-budget-2027-electricity-bills-winter/' public/news/no-energy-credit-budget-2027-electricity-bills-winter/index.html
          grep -Fq 'What Will Electricity Cost This Winter?' public/news/no-energy-credit-budget-2027-electricity-bills-winter/index.html
          grep -Fq 'was NOT included in Budget 2027' public/news/social-democrats-400-energy-credit-budget-2027/index.html
          grep -Fq '/solar-payback-calculator/' public/news/no-energy-credit-budget-2027-electricity-bills-winter/index.html
          grep -Fq '/electricity-cost-calculator/' public/news/no-energy-credit-budget-2027-electricity-bills-winter/index.html
      - name: Verify published 4kW vs 6kW vs 8kW solar guide
        shell: bash
        run: |
          set -euo pipefail
          page=public/wealth/how-many-solar-panels-do-i-need-ireland/index.html
          test -s "$page"
          grep -Fq 'https://compound.ie/wealth/how-many-solar-panels-do-i-need-ireland/' "$page"
          grep -Fq 'How Many Solar Panels Do You Need in Ireland?' "$page"
          grep -Fq '/solar-payback-calculator/' "$page"
          grep -Fq '/solar/compare-quotes/' "$page"
          grep -Fq 'chart-svg' "$page"
          grep -Fq '/static/images/evergreen/how-many-solar-panels-do-i-need-ireland.jpg' "$page"
          test -s public/static/images/evergreen/how-many-solar-panels-do-i-need-ireland.jpg
      - name: Verify new solar quote buying guide and pinned image
        shell: bash
        run: |
          set -euo pipefail
          page=public/wealth/compare-solar-panel-quotes-ireland/index.html
          test -s "$page"
          grep -Fq 'https://compound.ie/wealth/compare-solar-panel-quotes-ireland/' "$page"
          grep -Fq 'How to Compare Solar Panel Quotes' "$page"
          grep -Fq '/solar/compare-quotes/' "$page"
          grep -Fq '/solar/get-quotes/' "$page"
          grep -Fq 'chart-svg' "$page"
          grep -Fq 'compare-solar-panel-quotes-ireland.jpg' "$page"
          test -s public/static/images/evergreen/compare-solar-panel-quotes-ireland.jpg
          grep -Fq '/wealth/compare-solar-panel-quotes-ireland/' public/solar/index.html
          grep -Fq '/wealth/compare-solar-panel-quotes-ireland/' public/solar/compare-quotes/index.html
      - name: Verify east-west orientation article and approved rooftop photo
        shell: bash
        run: |
          set -euo pipefail
          page=public/wealth/east-west-facing-solar-panels-ireland/index.html
          test -s "$page"
          grep -Fq 'https://compound.ie/wealth/east-west-facing-solar-panels-ireland/' "$page"
          grep -Fq 'East- and West-Facing Solar Panels' "$page"
          grep -Fq 'Same roof pitch. Different sunlight.' "$page"
          grep -Fq '/solar-payback-calculator/' "$page"
          grep -Fq '/solar/compare-quotes/' "$page"
          grep -Fq '/wealth/east-west-facing-solar-panels-ireland/' public/solar/index.html
          test -s public/static/images/evergreen/east-west-facing-solar-panels-ireland.jpg
      - name: Verify winter solar evergreen and pinned cover
        shell: bash
        run: |
          set -euo pipefail
          page=public/wealth/solar-panels-winter-ireland/index.html
          test -s "$page"
          grep -Fq 'https://compound.ie/wealth/solar-panels-winter-ireland/' "$page"
          grep -Fq 'Do Solar Panels Work in Winter in Ireland?' "$page"
          grep -Fq 'Electricity produced per month' "$page"
          test "$(grep -o 'class="chart-svg"' "$page" | wc -l)" -ge 2
          grep -Fq 'Monthly' "$page"
          grep -Fq '/solar-payback-calculator/' "$page"
          grep -Fq '/solar/compare-quotes/' "$page"
          grep -Fq '/wealth/solar-panels-winter-ireland/' public/solar/index.html
          grep -Fq 'solar-panels-winter-ireland.jpg' "$page"
          test -s public/static/images/evergreen/solar-panels-winter-ireland.jpg
      - name: Verify homeowner-first Solar Hub conversion funnel
        shell: bash
        run: |
          set -euo pipefail
          hub=public/solar/index.html
          intake=public/solar/get-quotes/index.html
          test -s "$hub"
          test -s "$intake"
          test -s public/static/solar-home.css
          grep -Fq '/static/solar-home.css?v=1' "$hub"
          grep -Fq 'Get your solar project' "$hub"
          grep -Fq 'quote-ready.' "$hub"
          ! grep -Fq 'class="solh-pilot"' "$hub"
          grep -Fq 'up to three companies' "$hub"
          grep -Fq 'How many installers would you like to hear from?' "$intake"
          grep -Fq 'Current availability:' "$intake"
          ! grep -Fq 'Installer introductions are not yet available, and we will seek your separate permission before any future matching' "$intake"
          grep -Fq 'Privacy and 90-day retention details' "$intake"
          grep -Fq 'data-solar-cta="hero"' "$hub"
          grep -Fq 'data-solar-cta="steps"' "$hub"
          grep -Fq 'data-solar-cta="bottom"' "$hub"
          test "$(grep -o 'href="/solar/get-quotes/"' "$hub" | wc -l)" -ge 3
          grep -Fq '/wealth/compare-solar-panel-quotes-ireland/' "$hub"
          grep -Fq 'data-solar-pilot-active="true"' "$intake"
          grep -Fq 'HOMEOWNER ENQUIRIES OPEN' "$intake"
          grep -Fq 'Submit my solar project' "$intake"
          grep -Fq 'Your details remain private to Compound unless you separately agree' "$intake"
          grep -Fq 'quote-ready.' "$hub"
          grep -Fq 'data-solar-leads-active="false"' "$intake"
          grep -Fq 'data-sp-private-pilot-form' "$intake"
          test "$(grep -o 'data-sp-private-pilot-form' "$intake" | wc -l)" -eq 1
          ! grep -Fq 'data-sp-live-request' "$intake"
          ! grep -Fq 'data-sp-quote-form' "$intake"
          ! grep -Fq 'data-sp-quote-consent' "$intake"
          grep -Fq '/static/solar-private-pilot.js?v=4' "$intake"
          grep -Fq '/static/solar-funnel.js?v=20261015-1' "$hub"
          node --check compound/site/static/solar-private-pilot.js
          node --check compound/site/static/solar-funnel.js
      - name: Verify Solar hub pages and client script
        shell: bash
        run: |
          set -euo pipefail
          node --check compound/site/static/solar-hub.js
          node --check compound/site/static/solar-sponsors.js
          node --check compound/site/static/solar-research.js
          for path in solar solar/compare-quotes solar/grants solar/costs solar/installers solar/get-quotes solar/for-installers solar/batteries solar/export-rates solar/equipment; do
            test -s "public/$path/index.html"
            grep -q 'rel="canonical"' "public/$path/index.html"
            grep -q 'solar-hub.css' "public/$path/index.html"
          done
          grep -q 'https://compound.ie/solar/compare-quotes/' public/solar/compare-quotes/index.html
          grep -q '/solar/' public/wealth/index.html
          grep -q 'data-solar-sponsor-form' public/solar/for-installers/index.html
          grep -Fq 'https://formsubmit.co/david@compound.ie' public/solar/for-installers/index.html
          grep -Fq 'data-sponsor-counties' public/solar/for-installers/index.html
          ! grep -q 'action="mailto:' public/solar/for-installers/index.html
          ! grep -q 'Prepare my application email' public/solar/for-installers/index.html
          grep -q 'solar-sponsors.css' public/solar/for-installers/index.html
          ! grep -q 'pagead2.googlesyndication.com' public/solar/for-installers/index.html
          ! grep -q '<ins class="adsbygoogle"' public/solar/for-installers/index.html
          test "$(grep -o 'data-county' content/pages/solar-for-installers.md | wc -l)" -eq 32
          grep -q 'solar-payback-calculator/' public/solar/index.html
          ! grep -R -F 'built and occupied before 2021' public/solar public/solar-payback-calculator public/wealth/solar-panels-ireland public/wealth/solar-panels-vs-battery-ireland
      - name: Check private solar installer portal
        shell: bash
        run: |
          set -euo pipefail
          node --check compound/site/static/solar-installer-portal.js
          test -s public/solar/installer-portal/index.html
          grep -Fq 'noindex,nofollow,noarchive' public/solar/installer-portal/index.html
          grep -Fq 'data-installer-portal' public/solar/installer-portal/index.html
          grep -Fq 'solar-installer-portal.js?v=1' public/solar/installer-portal/index.html
          grep -Fq 'solar-installer-portal.css?v=1' public/solar/installer-portal/index.html
          ! grep -Fq 'pagead2.googlesyndication.com' public/solar/installer-portal/index.html
          ! grep -Fq 'googletagmanager.com' public/solar/installer-portal/index.html
          ! grep -Fq '/solar/installer-portal/' public/sitemap.xml
      - name: Verify homepage specialist hubs and source integrity
        shell: bash
        run: |
          set -euo pipefail
          test -s public/index.html
          test -s public/static/home-hubs.css
          test -s public/static/home-hubs.js
          node --check compound/site/static/home-hubs.js
          grep -Fq 'id="explore-compound"' public/index.html
          grep -Fq '/static/home-hubs.css?v=1' public/index.html
          grep -Fq '/static/home-hubs.js?v=1' public/index.html
          test "$(grep -o 'class="home-hub-card"' public/index.html | wc -l)" -eq 4
          test "$(grep -o 'data-home-hub="' public/index.html | wc -l)" -eq 8
          grep -Fq 'Today’s News' public/index.html
          grep -Fq 'Health, Wealth, Life.' public/index.html
          grep -Fq 'Worth your time.' public/index.html
          for slug in solar solar/get-quotes insurance pia stocks wealth/earnings wealth/how-to-start-investing-in-ireland health-insurance-cost-comparison-calculator; do
            test -s "public/$slug/index.html"
            grep -Fq "href=\"/$slug/\"" public/index.html
          done
          grep -Fq 'homepage_hub_click' public/static/home-hubs.js
          grep -Fq 'compound_analytics_consent' public/static/home-hubs.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  mobile-audit:
    # Independent QA: a Playwright/mobile failure must not leave newly published
    # articles returning 404. Production itself is gated by the build checks above.
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - name: Render approved bespoke covers for mobile QA
        run: python scripts/render_editorial_heroes.py
      - name: Attach required News photos before the QA rebuild
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python scripts/news_images.py
      - run: compound build
        env:
          SITE_BASE_URL: https://compound.ie
          PREVIEW_BASE_URL: https://compound.ie
      - name: Install browser for Solar Hub mobile audit
        run: |
          python -m pip install "playwright==1.55.0"
          python -m playwright install chromium
      - name: Audit homepage specialist hubs at mobile and desktop widths
        run: python scripts/verify_home_hubs_mobile.py
      - name: Audit every solar page at mobile and tablet widths
        run: python scripts/verify_solar_mobile.py
