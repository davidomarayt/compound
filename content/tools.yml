      - {id: real_return, label: Implied annual real return after fee}
      - {id: years, label: Years to target in today’s-money terms}
      - {id: contributions_to_target, label: New contributions made before target, advanced: true}
      - {id: growth_to_target, label: Modelled real investment growth before target, advanced: true}
      - {id: target_3, label: Target at a 3% withdrawal rate, advanced: true}
      - {id: target_35, label: Target at a 3.5% withdrawal rate, advanced: true}
      - {id: target_4, label: Target at a 4% withdrawal rate, advanced: true}
    guide: |
      ## A target, not a promise
      The FIRE number is annual portfolio-funded spending divided by a chosen starting withdrawal rate, plus any separate capital reserve entered in Advanced mode. The accumulation path is shown in today’s money.

      A historical withdrawal-rate study is not a guarantee for an Irish household. Tax, fees, pension access, sequence of returns, retirement length and the timing of State Pension or other income can materially change the amount required.
    sources:
      - {title: "Bengen (1994) — Determining Withdrawal Rates Using Historical Data", url: "https://www.retailinvestor.org/pdf/Bengen1.pdf"}
      - {title: "Pensions Authority — Pension calculator assumptions", url: "https://pensionsauthority.ie/scheme-members-and-prsa-contributors/pension-calculator/assumptions/"}
      - {title: "Revenue — Taxation of pensions", url: "https://www.revenue.ie/en/jobs-and-pensions/pension/private/index.aspx"}

  - slug: retirement-income-calculator
    title: Retirement Income Calculator Ireland
    category: Pensions & Investing
    formula: retirement_income
    summary: Combine portfolio withdrawals with State Pension and other income, then stress-test a deterministic retirement path for fees, inflation and lower returns.
    meta_description: Retirement income calculator Ireland. Estimate gross retirement income and model portfolio sustainability, fees, inflation, target income and a lower-return stress scenario.
    updated: 2026-09-22
    basic_note: "Basic mode shows first-year gross income and a 30-year deterministic path using 4% annual portfolio return, 2% annual withdrawal increases and no explicit annual fee."
    advanced_note: "Advanced mode adds a gross-income target, an annual portfolio fee and a separate lower-return stress scenario. It still does not model year-by-year market volatility."
    fields:
      - {id: pot, label: Pension / investment pot at retirement, type: number, prefix: "€", default: 500000, min: 0, step: 5000, section_start: Portfolio}
      - {id: withdrawal_rate, label: Illustrative starting withdrawal rate, type: number, suffix: "%", default: 4, min: 0, max: 15, step: 0.1}
      - {id: state_pension, label: Annual State Pension or social-welfare income to include, type: number, prefix: "€", default: 0, min: 0, step: 100, section_start: Other retirement income, help: "Leave at €0 unless you expect to receive this income during the period being modelled. Entitlement and rates vary."}
      - {id: other_income, label: Other annual retirement income, type: number, prefix: "€", default: 0, min: 0, step: 100}
      - {id: target_income, label: Optional annual gross-income target, type: number, prefix: "€", default: 0, min: 0, step: 500, advanced: true, section_start: Advanced income check, help: "Used to calculate the portfolio draw and withdrawal rate that would be required after the State Pension and other income entered. Enter 0 to disable."}
      - {id: retirement_years, label: Retirement period to model, type: number, suffix: years, default: 30, min: 1, max: 60, step: 1, advanced: true, section_start: Advanced sustainability assumptions}
      - {id: return_rate, label: Baseline annual portfolio return, type: number, suffix: "%", default: 4, min: -20, max: 30, step: 0.1, advanced: true}
      - {id: stress_return_rate, label: Lower-return stress scenario, type: number, suffix: "%", default: 2, min: -20, max: 30, step: 0.1, advanced: true}
      - {id: annual_fee, label: Annual portfolio fee, type: number, suffix: "%", default: 0, min: 0, max: 10, step: 0.05, advanced: true}
      - {id: inflation_rate, label: Annual increase in portfolio withdrawals, type: number, suffix: "%", default: 2, min: -5, max: 15, step: 0.1, advanced: true}
    results:
      - {id: portfolio_income, label: First-year portfolio withdrawal}
      - {id: annual_income, label: Total first-year gross retirement income}
      - {id: monthly_income, label: Average monthly gross retirement income}
      - {id: ending_pot, label: Portfolio after modelled retirement period}
      - {id: depletion, label: Deterministic portfolio sustainability}
      - {id: target_gap, label: First-year surplus / shortfall versus income target, advanced: true}
      - {id: required_portfolio_income, label: Portfolio income required for target, advanced: true}
      - {id: required_withdrawal_rate, label: Starting withdrawal rate required for target, advanced: true}
      - {id: real_ending_pot, label: Ending portfolio in today’s money, advanced: true}
      - {id: fees_paid, label: Modelled cumulative portfolio fees, advanced: true}
      - {id: stress_ending_pot, label: Ending portfolio in lower-return scenario, advanced: true}
      - {id: stress_depletion, label: Lower-return scenario sustainability, advanced: true}
    guide: |
      ## Gross retirement income and portfolio sustainability are different questions
      The first-year income result adds the portfolio withdrawal, State Pension amount and other income entered. The sustainability model then follows the portfolio withdrawal separately so you can see what a constant-return path would do to the pot.

      Pension and investment income can be taxable. The calculator deliberately reports gross income and does not attempt to reproduce an individual PAYE, USC or PRSI position.
    sources:
      - {title: "Revenue — Taxation of pensions", url: "https://www.revenue.ie/en/jobs-and-pensions/pension/private/index.aspx"}
      - {title: "Revenue — Taxation of Department of Social Protection pensions", url: "https://www.revenue.ie/en/jobs-and-pensions/pension/dsp/index.aspx"}
      - {title: "Revenue — Taxation of retirement lump sums", url: "https://www.revenue.ie/en/jobs-and-pensions/pension/private/retirement-lump-sums.aspx"}
      - {title: "Pensions Authority — Pension calculator assumptions", url: "https://pensionsauthority.ie/scheme-members-and-prsa-contributors/pension-calculator/assumptions/"}

  - slug: pension-projection-calculator
    title: Pension Projection Calculator Ireland
    category: Pensions & Investing
    formula: pension_projection
    summary: Project a pension pot from current savings and contributions, then test contribution growth, annual AVCs, fees, inflation and a lower-return scenario.
    meta_description: Pension projection calculator Ireland. Project a pension pot with employee and employer contributions, annual AVCs, fees, inflation and a lower-return stress scenario.
    updated: 2026-09-22
    basic_note: "Basic mode uses the contribution figures entered plus a 6% gross return, 0.75% annual fee, level monthly contributions and 2% inflation."
    advanced_note: "Advanced mode lets contributions rise annually, adds an annual AVC, changes fees and inflation, and compares the baseline with a lower-return stress scenario."
    fields:
      - {id: age, label: Current age, type: number, default: 35, min: 16, max: 90, step: 1, section_start: Timeline}
      - {id: retirement_age, label: Target retirement age, type: number, default: 65, min: 18, max: 90, step: 1}
      - {id: current, label: Current pension value, type: number, prefix: "€", default: 50000, min: 0, step: 1000, section_start: Pension today}
      - {id: monthly_employee, label: Your monthly contribution, type: number, prefix: "€", default: 400, min: 0, step: 25, section_start: Contributions}
      - {id: monthly_employer, label: Employer monthly contribution, type: number, prefix: "€", default: 300, min: 0, step: 25}
      - {id: contribution_growth, label: Annual growth in monthly contributions, type: number, suffix: "%", default: 0, min: -20, max: 30, step: 0.5, advanced: true}
      - {id: annual_avc, label: Additional employee / personal contribution each year, type: number, prefix: "€", default: 0, min: 0, step: 100, advanced: true, help: "Model an annual AVC or other personal contribution. Check the separate Pension Tax Relief Calculator before assuming it all qualifies for Income Tax relief."}
      - {id: return_rate, label: Baseline annual return before fee, type: number, suffix: "%", default: 6, min: -20, max: 30, step: 0.1, advanced: true, section_start: Investment assumptions}
      - {id: stress_return_rate, label: Lower-return stress scenario before fee, type: number, suffix: "%", default: 3, min: -20, max: 30, step: 0.1, advanced: true}
      - {id: annual_fee, label: Annual fund fee, type: number, suffix: "%", default: 0.75, min: 0, max: 10, step: 0.05, advanced: true}
      - {id: inflation_rate, label: Assumed annual inflation, type: number, suffix: "%", default: 2, min: -5, max: 15, step: 0.1, advanced: true}
    results:
      - {id: years, label: Years to retirement}
      - {id: projected, label: Projected pension pot (nominal)}
      - {id: projected_real, label: Projected pot in today’s money}
      - {id: contributed, label: Starting pot + total nominal contributions}
      - {id: growth, label: Estimated net investment growth}
      - {id: employee_contributions, label: Employee / personal contributions added, advanced: true}
      - {id: employer_contributions, label: Employer contributions added, advanced: true}
      - {id: ending_employee_monthly, label: Employee monthly contribution in final year, advanced: true}
      - {id: ending_employer_monthly, label: Employer monthly contribution in final year, advanced: true}
      - {id: fee_drag, label: Modelled ending-balance reduction from annual fee, advanced: true}
      - {id: stress_projected, label: Projected pot in lower-return scenario, advanced: true}
    guide: |
      ## Projection, not forecast
      The calculator compounds the existing pot and contributions using a constant annual return assumption after the annual percentage fee. Advanced mode can escalate contributions, add an annual AVC and compare a lower-return scenario.

      Revenue tax relief limits and pension-product rules are separate from investment growth. Use the tax-relief calculator for contribution-limit planning and your provider’s benefit statement for scheme-specific projections.
    sources:
      - {title: "Revenue — Tax relief limits on pension contributions", url: "https://www.revenue.ie/en/jobs-and-pensions/pension/relief/tax-relief-limits.aspx"}
      - {title: "Revenue — Tax relief on pension contributions", url: "https://www.revenue.ie/en/jobs-and-pensions/pension/relief/index.aspx"}
      - {title: "Pensions Authority — Statement of reasonable projection", url: "https://pensionsauthority.ie/scheme-members-and-prsa-contributors/understanding-pensions/your_right_to_information/statement_of_reasonable_projection/"}
      - {title: "Pensions Authority — Pension calculator assumptions", url: "https://pensionsauthority.ie/scheme-members-and-prsa-contributors/pension-calculator/assumptions/"}

  - slug: rent-vs-buy-calculator
    title: Rent vs Buy Calculator Ireland
    category: Mortgages & Home Buying
    formula: rent_vs_buy
    summary: Compare a homeowner's net-equity path with a renter who invests the deposit, avoided buying costs and any monthly cash-flow advantage.
    meta_description: Rent vs buy calculator Ireland. Compare home equity with renting and investing using editable mortgage, rent, growth, maintenance, transaction-cost and investment-return assumptions.
    updated: 2026-09-22
    basic_note: "Basic mode uses transparent default assumptions for rent/house-price growth, maintenance, selling costs, fixed ownership costs and renter investment return. Switch to Advanced to challenge them."
    advanced_note: "Advanced mode exposes the assumptions that drive long-run rent-versus-buy results. Treat the investment return as a net return after whatever fees and tax treatment apply to your own investment."
    fields:
      - {id: monthly_rent, label: Current monthly rent, type: number, prefix: "€", default: 1800, min: 0, step: 50, section_start: Renting}
      - {id: annual_rent_growth, label: Annual rent growth assumption, type: number, suffix: "%", default: 2.5, min: -10, max: 20, step: 0.1, advanced: true, section_start: Advanced assumptions}
      - {id: buying_costs, label: Legal, valuation & other buying costs (excluding stamp duty), type: number, prefix: "€", default: 3500, min: 0, step: 100, advanced: true}
      - {id: owner_fixed_annual, label: Annual LPT, insurance & other fixed ownership costs, type: number, prefix: "€", default: 1200, min: 0, step: 100, advanced: true}
      - {id: house_price, label: Home purchase price, type: number, prefix: "€", default: 400000, min: 1, step: 1000, section_start: Buying}
      - {id: deposit, label: Deposit, type: number, prefix: "€", default: 40000, min: 0, step: 1000}
      - {id: mortgage_rate, label: Mortgage interest rate assumption, type: number, suffix: "%", default: 3.5, min: 0, max: 20, step: 0.1}
      - {id: mortgage_years, label: Mortgage term, type: number, suffix: years, default: 30, min: 1, max: 50, step: 1}
      - {id: house_growth, label: Annual house-price growth assumption, type: number, suffix: "%", default: 2.5, min: -20, max: 20, step: 0.1, advanced: true}
      - {id: maintenance_pct, label: Annual maintenance as % of current home value, type: number, suffix: "%", default: 1, min: 0, max: 10, step: 0.1, advanced: true}
      - {id: renter_return, label: Renter investment return assumption — net of fees/tax, type: number, suffix: "%", default: 5, min: -20, max: 30, step: 0.1, advanced: true}
      - {id: selling_cost_pct, label: Selling costs at comparison date, type: number, suffix: "% of home value", default: 1.5, min: 0, max: 10, step: 0.1, advanced: true}
      - {id: years, label: Comparison period, type: number, suffix: years, default: 15, min: 1, max: 40, step: 1, section_start: Time horizon}
    results:
      - {id: mortgage_payment, label: Starting monthly mortgage repayment}
      - {id: upfront_buying_costs, label: Stamp duty + other buying costs}
      - {id: owner_equity, label: Buyer net position at end}
      - {id: renter_portfolio, label: Renter investment portfolio at end}
      - {id: difference, label: End-value difference}
      - {id: first_crossover, label: First modelled point buyer is ahead, advanced: true}
      - {id: ending_home_value, label: Modelled home value at end, advanced: true}
      - {id: remaining_mortgage, label: Mortgage balance at end, advanced: true}
      - {id: buyer_sale_equity, label: Home sale equity after selling costs, advanced: true}
      - {id: ending_monthly_rent, label: Modelled monthly rent at end, advanced: true}
    guide: |
      ## A scenario engine, not a verdict
      Rent versus buy depends on uncertain variables that compound over time. This tool compares a buyer's liquidated net position with a renter who invests the cash not committed to buying and any monthly housing-cost advantage.

      The default assumptions are deliberately editable. Run conservative, central and optimistic cases rather than relying on one result.
    sources:
      - {title: "CCPC — Understanding mortgages", url: "https://www.ccpc.ie/manage-your-money/buying-a-home/about-mortgages/understanding-mortgages"}
      - {title: "Revenue — Stamp Duty property rates", url: "https://www.revenue.ie/en/property/stamp-duty/property/stamp-duty-property/rates.aspx"}

  - slug: mortgage-affordability-calculator
    title: Mortgage Affordability Calculator Ireland
    category: Mortgages & Home Buying
    formula: mortgage_affordability
    summary: Compare the Central Bank income ceiling, your deposit/LTV constraint and a user-set repayment budget, with an optional net-income household budget check.
    meta_description: Mortgage affordability calculator Ireland. Compare Central Bank LTI and LTV limits with monthly repayment capacity, household budget and a rate stress test.
    updated: 2026-09-22
    basic_note: "Basic mode uses a 4.5% scenario rate, 30-year term and a 30% gross-income payment cap. The payment share is a modelling choice, not an official affordability rule."
    advanced_note: "Advanced mode lets you change the rate, term and payment share, subtract other debt, add an optional net-income household budget and stress-test the resulting mortgage at a higher rate."
    fields:
      - {id: income, label: Gross household annual income, type: number, prefix: "€", default: 80000, min: 0, step: 1000, section_start: Household & deposit}
      - id: buyer_type
        label: Buyer type
        type: select
        default: ftb
        options:
          - {value: ftb, label: First-time buyer — 4× LTI limit}
          - {value: subsequent, label: Second/subsequent buyer — 3.5× LTI limit}
      - {id: deposit, label: Deposit available, type: number, prefix: "€", default: 40000, min: 0, step: 1000}
      - {id: rate, label: Mortgage interest rate for affordability scenario, type: number, suffix: "%", default: 4.5, min: 0, max: 20, step: 0.1, advanced: true, section_start: Advanced affordability assumptions}
      - {id: term, label: Mortgage term, type: number, suffix: years, default: 30, min: 1, max: 50, step: 1, advanced: true}
      - {id: max_payment_pct, label: Maximum mortgage payment as % of gross monthly income, type: number, suffix: "%", default: 30, min: 5, max: 70, step: 1, advanced: true}
      - {id: other_debt, label: Other monthly debt payments, type: number, prefix: "€", default: 0, min: 0, step: 50, advanced: true}
      - {id: net_income_monthly, label: Optional household net income per month, type: number, prefix: "€", default: 0, min: 0, step: 100, advanced: true, section_start: Optional net-income budget check, help: "Enter 0 to ignore this check. If entered, the model also limits the mortgage payment to cash left after the costs and buffer below."}
      - {id: essential_spend_monthly, label: Essential monthly spending excluding mortgage and debt, type: number, prefix: "€", default: 0, min: 0, step: 100, advanced: true}
      - {id: buffer_monthly, label: Monthly cash buffer you want to preserve, type: number, prefix: "€", default: 0, min: 0, step: 100, advanced: true}
      - {id: stress_rate_add, label: Stress-test rate increase, type: number, suffix: "percentage points", default: 1, min: 0, max: 10, step: 0.25, advanced: true, section_start: Rate stress test}
    results:
      - {id: lti_mortgage, label: Central Bank LTI ceiling before allowances}
      - {id: payment_capacity, label: Modelled monthly mortgage capacity}
      - {id: payment_based_mortgage, label: Mortgage supported by payment capacity}
      - {id: deposit_based_mortgage, label: Mortgage supported by deposit at 90% LTV}
      - {id: indicative_mortgage, label: Indicative mortgage from the tightest constraint}
      - {id: indicative_price, label: Indicative price including deposit}
      - {id: binding_constraint, label: Binding modelled constraint}
      - {id: gross_payment_limit, label: Gross-income payment limit after debt, advanced: true}
      - {id: net_budget_limit, label: Net-income budget payment limit, advanced: true}
      - {id: stress_rate, label: Stress-test interest rate, advanced: true}
      - {id: stress_payment, label: Repayment at stress-test rate, advanced: true}
    guide: |
      ## Regulatory capacity and household affordability are different
      The Central Bank mortgage measures set LTI/LTV boundaries. Lenders then apply their own underwriting. This tool adds a user-defined cash-flow constraint so you can deliberately set a stricter ceiling than the regulatory maximum.

      The percentage-of-gross-income setting is not a Central Bank rule or lender approval formula. Advanced mode can add a net-income budget check so the model uses the lower of the two monthly payment limits.
    sources:
      - {title: "Central Bank of Ireland — Mortgage Measures", url: "https://www.centralbank.ie/financial-system/financial-stability/macro-prudential-policy/mortgage-measures"}
      - {title: "CCPC — Understanding mortgages", url: "https://www.ccpc.ie/manage-your-money/buying-a-home/about-mortgages/understanding-mortgages"}

  - slug: house-buying-costs-calculator
    title: House Buying Costs Calculator Ireland
    category: Mortgages & Home Buying
    formula: house_buying_costs
    summary: Build a completion-cash budget from your deposit, current residential Stamp Duty and editable professional, moving and setup costs.
    meta_description: House buying costs calculator Ireland. Estimate deposit, Stamp Duty, legal, survey, valuation, moving and other upfront costs, then compare the total with cash available.
    updated: 2026-09-22
    basic_note: "Basic mode totals the deposit, current standard residential Stamp Duty and the editable professional/moving budgets below."
    advanced_note: "Advanced mode adds insurance/setup, furnishing, immediate works, a reserve you want to keep after closing and a cash-available check."
    fields:
      - {id: price, label: Property price, type: number, prefix: "€", default: 400000, min: 1, step: 1000, section_start: Purchase}
      - {id: deposit_pct, label: Deposit percentage, type: number, suffix: "%", default: 10, min: 0, max: 100, step: 1}
      - {id: legal, label: Solicitor / conveyancing and legal-outlay budget, type: number, prefix: "€", default: 2500, min: 0, step: 100, section_start: Professional & moving costs}
      - {id: survey, label: Survey / engineer budget, type: number, prefix: "€", default: 600, min: 0, step: 50}
      - {id: valuation, label: Lender valuation budget, type: number, prefix: "€", default: 200, min: 0, step: 50}
      - {id: moving, label: Moving / basic setup budget, type: number, prefix: "€", default: 1500, min: 0, step: 100}
      - {id: other, label: Other upfront costs, type: number, prefix: "€", default: 1000, min: 0, step: 100}
      - {id: insurance_setup, label: Initial home-insurance / mortgage-protection budget, type: number, prefix: "€", default: 0, min: 0, step: 100, advanced: true, section_start: Advanced setup & resilience}
      - {id: furnishing, label: Furniture & appliance budget, type: number, prefix: "€", default: 0, min: 0, step: 250, advanced: true}
      - {id: immediate_works, label: Immediate repairs / works budget, type: number, prefix: "€", default: 0, min: 0, step: 250, advanced: true}
      - {id: reserve, label: Cash reserve you want left after purchase, type: number, prefix: "€", default: 0, min: 0, step: 500, advanced: true}
      - {id: cash_available, label: Total cash available, type: number, prefix: "€", default: 50000, min: 0, step: 500, advanced: true, help: "Used only for the advanced surplus/shortfall check. Include cash genuinely available for the purchase plan."}
    results:
      - {id: deposit, label: Deposit}
      - {id: stamp, label: Residential stamp duty}
      - {id: other_costs, label: Professional, moving & setup costs}
      - {id: total_upfront, label: Total upfront cash budget}
      - {id: mortgage_required, label: Mortgage required from price less deposit}
      - {id: professional_costs, label: Professional-cost subtotal, advanced: true}
      - {id: moving_setup_costs, label: Moving, setup & immediate works, advanced: true}
      - {id: cash_target, label: Cash target including retained reserve, advanced: true}
      - {id: cash_position, label: Cash surplus / shortfall versus target, advanced: true}
    guide: |
      ## Completion needs more cash than the deposit
      This tool combines the mortgage deposit, current standard residential Stamp Duty and the editable costs you enter. Advanced mode also separates spending from a reserve you deliberately want to retain after the keys are collected.

      Replace the defaults with actual quotes as the purchase progresses. Professional fees and insurance costs vary by property and buyer.
    sources:
      - {title: "Revenue — Residential Stamp Duty rates", url: "https://www.revenue.ie/en/property/stamp-duty/property/stamp-duty-property/rates.aspx"}
      - {title: "CCPC — Understanding mortgages", url: "https://www.ccpc.ie/manage-your-money/buying-a-home/about-mortgages/understanding-mortgages"}

  - slug: solar-payback-calculator
    title: Solar PV Payback Calculator Ireland
    category: Home Energy
    formula: solar_payback
    summary: Model solar PV payback with or without the SEAI grant, plus household demand, EV charging, battery storage, export income and night-rate battery charging.
    meta_description: Solar PV payback calculator Ireland with grant eligibility, household electricity use, EV charging, battery storage, night-rate arbitrage and export income.
    updated: 2026-09-22
    fields:
      - id: system_cost
        section_start: Solar system
        label: Solar PV installed cost before grant
        type: number
        prefix: "€"
        default: 9000
        min: 0
        step: 100
        help: "Enter the solar PV quote excluding any battery cost. Keep VAT and installation charges in the figure if they are part of the quote."
      - id: grant_eligible
        label: Include the SEAI Solar PV grant
        type: checkbox
        default: true
        help: "Untick this if the home is not eligible, the grant has already been used at this MPRN, or you simply want to see the no-grant economics."
      - id: kwp
        label: Solar PV system size
        type: number
        suffix: "kWp"
        default: 4
        min: 0
        max: 30
        step: 0.1
        help: "Use the kWp figure from the installer quote."
      - id: generation_per_kwp
        label: Expected annual generation per kWp
        type: number
        suffix: "kWh"
        default: 850
        min: 0
        max: 2000
        step: 10
        help: "Replace the default with the installer or SEAI estimate for your location, roof direction, pitch and shading."
      - id: annual_home_kwh
        label: Household electricity use before EV
        type: number
        suffix: "kWh/year"
        default: 4200
        min: 0
        step: 100
        help: "4,200 kWh is the CRU average annual-consumption figure and a useful starting point for a typical 3–4 bed semi. Your own bill or smart-meter data is better."
      - id: direct_solar_pct
        label: Solar generation used directly by the home before EV/battery
        type: number
        suffix: "%"
        default: 35
        min: 0
        max: 100
        step: 1
        help: "This is an assumption about how well your daytime household demand overlaps solar generation before adding EV or battery storage."
      - id: import_rate
        label: Day / avoided import rate
        type: number
        prefix: "€"
        suffix: "/kWh"
        default: 0.30
        min: 0
        step: 0.01
        help: "Use the rate that solar or battery discharge would actually avoid. Do not include standing charges."
      - id: export_rate
        label: Solar export payment
        type: number
        prefix: "€"
        suffix: "/kWh"
        default: 0.15
        min: 0
        step: 0.01
        help: "Suppliers set their own Clean Export Guarantee rate, so use the rate on your current or proposed tariff."

      - id: has_ev
        section_start: Electric vehicle
        label: EV is charged at this home
        type: checkbox
        default: false
        help: "Tick this to include the extra electricity demand from home EV charging and the option to divert solar into the car."
      - id: annual_ev_km
        label: EV distance driven per year
        type: number
        suffix: "km"
        default: 15000
        min: 0
        step: 500
        show_if: has_ev
      - id: ev_efficiency
        label: EV consumption
        type: number
        suffix: "kWh/100km"
        default: 18
        min: 1
        max: 60
        step: 0.5
        show_if: has_ev
        help: "Use a real-world figure from the car if you have it."
      - id: ev_loss_pct
        label: EV charging losses
        type: number
        suffix: "%"
        default: 10
        min: 0
        max: 40
        step: 1
        show_if: has_ev
      - id: ev_home_charge_pct
        label: Share of EV charging done at home
        type: number
        suffix: "%"
        default: 80
        min: 0
        max: 100
        step: 1
        show_if: has_ev
      - id: ev_solar_share_pct
        label: Share of home EV charging you expect to take directly from solar
        type: number
        suffix: "%"
        default: 0
        min: 0
        max: 100
        step: 1
        show_if: has_ev
        help: "Leave at 0% if the car is normally away during solar hours. Increase it if the EV is regularly home and a charger can follow solar surplus."
      - id: ev_alternative_rate
        label: Grid rate the solar EV charging would otherwise use
        type: number
        prefix: "€"
        suffix: "/kWh"
        default: 0.10
        min: 0
        step: 0.01
        show_if: has_ev
        help: "If you normally charge the EV on a cheap night/EV rate, solar charging only avoids that cheaper rate, not the daytime rate."

      - id: has_battery
        section_start: Home battery
        label: Include a home battery
        type: checkbox
        default: false
        help: "Tick this if the quote includes a battery or you want to test whether adding one improves or lengthens payback."
      - id: battery_cost
        label: Battery installed cost
        type: number
        prefix: "€"
        default: 4500
        min: 0
        step: 100
        show_if: has_battery
        help: "Enter the incremental cost of the battery, inverter changes and installation if applicable."
      - id: battery_kwh
        label: Usable battery capacity
        type: number
        suffix: "kWh"
        default: 5
        min: 0.1
        max: 100
        step: 0.5
        show_if: has_battery
      - id: battery_efficiency
        label: Battery round-trip efficiency
        type: number
        suffix: "%"
        default: 90
        min: 50
        max: 100
        step: 1
        show_if: has_battery
        help: "Storage is not lossless. Use the manufacturer's round-trip figure where available."
      - id: solar_to_battery_pct
        label: Share of remaining solar surplus you expect the battery to capture
        type: number
        suffix: "%"
        default: 60
        min: 0
        max: 100
        step: 1
        show_if: has_battery
        help: "The model also caps annual battery charging to one full equivalent charge per day, shared with night-rate charging."

      - id: night_charge
        label: Charge the home battery on a cheap night rate as well
        type: checkbox
        default: false
        show_if: has_battery
        help: "This models grid shifting: buying electricity when it is cheap and discharging later to avoid the day rate."
      - id: night_rate
        label: Night / battery charging rate
        type: number
        prefix: "€"
        suffix: "/kWh"
        default: 0.10
        min: 0
        step: 0.01
        show_if: night_charge
      - id: night_battery_kwh_day
        label: Average battery energy bought from the grid each night
        type: number
        suffix: "kWh/day"
        default: 3
        min: 0
        step: 0.5
        show_if: night_charge
        help: "Use a conservative average. The calculator limits combined solar and grid charging to one full equivalent battery charge per day across the year."

    results:
      - {id: grant, label: SEAI grant included}
      - {id: net_cost, label: Net solar + battery investment}
      - {id: annual_generation, label: Estimated solar generation}
      - {id: total_demand, label: Household + home-EV electricity demand}
      - {id: solar_used, label: Solar electricity used on site}
      - {id: exported, label: Solar electricity exported}
      - {id: solar_value, label: Annual value from solar generation}
      - {id: battery_arbitrage, label: Annual night-rate battery saving}
      - {id: annual_value, label: Total estimated annual value}
      - {id: payback, label: Simple payback}

    guide: |
      ## Start with your real annual electricity use

      The strongest input is not the number of bedrooms — it is the **kWh on your electricity bills or smart-meter data**. If you do not know it yet, **4,200 kWh a year** is the CRU average-consumption figure used for Irish electricity comparisons. Electric Ireland's household benchmarks also use about **4,200 kWh for a 3–4 bed semi-detached home**, around **3,000 kWh for a 2-bed semi**, and around **6,000 kWh for a 3–4 bed detached home**.

      Those are starting points, not targets. An all-electric home, heat pump, electric shower, tumble dryer, EV or large family can move consumption materially higher. A very efficient home can use much less.

      | Household starting point | Indicative annual electricity use |
      | --- | ---: |
      | 2-bed semi | 3,000 kWh |
      | 3–4 bed semi | 4,200 kWh |
      | 3–4 bed detached | 6,000 kWh |
      | 4–6 bed detached | 8,000 kWh |

      If you have a smart meter, your own half-hourly import/export data is much more useful than a national average because **when** you use electricity determines how much solar you can use directly.

      ## Grant eligible or not?

      The calculator now makes the grant optional. For the individual SEAI domestic Solar PV grant, the home needs an MPRN, must have been **built and occupied before 2021**, and cannot previously have received solar-PV funding at that MPRN. SEAI also requires the grant application and approval to be in place before works start.

      For an eligible installation, the 2026 grant is **€700 per kWp up to 2 kWp, then €200 per additional kWp up to 4 kWp, capped at €1,800**. Untick **“Include the SEAI Solar PV grant”** if any eligibility condition is not met or if you want to see the project on a no-grant basis.

      ## Generation is not the same as saving

      A 4 kWp array generating 850 kWh per kWp would produce about **3,400 kWh in a year**. But every generated unit does not automatically save the daytime retail rate.

      The calculator separates generation into four destinations:

      1. **Used directly by the house.** This avoids buying electricity at the import rate you entered.
      2. **Used directly to charge an EV.** This avoids whatever rate you would otherwise use to charge the car. If you normally charge overnight at 10c/kWh, a solar kWh going into the car is closer to a 10c saving than a 30c saving.
      3. **Stored in a battery and used later.** Battery losses mean less energy comes back out than went in.
      4. **Exported to the grid.** This earns your supplier's Clean Export Guarantee rate rather than the retail import rate.

      SEAI notes that Irish solar generation is highly seasonal, with around **75% produced from May to September**. A home battery shifts energy from one part of the day to another; it does not move a July surplus into January.

      ## How the EV changes the calculation

      An EV can make a solar system more valuable **if the car is actually available to take solar generation**.

      The calculator estimates wall energy for the EV from:

      **annual km × kWh/100 km ÷ charging efficiency × share charged at home**

      For example, 15,000 km at 18 kWh/100 km is 2,700 kWh delivered to the car. With 10% charging losses, that is about 3,000 kWh from the charger if every charge happens at home. If only 80% is charged at home, the home sees about 2,400 kWh of additional annual demand.

      That extra demand does **not** automatically mean more solar self-consumption. Set the **solar share of home EV charging** to match reality. If the car leaves at 07:30 and returns after sunset, use a low figure. If it sits at home during the day and a smart charger follows surplus generation, a higher figure can be reasonable.

      SEAI specifically notes that smart charging can schedule EV charging around solar production and that off-peak grid charging is usually cheaper than charging at peak times.

      ## What a battery can add

      A battery can improve solar self-consumption by storing daytime surplus for the evening. The model first gives the home and EV a chance to use solar directly, then allows the battery to capture a share of the remaining surplus.

      The important comparison is not simply:

      **stored kWh × daytime electricity rate**

      because without a battery that surplus solar could have been exported and earned an export payment. The calculator therefore compares the value of using battery-delivered solar against the export income that is given up, while also applying the round-trip efficiency you enter.

      Battery cost is added to the initial investment. This matters: a battery can reduce the electricity bill while still **lengthening the payback period** if the extra annual saving is small relative to the installed battery price.

      ## Charging the battery at night and using it by day

      A smart tariff can create a second source of battery value even in winter: charge from the grid when electricity is cheap and discharge when it is expensive.

      Suppose the day rate is 30c/kWh, the night rate is 10c/kWh and round-trip efficiency is 90%. Delivering 1 kWh from the battery requires roughly 1.11 kWh of night electricity, costing about 11.1c. Avoiding a 30c daytime unit leaves a gross spread of about **18.9c per delivered kWh** before battery degradation and other costs.

      That spread can be valuable, but it should not be multiplied by the full battery capacity blindly. The battery is also being used for solar. To keep the estimate conservative, this calculator caps the **combined solar charging plus night-grid charging at one full equivalent battery charge per day over the year**.

      ## Export still has value

      Solar that the home, EV and battery cannot absorb is treated as exported. SEAI describes the Clean Export Guarantee as a supplier payment for excess generation; suppliers set their own rates. Enter the actual export rate available to you rather than assuming the rate shown here will always apply.

      A larger array can therefore still make sense even when self-consumption falls, but the economics increasingly depend on the difference between the export rate and the retail rate you avoid.

      ## What is included in payback

      The simple payback is:

      **net upfront investment ÷ estimated annual value**

      The upfront investment includes the solar quote, plus the battery cost if selected, minus the SEAI grant only when the grant box is ticked.

      Annual value includes direct household solar savings, direct EV solar savings, battery-shifted solar, export income and any positive or negative night-rate battery-arbitrage result.

      ## What this calculator deliberately does not pretend to know

      It does not forecast future electricity tariffs, future export rates, panel degradation, battery degradation, battery replacement, inverter replacement, financing interest, maintenance, curtailment, changes in household behaviour or future EV mileage.

      SEAI notes that batteries increase system cost and lose some energy during the charge/discharge cycle. It also advises that PV generation should be monitored and that the inverter can require replacement during the system lifetime.

      Use the calculator to compare **scenarios**:

      - grant eligible versus no grant;
      - solar only versus solar + battery;
      - no EV versus an EV charged at home;
      - EV charged at night versus EV charged from daytime solar;
      - battery used only for solar versus solar + night-rate grid shifting;
      - a smaller system with high self-consumption versus a larger system with more export.

      The most useful result is often not the headline payback number but seeing **which assumption is doing the work**.

    sources:
      - {title: "SEAI — Solar Electricity PV Grant", url: "https://www.seai.ie/grants/home-energy-grants/individual-grants/solar-electricity-grant"}
      - {title: "SEAI — Solar Electricity Calculator and assumptions", url: "https://www.seai.ie/about/tools/solar-electricity-calculator"}
      - {title: "SEAI — Electricity from Solar: batteries, export and seasonality", url: "https://www.seai.ie/renewable-energy/solar-energy/electricity-from-solar"}
      - {title: "SEAI — Smart energy technologies: solar, EVs and battery storage", url: "https://www.seai.ie/plan-your-energy-journey/for-your-home/smart-living/smart-energy-technologies"}
      - {title: "CRU — Smart Meter Glossary: 4,200 kWh average household consumption", url: "https://www.cru.ie/about-us/news/smart-meter-glossary/"}
      - {title: "CRU — Microgeneration and export payments", url: "https://www.cru.ie/consumer-information/microgeneration/"}
      - {title: "Electric Ireland — Household electricity-consumption benchmarks", url: "https://www.electricireland.ie/residential/help/detail/energy-efficiency-advice"}

  - slug: ber-energy-cost-calculator
    title: BER Energy Cost Calculator Ireland
    category: Home Energy
    formula: ber_energy
    summary: Turn an energy-use figure into an indicative annual cost and compare it with a target efficiency level.
    meta_description: BER energy cost calculator Ireland. Use your home's energy-use figure, floor area and energy price to compare current and target annual energy costs.
    updated: 2026-09-22
    fields:
      - {id: area, label: Floor area, type: number, suffix: "m²", default: 120, min: 1, step: 1}
      - {id: current_kwh_m2, label: Current annual energy-use assumption, type: number, suffix: "kWh/m²", default: 180, min: 0, step: 5}
      - {id: target_kwh_m2, label: Target annual energy-use assumption, type: number, suffix: "kWh/m²", default: 90, min: 0, step: 5}
      - {id: energy_price, label: Blended energy price assumption, type: number, prefix: "€", suffix: "/kWh", default: 0.18, min: 0, step: 0.01}
    results:
      - {id: current_use, label: Current annual energy use}
      - {id: target_use, label: Target annual energy use}
      - {id: current_cost, label: Indicative current annual energy cost}
      - {id: target_cost, label: Indicative target annual energy cost}
      - {id: saving, label: Indicative annual difference}
    guide: |
      ## BER is an energy-performance rating, not your utility bill
      Ireland's BER scale changed to a simplified A-to-G scale from 24 May 2026. A BER is produced through the official assessment methodology and does not directly equal a household's actual metered energy consumption.

      This calculator therefore does not guess a kWh figure from a letter grade. Enter an energy-use assumption or figure relevant to your assessment and compare it with a target. Actual bills also depend on fuel mix, standing charges, tariffs, occupancy and behaviour.
    sources:
      - {title: "SEAI — Building Energy Rating information", url: "https://www.seai.ie/ber"}


  - slug: solar-ev-battery-optimiser
    title: Solar + EV + Battery Optimiser Ireland
    category: Home Energy
    formula: solar_optimizer
    summary: Compare solar-only, solar with smart EV charging, solar with a battery, and a combined solar + EV + battery setup side by side.
    meta_description: Solar EV battery optimiser Ireland. Compare annual value, payback and 20-year net benefit for solar-only, EV smart charging, battery and combined scenarios.
    updated: 2026-09-22
    fields:
      - {id: solar_cost, label: Solar PV installed cost before grant, type: number, prefix: "€", default: 9000, min: 0, step: 100, section_start: Solar system}
      - id: grant_eligible
        label: Include the SEAI Solar PV grant
        type: checkbox
        default: true
      - {id: kwp, label: Solar PV system size, type: number, suffix: "kWp", default: 4, min: 0, max: 30, step: 0.1}
      - {id: generation_per_kwp, label: Expected annual generation per kWp, type: number, suffix: "kWh", default: 850, min: 0, max: 2000, step: 10}
      - {id: home_kwh, label: Household electricity use before EV, type: number, suffix: "kWh/year", default: 4200, min: 0, step: 100}
      - {id: direct_home_pct, label: Solar generation used directly by household loads, type: number, suffix: "%", default: 35, min: 0, max: 100, step: 1}
      - {id: day_rate, label: Day / avoided import rate, type: number, prefix: "€", suffix: "/kWh", default: 0.30, min: 0, step: 0.01}
      - {id: export_rate, label: Export payment, type: number, prefix: "€", suffix: "/kWh", default: 0.15, min: 0, step: 0.01}
      - id: has_ev
        section_start: Electric vehicle
        label: Include an EV charged at home
        type: checkbox
        default: true
      - {id: ev_km, label: EV distance per year, type: number, suffix: "km", default: 15000, min: 0, step: 500, show_if: has_ev}
      - {id: ev_efficiency, label: EV consumption, type: number, suffix: "kWh/100km", default: 18, min: 1, max: 60, step: 0.5, show_if: has_ev}
      - {id: ev_loss_pct, label: EV charging losses, type: number, suffix: "%", default: 10, min: 0, max: 40, step: 1, show_if: has_ev}
      - {id: ev_home_pct, label: Share of EV charging done at home, type: number, suffix: "%", default: 80, min: 0, max: 100, step: 1, show_if: has_ev}
      - {id: ev_solar_pct, label: Share of home EV charging that can follow solar, type: number, suffix: "%", default: 35, min: 0, max: 100, step: 1, show_if: has_ev}
      - {id: ev_grid_rate, label: Grid rate otherwise used for EV charging, type: number, prefix: "€", suffix: "/kWh", default: 0.10, min: 0, step: 0.01, show_if: has_ev}
      - {id: battery_cost, label: Battery installed cost, type: number, prefix: "€", default: 4500, min: 0, step: 100, section_start: Home battery}
      - {id: battery_kwh, label: Usable battery capacity, type: number, suffix: "kWh", default: 5, min: 0.1, max: 100, step: 0.5}
      - {id: battery_efficiency, label: Battery round-trip efficiency, type: number, suffix: "%", default: 90, min: 50, max: 100, step: 1}
      - {id: solar_capture_pct, label: Remaining solar surplus captured by battery, type: number, suffix: "%", default: 60, min: 0, max: 100, step: 1}
      - id: use_night_charge
        section_start: Night-rate charging
        label: Include cheap-rate grid charging of the battery
        type: checkbox
        default: true
      - {id: night_rate, label: Night battery charging rate, type: number, prefix: "€", suffix: "/kWh", default: 0.10, min: 0, step: 0.01, show_if: use_night_charge}
      - {id: night_kwh_day, label: Average battery energy bought at night, type: number, suffix: "kWh/day", default: 3, min: 0, step: 0.5, show_if: use_night_charge}
    results:
      - {id: generation, label: Annual solar generation}
      - {id: ev_demand, label: Annual home EV charging demand}
      - {id: best_scenario, label: Highest 20-year net-benefit scenario}
      - {id: solar_payback, label: Solar-only simple payback}
      - {id: ev_payback, label: Solar + smart EV payback}
      - {id: battery_payback, label: Solar + battery payback}
      - {id: combined_payback, label: Solar + EV + battery payback}
    guide: |
      ## Compare systems rather than asking whether a battery is “good”

      The optimiser runs four scenarios from the same house, solar and tariff assumptions. It separates direct household use, EV charging, battery storage and exports so the same kWh is not counted twice.

      An EV only improves solar economics when it is available to absorb solar that would otherwise be exported. If the car normally charges on a cheap night rate, a solar kWh going into the car avoids that cheaper rate, not the daytime rate.

      A battery can capture solar surplus and can also shift cheap night-rate electricity into expensive daytime hours. The model applies battery round-trip losses and caps combined solar + grid charging at one full equivalent battery cycle per day on average.

      ## Read the 20-year comparison carefully

      The chart compares **20-year net benefit after the upfront system cost** under constant tariff and generation assumptions. It is not a forecast. Battery degradation/replacement, inverter replacement, financing, panel degradation and future tariff changes are outside the model.

      Use it to see what actually creates value in your own case: higher self-consumption, an EV at home during daylight, a large day/night tariff spread, or simply a solar-only system with fewer moving parts.
    sources:
      - {title: "SEAI — Solar Electricity PV Grant", url: "https://www.seai.ie/grants/home-energy-grants/individual-grants/solar-electricity-grant"}
      - {title: "SEAI — Electricity from Solar", url: "https://www.seai.ie/renewable-energy/solar-energy/electricity-from-solar"}
      - {title: "SEAI — Smart energy technologies", url: "https://www.seai.ie/plan-your-energy-journey/for-your-home/smart-living/smart-energy-technologies"}

  - slug: whole-house-retrofit-planner
    title: Whole-House Retrofit Planner Ireland
    category: Home Energy
    formula: retrofit_planner
    summary: Combine upgrade quotes, current One Stop Shop grant values and an editable energy-saving assumption into one retrofit budget and payback plan.
    meta_description: Whole-house retrofit planner Ireland. Combine insulation, windows, heat pump, solar and other upgrades with current SEAI One Stop Shop grants and payback estimates.
    updated: 2026-09-22
    fields:
      - id: home_type
        section_start: Home & assumptions
        label: Home type
        type: select
        default: semi
        options:
          - {value: detached, label: Detached house}
          - {value: semi, label: Semi-detached / end terrace}
          - {value: mid, label: Mid-terrace}
          - {value: apartment, label: Apartment}
      - id: oss_eligible
        label: Model the current One Stop Shop grant schedule
        type: checkbox
        default: true
        help: "The standard One Stop Shop route generally requires a home built and occupied before 2011 and a qualifying complete upgrade. Untick to model the project with no grants."
      - id: first_time_buyer
        label: Qualifying first-time buyer for the enhanced attic grant
        type: checkbox
        default: false
        show_if: oss_eligible
      - {id: annual_energy_bill, label: Current annual home energy bill, type: number, prefix: "€", default: 3000, min: 0, step: 100}
      - {id: saving_pct, label: Assumed reduction in annual energy cost after all selected works, type: number, suffix: "%", default: 35, min: 0, max: 100, step: 1}
      - id: attic
        section_start: Fabric upgrades
        label: Include attic insulation
        type: checkbox
        default: true
      - {id: attic_cost, label: Attic insulation quote, type: number, prefix: "€", default: 2500, min: 0, step: 100, show_if: attic}
      - id: external_wall
        label: Include external wall insulation / wrap
        type: checkbox
        default: true
      - {id: wall_cost, label: External wall insulation quote, type: number, prefix: "€", default: 18000, min: 0, step: 500, show_if: external_wall}
      - id: windows
        label: Include complete window upgrade
        type: checkbox
        default: true
      - {id: windows_cost, label: Window upgrade quote, type: number, prefix: "€", default: 12000, min: 0, step: 500, show_if: windows}
      - id: heat_pump
        section_start: Heating & generation
        label: Include heat pump system
        type: checkbox
        default: true
      - {id: heat_pump_cost, label: Heat pump system quote, type: number, prefix: "€", default: 14000, min: 0, step: 500, show_if: heat_pump}
      - id: solar
        label: Include solar PV
        type: checkbox
        default: true
      - {id: solar_cost, label: Solar PV quote, type: number, prefix: "€", default: 8000, min: 0, step: 500, show_if: solar}
      - {id: solar_kwp, label: Solar PV size, type: number, suffix: "kWp", default: 4, min: 0, max: 30, step: 0.1, show_if: solar}
      - id: doors
        label: Include external doors
        type: checkbox
        default: false
      - {id: doors_cost, label: External door quote total, type: number, prefix: "€", default: 3000, min: 0, step: 100, show_if: doors}
      - {id: door_count, label: Number of external doors, type: number, default: 2, min: 1, max: 10, step: 1, show_if: doors}
      - id: ventilation
        section_start: Ventilation & airtightness
        label: Include mechanical ventilation
        type: checkbox
        default: false
      - {id: ventilation_cost, label: Ventilation quote, type: number, prefix: "€", default: 5000, min: 0, step: 100, show_if: ventilation}
      - id: airtightness
        label: Include airtightness works
        type: checkbox
        default: false
      - {id: airtightness_cost, label: Airtightness works quote, type: number, prefix: "€", default: 2500, min: 0, step: 100, show_if: airtightness}
      - {id: other_cost, label: Other retrofit / professional costs, type: number, prefix: "€", default: 3000, min: 0, step: 100, section_start: Other project costs}
    results:
      - {id: gross_cost, label: Total selected upgrade cost}
      - {id: grants, label: Indicative grants included}
      - {id: net_cost, label: Net project cost}
      - {id: annual_saving, label: Assumed annual energy saving}
      - {id: payback, label: Simple energy-bill payback}
    guide: |
      ## This is a budget planner, not a BER design tool

      SEAI's One Stop Shop route is intended for multiple upgrades and generally requires the property to have been built and occupied before 2011 and to achieve the required post-works energy-performance outcome. A registered One Stop Shop assesses the home and determines the qualifying package.

      This planner uses the current published homeowner One Stop Shop grant schedule for the selected home type. It does not decide technical eligibility, heat-loss readiness, heritage suitability or whether two grants can be combined in your exact project.

      ## Why the energy saving is an editable assumption

      The same €40,000 retrofit can produce very different bill savings depending on the starting BER, fuel, thermostat settings, floor area and how much comfort improves after the work. Rather than invent a universal savings percentage, the calculator asks you to model it.

      Run several scenarios — for example 20%, 35% and 50% — and judge the project on comfort, resilience and property performance as well as simple financial payback.
    sources:
      - {title: "SEAI — One Stop Shop multiple energy upgrades and grant values", url: "https://www.seai.ie/grants/home-energy-grants/one-stop-shop/multiple-energy-upgrades"}
      - {title: "SEAI — Home energy upgrade options", url: "https://www.seai.ie/grants/home-energy-grants"}
      - {title: "SEAI — Heat pump systems", url: "https://www.seai.ie/grants/home-energy-grants/individual-grants/heat-pump-systems"}

