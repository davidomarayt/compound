      - {id: weekly_before, label: Weekly PRSI before 1 October}
      - {id: weekly_after, label: Weekly PRSI from 1 October}
      - {id: annual, label: Approximate 2026 employee PRSI}
      - {id: effective, label: Approximate annual effective rate}
      - {id: october_increase, label: Approx. 2026 cost of October rate rise}
    guide: |
      ## Class A changes during 2026

      For a standard Class A employee, weekly earnings up to €352 do not attract employee PRSI. Above that threshold the employee rate is 4.20% up to 30 September 2026 and 4.35% from 1 October 2026.

      A tapered weekly PRSI Credit of up to €12 applies where weekly earnings are between €352.01 and €424. The credit reduces as earnings rise through that range.

      Compound converts the annual salary you enter into a weekly-equivalent salary, calculates the weekly PRSI under both 2026 rate periods and approximates the year using 39 weeks at the earlier rate and 13 weeks at the later rate.

      ## Why your payslip can differ

      PRSI is fundamentally a pay-period calculation. If your earnings vary because of overtime, bonuses, unpaid leave or irregular pay, a single annual salary divided by 52 cannot reproduce every weekly result.

      The calculator also assumes **Class A**. Other PRSI classes have different rules, and employer PRSI is not included here.

      The “cost of October rate rise” isolates the approximate additional employee contribution arising from the 0.15 percentage-point change for the final 13 weeks, after allowing for the weekly credit calculation.

    sources:
      - {title: "Department of Social Protection — PRSI Class A rates", url: "https://www.gov.ie/en/department-of-social-protection/publications/prsi-class-a-rates/"}
  - slug: inheritance-tax-calculator
    title: Inheritance & Gift Tax Calculator Ireland
    category: Tax & Take-Home Pay
    formula: cat
    summary: Estimate Capital Acquisitions Tax using current Group A, B and C thresholds and the 33% CAT rate.
    meta_description: Inheritance tax and gift tax calculator Ireland. Estimate CAT using current €400,000, €40,000 and €20,000 group thresholds and the 33% rate.
    updated: 2026-09-22
    fields:
      - {id: benefit, label: Current gift or inheritance value, type: number, prefix: "€", default: 500000, min: 0, step: 1000}
      - {id: prior, label: Prior taxable benefits in the same group since 5 December 1991, type: number, prefix: "€", default: 0, min: 0, step: 1000}
      - id: group
        label: CAT relationship group
        type: select
        default: A
        options:
          - {value: A, label: Group A — €400,000 threshold}
          - {value: B, label: Group B — €40,000 threshold}
          - {value: C, label: Group C — €20,000 threshold}
      - id: benefit_type
        label: Benefit type
        type: select
        default: inheritance
