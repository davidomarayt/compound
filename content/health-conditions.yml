guides:
  asthma:
    aliases: wheezing reactive airways
    summary: Asthma makes the airways sensitive and can cause episodes of wheezing, coughing, breathlessness or chest
      tightness. Good control reduces symptoms and the risk of an attack.
    emergency: If someone is having a severe asthma attack, is too breathless to speak or is getting worse despite using
      their reliever as directed in their action plan, call
    symptoms:
    - Symptoms may come and go. Wheezing, a tight chest, shortness of breath and a cough that wakes you at night are
      typical. The pattern matters because examinations between episodes can be normal.
    - Colds, pollen, exercise, smoke or cold air may bring on symptoms. What triggers one person's asthma may have little
      effect on somebody else.
    causes:
    - In asthma, the lining of the airways becomes inflamed and the muscles around them can tighten. Swelling, muscle
      tightening and mucus leave less room for air to move.
    diagnosis:
    - A GP reviews the pattern and may use spirometry or ask you to record peak flow over time. Changes in airflow after
      an inhaler can help clarify the diagnosis.
    care:
    - Your clinician can check inhaler technique and explain when to use each inhaler. An asthma action plan sets out
      what to do on ordinary days, when symptoms worsen and during an attack.
    - Bring your inhalers to reviews. Night waking, avoiding exercise and increasingly frequent reliever use are worth
      discussing even if you feel well on the day.
    complications:
    - Poorly controlled asthma can interfere with sleep, school, work or exercise. Attacks can come on quickly and can
      require emergency treatment.
    help:
    - Arrange a GP review if symptoms recur, wake you or limit activity. Arrange prompt follow-up after an attack, even
      if you feel better.
    sources:
      HSE asthma symptoms: https://www2.hse.ie/conditions/asthma/symptoms-of-asthma/
      HSE asthma diagnosis and tests: https://www2.hse.ie/conditions/asthma/diagnosing-asthma/
      HSE advice on asthma attacks: https://www2.hse.ie/conditions/asthma/asthma-attacks/
    links:
      Salbutamol inhaler guide: /health/medicines/salbutamol/
  high-blood-pressure-hypertension:
    aliases: hypertension raised blood pressure bp
    summary: High blood pressure means the pressure in your arteries stays raised. Most people feel well, so measurement
      is the way to find it.
    symptoms:
    - High blood pressure usually causes no symptoms. Feeling well is compatible with repeatedly high readings. Headaches
      or dizziness have many causes and cannot tell you whether your blood pressure is high.
    causes:
    - The longer pressure in the arteries stays raised, the more work the heart has to do. Over time the strain can damage
      blood vessels in the brain, kidneys and eyes.
    - Age and family history can raise risk. A clinician may also consider kidney disease, medicines and other contributors
      depending on your history.
    diagnosis:
    - Blood pressure changes during the day and with stress, activity and how it is measured. A GP may ask for readings
      at home or arrange a 24-hour monitor to check whether it stays high.
    - Bring the monitor or readings to your appointment. Ask what readings apply in your case and whether your cuff fits
      properly.
    care:
    - Treatment can include changes such as eating less salt and being more physically active. Whether medicine is advised
      depends on repeated readings, other health conditions and your overall risk of events such as stroke.
    - Ask your GP or pharmacist what your tablets do and how your pressure and any relevant blood tests will be followed
      up.
    complications:
    - High blood pressure increases the risk of stroke, heart disease, kidney damage and some eye problems. Identifying
      it and treating it early helps reduce long-term risk.
    help:
    - Arrange a check with your GP, practice nurse or a pharmacy that offers checks. Contact your GP about repeatedly
      high readings. Follow your maternity team's advice if you are pregnant, as raised blood pressure in pregnancy needs
      separate assessment.
    sources:
      HSE hypertension treatment: https://www2.hse.ie/conditions/high-blood-pressure-hypertension/treatment/
    links:
      What helps lower blood pressure: /health/lower-blood-pressure-naturally-what-works/
  high-cholesterol:
    aliases: raised cholesterol hypercholesterolaemia ldl lipid
    summary: High cholesterol usually comes to light on a blood test. The result helps your GP assess your overall risk
      of a heart attack or stroke.
    symptoms:
    - Raised cholesterol usually causes no symptoms. Some people first learn about it after a cardiovascular event or
      when a blood test is done for another reason.
    causes:
    - Cholesterol circulates in particles called lipoproteins. Higher levels of LDL cholesterol can contribute to a build-up
      of plaque in artery walls. Over time this can restrict blood flow or lead to a sudden blockage.
    - Inherited factors can have a major effect. Tell your GP if close relatives had a heart attack or stroke unusually
      young or have been told they have familial hypercholesterolaemia.
    diagnosis:
    - A blood test can measure different components, including LDL cholesterol, HDL cholesterol and triglycerides. The
      interpretation depends on why the test was done and your wider cardiovascular history.
    - A GP may consider your age, smoking, blood pressure and diabetes status alongside your result. A single total cholesterol
      value cannot give the whole risk picture.
    care:
    - Treatment can include dietary changes and medicines such as statins. The potential benefit depends partly on your
      starting risk, so ask what the result means for you and when to repeat the test.
    complications:
    - Cholesterol-related plaque can contribute to coronary heart disease, stroke and problems with circulation in the
      legs.
    help:
    - Speak to your GP if a test shows a high result, or if early heart disease runs in your family. Bring the full set
      of results if they were taken elsewhere.
    sources:
      HSE cholesterol diagnosis: https://www2.hse.ie/conditions/high-cholesterol/diagnosis/
    links:
      What lowers LDL cholesterol: /health/how-to-lower-cholesterol-what-moves-ldl/
      Statins and cardiovascular risk: /health/medicines/statins/
  coeliac-disease:
    aliases: celiac gluten enteropathy
    summary: Coeliac disease is an immune reaction to gluten that damages the lining of the small bowel. It can cause
      digestive symptoms, tiredness or nutrient deficiencies.
    symptoms:
    - Possible signs include diarrhoea, bloating, stomach pain, weight loss or persistent fatigue. In children, poor
      growth can be a clue. Some people have few obvious digestive symptoms.
    causes:
    - Gluten proteins in wheat, barley and rye trigger an immune response in people with coeliac disease. It can damage
      the villi, the tiny structures that absorb nutrients from food.
    - A close family history raises the likelihood. Symptoms can overlap with irritable bowel syndrome, making it useful
      to test before making a permanent change to your diet.
    diagnosis:
    - A GP can arrange a blood test and may refer you to a specialist for further testing. Whether a biopsy is needed
      depends on your situation and the diagnostic pathway.
    - Keep eating gluten while you discuss testing with your GP. Starting a gluten-free diet before testing can affect
      the results. If you already avoid gluten, ask about your options before changing your diet again.
    care:
    - A lifelong gluten-free diet is the main treatment after diagnosis. A dietitian can help you spot hidden sources,
      reduce cross-contact and plan meals with enough fibre, iron and other nutrients.
    complications:
    - Ongoing bowel damage can contribute to iron deficiency anaemia and weaker bones. Follow-up can help identify nutritional
      problems even if stomach symptoms improve.
    help:
    - Ask your GP about testing if bowel symptoms persist, you have unexplained anaemia or a close relative has coeliac
      disease. Mention if a child is losing weight or growing more slowly than expected.
  cystic-fibrosis:
    aliases: cf cftr
    summary: Cystic fibrosis is an inherited condition that can affect the lungs and digestion. In Ireland, specialist
      cystic fibrosis centres coordinate regular care.
    symptoms:
    - Signs can include a long-lasting cough, repeated chest infections, difficulty gaining weight or bulky, greasy stools.
      The combination and severity vary from one person to another.
    causes:
    - Variants in the CFTR gene affect how salt and water move across cell surfaces. Secretions in the lungs and digestive
      system can become thicker. Mucus can be harder to clear from the airways and digestive enzymes may have difficulty
      reaching the bowel.
    diagnosis:
    - Newborn bloodspot screening can identify babies who need further tests. A sweat chloride test and genetic testing
      can help confirm a diagnosis. A clinician may also investigate someone who develops suggestive symptoms later.
    care:
    - Care can involve airway clearance, treatment for chest infections and pancreatic enzymes where needed. Some people
      can take CFTR modulators, which target the underlying protein problem. Suitability depends on each person's gene
      variants and clinical circumstances.
    - A specialist team can coordinate physiotherapy, nutrition, lung monitoring and transition from paediatric to adult
      care.
    complications:
    - Repeated chest infections can damage the lungs. Some people develop nutrition problems, CF-related diabetes or
      complications affecting other organs, which the CF team monitors.
    help:
    - If you have CF, ask your centre whom to contact if your cough changes, your breathing worsens or you develop fever.
      If a baby has been referred after newborn screening, attend the follow-up even if the baby seems well.
  endometriosis:
    aliases: endo pelvic pain painful periods
    summary: Endometriosis can cause pelvic pain, painful periods or difficulties getting pregnant when tissue similar
      to the womb lining grows elsewhere.
    symptoms:
    - Common symptoms include pelvic pain, periods that disrupt daily life, pain deep during or after sex and pain when
      opening your bowels or passing urine, particularly around a period. Some people have difficulty becoming pregnant.
    - A diary can record the timing, what makes the pain worse and how it affects sleep, work, school or exercise. Pain
      can have other causes as well.
    causes:
    - Tissue similar to the lining of the womb can grow outside it, often around the ovaries or elsewhere in the pelvis.
      It can cause inflammation and sometimes scarring or ovarian cysts.
    diagnosis:
    - A GP can assess symptoms and may arrange an examination, ultrasound or onward referral. A normal scan can miss
      some forms of endometriosis, so ongoing symptoms still deserve assessment.
    - Your GP can discuss starting treatment while the assessment continues. Some people need a specialist evaluation
      or keyhole surgery.
    care:
    - Options include pain relief, hormonal treatment and, for some people, surgery. The best fit depends on symptoms,
      preferences and whether trying to get pregnant is a priority.
    complications:
    - Pelvic pain can affect work, relationships and wellbeing. Endometriosis can also make it harder to conceive, although
      many people with the condition do become pregnant.
    help:
    - Speak to your GP if pain interferes with ordinary activities or treatment has not helped. Bring your symptom diary
      and explain if fertility is a concern.
    sources:
      HSE National Framework for the Management of Endometriosis: https://about.hse.ie/publications/a-national-framework-for-the-management-of-endometriosis-in-ireland/
  epilepsy:
    aliases: seizures fits
    summary: Epilepsy is a neurological condition that causes a tendency to have repeated seizures. Some seizures involve
      staring or confusion, while others cause falls or shaking.
    emergency: If it is a first seizure, lasts longer than five minutes, another follows without recovery, or the person
      is seriously injured or has trouble breathing, call
    symptoms:
    - The signs depend on where abnormal electrical activity starts and how far it spreads. Someone may stare, become
      confused, experience unusual sensations or develop stiffening and jerking.
    - Recovery also varies. The person may be tired, confused or have limited memory of the event afterwards.
    causes:
    - Seizures arise from a temporary disruption in the brain's electrical activity. Epilepsy can have a genetic, structural
      or other cause. Sometimes the cause remains unknown after investigation.
    diagnosis:
    - A detailed description from the person or a witness can help. A specialist may use an EEG to record brain activity
      and may arrange imaging. A clinician evaluates possible causes, since fainting and some other conditions can resemble
      a seizure.
    care:
    - Anti-seizure medicines reduce seizures for many people. Treatment and safety planning depend on the seizure type
      and circumstances. Ask the epilepsy team about medicine reviews, driving rules and what to do when a seizure occurs.
    complications:
    - Seizures can lead to injury or affect daily activities. A seizure that continues or repeats without recovery is
      an emergency.
    help:
    - During a convulsive seizure, time it, move hazards away, protect the person's head and stay with them. Avoid holding
      them down or placing anything in their mouth. Follow their individual care plan if one is available.
    sources:
      Epilepsy Ireland seizure first aid: https://www.epilepsy.ie/content/seizure-first-aid
  stroke:
    aliases: cva brain attack fast
    summary: A stroke happens when blood flow to part of the brain is blocked or when bleeding occurs in the brain. Getting
      emergency help quickly can affect the outcome.
    emergency: For sudden face drooping, arm weakness, speech difficulty or another suspected stroke symptom, call
    symptoms:
    - Think FAST. Check for sudden changes to the face, difficulty lifting an arm, or slurred or confused speech. Time
      matters. Sudden vision changes, balance problems or weakness on one side can also occur.
    - Symptoms that clear quickly still need emergency assessment, as a transient ischaemic attack can have the same
      signs.
    causes:
    - An ischaemic stroke occurs when a blockage interrupts blood flow. A haemorrhagic stroke involves bleeding. In both,
      brain cells can be injured and the treatment depends on the cause.
    diagnosis:
    - A hospital team examines symptoms and uses a brain scan to distinguish bleeding from a blockage. Blood tests, heart
      rhythm checks and further scans can help identify why it happened.
    care:
    - Some people with an ischaemic stroke can receive urgent treatment to dissolve or remove a clot. The stroke team
      uses scan findings, time since onset and clinical information to make this decision.
    - Rehabilitation may help with movement, speech, swallowing and everyday tasks. The team also looks at how to lower
      the risk of another stroke.
    complications:
    - Effects vary and can include changes to strength, sensation, language, vision, memory or swallowing. Recovery differs
      by person and can continue well beyond the hospital stay.
    help:
    - Call emergency services when symptoms start. If you know when the person was last well, tell the ambulance team.
      Seek help again if symptoms recur.
    sources:
      Irish National Audit of Stroke: https://www.noca.ie/audits/irish-national-audit-of-stroke/
  sepsis:
    aliases: septic shock blood poisoning
    summary: Sepsis is a medical emergency in which the body's response to an infection starts to damage its own tissues
      or organs.
    emergency: If someone may have sepsis or is deteriorating rapidly with an infection, call
    symptoms:
    - Warning signs can include new confusion, severe breathlessness, passing very little urine, cold or mottled skin,
      or feeling unusually and severely unwell. Signs in babies and children can differ from adults.
    - A person can have sepsis without a high temperature. Take a rapid deterioration, or somebody becoming hard to wake,
      seriously.
    causes:
    - Sepsis can develop from infections such as pneumonia, a urinary infection or an infection of the skin. The response
      to infection can affect circulation and prevent organs getting enough blood and oxygen.
    diagnosis:
    - There is no single home test for sepsis. Clinicians assess symptoms, vital signs and blood tests and look for the
      source of infection. Other tests depend on the person's condition.
    care:
    - Hospital treatment can include antibiotics when bacterial infection is suspected, fluid through a vein, oxygen
      when needed and treatment of the infection's source. Some people need intensive care or other organ support.
    complications:
    - Sepsis can cause organ failure and can be fatal. Recovery can involve persistent tiredness, weakness or problems
      with concentration. Ask your clinical team about follow-up if symptoms continue after discharge.
    help:
    - If someone with an infection is getting much worse, say clearly that you are worried about sepsis. Tell emergency
      staff about the infection, recent surgery or treatment and when the change began.
    links:
      Ireland’s sepsis strategy and warning signs: /news/ireland-sepsis-strategy-warning-signs-2026/
  copd:
    aliases: chronic obstructive pulmonary disease emphysema chronic bronchitis
    summary: Chronic obstructive pulmonary disease causes long-term airflow limitation. Breathlessness with ordinary
      activity and a persistent cough are common clues.
    emergency: If someone is struggling to breathe, cannot speak because of breathlessness or has blue or grey lips,
      call
    symptoms:
    - Common symptoms include increasing breathlessness on exertion, a persistent cough with phlegm, wheeze and repeated
      chest infections.
    - A flare-up is a change from your usual symptoms, such as becoming much more breathless or producing more phlegm
      than normal.
    causes:
    - COPD can involve damage to the tiny air sacs or long-term inflammation in the airways. This makes it harder to
      breathe air out. Tobacco smoke is a major risk factor. Workplace dust, fumes and some inherited conditions can
      also contribute.
    diagnosis:
    - A GP reviews symptoms and exposure history and may arrange spirometry, a test that measures how much and how quickly
      you can breathe air out. Other tests can help investigate alternative explanations.
    care:
    - If you smoke, your clinician can offer support to quit. Depending on symptoms, treatment may also include inhalers,
      vaccination advice and pulmonary rehabilitation.
    - A written flare-up plan can spell out when to contact the GP or respiratory team. Ask someone to check your inhaler
      technique before assuming a prescribed inhaler is failing.
    complications:
    - Flare-ups can require hospital care. Persistent symptoms can make daily activities harder and limit exercise. Rehabilitation
      can help people build confidence with activity and manage breathlessness.
    help:
    - Book a GP assessment if you have ongoing breathlessness or a cough that persists. If you have COPD and your breathing
      changes suddenly, follow your action plan and contact your clinical team promptly.
  atrial-fibrillation:
    aliases: af afib irregular heartbeat arrhythmia
    summary: Atrial fibrillation is an irregular heart rhythm that can cause palpitations and raise the risk of stroke.
      Some people only discover it during a pulse or heart rhythm check.
    emergency: If someone has signs of stroke, such as sudden facial droop, arm weakness or difficulty speaking, call
    symptoms:
    - Some people notice a racing or irregular heartbeat, breathlessness, fatigue or dizziness. Others have no symptoms.
      Episodes can come and go, so it helps to record when symptoms occur and how long they last.
    causes:
    - The upper chambers of the heart receive disorganised electrical signals. The heartbeat becomes irregular and may
      be fast. Blood can pool in part of the heart, where a clot can form and travel to the brain.
    diagnosis:
    - An ECG records the electrical rhythm. A clinician may arrange a longer recording if episodes are brief or intermittent.
      Other tests may look for underlying contributors, such as thyroid problems.
    care:
    - Your clinician may look at how to control the rate or restore the rhythm and will assess your risk of stroke and
      bleeding. An anticoagulant can reduce stroke risk for people who are likely to benefit.
    - Treatment discussions can cover rhythm procedures, what to do if symptoms recur and how to take medicines safely.
      A home device reading can help start a conversation with your GP.
    complications:
    - Atrial fibrillation increases the risk of stroke. Persistent high heart rates can also strain the heart. Some people
      continue to have symptoms that affect activity even when they're taking treatment.
    help:
    - Ask your GP about a pulse and rhythm check if you repeatedly notice a racing or irregular heartbeat. If palpitations
      come with suspected heart attack or stroke symptoms, seek emergency help.
  type-1-diabetes:
    aliases: t1d insulin-dependent diabetes dka juvenile diabetes
    summary: In type 1 diabetes the body makes little or no insulin. It needs prompt diagnosis and lifelong insulin treatment.
    emergency: For suspected diabetic ketoacidosis with vomiting, severe drowsiness or unusual deep or rapid breathing,
      call
    symptoms:
    - Drinking much more, passing urine more often, losing weight without trying and feeling extremely tired are common
      signs. Symptoms can build up quickly, especially in children.
    causes:
    - The immune system attacks the insulin-producing cells in the pancreas. Without enough insulin, glucose builds up
      in the blood and the body starts to use fat for energy, producing substances called ketones.
    diagnosis:
    - A GP can check blood glucose quickly when type 1 diabetes is suspected and arrange urgent hospital assessment if
      needed. The specialist team may check ketones and use additional tests to clarify the diabetes type.
    care:
    - People with type 1 diabetes need insulin. The diabetes team helps plan insulin, glucose monitoring, meals, activity
      and how to respond to low blood glucose.
    - Ask your team for a written sick-day plan and guidance on when to check ketones. Illness can change glucose and
      insulin requirements.
    complications:
    - Too little insulin can lead to diabetic ketoacidosis, an emergency. Insulin treatment can also lead to episodes
      of low blood glucose. Over time, monitoring and treatment help protect the eyes, kidneys, nerves and blood vessels.
    help:
    - Contact a GP urgently if you suspect new type 1 diabetes. If you already have it and your glucose or ketones rise,
      use your sick-day plan and contact the diabetes team when directed.
    sources:
      HSE advice on diabetic ketoacidosis: https://www2.hse.ie/conditions/type-1-diabetes/blood-glucose/ketones-and-diabetic-ketoacidosis-dka/
  type-2-diabetes:
    aliases: t2d diabetes glucose hba1c
    summary: Type 2 diabetes develops when the body cannot use insulin effectively or cannot make enough to keep blood
      glucose in a healthy range.
    symptoms:
    - Thirst, frequent urination, tiredness, blurred vision and slow-healing cuts can occur. Symptoms often build gradually
      and some people first find out through a routine blood test.
    causes:
    - Insulin normally helps move glucose from the blood into cells. In type 2 diabetes, tissues respond less efficiently
      to insulin and the pancreas may not keep up. Family history, age and a history of gestational diabetes can increase
      risk.
    diagnosis:
    - A GP can arrange a blood test. HbA1c is one test used to assess average glucose over recent months. You may need
      another test to confirm the result, depending on symptoms and the result.
    care:
    - Treatment can include changes to diet and activity, medicines and regular monitoring. A care team considers your
      preferences and conditions such as kidney or heart disease when discussing options.
    - Ask when to have your eyes, feet, kidneys and blood pressure checked. A plan should cover follow-up even when you
      feel well.
    complications:
    - Over time, raised glucose can damage blood vessels and nerves. Heart, kidney, eye and foot problems can develop,
      which is why follow-up covers more than glucose alone.
    help:
    - Speak to your GP if you have symptoms or were told you have pre-diabetes. If you already have diabetes and notice
      a new foot wound or infection, contact your care team promptly.
  migraine:
    aliases: migraine with aura migraine headache
    summary: Migraine is a neurological condition that causes recurring attacks. Head pain, nausea and sensitivity to
      light or sound are common, and some people experience aura.
    emergency: If a headache reaches severe intensity suddenly, or comes with new facial droop, weakness or difficulty
      speaking, call
    symptoms:
    - An attack may bring moderate or severe head pain, sometimes on one side. Moving around may make the pain worse
      and ordinary sound or light may feel difficult to tolerate.
    - Some people have aura, such as flashing lights or changes in vision. Other people have migraine attacks without
      aura.
    causes:
    - Migraine involves changes in how the brain and nerves process signals, including pain and sensory information.
      It can run in families. Irregular sleep, missed meals or hormonal changes may be associated with attacks in some
      people.
    diagnosis:
    - A GP usually starts with the pattern of symptoms and a neurological examination. Keeping a diary of timing, symptoms,
      duration and medicines can help.
    care:
    - Your GP can discuss medicines to take during an attack and whether preventive treatment is suitable. Bring a list
      of the medicines you use, including over-the-counter pain relief and how often you take it.
    - Keeping meals, hydration and sleep relatively regular may help some people manage their attacks.
    complications:
    - Frequent migraine can interfere with work, study, sleep and family responsibilities. Frequent use of some acute
      medicines can contribute to medication-overuse headache.
    help:
    - Speak to your GP if headaches recur, are becoming harder to manage or begin to follow a different pattern. New
      sudden neurological symptoms need emergency assessment even when you have a history of migraine.
  norovirus:
    aliases: winter vomiting bug stomach bug
    summary: Norovirus commonly causes sudden vomiting and diarrhoea. It spreads easily, so recovering at home and taking
      care with handwashing can help protect others.
    symptoms:
    - The illness often begins with nausea, vomiting or watery diarrhoea. Some people also have stomach cramps, aches
      or fever. Most people recover within a few days.
    causes:
    - The virus can pass from person to person and via surfaces, food or water. It can spread readily in households and
      other shared settings.
    diagnosis:
    - The pattern of symptoms often guides care. A clinician may arrange a sample where the cause needs clarification,
      for example when investigating an outbreak.
    care:
    - Take small, frequent sips if you are vomiting. A pharmacist can advise about oral rehydration products. Wash hands
      with soap and water and clean contaminated surfaces.
    - Follow HSE advice to stay away from work or school until at least 48 hours after symptoms stop. Avoid visiting
      hospitals or care homes during that period.
    complications:
    - The main concern is dehydration, particularly in babies, older adults and people with other health problems. Watch
      for passing less urine, or fewer wet nappies in a baby.
    help:
    - Contact a GP if you cannot keep fluids down, notice signs of dehydration, have blood in your stool or are concerned
      about a baby or a vulnerable adult.
  measles:
    aliases: rubeola mmr rash
    summary: Measles is a highly contagious viral illness that can cause fever, cough and a rash. Phone ahead if you
      think you or your child may have it.
    symptoms:
    - Signs often begin with a fever, cough, runny nose or sore red eyes. The rash typically starts on the face or head
      before spreading down the body. It can be more difficult to see on darker skin.
    causes:
    - The measles virus spreads through the air when someone with the infection breathes, coughs or sneezes. Measles
      can spread before the rash appears.
    diagnosis:
    - A clinician asks about symptoms, vaccination, travel and possible exposure. Testing can confirm measles and helps
      public health teams respond to cases.
    care:
    - Care focuses on symptoms and monitoring for complications. Stay away from others and follow isolation advice from
      your clinician or public health team. The MMR vaccine helps prevent measles.
    complications:
    - Measles can cause ear infections, pneumonia and, more rarely, inflammation of the brain. Babies, pregnant people
      and people with weakened immune systems may need particular advice after exposure.
    help:
    - Phone your GP before visiting if you suspect measles. Let them know if anyone exposed is pregnant, is a baby or
      has a weakened immune system. If someone becomes severely breathless or very difficult to wake, call emergency
      services.
  transient-ischaemic-attack-tia:
    aliases: mini stroke mini-stroke transient ischemic attack
    summary: A transient ischaemic attack causes sudden stroke-like symptoms that resolve. It can be an early warning
      of a future stroke and needs emergency assessment.
    emergency: If you notice sudden face drooping, arm weakness or problems speaking, even if the symptoms have stopped,
      call
    symptoms:
    - Signs can include sudden weakness or numbness on one side, a drooping face, speech difficulty or loss of vision.
      Symptoms can clear before help arrives.
    causes:
    - A temporary interruption of blood flow to part of the brain produces symptoms. An underlying cause could be disease
      in the blood vessels or a clot associated with a heart rhythm problem such as atrial fibrillation.
    diagnosis:
    - The team takes a history of exactly what happened and when. They may use brain or blood vessel imaging, heart rhythm
      tests and blood tests to investigate the cause.
    care:
    - The treatment plan depends on the cause. The team may prescribe medicine to help prevent clots, treat blood pressure
      or cholesterol, or investigate whether a procedure could help.
    complications:
    - A TIA often leaves no lasting symptoms, but the risk of stroke can be higher soon afterwards. Fast assessment gives
      clinicians the opportunity to start preventive treatment.
    help:
    - Seek emergency help even when the person feels well again. Note when symptoms began and when they resolved. If
      you already have a care plan, report new symptoms as an emergency.
  coronary-heart-disease-chd:
    aliases: ischemic heart disease coronary artery disease cad chd
    summary: Coronary heart disease develops when the arteries supplying the heart become narrowed. It can cause angina
      or lead to a heart attack.
    emergency: If you suspect a heart attack, including new pressure or tightness in the chest with breathlessness, sweating
      or pain spreading to an arm or jaw, call
    symptoms:
    - Symptoms can include chest pressure, tightness or breathlessness during exertion. Angina can sometimes feel like
      discomfort in the arm, jaw, neck or back. The pattern varies between people.
    causes:
    - Atherosclerosis happens when plaque builds up in artery walls. It can reduce blood flow when the heart needs more
      oxygen, for example during exercise. If plaque ruptures and a clot forms, blood flow may stop suddenly.
    diagnosis:
    - A GP or hospital team reviews symptoms and risk factors. Tests may include an ECG, blood tests and imaging to assess
      how blood flows to the heart.
    care:
    - Care can include medicines, support to stop smoking, activity advice or a procedure to improve blood flow. Ask
      your clinician how to manage symptoms and how to reduce the risk of a future heart attack.
    complications:
    - A heart attack can damage the heart muscle. Coronary disease can also contribute to changes in heart rhythm, heart
      failure and reduced exercise capacity.
    help:
    - Tell your GP about recurring discomfort or breathlessness on exertion. Seek emergency help if there are suspected
      heart attack symptoms or a sudden and severe change.
  pre-diabetes:
    aliases: prediabetes impaired glucose tolerance impaired fasting glucose
    summary: Pre-diabetes means your blood glucose is higher than expected but below the range used to diagnose diabetes.
      It identifies an increased risk of type 2 diabetes.
    symptoms:
    - Most people have no obvious symptoms and find out after a blood test. Tell your GP if you develop unusual thirst,
      frequent urination or unexplained weight loss, since other assessments may be needed.
    causes:
    - Blood glucose can rise when tissues become less responsive to insulin or the pancreas cannot produce enough to
      compensate. Family history, age and previous gestational diabetes can increase risk.
    diagnosis:
    - A GP can interpret tests such as HbA1c, which reflects average glucose over recent months. The interpretation depends
      on the test used and individual circumstances.
    care:
    - A realistic plan often starts with changes to activity and food that you can sustain. Ask your GP whether a programme
      is available in your area and when to repeat your blood test.
    complications:
    - Some people with pre-diabetes go on to develop type 2 diabetes, while others return to a lower glucose range. A
      GP may also review blood pressure, cholesterol and smoking because they affect cardiovascular risk.
    help:
    - Arrange follow-up after a result in the pre-diabetes range. Bring previous results when you can, and contact your
      GP sooner if new symptoms develop.
  bowel-cancer:
    aliases: colorectal cancer colon cancer rectal cancer
    summary: Bowel cancer usually means cancer of the colon or rectum. Bleeding, changes in bowel habits and unexplained
      anaemia are reasons to speak to a GP.
    symptoms:
    - Possible signs include blood in or on your stool, a lasting change in how often you go to the toilet, unexplained
      weight loss or abdominal pain. Some people have fatigue because of anaemia.
    - These signs can have other causes. New symptoms that last or keep returning deserve assessment even if they are
      mild.
    causes:
    - Bowel cancer starts when cells in the colon or rectum grow out of control. Some cancers develop from growths called
      polyps. The likelihood rises with age, and family history can change your risk.
    diagnosis:
    - A GP asks about symptoms and medical and family history, and may arrange an examination or tests. If bowel cancer
      is suspected, a specialist may examine the bowel with a colonoscopy and take a sample to test.
    - BowelScreen is a screening programme for people in eligible groups. If you have symptoms, contact a GP even if
      you recently had a screening test or are waiting for an invitation.
    care:
    - Treatment depends on where the cancer is, whether it has spread and your health and preferences. It can involve
      surgery, medicines and, for some rectal cancers, radiotherapy.
    complications:
    - A tumour can bleed or sometimes obstruct the bowel. Follow-up after treatment can also address changes to bowel
      habits, diet, recovery and stoma care where relevant.
    help:
    - Make a GP appointment if you notice bleeding, unexplained weight loss or a persistent change in bowel habits. Severe
      pain, vomiting and a swollen abdomen need urgent assessment.
  breast-cancer-women:
    aliases: breast lump breast tumour breast cancer
    summary: Breast cancer can cause a new lump or other changes in a breast, but some cases are found on screening before
      there are any symptoms.
    symptoms:
    - Look out for a new lump or thickening, an armpit lump, a nipple change or unusual discharge, and skin dimpling
      or changes in breast shape. Tell a GP if you notice a change from what is normal for you.
    causes:
    - Breast cancer occurs when cells in breast tissue grow abnormally. Risk can be affected by age, some inherited gene
      changes and other factors. A family history can guide whether you need a separate risk assessment.
    diagnosis:
    - A GP may refer you to a breast clinic. The team may examine you, perform mammography or ultrasound and take a tissue
      sample. Testing the sample can show which treatments are likely to help.
    care:
    - Treatment can include surgery, radiotherapy, hormone-blocking treatment, chemotherapy or targeted medicines. The
      treatment plan depends on the type and stage of cancer and your preferences.
    - Ask the team about rehabilitation, managing treatment effects and whom to contact between appointments.
    complications:
    - Breast cancer can spread beyond the breast. Treatment and recovery can also affect arm movement and wellbeing.
      Report persistent swelling or new concerns to your care team.
    help:
    - Contact your GP about a new breast change. BreastCheck is for eligible people without symptoms. If you have symptoms,
      make a GP appointment even if you recently had a screening mammogram.
  gestational-diabetes:
    aliases: gdm pregnancy diabetes high blood sugar pregnancy
    summary: Gestational diabetes is raised blood glucose first identified during pregnancy. Tests and a follow-up plan
      help protect both the pregnant person and baby.
    symptoms:
    - Many people have no obvious symptoms and find out on a blood test. Unusual thirst or passing urine more often can
      occur but can also have other explanations in pregnancy.
    causes:
    - Pregnancy-related changes make the body less sensitive to insulin. If the pancreas cannot make enough extra insulin
      to compensate, blood glucose can rise.
    diagnosis:
    - A maternity team can arrange an oral glucose tolerance test. This measures how the body handles glucose after a
      glucose drink. Testing schedules can vary with your history and local maternity pathway.
    care:
    - Your team may show you how to measure glucose at home and explain changes to food and activity. Some people need
      medication. Monitoring during pregnancy and around birth is tailored to individual circumstances.
    - Ask when to have your glucose rechecked after birth and how often to see your GP for longer-term follow-up.
    complications:
    - Raised glucose can increase the chance of a larger baby and some birth complications. The baby's glucose can fall
      after delivery. A history of gestational diabetes also raises later type 2 diabetes risk.
    help:
    - Contact your maternity team with questions about an upcoming test, or about readings outside the range they gave
      you. Follow their urgent-care advice for any sudden changes in how you feel or in your baby's movements.
  cervical-cancer:
    aliases: cancer of the cervix cervical tumour
    summary: Cervical cancer starts in the cervix, the lower part of the womb. New bleeding or other unusual changes
      deserve assessment even if you attend routine screening.
    symptoms:
    - Possible signs include bleeding after sex, between periods or after menopause. Changes in discharge or pelvic pain
      can also occur, though other conditions can give similar symptoms.
    causes:
    - Persistent infection with certain types of human papillomavirus, or HPV, can cause changes in cervical cells over
      time. Most HPV infections clear without causing cancer.
    diagnosis:
    - A GP asks about symptoms and may examine you or refer you. A specialist can assess the cervix and take a tissue
      sample if needed. Cervical screening checks for risk and changes before symptoms develop.
    care:
    - Treatment depends on the stage and individual circumstances. It can include surgery, radiotherapy or medicines.
      Tell your care team if preserving fertility is important when reviewing the options.
    complications:
    - Cervical cancer can spread to nearby organs or beyond the pelvis. Follow-up can also address bladder, bowel, sexual
      health and other effects of treatment.
    help:
    - Contact your GP about unexpected vaginal bleeding, unusual discharge or persistent pelvic symptoms. Attend screening
      when invited, and contact your GP about symptoms even after a recent screening result.
  skin-cancer-melanoma:
    aliases: melanoma malignant melanoma changing mole
    summary: Melanoma is a skin cancer that can show up as a new mark or a changing mole. A GP can assess a change and
      refer it for specialist examination.
    symptoms:
    - Pay attention to a new or changing mark. Warning signs include an uneven shape or border, multiple colours and
      a change in size, shape or colour. Some melanomas look different from nearby moles and some may bleed or crust.
    - Melanoma can develop on any skin tone. It can occur in areas that get little sun, including the soles, palms or
      under a nail.
    causes:
    - It begins in the cells that produce skin pigment. Ultraviolet exposure is an important risk factor, though personal
      and family history and other factors also matter.
    diagnosis:
    - A clinician examines the mark and may use a magnifying instrument. Removing the suspicious area and examining the
      tissue can confirm whether it is melanoma.
    care:
    - Surgery is often the main treatment for early melanoma. A specialist considers the depth and other features to
      plan further surgery, tests, follow-up or additional treatment.
    complications:
    - Melanoma can spread to lymph nodes or other parts of the body. Its depth and stage help the team discuss the outlook
      and follow-up plan.
    help:
    - Make a GP appointment if you notice a new unusual mark or a mole changing over time. Photos with dates can help
      you describe the change, while clinical assessment is still needed.
  clinical-depression:
    aliases: major depression depressive disorder low mood
    summary: Clinical depression can affect mood, energy, sleep and the ability to get through everyday activities. A
      GP can help assess symptoms and discuss support and treatment.
    emergency: If you or someone else is in immediate danger, call
    symptoms:
    - Common signs include lasting low mood, loss of interest in things you usually enjoy, fatigue, changes in sleep
      or appetite, and difficulty concentrating. The signs can be different from one person to another.
    - Pay attention to how long the changes last and how much they affect work, relationships and ordinary tasks. Depression
      can also involve feelings of guilt, hopelessness or thoughts of suicide.
    causes:
    - Several factors can contribute, including family history, illness, major life changes and sustained stress. Depression
      can develop without an obvious trigger.
    diagnosis:
    - A GP asks about symptoms, how long they have lasted and their effect on your life. They may ask about medicines,
      physical health and distinct episodes of unusually high energy or mood because these details can affect the assessment.
    care:
    - Talking therapies and antidepressant medicines are among the treatment options. A plan depends on severity, your
      preferences and earlier treatments. Agree when you will review how it is going and where to get help if symptoms
      worsen.
    complications:
    - Depression can affect work, relationships, physical health and safety. Some people have repeated episodes. Follow-up
      can help identify returning symptoms.
    help:
    - Contact your GP if low mood or loss of interest persists or makes everyday life difficult. Seek urgent help if
      you feel unable to stay safe.
  back-pain:
    aliases: low back pain lower back ache lumbar pain lumbago
    summary: Back pain is common and can limit movement, sleep and work. A GP or physiotherapist can help assess persistent
      symptoms, and a few specific warning signs need urgent attention.
    symptoms:
    - Pain can feel like an ache or stiffness, and may change with movement or position. Pain that travels into a leg,
      with tingling, weakness or numbness, can suggest irritation of a nerve.
    causes:
    - Pain may start after lifting or unaccustomed activity, or it can develop without a clear event. Muscles, joints
      and other tissues in the back can all contribute. Sometimes a disc or other structure presses on a nerve.
    diagnosis:
    - A clinician asks where the pain started, what makes it better or worse and whether there are leg or bladder symptoms.
      They may check strength and sensation. Many people with ordinary back pain do not need a scan early on.
    care:
    - Staying gently active within your ability can help many people. A GP or physiotherapist can discuss exercises,
      ways to keep moving and options for pain relief.
    - Tell the clinician what you need to get back to doing, such as driving, lifting, sleeping or caring for someone,
      so you can plan a gradual return.
    complications:
    - Persistent pain can interrupt sleep, limit movement and make work harder. Some less common causes can lead to weakness
      or loss of sensation and need specific care.
    help:
    - Get emergency assessment for new numbness around the genitals or bottom, difficulty passing urine, new loss of
      bladder or bowel control, or weakness affecting both legs. Speak to a GP if pain persists, is severe, or keeps
      you from usual activity.
  urinary-incontinence:
    aliases: bladder leakage overactive bladder stress incontinence urge incontinence
    summary: Urinary incontinence means leaking urine unintentionally. The pattern of leakage helps identify which treatments
      and practical supports could help.
    symptoms:
    - Leakage with a cough, laugh or exercise is typical of stress incontinence. A sudden strong urge followed by leakage
      suggests urgency incontinence. Some people experience both patterns.
    causes:
    - Changes in pelvic floor support, bladder function or how completely the bladder empties can contribute. Pregnancy,
      childbirth, prostate problems, medicines or other health conditions can be relevant.
    diagnosis:
    - A GP asks when the leakage happens and may arrange a urine test or examination. A diary of drinks, trips to the
      toilet, urges and leaks can make the pattern easier to see.
    care:
    - Depending on the cause, care may include pelvic floor physiotherapy, bladder training, changing when you drink
      certain fluids, medication or specialist assessment.
    - Tell your clinician which daily activities are affected. That can help you agree priorities such as being able
      to exercise, sleep or travel comfortably.
    complications:
    - Leakage can affect confidence, sleep, exercise and social activities. People may avoid going out or restrict drinks
      too much. An agreed care plan can address the symptoms and their effect on daily life.
    help:
    - Speak with your GP about recurrent leakage. Seek prompt advice about blood in the urine or difficulty emptying
      the bladder. New bladder symptoms with severe back pain and numbness around the genitals or bottom need emergency
      assessment.
  autism:
    aliases: autism spectrum autistic asd neurodivergence
    summary: Autism is a lifelong way of developing and experiencing the world. Autistic people may have different communication,
      sensory and support needs.
    symptoms:
    - Signs can include differences in communication or social interaction, a preference for predictable routines, deep
      interests or different responses to noise, light and other sensory input.
    - Signs can look different in children and adults. Some people consciously adapt how they interact in certain settings,
      so others may see only part of what they experience.
    causes:
    - Autism is a neurodevelopmental condition with a strong genetic contribution. It involves differences in how the
      brain develops. Each person's strengths and support needs can be different.
    diagnosis:
    - An assessment considers developmental history, current experiences and how the person manages different settings.
      An assessment for a child often draws on information from family and school. Adults can ask a GP about their referral
      options.
    care:
    - Support can involve adapting communication, sensory environments and daily routines. Where appropriate, occupational
      therapy, speech and language therapy or educational supports can help with specific needs.
    - Ask what can be put in place now at home, school or work as well as what options are available after an assessment.
    complications:
    - Busy settings, unanticipated changes and barriers to communication can cause distress or exhaustion. Anxiety, sleep
      difficulties or other health needs may also warrant attention in their own right.
    help:
    - Talk to your GP, public health nurse or the relevant service if development, communication, sensory needs or daily
      participation are a concern. Adults can bring examples from childhood and daily life to a referral discussion.
  obesity:
    aliases: weight management body mass index bmi
    summary: Obesity is a chronic condition involving excess body fat that can affect health. A healthcare professional
      can put measurements and personal risk factors in context.
    symptoms:
    - People can have different levels of fitness, mobility and health at a similar weight. Breathlessness with activity,
      joint pain or daytime tiredness can be worth discussing with your GP if they affect your life.
    causes:
    - Several factors influence body weight, including genetics, appetite regulation, medicines, sleep, health conditions
      and access to food, activity and care. The mix differs from person to person.
    diagnosis:
    - A clinician may use BMI and other measures, such as waist measurement, alongside medical history and blood tests.
      BMI describes the relationship between weight and height and has limits for assessing an individual's health.
    care:
    - Depending on the person, options can include support with eating, activity and sleep, medication or referral for
      specialist treatment. Agree goals that matter in daily life, such as moving more comfortably, managing another
      condition or improving sleep.
    complications:
    - Obesity is associated with a higher risk of type 2 diabetes, sleep apnoea, joint problems and some cardiovascular
      conditions. Individual risk depends on more than weight alone.
    help:
    - A GP can discuss whether symptoms, health checks or changes in weight warrant further assessment. Ask about supports
      available locally and what follow-up would involve.
  rsv:
    aliases: respiratory syncytial virus bronchiolitis
    summary: Respiratory syncytial virus usually causes a cold-like illness, but babies, older adults and some people
      with underlying conditions can become more unwell.
    emergency: If a child stops breathing, is struggling for breath or develops blue or grey lips, call
    symptoms:
    - Cough, runny nose, fever and reduced appetite can occur. In babies, feeding less, breathing faster or pulling in
      under the ribs when breathing can signal a more serious illness.
    causes:
    - RSV spreads through close contact and contaminated hands or surfaces. It can affect the small airways and lead
      to bronchiolitis, particularly in babies.
    diagnosis:
    - Clinicians assess breathing, hydration and other signs. Testing may be useful in some settings, but many mild illnesses
      can be managed based on symptoms.
    care:
    - Mild infections usually improve with supportive care. Offer fluids and keep an eye on breathing and feeding in
      children. If hospital care is needed, the team can provide support such as oxygen or fluids.
    - Ask your healthcare team about current HSE RSV immunisation guidance for eligible groups.
    complications:
    - RSV can lead to bronchiolitis, pneumonia or worsening of an existing heart or lung condition. Babies can become
      dehydrated if breathing problems reduce feeding.
    help:
    - Get urgent advice if breathing becomes harder, a baby feeds much less than usual or wet nappies become noticeably
      less frequent. Older adults with worsening breathing or underlying conditions should seek prompt advice.
  allergies:
    aliases: allergy allergic reaction hay fever food allergy
    summary: An allergy can cause anything from itchy eyes to a severe reaction. The symptoms, their timing and what you were exposed to help identify the cause.
    emergency: If someone develops throat or tongue swelling, difficulty breathing or faintness after a possible allergen exposure, use an adrenaline auto-injector if available and call
    symptoms:
    - Pollen and dust mite allergies often affect the eyes and nose. Food, medicine or insect-sting reactions may cause hives, swelling, wheezing or several symptoms at once.
    - Record what you ate, took or touched and how long it took for symptoms to start. The same rash can have several causes, so the surrounding details matter.
    causes:
    - The immune system reacts to a substance it recognises as a threat. In an immediate allergic reaction, immune cells release chemicals such as histamine, which can produce itching and swelling.
    - Food intolerance can cause symptoms after eating through a different mechanism. The distinction affects which tests and precautions are appropriate.
    diagnosis:
    - Your GP can review the pattern, examine you and refer you for specialist tests if appropriate. A skin-prick test or specific IgE blood test can help answer a targeted question when interpreted alongside your history.
    care:
    - Treatment depends on the trigger and severity. A pharmacist or GP can advise on treatments for mild nasal or skin symptoms. Discuss unexplained food reactions before making major changes to your diet or your child's diet.
    - If prescribed adrenaline auto-injectors, ask for a demonstration and a written action plan. Make sure the people who may need to help you know where you keep them.
    complications:
    - Ongoing symptoms can affect sleep and aggravate asthma. Anaphylaxis can develop rapidly and requires emergency care.
    help:
    - Speak to your GP after an unexplained reaction, if reactions recur or if they affect breathing. Seek emergency help immediately for suspected anaphylaxis.
    sources:
      HSE anaphylaxis and emergency response: https://www2.hse.ie/conditions/anaphylaxis/
  diabetes:
    aliases: diabetes mellitus high blood sugar insulin HbA1c
    summary: Diabetes raises blood glucose. Which type you have determines your treatment, and regular checks can spot problems before symptoms develop.
    emergency: If someone with suspected or known diabetes is very unwell with vomiting, rapid breathing or confusion and needs an ambulance, call
    symptoms:
    - Common signs include urinating more often, unusual thirst, tiredness and unexplained weight loss. Type 1 symptoms can develop quickly. Type 2 diabetes may develop gradually and can be discovered on a blood test.
    causes:
    - In type 1 diabetes, the immune system damages the pancreatic cells that make insulin. In type 2 diabetes, the body responds less effectively to insulin and insulin production may become insufficient over time.
    - Gestational diabetes develops during pregnancy. It has its own testing and follow-up, including a check after birth.
    diagnosis:
    - A clinician uses blood tests and the pattern of symptoms. HbA1c reflects average glucose over recent months. Rapidly developing symptoms need immediate assessment and testing suited to an acute presentation.
    care:
    - People with type 1 diabetes need insulin. Type 2 care may include help with nutrition and activity, medicines and sometimes insulin. Your care team can explain your glucose targets and what to do when you are unwell.
    - Ask about checks for kidneys, feet and blood pressure, and about registration for the HSE Diabetic RetinaScreen programme.
    complications:
    - Over time, raised blood glucose can damage blood vessels and nerves. Insulin and some other treatments can cause low blood glucose. Diabetic ketoacidosis can develop quickly and needs hospital treatment.
    help:
    - Contact a GP promptly if you or your child develop marked thirst, frequent urination or unexplained weight loss. Vomiting or rapid breathing with suspected diabetes warrants immediate medical assessment.
    sources:
      HSE diabetic ketoacidosis: https://www2.hse.ie/conditions/type-1-diabetes/blood-glucose/ketones-and-diabetic-ketoacidosis-dka/
  cancer:
    aliases: cancer warning signs tumour malignancy oncology biopsy
    summary: Cancer is a group of diseases where cells grow abnormally. The site, type and stage of the cancer guide testing and treatment.
    symptoms:
    - A new lump, unusual bleeding, cough that persists, change in bowel habits or weight loss without trying can warrant investigation. The pattern and how long the change has lasted help a GP decide what to investigate.
    causes:
    - Changes in a cell can allow it to grow and divide when it should stop. Some cancers can invade nearby tissues or travel through blood or lymph to other parts of the body.
    - Risk factors differ by cancer. Age, smoking, certain infections and inherited changes contribute to different cancers. A person's risk factors alone cannot determine whether a symptom is cancer.
    diagnosis:
    - Your GP starts with your symptoms and may arrange tests or a specialist referral. Scans show where changes are, and examination of a tissue sample can often identify the cancer type. Stage describes how far it has spread.
    care:
    - The specialist team may discuss surgery, radiotherapy or medicines such as chemotherapy, hormone therapy, immunotherapy or targeted treatment. The choices depend on your diagnosis and the goals of treatment.
    - Ask who to contact about side effects and what support is available for fatigue, pain, work or family concerns.
    complications:
    - Cancer and its treatments affect people differently. National survival and prevalence figures describe groups of people. A specialist can explain what the cancer type, stage and test results mean for your own outlook.
    help:
    - Speak to your GP about a persistent or unexplained change, including one noticed between screening appointments. Tell them when it began and whether it is getting worse.
    sources:
      HSE signs and symptoms: https://www2.hse.ie/conditions/cancer/signs-and-symptoms/
  pancreatic-cancer-symptoms:
    aliases: pancreatic cancer pancreas cancer jaundice
    summary: Pancreatic cancer may cause jaundice, weight loss or pain in the upper abdomen or back. Tests help establish whether it can be removed surgically.
    symptoms:
    - Jaundice can make the eyes or skin look yellow and may come with itching, dark urine or pale stools. Other changes include losing weight without trying, poor appetite and pain in the upper abdomen that may spread to the back.
    causes:
    - The pancreas makes digestive enzymes and hormones including insulin. A tumour can interfere with digestion or block the nearby bile duct. A blockage helps explain why jaundice, pale stools and dark urine can occur together.
    diagnosis:
    - A GP may arrange blood tests and refer you for imaging. CT can show the location of a suspected tumour and whether nearby blood vessels or other organs are involved. Some people have an endoscopic ultrasound and a tissue sample.
    care:
    - The specialist team assesses whether surgery is an option and discusses chemotherapy, other treatments and symptom control. A stent can sometimes relieve a blocked bile duct.
    - Report weight loss and changes in stool to the team. A dietitian can help with nutrition, and pancreatic enzyme replacement may be considered when the pancreas cannot supply enough enzymes.
    complications:
    - Blocked bile flow, difficulty absorbing food and changes in blood glucose can create problems during care. Follow-up should include a way to report worsening symptoms between appointments.
    help:
    - Seek urgent medical advice if you develop jaundice. Arrange a GP assessment for persistent upper-abdominal or back pain, ongoing changes in digestion or unexplained weight loss.
    sources:
      HSE diagnosis and tests: https://www2.hse.ie/conditions/pancreatic-cancer-symptoms/diagnosis/
      HSE treatment and supportive care: https://www2.hse.ie/conditions/pancreatic-cancer-symptoms/treatment/
  lung-cancer:
    aliases: lung tumour non-small cell small-cell lung cancer
    summary: Lung cancer can cause a persistent cough, coughing up blood or breathlessness. The type and stage help determine which treatments are suitable.
    symptoms:
    - A new cough that will not settle, a change in a longstanding cough, coughing up blood or repeated chest infections can prompt investigation. Some people develop breathlessness, chest discomfort or unexplained weight loss.
    causes:
    - Cancer can start in the lung or airway. Tobacco smoke is a major risk factor, and lung cancer can also develop in people who have never smoked. The main groups are non-small cell and small cell lung cancer.
    diagnosis:
    - A GP may arrange a chest X-ray or refer you to a rapid access lung clinic. CT gives a more detailed view, and a biopsy can identify the cancer type. The specialist may use a bronchoscopy to examine the airways and take a sample.
    - PET-CT can help assess spread in some cases. Additional tests on biopsy tissue can identify changes that help guide the choice of medicine.
    care:
    - Depending on the type, stage and your general health, options can include surgery, radiotherapy, chemotherapy, immunotherapy or targeted drugs. The team can also treat symptoms such as breathlessness and pain.
    complications:
    - A tumour can narrow an airway or lead to fluid collecting around a lung, either of which can worsen breathlessness. Tell your care team if your breathing, exercise tolerance or weight changes between appointments.
    help:
    - Contact your GP promptly if you cough up blood or have a persistent change in your cough, breathing or weight. Severe difficulty breathing requires emergency help.
    sources:
      HSE signs and symptoms: https://www2.hse.ie/conditions/lung-cancer/symptoms/
      HSE tests and diagnosis: https://www2.hse.ie/conditions/lung-cancer/tests-and-diagnosis/
      HSE lung cancer treatment: https://www2.hse.ie/conditions/lung-cancer/treatment/
  breast-cancer-men:
    aliases: male breast cancer breast lump nipple discharge
    summary: Men can develop breast cancer. A new lump, changes around the nipple or an armpit lump should be checked by a GP.
    symptoms:
    - A lump under or near the nipple can be the first sign. Other changes include a nipple pulling in, nipple discharge, skin changes or a lump in the armpit. A lump can warrant assessment even if it does not hurt.
    causes:
    - Cancer can develop in the small amount of breast tissue men have. Risk increases with age and can also be affected by inherited changes such as BRCA2 variants.
    diagnosis:
    - Your GP examines the change and may refer you to a breast clinic. Imaging can help identify the abnormal area and a biopsy can show whether cancer is present. Receptor tests can help guide treatment.
    care:
    - Surgery is often part of care. A specialist may also discuss radiotherapy, chemotherapy or hormone treatment such as tamoxifen, depending on the results and stage.
    - Ask whether your own or your family's medical history warrants a discussion about genetic assessment.
    complications:
    - Some people have chest or shoulder stiffness after surgery. Swelling of the arm on the treated side should be reported to the team, particularly after treatment involving lymph nodes.
    help:
    - Book a GP appointment for a new breast or armpit lump or a persistent change to the nipple or skin. Mention any family history of breast or ovarian cancer.
    sources:
      HSE symptoms in men: https://www2.hse.ie/conditions/breast-cancer-men/symptoms/
      HSE treatment in men: https://www2.hse.ie/conditions/breast-cancer-men/treatment/
  womb-cancer:
    aliases: uterine cancer endometrial cancer postmenopausal bleeding
    summary: Most womb cancers start in the lining of the uterus. Bleeding after menopause is a reason to contact your GP, even if it happens only once.
    symptoms:
    - Unexpected vaginal bleeding is the main warning sign. After menopause, report spotting, light bleeding or blood-stained discharge. Before menopause, bleeding between periods or a marked change from your normal pattern warrants assessment.
    causes:
    - The endometrium is the lining of the womb. Most womb cancers start there. Rarer cancers can arise in the muscle or other tissues, and the specialist uses the type of tumour to guide care.
    diagnosis:
    - A specialist may use a vaginal ultrasound to assess the lining. A biopsy samples the lining for laboratory examination. Hysteroscopy lets the clinician look inside the womb and can help with sampling.
    care:
    - Surgery often involves removing the womb. Other treatment decisions can depend on the cancer type, stage and risk of recurrence. Discuss fertility if relevant, recovery and what follow-up will involve with the specialist team.
    complications:
    - Surgery and other treatments can affect bladder, bowel or sexual function. The follow-up team can advise on symptoms such as ongoing pelvic discomfort or leg swelling.
    help:
    - Contact your GP about any bleeding after menopause, even if it stops, and about persistent changes in bleeding before menopause.
    sources:
      HSE diagnosis and tests: https://www.hse.ie/conditions/womb-cancer/diagnosis/
      HSE womb cancer treatment: https://www2.hse.ie/conditions/womb-cancer/treatment/
  ovarian-cancer-overview-and-symptoms:
    aliases: ovarian cancer ovary cancer persistent bloating
    summary: Ovarian cancer may cause persistent bloating, pelvic pain, feeling full quickly or urinary changes. A change that keeps recurring is worth discussing with your GP.
    symptoms:
    - Look for bloating that persists, getting full sooner than usual, abdominal or pelvic pain or needing to urinate more often. Tell your GP how often symptoms occur and whether they are new for you.
    causes:
    - Ovarian cancer is more common after menopause. Some inherited genetic changes increase risk. A family history of ovarian or breast cancer is worth raising even if no one in the family has had genetic testing.
    diagnosis:
    - A GP can assess symptoms and may order a CA125 blood test or an ultrasound. A raised CA125 can have several causes. A specialist interprets the results alongside symptoms and imaging and may need tissue testing.
    care:
    - A specialist team plans treatment using the cancer type, stage and your health. Surgery and chemotherapy are common options. For some people, further tests help determine whether a maintenance drug is suitable.
    complications:
    - Fluid in the abdomen can increase swelling or discomfort. Tell your team promptly about worsening pain, trouble eating or a significant change in bowel symptoms.
    help:
    - The HSE advises contacting a GP if symptoms last three weeks or more, if you first develop symptoms like irritable bowel syndrome after 50 or if you have a family history of ovarian or breast cancer. Go back if symptoms persist after an initial assessment.
    sources:
      HSE diagnosis and tests: https://www.hse.ie/conditions/ovarian-cancer-overview-and-symptoms/ovarian-cancer-diagnosis/
      HSE ovarian cancer treatment: https://www.hse.ie/conditions/ovarian-cancer-overview-and-symptoms/treatment/
  heart-attack:
    aliases: myocardial infarction MI acute coronary syndrome
    summary: A heart attack occurs when part of the heart muscle loses its blood supply. Suspected symptoms call for immediate emergency assessment.
    emergency: If you suspect a heart attack, call
    symptoms:
    - Chest pressure, squeezing or discomfort may spread to an arm, jaw, neck or back. Breathlessness, sweating, nausea or feeling faint can also occur. Some people have little or no chest pain.
    causes:
    - A heart attack often starts when a deposit inside a coronary artery ruptures and a clot obstructs the flow of blood. The longer the heart muscle goes without enough blood, the greater the risk of lasting damage.
    diagnosis:
    - The ambulance or hospital team may record an ECG to look for changes in the heart's electrical activity. Blood tests for troponin look for heart muscle damage and may be repeated.
    care:
    - Hospital treatment may involve restoring blood flow with a procedure to open the artery and place a stent. The hospital team will explain medicines to reduce the risk of another event and refer eligible patients for cardiac rehabilitation.
    - Before you leave hospital, ask which medicines you should take, when to resume activities and whom to contact if symptoms return.
    complications:
    - The damaged heart can develop rhythm problems or pump less effectively. Follow-up can include checks for heart failure symptoms and support for anxiety after the event.
    help:
    - Call for an ambulance if a heart attack is suspected. For new or worsening breathlessness, swelling or trouble with medicines after discharge, contact your care team promptly.
    sources:
      HSE diagnosis of a heart attack: https://www2.hse.ie/conditions/heart-attack/diagnosis/
      HSE recovering from a heart attack: https://www2.hse.ie/conditions/heart-attack/recovering-from/
      European Society of Cardiology guidelines: https://academic.oup.com/eurheartj/article/44/38/3720/7243210
  neck-pain:
    aliases: neck stiffness cervical pain trapped nerve
    summary: Neck pain often improves within weeks. Pain after an injury or symptoms such as weakness need a different assessment from everyday stiffness.
    symptoms:
    - The neck may feel stiff and sore when you turn to look over your shoulder. Pain can spread into the shoulder. Pain, tingling or numbness travelling into an arm can point to nerve irritation.
    causes:
    - Staying in one position, sleeping awkwardly, a strain or age-related changes can contribute to symptoms. A sudden movement in a collision can cause whiplash. Sometimes a disc or nearby tissue irritates a nerve.
    diagnosis:
    - A clinician asks when it started, whether there was an injury and whether the pain travels into the arm. They may examine movement, strength and sensation. Imaging decisions depend on the examination and whether there are warning signs.
    care:
    - For ordinary stiffness, gentle movement and changing position regularly can help. A heat or cold pack wrapped in a towel is an option. A pharmacist can advise on pain relief that is suitable for you.
    - Avoid driving or cycling if you cannot turn your neck far enough to do it safely. Persistent symptoms may benefit from a GP or physiotherapy assessment.
    complications:
    - Pain that persists can disrupt sleep and routine activity. New limb weakness or difficulty with balance or walking can be a sign of a more serious problem.
    help:
    - Get urgent medical assessment for neck pain after a significant injury, or if it comes with new weakness or difficulty walking. Contact your GP if stiffness is not improving after a few weeks, or if you have persistent pins and needles.
    sources:
      NHS neck pain guidance: https://www.nhs.uk/symptoms/neck-pain-and-stiff-neck/
      NHS clinical guidance on neck pain warning signs: https://www.hweclinicalguidance.nhs.uk/clinical-pathways/neck-pain/
  penile-cancer:
    aliases: penile cancer penis cancer PeIN penile intraepithelial neoplasia
    summary: Penile cancer is uncommon. A growth or sore that keeps returning or fails to heal, bleeding or a new change in the foreskin is worth getting checked.
    symptoms:
    - Changes can include a sore or growth on the penis, bleeding, discharge under the foreskin or new difficulty pulling the foreskin back. A lump in the groin can also warrant assessment.
    - Some changes are easiest to see on the head of the penis or under the foreskin. Mention how long the change has been there and whether it has grown, bled or changed colour.
    causes:
    - Most penile cancers start in squamous cells at the surface. Some are associated with long-lasting infection with certain types of HPV. Smoking and some longstanding foreskin problems can also increase risk.
    diagnosis:
    - A GP can examine the area and refer you to urology. A biopsy can show whether a change is cancer. If cancer is confirmed, further examination, scans or sampling can help assess nearby lymph nodes and guide treatment.
    care:
    - The team considers the location and depth of the cancer, whether lymph nodes are involved and which options preserve function. Treatment can range from local treatment for selected superficial changes to more extensive surgery and other cancer treatments.
    - Ask about the expected effect on urination, sexual function and sensation, and about support for those changes during recovery.
    complications:
    - Cancer can spread to lymph nodes in the groin. Treatment involving those nodes can also lead to swelling that may need assessment and support.
    help:
    - Book a GP appointment for a sore that has not healed within four weeks or for an unexplained lump, bleeding or discharge. An infection or skin condition can cause similar changes, and an examination helps distinguish them.
    sources:
      National Cancer Control Programme patient booklet: https://www.hse.ie/eng/services/list/5/cancer/patient/leaflets/nccp-penile-cancer-booklet.pdf
  non-melanoma-skin-cancer:
    aliases: keratinocyte cancer basal cell carcinoma BCC squamous cell carcinoma SCC
    summary: Basal cell and squamous cell carcinomas are common skin cancers. A sore, lump or scab that keeps coming back or does not heal should be checked.
    symptoms:
    - Basal cell carcinoma may appear as a shiny or pearly bump, a flat patch or a sore that repeatedly scabs. Squamous cell carcinoma may look like a firm or scaly lump and can feel tender.
    - Look for changes on sun-exposed skin such as the ears, face, scalp or hands. A lesion can warrant assessment even if it is small or painless.
    causes:
    - These cancers start in cells in the outer layer of the skin. Ultraviolet exposure from the sun or sunbeds can damage those cells. A weakened immune system can increase risk, especially for squamous cell carcinoma.
    diagnosis:
    - A GP may examine the lesion and refer you if cancer is suspected. A clinician can take a biopsy or remove the lesion and send it to a laboratory to confirm the type and check the edges of the tissue.
    care:
    - Surgery is a common treatment. Depending on the type and location, the team may discuss specialised surgery, a local treatment or radiotherapy. Follow-up depends on the features of the lesion and your risk of further skin cancers.
    - Ask how to check the treated area and the rest of your skin. Use sun protection when working, exercising or spending time outdoors.
    complications:
    - Basal cell carcinoma can damage tissue around it as it grows. Some squamous cell cancers can spread, particularly if they have high-risk features. Having one skin cancer also increases the risk of developing another.
    help:
    - Arrange a GP assessment for a new skin change that persists, grows, bleeds or fails to heal. Tell the GP if you have a history of skin cancer or take medicines that suppress your immune system.
    sources:
      HSE treatment options: https://www2.hse.ie/conditions/non-melanoma-skin-cancer/treatment/
  stillbirth:
    aliases: stillborn baby pregnancy loss fetal death maternity bereavement reduced movements
    summary: If you are worried about your baby's movements, call your maternity unit straight away. If your baby has died, the maternity team can explain the next steps and support you and your family.
    symptoms:
    - A change in your baby's usual movements, including movements becoming weaker, less frequent or stopping, needs assessment. Your maternity unit can help even if you are unsure what the change means.
    causes:
    - In Ireland, the HSE describes stillbirth as the birth of a baby without signs of life from 23 weeks of pregnancy or with a birth weight of at least 400 grams. Placental problems, health complications and conditions affecting the baby can contribute. Sometimes a cause remains unclear.
    diagnosis:
    - A maternity clinician will assess concerns about movements or other symptoms. Ultrasound can assess the baby's heartbeat. If a death is confirmed, the team can explain the findings and give you time to ask questions.
    care:
    - The maternity team will discuss the safest plan for birth and which investigations are available, including examination of the placenta or a post-mortem. Ask what each test may explain and when results will be available.
    - Ask for a named contact for follow-up and information on bereavement support. The team can also discuss physical recovery, results and planning care in a future pregnancy when you are ready.
    complications:
    - Grief can affect parents and family members differently and can resurface at milestones. Midwives, the maternity bereavement team and your GP can help you access support suited to you.
    help:
    - Call your maternity unit immediately with any concern about your baby's movements and tell them you are coming for a check. Seek advice again if the concern returns, even after a previous reassuring assessment.
    sources:
      HSE stillbirth overview and advice: https://www2.hse.ie/conditions/stillbirth/
      National Perinatal Epidemiology Centre clinical audit: https://www.ucc.ie/en/npec/newsevents/latest-perinatal-mortality-national-clinical-audit-in-ireland-annual-report-2023-.html
  flu:
    aliases: influenza seasonal flu fever body aches influenza A influenza B
    summary: Flu often starts suddenly with fever, aches and exhaustion. People at higher risk of complications may need advice early, while antiviral treatment is most useful.
    emergency: If someone has severe difficulty breathing or appears dangerously unwell, call
    symptoms:
    - Fever, chills, sore muscles, headache, cough and sudden tiredness are common. Symptoms can overlap with COVID-19 and other respiratory infections. Fatigue may persist after the fever and aches improve.
    causes:
    - Influenza viruses spread between people mainly through particles released when someone breathes, talks, coughs or sneezes. The flu vaccine is updated for the season as circulating viruses change.
    diagnosis:
    - A GP may assess symptoms and risk factors without testing in a straightforward case. Testing can help in hospital or when the result would change treatment or infection-control decisions.
    care:
    - Rest, fluids and appropriate symptom relief are enough for many people. If you are pregnant, older or have a long-term condition, seek advice early. A clinician can decide whether an antiviral is appropriate.
    - The HSE publishes eligibility for seasonal vaccination. While unwell, reduce close contact with people at higher risk of severe infection.
    complications:
    - Flu can lead to pneumonia or worsen asthma, COPD or heart failure. Seek advice promptly if symptoms worsen or you become more unwell again after initially improving.
    help:
    - Contact your GP if you are at higher risk, concerned about your child or getting worse. Severe breathing problems need emergency help.
    sources:
      HSE symptoms, diagnosis and treatment: https://www2.hse.ie/conditions/flu/symptoms-diagnosis/
  chickenpox:
    aliases: varicella chicken pox VZV
    summary: Chickenpox causes crops of itchy blisters. Exposure or illness can need prompt advice in pregnancy, in newborns and in people with a weakened immune system.
    symptoms:
    - A fever or general feeling of being unwell can come before the rash. Spots develop into fluid-filled blisters and then crust over. Fresh spots and scabs can appear at the same time.
    - The rash can affect the scalp, trunk and other areas, sometimes including the mouth. A child with a sore mouth may drink less, so watch for signs of dehydration.
    causes:
    - Varicella-zoster virus causes chickenpox and spreads easily through close contact. After recovery it can stay inactive in nerves and later reactivate as shingles. Contact with shingles blisters can give chickenpox to someone without immunity.
    diagnosis:
    - A clinician can usually recognise chickenpox from the rash and history. Testing may help in unusual cases or after an exposure where immunity matters. Phone ahead before attending a clinic if you think you have chickenpox.
    care:
    - Encourage fluids and ask a pharmacist about itch or pain relief. The HSE advises against giving ibuprofen unless a doctor advises it. People at higher risk should ask promptly whether antiviral treatment or action after exposure is needed.
    - Follow HSE guidance on when you can return to school, work or childcare. Avoid exposing newborns, pregnant people who may lack immunity and people with weakened immunity.
    complications:
    - Blisters can become infected. New warmth, swelling or increasing pain around spots warrants advice. Chickenpox can also cause complications such as pneumonia, especially in people at increased risk.
    help:
    - Contact a GP or maternity unit urgently after exposure or symptoms if pregnant and unsure of immunity, or if a newborn or someone with a weakened immune system is affected. Seek urgent medical advice if breathing is affected or the person is getting much more unwell.
    sources:
      HSE antiviral prescribing guideline: https://assets.hse.ie/media/documents/Chickenpox_guideline.pdf
  chlamydia:
    aliases: chlamydia STI chlamydia trachomatis
    summary: Chlamydia often has no symptoms. A urine test or swab can diagnose it, and treatment and partner follow-up help prevent complications and reinfection.
    symptoms:
    - Burning when passing urine, unexpected discharge or bleeding between periods or after sex can occur. Some people have pelvic pain or testicular discomfort. Many people feel entirely well.
    causes:
    - Chlamydia is a bacterial infection passed through sexual contact. It can affect the genital tract or rectum. Antibiotic treatment clears the infection but does not make you immune to getting it again.
    diagnosis:
    - A clinic may use a first-catch urine sample or swabs from relevant sites. Timing matters after exposure, so ask whether you should test now and repeat later. A clinician may recommend tests for other sexually transmitted infections at the same visit.
    care:
    - A healthcare professional can prescribe suitable antibiotics and explain when to resume sex. Tell them if you may be pregnant, since this can affect the choice of treatment.
    - Ask which recent partners should be offered testing and treatment and whether you should return for a repeat test. A clinic can help with partner notification.
    complications:
    - Untreated infection can cause pelvic inflammatory disease, which increases the risk of fertility problems and ectopic pregnancy. It can also cause painful inflammation around a testicle.
    help:
    - Contact a GP or sexual health clinic for symptoms or a partner's positive result. Seek urgent assessment for severe pelvic pain, fever with pelvic pain or sudden severe testicular pain.
    sources:
      HSE clinical guidance on chlamydia: https://assets.hse.ie/media/documents/Chlamydia_trachomatis_guideline.pdf
      HSE home STI testing: https://www2.hse.ie/living-well/sexual-wellbeing/free-home-sti-tests/
  gonorrhoea:
    aliases: gonorrhea gonorrhoea STI gonococcus
    summary: Gonorrhoea can affect the genitals, throat or rectum. Testing matters even when you feel well, and a clinic may ask you back to confirm that treatment worked.
    symptoms:
    - Symptoms can include pain when passing urine, unusual discharge, bleeding between periods or swollen or painful testicles. Rectal infection may cause pain, discharge or bleeding. Some infections have no noticeable symptoms.
    causes:
    - Gonorrhoea is a bacterial infection spread through sexual contact. The sites exposed help determine which samples are appropriate. Antibiotic resistance is one reason the clinic may request additional testing.
    diagnosis:
    - A urine test or swabs can detect the infection. A clinic may also take a swab for culture to check susceptibility to antibiotics, especially where treatment has not worked as expected.
    care:
    - Treatment usually involves an antibiotic injection. Follow the clinic's instructions about when to return for a test of cure and when you can safely resume sex.
    - A clinic can help notify recent sexual partners so they can be offered care. Being treated once does not prevent a new infection.
    complications:
    - Without treatment, infection can cause pelvic inflammatory disease or painful swelling around a testicle. In uncommon cases infection spreads beyond its original site.
    help:
    - Contact a sexual health clinic or GP if you have symptoms or a partner has tested positive. Seek urgent advice if you have a fever with severe pelvic pain, or urgent assessment for sudden severe testicular pain.
    sources:
      HSE clinical guidance on gonorrhoea: https://assets.hse.ie/media/documents/Gonorrhoea_guideline.pdf
      HSE home STI testing: https://www2.hse.ie/living-well/sexual-wellbeing/free-home-sti-tests/
  hepatitis-c:
    aliases: hep C HCV chronic hepatitis C liver infection
    summary: Hepatitis C can persist for years without symptoms and damage the liver. A blood test can confirm active infection, which can usually be cured with antiviral treatment.
    symptoms:
    - Many people have no early symptoms. Some feel unusually tired or unwell. Yellowing of the skin or eyes can occur and warrants medical assessment. Feeling healthy cannot rule out infection.
    causes:
    - Hepatitis C spreads when infected blood enters another person's bloodstream. The virus can establish a long-term infection in the liver. People with past blood exposure may benefit from testing even if it occurred years ago.
    diagnosis:
    - A hepatitis C antibody test can show past exposure. An RNA test can establish whether the virus is still present. A clinician can explain whether additional tests are needed to check liver health.
    care:
    - HSE hepatitis C treatment is free. Most people who need treatment can take direct-acting antiviral tablets. Your team can check for interactions and arrange a follow-up blood test to confirm whether treatment cleared the infection.
    - A person can acquire hepatitis C again after cure. Ask whether you need further testing based on exposure or follow-up for existing liver damage.
    complications:
    - Over years, untreated infection can scar the liver and increase the risk of cirrhosis and liver cancer. Advanced scarring can warrant continued monitoring after successful treatment.
    help:
    - Speak to your GP or use the HSE testing route if you may have been exposed. Ask for advice even if you have no symptoms. Seek urgent medical assessment for new jaundice.
    sources:
      HSE hepatitis C testing and diagnosis: https://www2.hse.ie/conditions/hepatitis-c/diagnosis/
      HSE hepatitis C treatment: https://www2.hse.ie/conditions/hepatitis-c/treatment/
  hiv:
    aliases: HIV AIDS human immunodeficiency virus antiretroviral therapy PrEP PEP
    summary: HIV can be treated effectively. Testing is the way to find out whether you have HIV, and a recent possible exposure needs prompt advice about time-sensitive prevention.
    symptoms:
    - Some people experience a fever, rash or sore throat in the weeks after acquiring HIV. Others notice nothing. These symptoms have many causes, so testing is needed to establish whether HIV is present.
    causes:
    - HIV affects immune cells called CD4 cells. Without treatment it can weaken the immune system over time. AIDS describes an advanced stage of untreated or inadequately treated infection.
    diagnosis:
    - A blood test can detect HIV. If you test soon after exposure, you may need to repeat it after the window period. A reactive screening test requires confirmation and follow-up through a healthcare service.
    care:
    - Antiretroviral treatment suppresses HIV and protects the immune system. Your clinical team monitors the amount of virus in the blood. People who maintain an undetectable viral load on treatment do not pass HIV to sexual partners, known as U=U.
    - Sexual health services can discuss prevention options, including PrEP for people who could benefit and PEP after a recent possible exposure.
    complications:
    - Without treatment, a weakened immune system can leave a person vulnerable to serious infections. Effective treatment and follow-up substantially reduce that risk.
    help:
    - For a recent possible exposure, contact a sexual health or infectious disease service immediately, or an emergency department out of hours. PEP must be started as soon as possible and within 72 hours if the clinician recommends it. Do not wait for symptoms or a home test.
    sources:
      HSE HIV post-exposure prophylaxis: https://www2.hse.ie/conditions/hiv/hiv-post-exposure-prophylaxis-pep/
      HSE home STI testing: https://www2.hse.ie/living-well/sexual-wellbeing/free-home-sti-tests/
      HPSC HIV surveillance and reports: https://www.hpsc.ie/a-z/hivandaids/hivdataandreports/
  syphilis:
    aliases: syphilis treponema pallidum chancre
    summary: A painless sore or a rash can be a sign of syphilis. The symptoms can disappear while the infection remains, so testing and follow-up matter.
    symptoms:
    - An early sore may occur on or near the genitals, mouth or anus. It can heal without treatment. A later phase may cause a rash, including on the palms or soles, swollen glands or feeling unwell. Some people have no obvious symptoms.
    causes:
    - Syphilis is caused by bacteria that can pass through contact with an infectious sore during sex and from a pregnant person to their baby. The stage of infection affects the care needed.
    diagnosis:
    - Sexual health clinics usually use blood tests. Sometimes a sore can be swabbed. An early blood test may need repeating, and a history of past treatment helps the clinician interpret the results.
    care:
    - A healthcare professional chooses antibiotic treatment based on the stage and circumstances. Keep follow-up blood test appointments to check the response, even if the sore or rash has gone.
    - The clinic can help with testing and advice for recent partners. Ask the clinic when it is safe to have sex again.
    complications:
    - Untreated infection can affect the nervous system, eyes or other organs. In pregnancy, untreated syphilis can harm the baby, so prompt assessment and treatment are important.
    help:
    - Contact a sexual health clinic if you have an unexplained sore, rash or a partner who has tested positive. If you are pregnant and may have been exposed or have a positive result, contact your maternity or sexual health team promptly.
    sources:
      HSE home STI testing: https://www2.hse.ie/living-well/sexual-wellbeing/free-home-sti-tests/
  c-diff:
    aliases: C diff Clostridioides difficile Clostridium difficile antibiotic diarrhoea
    summary: C. diff can cause diarrhoea during or after antibiotics. A stool test can help identify the cause when symptoms fit.
    symptoms:
    - Watery diarrhoea, abdominal cramps, fever and feeling unwell can occur. Mention recent antibiotics or a hospital stay when you ask for advice. Diarrhoea after antibiotics has several possible causes.
    causes:
    - The bowel normally contains many kinds of bacteria. Antibiotics can change that balance, allowing C. diff to multiply and release toxins that inflame the bowel. Some people carry the bacterium without becoming ill.
    diagnosis:
    - If symptoms suggest infection, a clinician may ask for a stool sample. The team considers the result together with symptoms because a test can detect carriage in someone whose diarrhoea has another cause.
    care:
    - The clinician reviews your antibiotics and may prescribe treatment aimed at C. diff. Ask before taking a medicine to stop diarrhoea. Maintaining hydration matters while you recover.
    - Tell your team if symptoms return after treatment. A recurrence may need a different care plan.
    complications:
    - Severe infection can cause dehydration and serious bowel inflammation. Older people and people with other health conditions may become unwell more quickly.
    help:
    - Contact a GP promptly for diarrhoea during or after antibiotics, particularly with fever or worsening abdominal pain. Seek urgent assessment if you cannot keep fluids down, pass much less urine or are becoming very unwell.
    sources:
      HSE advice on C. diff: https://www2.hse.ie/conditions/c-diff/
  covid19:
    aliases: COVID coronavirus SARS CoV 2 COVID-19
    summary: COVID-19 can cause anything from cold-like symptoms to serious breathing problems. People at higher risk should ask early about treatment if symptoms develop.
    emergency: If someone has severe difficulty breathing or is critically unwell, call
    symptoms:
    - Fever, cough, tiredness, sore throat, muscle aches and headache are common. Some people notice a change in taste or smell. Similar symptoms can occur with flu or other infections.
    causes:
    - The SARS-CoV-2 virus affects the respiratory tract. The chance of serious illness varies with factors such as age, immune status, other health conditions and vaccination history.
    diagnosis:
    - A clinician may advise testing if a diagnosis would affect treatment or care. Ask about timing if you are at higher risk and symptoms have just started.
    care:
    - Many people can manage mild illness at home with rest, fluids and suitable symptom relief. A clinician can assess whether antiviral treatment is appropriate for someone at higher risk.
    - Follow current HSE guidance on avoiding close contact while unwell, particularly around people at higher risk. Check the HSE's current eligibility guidance for COVID-19 vaccination.
    complications:
    - COVID-19 can lead to pneumonia or make other conditions worse. Some people have ongoing fatigue, breathlessness or other symptoms after the acute illness and can seek assessment for long COVID.
    help:
    - Contact a GP early if you are at higher risk and develop symptoms. Seek urgent advice for worsening breathing or if you become much more unwell after initially improving.
    sources:
      HSE medical help and treatment: https://www2.hse.ie/conditions/covid19/symptoms/medical-help-treatment/
  mumps:
    aliases: mumps parotitis swollen cheeks
    summary: Mumps often causes painful swelling near the ears and jaw. Contact your GP before attending so the practice can advise you and limit exposure to other patients.
    symptoms:
    - Swelling can affect one or both sides of the face below the ears and may make chewing uncomfortable. Fever, headache and tiredness can occur before the swelling.
    causes:
    - The mumps virus can inflame the salivary glands. Other infections, dental problems and blocked salivary ducts can also cause a swollen cheek, so the pattern and examination matter.
    diagnosis:
    - Tell your GP when the swelling started and whether you have had the MMR vaccine or contact with someone with mumps. A clinician may arrange testing if mumps is suspected.
    care:
    - Rest, fluids and suitable pain relief can help while the swelling settles. Follow HSE advice on staying away from school or work for five days after swelling begins.
    - Check with your GP if you are unsure about your MMR vaccination history. Vaccination is part of the HSE programme and helps protect against outbreaks.
    complications:
    - Mumps can cause inflammation of a testicle or ovary. Meningitis and hearing problems are uncommon complications. Seek advice promptly if you develop new symptoms as the swelling changes.
    help:
    - Call your GP if you think you or your child has mumps. Get urgent medical assessment for severe headache with a stiff neck or for sudden severe testicular pain.
    sources:
      HSE signs and complications: https://www.hse.ie/conditions/mumps/symptoms/
  whooping-cough-babies-and-children:
    aliases: pertussis whooping cough infant cough
    summary: Whooping cough can cause long coughing fits. Babies can become seriously ill and may have pauses in breathing even without the familiar whoop.
    emergency: If a baby stops breathing, turns blue or grey or is struggling to breathe, call
    symptoms:
    - A runny nose or mild cough can come first. Later, a child may have repeated coughing fits, struggle to take a breath between coughs or vomit afterwards. Very young babies may have breathing pauses.
    causes:
    - Whooping cough is a bacterial infection of the airways. The cough can continue for weeks as the airways recover. Babies under six months are at greatest risk of severe illness.
    diagnosis:
    - A clinician assesses the pattern of coughing, possible contacts and vaccination history. They may arrange a sample depending on when the symptoms began and how old the child is.
    care:
    - A clinician can decide if antibiotics are useful and whether household contacts need advice. A baby with breathing or feeding problems may need monitoring and support in hospital.
    - Ask your maternity team about the whooping cough vaccine in pregnancy and check your child's routine immunisations with your GP.
    complications:
    - Coughing fits can interfere with feeding and lead to dehydration. Babies can develop pneumonia or need help with breathing.
    help:
    - Arrange urgent assessment if you think a baby under one has whooping cough. Phone the GP or hospital ahead where possible. Seek emergency help immediately if breathing is affected.
    sources:
      HSE when to get medical help: https://www2.hse.ie/conditions/whooping-cough-babies-and-children/when-to-get-medical-help/
  strep-a:
    aliases: group A streptococcus GAS invasive group A strep iGAS
    summary: Group A strep can cause a sore throat or skin infection. Invasive infection is less common and can make someone seriously unwell very quickly.
    emergency: If someone with a suspected infection is severely unwell, struggling to breathe or difficult to wake, call
    symptoms:
    - Symptoms depend on the site of infection. A sore throat with fever, a rough rash with scarlet fever or a painful area of skin that is becoming red or swollen can occur.
    - Rapid deterioration, unusually severe pain, hard or fast breathing, confusion or marked drowsiness should prompt urgent assessment.
    causes:
    - Group A streptococcus can be present on the skin or in the throat without causing illness. In invasive disease, the bacteria infect an area such as the bloodstream or deeper tissues.
    diagnosis:
    - A GP assesses the symptoms and may examine the throat or skin. Hospital staff can take samples and investigate further when invasive infection is suspected.
    care:
    - A clinician decides whether antibiotics are needed based on the type and severity of the infection. Severe cases need hospital care. Follow public health advice if contacted about exposure to an invasive case.
    complications:
    - Invasive disease can cause sepsis. A skin infection that spreads rapidly, becomes much more painful or causes fever needs prompt medical attention.
    help:
    - Contact a GP if symptoms worsen, a fever and rash develop or a child is drinking much less. Get urgent medical help for signs of serious infection or rapid deterioration.
    sources:
      HSE signs and symptoms of strep A: https://www2.hse.ie/conditions/strep-a/
  acne:
    aliases: acne vulgaris spots pimples blackheads whiteheads
    summary: Acne can cause blocked pores, inflamed spots and painful deep lumps. Early treatment can help reduce scarring and the effect acne has on daily life.
    symptoms:
    - Blackheads and whiteheads are blocked pores. The skin can also develop inflamed bumps, spots containing pus or deeper tender lumps. The face, upper back and chest are common areas.
    - Tell your GP if the spots are leaving dents, raised scars or darker marks, or if they are affecting confidence or how you feel about going out.
    causes:
    - Oil and skin cells can build up in a hair follicle. Hormonal changes can increase oil production, and inflammation around the blocked follicle contributes to some types of spots.
    diagnosis:
    - A GP can usually diagnose acne by examining the type, number and distribution of the spots. They may ask about treatments you have tried, medicines and other symptoms to help rule out similar-looking conditions.
    care:
    - A pharmacist can advise on treatment for mild acne. A GP may prescribe a cream or gel or add a course of tablets, depending on severity. Many treatments need weeks of consistent use before you can judge their effect.
    - Tell your GP if you are pregnant or planning a pregnancy, since some acne medicines are unsuitable. A dermatologist may consider isotretinoin for severe acne or acne at risk of leaving scars.
    complications:
    - Deep inflammation and picking can lead to permanent scars. Darker marks after a spot heals can persist for a time. Acne can affect mood and confidence even when someone else considers it mild.
    help:
    - Speak to your GP if you have deep painful lumps, scarring, widespread spots on the chest or back, or acne that continues despite pharmacy treatment. Mention the impact on your mood as well as the skin symptoms.
    sources:
      HSE acne treatment: https://www2.hse.ie/conditions/acne/treatment/
      HSE living with acne: https://www2.hse.ie/conditions/acne/self-management/
  blood-tests:
    kind: test
    aliases: blood tests blood draw venepuncture phlebotomy fasting blood test blood results
    summary: Blood tests can help check your health, find the cause of symptoms or monitor treatment. How you prepare and what the results mean depend on the tests ordered.
    evidence_gap: The HSE describes where blood can be taken and how to prepare. Its patient guidance does not give a national count covering blood tests across general practice, hospitals and other services.
    symptoms:
    - A clinician may order blood tests to investigate symptoms, check how well an organ is working, monitor a medicine or assess health during pregnancy. Ask what question the test is intended to answer.
    causes:
    - Different tests measure different things. A full blood count measures types of blood cells, while other tests can measure glucose, hormones or markers of kidney or liver function. One sample can often supply more than one test.
    diagnosis:
    - Check whether the clinic has asked you to fast or to book the test at a particular time. Follow its instructions about water and medication. If you take medicines for diabetes or anything that might need adjusting, check with the clinic beforehand.
    care:
    - A doctor, nurse or phlebotomist usually takes blood from a vein in your arm or hand. Tell the person taking the sample if you have fainted before or feel light-headed. A small dressing is usually applied afterwards.
    - Your GP may take the sample in the practice or refer you to a hospital. Ask about any charge in advance. HSE guidance says routine GP blood tests should be free for medical card holders, with charges possible in certain circumstances.
    complications:
    - A small bruise or mild soreness can occur. Seek advice if bleeding continues despite pressure or if redness, swelling or pain around the puncture site is increasing.
    help:
    - Ask who will contact you with results and when to follow up if you have heard nothing. The person who ordered the test can explain whether a result matters in the context of your symptoms, medicines and previous results.
    sources:
      HSE common types of blood test: https://www2.hse.ie/conditions/blood-tests/common-types/
  genital-herpes-hsv:
    aliases: genital herpes HSV HSV-1 HSV-2 genital sores blisters
    summary: Genital herpes can cause painful blisters or ulcers around the genitals or anus. A sexual health clinic can test a fresh sore and discuss treatment and ways to reduce the risk of passing on the virus.
    symptoms:
    - The first recognised episode can cause tender blisters that open into sores, pain when passing urine and swollen glands in the groin. Some people also feel feverish or generally unwell.
    - Some infections cause little or no noticeable illness. A later recurrence can begin with tingling or irritation and may be milder than the first episode.
    causes:
    - Either type of herpes simplex virus can cause genital herpes. HSV-1 can be passed from the mouth to the genitals during oral sex. After infection, the virus stays in nearby nerves and can become active again.
    - The virus can pass through intimate contact even when there is no visible sore. Condoms reduce the risk, though skin outside the covered area can still be involved.
    diagnosis:
    - Contact a GP or sexual health clinic while a blister or sore is still present if possible. A clinician can swab the lesion and consider other causes of genital ulcers, including syphilis.
    - A routine STI screen generally does not include a herpes blood test. Ask the clinician which tests are appropriate for your symptoms and circumstances.
    care:
    - Antiviral tablets can help shorten a first episode. If outbreaks recur often, ask about tablets to start when symptoms begin or daily suppressive treatment. Avoid sexual contact while you have warning symptoms or sores.
    complications:
    - Pain can make it difficult to pass urine. Genital herpes around the time of birth can cause serious illness in a newborn, so tell your maternity team about a first episode, recurrence or past diagnosis.
    help:
    - Arrange an appointment promptly for new genital sores. Get urgent help if you cannot pass urine or feel very unwell. Contact your maternity team promptly if you develop symptoms during pregnancy.
    sources:
      HSE genital herpes guidance: https://www2.hse.ie/conditions/genital-herpes-hsv/
      HSE herpes in newborns: https://www2.hse.ie/conditions/neonatal-herpes/
  trichomonas-vaginalis-tv:
    aliases: trichomoniasis trich TV trichomonas vaginalis
    summary: Trichomoniasis is a treatable sexually transmitted infection. It can cause genital irritation or discharge, but people with no symptoms can still pass it on.
    symptoms:
    - Changes in vaginal discharge, a strong smell, soreness or itching can occur. Some people notice pain when passing urine or during or after sex.
    - People with a penis often have no symptoms. When symptoms occur they can include discharge, irritation around the foreskin or discomfort when passing urine.
    causes:
    - Trichomonas vaginalis is a parasite that can infect the vagina or urethra. The symptoms overlap with thrush, bacterial vaginosis and other STIs, which require different treatment.
    diagnosis:
    - A GP or sexual health clinic can arrange testing, usually with a vaginal swab or a urine sample depending on your anatomy and symptoms. Contact the clinic if a partner has been diagnosed, even if you feel well.
    care:
    - A clinician treats the infection with antibiotics and can arrange testing and treatment for partners. The HSE advises waiting a week after you and your partners have finished treatment before having sex again.
    - If symptoms return, contact the clinic. It can assess whether you need another test, treatment for reinfection or investigation for a different cause.
    complications:
    - Untreated infection can last months. During pregnancy it is associated with a higher risk of early birth or low birth weight. Tell your doctor or midwife if you are pregnant when arranging assessment.
    help:
    - Contact a GP or sexual health clinic if you have unusual discharge, irritation, pain when passing urine or a partner who has tested positive.
    sources:
      HSE trichomoniasis guidance: https://www2.hse.ie/conditions/trichomonas-vaginalis-tv/
  lymphogranuloma-venereum-lgv:
    aliases: LGV lymphogranuloma venereum LGV chlamydia proctitis rectal chlamydia
    summary: LGV is a form of chlamydia that can cause rectal pain, bleeding or discharge. It needs specific testing and a longer course of treatment than uncomplicated chlamydia.
    symptoms:
    - Rectal infection can cause bleeding, pus, pain and a persistent feeling that you need to open your bowels. There may also be constipation or diarrhoea.
    - A small painless genital sore can be easy to miss. Swelling or pain in the groin can develop later. Tell the clinician where symptoms occur so they can choose the right sample.
    causes:
    - Certain strains of Chlamydia trachomatis can inflame mucosal tissue and nearby lymph nodes. The infection spreads through sexual contact and can affect anyone exposed to it.
    diagnosis:
    - A sexual health clinician may swab the area involved, such as the rectum or a sore. If the sample tests positive for chlamydia and LGV is suspected, the laboratory can test further to identify the strain.
    care:
    - Take the full course prescribed by the clinic. Ask when to return for a test to check the infection has cleared, when it is safe to have sex again and how partners can get testing and treatment.
    complications:
    - Early treatment usually prevents lasting problems. Persistent inflammation can damage tissue in the affected area. Ongoing bleeding or pain after treatment needs reassessment.
    help:
    - Contact a sexual health clinic or GP promptly about rectal discharge, pain or bleeding, especially after sexual contact. Other causes of rectal bleeding also need medical assessment.
    sources:
      HSE LGV guidance: https://www2.hse.ie/conditions/lymphogranuloma-venereum-lgv/
  legionnaires-disease:
    aliases: legionnaires disease legionellosis legionella pneumonia
    summary: Legionnaires’ disease is a serious form of pneumonia. If you are unwell with cough, fever or breathing difficulty, mention recent travel, hospital stays or spa visits when you seek help.
    emergency: If someone has severe difficulty breathing, call
    symptoms:
    - Fever, headache, muscle aches and exhaustion can begin before the cough. Breathlessness or chest pain can develop as the lung infection progresses.
    - Symptoms resemble other types of pneumonia. Recent hotel, healthcare or spa exposure can help a clinician decide whether to test for Legionella.
    causes:
    - Lung infection can occur when a person breathes in tiny water droplets carrying Legionella bacteria. Older adults, smokers and people with chronic illness or a weakened immune system are more vulnerable to severe illness.
    diagnosis:
    - A clinician checks breathing and may arrange a chest X-ray to look for pneumonia. Hospital teams can use urine or respiratory samples to help determine whether Legionella is responsible.
    care:
    - Antibiotics are used to treat the infection. Hospital care may be needed for antibiotics through a vein, oxygen or more intensive breathing support. Energy and exercise tolerance can take weeks to recover.
    complications:
    - Severe pneumonia can impair breathing and require intensive care. Seek reassessment if breathing worsens or you feel much more unwell during recovery.
    help:
    - Seek urgent medical assessment for a persistent bad cough with fever, breathlessness or severe chest pain. Tell the clinician where you have been in the preceding 10 days. Go to an emergency department if you are very unwell.
    sources:
      HSE Legionnaires’ disease guidance: https://www2.hse.ie/conditions/legionnaires-disease/
      HPSC public factsheet: https://www.hpsc.ie/a-z/respiratory/legionellosis/factsheet/legionnairesdiseasefactsheetforthepublic/
  listeriosis:
    aliases: listeria listeriosis food poisoning pregnancy listeria
    summary: Listeriosis is an uncommon foodborne infection. Pregnant people, newborns and people with weakened immune systems need prompt assessment if they may have it.
    emergency: If someone has a seizure, becomes suddenly confused or is difficult to wake, call
    symptoms:
    - Listeriosis can cause fever, aches, diarrhoea or nausea. People with a healthy immune system may have mild symptoms or feel well.
    - In pregnancy, symptoms may be mild even if the infection affects the baby. A severe headache with a stiff neck or sensitivity to light can signal a serious infection.
    causes:
    - Listeria bacteria can enter the body through contaminated food and can sometimes enter the bloodstream. During pregnancy the infection can reach the baby through the placenta.
    diagnosis:
    - A clinician asks about symptoms, pregnancy, medicines and possible food exposure. Tell them if you have eaten food linked to a recall. Tests depend on the clinical circumstances and can include blood samples when invasive infection is suspected.
    care:
    - Many mild illnesses improve with rest and fluids. People with suspected invasive illness or infection during pregnancy need medical assessment for antibiotic treatment and monitoring. Follow HSE and Food Safety Authority of Ireland advice on recalls and food safety in pregnancy.
    complications:
    - Severe infection can cause sepsis or meningitis. Infection during pregnancy can lead to pregnancy loss, early delivery or serious illness in the newborn.
    help:
    - Seek urgent advice from your GP or maternity team if you are pregnant and think you may have listeriosis. Seek urgent assessment for a baby with possible infection or if you have a weakened immune system and develop symptoms.
    sources:
      HSE listeriosis guidance: https://www2.hse.ie/conditions/listeriosis/
      HPSC public factsheet: https://www.hpsc.ie/a-z/gastroenteric/listeriosis/factsheets/
  lyme-disease:
    aliases: lyme disease tick bite bullseye erythema migrans borrelia neuroborreliosis
    summary: Lyme disease can develop after a bite from an infected tick. A rash that expands over several days is an important clue, even if you never noticed a tick.
    symptoms:
    - An expanding red or darker patch may develop around the bite. The middle can clear, though the rash can also have an even colour. A small mark immediately after a bite can be local irritation.
    - Fever, tiredness, headaches and aches can occur with or without a rash. Later illness can affect nerves or joints, causing symptoms such as facial weakness or joint swelling.
    causes:
    - Lyme disease is caused by Borrelia bacteria carried by some ticks. Ticks can attach after time in long grass, woodland or bracken. Check your skin after spending time in those settings.
    diagnosis:
    - A GP may diagnose Lyme disease from a characteristic rash and the history alone. When blood tests are appropriate, an early negative result can be followed by a repeat test if the doctor still suspects Lyme disease.
    care:
    - A GP can prescribe antibiotics. Some people with severe illness need hospital assessment and antibiotics through a vein. If symptoms persist afterwards, ask your GP to review them and check whether another cause needs investigation.
    - If you find a tick attached to your skin, use fine-tipped tweezers or a tick removal tool. Grip it as close to the skin as possible and remove it steadily. Note the date and seek advice if symptoms develop.
    complications:
    - The infection can affect the nervous system, joints and, less often, the heart. Ireland’s notification figures cover Lyme neuroborreliosis, the form involving the nervous system.
    help:
    - Contact your GP if you develop an expanding rash or flu-like illness after a tick bite or time in places where ticks live. If possible, photograph the rash as it changes and tell your GP when it began.
    sources:
      HSE diagnosis and treatment: https://www2.hse.ie/conditions/lyme-disease/
      HPSC factsheet and Irish surveillance scope: https://www.hpsc.ie/a-z/lymedisease/factsheet
  tetanus:
    aliases: tetanus lockjaw tetanus vaccine puncture wound tetanus booster
    summary: A deep or dirty wound can need urgent assessment for tetanus prevention. A stiff jaw or painful muscle spasms after a wound can be a medical emergency.
    emergency: For severe muscle stiffness or spasms or difficulty breathing after a wound, call
    symptoms:
    - Early illness can cause a tight jaw and trouble opening the mouth or swallowing. Painful cramps or spasms can then affect the neck, back, abdomen or limbs.
    - Symptoms can begin days or weeks after the injury. If you have a concerning wound, get advice about prevention while you still feel well.
    causes:
    - Bacteria from the environment can enter damaged skin and produce a toxin that affects the nerves controlling muscles. Puncture wounds, bites and contaminated wounds can increase risk. Tetanus does not pass between people.
    diagnosis:
    - A clinician will examine the wound and ask how it happened and when you last received a tetanus vaccine. Severe stiffness and spasms require immediate assessment for possible tetanus.
    care:
    - Wound care and vaccination advice depend on the injury and previous doses. Some wounds also need tetanus immunoglobulin. Bring any available vaccine records, but seek care even if you cannot find them.
    - Tetanus itself requires hospital treatment, which can include medicines to control spasms and support with breathing.
    complications:
    - Severe spasms can affect breathing and swallowing and may cause fractures. Ireland recorded no tetanus notifications in 2025, but wound assessment still matters because exposure can happen anywhere.
    help:
    - Contact a GP or out-of-hours GP urgently for a deep or contaminated wound, especially if your vaccination history is uncertain. Go to an emergency department or call an ambulance if severe stiffness, spasms or breathing problems develop.
    sources:
      HSE wound and emergency advice: https://www2.hse.ie/conditions/tetanus/
      NIAC immunisation guidelines: https://www.hiqa.ie/sites/default/files/NIAC/Immunisation_Guidelines/Chapter_21_Tetanus.pdf
  malaria:
    aliases: malaria travel fever antimalarial falciparum malaria
    summary: A fever after travel to a malaria-risk area needs urgent assessment. Malaria remains possible if you took preventive tablets or returned home months ago.
    emergency: If someone with suspected malaria has a seizure, is confused or is struggling to breathe, call
    symptoms:
    - Fever, shaking chills, headache, aches, vomiting or diarrhoea can resemble flu or a stomach infection. A fever that comes and goes can still need assessment.
    - Symptoms usually begin within weeks of infection. Some forms of malaria can cause illness months later, which makes earlier travel relevant to the assessment.
    causes:
    - A mosquito bite can pass on a parasite that first develops in the liver and then infects red blood cells. Malaria diagnosed in Ireland is generally linked to travel in areas where it circulates.
    diagnosis:
    - Tell the clinician which countries and regions you visited, the dates and whether you took antimalarial tablets. Suspected malaria needs urgent blood testing and may require repeat samples if the first test is negative.
    care:
    - Clinicians choose treatment based on the parasite, the severity of illness and where infection was acquired. Severe malaria needs immediate hospital care. Before future travel, ask a travel health clinic about preventive tablets and bite avoidance for your destination.
    complications:
    - Malaria can become life-threatening and cause severe anaemia, breathing problems or problems with the brain and other organs. Prompt testing and treatment reduce the risk.
    help:
    - Seek urgent medical assessment the same day if you develop a fever or flu-like illness after visiting a malaria-risk area. If you cannot get prompt assessment through your GP, go to an emergency department and give your travel history.
    sources:
      HSE malaria guidance: https://www2.hse.ie/conditions/malaria/
      HSE malaria testing and when to get help: https://www2.hse.ie/conditions/malaria/symptoms/
  shigella:
    aliases: shigella shigellosis bloody diarrhoea dysentery
    summary: Shigella can cause diarrhoea, fever and severe stomach cramps. A stool test can identify the infection and help clinicians decide how to treat it.
    symptoms:
    - Diarrhoea may contain blood or mucus. Cramps, fever and an urgent need to use the toilet can occur. Frequent diarrhoea can make it hard to replace the fluid you lose.
    causes:
    - Shigella bacteria infect the bowel. Infection can be acquired through contaminated food, hands or sexual contact. It can still pass to others after diarrhoea has settled.
    diagnosis:
    - Your GP can arrange a stool test. Tell them about travel, illness in close contacts, possible sexual exposure or work with food, children or patients. If sexual exposure is likely, ask about testing for other STIs.
    care:
    - Rest and fluids are usually enough for mild illness. A clinician may use antibiotics in severe cases or in specific circumstances. Resistance affects which medicine is likely to work.
    - Wash hands with soap and water after using the toilet and before handling food. Follow public health advice on returning to work, particularly in healthcare, childcare or food handling, and ask when it is safe to resume sex.
    complications:
    - Severe diarrhoea can cause dehydration. People with weakened immune systems may need hospital care, particularly if symptoms worsen or the infection is difficult to treat.
    help:
    - Contact your GP promptly for bloody diarrhoea, worsening pain, a high fever or signs of dehydration such as passing much less urine.
    sources:
      HSE testing and follow-up: https://www2.hse.ie/conditions/shigella/
      HSE infectious diarrhoea prescribing guidance: https://assets.hse.ie/media/documents/Infectious_diarrhoea_guideline.pdf
  mpox:
    aliases: mpox monkeypox mpox rash blisters lesions
    summary: Mpox can cause painful spots or blisters, sometimes alongside fever or swollen glands. Phone a GP or sexual health clinic before visiting if you think you may have it.
    symptoms:
    - The rash may be limited to a small area or appear in several places. Spots can develop into blisters and then scabs. They can occur near the genitals or anus or around the mouth.
    - Fever, headaches, aches and swollen glands can occur. Some people first notice the rash, so tell the clinician if you have had close contact with someone diagnosed with mpox.
    causes:
    - Mpox is a viral infection that can pass through close physical contact, including intimate contact. It may also spread through shared bedding or towels used by someone with active lesions.
    diagnosis:
    - A clinician assesses the rash and may take a swab from a lesion. Herpes and other infections can produce similar symptoms. Phone first so staff can arrange assessment and advise on limiting close contact.
    care:
    - Treatment often focuses on relief of pain and other symptoms. Follow the clinic’s advice on how long to avoid close contact and sharing towels or bedding. Ask the HSE sexual health service whether vaccination is recommended for you.
    complications:
    - Pain can be severe if lesions affect the anus, mouth or genitals. People with weakened immunity may be more vulnerable to severe disease. Eye symptoms or worsening pain need prompt review.
    help:
    - Call a GP or sexual health clinic about a new rash if you suspect mpox. Tell them if you are pregnant, have a weakened immune system or have had contact with a confirmed case.
    sources:
      HSE mpox symptoms, testing and vaccination: https://www2.hse.ie/conditions/mpox/
  group-b-strep:
    aliases: group B strep GBS streptococcus agalactiae pregnancy newborn infection
    summary: Group B strep is often carried without symptoms. If it is found during pregnancy, your maternity team can explain what it means for labour and for your baby after birth.
    emergency: If a newborn is hard to wake, has trouble breathing or turns blue, call
    symptoms:
    - Carrying group B strep usually causes no symptoms. A newborn with an infection may feed poorly, seem unusually sleepy, breathe fast or have an abnormal temperature.
    causes:
    - Group B streptococcus can live in the digestive or genital tract without causing illness. It can pass to a baby around birth and occasionally cause a serious infection.
    diagnosis:
    - In Ireland, a urine test or vaginal swab taken for another reason may find group B strep during pregnancy. Tell your midwife about any positive result or a previous baby affected by group B strep.
    - A newborn who seems ill needs immediate clinical assessment. Hospital staff can take samples to help identify the cause and start treatment if they suspect serious infection.
    care:
    - Your team may recommend antibiotics through a vein during labour to reduce the risk of early infection in the baby. Ask when to phone the maternity unit if labour starts or your waters break and whether your baby will need observation afterwards.
    complications:
    - Group B strep can cause sepsis, pneumonia or meningitis in a newborn. The national surveillance figure covers invasive infection across age groups, so it cannot tell you how often it is carried during pregnancy.
    help:
    - Discuss a positive result with your midwife or obstetric team. Seek urgent medical assessment if a newborn is feeding poorly, seems unusually sleepy or shows signs of illness.
    sources:
      HSE group B strep in pregnancy and babies: https://www2.hse.ie/conditions/group-b-strep/
  cytomegalovirus-pregnancy:
    aliases: CMV cytomegalovirus congenital CMV cCMV pregnancy
    summary: Cytomegalovirus is common and often causes few symptoms. If infection is suspected during pregnancy, a maternity team can assess the timing and discuss whether the baby needs follow-up.
    symptoms:
    - Many people feel well. When symptoms occur they can include fever, tiredness, sore throat and swollen glands, which can resemble many other infections.
    - Babies with congenital CMV can look well at birth. Some have signs such as jaundice, hearing problems or a smaller than expected head size.
    causes:
    - CMV can pass through body fluids, including saliva and urine. It can remain in the body after an earlier infection and become active again. A pregnant person can pass the virus through the placenta.
    - Handwashing after changing nappies or wiping a child’s nose, using separate cutlery and avoiding sharing cups can help reduce exposure.
    diagnosis:
    - A blood test may help the medical team establish whether a pregnant person has had CMV and when infection may have occurred. If a baby needs testing, ask the team when it should be done, since timing soon after birth helps distinguish congenital infection from infection acquired later.
    care:
    - Follow-up during pregnancy depends on what the tests show. After birth, a specialist may recommend antiviral treatment for babies with certain symptoms and arrange hearing or developmental follow-up where needed.
    complications:
    - Congenital CMV can cause permanent hearing loss even in a baby who initially appears well. More severe infection can affect the brain, eyes or other organs. The Irish notification count measures confirmed reports of congenital infection and does not measure all maternal CMV infections.
    help:
    - Speak to your GP or maternity team if you develop persistent flu-like symptoms during pregnancy or are concerned about a possible exposure. Ask who will explain the results and organise any follow-up for the baby.
    sources:
      HSE CMV overview: https://www2.hse.ie/conditions/cytomegalovirus-pregnancy/overview/
      HSE diagnosing CMV: https://www2.hse.ie/conditions/cytomegalovirus-pregnancy/diagnosing/
      HSE treatment and hearing follow-up: https://www2.hse.ie/conditions/cytomegalovirus-pregnancy/treatment/
      HSE reducing exposure: https://www2.hse.ie/conditions/cytomegalovirus-pregnancy/prevention/
  neonatal-herpes:
    aliases: neonatal herpes newborn herpes HSV baby cold sore
    summary: Herpes infection in a newborn can become serious quickly. Seek urgent assessment for a newborn with suspected herpes, especially if they feed poorly, have fever or develop blisters.
    emergency: If your baby is difficult to wake, has a seizure, turns blue or has breathing problems, call
    symptoms:
    - Some newborns develop blisters or sores near the eyes or mouth or elsewhere on the skin. Others may first become irritable, feed less or have a fever. A baby can be seriously ill without an obvious blister.
    causes:
    - A baby can be exposed to herpes simplex around birth or after birth through close contact with an active cold sore. First genital herpes infection late in pregnancy carries particular risk to the baby.
    diagnosis:
    - Hospital staff will assess the baby and may take swabs and other samples. Tell them about cold sore contact or genital herpes during pregnancy if you know of it, without delaying care to confirm the exposure.
    care:
    - A baby with suspected neonatal herpes needs urgent hospital assessment for antiviral treatment through a vein. If you have a cold sore or warning tingling, avoid kissing the baby and wash your hands before contact.
    - Tell your midwife or obstetrician if you have genital herpes during pregnancy. If you have blisters on or near a nipple, call your GP or maternity team for feeding advice.
    complications:
    - Herpes can affect only the skin, eyes or mouth, or it can spread to the brain, lungs or other organs. Early treatment improves the chance of recovery.
    help:
    - Contact an urgent GP service or go to an emergency department if you suspect neonatal herpes and the baby has fever, sores, poor feeding or irritability.
    sources:
      HSE signs, emergency advice and prevention: https://www2.hse.ie/conditions/neonatal-herpes/
  rabies:
    aliases: rabies animal bite scratch bat travel post-exposure vaccination
    summary: Get medical help immediately after a possible rabies exposure, even if you feel well or were vaccinated before travel. Preventive treatment needs to begin before symptoms.
    symptoms:
    - Symptoms can include fever, headache and unusual discomfort around the site of a bite. Later illness can cause swallowing problems, agitation or weakness. Do not wait for symptoms to seek care.
    causes:
    - Rabies is a virus that affects the nervous system. A potentially infected mammal’s bite, scratch or saliva contacting broken skin, the mouth or the eyes can require assessment. Ask about bat contact even if you cannot see a wound.
    diagnosis:
    - After an exposure, a clinician assesses the animal, location, wound and your vaccination history. Tell them where and when it happened and whether you received any treatment abroad.
    care:
    - Wash a bite or scratch immediately with plenty of soap and water and seek medical help straight away. A clinician decides if you need a course of vaccine and whether rabies immunoglobulin is needed.
    - If treatment starts abroad, keep the written record and contact your GP when you return to Ireland so they can check whether more doses or follow-up are needed.
    complications:
    - Once rabies symptoms start, the disease is almost invariably fatal. The absence of Irish notifications does not remove the risk from bites or other exposures abroad.
    help:
    - Get immediate local medical attention after contact with an animal that could have rabies. Seek advice even if you had travel vaccinations or the wound looks small.
    sources:
      HSE rabies exposure and treatment guidance: https://www.hse.ie/conditions/rabies/
  dengue-fever:
    aliases: dengue dengue fever severe dengue fever after travel
    summary: Dengue can cause sudden fever, headache and aches after travel. Severe abdominal pain, bleeding or breathing problems after the fever begins need emergency care.
    emergency: If you develop severe abdominal pain, vomiting blood or difficulty breathing with possible dengue, call
    symptoms:
    - Fever can come on suddenly with headache, pain behind the eyes, aching joints, nausea or rash. A clinician needs to consider other causes, including malaria when the travel history fits.
    - Severe dengue can develop after the initial illness and sometimes as the temperature comes down. Pay attention to new bleeding, repeated vomiting or worsening abdominal pain.
    causes:
    - Dengue is caused by a virus passed on by mosquitoes. Travellers can be exposed in tropical regions and in some parts of southern Europe. Mention every place visited, including short stays in a risk area.
    diagnosis:
    - Give your GP the places and dates of travel and when you first felt unwell. They may arrange a blood test and check whether other infections also need urgent testing.
    care:
    - Rest, fluids and paracetamol if suitable can help with mild illness after assessment. The HSE advises avoiding aspirin and ibuprofen when dengue is suspected because of bleeding risk. Ask a clinician about any medicine you already take regularly.
    complications:
    - Severe dengue can cause dangerous bleeding or circulation problems and needs hospital care. Ongoing tiredness can last for weeks after milder illness.
    help:
    - Contact your GP if you develop fever or flu-like symptoms within two weeks of visiting a dengue-risk area. Seek emergency help for severe symptoms even if the initial fever has started to improve.
    sources:
      HSE dengue symptoms, prevention and emergency guidance: https://www2.hse.ie/conditions/dengue-fever/
  diphtheria:
    aliases: diphtheria throat infection diphtheria vaccine
    summary: Diphtheria is a rare bacterial illness that can cause a sore throat and neck swelling. Phone ahead for urgent medical advice if you suspect infection or have had contact with a case.
    emergency: If someone is struggling to breathe, call
    symptoms:
    - Throat infection can cause fever, hoarseness, a sore throat or swollen glands in the neck. Some infections affect the skin and cause a sore that takes time to heal.
    causes:
    - Bacteria can spread during close contact, including from a person who does not feel ill. Some strains produce a toxin that can cause serious illness beyond the original site of infection.
    diagnosis:
    - The clinician will consider your symptoms, relevant travel, vaccination history and known contacts. They may take a swab and notify public health if infection is suspected.
    care:
    - Treatment can include antibiotics and, when indicated, an antitoxin. A public health team can advise close contacts about assessment, preventive treatment or vaccination.
    - Children are offered protection as part of the Irish routine immunisation programme. Ask the GP or immunisation office to check records if you are unsure which doses were received.
    complications:
    - Severe infection can affect breathing, the heart and nerves. A person with suspected respiratory diphtheria needs urgent assessment even if the first symptoms resemble an ordinary sore throat.
    help:
    - Phone a GP, out-of-hours GP or emergency department for urgent advice after a known exposure or if you suspect diphtheria. Calling first helps the service manage possible exposure to other patients.
    sources:
      HSE diphtheria guidance: https://www2.hse.ie/conditions/diphtheria/
  polio:
    aliases: polio poliomyelitis acute flaccid paralysis polio vaccine post-polio
    summary: Polio is vaccine-preventable. Sudden inability to move part of the body or difficulty breathing is an emergency, whatever the suspected cause.
    emergency: If you or your child suddenly cannot move a limb or has difficulty breathing, call
    symptoms:
    - Most people infected with poliovirus feel well or have a brief flu-like illness with fever, aches or a sore throat. Rarely, weakness or paralysis develops, often in the legs.
    causes:
    - Poliovirus usually spreads when tiny amounts of infected stool contaminate hands, food or water. In a small share of infections it affects the nerves that control muscles.
    diagnosis:
    - Sudden muscle weakness has several possible causes that need urgent hospital assessment. Tell staff about recent travel and vaccinations if you know them. Clinicians can coordinate testing with public health services when polio is suspected.
    care:
    - Hospital treatment supports breathing or other affected functions. Physiotherapy, rehabilitation and mobility support can help with recovery. Check with your GP about catch-up vaccination if records are incomplete.
    complications:
    - Weakness can take weeks or months to improve and may persist. Some people who previously had polio develop new fatigue or weakness years later, known as post-polio syndrome, which needs a separate assessment. The Irish surveillance figure is for acute paralytic polio.
    help:
    - Call emergency services if sudden weakness prevents movement or breathing becomes difficult. Ask a GP or travel health clinic about polio vaccination before travel if you are unsure of your protection.
    sources:
      HSE polio guidance: https://www2.hse.ie/conditions/polio/
  botulism:
    aliases: botulism infant botulism foodborne botulism floppy baby
    summary: Botulism is a rare illness that can rapidly weaken muscles used for swallowing and breathing. Suspected botulism needs immediate emergency care.
    emergency: If you think you or your baby has symptoms of botulism, call
    symptoms:
    - Adults may develop blurred or double vision, slurred speech or trouble swallowing before weakness spreads. Breathing can become difficult.
    - In babies, a weak cry, poor feeding, constipation and an unusually floppy head or limbs can be signs. Tell emergency staff if these symptoms are new or getting worse.
    causes:
    - Botulism results from a toxin that interferes with the signals nerves send to muscles. Clinicians consider foodborne, infant and wound botulism depending on symptoms and history.
    diagnosis:
    - Emergency teams assess breathing, swallowing and muscle weakness. Tell them when symptoms began and whether anyone else who shared a meal has similar symptoms. Treatment decisions can be urgent while confirmatory testing is arranged.
    care:
    - Hospital treatment may include antitoxin and support with breathing. Recovery can require rehabilitation as muscle function returns. The HSE advises against giving honey to a child under one year old.
    complications:
    - Breathing failure can develop if respiratory muscles weaken. A person may require intensive care, and recovery can take weeks or months.
    help:
    - Call emergency services or go to an emergency department if you suspect botulism. Do not wait for a scheduled appointment, particularly if swallowing, speech or breathing changes.
    sources:
      HSE botulism emergency and treatment guidance: https://www2.hse.ie/conditions/botulism/
  eczema:
    aliases: eczema adult eczema atopic dermatitis itchy skin eczema flare
    summary: Eczema can make the skin itchy, dry and sore and interrupt sleep. A GP or pharmacist can help you build a routine for everyday skin care and a plan for flares.
    symptoms:
    - Itching, dryness and patches of inflamed or cracked skin are typical. Patches often affect the hands, elbows, knees or face. On brown or black skin, changes in colour or texture may be easier to see than redness.
    - Ask for help if itching disrupts sleep or work. If the rash keeps returning, note whether wet work, detergents, gloves, jewellery or a new skincare product coincide with it.
    causes:
    - In atopic eczema the skin barrier holds less moisture, and inflammation makes the skin more sensitive. Other types of eczema have different causes, including repeated contact with irritants or allergy to something touching the skin.
    diagnosis:
    - A GP will examine the rash and ask about where it starts, how long it lasts and what makes it worse. If a contact allergy is suspected, a dermatologist may arrange patch testing.
    care:
    - Use an emollient regularly and ask a pharmacist about suitable cleansers. A GP may prescribe a topical steroid for flares and explain how much to use, where to apply it and for how long.
    - Seek a treatment review if you need repeated courses, if a sensitive area such as the eyelids is affected, or if the plan is difficult to follow around work or sleep.
    complications:
    - Scratching can break the skin and make infection more likely. Fluid, yellow crusts, swelling, pain or fever can signal infection. Rapidly worsening painful patches with clusters of blisters can be eczema herpeticum.
    help:
    - Contact your GP for a rash that persists or interferes with daily life. Get urgent assessment for rapidly worsening painful eczema or clusters of blisters, particularly if you feel feverish or unwell.
    sources:
      HSE eczema diagnosis and signs of infection: https://www2.hse.ie/conditions/eczema/
      HSE eczema treatment: https://www2.hse.ie/conditions/eczema/treatment/
  eczema-babies-children:
    aliases: baby eczema infant eczema child eczema atopic dermatitis children
    summary: In babies and children, eczema often causes itchy, sore patches and broken sleep. A GP can diagnose the rash and give you a plan for daily care, flares and signs of infection.
    symptoms:
    - Babies may have patches on the face. Children can also get them in the neck, inside the elbows, behind the knees or on the hands. Inflamed skin may darken or look purple or grey on brown or black skin.
    - A baby may rub their face or seem unsettled at night. Older children may scratch until their skin bleeds, especially when warm or tired.
    causes:
    - Atopic eczema affects the skin barrier, which lets moisture escape more easily. Heat, some soaps and other irritants can trigger flares. A family history of eczema, asthma or hay fever makes atopic eczema more likely.
    diagnosis:
    - The GP can usually recognise eczema by examining the skin. A swab may help if the skin appears infected. Photographs from a bad flare can help when the skin looks better by the appointment.
    care:
    - Use an emollient regularly, including when the skin is settled. Ask the GP to show you how and where to use any prescribed steroid cream. Share the instructions with anyone who regularly looks after your child.
    - Keep fingernails short and use a soap substitute if recommended. Keep clothing and bedding exposed to emollients away from cigarettes, candles and open flames.
    complications:
    - Oozing, crusting, warmth or pain can suggest infection. Painful rash with rapidly spreading blisters, especially after contact with a cold sore, needs urgent assessment for eczema herpeticum.
    help:
    - Contact your GP if your child’s eczema flares and fails to improve after a few days of their usual treatment or if you see signs of infection. Seek urgent help for rapidly spreading painful blisters or a child who is becoming unwell.
    sources:
      HSE eczema in babies and children: https://www2.hse.ie/conditions/eczema-babies-children/
      HSE urgent advice for eczema herpeticum: https://www2.hse.ie/conditions/eczema/
  psoriasis:
    aliases: psoriasis plaque psoriasis scalp psoriasis nail psoriasis psoriatic arthritis
    summary: Psoriasis can cause persistent scaly patches on the skin or changes in the nails. Tell your GP if you also have swollen or stiff joints, as this can need separate treatment.
    symptoms:
    - Plaque psoriasis often causes thick, scaly patches on the scalp, elbows, knees or lower back. Their colour varies with skin tone. Patches can itch, crack or bleed.
    - Nail changes can include tiny pits, thickening or separation from the nail bed. Mention joint swelling, morning stiffness or a whole swollen finger or toe to your GP.
    causes:
    - Inflammation speeds up the turnover of skin cells, allowing them to build up into plaques. The pattern can change over time and symptoms may flare after illness or skin injury.
    diagnosis:
    - A GP usually examines the skin and nails and may refer you to a dermatologist if the diagnosis is unclear or the impact is significant. Joint symptoms may need assessment by a rheumatologist.
    care:
    - Treatment depends on where the plaques are, how extensive they are and their effect on everyday life. Creams or ointments are often used first. Specialists can offer light therapy or medicines that act throughout the body when appropriate.
    - Tell your GP if applying treatment to the scalp, hands or other areas is difficult or if it affects sleep, work or confidence. These details can inform treatment choices.
    complications:
    - Psoriatic arthritis can damage joints over time if untreated. Uncommon forms of psoriasis can cause widespread redness or pus-filled blisters and may need emergency treatment.
    help:
    - Book a GP visit if you think you have psoriasis or if an existing treatment is no longer controlling it. Seek urgent assessment for a rapidly spreading painful rash or widespread pustules, particularly with fever or chills.
    sources:
      HSE diagnosis and joint symptoms: https://www2.hse.ie/conditions/psoriasis/
      HSE treatment options: https://www2.hse.ie/conditions/psoriasis/treatment/
  hidradenitis-suppurativa:
    aliases: hidradenitis suppurativa HS recurrent boils armpit groin abscess
    summary: Hidradenitis suppurativa causes recurrent painful lumps in places such as the armpits or groin. Recognising the pattern early can help prevent scarring and make treatment easier to plan.
    symptoms:
    - Tender lumps or abscesses can arise in the same area repeatedly, including beneath the breasts or around the buttocks. Some drain, leaving scars or small openings in the skin.
    - Tell your GP if lumps recur in skin folds or on both sides of the body. Photographs and a record of when each lump appeared can help if it has settled before the visit.
    causes:
    - Inflammation starts around blocked hair follicles. The condition can run in families. It cannot be passed on by touching affected skin, and washing more frequently will not resolve it.
    diagnosis:
    - A clinician looks at where lumps occur, how often they recur and whether there are scars or channels under the skin. A swab can help if a secondary infection is suspected.
    care:
    - Your GP can discuss pain relief and medicines to reduce inflammation. A dermatologist can offer other treatment for persistent or extensive disease, including specialist medicines or surgery. Ask about dressings if draining areas are difficult to manage.
    complications:
    - Repeated inflammation can leave scars and channels under the skin. Pain or drainage can interfere with movement, work and relationships. A sudden change with spreading redness or fever can suggest a secondary infection.
    help:
    - Arrange a GP visit for recurrent boils or drainage in skin folds. Seek prompt care if pain is escalating, redness is spreading or you feel feverish.
    sources:
      HSE hidradenitis suppurativa diagnosis and care: https://www2.hse.ie/conditions/hidradenitis-suppurativa/
  rosacea:
    aliases: rosacea facial flushing papulopustular rosacea ocular rosacea
    summary: Rosacea can cause facial flushing, stinging and bumps. Eye pain, blurred vision or new sensitivity to light need urgent assessment.
    symptoms:
    - Flushing may come and go at first. Later, the cheeks or nose can stay discoloured or feel hot or sting. Some people develop visible fine blood vessels or small bumps.
    - Eye symptoms can include dry or gritty eyes and crusted or sore eyelids. Facial colour changes can be harder to see on darker skin, so burning or new sensitivity is worth mentioning.
    causes:
    - Rosacea involves inflammation in facial skin. Sun exposure, heat, exercise or alcohol can trigger symptoms for some people. A brief diary can help identify what brings on your own flares.
    diagnosis:
    - A GP assesses the pattern and considers conditions such as acne, eczema and other causes of a facial rash. Tell them about eye symptoms, recent skincare changes and any products you have already tried.
    care:
    - Gentle skin care and daily sun protection can help. A GP may prescribe a cream or tablets depending on the symptoms. Persistent symptoms may need a dermatology review.
    complications:
    - Rosacea can affect the surface of the eye. Inflammation of the cornea can threaten sight if it goes untreated. Some people also develop thicker skin around the nose over time.
    help:
    - Make a GP appointment if facial symptoms keep returning or bother you. Contact a GP urgently for a painful, red or gritty eye, blurred vision or new difficulty looking at light.
    sources:
      HSE rosacea symptoms, treatment and eye advice: https://www2.hse.ie/conditions/rosacea/
