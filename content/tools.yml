      - {id: retained, label: Percentage of gross interest retained}
    guide: |
      ## Current DIRT rate
      Revenue states that DIRT is deducted at 33% from deposit interest paid to Irish-resident individuals. Certain people and account types can qualify for exemptions or refunds, which this simple calculator does not model.
    sources:
