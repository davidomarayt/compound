      - {id: monthly_employer, label: Employer monthly contribution, type: number, prefix: "€", default: 300, min: 0, step: 25}
      - {id: return_rate, label: Assumed annual return before fee, type: number, suffix: "%", default: 6, min: -20, max: 30, step: 0.1}
      - {id: annual_fee, label: Annual fund fee, type: number, suffix: "%", default: 0.75, min: 0, max: 10, step: 0.05}
    results:
      - {id: years, label: Years to retirement}
      - {id: projected, label: Projected pension pot}
      - {id: contributed, label: Total contributions including current pot}
      - {id: growth, label: Estimated net investment growth}
    guide: |
      ## Projection, not forecast
      Contributions are added monthly and the assumed return is reduced by the annual fee before compounding. Real pension returns are uneven, fees can have several components and contribution levels can change.

      Use the chart to see whether the long-term result is being driven mainly by time, contributions or the return assumption. Check pension tax-relief limits separately.
    sources: []

  - slug: rent-vs-buy-calculator
    title: Rent vs Buy Calculator Ireland
    category: Home Buying
    formula: rent_vs_buy
    summary: Compare an illustrative homeowner-equity path with a renter who invests the deposit and any monthly cost advantage.
    meta_description: Rent vs buy calculator Ireland. Compare mortgage equity with renting and investing using editable rent, house price, rate, deposit, growth and maintenance assumptions.
    updated: 2026-09-21
    fields:
      - {id: monthly_rent, label: Current monthly rent, type: number, prefix: "€", default: 1800, min: 0, step: 50}
      - {id: annual_rent_growth, label: Annual rent growth assumption, type: number, suffix: "%", default: 2.5, min: -10, max: 20, step: 0.1}
      - {id: house_price, label: Home purchase price, type: number, prefix: "€", default: 400000, min: 0, step: 1000}
      - {id: deposit, label: Deposit, type: number, prefix: "€", default: 40000, min: 0, step: 1000}
      - {id: mortgage_rate, label: Mortgage interest rate, type: number, suffix: "%", default: 3.5, min: 0, max: 20, step: 0.1}
      - {id: mortgage_years, label: Mortgage term, type: number, suffix: years, default: 30, min: 1, max: 50, step: 1}
      - {id: house_growth, label: Annual house-price growth assumption, type: number, suffix: "%", default: 2.5, min: -20, max: 20, step: 0.1}
      - {id: maintenance_pct, label: Annual maintenance / ownership costs as % of home value, type: number, suffix: "%", default: 1, min: 0, max: 10, step: 0.1}
      - {id: renter_return, label: Renter investment return assumption, type: number, suffix: "%", default: 5, min: -20, max: 30, step: 0.1}
      - {id: years, label: Comparison period, type: number, suffix: years, default: 15, min: 1, max: 40, step: 1}
    results:
      - {id: mortgage_payment, label: Starting monthly mortgage repayment}
      - {id: owner_equity, label: Homeowner equity at end}
      - {id: renter_portfolio, label: Renter investment portfolio at end}
      - {id: difference, label: End-value difference}
    guide: |
      ## The assumptions matter more than the headline
      This model gives the renter an initial investment equal to the buyer's deposit and then invests any month where renting costs less than mortgage plus estimated maintenance. If owning is cheaper in a month, the model does not assume the renter borrows to fund the difference. The homeowner result is estimated property value minus the remaining mortgage.

      Stamp duty, legal costs, tax on investments, selling costs, mortgage rate changes, insurance and many real-life differences are not fully modelled. Change the assumptions aggressively rather than treating one scenario as a verdict.
    sources: []

  - slug: mortgage-affordability-calculator
    title: Mortgage Affordability Calculator Ireland
    category: Home Buying
    formula: mortgage_affordability
    summary: Compare an income multiple with a user-set monthly affordability limit and deposit constraint.
    meta_description: Mortgage affordability calculator Ireland. Compare Central Bank loan-to-income limits with monthly repayment affordability and deposit constraints.
    updated: 2026-09-21
    fields:
      - {id: income, label: Gross household annual income, type: number, prefix: "€", default: 80000, min: 0, step: 1000}
      - id: buyer_type
        label: Buyer type
        type: select
        default: ftb
        options:
          - {value: ftb, label: First-time buyer — 4× LTI limit}
          - {value: subsequent, label: Second/subsequent buyer — 3.5× LTI limit}
      - {id: deposit, label: Deposit available, type: number, prefix: "€", default: 40000, min: 0, step: 1000}
      - {id: rate, label: Mortgage interest rate for affordability test, type: number, suffix: "%", default: 4.5, min: 0, max: 20, step: 0.1}
      - {id: term, label: Mortgage term, type: number, suffix: years, default: 30, min: 1, max: 50, step: 1}
      - {id: max_payment_pct, label: Maximum mortgage payment as % of gross monthly income, type: number, suffix: "%", default: 30, min: 5, max: 70, step: 1}
      - {id: other_debt, label: Other monthly debt payments to subtract, type: number, prefix: "€", default: 0, min: 0, step: 50}
    results:
      - {id: lti_mortgage, label: Central Bank LTI ceiling before exceptions}
      - {id: payment_capacity, label: User-set monthly mortgage capacity}
      - {id: payment_based_mortgage, label: Mortgage supported by that payment}
      - {id: indicative_mortgage, label: Lower of LTI and payment-based amount}
      - {id: indicative_price, label: Indicative price including deposit}
    guide: |
      ## Two different constraints
      The Central Bank mortgage measures limit first-time buyers to 4 times gross income and second/subsequent buyers to 3.5 times, subject to lender exceptions. Separately, a household has its own cash-flow limit. This tool lets you choose a maximum mortgage-payment share of gross monthly income and subtract other debt payments.

      The percentage you enter is your scenario assumption, not a Central Bank affordability rule and not a lender approval test.
    sources:
      - {title: "Central Bank of Ireland — Mortgage Measures", url: "https://www.centralbank.ie/financial-system/financial-stability/macro-prudential-policy/mortgage-measures"}

