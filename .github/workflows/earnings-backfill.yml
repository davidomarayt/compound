# Retired: quarter-by-quarter article backfill replaced by Q1–Q3 hydration when
# a real SEC filing triggers an existing company's consolidated earnings page.
name: Historical Earnings Backfill (Retired)
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Historical article backfill has been retired; no publication is performed.'
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - run: echo 'No historical earnings articles are published. The main earnings monitor hydrates Q1/Q2/Q3 into one company page.'
