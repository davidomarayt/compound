      - {id: real_fee_gap, label: Ending balance difference in today's money, advanced: true}
    guide: |
      ## Fees compound because they remove capital that could otherwise keep growing
      Basic mode compares two annual percentage fees against the same gross return and contribution plan. Advanced mode can add fixed and contribution charges.

      This is a fee-mechanics illustration, not an investment recommendation. It does not calculate Irish investment tax and it assumes both options earn the same return before fees, which may not be true in reality.
    sources:
      - {title: "CCPC — Thinking of investing", url: "https://www.ccpc.ie/manage-your-money/saving-and-investments/investments/thinking-of-investing"}

