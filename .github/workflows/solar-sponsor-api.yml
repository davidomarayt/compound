name: Solar sponsorship API
on:
  push:
    branches: ["claude/clever-babbage-uibieq"]
    paths:
      - "sponsor-api/**"
      - ".github/workflows/solar-sponsor-api.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax check API and library
        run: |
          set -e
          for f in sponsor-api/api/*.js sponsor-api/lib/*.js sponsor-api/tests/*.js; do node --check "$f"; done
      - name: Run sponsorship integration foundation tests
        working-directory: sponsor-api
        run: npm test
      - name: Verify Stripe placeholders are never used for public checkout
        run: |
          grep -Fq "price_1UPQeS2R63yYze0goI6IbmZD" sponsor-api/lib/core.js
          grep -Fq "solar_approve_application" sponsor-api/schema.sql
          grep -Fq "solar_apply_billing_event" sponsor-api/schema.sql
          grep -Fq "stripeSignature" sponsor-api/api/webhook.js
      - name: Validate first paid quarter and renewal schedule
        run: |
          grep -Fq 'FOUNDING_TRIAL_END_UNIX = 1798761600' sponsor-api/lib/core.js
          grep -Fq 'interval_count' sponsor-api/README.md || true
          grep -Fq 'p_quantity integer' sponsor-api/schema.sql
