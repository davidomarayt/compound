<aside class="article-tool-banner article-tool-banner-{{ pillar }}" aria-label="Related Compound tool">
  <div class="article-tool-banner-copy">
    <p class="eyebrow">TRY THE TOOL</p>
    <h2>Put this into your own numbers.</h2>
    <p>{{ tool.summary }}</p>
  </div>
  <a class="article-tool-banner-cta" href="{{ tool.url }}">
    <span>{{ tool.title }}</span>
    <span aria-hidden="true">→</span>
  </a>
</aside>
