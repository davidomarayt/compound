<article class="card">
  <a href="{{ a.url }}"><h3>{{ a.title }}</h3></a>
  <p class="meta"><span class="pill pill-{{ a.pillar }}">{{ a.pillar_label }}</span> <time datetime="{{ a.date.isoformat() }}">{{ a.date.strftime('%-d %B %Y') }}</time></p>
  {% if a.summary %}<p class="summary">{{ a.summary }}</p>{% endif %}
</article>
