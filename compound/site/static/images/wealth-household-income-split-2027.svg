<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Same €100,000 household pay, different 2027 take-home income</title>
<desc id="desc">Two earners on €50,000 each take home €80,679. Earners on €70,000 and €30,000 take home €79,176. One earner on €100,000 takes home €71,123. The gap is €9,556 annually, after illustrative income tax, USC and PRSI with a qualifying child.</desc>
<rect width="1200" height="720" fill="#fbfaf7"/>
<rect x="40" y="35" width="1120" height="650" rx="28" fill="#fff" stroke="#e6e8e3" stroke-width="2"/>
<rect x="84" y="80" width="154" height="37" rx="8" fill="#e6f3ec"/>
<text x="161" y="104" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="16" fill="#165d3d" text-anchor="middle">IRELAND • 2027</text>
<text x="84" y="170" font-family="Arial,Helvetica,sans-serif" font-size="42" font-weight="800" fill="#172a28">Same €100,000 income.</text>
<text x="84" y="220" font-family="Arial,Helvetica,sans-serif" font-size="42" font-weight="800" fill="#172a28">Different take-home pay.</text>
<text x="84" y="265" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#596963">Annual household net income after estimated PAYE, USC and PRSI</text>
<text x="84" y="321" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#243934">€50k + €50k</text>
<rect x="320" y="296" width="610" height="39" rx="8" fill="#eaf0ec"/>
<rect x="320" y="296" width="589" height="39" rx="8" fill="#16774d"/>
<text x="958" y="324" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="800" fill="#172a28">€80,679</text>
<text x="84" y="409" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#243934">€70k + €30k</text>
<rect x="320" y="384" width="610" height="39" rx="8" fill="#eaf0ec"/>
<rect x="320" y="384" width="578" height="39" rx="8" fill="#6b9a88"/>
<text x="958" y="412" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="800" fill="#172a28">€79,176</text>
<text x="84" y="497" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#243934">€100k + €0</text>
<rect x="320" y="472" width="610" height="39" rx="8" fill="#eaf0ec"/>
<rect x="320" y="472" width="519" height="39" rx="8" fill="#aebcb6"/>
<text x="958" y="500" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="800" fill="#172a28">€71,123</text>
<line x1="84" y1="542" x2="1116" y2="542" stroke="#e5e8e4" stroke-width="2"/>
<text x="84" y="588" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="800" fill="#16623f">€9,556 difference a year</text>
<text x="84" y="629" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#53645e">Illustrative jointly assessed PAYE households with a qualifying child; Home Carer credit applied where eligible.</text>
<text x="84" y="653" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#53645e">2027 Budget proposals, not a personal tax quotation. Source and method: compound.ie</text>
<text x="1116" y="104" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="800" fill="#263f35" text-anchor="end">COMPOUND</text>
</svg>