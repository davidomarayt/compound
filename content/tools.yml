        min: 0
        step: 0.01
        help: "Suppliers set their own Clean Export Guarantee rate, so use the rate on your current or proposed tariff."

      - id: has_ev
        section_start: Electric vehicle
        label: EV is charged at this home
        type: checkbox
        default: false
        help: "Tick this to include the extra electricity demand from home EV charging and the option to divert solar into the car."
      - id: annual_ev_km
        label: EV distance driven per year
        type: number
        suffix: "km"
        default: 15000
        min: 0
        step: 500
        show_if: has_ev
      - id: ev_efficiency
        label: EV consumption
        type: number
        suffix: "kWh/100km"
        default: 18
        min: 1
        max: 60
        step: 0.5
        show_if: has_ev
