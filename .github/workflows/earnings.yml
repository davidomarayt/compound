name: Compound Earnings Monitor

on:
  schedule:
    # Twice per hour, off common whole-hour boundaries. UTC.
    - cron: '17,47 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Check SEC and show candidates without committing articles'
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  actions: write

concurrency:
  group: compound-earnings-publisher
  cancel-in-progress: false

jobs:
  check-earnings:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install structured-data dependency
        run: python -m pip install --disable-pip-version-check PyYAML
      - name: Check SEC financial filings and create verified content
        # david@compound.ie is published on the site's Contact page, allowing
        # SEC administrators to identify and contact the automated client.
        env:
          SEC_USER_AGENT: 'Compound.ie Earnings Research david@compound.ie'
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = 'true' ]; then
            python scripts/earnings.py --lookback-days 5 --max-new 3 --dry-run
          else
            python scripts/earnings.py --lookback-days 5 --max-new 3
          fi
      - name: Commit verified earnings articles
        if: github.event_name == 'schedule' || inputs.dry_run == false
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- content/wealth/
          if git diff --cached --quiet; then
            echo 'No new verified filings to publish.'
            exit 0
          fi
          git commit -m 'Publish SEC-verified earnings results'
          # Push with token via authenticated remote, without leaving credentials persisted on disk.
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push origin HEAD:"$GITHUB_REF_NAME"
          # GITHUB_TOKEN pushes do NOT start push-triggered workflows.
          # workflow_dispatch is permitted; launch the existing site publisher explicitly.
          gh workflow run site.yml --ref "$GITHUB_REF_NAME"