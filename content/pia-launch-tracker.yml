# Source-checked PIA / draft IIA launch milestones.
# Update only after verifying a dated original source, never as an elapsed-time tick.
# State "confirmed" = this HISTORICAL EVENT occurred; does not imply final law.
# State "unverified" = no final supporting evidence at this checkpoint.
# State "target" = stated future objective, not a guaranteed product release.
checked: '2026-11-26'
target_date: '2027-07-01'
headline: 'The Dáil passed Finance (No. 2) Bill 2026 on 25 November with the investment account amendments agreed; Seanad stages, signing into law and provider opening remain unverified'
next_checkpoint: 'Check the official record for Seanad stages of the Bill, including the Minister’s signalled recommendation on Revenue-provider information at account opening; then the signed Act, any commencement order and provider readiness.'
milestones:
  - id: budget-2027
    title: 'Investment account design announced'
    state: confirmed
    date: '2026-10-06'
    date_label: '6 October 2026'
    summary: 'Budget 2027 set the proposed €12,000 annual contribution cap and 1% charge above €50,000. These are announced policy terms, not an available account.'
    source_label: 'Budget 2027 announcement'
    source_url: 'https://www.rte.ie/news/business/2026/1006/1594235-investment-accounts-budget-2027/'
  - id: revenue-forum
    title: 'Revenue begins provider technical preparations'
    state: confirmed
    date: '2026-10-07'
    date_label: '7 October 2026'
    summary: 'Revenue invited providers and software partners to its technical forum covering account opening, eligibility and tax-reporting infrastructure.'
    source_label: 'Revenue technical forum notice'
    source_url: 'https://www.revenue.ie/ga/corporate/press-office/press-releases/2026/pr-100726-irish-investment-account.aspx'
  - id: bill-introduced
    title: 'Finance Bill introduces draft IIA rules'
    state: confirmed
    date: '2026-10-19'
    date_label: '19 October 2026'
    summary: 'Finance (No. 2) Bill 2026 was introduced. The draft calls the product an Individual Investment Account (IIA); introduction does not mean enactment.'
    source_label: 'Oireachtas Bill 98/2026'
    source_url: 'https://www.oireachtas.ie/en/bills/bill/2026/98/'
  - id: bill-committee-amended
    title: 'Committee-amended Finance Bill text published'
    state: confirmed
    date: '2026-11-12'
    date_label: '12 November 2026'
    summary: 'An official Oireachtas Bill version (No. 98a) is labelled as amended in Select Committee. It contains draft Individual Investment Account provisions in section 27. This is not enactment, commencement or a provider opening.'
    source_label: 'Oireachtas: Finance (No. 2) Bill 2026, as amended'
    source_url: 'https://data.oireachtas.ie/ie/oireachtas/bill/2026/98/eng/ver_a/b98a26d.pdf'
  - id: dail-report-stage
    title: 'Dáil Report Stage begins; account amendments agreed'
    state: confirmed
    date: '2026-11-24'
    date_label: '24 November 2026'
    summary: 'The Dáil began Report Stage on 24 November. Government amendments 18 to 27 to the draft investment account were agreed that day, including letting contributions pay account fees and tax-residence wording. The debate was adjourned before all amendments were taken. This is not passage of the Bill, enactment or commencement.'
    source_label: 'Dáil debate record, 24 November'
    source_url: 'https://www.oireachtas.ie/en/debates/debate/dail/2026-11-24/21/'
  - id: dail-passed
    title: 'Dáil passes the Finance Bill'
    state: confirmed
    date: '2026-11-25'
    date_label: '25 November 2026'
    summary: 'Report Stage resumed and the Dáil passed the Bill by 86 votes to 67. Further Government investment account amendments were agreed, including the rule for closing an account and requiring providers to remove over-limit contributions and ineligible investments and tell the account holder. Opposition amendments on yearly fee disclosure and a fees report were defeated. This is not enactment: the Seanad and signing into law still follow.'
    source_label: 'Dáil debate record, 25 November'
    source_url: 'https://www.oireachtas.ie/en/debates/debate/dail/2026-11-25/17/'
  - id: enacted-law
    title: 'Final law and commencement'
    state: unverified
    date_label: 'Not yet: Seanad stages and signing still to come'
    summary: 'The Bill passed the Dáil on 25 November. It must still go through the Seanad and be signed into law, and any commencement steps for the account rules would follow. The Minister has signalled a further change in the Seanad on information sharing between Revenue and providers. None of these later steps is confirmed yet.'
    source_label: 'Oireachtas Bill 98/2026'
    source_url: 'https://www.oireachtas.ie/en/bills/bill/2026/98/'
  - id: provider-terms
    title: 'Provider fees and account opening'
    state: unverified
    date_label: 'Not yet verified'
    summary: 'Providers have published pre-launch plans, but a complete verified PIA fee schedule and open application process have not been established in our tracker.'
    source_label: 'Revenue implementation notice'
    source_url: 'https://www.revenue.ie/ga/corporate/press-office/press-releases/2026/pr-100726-irish-investment-account.aspx'
    internal_url: '/pia/providers/'
    internal_label: 'View provider announcements'
  - id: launch-target
    title: 'Government’s planned opening date'
    state: target
    date: '2027-07-01'
    date_label: '1 July 2027'
    summary: 'This is the Government’s target for accounts to begin opening, subject to enacted legislation and individual providers being operationally ready. It is not a confirmed start date for any firm.'
    source_label: 'Revenue: subject to enactment'
    source_url: 'https://www.revenue.ie/ga/corporate/press-office/press-releases/2026/pr-100726-irish-investment-account.aspx'
