    guide: |
      ## The deposit is only part of the cash needed
      This tool calculates standard residential stamp duty using Revenue's current 1%, 2% and 6% progressive bands and adds the cost estimates you enter. Professional fees vary, so the legal, survey, valuation, moving and other figures are deliberately editable rather than presented as official averages.

      Mortgage protection, home insurance, furnishing, repairs and scheme-specific costs may need a separate budget.
    sources:
