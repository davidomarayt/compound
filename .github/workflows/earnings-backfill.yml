# Controlled 2026+ SEC backfill for one consolidated /stocks/<ticker>/ report per issuer.
# Replaces retired quarter-article generator: no new earnings article URLs.
name: S&P 500 Historical Earnings Coverage

on:
  schedule:
    # Small SEC-friendly batches. The first full S&P 500 scan takes multiple runs.
    - cron: '12,42 * * * *'
  push:
    branches: ['claude/clever-babbage-uibieq']
    paths:
      - 'scripts/earnings_historical_profiles.py'
      - '.github/workflows/earnings-backfill.yml'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview the next batch without updating files (default true)'
        type: boolean
        default: true

permissions:
  contents: write
  actions: write

# Serialize writes with the existing live earnings monitor.
concurrency:
  group: compound-earnings-publisher
  cancel-in-progress: false

jobs:
  hydrate-historical-profiles:
    if: github.ref == 'refs/heads/claude/clever-babbage-uibieq'
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install reporting test dependencies
        run: python -m pip install --disable-pip-version-check PyYAML pytest
      - name: Verify source reconciliation, duplicate protection and resume safety
        run: python -m pytest -q tests/test_earnings_historical_profiles.py tests/test_one_company_earnings.py
      - name: Hydrate one controlled historical batch from SEC EDGAR
        env:
          SEC_USER_AGENT: 'Compound.ie Earnings Research david@compound.ie'
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" = "true" ]; then
            python scripts/earnings_historical_profiles.py --batch-size 20 --dry-run
          else
            python scripts/earnings_historical_profiles.py --batch-size 20
          fi
          python - <<'PY'
          from pathlib import Path
          import json, os
          state = Path('content/earnings-backfill-state.json')
          if state.exists():
              d=json.loads(state.read_text())
              print(f"Backfill progress: {d['cursor']}/{d.get('company_count', 500)} S&P companies scanned, "
                    f"{d['created']} new profiles, {d['updated']} updated, "
                    f"{len(d['pending_retry'])} pending retries, completed={d['completed']}")
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
                  out.write(f"### S&P 500 SEC historical coverage\n\n")
                  out.write(f"- Scanned: **{d['cursor']}/{d.get('company_count', 500)}**\n")
                  out.write(f"- Newly verified: **{d['created']}**; updated: **{d['updated']}**\n")
                  out.write(f"- Pending SEC retries: **{len(d['pending_retry'])}**\n")
                  out.write(f"- Completed: **{d['completed']}**\n")
          PY
      - name: Commit verified stock datasets and resume position
        if: github.event_name != 'workflow_dispatch' || inputs.dry_run == false
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- content/earnings-profiles/ content/earnings-backfill-state.json
          site_changes="$(git diff --cached --name-only -- content/earnings-profiles/)"
          if git diff --cached --quiet; then
            echo 'No change required; historical coverage already complete.'
            exit 0
          fi
          git commit -m 'Backfill SEC-verified 2026 earnings into existing company dashboards'
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push origin HEAD:"$GITHUB_REF_NAME"
          if [ -n "$site_changes" ]; then
            gh workflow run site.yml --ref "$GITHUB_REF_NAME"
          else
            echo 'Only progress metadata changed; no site rebuild necessary.'
          fi
