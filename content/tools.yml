    meta_description: House buying costs calculator Ireland. Estimate deposit, residential stamp duty, legal, survey, valuation, moving and other upfront purchase costs.
    updated: 2026-09-21
    fields:
      - {id: price, label: Property price, type: number, prefix: "€", default: 400000, min: 0, step: 1000}
      - {id: deposit_pct, label: Deposit percentage, type: number, suffix: "%", default: 10, min: 0, max: 100, step: 1}
      - {id: legal, label: Legal / conveyancing budget, type: number, prefix: "€", default: 2500, min: 0, step: 100}
      - {id: survey, label: Survey / engineer budget, type: number, prefix: "€", default: 600, min: 0, step: 50}
      - {id: valuation, label: Valuation budget, type: number, prefix: "€", default: 200, min: 0, step: 50}
      - {id: moving, label: Moving / setup budget, type: number, prefix: "€", default: 1500, min: 0, step: 100}
      - {id: other, label: Other upfront costs, type: number, prefix: "€", default: 1000, min: 0, step: 100}
    results:
      - {id: deposit, label: Deposit}
      - {id: stamp, label: Residential stamp duty}
      - {id: other_costs, label: Other entered costs}
