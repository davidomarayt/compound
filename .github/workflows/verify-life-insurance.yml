name: Verify life insurance evergreen
on:
  push:
    branches: ["claude/clever-babbage-uibieq"]
    paths:
      - "content/wealth/life-insurance-ireland.md"
      - "compound/site/static/life-insurance-guide.css"
      - "compound/site/static/life-insurance-guide.js"
      - ".github/workflows/verify-life-insurance.yml"
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Validate published page, calculator, imagery and ad eligibility
        shell: bash
        run: |
          set -euxo pipefail
          fetch() {
            curl -fLSs --retry 12 --retry-delay 5 --retry-all-errors --connect-timeout 10 --max-time 30 "$1" -o "$2"
            test -s "$2"
          }
          # Deployment starts in a separate workflow; wait for the actual new hero.
          for attempt in $(seq 1 30); do
            fetch https://compound.ie/wealth/life-insurance-ireland/ /tmp/life-insurance.html
            if grep -Fq 'alt="Parents and two children embracing together at home' /tmp/life-insurance.html; then
              echo 'Pinned family photograph is live'
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo 'Pinned hero never reached the public article'
              exit 1
            fi
            sleep 8
          done
          grep -Fq 'Life Insurance Ireland 2026' /tmp/life-insurance.html
          grep -Fq 'href="https://compound.ie/wealth/life-insurance-ireland/"' /tmp/life-insurance.html
          grep -Fq 'id="li26-calc"' /tmp/life-insurance.html
          grep -Fq '/static/life-insurance-guide.css?v=1' /tmp/life-insurance.html
          grep -Fq '/static/life-insurance-guide.js?v=1' /tmp/life-insurance.html
          echo 'Current rendered hero:'
          grep -oE '<div class="article-cover".{0,650}' /tmp/life-insurance.html | head -1 || true
          echo 'Open Graph image:'
          grep -oE '<meta property="og:image"[^>]*' /tmp/life-insurance.html | head -1 || true
          grep -Fq '<img src="/static/images/evergreen/life-insurance-ireland.jpg"' /tmp/life-insurance.html
          grep -Fq 'Parents and two children embracing together at home' /tmp/life-insurance.html
          fetch https://compound.ie/static/images/evergreen/life-insurance-ireland.jpg /tmp/local-family-photo.jpg
          file --mime-type /tmp/local-family-photo.jpg | grep -Fq image/jpeg
          grep -Fq 'Catalina Herrera' /tmp/life-insurance.html
          grep -Fq 'property="og:image"' /tmp/life-insurance.html
          grep -Fq '/wealth/mortgage-protection-insurance-ireland/' /tmp/life-insurance.html
          grep -Fq 'https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=' /tmp/life-insurance.html
          fetch https://compound.ie/static/life-insurance-guide.js?v=1 /tmp/li.js
          grep -Fq 'li26-needed' /tmp/li.js
          fetch https://compound.ie/static/life-insurance-guide.css?v=1 /tmp/li.css
          grep -Fq '.li26-statgrid' /tmp/li.css
          fetch 'https://images.pexels.com/photos/20194638/pexels-photo-20194638.jpeg?auto=compress&cs=tinysrgb&w=1600' /tmp/li-hero.jpg
          file --mime-type /tmp/li-hero.jpg | grep -Fq image/jpeg
          echo 'Life insurance article, calculator assets, stock hero and AdSense loader verified live.'
