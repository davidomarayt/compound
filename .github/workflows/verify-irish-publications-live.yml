name: Verify Irish morning news live URLs
on:
  push:
    branches: ["claude/clever-babbage-uibieq"]
    paths:
      - "monitoring/irish-finance-publications/*.json"
      - ".github/workflows/verify-irish-publications-live.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Verify published morning edition, canonical URLs, sitemap and real cover images
        shell: bash
        run: |
          python - <<'PY'
          import json
          import time
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urljoin, urlparse
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError, URLError

          class Meta(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.canonical = ""
                  self.og_image = ""
                  self.h1 = 0
              def handle_starttag(self, tag, attrs):
                  data = dict(attrs)
                  if tag == "link" and "canonical" in data.get("rel", "").split():
                      self.canonical = data.get("href", "")
                  if tag == "meta" and data.get("property") == "og:image":
                      self.og_image = data.get("content", "")
                  if tag == "h1":
                      self.h1 += 1

          def read(url, attempts=6):
              for attempt in range(1, attempts + 1):
                  try:
                      request = Request(url, headers={"User-Agent": "Compound-Editorial-Publication-Verification/1.0"})
                      with urlopen(request, timeout=30) as response:
                          content_type = response.headers.get("Content-Type", "")
                          return response.status, content_type, response.read()
                  except (HTTPError, URLError, TimeoutError) as exc:
                      print(f"Attempt {attempt}/{attempts}: {url}: {exc}", flush=True)
                      if attempt == attempts:
                          raise
                      time.sleep(5)

          directory = Path("monitoring/irish-finance-publications")
          files = sorted(directory.glob("20??-??-??.json"))
          assert files, "No daily morning ledger files"
          ledger = json.loads(files[-1].read_text(encoding="utf-8"))
          assert ledger.get("edition") == "morning", f"Not a morning ledger: {files[-1]}"
          articles = ledger.get("articles", [])
          assert articles, f"No tracked morning items: {files[-1]}"

          status, content_type, raw = read("https://compound.ie/sitemap.xml")
          assert status == 200, "Sitemap HTTP status is not 200"
          sitemap = raw.decode("utf-8")
          for item in articles:
              url = item["canonical_url"]
              parsed = urlparse(url)
              assert parsed.scheme == "https" and parsed.netloc == "compound.ie"
              status, content_type, raw = read(url)
              assert status == 200 and "text/html" in content_type, f"Bad HTML response at {url}: {status} {content_type}"
              html = raw.decode("utf-8")
              meta = Meta()
              meta.feed(html)
              assert meta.canonical == url, f"Incorrect canonical at {url}: {meta.canonical}"
              assert meta.h1 == 1, f"Expected one H1 at {url}, saw {meta.h1}"
              assert meta.og_image, f"Missing og:image at {url}"
              image = urljoin(url, meta.og_image)
              assert urlparse(image).netloc == "compound.ie", f"Unpinned or offsite image at {url}: {image}"
              image_status, image_type, image_bytes = read(image)
              assert image_status == 200 and image_type.startswith("image/") and len(image_bytes) > 20000, (
                  f"Bad cover image at {url}: {image} ({image_status}, {image_type}, {len(image_bytes)} bytes)"
              )
              assert f"<loc>{url}</loc>" in sitemap, f"Missing sitemap entry: {url}"
              print(f"VERIFIED LIVE: {url} | image={image} | bytes={len(image_bytes)}", flush=True)
          print(f"PASS: {len(articles)} live Irish morning publication URLs, canonical tags, images and sitemap entries verified.")
          PY
