  - slug: rent-tax-credit-calculator
    title: Rent Tax Credit Calculator Ireland 2026
    category: Tax & Take-Home Pay
    formula: rent_credit
    summary: Estimate the 2026 Rent Tax Credit from qualifying rent, claim type and available Income Tax liability, and see what limits the claim.
    meta_description: Rent Tax Credit calculator Ireland 2026. Estimate the credit at 20% of qualifying rent up to €1,000 or €2,000 for a jointly assessed couple.
    updated: 2026-09-22
    fields:
      - {id: rent, label: Qualifying rent paid in the year, type: number, prefix: "€", default: 12000, min: 0, step: 100, help: "Enter qualifying rent only. Revenue says rent excludes extra services such as utilities, board or laundry."}
      - id: joint
        label: Claim type
        type: select
        default: no
        options:
          - {value: no, label: Individual / not jointly assessed}
          - {value: yes, label: Jointly assessed married couple or civil partners}
      - {id: income_tax_liability, label: Income Tax liability available to offset, type: number, prefix: "€", default: 5000, min: 0, step: 100, help: "The Rent Tax Credit can reduce Income Tax only. It cannot create a refund beyond the Income Tax liability available for the year."}
    results:
      - {id: rent_based, label: 20% of qualifying rent}
      - {id: statutory_cap, label: Maximum 2026 credit}
      - {id: credit, label: Estimated usable Rent Tax Credit}
      - {id: rent_for_max, label: Qualifying rent needed to reach statutory cap}
      - {id: unused_cap, label: Statutory cap not used}
    guide: |
      ## Three separate limits determine the credit

      Revenue grants Rent Tax Credit relief at 20% of qualifying rent. For 2024 to 2028, the maximum annual credit is €1,000 for an individual and €2,000 for a jointly assessed married couple or civil partners.

      The usable credit is therefore the lowest of three amounts: 20% of qualifying rent, the statutory maximum, and the Income Tax liability available to absorb the credit.

      An individual reaches the €1,000 statutory cap after €5,000 of qualifying rent. A jointly assessed couple reaches the €2,000 cap after €10,000. Paying more rent than that does not increase the statutory maximum.

      ## Income Tax liability can be the binding constraint

      The credit reduces Income Tax. Revenue states that it does not provide relief against USC or PRSI. If your available Income Tax liability is lower than the rent-based credit, the usable claim is limited to that Income Tax amount.

      Compound shows the unused part of the statutory cap so you can see whether rent, the legal cap or tax liability is constraining the result.

      ## Qualifying conditions still matter

      This calculator does not determine eligibility. Revenue's rules cover the use of the property, the tenancy, the relationship with the landlord and, in some cases, RTB registration.

      Revenue also states that “rent” for this credit does not include separate charges for services such as utilities, board or laundry. Enter only the rent amount you expect to qualify.

      For 2026, PAYE taxpayers can claim the credit in-year through myAccount or claim it on the 2026 Income Tax Return in 2027.

    sources:
      - {title: "Revenue — Rent Tax Credit overview", url: "https://www.revenue.ie/en/personal-tax-credits-reliefs-and-exemptions/land-and-property/rent-credit/index.aspx"}
      - {title: "Revenue — How much Rent Tax Credit can you claim?", url: "https://www.revenue.ie/en/personal-tax-credits-reliefs-and-exemptions/land-and-property/rent-credit/how-much-claim.aspx"}
      - {title: "Revenue — How to claim the Rent Tax Credit", url: "https://www.revenue.ie/en/personal-tax-credits-reliefs-and-exemptions/land-and-property/rent-credit/how-to-claim.aspx"}
  - slug: help-to-buy-calculator
    title: Help to Buy Calculator Ireland
    category: Mortgages & Home Buying
    formula: help_to_buy
    summary: Estimate the maximum Help to Buy refund for a qualifying new home or self-build.
    meta_description: Help to Buy calculator Ireland. Estimate relief up to €30,000, 10% of property value or tax paid, subject to the €500,000 property cap and 70% mortgage rule.
    updated: 2026-09-22
    basic_note: "Basic mode applies the 70% finance test using the qualifying mortgage only."
    advanced_note: "Advanced mode can include a qualifying Local Authority Affordable Purchase contribution for the HTB 70% finance test. Do not enter First Home Scheme equity here."
    fields:
      - {id: property_value, label: New-home purchase price or approved self-build valuation, type: number, prefix: "€", default: 400000, min: 0, step: 1000}
      - {id: mortgage, label: Qualifying mortgage amount, type: number, prefix: "€", default: 300000, min: 0, step: 1000}
      - {id: tax_paid, label: Income Tax + DIRT paid in the previous four tax years, type: number, prefix: "€", default: 30000, min: 0, step: 500}
      - {id: la_affordable_contribution, label: Local Authority affordable dwelling contribution, type: number, prefix: "€", default: 0, min: 0, step: 500, advanced: true, section_start: Advanced qualifying finance, help: "For qualifying Local Authority Affordable Purchase contracts on or after 11 October 2023. First Home Scheme equity does not count toward the HTB 70% finance test."}
    results:
      - {id: ltv, label: Qualifying finance loan-to-value}
      - {id: qualifying_finance, label: Finance counted for the 70% test}
      - {id: minimum_finance, label: 70% finance threshold}
      - {id: value_cap, label: 10% of property value}
      - {id: claim, label: Indicative maximum HTB refund}
      - {id: eligibility, label: Basic value/finance check}
    guide: |
      ## Enhanced Help to Buy runs to the end of 2029
      For a qualifying application, the enhanced refund is the lowest of €30,000, 10% of the qualifying property value, or the Income Tax and DIRT paid in the four tax years before the application. A qualifying property must generally be a new home or self-build valued at €500,000 or less, and the qualifying mortgage must normally be at least 70% of the purchase value or approved valuation.

      This tool checks those numerical conditions only. First-time-buyer status, occupancy, lender, tax-compliance and property requirements still apply.
    sources:
      - {title: "Revenue — How much can you claim under Help to Buy?", url: "https://www.revenue.ie/en/property/help-to-buy-incentive/how-much-can-you-claim.aspx"}
      - {title: "Revenue — What is a qualifying Help to Buy property?", url: "https://www.revenue.ie/en/property/help-to-buy-incentive/what-type-of-property-qualifies.aspx"}
      - {title: "Revenue — Help to Buy incentive", url: "https://www.revenue.ie/en/property/help-to-buy-incentive/index.aspx"}

