  - slug: contractor-vs-salary-calculator
    title: Contractor Day Rate vs Salary Calculator Ireland 2026
    category: Pay & Tax
    formula: contractor_vs_salary
    summary: Compare an indicative single-person PAYE salary with self-employed contractor profit and take-home.
    meta_description: Contractor vs salary calculator Ireland 2026. Compare employee salary with contractor day-rate revenue, business costs and estimated single-person taxes.
    updated: 2026-09-21
    fields:
      - {id: salary, label: Employee gross salary, type: number, prefix: "€", default: 70000, min: 0, step: 1000}
      - {id: day_rate, label: Contractor day rate, type: number, prefix: "€", suffix: "/day", default: 450, min: 0, step: 10}
      - {id: billable_days, label: Billable days per year, type: number, default: 220, min: 0, max: 366, step: 1}
      - {id: contractor_costs, label: Allowable contractor business costs, type: number, prefix: "€", default: 5000, min: 0, step: 500}
      - {id: contractor_pension, label: Contractor pension contribution used for Income Tax illustration, type: number, prefix: "€", default: 0, min: 0, step: 500}
    results:
      - {id: employee_net, label: Estimated employee take-home}
      - {id: contractor_revenue, label: Contractor gross revenue}
      - {id: contractor_profit, label: Contractor profit before pension}
      - {id: contractor_net, label: Indicative contractor take-home}
      - {id: net_difference, label: Difference in estimated annual take-home}
    guide: |
      ## A comparison tool, not a contractor-status test
      The employee side uses the 2026 single-person PAYE band and standard personal/employee credits. The contractor side assumes self-employed trading income, the standard USC bands, personal plus Earned Income Tax Credits and the 2026 blended Class S PRSI rate published by the Department of Social Protection.

      This does not decide whether a real engagement is employment or self-employment, and it does not value paid leave, employer pension contributions, sick pay, insurance, administration time, VAT, limited-company structures or employment rights. Use it to test the size of the gap, then price those differences separately.
    sources:
      - {title: Revenue — 2026 tax rates, bands and credits, url: "https://www.revenue.ie/en/personal-tax-credits-reliefs-and-exemptions/tax-relief-charts/index.aspx"}
      - {title: "Revenue — 2026 USC rates", url: "https://www.revenue.ie/en/jobs-and-pensions/usc/standard-rates-thresholds.aspx"}
      - {title: "Department of Social Protection — PRSI Class S rates", url: "https://www.gov.ie/en/department-of-social-protection/publications/prsi-class-s-rates/"}

  - slug: investment-fee-calculator
    title: Investment Fee Impact Calculator
    category: Retirement & Investing
    formula: investment_fees
    summary: See how annual investment fees can compound into a large difference over long periods.
    meta_description: Investment fee calculator. Compare two annual fee levels and see their long-term effect on a lump sum plus monthly investments.
    updated: 2026-09-21
    fields:
      - {id: initial, label: Starting investment, type: number, prefix: "€", default: 25000, min: 0, step: 500}
      - {id: monthly, label: Monthly investment, type: number, prefix: "€", default: 500, min: 0, step: 10}
      - {id: gross_return, label: Assumed annual return before fees, type: number, suffix: "%", default: 7, min: -20, max: 30, step: 0.1}
      - {id: fee_low, label: Lower annual fee, type: number, suffix: "%", default: 0.25, min: 0, max: 10, step: 0.05}
      - {id: fee_high, label: Higher annual fee, type: number, suffix: "%", default: 1.5, min: 0, max: 10, step: 0.05}
      - {id: years, label: Years invested, type: number, default: 25, min: 1, max: 70, step: 1}
    results:
      - {id: low_balance, label: Projected balance with lower fee}
      - {id: high_balance, label: Projected balance with higher fee}
      - {id: fee_gap, label: Difference attributable to fee drag and compounding}
    guide: |
      ## Fees compound too
      This illustration subtracts each annual fee from the assumed annual return and compounds monthly. It does not model Irish investment taxation, transaction costs or uneven market returns.

      The purpose is to isolate one question: if two investments earned the same return before fees, how much could a persistent fee difference matter over time?
    sources: []

  - slug: fire-number-calculator
    title: FIRE Number Calculator Ireland
    category: Retirement & Investing
    formula: fire_number
    summary: Turn annual spending and a chosen withdrawal rate into an illustrative financial-independence target.
    meta_description: FIRE number calculator Ireland. Estimate an investment target from annual spending, withdrawal rate, current portfolio and future contributions.
    updated: 2026-09-21
    fields:
      - {id: annual_spend, label: Annual spending to fund, type: number, prefix: "€", default: 36000, min: 0, step: 500}
      - {id: withdrawal_rate, label: Assumed withdrawal rate, type: number, suffix: "%", default: 4, min: 1, max: 10, step: 0.1}
      - {id: current, label: Current invested assets, type: number, prefix: "€", default: 100000, min: 0, step: 1000}
      - {id: annual_contribution, label: Annual new investment, type: number, prefix: "€", default: 18000, min: 0, step: 500}
      - {id: return_rate, label: Assumed annual investment return, type: number, suffix: "%", default: 6, min: -20, max: 30, step: 0.1}
    results:
      - {id: target, label: Illustrative FIRE target}
      - {id: gap, label: Gap from current portfolio}
      - {id: years, label: Years to target at entered assumptions}
    guide: |
      ## A withdrawal-rate target is a planning shortcut
      Dividing desired annual portfolio withdrawals by a chosen withdrawal rate creates a simple target. A 4% assumption, for example, corresponds to 25 times annual spending.

      It is not a guarantee that a portfolio will last for life. Tax, inflation, market sequence, fees, retirement duration, State Pension and changing spending all matter. The graph is an illustration using the constant return you enter.
    sources: []

  - slug: retirement-income-calculator
    title: Retirement Income Calculator Ireland
    category: Retirement & Investing
    formula: retirement_income
