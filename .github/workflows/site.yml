# Builds the static site from content/ and publishes it to GitHub Pages whenever an article is
# committed. The bot's DEPLOY_COMMAND does the commit and push; this does the rest. Enable once in
# the repo: Settings -> Pages -> Source: GitHub Actions.
name: site
on:
  push:
    paths: ["content/**", "compound/site/**", ".github/workflows/site.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-v2
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - name: Attach images to published News stories
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python scripts/news_images.py
      - run: compound build
        env:
          SITE_BASE_URL: https://compound.ie
          PREVIEW_BASE_URL: https://compound.ie
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  verify-live:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify public Compound deployment
        shell: bash
        run: |
          set -euo pipefail
          fetch() {
            curl --fail --silent --show-error --location               --retry 12 --retry-delay 5 --retry-all-errors               --connect-timeout 10 --max-time 30               "$1" -o "$2"
          }

          fetch https://compound.ie/tools/ /tmp/tools.html
          grep -Fq 'Mortgages &amp; Home Buying' /tmp/tools.html || grep -Fq 'Mortgages & Home Buying' /tmp/tools.html
          grep -Fq 'Pensions &amp; Investing' /tmp/tools.html || grep -Fq 'Pensions & Investing' /tmp/tools.html
          grep -Fq '/net-worth-calculator/' /tmp/tools.html
          grep -Fq '/debt-repayment-calculator/' /tmp/tools.html
          grep -Fq '/solar-payback-calculator/' /tmp/tools.html
          grep -Fq '/nutrition-needs-calculator/' /tmp/tools.html

          fetch https://compound.ie/mortgage-calculator/ /tmp/mortgage.html
          grep -Fq 'Mortgage Calculator Ireland' /tmp/mortgage.html
          grep -Fq 'Worked example' /tmp/mortgage.html
          grep -Fq 'Central Bank' /tmp/mortgage.html

          fetch https://compound.ie/net-worth-calculator/ /tmp/net-worth.html
          grep -Fq 'data-tool-name="net-worth-calculator"' /tmp/net-worth.html
          grep -Fq 'What net worth actually measures' /tmp/net-worth.html

          fetch https://compound.ie/debt-repayment-calculator/ /tmp/debt.html
          grep -Fq 'data-debt-calculator' /tmp/debt.html
          grep -Fq 'Debt avalanche' /tmp/debt.html
          grep -Fq 'MABS' /tmp/debt.html

          fetch https://compound.ie/nutrition-needs-calculator/ /tmp/nutrition.html
          grep -Fq 'Mifflin' /tmp/nutrition.html
          grep -Fq 'Frequently asked questions' /tmp/nutrition.html

          fetch https://compound.ie/static/tools.js /tmp/tools.js
          grep -Fq 'net_worth' /tmp/tools.js
          grep -Fq 'solar_payback' /tmp/tools.js
          grep -Fq 'nutrition_needs' /tmp/tools.js

          fetch https://compound.ie/sitemap.xml /tmp/sitemap.xml
          grep -Fq 'https://compound.ie/mortgage-calculator/' /tmp/sitemap.xml
          grep -Fq 'https://compound.ie/net-worth-calculator/' /tmp/sitemap.xml
          grep -Fq 'https://compound.ie/debt-repayment-calculator/' /tmp/sitemap.xml

          fetch https://compound.ie/wealth/how-to-start-investing-in-ireland/ /tmp/investing.html
          grep -Fq 'A complete beginner course for Irish investors' /tmp/investing.html
          grep -Fq 'course-grid' /tmp/investing.html
          grep -Fq '/static/investing-ireland.css?v=5' /tmp/investing.html
          grep -Fq '/wealth/before-you-invest-ireland/' /tmp/investing.html

          fetch https://compound.ie/static/investing-ireland.css?v=5 /tmp/investing.css
          grep -Fq 'Mobile-first finishing pass for Investing in Ireland 101' /tmp/investing.css
          grep -Fq '.investing-course-hub .course-grid' /tmp/investing.css

          fetch https://compound.ie/wealth/pensions-in-ireland/ /tmp/pensions.html
          grep -Fq 'From your first contribution to retirement income.' /tmp/pensions.html
          grep -Fq 'pension-course-grid' /tmp/pensions.html
          grep -Fq '/static/pension-ireland.css?v=1' /tmp/pensions.html
          grep -Fq '/wealth/how-pensions-work-ireland/' /tmp/pensions.html
          grep -Fq '/wealth/pension-lump-sum-tax-ireland/' /tmp/pensions.html

          fetch https://compound.ie/static/pension-ireland.css?v=1 /tmp/pension.css
          grep -Fq '.pension-course-grid' /tmp/pension.css
          grep -Fq '.pension-chapter-nav' /tmp/pension.css

          grep -Fq 'https://compound.ie/wealth/pensions-in-ireland/' /tmp/sitemap.xml
          grep -Fq 'https://compound.ie/wealth/how-pensions-work-ireland/' /tmp/sitemap.xml
          grep -Fq 'https://compound.ie/wealth/pension-options-ireland/' /tmp/sitemap.xml
          grep -Fq 'https://compound.ie/wealth/how-much-pension-contribute-ireland/' /tmp/sitemap.xml
          grep -Fq 'https://compound.ie/wealth/pension-funds-fees-ireland/' /tmp/sitemap.xml
          grep -Fq 'https://compound.ie/wealth/changing-jobs-transfer-pension-ireland/' /tmp/sitemap.xml
          grep -Fq 'https://compound.ie/wealth/when-can-i-access-pension-ireland/' /tmp/sitemap.xml

          fetch https://compound.ie/wealth/buying-a-home-in-ireland/ /tmp/homebuying.html
          grep -Fq 'From your first savings target to the day you get the keys.' /tmp/homebuying.html
          grep -Fq 'home-course-grid' /tmp/homebuying.html
          grep -Fq '/static/home-buying-ireland.css?v=1' /tmp/homebuying.html
          grep -Fq '/wealth/buying-home-budget-deposit-ireland/' /tmp/homebuying.html
          grep -Fq '/wealth/closing-buying-home-ireland/' /tmp/homebuying.html

          fetch https://compound.ie/static/home-buying-ireland.css?v=1 /tmp/homebuying.css
          grep -Fq '.home-course-grid' /tmp/homebuying.css
          grep -Fq '.home-chapter-nav' /tmp/homebuying.css

          grep -Fq 'https://compound.ie/wealth/buying-a-home-in-ireland/' /tmp/sitemap.xml
          grep -Fq 'https://compound.ie/wealth/buying-home-budget-deposit-ireland/' /tmp/sitemap.xml
          grep -Fq 'https://compound.ie/wealth/mortgage-approval-affordability-ireland/' /tmp/sitemap.xml
          grep -Fq 'https://compound.ie/wealth/first-time-buyer-supports-ireland/' /tmp/sitemap.xml
          grep -Fq 'https://compound.ie/wealth/house-hunting-bidding-ireland/' /tmp/sitemap.xml
          grep -Fq 'https://compound.ie/wealth/sale-agreed-survey-valuation-ireland/' /tmp/sitemap.xml
          grep -Fq 'https://compound.ie/wealth/solicitor-conveyancing-stamp-duty-ireland/' /tmp/sitemap.xml
          grep -Fq 'https://compound.ie/wealth/fixed-vs-variable-mortgage-ireland/' /tmp/sitemap.xml
          grep -Fq 'https://compound.ie/wealth/mortgage-protection-drawdown-ireland/' /tmp/sitemap.xml
          grep -Fq 'https://compound.ie/wealth/closing-buying-home-ireland/' /tmp/sitemap.xml

          echo 'Live verification passed for Compound calculator catalogue and flagship guides.'
