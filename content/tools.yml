    guide: |
      ## Build retirement income from several sources
      This calculator combines a simple percentage withdrawal from your entered pot with the State Pension amount and other income you choose to include. It intentionally leaves the State Pension field editable because entitlement and rates depend on the person and can change.

      The result is gross income before tax. A fixed withdrawal percentage is not a guarantee of sustainability.
    sources: []

