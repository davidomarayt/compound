guides:
  asthma:
    aliases: wheezing reactive airways
    summary: Asthma makes the airways sensitive and can cause episodes of wheezing, coughing, breathlessness or chest
      tightness. Good control reduces symptoms and the risk of an attack.
    emergency: If someone is having a severe asthma attack, is too breathless to speak or is getting worse despite using
      their reliever as directed in their action plan, call
    symptoms:
    - Symptoms may come and go. Wheezing, a tight chest, shortness of breath and a cough that wakes you at night are
      typical. The pattern matters because examinations between episodes can be normal.
    - Colds, pollen, exercise, smoke or cold air may bring on symptoms. What triggers one person's asthma may have little
      effect on somebody else.
    causes:
    - In asthma, the lining of the airways becomes inflamed and the muscles around them can tighten. Swelling, muscle
      tightening and mucus leave less room for air to move.
    diagnosis:
    - A GP reviews the pattern and may use spirometry or ask you to record peak flow over time. Changes in airflow after
      an inhaler can help clarify the diagnosis.
    care:
    - Your clinician can check inhaler technique and explain when to use each inhaler. An asthma action plan sets out
      what to do on ordinary days, when symptoms worsen and during an attack.
    - Bring your inhalers to reviews. Night waking, avoiding exercise and increasingly frequent reliever use are worth
      discussing even if you feel well on the day.
    complications:
    - Poorly controlled asthma can interfere with sleep, school, work or exercise. Attacks can come on quickly and can
      require emergency treatment.
    help:
    - Arrange a GP review if symptoms recur, wake you or limit activity. Arrange prompt follow-up after an attack, even
      if you feel better.
    sources:
      HSE asthma symptoms: https://www2.hse.ie/conditions/asthma/symptoms-of-asthma/
      HSE asthma diagnosis and tests: https://www2.hse.ie/conditions/asthma/diagnosing-asthma/
      HSE advice on asthma attacks: https://www2.hse.ie/conditions/asthma/asthma-attacks/
    links:
      Salbutamol inhaler guide: /health/medicines/salbutamol/
  high-blood-pressure-hypertension:
    aliases: hypertension raised blood pressure bp
    summary: High blood pressure means the pressure in your arteries stays raised. Most people feel well, so measurement
      is the way to find it.
    symptoms:
    - High blood pressure usually causes no symptoms. Feeling well is compatible with repeatedly high readings. Headaches
      or dizziness have many causes and cannot tell you whether your blood pressure is high.
    causes:
    - The longer pressure in the arteries stays raised, the more work the heart has to do. Over time the strain can damage
      blood vessels in the brain, kidneys and eyes.
    - Age and family history can raise risk. A clinician may also consider kidney disease, medicines and other contributors
      depending on your history.
    diagnosis:
    - Blood pressure changes during the day and with stress, activity and how it is measured. A GP may ask for readings
      at home or arrange a 24-hour monitor to check whether it stays high.
    - Bring the monitor or readings to your appointment. Ask what readings apply in your case and whether your cuff fits
      properly.
    care:
    - Treatment can include changes such as eating less salt and being more physically active. Whether medicine is advised
      depends on repeated readings, other health conditions and your overall risk of events such as stroke.
    - Ask your GP or pharmacist what your tablets do and how your pressure and any relevant blood tests will be followed
      up.
    complications:
    - High blood pressure increases the risk of stroke, heart disease, kidney damage and some eye problems. Identifying
      it and treating it early helps reduce long-term risk.
    help:
    - Arrange a check with your GP, practice nurse or a pharmacy that offers checks. Contact your GP about repeatedly
      high readings. Follow your maternity team's advice if you are pregnant, as raised blood pressure in pregnancy needs
      separate assessment.
    sources:
      HSE hypertension treatment: https://www2.hse.ie/conditions/high-blood-pressure-hypertension/treatment/
    links:
      What helps lower blood pressure: /health/lower-blood-pressure-naturally-what-works/
  high-cholesterol:
    aliases: raised cholesterol hypercholesterolaemia ldl lipid
    summary: High cholesterol usually comes to light on a blood test. The result helps your GP assess your overall risk
      of a heart attack or stroke.
    symptoms:
    - Raised cholesterol usually causes no symptoms. Some people first learn about it after a cardiovascular event or
      when a blood test is done for another reason.
    causes:
    - Cholesterol circulates in particles called lipoproteins. Higher levels of LDL cholesterol can contribute to a build-up
      of plaque in artery walls. Over time this can restrict blood flow or lead to a sudden blockage.
    - Inherited factors can have a major effect. Tell your GP if close relatives had a heart attack or stroke unusually
      young or have been told they have familial hypercholesterolaemia.
    diagnosis:
    - A blood test can measure different components, including LDL cholesterol, HDL cholesterol and triglycerides. The
      interpretation depends on why the test was done and your wider cardiovascular history.
    - A GP may consider your age, smoking, blood pressure and diabetes status alongside your result. A single total cholesterol
      value cannot give the whole risk picture.
    care:
    - Treatment can include dietary changes and medicines such as statins. The potential benefit depends partly on your
      starting risk, so ask what the result means for you and when to repeat the test.
    complications:
    - Cholesterol-related plaque can contribute to coronary heart disease, stroke and problems with circulation in the
      legs.
    help:
    - Speak to your GP if a test shows a high result, or if early heart disease runs in your family. Bring the full set
      of results if they were taken elsewhere.
    sources:
      HSE cholesterol diagnosis: https://www2.hse.ie/conditions/high-cholesterol/diagnosis/
    links:
      What lowers LDL cholesterol: /health/how-to-lower-cholesterol-what-moves-ldl/
      Statins and cardiovascular risk: /health/medicines/statins/
  coeliac-disease:
    aliases: celiac gluten enteropathy
    summary: Coeliac disease is an immune reaction to gluten that damages the lining of the small bowel. It can cause
      digestive symptoms, tiredness or nutrient deficiencies.
    symptoms:
    - Possible signs include diarrhoea, bloating, stomach pain, weight loss or persistent fatigue. In children, poor
      growth can be a clue. Some people have few obvious digestive symptoms.
    causes:
    - Gluten proteins in wheat, barley and rye trigger an immune response in people with coeliac disease. It can damage
      the villi, the tiny structures that absorb nutrients from food.
    - A close family history raises the likelihood. Symptoms can overlap with irritable bowel syndrome, making it useful
      to test before making a permanent change to your diet.
    diagnosis:
    - A GP can arrange a blood test and may refer you to a specialist for further testing. Whether a biopsy is needed
      depends on your situation and the diagnostic pathway.
    - Keep eating gluten while you discuss testing with your GP. Starting a gluten-free diet before testing can affect
      the results. If you already avoid gluten, ask about your options before changing your diet again.
    care:
    - A lifelong gluten-free diet is the main treatment after diagnosis. A dietitian can help you spot hidden sources,
      reduce cross-contact and plan meals with enough fibre, iron and other nutrients.
    complications:
    - Ongoing bowel damage can contribute to iron deficiency anaemia and weaker bones. Follow-up can help identify nutritional
      problems even if stomach symptoms improve.
    help:
    - Ask your GP about testing if bowel symptoms persist, you have unexplained anaemia or a close relative has coeliac
      disease. Mention if a child is losing weight or growing more slowly than expected.
  cystic-fibrosis:
    aliases: cf cftr
    summary: Cystic fibrosis is an inherited condition that can affect the lungs and digestion. In Ireland, specialist
      cystic fibrosis centres coordinate regular care.
    symptoms:
    - Signs can include a long-lasting cough, repeated chest infections, difficulty gaining weight or bulky, greasy stools.
      The combination and severity vary from one person to another.
    causes:
    - Variants in the CFTR gene affect how salt and water move across cell surfaces. Secretions in the lungs and digestive
      system can become thicker. Mucus can be harder to clear from the airways and digestive enzymes may have difficulty
      reaching the bowel.
    diagnosis:
    - Newborn bloodspot screening can identify babies who need further tests. A sweat chloride test and genetic testing
      can help confirm a diagnosis. A clinician may also investigate someone who develops suggestive symptoms later.
    care:
    - Care can involve airway clearance, treatment for chest infections and pancreatic enzymes where needed. Some people
      can take CFTR modulators, which target the underlying protein problem. Suitability depends on each person's gene
      variants and clinical circumstances.
    - A specialist team can coordinate physiotherapy, nutrition, lung monitoring and transition from paediatric to adult
      care.
    complications:
    - Repeated chest infections can damage the lungs. Some people develop nutrition problems, CF-related diabetes or
      complications affecting other organs, which the CF team monitors.
    help:
    - If you have CF, ask your centre whom to contact if your cough changes, your breathing worsens or you develop fever.
      If a baby has been referred after newborn screening, attend the follow-up even if the baby seems well.
  endometriosis:
    aliases: endo pelvic pain painful periods
    summary: Endometriosis can cause pelvic pain, painful periods or difficulties getting pregnant when tissue similar
      to the womb lining grows elsewhere.
    symptoms:
    - Common symptoms include pelvic pain, periods that disrupt daily life, pain deep during or after sex and pain when
      opening your bowels or passing urine, particularly around a period. Some people have difficulty becoming pregnant.
    - A diary can record the timing, what makes the pain worse and how it affects sleep, work, school or exercise. Pain
      can have other causes as well.
    causes:
    - Tissue similar to the lining of the womb can grow outside it, often around the ovaries or elsewhere in the pelvis.
      It can cause inflammation and sometimes scarring or ovarian cysts.
    diagnosis:
    - A GP can assess symptoms and may arrange an examination, ultrasound or onward referral. A normal scan can miss
      some forms of endometriosis, so ongoing symptoms still deserve assessment.
    - Your GP can discuss starting treatment while the assessment continues. Some people need a specialist evaluation
      or keyhole surgery.
    care:
    - Options include pain relief, hormonal treatment and, for some people, surgery. The best fit depends on symptoms,
      preferences and whether trying to get pregnant is a priority.
    complications:
    - Pelvic pain can affect work, relationships and wellbeing. Endometriosis can also make it harder to conceive, although
      many people with the condition do become pregnant.
    help:
    - Speak to your GP if pain interferes with ordinary activities or treatment has not helped. Bring your symptom diary
      and explain if fertility is a concern.
    sources:
      HSE National Framework for the Management of Endometriosis: https://about.hse.ie/publications/a-national-framework-for-the-management-of-endometriosis-in-ireland/
  epilepsy:
    aliases: seizures fits
    summary: Epilepsy is a neurological condition that causes a tendency to have repeated seizures. Some seizures involve
      staring or confusion, while others cause falls or shaking.
    emergency: If it is a first seizure, lasts longer than five minutes, another follows without recovery, or the person
      is seriously injured or has trouble breathing, call
    symptoms:
    - The signs depend on where abnormal electrical activity starts and how far it spreads. Someone may stare, become
      confused, experience unusual sensations or develop stiffening and jerking.
    - Recovery also varies. The person may be tired, confused or have limited memory of the event afterwards.
    causes:
    - Seizures arise from a temporary disruption in the brain's electrical activity. Epilepsy can have a genetic, structural
      or other cause. Sometimes the cause remains unknown after investigation.
    diagnosis:
    - A detailed description from the person or a witness can help. A specialist may use an EEG to record brain activity
      and may arrange imaging. A clinician evaluates possible causes, since fainting and some other conditions can resemble
      a seizure.
    care:
    - Anti-seizure medicines reduce seizures for many people. Treatment and safety planning depend on the seizure type
      and circumstances. Ask the epilepsy team about medicine reviews, driving rules and what to do when a seizure occurs.
    complications:
    - Seizures can lead to injury or affect daily activities. A seizure that continues or repeats without recovery is
      an emergency.
    help:
    - During a convulsive seizure, time it, move hazards away, protect the person's head and stay with them. Avoid holding
      them down or placing anything in their mouth. Follow their individual care plan if one is available.
    sources:
      Epilepsy Ireland seizure first aid: https://www.epilepsy.ie/content/seizure-first-aid
  stroke:
    aliases: cva brain attack fast
    summary: A stroke happens when blood flow to part of the brain is blocked or when bleeding occurs in the brain. Getting
      emergency help quickly can affect the outcome.
    emergency: For sudden face drooping, arm weakness, speech difficulty or another suspected stroke symptom, call
    symptoms:
    - Think FAST. Check for sudden changes to the face, difficulty lifting an arm, or slurred or confused speech. Time
      matters. Sudden vision changes, balance problems or weakness on one side can also occur.
    - Symptoms that clear quickly still need emergency assessment, as a transient ischaemic attack can have the same
      signs.
    causes:
    - An ischaemic stroke occurs when a blockage interrupts blood flow. A haemorrhagic stroke involves bleeding. In both,
      brain cells can be injured and the treatment depends on the cause.
    diagnosis:
    - A hospital team examines symptoms and uses a brain scan to distinguish bleeding from a blockage. Blood tests, heart
      rhythm checks and further scans can help identify why it happened.
    care:
    - Some people with an ischaemic stroke can receive urgent treatment to dissolve or remove a clot. The stroke team
      uses scan findings, time since onset and clinical information to make this decision.
    - Rehabilitation may help with movement, speech, swallowing and everyday tasks. The team also looks at how to lower
      the risk of another stroke.
    complications:
    - Effects vary and can include changes to strength, sensation, language, vision, memory or swallowing. Recovery differs
      by person and can continue well beyond the hospital stay.
    help:
    - Call emergency services when symptoms start. If you know when the person was last well, tell the ambulance team.
      Seek help again if symptoms recur.
    sources:
      Irish National Audit of Stroke: https://www.noca.ie/audits/irish-national-audit-of-stroke/
  sepsis:
    aliases: septic shock blood poisoning
    summary: Sepsis is a medical emergency in which the body's response to an infection starts to damage its own tissues
      or organs.
    emergency: If someone may have sepsis or is deteriorating rapidly with an infection, call
    symptoms:
    - Warning signs can include new confusion, severe breathlessness, passing very little urine, cold or mottled skin,
      or feeling unusually and severely unwell. Signs in babies and children can differ from adults.
    - A person can have sepsis without a high temperature. Take a rapid deterioration, or somebody becoming hard to wake,
      seriously.
    causes:
    - Sepsis can develop from infections such as pneumonia, a urinary infection or an infection of the skin. The response
      to infection can affect circulation and prevent organs getting enough blood and oxygen.
    diagnosis:
    - There is no single home test for sepsis. Clinicians assess symptoms, vital signs and blood tests and look for the
      source of infection. Other tests depend on the person's condition.
    care:
    - Hospital treatment can include antibiotics when bacterial infection is suspected, fluid through a vein, oxygen
      when needed and treatment of the infection's source. Some people need intensive care or other organ support.
    complications:
    - Sepsis can cause organ failure and can be fatal. Recovery can involve persistent tiredness, weakness or problems
      with concentration. Ask your clinical team about follow-up if symptoms continue after discharge.
    help:
    - If someone with an infection is getting much worse, say clearly that you are worried about sepsis. Tell emergency
      staff about the infection, recent surgery or treatment and when the change began.
    links:
      Ireland’s sepsis strategy and warning signs: /news/ireland-sepsis-strategy-warning-signs-2026/
  copd:
    aliases: chronic obstructive pulmonary disease emphysema chronic bronchitis
    summary: Chronic obstructive pulmonary disease causes long-term airflow limitation. Breathlessness with ordinary
      activity and a persistent cough are common clues.
    emergency: If someone is struggling to breathe, cannot speak because of breathlessness or has blue or grey lips,
      call
    symptoms:
    - Common symptoms include increasing breathlessness on exertion, a persistent cough with phlegm, wheeze and repeated
      chest infections.
    - A flare-up is a change from your usual symptoms, such as becoming much more breathless or producing more phlegm
      than normal.
    causes:
    - COPD can involve damage to the tiny air sacs or long-term inflammation in the airways. This makes it harder to
      breathe air out. Tobacco smoke is a major risk factor. Workplace dust, fumes and some inherited conditions can
      also contribute.
    diagnosis:
    - A GP reviews symptoms and exposure history and may arrange spirometry, a test that measures how much and how quickly
      you can breathe air out. Other tests can help investigate alternative explanations.
    care:
    - If you smoke, your clinician can offer support to quit. Depending on symptoms, treatment may also include inhalers,
      vaccination advice and pulmonary rehabilitation.
    - A written flare-up plan can spell out when to contact the GP or respiratory team. Ask someone to check your inhaler
      technique before assuming a prescribed inhaler is failing.
    complications:
    - Flare-ups can require hospital care. Persistent symptoms can make daily activities harder and limit exercise. Rehabilitation
      can help people build confidence with activity and manage breathlessness.
    help:
    - Book a GP assessment if you have ongoing breathlessness or a cough that persists. If you have COPD and your breathing
      changes suddenly, follow your action plan and contact your clinical team promptly.
  atrial-fibrillation:
    aliases: af afib irregular heartbeat arrhythmia
    summary: Atrial fibrillation is an irregular heart rhythm that can cause palpitations and raise the risk of stroke.
      Some people only discover it during a pulse or heart rhythm check.
    emergency: If someone has signs of stroke, such as sudden facial droop, arm weakness or difficulty speaking, call
    symptoms:
    - Some people notice a racing or irregular heartbeat, breathlessness, fatigue or dizziness. Others have no symptoms.
      Episodes can come and go, so it helps to record when symptoms occur and how long they last.
    causes:
    - The upper chambers of the heart receive disorganised electrical signals. The heartbeat becomes irregular and may
      be fast. Blood can pool in part of the heart, where a clot can form and travel to the brain.
    diagnosis:
    - An ECG records the electrical rhythm. A clinician may arrange a longer recording if episodes are brief or intermittent.
      Other tests may look for underlying contributors, such as thyroid problems.
    care:
    - Your clinician may look at how to control the rate or restore the rhythm and will assess your risk of stroke and
      bleeding. An anticoagulant can reduce stroke risk for people who are likely to benefit.
    - Treatment discussions can cover rhythm procedures, what to do if symptoms recur and how to take medicines safely.
      A home device reading can help start a conversation with your GP.
    complications:
    - Atrial fibrillation increases the risk of stroke. Persistent high heart rates can also strain the heart. Some people
      continue to have symptoms that affect activity even when they're taking treatment.
    help:
    - Ask your GP about a pulse and rhythm check if you repeatedly notice a racing or irregular heartbeat. If palpitations
      come with suspected heart attack or stroke symptoms, seek emergency help.
  type-1-diabetes:
    aliases: t1d insulin-dependent diabetes dka juvenile diabetes
    summary: In type 1 diabetes the body makes little or no insulin. It needs prompt diagnosis and lifelong insulin treatment.
    emergency: For suspected diabetic ketoacidosis with vomiting, severe drowsiness or unusual deep or rapid breathing,
      call
    symptoms:
    - Drinking much more, passing urine more often, losing weight without trying and feeling extremely tired are common
      signs. Symptoms can build up quickly, especially in children.
    causes:
    - The immune system attacks the insulin-producing cells in the pancreas. Without enough insulin, glucose builds up
      in the blood and the body starts to use fat for energy, producing substances called ketones.
    diagnosis:
    - A GP can check blood glucose quickly when type 1 diabetes is suspected and arrange urgent hospital assessment if
      needed. The specialist team may check ketones and use additional tests to clarify the diabetes type.
    care:
    - People with type 1 diabetes need insulin. The diabetes team helps plan insulin, glucose monitoring, meals, activity
      and how to respond to low blood glucose.
    - Ask your team for a written sick-day plan and guidance on when to check ketones. Illness can change glucose and
      insulin requirements.
    complications:
    - Too little insulin can lead to diabetic ketoacidosis, an emergency. Insulin treatment can also lead to episodes
      of low blood glucose. Over time, monitoring and treatment help protect the eyes, kidneys, nerves and blood vessels.
    help:
    - Contact a GP urgently if you suspect new type 1 diabetes. If you already have it and your glucose or ketones rise,
      use your sick-day plan and contact the diabetes team when directed.
    sources:
      HSE advice on diabetic ketoacidosis: https://www2.hse.ie/conditions/type-1-diabetes/blood-glucose/ketones-and-diabetic-ketoacidosis-dka/
  type-2-diabetes:
    aliases: t2d diabetes glucose hba1c
    summary: Type 2 diabetes develops when the body cannot use insulin effectively or cannot make enough to keep blood
      glucose in a healthy range.
    symptoms:
    - Thirst, frequent urination, tiredness, blurred vision and slow-healing cuts can occur. Symptoms often build gradually
      and some people first find out through a routine blood test.
    causes:
    - Insulin normally helps move glucose from the blood into cells. In type 2 diabetes, tissues respond less efficiently
      to insulin and the pancreas may not keep up. Family history, age and a history of gestational diabetes can increase
      risk.
    diagnosis:
    - A GP can arrange a blood test. HbA1c is one test used to assess average glucose over recent months. You may need
      another test to confirm the result, depending on symptoms and the result.
    care:
    - Treatment can include changes to diet and activity, medicines and regular monitoring. A care team considers your
      preferences and conditions such as kidney or heart disease when discussing options.
    - Ask when to have your eyes, feet, kidneys and blood pressure checked. A plan should cover follow-up even when you
      feel well.
    complications:
    - Over time, raised glucose can damage blood vessels and nerves. Heart, kidney, eye and foot problems can develop,
      which is why follow-up covers more than glucose alone.
    help:
    - Speak to your GP if you have symptoms or were told you have pre-diabetes. If you already have diabetes and notice
      a new foot wound or infection, contact your care team promptly.
  migraine:
    aliases: migraine with aura migraine headache
    summary: Migraine is a neurological condition that causes recurring attacks. Head pain, nausea and sensitivity to
      light or sound are common, and some people experience aura.
    emergency: If a headache reaches severe intensity suddenly, or comes with new facial droop, weakness or difficulty
      speaking, call
    symptoms:
    - An attack may bring moderate or severe head pain, sometimes on one side. Moving around may make the pain worse
      and ordinary sound or light may feel difficult to tolerate.
    - Some people have aura, such as flashing lights or changes in vision. Other people have migraine attacks without
      aura.
    causes:
    - Migraine involves changes in how the brain and nerves process signals, including pain and sensory information.
      It can run in families. Irregular sleep, missed meals or hormonal changes may be associated with attacks in some
      people.
    diagnosis:
    - A GP usually starts with the pattern of symptoms and a neurological examination. Keeping a diary of timing, symptoms,
      duration and medicines can help.
    care:
    - Your GP can discuss medicines to take during an attack and whether preventive treatment is suitable. Bring a list
      of the medicines you use, including over-the-counter pain relief and how often you take it.
    - Keeping meals, hydration and sleep relatively regular may help some people manage their attacks.
    complications:
    - Frequent migraine can interfere with work, study, sleep and family responsibilities. Frequent use of some acute
      medicines can contribute to medication-overuse headache.
    help:
    - Speak to your GP if headaches recur, are becoming harder to manage or begin to follow a different pattern. New
      sudden neurological symptoms need emergency assessment even when you have a history of migraine.
  norovirus:
    aliases: winter vomiting bug stomach bug
    summary: Norovirus commonly causes sudden vomiting and diarrhoea. It spreads easily, so recovering at home and taking
      care with handwashing can help protect others.
    symptoms:
    - The illness often begins with nausea, vomiting or watery diarrhoea. Some people also have stomach cramps, aches
      or fever. Most people recover within a few days.
    causes:
    - The virus can pass from person to person and via surfaces, food or water. It can spread readily in households and
      other shared settings.
    diagnosis:
    - The pattern of symptoms often guides care. A clinician may arrange a sample where the cause needs clarification,
      for example when investigating an outbreak.
    care:
    - Take small, frequent sips if you are vomiting. A pharmacist can advise about oral rehydration products. Wash hands
      with soap and water and clean contaminated surfaces.
    - Follow HSE advice to stay away from work or school until at least 48 hours after symptoms stop. Avoid visiting
      hospitals or care homes during that period.
    complications:
    - The main concern is dehydration, particularly in babies, older adults and people with other health problems. Watch
      for passing less urine, or fewer wet nappies in a baby.
    help:
    - Contact a GP if you cannot keep fluids down, notice signs of dehydration, have blood in your stool or are concerned
      about a baby or a vulnerable adult.
  measles:
    aliases: rubeola mmr rash
    summary: Measles is a highly contagious viral illness that can cause fever, cough and a rash. Phone ahead if you
      think you or your child may have it.
    symptoms:
    - Signs often begin with a fever, cough, runny nose or sore red eyes. The rash typically starts on the face or head
      before spreading down the body. It can be more difficult to see on darker skin.
    causes:
    - The measles virus spreads through the air when someone with the infection breathes, coughs or sneezes. Measles
      can spread before the rash appears.
    diagnosis:
    - A clinician asks about symptoms, vaccination, travel and possible exposure. Testing can confirm measles and helps
      public health teams respond to cases.
    care:
    - Care focuses on symptoms and monitoring for complications. Stay away from others and follow isolation advice from
      your clinician or public health team. The MMR vaccine helps prevent measles.
    complications:
    - Measles can cause ear infections, pneumonia and, more rarely, inflammation of the brain. Babies, pregnant people
      and people with weakened immune systems may need particular advice after exposure.
    help:
    - Phone your GP before visiting if you suspect measles. Let them know if anyone exposed is pregnant, is a baby or
      has a weakened immune system. If someone becomes severely breathless or very difficult to wake, call emergency
      services.
  transient-ischaemic-attack-tia:
    aliases: mini stroke mini-stroke transient ischemic attack
    summary: A transient ischaemic attack causes sudden stroke-like symptoms that resolve. It can be an early warning
      of a future stroke and needs emergency assessment.
    emergency: If you notice sudden face drooping, arm weakness or problems speaking, even if the symptoms have stopped,
      call
    symptoms:
    - Signs can include sudden weakness or numbness on one side, a drooping face, speech difficulty or loss of vision.
      Symptoms can clear before help arrives.
    causes:
    - A temporary interruption of blood flow to part of the brain produces symptoms. An underlying cause could be disease
      in the blood vessels or a clot associated with a heart rhythm problem such as atrial fibrillation.
    diagnosis:
    - The team takes a history of exactly what happened and when. They may use brain or blood vessel imaging, heart rhythm
      tests and blood tests to investigate the cause.
    care:
    - The treatment plan depends on the cause. The team may prescribe medicine to help prevent clots, treat blood pressure
      or cholesterol, or investigate whether a procedure could help.
    complications:
    - A TIA often leaves no lasting symptoms, but the risk of stroke can be higher soon afterwards. Fast assessment gives
      clinicians the opportunity to start preventive treatment.
    help:
    - Seek emergency help even when the person feels well again. Note when symptoms began and when they resolved. If
      you already have a care plan, report new symptoms as an emergency.
  coronary-heart-disease-chd:
    aliases: ischemic heart disease coronary artery disease cad chd
    summary: Coronary heart disease develops when the arteries supplying the heart become narrowed. It can cause angina
      or lead to a heart attack.
    emergency: If you suspect a heart attack, including new pressure or tightness in the chest with breathlessness, sweating
      or pain spreading to an arm or jaw, call
    symptoms:
    - Symptoms can include chest pressure, tightness or breathlessness during exertion. Angina can sometimes feel like
      discomfort in the arm, jaw, neck or back. The pattern varies between people.
    causes:
    - Atherosclerosis happens when plaque builds up in artery walls. It can reduce blood flow when the heart needs more
      oxygen, for example during exercise. If plaque ruptures and a clot forms, blood flow may stop suddenly.
    diagnosis:
    - A GP or hospital team reviews symptoms and risk factors. Tests may include an ECG, blood tests and imaging to assess
      how blood flows to the heart.
    care:
    - Care can include medicines, support to stop smoking, activity advice or a procedure to improve blood flow. Ask
      your clinician how to manage symptoms and how to reduce the risk of a future heart attack.
    complications:
    - A heart attack can damage the heart muscle. Coronary disease can also contribute to changes in heart rhythm, heart
      failure and reduced exercise capacity.
    help:
    - Tell your GP about recurring discomfort or breathlessness on exertion. Seek emergency help if there are suspected
      heart attack symptoms or a sudden and severe change.
  pre-diabetes:
    aliases: prediabetes impaired glucose tolerance impaired fasting glucose
    summary: Pre-diabetes means your blood glucose is higher than expected but below the range used to diagnose diabetes.
      It identifies an increased risk of type 2 diabetes.
    symptoms:
    - Most people have no obvious symptoms and find out after a blood test. Tell your GP if you develop unusual thirst,
      frequent urination or unexplained weight loss, since other assessments may be needed.
    causes:
    - Blood glucose can rise when tissues become less responsive to insulin or the pancreas cannot produce enough to
      compensate. Family history, age and previous gestational diabetes can increase risk.
    diagnosis:
    - A GP can interpret tests such as HbA1c, which reflects average glucose over recent months. The interpretation depends
      on the test used and individual circumstances.
    care:
    - A realistic plan often starts with changes to activity and food that you can sustain. Ask your GP whether a programme
      is available in your area and when to repeat your blood test.
    complications:
    - Some people with pre-diabetes go on to develop type 2 diabetes, while others return to a lower glucose range. A
      GP may also review blood pressure, cholesterol and smoking because they affect cardiovascular risk.
    help:
    - Arrange follow-up after a result in the pre-diabetes range. Bring previous results when you can, and contact your
      GP sooner if new symptoms develop.
  bowel-cancer:
    aliases: colorectal cancer colon cancer rectal cancer
    summary: Bowel cancer usually means cancer of the colon or rectum. Bleeding, changes in bowel habits and unexplained
      anaemia are reasons to speak to a GP.
    symptoms:
    - Possible signs include blood in or on your stool, a lasting change in how often you go to the toilet, unexplained
      weight loss or abdominal pain. Some people have fatigue because of anaemia.
    - These signs can have other causes. New symptoms that last or keep returning deserve assessment even if they are
      mild.
    causes:
    - Bowel cancer starts when cells in the colon or rectum grow out of control. Some cancers develop from growths called
      polyps. The likelihood rises with age, and family history can change your risk.
    diagnosis:
    - A GP asks about symptoms and medical and family history, and may arrange an examination or tests. If bowel cancer
      is suspected, a specialist may examine the bowel with a colonoscopy and take a sample to test.
    - BowelScreen is a screening programme for people in eligible groups. If you have symptoms, contact a GP even if
      you recently had a screening test or are waiting for an invitation.
    care:
    - Treatment depends on where the cancer is, whether it has spread and your health and preferences. It can involve
      surgery, medicines and, for some rectal cancers, radiotherapy.
    complications:
    - A tumour can bleed or sometimes obstruct the bowel. Follow-up after treatment can also address changes to bowel
      habits, diet, recovery and stoma care where relevant.
    help:
    - Make a GP appointment if you notice bleeding, unexplained weight loss or a persistent change in bowel habits. Severe
      pain, vomiting and a swollen abdomen need urgent assessment.
  breast-cancer-women:
    aliases: breast lump breast tumour breast cancer
    summary: Breast cancer can cause a new lump or other changes in a breast, but some cases are found on screening before
      there are any symptoms.
    symptoms:
    - Look out for a new lump or thickening, an armpit lump, a nipple change or unusual discharge, and skin dimpling
      or changes in breast shape. Tell a GP if you notice a change from what is normal for you.
    causes:
    - Breast cancer occurs when cells in breast tissue grow abnormally. Risk can be affected by age, some inherited gene
      changes and other factors. A family history can guide whether you need a separate risk assessment.
    diagnosis:
    - A GP may refer you to a breast clinic. The team may examine you, perform mammography or ultrasound and take a tissue
      sample. Testing the sample can show which treatments are likely to help.
    care:
    - Treatment can include surgery, radiotherapy, hormone-blocking treatment, chemotherapy or targeted medicines. The
      treatment plan depends on the type and stage of cancer and your preferences.
    - Ask the team about rehabilitation, managing treatment effects and whom to contact between appointments.
    complications:
    - Breast cancer can spread beyond the breast. Treatment and recovery can also affect arm movement and wellbeing.
      Report persistent swelling or new concerns to your care team.
    help:
    - Contact your GP about a new breast change. BreastCheck is for eligible people without symptoms. If you have symptoms,
      make a GP appointment even if you recently had a screening mammogram.
  gestational-diabetes:
    aliases: gdm pregnancy diabetes high blood sugar pregnancy
    summary: Gestational diabetes is raised blood glucose first identified during pregnancy. Tests and a follow-up plan
      help protect both the pregnant person and baby.
    symptoms:
    - Many people have no obvious symptoms and find out on a blood test. Unusual thirst or passing urine more often can
      occur but can also have other explanations in pregnancy.
    causes:
    - Pregnancy-related changes make the body less sensitive to insulin. If the pancreas cannot make enough extra insulin
      to compensate, blood glucose can rise.
    diagnosis:
    - A maternity team can arrange an oral glucose tolerance test. This measures how the body handles glucose after a
      glucose drink. Testing schedules can vary with your history and local maternity pathway.
    care:
    - Your team may show you how to measure glucose at home and explain changes to food and activity. Some people need
      medication. Monitoring during pregnancy and around birth is tailored to individual circumstances.
    - Ask when to have your glucose rechecked after birth and how often to see your GP for longer-term follow-up.
    complications:
    - Raised glucose can increase the chance of a larger baby and some birth complications. The baby's glucose can fall
      after delivery. A history of gestational diabetes also raises later type 2 diabetes risk.
    help:
    - Contact your maternity team with questions about an upcoming test, or about readings outside the range they gave
      you. Follow their urgent-care advice for any sudden changes in how you feel or in your baby's movements.
  cervical-cancer:
    aliases: cancer of the cervix cervical tumour
    summary: Cervical cancer starts in the cervix, the lower part of the womb. New bleeding or other unusual changes
      deserve assessment even if you attend routine screening.
    symptoms:
    - Possible signs include bleeding after sex, between periods or after menopause. Changes in discharge or pelvic pain
      can also occur, though other conditions can give similar symptoms.
    causes:
    - Persistent infection with certain types of human papillomavirus, or HPV, can cause changes in cervical cells over
      time. Most HPV infections clear without causing cancer.
    diagnosis:
    - A GP asks about symptoms and may examine you or refer you. A specialist can assess the cervix and take a tissue
      sample if needed. Cervical screening checks for risk and changes before symptoms develop.
    care:
    - Treatment depends on the stage and individual circumstances. It can include surgery, radiotherapy or medicines.
      Tell your care team if preserving fertility is important when reviewing the options.
    complications:
    - Cervical cancer can spread to nearby organs or beyond the pelvis. Follow-up can also address bladder, bowel, sexual
      health and other effects of treatment.
    help:
    - Contact your GP about unexpected vaginal bleeding, unusual discharge or persistent pelvic symptoms. Attend screening
      when invited, and contact your GP about symptoms even after a recent screening result.
  skin-cancer-melanoma:
    aliases: melanoma malignant melanoma changing mole
    summary: Melanoma is a skin cancer that can show up as a new mark or a changing mole. A GP can assess a change and
      refer it for specialist examination.
    symptoms:
    - Pay attention to a new or changing mark. Warning signs include an uneven shape or border, multiple colours and
      a change in size, shape or colour. Some melanomas look different from nearby moles and some may bleed or crust.
    - Melanoma can develop on any skin tone. It can occur in areas that get little sun, including the soles, palms or
      under a nail.
    causes:
    - It begins in the cells that produce skin pigment. Ultraviolet exposure is an important risk factor, though personal
      and family history and other factors also matter.
    diagnosis:
    - A clinician examines the mark and may use a magnifying instrument. Removing the suspicious area and examining the
      tissue can confirm whether it is melanoma.
    care:
    - Surgery is often the main treatment for early melanoma. A specialist considers the depth and other features to
      plan further surgery, tests, follow-up or additional treatment.
    complications:
    - Melanoma can spread to lymph nodes or other parts of the body. Its depth and stage help the team discuss the outlook
      and follow-up plan.
    help:
    - Make a GP appointment if you notice a new unusual mark or a mole changing over time. Photos with dates can help
      you describe the change, while clinical assessment is still needed.
  clinical-depression:
    aliases: major depression depressive disorder low mood
    summary: Clinical depression can affect mood, energy, sleep and the ability to get through everyday activities. A
      GP can help assess symptoms and discuss support and treatment.
    emergency: If you or someone else is in immediate danger, call
    symptoms:
    - Common signs include lasting low mood, loss of interest in things you usually enjoy, fatigue, changes in sleep
      or appetite, and difficulty concentrating. The signs can be different from one person to another.
    - Pay attention to how long the changes last and how much they affect work, relationships and ordinary tasks. Depression
      can also involve feelings of guilt, hopelessness or thoughts of suicide.
    causes:
    - Several factors can contribute, including family history, illness, major life changes and sustained stress. Depression
      can develop without an obvious trigger.
    diagnosis:
    - A GP asks about symptoms, how long they have lasted and their effect on your life. They may ask about medicines,
      physical health and distinct episodes of unusually high energy or mood because these details can affect the assessment.
    care:
    - Talking therapies and antidepressant medicines are among the treatment options. A plan depends on severity, your
      preferences and earlier treatments. Agree when you will review how it is going and where to get help if symptoms
      worsen.
    complications:
    - Depression can affect work, relationships, physical health and safety. Some people have repeated episodes. Follow-up
      can help identify returning symptoms.
    help:
    - Contact your GP if low mood or loss of interest persists or makes everyday life difficult. Seek urgent help if
      you feel unable to stay safe.
  back-pain:
    aliases: low back pain lower back ache lumbar pain lumbago
    summary: Back pain is common and can limit movement, sleep and work. A GP or physiotherapist can help assess persistent
      symptoms, and a few specific warning signs need urgent attention.
    symptoms:
    - Pain can feel like an ache or stiffness, and may change with movement or position. Pain that travels into a leg,
      with tingling, weakness or numbness, can suggest irritation of a nerve.
    causes:
    - Pain may start after lifting or unaccustomed activity, or it can develop without a clear event. Muscles, joints
      and other tissues in the back can all contribute. Sometimes a disc or other structure presses on a nerve.
    diagnosis:
    - A clinician asks where the pain started, what makes it better or worse and whether there are leg or bladder symptoms.
      They may check strength and sensation. Many people with ordinary back pain do not need a scan early on.
    care:
    - Staying gently active within your ability can help many people. A GP or physiotherapist can discuss exercises,
      ways to keep moving and options for pain relief.
    - Tell the clinician what you need to get back to doing, such as driving, lifting, sleeping or caring for someone,
      so you can plan a gradual return.
    complications:
    - Persistent pain can interrupt sleep, limit movement and make work harder. Some less common causes can lead to weakness
      or loss of sensation and need specific care.
    help:
    - Get emergency assessment for new numbness around the genitals or bottom, difficulty passing urine, new loss of
      bladder or bowel control, or weakness affecting both legs. Speak to a GP if pain persists, is severe, or keeps
      you from usual activity.
  urinary-incontinence:
    aliases: bladder leakage overactive bladder stress incontinence urge incontinence
    summary: Urinary incontinence means leaking urine unintentionally. The pattern of leakage helps identify which treatments
      and practical supports could help.
    symptoms:
    - Leakage with a cough, laugh or exercise is typical of stress incontinence. A sudden strong urge followed by leakage
      suggests urgency incontinence. Some people experience both patterns.
    causes:
    - Changes in pelvic floor support, bladder function or how completely the bladder empties can contribute. Pregnancy,
      childbirth, prostate problems, medicines or other health conditions can be relevant.
    diagnosis:
    - A GP asks when the leakage happens and may arrange a urine test or examination. A diary of drinks, trips to the
      toilet, urges and leaks can make the pattern easier to see.
    care:
    - Depending on the cause, care may include pelvic floor physiotherapy, bladder training, changing when you drink
      certain fluids, medication or specialist assessment.
    - Tell your clinician which daily activities are affected. That can help you agree priorities such as being able
      to exercise, sleep or travel comfortably.
    complications:
    - Leakage can affect confidence, sleep, exercise and social activities. People may avoid going out or restrict drinks
      too much. An agreed care plan can address the symptoms and their effect on daily life.
    help:
    - Speak with your GP about recurrent leakage. Seek prompt advice about blood in the urine or difficulty emptying
      the bladder. New bladder symptoms with severe back pain and numbness around the genitals or bottom need emergency
      assessment.
  autism:
    aliases: autism spectrum autistic asd neurodivergence
    summary: Autism is a lifelong way of developing and experiencing the world. Autistic people may have different communication,
      sensory and support needs.
    symptoms:
    - Signs can include differences in communication or social interaction, a preference for predictable routines, deep
      interests or different responses to noise, light and other sensory input.
    - Signs can look different in children and adults. Some people consciously adapt how they interact in certain settings,
      so others may see only part of what they experience.
    causes:
    - Autism is a neurodevelopmental condition with a strong genetic contribution. It involves differences in how the
      brain develops. Each person's strengths and support needs can be different.
    diagnosis:
    - An assessment considers developmental history, current experiences and how the person manages different settings.
      An assessment for a child often draws on information from family and school. Adults can ask a GP about their referral
      options.
    care:
    - Support can involve adapting communication, sensory environments and daily routines. Where appropriate, occupational
      therapy, speech and language therapy or educational supports can help with specific needs.
    - Ask what can be put in place now at home, school or work as well as what options are available after an assessment.
    complications:
    - Busy settings, unanticipated changes and barriers to communication can cause distress or exhaustion. Anxiety, sleep
      difficulties or other health needs may also warrant attention in their own right.
    help:
    - Talk to your GP, public health nurse or the relevant service if development, communication, sensory needs or daily
      participation are a concern. Adults can bring examples from childhood and daily life to a referral discussion.
  obesity:
    aliases: weight management body mass index bmi
    summary: Obesity is a chronic condition involving excess body fat that can affect health. A healthcare professional
      can put measurements and personal risk factors in context.
    symptoms:
    - People can have different levels of fitness, mobility and health at a similar weight. Breathlessness with activity,
      joint pain or daytime tiredness can be worth discussing with your GP if they affect your life.
    causes:
    - Several factors influence body weight, including genetics, appetite regulation, medicines, sleep, health conditions
      and access to food, activity and care. The mix differs from person to person.
    diagnosis:
    - A clinician may use BMI and other measures, such as waist measurement, alongside medical history and blood tests.
      BMI describes the relationship between weight and height and has limits for assessing an individual's health.
    care:
    - Depending on the person, options can include support with eating, activity and sleep, medication or referral for
      specialist treatment. Agree goals that matter in daily life, such as moving more comfortably, managing another
      condition or improving sleep.
    complications:
    - Obesity is associated with a higher risk of type 2 diabetes, sleep apnoea, joint problems and some cardiovascular
      conditions. Individual risk depends on more than weight alone.
    help:
    - A GP can discuss whether symptoms, health checks or changes in weight warrant further assessment. Ask about supports
      available locally and what follow-up would involve.
  rsv:
    aliases: respiratory syncytial virus bronchiolitis
    summary: Respiratory syncytial virus usually causes a cold-like illness, but babies, older adults and some people
      with underlying conditions can become more unwell.
    emergency: If a child stops breathing, is struggling for breath or develops blue or grey lips, call
    symptoms:
    - Cough, runny nose, fever and reduced appetite can occur. In babies, feeding less, breathing faster or pulling in
      under the ribs when breathing can signal a more serious illness.
    causes:
    - RSV spreads through close contact and contaminated hands or surfaces. It can affect the small airways and lead
      to bronchiolitis, particularly in babies.
    diagnosis:
    - Clinicians assess breathing, hydration and other signs. Testing may be useful in some settings, but many mild illnesses
      can be managed based on symptoms.
    care:
    - Mild infections usually improve with supportive care. Offer fluids and keep an eye on breathing and feeding in
      children. If hospital care is needed, the team can provide support such as oxygen or fluids.
    - Ask your healthcare team about current HSE RSV immunisation guidance for eligible groups.
    complications:
    - RSV can lead to bronchiolitis, pneumonia or worsening of an existing heart or lung condition. Babies can become
      dehydrated if breathing problems reduce feeding.
    help:
    - Get urgent advice if breathing becomes harder, a baby feeds much less than usual or wet nappies become noticeably
      less frequent. Older adults with worsening breathing or underlying conditions should seek prompt advice.
  allergies:
    aliases: allergy allergic reaction hay fever food allergy
    summary: An allergy can cause anything from itchy eyes to a severe reaction. The symptoms, their timing and what you were exposed to help identify the cause.
    emergency: If someone develops throat or tongue swelling, difficulty breathing or faintness after a possible allergen exposure, use an adrenaline auto-injector if available and call
    symptoms:
    - Pollen and dust mite allergies often affect the eyes and nose. Food, medicine or insect-sting reactions may cause hives, swelling, wheezing or several symptoms at once.
    - Record what you ate, took or touched and how long it took for symptoms to start. The same rash can have several causes, so the surrounding details matter.
    causes:
    - The immune system reacts to a substance it recognises as a threat. In an immediate allergic reaction, immune cells release chemicals such as histamine, which can produce itching and swelling.
    - Food intolerance can cause symptoms after eating through a different mechanism. The distinction affects which tests and precautions are appropriate.
    diagnosis:
    - Your GP can review the pattern, examine you and refer you for specialist tests if appropriate. A skin-prick test or specific IgE blood test can help answer a targeted question when interpreted alongside your history.
    care:
    - Treatment depends on the trigger and severity. A pharmacist or GP can advise on treatments for mild nasal or skin symptoms. Discuss unexplained food reactions before making major changes to your diet or your child's diet.
    - If prescribed adrenaline auto-injectors, ask for a demonstration and a written action plan. Make sure the people who may need to help you know where you keep them.
    complications:
    - Ongoing symptoms can affect sleep and aggravate asthma. Anaphylaxis can develop rapidly and requires emergency care.
    help:
    - Speak to your GP after an unexplained reaction, if reactions recur or if they affect breathing. Seek emergency help immediately for suspected anaphylaxis.
    sources:
      HSE anaphylaxis and emergency response: https://www2.hse.ie/conditions/anaphylaxis/
  diabetes:
    aliases: diabetes mellitus high blood sugar insulin HbA1c
    summary: Diabetes raises blood glucose. Which type you have determines your treatment, and regular checks can spot problems before symptoms develop.
    emergency: If someone with suspected or known diabetes is very unwell with vomiting, rapid breathing or confusion and needs an ambulance, call
    symptoms:
    - Common signs include urinating more often, unusual thirst, tiredness and unexplained weight loss. Type 1 symptoms can develop quickly. Type 2 diabetes may develop gradually and can be discovered on a blood test.
    causes:
    - In type 1 diabetes, the immune system damages the pancreatic cells that make insulin. In type 2 diabetes, the body responds less effectively to insulin and insulin production may become insufficient over time.
    - Gestational diabetes develops during pregnancy. It has its own testing and follow-up, including a check after birth.
    diagnosis:
    - A clinician uses blood tests and the pattern of symptoms. HbA1c reflects average glucose over recent months. Rapidly developing symptoms need immediate assessment and testing suited to an acute presentation.
    care:
    - People with type 1 diabetes need insulin. Type 2 care may include help with nutrition and activity, medicines and sometimes insulin. Your care team can explain your glucose targets and what to do when you are unwell.
    - Ask about checks for kidneys, feet and blood pressure, and about registration for the HSE Diabetic RetinaScreen programme.
    complications:
    - Over time, raised blood glucose can damage blood vessels and nerves. Insulin and some other treatments can cause low blood glucose. Diabetic ketoacidosis can develop quickly and needs hospital treatment.
    help:
    - Contact a GP promptly if you or your child develop marked thirst, frequent urination or unexplained weight loss. Vomiting or rapid breathing with suspected diabetes warrants immediate medical assessment.
    sources:
      HSE diabetic ketoacidosis: https://www2.hse.ie/conditions/type-1-diabetes/blood-glucose/ketones-and-diabetic-ketoacidosis-dka/
  cancer:
    aliases: cancer warning signs tumour malignancy oncology biopsy
    summary: Cancer is a group of diseases where cells grow abnormally. The site, type and stage of the cancer guide testing and treatment.
    symptoms:
    - A new lump, unusual bleeding, cough that persists, change in bowel habits or weight loss without trying can warrant investigation. The pattern and how long the change has lasted help a GP decide what to investigate.
    causes:
    - Changes in a cell can allow it to grow and divide when it should stop. Some cancers can invade nearby tissues or travel through blood or lymph to other parts of the body.
    - Risk factors differ by cancer. Age, smoking, certain infections and inherited changes contribute to different cancers. A person's risk factors alone cannot determine whether a symptom is cancer.
    diagnosis:
    - Your GP starts with your symptoms and may arrange tests or a specialist referral. Scans show where changes are, and examination of a tissue sample can often identify the cancer type. Stage describes how far it has spread.
    care:
    - The specialist team may discuss surgery, radiotherapy or medicines such as chemotherapy, hormone therapy, immunotherapy or targeted treatment. The choices depend on your diagnosis and the goals of treatment.
    - Ask who to contact about side effects and what support is available for fatigue, pain, work or family concerns.
    complications:
    - Cancer and its treatments affect people differently. National survival and prevalence figures describe groups of people. A specialist can explain what the cancer type, stage and test results mean for your own outlook.
    help:
    - Speak to your GP about a persistent or unexplained change, including one noticed between screening appointments. Tell them when it began and whether it is getting worse.
    sources:
      HSE signs and symptoms: https://www2.hse.ie/conditions/cancer/signs-and-symptoms/
  pancreatic-cancer-symptoms:
    aliases: pancreatic cancer pancreas cancer jaundice
    summary: Pancreatic cancer may cause jaundice, weight loss or pain in the upper abdomen or back. Tests help establish whether it can be removed surgically.
    symptoms:
    - Jaundice can make the eyes or skin look yellow and may come with itching, dark urine or pale stools. Other changes include losing weight without trying, poor appetite and pain in the upper abdomen that may spread to the back.
    causes:
    - The pancreas makes digestive enzymes and hormones including insulin. A tumour can interfere with digestion or block the nearby bile duct. A blockage helps explain why jaundice, pale stools and dark urine can occur together.
    diagnosis:
    - A GP may arrange blood tests and refer you for imaging. CT can show the location of a suspected tumour and whether nearby blood vessels or other organs are involved. Some people have an endoscopic ultrasound and a tissue sample.
    care:
    - The specialist team assesses whether surgery is an option and discusses chemotherapy, other treatments and symptom control. A stent can sometimes relieve a blocked bile duct.
    - Report weight loss and changes in stool to the team. A dietitian can help with nutrition, and pancreatic enzyme replacement may be considered when the pancreas cannot supply enough enzymes.
    complications:
    - Blocked bile flow, difficulty absorbing food and changes in blood glucose can create problems during care. Follow-up should include a way to report worsening symptoms between appointments.
    help:
    - Seek urgent medical advice if you develop jaundice. Arrange a GP assessment for persistent upper-abdominal or back pain, ongoing changes in digestion or unexplained weight loss.
    sources:
      HSE diagnosis and tests: https://www2.hse.ie/conditions/pancreatic-cancer-symptoms/diagnosis/
      HSE treatment and supportive care: https://www2.hse.ie/conditions/pancreatic-cancer-symptoms/treatment/
  lung-cancer:
    aliases: lung tumour non-small cell small-cell lung cancer
    summary: Lung cancer can cause a persistent cough, coughing up blood or breathlessness. The type and stage help determine which treatments are suitable.
    symptoms:
    - A new cough that will not settle, a change in a longstanding cough, coughing up blood or repeated chest infections can prompt investigation. Some people develop breathlessness, chest discomfort or unexplained weight loss.
    causes:
    - Cancer can start in the lung or airway. Tobacco smoke is a major risk factor, and lung cancer can also develop in people who have never smoked. The main groups are non-small cell and small cell lung cancer.
    diagnosis:
    - A GP may arrange a chest X-ray or refer you to a rapid access lung clinic. CT gives a more detailed view, and a biopsy can identify the cancer type. The specialist may use a bronchoscopy to examine the airways and take a sample.
    - PET-CT can help assess spread in some cases. Additional tests on biopsy tissue can identify changes that help guide the choice of medicine.
    care:
    - Depending on the type, stage and your general health, options can include surgery, radiotherapy, chemotherapy, immunotherapy or targeted drugs. The team can also treat symptoms such as breathlessness and pain.
    complications:
    - A tumour can narrow an airway or lead to fluid collecting around a lung, either of which can worsen breathlessness. Tell your care team if your breathing, exercise tolerance or weight changes between appointments.
    help:
    - Contact your GP promptly if you cough up blood or have a persistent change in your cough, breathing or weight. Severe difficulty breathing requires emergency help.
    sources:
      HSE signs and symptoms: https://www2.hse.ie/conditions/lung-cancer/symptoms/
      HSE tests and diagnosis: https://www2.hse.ie/conditions/lung-cancer/tests-and-diagnosis/
      HSE lung cancer treatment: https://www2.hse.ie/conditions/lung-cancer/treatment/
  breast-cancer-men:
    aliases: male breast cancer breast lump nipple discharge
    summary: Men can develop breast cancer. A new lump, changes around the nipple or an armpit lump should be checked by a GP.
    symptoms:
    - A lump under or near the nipple can be the first sign. Other changes include a nipple pulling in, nipple discharge, skin changes or a lump in the armpit. A lump can warrant assessment even if it does not hurt.
    causes:
    - Cancer can develop in the small amount of breast tissue men have. Risk increases with age and can also be affected by inherited changes such as BRCA2 variants.
    diagnosis:
    - Your GP examines the change and may refer you to a breast clinic. Imaging can help identify the abnormal area and a biopsy can show whether cancer is present. Receptor tests can help guide treatment.
    care:
    - Surgery is often part of care. A specialist may also discuss radiotherapy, chemotherapy or hormone treatment such as tamoxifen, depending on the results and stage.
    - Ask whether your own or your family's medical history warrants a discussion about genetic assessment.
    complications:
    - Some people have chest or shoulder stiffness after surgery. Swelling of the arm on the treated side should be reported to the team, particularly after treatment involving lymph nodes.
    help:
    - Book a GP appointment for a new breast or armpit lump or a persistent change to the nipple or skin. Mention any family history of breast or ovarian cancer.
    sources:
      HSE symptoms in men: https://www2.hse.ie/conditions/breast-cancer-men/symptoms/
      HSE treatment in men: https://www2.hse.ie/conditions/breast-cancer-men/treatment/
  womb-cancer:
    aliases: uterine cancer endometrial cancer postmenopausal bleeding
    summary: Most womb cancers start in the lining of the uterus. Bleeding after menopause is a reason to contact your GP, even if it happens only once.
    symptoms:
    - Unexpected vaginal bleeding is the main warning sign. After menopause, report spotting, light bleeding or blood-stained discharge. Before menopause, bleeding between periods or a marked change from your normal pattern warrants assessment.
    causes:
    - The endometrium is the lining of the womb. Most womb cancers start there. Rarer cancers can arise in the muscle or other tissues, and the specialist uses the type of tumour to guide care.
    diagnosis:
    - A specialist may use a vaginal ultrasound to assess the lining. A biopsy samples the lining for laboratory examination. Hysteroscopy lets the clinician look inside the womb and can help with sampling.
    care:
    - Surgery often involves removing the womb. Other treatment decisions can depend on the cancer type, stage and risk of recurrence. Discuss fertility if relevant, recovery and what follow-up will involve with the specialist team.
    complications:
    - Surgery and other treatments can affect bladder, bowel or sexual function. The follow-up team can advise on symptoms such as ongoing pelvic discomfort or leg swelling.
    help:
    - Contact your GP about any bleeding after menopause, even if it stops, and about persistent changes in bleeding before menopause.
    sources:
      HSE diagnosis and tests: https://www.hse.ie/conditions/womb-cancer/diagnosis/
      HSE womb cancer treatment: https://www2.hse.ie/conditions/womb-cancer/treatment/
  ovarian-cancer-overview-and-symptoms:
    aliases: ovarian cancer ovary cancer persistent bloating
    summary: Ovarian cancer may cause persistent bloating, pelvic pain, feeling full quickly or urinary changes. A change that keeps recurring is worth discussing with your GP.
    symptoms:
    - Look for bloating that persists, getting full sooner than usual, abdominal or pelvic pain or needing to urinate more often. Tell your GP how often symptoms occur and whether they are new for you.
    causes:
    - Ovarian cancer is more common after menopause. Some inherited genetic changes increase risk. A family history of ovarian or breast cancer is worth raising even if no one in the family has had genetic testing.
    diagnosis:
    - A GP can assess symptoms and may order a CA125 blood test or an ultrasound. A raised CA125 can have several causes. A specialist interprets the results alongside symptoms and imaging and may need tissue testing.
    care:
    - A specialist team plans treatment using the cancer type, stage and your health. Surgery and chemotherapy are common options. For some people, further tests help determine whether a maintenance drug is suitable.
    complications:
    - Fluid in the abdomen can increase swelling or discomfort. Tell your team promptly about worsening pain, trouble eating or a significant change in bowel symptoms.
    help:
    - The HSE advises contacting a GP if symptoms last three weeks or more, if you first develop symptoms like irritable bowel syndrome after 50 or if you have a family history of ovarian or breast cancer. Go back if symptoms persist after an initial assessment.
    sources:
      HSE diagnosis and tests: https://www.hse.ie/conditions/ovarian-cancer-overview-and-symptoms/ovarian-cancer-diagnosis/
      HSE ovarian cancer treatment: https://www.hse.ie/conditions/ovarian-cancer-overview-and-symptoms/treatment/
  heart-attack:
    aliases: myocardial infarction MI acute coronary syndrome
    summary: A heart attack occurs when part of the heart muscle loses its blood supply. Suspected symptoms call for immediate emergency assessment.
    emergency: If you suspect a heart attack, call
    symptoms:
    - Chest pressure, squeezing or discomfort may spread to an arm, jaw, neck or back. Breathlessness, sweating, nausea or feeling faint can also occur. Some people have little or no chest pain.
    causes:
    - A heart attack often starts when a deposit inside a coronary artery ruptures and a clot obstructs the flow of blood. The longer the heart muscle goes without enough blood, the greater the risk of lasting damage.
    diagnosis:
    - The ambulance or hospital team may record an ECG to look for changes in the heart's electrical activity. Blood tests for troponin look for heart muscle damage and may be repeated.
    care:
    - Hospital treatment may involve restoring blood flow with a procedure to open the artery and place a stent. The hospital team will explain medicines to reduce the risk of another event and refer eligible patients for cardiac rehabilitation.
    - Before you leave hospital, ask which medicines you should take, when to resume activities and whom to contact if symptoms return.
    complications:
    - The damaged heart can develop rhythm problems or pump less effectively. Follow-up can include checks for heart failure symptoms and support for anxiety after the event.
    help:
    - Call for an ambulance if a heart attack is suspected. For new or worsening breathlessness, swelling or trouble with medicines after discharge, contact your care team promptly.
    sources:
      HSE diagnosis of a heart attack: https://www2.hse.ie/conditions/heart-attack/diagnosis/
      HSE recovering from a heart attack: https://www2.hse.ie/conditions/heart-attack/recovering-from/
      European Society of Cardiology guidelines: https://academic.oup.com/eurheartj/article/44/38/3720/7243210
  neck-pain:
    aliases: neck stiffness cervical pain trapped nerve
    summary: Neck pain often improves within weeks. Pain after an injury or symptoms such as weakness need a different assessment from everyday stiffness.
    symptoms:
    - The neck may feel stiff and sore when you turn to look over your shoulder. Pain can spread into the shoulder. Pain, tingling or numbness travelling into an arm can point to nerve irritation.
    causes:
    - Staying in one position, sleeping awkwardly, a strain or age-related changes can contribute to symptoms. A sudden movement in a collision can cause whiplash. Sometimes a disc or nearby tissue irritates a nerve.
    diagnosis:
    - A clinician asks when it started, whether there was an injury and whether the pain travels into the arm. They may examine movement, strength and sensation. Imaging decisions depend on the examination and whether there are warning signs.
    care:
    - For ordinary stiffness, gentle movement and changing position regularly can help. A heat or cold pack wrapped in a towel is an option. A pharmacist can advise on pain relief that is suitable for you.
    - Avoid driving or cycling if you cannot turn your neck far enough to do it safely. Persistent symptoms may benefit from a GP or physiotherapy assessment.
    complications:
    - Pain that persists can disrupt sleep and routine activity. New limb weakness or difficulty with balance or walking can be a sign of a more serious problem.
    help:
    - Get urgent medical assessment for neck pain after a significant injury, or if it comes with new weakness or difficulty walking. Contact your GP if stiffness is not improving after a few weeks, or if you have persistent pins and needles.
    sources:
      NHS neck pain guidance: https://www.nhs.uk/symptoms/neck-pain-and-stiff-neck/
      NHS clinical guidance on neck pain warning signs: https://www.hweclinicalguidance.nhs.uk/clinical-pathways/neck-pain/
  penile-cancer:
    aliases: penile cancer penis cancer PeIN penile intraepithelial neoplasia
    summary: Penile cancer is uncommon. A growth or sore that keeps returning or fails to heal, bleeding or a new change in the foreskin is worth getting checked.
    symptoms:
    - Changes can include a sore or growth on the penis, bleeding, discharge under the foreskin or new difficulty pulling the foreskin back. A lump in the groin can also warrant assessment.
    - Some changes are easiest to see on the head of the penis or under the foreskin. Mention how long the change has been there and whether it has grown, bled or changed colour.
    causes:
    - Most penile cancers start in squamous cells at the surface. Some are associated with long-lasting infection with certain types of HPV. Smoking and some longstanding foreskin problems can also increase risk.
    diagnosis:
    - A GP can examine the area and refer you to urology. A biopsy can show whether a change is cancer. If cancer is confirmed, further examination, scans or sampling can help assess nearby lymph nodes and guide treatment.
    care:
    - The team considers the location and depth of the cancer, whether lymph nodes are involved and which options preserve function. Treatment can range from local treatment for selected superficial changes to more extensive surgery and other cancer treatments.
    - Ask about the expected effect on urination, sexual function and sensation, and about support for those changes during recovery.
    complications:
    - Cancer can spread to lymph nodes in the groin. Treatment involving those nodes can also lead to swelling that may need assessment and support.
    help:
    - Book a GP appointment for a sore that has not healed within four weeks or for an unexplained lump, bleeding or discharge. An infection or skin condition can cause similar changes, and an examination helps distinguish them.
    sources:
      National Cancer Control Programme patient booklet: https://www.hse.ie/eng/services/list/5/cancer/patient/leaflets/nccp-penile-cancer-booklet.pdf
  non-melanoma-skin-cancer:
    aliases: keratinocyte cancer basal cell carcinoma BCC squamous cell carcinoma SCC
    summary: Basal cell and squamous cell carcinomas are common skin cancers. A sore, lump or scab that keeps coming back or does not heal should be checked.
    symptoms:
    - Basal cell carcinoma may appear as a shiny or pearly bump, a flat patch or a sore that repeatedly scabs. Squamous cell carcinoma may look like a firm or scaly lump and can feel tender.
    - Look for changes on sun-exposed skin such as the ears, face, scalp or hands. A lesion can warrant assessment even if it is small or painless.
    causes:
    - These cancers start in cells in the outer layer of the skin. Ultraviolet exposure from the sun or sunbeds can damage those cells. A weakened immune system can increase risk, especially for squamous cell carcinoma.
    diagnosis:
    - A GP may examine the lesion and refer you if cancer is suspected. A clinician can take a biopsy or remove the lesion and send it to a laboratory to confirm the type and check the edges of the tissue.
    care:
    - Surgery is a common treatment. Depending on the type and location, the team may discuss specialised surgery, a local treatment or radiotherapy. Follow-up depends on the features of the lesion and your risk of further skin cancers.
    - Ask how to check the treated area and the rest of your skin. Use sun protection when working, exercising or spending time outdoors.
    complications:
    - Basal cell carcinoma can damage tissue around it as it grows. Some squamous cell cancers can spread, particularly if they have high-risk features. Having one skin cancer also increases the risk of developing another.
    help:
    - Arrange a GP assessment for a new skin change that persists, grows, bleeds or fails to heal. Tell the GP if you have a history of skin cancer or take medicines that suppress your immune system.
    sources:
      HSE treatment options: https://www2.hse.ie/conditions/non-melanoma-skin-cancer/treatment/
  stillbirth:
    aliases: stillborn baby pregnancy loss fetal death maternity bereavement reduced movements
    summary: If you are worried about your baby's movements, call your maternity unit straight away. If your baby has died, the maternity team can explain the next steps and support you and your family.
    symptoms:
    - A change in your baby's usual movements, including movements becoming weaker, less frequent or stopping, needs assessment. Your maternity unit can help even if you are unsure what the change means.
    causes:
    - In Ireland, the HSE describes stillbirth as the birth of a baby without signs of life from 23 weeks of pregnancy or with a birth weight of at least 400 grams. Placental problems, health complications and conditions affecting the baby can contribute. Sometimes a cause remains unclear.
    diagnosis:
    - A maternity clinician will assess concerns about movements or other symptoms. Ultrasound can assess the baby's heartbeat. If a death is confirmed, the team can explain the findings and give you time to ask questions.
    care:
    - The maternity team will discuss the safest plan for birth and which investigations are available, including examination of the placenta or a post-mortem. Ask what each test may explain and when results will be available.
    - Ask for a named contact for follow-up and information on bereavement support. The team can also discuss physical recovery, results and planning care in a future pregnancy when you are ready.
    complications:
    - Grief can affect parents and family members differently and can resurface at milestones. Midwives, the maternity bereavement team and your GP can help you access support suited to you.
    help:
    - Call your maternity unit immediately with any concern about your baby's movements and tell them you are coming for a check. Seek advice again if the concern returns, even after a previous reassuring assessment.
    sources:
      HSE stillbirth overview and advice: https://www2.hse.ie/conditions/stillbirth/
      National Perinatal Epidemiology Centre clinical audit: https://www.ucc.ie/en/npec/newsevents/latest-perinatal-mortality-national-clinical-audit-in-ireland-annual-report-2023-.html
  flu:
    aliases: influenza seasonal flu fever body aches influenza A influenza B
    summary: Flu often starts suddenly with fever, aches and exhaustion. People at higher risk of complications may need advice early, while antiviral treatment is most useful.
    emergency: If someone has severe difficulty breathing or appears dangerously unwell, call
    symptoms:
    - Fever, chills, sore muscles, headache, cough and sudden tiredness are common. Symptoms can overlap with COVID-19 and other respiratory infections. Fatigue may persist after the fever and aches improve.
    causes:
    - Influenza viruses spread between people mainly through particles released when someone breathes, talks, coughs or sneezes. The flu vaccine is updated for the season as circulating viruses change.
    diagnosis:
    - A GP may assess symptoms and risk factors without testing in a straightforward case. Testing can help in hospital or when the result would change treatment or infection-control decisions.
    care:
    - Rest, fluids and appropriate symptom relief are enough for many people. If you are pregnant, older or have a long-term condition, seek advice early. A clinician can decide whether an antiviral is appropriate.
    - The HSE publishes eligibility for seasonal vaccination. While unwell, reduce close contact with people at higher risk of severe infection.
    complications:
    - Flu can lead to pneumonia or worsen asthma, COPD or heart failure. Seek advice promptly if symptoms worsen or you become more unwell again after initially improving.
    help:
    - Contact your GP if you are at higher risk, concerned about your child or getting worse. Severe breathing problems need emergency help.
    sources:
      HSE symptoms, diagnosis and treatment: https://www2.hse.ie/conditions/flu/symptoms-diagnosis/
  chickenpox:
    aliases: varicella chicken pox VZV
    summary: Chickenpox causes crops of itchy blisters. Exposure or illness can need prompt advice in pregnancy, in newborns and in people with a weakened immune system.
    symptoms:
    - A fever or general feeling of being unwell can come before the rash. Spots develop into fluid-filled blisters and then crust over. Fresh spots and scabs can appear at the same time.
    - The rash can affect the scalp, trunk and other areas, sometimes including the mouth. A child with a sore mouth may drink less, so watch for signs of dehydration.
    causes:
    - Varicella-zoster virus causes chickenpox and spreads easily through close contact. After recovery it can stay inactive in nerves and later reactivate as shingles. Contact with shingles blisters can give chickenpox to someone without immunity.
    diagnosis:
    - A clinician can usually recognise chickenpox from the rash and history. Testing may help in unusual cases or after an exposure where immunity matters. Phone ahead before attending a clinic if you think you have chickenpox.
    care:
    - Encourage fluids and ask a pharmacist about itch or pain relief. The HSE advises against giving ibuprofen unless a doctor advises it. People at higher risk should ask promptly whether antiviral treatment or action after exposure is needed.
    - Follow HSE guidance on when you can return to school, work or childcare. Avoid exposing newborns, pregnant people who may lack immunity and people with weakened immunity.
    complications:
    - Blisters can become infected. New warmth, swelling or increasing pain around spots warrants advice. Chickenpox can also cause complications such as pneumonia, especially in people at increased risk.
    help:
    - Contact a GP or maternity unit urgently after exposure or symptoms if pregnant and unsure of immunity, or if a newborn or someone with a weakened immune system is affected. Seek urgent medical advice if breathing is affected or the person is getting much more unwell.
    sources:
      HSE antiviral prescribing guideline: https://assets.hse.ie/media/documents/Chickenpox_guideline.pdf
  chlamydia:
    aliases: chlamydia STI chlamydia trachomatis
    summary: Chlamydia often has no symptoms. A urine test or swab can diagnose it, and treatment and partner follow-up help prevent complications and reinfection.
    symptoms:
    - Burning when passing urine, unexpected discharge or bleeding between periods or after sex can occur. Some people have pelvic pain or testicular discomfort. Many people feel entirely well.
    causes:
    - Chlamydia is a bacterial infection passed through sexual contact. It can affect the genital tract or rectum. Antibiotic treatment clears the infection but does not make you immune to getting it again.
    diagnosis:
    - A clinic may use a first-catch urine sample or swabs from relevant sites. Timing matters after exposure, so ask whether you should test now and repeat later. A clinician may recommend tests for other sexually transmitted infections at the same visit.
    care:
    - A healthcare professional can prescribe suitable antibiotics and explain when to resume sex. Tell them if you may be pregnant, since this can affect the choice of treatment.
    - Ask which recent partners should be offered testing and treatment and whether you should return for a repeat test. A clinic can help with partner notification.
    complications:
    - Untreated infection can cause pelvic inflammatory disease, which increases the risk of fertility problems and ectopic pregnancy. It can also cause painful inflammation around a testicle.
    help:
    - Contact a GP or sexual health clinic for symptoms or a partner's positive result. Seek urgent assessment for severe pelvic pain, fever with pelvic pain or sudden severe testicular pain.
    sources:
      HSE clinical guidance on chlamydia: https://assets.hse.ie/media/documents/Chlamydia_trachomatis_guideline.pdf
      HSE home STI testing: https://www2.hse.ie/living-well/sexual-wellbeing/free-home-sti-tests/
  gonorrhoea:
    aliases: gonorrhea gonorrhoea STI gonococcus
    summary: Gonorrhoea can affect the genitals, throat or rectum. Testing matters even when you feel well, and a clinic may ask you back to confirm that treatment worked.
    symptoms:
    - Symptoms can include pain when passing urine, unusual discharge, bleeding between periods or swollen or painful testicles. Rectal infection may cause pain, discharge or bleeding. Some infections have no noticeable symptoms.
    causes:
    - Gonorrhoea is a bacterial infection spread through sexual contact. The sites exposed help determine which samples are appropriate. Antibiotic resistance is one reason the clinic may request additional testing.
    diagnosis:
    - A urine test or swabs can detect the infection. A clinic may also take a swab for culture to check susceptibility to antibiotics, especially where treatment has not worked as expected.
    care:
    - Treatment usually involves an antibiotic injection. Follow the clinic's instructions about when to return for a test of cure and when you can safely resume sex.
    - A clinic can help notify recent sexual partners so they can be offered care. Being treated once does not prevent a new infection.
    complications:
    - Without treatment, infection can cause pelvic inflammatory disease or painful swelling around a testicle. In uncommon cases infection spreads beyond its original site.
    help:
    - Contact a sexual health clinic or GP if you have symptoms or a partner has tested positive. Seek urgent advice if you have a fever with severe pelvic pain, or urgent assessment for sudden severe testicular pain.
    sources:
      HSE clinical guidance on gonorrhoea: https://assets.hse.ie/media/documents/Gonorrhoea_guideline.pdf
      HSE home STI testing: https://www2.hse.ie/living-well/sexual-wellbeing/free-home-sti-tests/
  hepatitis-c:
    aliases: hep C HCV chronic hepatitis C liver infection
    summary: Hepatitis C can persist for years without symptoms and damage the liver. A blood test can confirm active infection, which can usually be cured with antiviral treatment.
    symptoms:
    - Many people have no early symptoms. Some feel unusually tired or unwell. Yellowing of the skin or eyes can occur and warrants medical assessment. Feeling healthy cannot rule out infection.
    causes:
    - Hepatitis C spreads when infected blood enters another person's bloodstream. The virus can establish a long-term infection in the liver. People with past blood exposure may benefit from testing even if it occurred years ago.
    diagnosis:
    - A hepatitis C antibody test can show past exposure. An RNA test can establish whether the virus is still present. A clinician can explain whether additional tests are needed to check liver health.
    care:
    - HSE hepatitis C treatment is free. Most people who need treatment can take direct-acting antiviral tablets. Your team can check for interactions and arrange a follow-up blood test to confirm whether treatment cleared the infection.
    - A person can acquire hepatitis C again after cure. Ask whether you need further testing based on exposure or follow-up for existing liver damage.
    complications:
    - Over years, untreated infection can scar the liver and increase the risk of cirrhosis and liver cancer. Advanced scarring can warrant continued monitoring after successful treatment.
    help:
    - Speak to your GP or use the HSE testing route if you may have been exposed. Ask for advice even if you have no symptoms. Seek urgent medical assessment for new jaundice.
    sources:
      HSE hepatitis C testing and diagnosis: https://www2.hse.ie/conditions/hepatitis-c/diagnosis/
      HSE hepatitis C treatment: https://www2.hse.ie/conditions/hepatitis-c/treatment/
  hiv:
    aliases: HIV AIDS human immunodeficiency virus antiretroviral therapy PrEP PEP
    summary: HIV can be treated effectively. Testing is the way to find out whether you have HIV, and a recent possible exposure needs prompt advice about time-sensitive prevention.
    symptoms:
    - Some people experience a fever, rash or sore throat in the weeks after acquiring HIV. Others notice nothing. These symptoms have many causes, so testing is needed to establish whether HIV is present.
    causes:
    - HIV affects immune cells called CD4 cells. Without treatment it can weaken the immune system over time. AIDS describes an advanced stage of untreated or inadequately treated infection.
    diagnosis:
    - A blood test can detect HIV. If you test soon after exposure, you may need to repeat it after the window period. A reactive screening test requires confirmation and follow-up through a healthcare service.
    care:
    - Antiretroviral treatment suppresses HIV and protects the immune system. Your clinical team monitors the amount of virus in the blood. People who maintain an undetectable viral load on treatment do not pass HIV to sexual partners, known as U=U.
    - Sexual health services can discuss prevention options, including PrEP for people who could benefit and PEP after a recent possible exposure.
    complications:
    - Without treatment, a weakened immune system can leave a person vulnerable to serious infections. Effective treatment and follow-up substantially reduce that risk.
    help:
    - For a recent possible exposure, contact a sexual health or infectious disease service immediately, or an emergency department out of hours. PEP must be started as soon as possible and within 72 hours if the clinician recommends it. Do not wait for symptoms or a home test.
    sources:
      HSE HIV post-exposure prophylaxis: https://www2.hse.ie/conditions/hiv/hiv-post-exposure-prophylaxis-pep/
      HSE home STI testing: https://www2.hse.ie/living-well/sexual-wellbeing/free-home-sti-tests/
      HPSC HIV surveillance and reports: https://www.hpsc.ie/a-z/hivandaids/hivdataandreports/
  syphilis:
    aliases: syphilis treponema pallidum chancre
    summary: A painless sore or a rash can be a sign of syphilis. The symptoms can disappear while the infection remains, so testing and follow-up matter.
    symptoms:
    - An early sore may occur on or near the genitals, mouth or anus. It can heal without treatment. A later phase may cause a rash, including on the palms or soles, swollen glands or feeling unwell. Some people have no obvious symptoms.
    causes:
    - Syphilis is caused by bacteria that can pass through contact with an infectious sore during sex and from a pregnant person to their baby. The stage of infection affects the care needed.
    diagnosis:
    - Sexual health clinics usually use blood tests. Sometimes a sore can be swabbed. An early blood test may need repeating, and a history of past treatment helps the clinician interpret the results.
    care:
    - A healthcare professional chooses antibiotic treatment based on the stage and circumstances. Keep follow-up blood test appointments to check the response, even if the sore or rash has gone.
    - The clinic can help with testing and advice for recent partners. Ask the clinic when it is safe to have sex again.
    complications:
    - Untreated infection can affect the nervous system, eyes or other organs. In pregnancy, untreated syphilis can harm the baby, so prompt assessment and treatment are important.
    help:
    - Contact a sexual health clinic if you have an unexplained sore, rash or a partner who has tested positive. If you are pregnant and may have been exposed or have a positive result, contact your maternity or sexual health team promptly.
    sources:
      HSE home STI testing: https://www2.hse.ie/living-well/sexual-wellbeing/free-home-sti-tests/
  c-diff:
    aliases: C diff Clostridioides difficile Clostridium difficile antibiotic diarrhoea
    summary: C. diff can cause diarrhoea during or after antibiotics. A stool test can help identify the cause when symptoms fit.
    symptoms:
    - Watery diarrhoea, abdominal cramps, fever and feeling unwell can occur. Mention recent antibiotics or a hospital stay when you ask for advice. Diarrhoea after antibiotics has several possible causes.
    causes:
    - The bowel normally contains many kinds of bacteria. Antibiotics can change that balance, allowing C. diff to multiply and release toxins that inflame the bowel. Some people carry the bacterium without becoming ill.
    diagnosis:
    - If symptoms suggest infection, a clinician may ask for a stool sample. The team considers the result together with symptoms because a test can detect carriage in someone whose diarrhoea has another cause.
    care:
    - The clinician reviews your antibiotics and may prescribe treatment aimed at C. diff. Ask before taking a medicine to stop diarrhoea. Maintaining hydration matters while you recover.
    - Tell your team if symptoms return after treatment. A recurrence may need a different care plan.
    complications:
    - Severe infection can cause dehydration and serious bowel inflammation. Older people and people with other health conditions may become unwell more quickly.
    help:
    - Contact a GP promptly for diarrhoea during or after antibiotics, particularly with fever or worsening abdominal pain. Seek urgent assessment if you cannot keep fluids down, pass much less urine or are becoming very unwell.
    sources:
      HSE advice on C. diff: https://www2.hse.ie/conditions/c-diff/
  covid19:
    aliases: COVID coronavirus SARS CoV 2 COVID-19
    summary: COVID-19 can cause anything from cold-like symptoms to serious breathing problems. People at higher risk should ask early about treatment if symptoms develop.
    emergency: If someone has severe difficulty breathing or is critically unwell, call
    symptoms:
    - Fever, cough, tiredness, sore throat, muscle aches and headache are common. Some people notice a change in taste or smell. Similar symptoms can occur with flu or other infections.
    causes:
    - The SARS-CoV-2 virus affects the respiratory tract. The chance of serious illness varies with factors such as age, immune status, other health conditions and vaccination history.
    diagnosis:
    - A clinician may advise testing if a diagnosis would affect treatment or care. Ask about timing if you are at higher risk and symptoms have just started.
    care:
    - Many people can manage mild illness at home with rest, fluids and suitable symptom relief. A clinician can assess whether antiviral treatment is appropriate for someone at higher risk.
    - Follow current HSE guidance on avoiding close contact while unwell, particularly around people at higher risk. Check the HSE's current eligibility guidance for COVID-19 vaccination.
    complications:
    - COVID-19 can lead to pneumonia or make other conditions worse. Some people have ongoing fatigue, breathlessness or other symptoms after the acute illness and can seek assessment for long COVID.
    help:
    - Contact a GP early if you are at higher risk and develop symptoms. Seek urgent advice for worsening breathing or if you become much more unwell after initially improving.
    sources:
      HSE medical help and treatment: https://www2.hse.ie/conditions/covid19/symptoms/medical-help-treatment/
  mumps:
    aliases: mumps parotitis swollen cheeks
    summary: Mumps often causes painful swelling near the ears and jaw. Contact your GP before attending so the practice can advise you and limit exposure to other patients.
    symptoms:
    - Swelling can affect one or both sides of the face below the ears and may make chewing uncomfortable. Fever, headache and tiredness can occur before the swelling.
    causes:
    - The mumps virus can inflame the salivary glands. Other infections, dental problems and blocked salivary ducts can also cause a swollen cheek, so the pattern and examination matter.
    diagnosis:
    - Tell your GP when the swelling started and whether you have had the MMR vaccine or contact with someone with mumps. A clinician may arrange testing if mumps is suspected.
    care:
    - Rest, fluids and suitable pain relief can help while the swelling settles. Follow HSE advice on staying away from school or work for five days after swelling begins.
    - Check with your GP if you are unsure about your MMR vaccination history. Vaccination is part of the HSE programme and helps protect against outbreaks.
    complications:
    - Mumps can cause inflammation of a testicle or ovary. Meningitis and hearing problems are uncommon complications. Seek advice promptly if you develop new symptoms as the swelling changes.
    help:
    - Call your GP if you think you or your child has mumps. Get urgent medical assessment for severe headache with a stiff neck or for sudden severe testicular pain.
    sources:
      HSE signs and complications: https://www.hse.ie/conditions/mumps/symptoms/
  whooping-cough-babies-and-children:
    aliases: pertussis whooping cough infant cough
    summary: Whooping cough can cause long coughing fits. Babies can become seriously ill and may have pauses in breathing even without the familiar whoop.
    emergency: If a baby stops breathing, turns blue or grey or is struggling to breathe, call
    symptoms:
    - A runny nose or mild cough can come first. Later, a child may have repeated coughing fits, struggle to take a breath between coughs or vomit afterwards. Very young babies may have breathing pauses.
    causes:
    - Whooping cough is a bacterial infection of the airways. The cough can continue for weeks as the airways recover. Babies under six months are at greatest risk of severe illness.
    diagnosis:
    - A clinician assesses the pattern of coughing, possible contacts and vaccination history. They may arrange a sample depending on when the symptoms began and how old the child is.
    care:
    - A clinician can decide if antibiotics are useful and whether household contacts need advice. A baby with breathing or feeding problems may need monitoring and support in hospital.
    - Ask your maternity team about the whooping cough vaccine in pregnancy and check your child's routine immunisations with your GP.
    complications:
    - Coughing fits can interfere with feeding and lead to dehydration. Babies can develop pneumonia or need help with breathing.
    help:
    - Arrange urgent assessment if you think a baby under one has whooping cough. Phone the GP or hospital ahead where possible. Seek emergency help immediately if breathing is affected.
    sources:
      HSE when to get medical help: https://www2.hse.ie/conditions/whooping-cough-babies-and-children/when-to-get-medical-help/
  strep-a:
    aliases: group A streptococcus GAS invasive group A strep iGAS
    summary: Group A strep can cause a sore throat or skin infection. Invasive infection is less common and can make someone seriously unwell very quickly.
    emergency: If someone with a suspected infection is severely unwell, struggling to breathe or difficult to wake, call
    symptoms:
    - Symptoms depend on the site of infection. A sore throat with fever, a rough rash with scarlet fever or a painful area of skin that is becoming red or swollen can occur.
    - Rapid deterioration, unusually severe pain, hard or fast breathing, confusion or marked drowsiness should prompt urgent assessment.
    causes:
    - Group A streptococcus can be present on the skin or in the throat without causing illness. In invasive disease, the bacteria infect an area such as the bloodstream or deeper tissues.
    diagnosis:
    - A GP assesses the symptoms and may examine the throat or skin. Hospital staff can take samples and investigate further when invasive infection is suspected.
    care:
    - A clinician decides whether antibiotics are needed based on the type and severity of the infection. Severe cases need hospital care. Follow public health advice if contacted about exposure to an invasive case.
    complications:
    - Invasive disease can cause sepsis. A skin infection that spreads rapidly, becomes much more painful or causes fever needs prompt medical attention.
    help:
    - Contact a GP if symptoms worsen, a fever and rash develop or a child is drinking much less. Get urgent medical help for signs of serious infection or rapid deterioration.
    sources:
      HSE signs and symptoms of strep A: https://www2.hse.ie/conditions/strep-a/
  acne:
    aliases: acne vulgaris spots pimples blackheads whiteheads
    summary: Acne can cause blocked pores, inflamed spots and painful deep lumps. Early treatment can help reduce scarring and the effect acne has on daily life.
    symptoms:
    - Blackheads and whiteheads are blocked pores. The skin can also develop inflamed bumps, spots containing pus or deeper tender lumps. The face, upper back and chest are common areas.
    - Tell your GP if the spots are leaving dents, raised scars or darker marks, or if they are affecting confidence or how you feel about going out.
    causes:
    - Oil and skin cells can build up in a hair follicle. Hormonal changes can increase oil production, and inflammation around the blocked follicle contributes to some types of spots.
    diagnosis:
    - A GP can usually diagnose acne by examining the type, number and distribution of the spots. They may ask about treatments you have tried, medicines and other symptoms to help rule out similar-looking conditions.
    care:
    - A pharmacist can advise on treatment for mild acne. A GP may prescribe a cream or gel or add a course of tablets, depending on severity. Many treatments need weeks of consistent use before you can judge their effect.
    - Tell your GP if you are pregnant or planning a pregnancy, since some acne medicines are unsuitable. A dermatologist may consider isotretinoin for severe acne or acne at risk of leaving scars.
    complications:
    - Deep inflammation and picking can lead to permanent scars. Darker marks after a spot heals can persist for a time. Acne can affect mood and confidence even when someone else considers it mild.
    help:
    - Speak to your GP if you have deep painful lumps, scarring, widespread spots on the chest or back, or acne that continues despite pharmacy treatment. Mention the impact on your mood as well as the skin symptoms.
    sources:
      HSE acne treatment: https://www2.hse.ie/conditions/acne/treatment/
      HSE living with acne: https://www2.hse.ie/conditions/acne/self-management/
  blood-tests:
    kind: test
    aliases: blood tests blood draw venepuncture phlebotomy fasting blood test blood results
    summary: Blood tests can help check your health, find the cause of symptoms or monitor treatment. How you prepare and what the results mean depend on the tests ordered.
    evidence_gap: The HSE describes where blood can be taken and how to prepare. Its patient guidance does not give a national count covering blood tests across general practice, hospitals and other services.
    symptoms:
    - A clinician may order blood tests to investigate symptoms, check how well an organ is working, monitor a medicine or assess health during pregnancy. Ask what question the test is intended to answer.
    causes:
    - Different tests measure different things. A full blood count measures types of blood cells, while other tests can measure glucose, hormones or markers of kidney or liver function. One sample can often supply more than one test.
    diagnosis:
    - Check whether the clinic has asked you to fast or to book the test at a particular time. Follow its instructions about water and medication. If you take medicines for diabetes or anything that might need adjusting, check with the clinic beforehand.
    care:
    - A doctor, nurse or phlebotomist usually takes blood from a vein in your arm or hand. Tell the person taking the sample if you have fainted before or feel light-headed. A small dressing is usually applied afterwards.
    - Your GP may take the sample in the practice or refer you to a hospital. Ask about any charge in advance. HSE guidance says routine GP blood tests should be free for medical card holders, with charges possible in certain circumstances.
    complications:
    - A small bruise or mild soreness can occur. Seek advice if bleeding continues despite pressure or if redness, swelling or pain around the puncture site is increasing.
    help:
    - Ask who will contact you with results and when to follow up if you have heard nothing. The person who ordered the test can explain whether a result matters in the context of your symptoms, medicines and previous results.
    sources:
      HSE common types of blood test: https://www2.hse.ie/conditions/blood-tests/common-types/
  genital-herpes-hsv:
    aliases: genital herpes HSV HSV-1 HSV-2 genital sores blisters
    summary: Genital herpes can cause painful blisters or ulcers around the genitals or anus. A sexual health clinic can test a fresh sore and discuss treatment and ways to reduce the risk of passing on the virus.
    symptoms:
    - The first recognised episode can cause tender blisters that open into sores, pain when passing urine and swollen glands in the groin. Some people also feel feverish or generally unwell.
    - Some infections cause little or no noticeable illness. A later recurrence can begin with tingling or irritation and may be milder than the first episode.
    causes:
    - Either type of herpes simplex virus can cause genital herpes. HSV-1 can be passed from the mouth to the genitals during oral sex. After infection, the virus stays in nearby nerves and can become active again.
    - The virus can pass through intimate contact even when there is no visible sore. Condoms reduce the risk, though skin outside the covered area can still be involved.
    diagnosis:
    - Contact a GP or sexual health clinic while a blister or sore is still present if possible. A clinician can swab the lesion and consider other causes of genital ulcers, including syphilis.
    - A routine STI screen generally does not include a herpes blood test. Ask the clinician which tests are appropriate for your symptoms and circumstances.
    care:
    - Antiviral tablets can help shorten a first episode. If outbreaks recur often, ask about tablets to start when symptoms begin or daily suppressive treatment. Avoid sexual contact while you have warning symptoms or sores.
    complications:
    - Pain can make it difficult to pass urine. Genital herpes around the time of birth can cause serious illness in a newborn, so tell your maternity team about a first episode, recurrence or past diagnosis.
    help:
    - Arrange an appointment promptly for new genital sores. Get urgent help if you cannot pass urine or feel very unwell. Contact your maternity team promptly if you develop symptoms during pregnancy.
    sources:
      HSE genital herpes guidance: https://www2.hse.ie/conditions/genital-herpes-hsv/
      HSE herpes in newborns: https://www2.hse.ie/conditions/neonatal-herpes/
  trichomonas-vaginalis-tv:
    aliases: trichomoniasis trich TV trichomonas vaginalis
    summary: Trichomoniasis is a treatable sexually transmitted infection. It can cause genital irritation or discharge, but people with no symptoms can still pass it on.
    symptoms:
    - Changes in vaginal discharge, a strong smell, soreness or itching can occur. Some people notice pain when passing urine or during or after sex.
    - People with a penis often have no symptoms. When symptoms occur they can include discharge, irritation around the foreskin or discomfort when passing urine.
    causes:
    - Trichomonas vaginalis is a parasite that can infect the vagina or urethra. The symptoms overlap with thrush, bacterial vaginosis and other STIs, which require different treatment.
    diagnosis:
    - A GP or sexual health clinic can arrange testing, usually with a vaginal swab or a urine sample depending on your anatomy and symptoms. Contact the clinic if a partner has been diagnosed, even if you feel well.
    care:
    - A clinician treats the infection with antibiotics and can arrange testing and treatment for partners. The HSE advises waiting a week after you and your partners have finished treatment before having sex again.
    - If symptoms return, contact the clinic. It can assess whether you need another test, treatment for reinfection or investigation for a different cause.
    complications:
    - Untreated infection can last months. During pregnancy it is associated with a higher risk of early birth or low birth weight. Tell your doctor or midwife if you are pregnant when arranging assessment.
    help:
    - Contact a GP or sexual health clinic if you have unusual discharge, irritation, pain when passing urine or a partner who has tested positive.
    sources:
      HSE trichomoniasis guidance: https://www2.hse.ie/conditions/trichomonas-vaginalis-tv/
  lymphogranuloma-venereum-lgv:
    aliases: LGV lymphogranuloma venereum LGV chlamydia proctitis rectal chlamydia
    summary: LGV is a form of chlamydia that can cause rectal pain, bleeding or discharge. It needs specific testing and a longer course of treatment than uncomplicated chlamydia.
    symptoms:
    - Rectal infection can cause bleeding, pus, pain and a persistent feeling that you need to open your bowels. There may also be constipation or diarrhoea.
    - A small painless genital sore can be easy to miss. Swelling or pain in the groin can develop later. Tell the clinician where symptoms occur so they can choose the right sample.
    causes:
    - Certain strains of Chlamydia trachomatis can inflame mucosal tissue and nearby lymph nodes. The infection spreads through sexual contact and can affect anyone exposed to it.
    diagnosis:
    - A sexual health clinician may swab the area involved, such as the rectum or a sore. If the sample tests positive for chlamydia and LGV is suspected, the laboratory can test further to identify the strain.
    care:
    - Take the full course prescribed by the clinic. Ask when to return for a test to check the infection has cleared, when it is safe to have sex again and how partners can get testing and treatment.
    complications:
    - Early treatment usually prevents lasting problems. Persistent inflammation can damage tissue in the affected area. Ongoing bleeding or pain after treatment needs reassessment.
    help:
    - Contact a sexual health clinic or GP promptly about rectal discharge, pain or bleeding, especially after sexual contact. Other causes of rectal bleeding also need medical assessment.
    sources:
      HSE LGV guidance: https://www2.hse.ie/conditions/lymphogranuloma-venereum-lgv/
  legionnaires-disease:
    aliases: legionnaires disease legionellosis legionella pneumonia
    summary: Legionnaires’ disease is a serious form of pneumonia. If you are unwell with cough, fever or breathing difficulty, mention recent travel, hospital stays or spa visits when you seek help.
    emergency: If someone has severe difficulty breathing, call
    symptoms:
    - Fever, headache, muscle aches and exhaustion can begin before the cough. Breathlessness or chest pain can develop as the lung infection progresses.
    - Symptoms resemble other types of pneumonia. Recent hotel, healthcare or spa exposure can help a clinician decide whether to test for Legionella.
    causes:
    - Lung infection can occur when a person breathes in tiny water droplets carrying Legionella bacteria. Older adults, smokers and people with chronic illness or a weakened immune system are more vulnerable to severe illness.
    diagnosis:
    - A clinician checks breathing and may arrange a chest X-ray to look for pneumonia. Hospital teams can use urine or respiratory samples to help determine whether Legionella is responsible.
    care:
    - Antibiotics are used to treat the infection. Hospital care may be needed for antibiotics through a vein, oxygen or more intensive breathing support. Energy and exercise tolerance can take weeks to recover.
    complications:
    - Severe pneumonia can impair breathing and require intensive care. Seek reassessment if breathing worsens or you feel much more unwell during recovery.
    help:
    - Seek urgent medical assessment for a persistent bad cough with fever, breathlessness or severe chest pain. Tell the clinician where you have been in the preceding 10 days. Go to an emergency department if you are very unwell.
    sources:
      HSE Legionnaires’ disease guidance: https://www2.hse.ie/conditions/legionnaires-disease/
      HPSC public factsheet: https://www.hpsc.ie/a-z/respiratory/legionellosis/factsheet/legionnairesdiseasefactsheetforthepublic/
  listeriosis:
    aliases: listeria listeriosis food poisoning pregnancy listeria
    summary: Listeriosis is an uncommon foodborne infection. Pregnant people, newborns and people with weakened immune systems need prompt assessment if they may have it.
    emergency: If someone has a seizure, becomes suddenly confused or is difficult to wake, call
    symptoms:
    - Listeriosis can cause fever, aches, diarrhoea or nausea. People with a healthy immune system may have mild symptoms or feel well.
    - In pregnancy, symptoms may be mild even if the infection affects the baby. A severe headache with a stiff neck or sensitivity to light can signal a serious infection.
    causes:
    - Listeria bacteria can enter the body through contaminated food and can sometimes enter the bloodstream. During pregnancy the infection can reach the baby through the placenta.
    diagnosis:
    - A clinician asks about symptoms, pregnancy, medicines and possible food exposure. Tell them if you have eaten food linked to a recall. Tests depend on the clinical circumstances and can include blood samples when invasive infection is suspected.
    care:
    - Many mild illnesses improve with rest and fluids. People with suspected invasive illness or infection during pregnancy need medical assessment for antibiotic treatment and monitoring. Follow HSE and Food Safety Authority of Ireland advice on recalls and food safety in pregnancy.
    complications:
    - Severe infection can cause sepsis or meningitis. Infection during pregnancy can lead to pregnancy loss, early delivery or serious illness in the newborn.
    help:
    - Seek urgent advice from your GP or maternity team if you are pregnant and think you may have listeriosis. Seek urgent assessment for a baby with possible infection or if you have a weakened immune system and develop symptoms.
    sources:
      HSE listeriosis guidance: https://www2.hse.ie/conditions/listeriosis/
      HPSC public factsheet: https://www.hpsc.ie/a-z/gastroenteric/listeriosis/factsheets/
  lyme-disease:
    aliases: lyme disease tick bite bullseye erythema migrans borrelia neuroborreliosis
    summary: Lyme disease can develop after a bite from an infected tick. A rash that expands over several days is an important clue, even if you never noticed a tick.
    symptoms:
    - An expanding red or darker patch may develop around the bite. The middle can clear, though the rash can also have an even colour. A small mark immediately after a bite can be local irritation.
    - Fever, tiredness, headaches and aches can occur with or without a rash. Later illness can affect nerves or joints, causing symptoms such as facial weakness or joint swelling.
    causes:
    - Lyme disease is caused by Borrelia bacteria carried by some ticks. Ticks can attach after time in long grass, woodland or bracken. Check your skin after spending time in those settings.
    diagnosis:
    - A GP may diagnose Lyme disease from a characteristic rash and the history alone. When blood tests are appropriate, an early negative result can be followed by a repeat test if the doctor still suspects Lyme disease.
    care:
    - A GP can prescribe antibiotics. Some people with severe illness need hospital assessment and antibiotics through a vein. If symptoms persist afterwards, ask your GP to review them and check whether another cause needs investigation.
    - If you find a tick attached to your skin, use fine-tipped tweezers or a tick removal tool. Grip it as close to the skin as possible and remove it steadily. Note the date and seek advice if symptoms develop.
    complications:
    - The infection can affect the nervous system, joints and, less often, the heart. Ireland’s notification figures cover Lyme neuroborreliosis, the form involving the nervous system.
    help:
    - Contact your GP if you develop an expanding rash or flu-like illness after a tick bite or time in places where ticks live. If possible, photograph the rash as it changes and tell your GP when it began.
    sources:
      HSE diagnosis and treatment: https://www2.hse.ie/conditions/lyme-disease/
      HPSC factsheet and Irish surveillance scope: https://www.hpsc.ie/a-z/lymedisease/factsheet
  tetanus:
    aliases: tetanus lockjaw tetanus vaccine puncture wound tetanus booster
    summary: A deep or dirty wound can need urgent assessment for tetanus prevention. A stiff jaw or painful muscle spasms after a wound can be a medical emergency.
    emergency: For severe muscle stiffness or spasms or difficulty breathing after a wound, call
    symptoms:
    - Early illness can cause a tight jaw and trouble opening the mouth or swallowing. Painful cramps or spasms can then affect the neck, back, abdomen or limbs.
    - Symptoms can begin days or weeks after the injury. If you have a concerning wound, get advice about prevention while you still feel well.
    causes:
    - Bacteria from the environment can enter damaged skin and produce a toxin that affects the nerves controlling muscles. Puncture wounds, bites and contaminated wounds can increase risk. Tetanus does not pass between people.
    diagnosis:
    - A clinician will examine the wound and ask how it happened and when you last received a tetanus vaccine. Severe stiffness and spasms require immediate assessment for possible tetanus.
    care:
    - Wound care and vaccination advice depend on the injury and previous doses. Some wounds also need tetanus immunoglobulin. Bring any available vaccine records, but seek care even if you cannot find them.
    - Tetanus itself requires hospital treatment, which can include medicines to control spasms and support with breathing.
    complications:
    - Severe spasms can affect breathing and swallowing and may cause fractures. Ireland recorded no tetanus notifications in 2025, but wound assessment still matters because exposure can happen anywhere.
    help:
    - Contact a GP or out-of-hours GP urgently for a deep or contaminated wound, especially if your vaccination history is uncertain. Go to an emergency department or call an ambulance if severe stiffness, spasms or breathing problems develop.
    sources:
      HSE wound and emergency advice: https://www2.hse.ie/conditions/tetanus/
      NIAC immunisation guidelines: https://www.hiqa.ie/sites/default/files/NIAC/Immunisation_Guidelines/Chapter_21_Tetanus.pdf
  malaria:
    aliases: malaria travel fever antimalarial falciparum malaria
    summary: A fever after travel to a malaria-risk area needs urgent assessment. Malaria remains possible if you took preventive tablets or returned home months ago.
    emergency: If someone with suspected malaria has a seizure, is confused or is struggling to breathe, call
    symptoms:
    - Fever, shaking chills, headache, aches, vomiting or diarrhoea can resemble flu or a stomach infection. A fever that comes and goes can still need assessment.
    - Symptoms usually begin within weeks of infection. Some forms of malaria can cause illness months later, which makes earlier travel relevant to the assessment.
    causes:
    - A mosquito bite can pass on a parasite that first develops in the liver and then infects red blood cells. Malaria diagnosed in Ireland is generally linked to travel in areas where it circulates.
    diagnosis:
    - Tell the clinician which countries and regions you visited, the dates and whether you took antimalarial tablets. Suspected malaria needs urgent blood testing and may require repeat samples if the first test is negative.
    care:
    - Clinicians choose treatment based on the parasite, the severity of illness and where infection was acquired. Severe malaria needs immediate hospital care. Before future travel, ask a travel health clinic about preventive tablets and bite avoidance for your destination.
    complications:
    - Malaria can become life-threatening and cause severe anaemia, breathing problems or problems with the brain and other organs. Prompt testing and treatment reduce the risk.
    help:
    - Seek urgent medical assessment the same day if you develop a fever or flu-like illness after visiting a malaria-risk area. If you cannot get prompt assessment through your GP, go to an emergency department and give your travel history.
    sources:
      HSE malaria guidance: https://www2.hse.ie/conditions/malaria/
      HSE malaria testing and when to get help: https://www2.hse.ie/conditions/malaria/symptoms/
  shigella:
    aliases: shigella shigellosis bloody diarrhoea dysentery
    summary: Shigella can cause diarrhoea, fever and severe stomach cramps. A stool test can identify the infection and help clinicians decide how to treat it.
    symptoms:
    - Diarrhoea may contain blood or mucus. Cramps, fever and an urgent need to use the toilet can occur. Frequent diarrhoea can make it hard to replace the fluid you lose.
    causes:
    - Shigella bacteria infect the bowel. Infection can be acquired through contaminated food, hands or sexual contact. It can still pass to others after diarrhoea has settled.
    diagnosis:
    - Your GP can arrange a stool test. Tell them about travel, illness in close contacts, possible sexual exposure or work with food, children or patients. If sexual exposure is likely, ask about testing for other STIs.
    care:
    - Rest and fluids are usually enough for mild illness. A clinician may use antibiotics in severe cases or in specific circumstances. Resistance affects which medicine is likely to work.
    - Wash hands with soap and water after using the toilet and before handling food. Follow public health advice on returning to work, particularly in healthcare, childcare or food handling, and ask when it is safe to resume sex.
    complications:
    - Severe diarrhoea can cause dehydration. People with weakened immune systems may need hospital care, particularly if symptoms worsen or the infection is difficult to treat.
    help:
    - Contact your GP promptly for bloody diarrhoea, worsening pain, a high fever or signs of dehydration such as passing much less urine.
    sources:
      HSE testing and follow-up: https://www2.hse.ie/conditions/shigella/
      HSE infectious diarrhoea prescribing guidance: https://assets.hse.ie/media/documents/Infectious_diarrhoea_guideline.pdf
  mpox:
    aliases: mpox monkeypox mpox rash blisters lesions
    summary: Mpox can cause painful spots or blisters, sometimes alongside fever or swollen glands. Phone a GP or sexual health clinic before visiting if you think you may have it.
    symptoms:
    - The rash may be limited to a small area or appear in several places. Spots can develop into blisters and then scabs. They can occur near the genitals or anus or around the mouth.
    - Fever, headaches, aches and swollen glands can occur. Some people first notice the rash, so tell the clinician if you have had close contact with someone diagnosed with mpox.
    causes:
    - Mpox is a viral infection that can pass through close physical contact, including intimate contact. It may also spread through shared bedding or towels used by someone with active lesions.
    diagnosis:
    - A clinician assesses the rash and may take a swab from a lesion. Herpes and other infections can produce similar symptoms. Phone first so staff can arrange assessment and advise on limiting close contact.
    care:
    - Treatment often focuses on relief of pain and other symptoms. Follow the clinic’s advice on how long to avoid close contact and sharing towels or bedding. Ask the HSE sexual health service whether vaccination is recommended for you.
    complications:
    - Pain can be severe if lesions affect the anus, mouth or genitals. People with weakened immunity may be more vulnerable to severe disease. Eye symptoms or worsening pain need prompt review.
    help:
    - Call a GP or sexual health clinic about a new rash if you suspect mpox. Tell them if you are pregnant, have a weakened immune system or have had contact with a confirmed case.
    sources:
      HSE mpox symptoms, testing and vaccination: https://www2.hse.ie/conditions/mpox/
  group-b-strep:
    aliases: group B strep GBS streptococcus agalactiae pregnancy newborn infection
    summary: Group B strep is often carried without symptoms. If it is found during pregnancy, your maternity team can explain what it means for labour and for your baby after birth.
    emergency: If a newborn is hard to wake, has trouble breathing or turns blue, call
    symptoms:
    - Carrying group B strep usually causes no symptoms. A newborn with an infection may feed poorly, seem unusually sleepy, breathe fast or have an abnormal temperature.
    causes:
    - Group B streptococcus can live in the digestive or genital tract without causing illness. It can pass to a baby around birth and occasionally cause a serious infection.
    diagnosis:
    - In Ireland, a urine test or vaginal swab taken for another reason may find group B strep during pregnancy. Tell your midwife about any positive result or a previous baby affected by group B strep.
    - A newborn who seems ill needs immediate clinical assessment. Hospital staff can take samples to help identify the cause and start treatment if they suspect serious infection.
    care:
    - Your team may recommend antibiotics through a vein during labour to reduce the risk of early infection in the baby. Ask when to phone the maternity unit if labour starts or your waters break and whether your baby will need observation afterwards.
    complications:
    - Group B strep can cause sepsis, pneumonia or meningitis in a newborn. The national surveillance figure covers invasive infection across age groups, so it cannot tell you how often it is carried during pregnancy.
    help:
    - Discuss a positive result with your midwife or obstetric team. Seek urgent medical assessment if a newborn is feeding poorly, seems unusually sleepy or shows signs of illness.
    sources:
      HSE group B strep in pregnancy and babies: https://www2.hse.ie/conditions/group-b-strep/
  cytomegalovirus-pregnancy:
    aliases: CMV cytomegalovirus congenital CMV cCMV pregnancy
    summary: Cytomegalovirus is common and often causes few symptoms. If infection is suspected during pregnancy, a maternity team can assess the timing and discuss whether the baby needs follow-up.
    symptoms:
    - Many people feel well. When symptoms occur they can include fever, tiredness, sore throat and swollen glands, which can resemble many other infections.
    - Babies with congenital CMV can look well at birth. Some have signs such as jaundice, hearing problems or a smaller than expected head size.
    causes:
    - CMV can pass through body fluids, including saliva and urine. It can remain in the body after an earlier infection and become active again. A pregnant person can pass the virus through the placenta.
    - Handwashing after changing nappies or wiping a child’s nose, using separate cutlery and avoiding sharing cups can help reduce exposure.
    diagnosis:
    - A blood test may help the medical team establish whether a pregnant person has had CMV and when infection may have occurred. If a baby needs testing, ask the team when it should be done, since timing soon after birth helps distinguish congenital infection from infection acquired later.
    care:
    - Follow-up during pregnancy depends on what the tests show. After birth, a specialist may recommend antiviral treatment for babies with certain symptoms and arrange hearing or developmental follow-up where needed.
    complications:
    - Congenital CMV can cause permanent hearing loss even in a baby who initially appears well. More severe infection can affect the brain, eyes or other organs. The Irish notification count measures confirmed reports of congenital infection and does not measure all maternal CMV infections.
    help:
    - Speak to your GP or maternity team if you develop persistent flu-like symptoms during pregnancy or are concerned about a possible exposure. Ask who will explain the results and organise any follow-up for the baby.
    sources:
      HSE CMV overview: https://www2.hse.ie/conditions/cytomegalovirus-pregnancy/overview/
      HSE diagnosing CMV: https://www2.hse.ie/conditions/cytomegalovirus-pregnancy/diagnosing/
      HSE treatment and hearing follow-up: https://www2.hse.ie/conditions/cytomegalovirus-pregnancy/treatment/
      HSE reducing exposure: https://www2.hse.ie/conditions/cytomegalovirus-pregnancy/prevention/
  neonatal-herpes:
    aliases: neonatal herpes newborn herpes HSV baby cold sore
    summary: Herpes infection in a newborn can become serious quickly. Seek urgent assessment for a newborn with suspected herpes, especially if they feed poorly, have fever or develop blisters.
    emergency: If your baby is difficult to wake, has a seizure, turns blue or has breathing problems, call
    symptoms:
    - Some newborns develop blisters or sores near the eyes or mouth or elsewhere on the skin. Others may first become irritable, feed less or have a fever. A baby can be seriously ill without an obvious blister.
    causes:
    - A baby can be exposed to herpes simplex around birth or after birth through close contact with an active cold sore. First genital herpes infection late in pregnancy carries particular risk to the baby.
    diagnosis:
    - Hospital staff will assess the baby and may take swabs and other samples. Tell them about cold sore contact or genital herpes during pregnancy if you know of it, without delaying care to confirm the exposure.
    care:
    - A baby with suspected neonatal herpes needs urgent hospital assessment for antiviral treatment through a vein. If you have a cold sore or warning tingling, avoid kissing the baby and wash your hands before contact.
    - Tell your midwife or obstetrician if you have genital herpes during pregnancy. If you have blisters on or near a nipple, call your GP or maternity team for feeding advice.
    complications:
    - Herpes can affect only the skin, eyes or mouth, or it can spread to the brain, lungs or other organs. Early treatment improves the chance of recovery.
    help:
    - Contact an urgent GP service or go to an emergency department if you suspect neonatal herpes and the baby has fever, sores, poor feeding or irritability.
    sources:
      HSE signs, emergency advice and prevention: https://www2.hse.ie/conditions/neonatal-herpes/
  rabies:
    aliases: rabies animal bite scratch bat travel post-exposure vaccination
    summary: Get medical help immediately after a possible rabies exposure, even if you feel well or were vaccinated before travel. Preventive treatment needs to begin before symptoms.
    symptoms:
    - Symptoms can include fever, headache and unusual discomfort around the site of a bite. Later illness can cause swallowing problems, agitation or weakness. Do not wait for symptoms to seek care.
    causes:
    - Rabies is a virus that affects the nervous system. A potentially infected mammal’s bite, scratch or saliva contacting broken skin, the mouth or the eyes can require assessment. Ask about bat contact even if you cannot see a wound.
    diagnosis:
    - After an exposure, a clinician assesses the animal, location, wound and your vaccination history. Tell them where and when it happened and whether you received any treatment abroad.
    care:
    - Wash a bite or scratch immediately with plenty of soap and water and seek medical help straight away. A clinician decides if you need a course of vaccine and whether rabies immunoglobulin is needed.
    - If treatment starts abroad, keep the written record and contact your GP when you return to Ireland so they can check whether more doses or follow-up are needed.
    complications:
    - Once rabies symptoms start, the disease is almost invariably fatal. The absence of Irish notifications does not remove the risk from bites or other exposures abroad.
    help:
    - Get immediate local medical attention after contact with an animal that could have rabies. Seek advice even if you had travel vaccinations or the wound looks small.
    sources:
      HSE rabies exposure and treatment guidance: https://www.hse.ie/conditions/rabies/
  dengue-fever:
    aliases: dengue dengue fever severe dengue fever after travel
    summary: Dengue can cause sudden fever, headache and aches after travel. Severe abdominal pain, bleeding or breathing problems after the fever begins need emergency care.
    emergency: If you develop severe abdominal pain, vomiting blood or difficulty breathing with possible dengue, call
    symptoms:
    - Fever can come on suddenly with headache, pain behind the eyes, aching joints, nausea or rash. A clinician needs to consider other causes, including malaria when the travel history fits.
    - Severe dengue can develop after the initial illness and sometimes as the temperature comes down. Pay attention to new bleeding, repeated vomiting or worsening abdominal pain.
    causes:
    - Dengue is caused by a virus passed on by mosquitoes. Travellers can be exposed in tropical regions and in some parts of southern Europe. Mention every place visited, including short stays in a risk area.
    diagnosis:
    - Give your GP the places and dates of travel and when you first felt unwell. They may arrange a blood test and check whether other infections also need urgent testing.
    care:
    - Rest, fluids and paracetamol if suitable can help with mild illness after assessment. The HSE advises avoiding aspirin and ibuprofen when dengue is suspected because of bleeding risk. Ask a clinician about any medicine you already take regularly.
    complications:
    - Severe dengue can cause dangerous bleeding or circulation problems and needs hospital care. Ongoing tiredness can last for weeks after milder illness.
    help:
    - Contact your GP if you develop fever or flu-like symptoms within two weeks of visiting a dengue-risk area. Seek emergency help for severe symptoms even if the initial fever has started to improve.
    sources:
      HSE dengue symptoms, prevention and emergency guidance: https://www2.hse.ie/conditions/dengue-fever/
  diphtheria:
    aliases: diphtheria throat infection diphtheria vaccine
    summary: Diphtheria is a rare bacterial illness that can cause a sore throat and neck swelling. Phone ahead for urgent medical advice if you suspect infection or have had contact with a case.
    emergency: If someone is struggling to breathe, call
    symptoms:
    - Throat infection can cause fever, hoarseness, a sore throat or swollen glands in the neck. Some infections affect the skin and cause a sore that takes time to heal.
    causes:
    - Bacteria can spread during close contact, including from a person who does not feel ill. Some strains produce a toxin that can cause serious illness beyond the original site of infection.
    diagnosis:
    - The clinician will consider your symptoms, relevant travel, vaccination history and known contacts. They may take a swab and notify public health if infection is suspected.
    care:
    - Treatment can include antibiotics and, when indicated, an antitoxin. A public health team can advise close contacts about assessment, preventive treatment or vaccination.
    - Children are offered protection as part of the Irish routine immunisation programme. Ask the GP or immunisation office to check records if you are unsure which doses were received.
    complications:
    - Severe infection can affect breathing, the heart and nerves. A person with suspected respiratory diphtheria needs urgent assessment even if the first symptoms resemble an ordinary sore throat.
    help:
    - Phone a GP, out-of-hours GP or emergency department for urgent advice after a known exposure or if you suspect diphtheria. Calling first helps the service manage possible exposure to other patients.
    sources:
      HSE diphtheria guidance: https://www2.hse.ie/conditions/diphtheria/
  polio:
    aliases: polio poliomyelitis acute flaccid paralysis polio vaccine post-polio
    summary: Polio is vaccine-preventable. Sudden inability to move part of the body or difficulty breathing is an emergency, whatever the suspected cause.
    emergency: If you or your child suddenly cannot move a limb or has difficulty breathing, call
    symptoms:
    - Most people infected with poliovirus feel well or have a brief flu-like illness with fever, aches or a sore throat. Rarely, weakness or paralysis develops, often in the legs.
    causes:
    - Poliovirus usually spreads when tiny amounts of infected stool contaminate hands, food or water. In a small share of infections it affects the nerves that control muscles.
    diagnosis:
    - Sudden muscle weakness has several possible causes that need urgent hospital assessment. Tell staff about recent travel and vaccinations if you know them. Clinicians can coordinate testing with public health services when polio is suspected.
    care:
    - Hospital treatment supports breathing or other affected functions. Physiotherapy, rehabilitation and mobility support can help with recovery. Check with your GP about catch-up vaccination if records are incomplete.
    complications:
    - Weakness can take weeks or months to improve and may persist. Some people who previously had polio develop new fatigue or weakness years later, known as post-polio syndrome, which needs a separate assessment. The Irish surveillance figure is for acute paralytic polio.
    help:
    - Call emergency services if sudden weakness prevents movement or breathing becomes difficult. Ask a GP or travel health clinic about polio vaccination before travel if you are unsure of your protection.
    sources:
      HSE polio guidance: https://www2.hse.ie/conditions/polio/
  botulism:
    aliases: botulism infant botulism foodborne botulism floppy baby
    summary: Botulism is a rare illness that can rapidly weaken muscles used for swallowing and breathing. Suspected botulism needs immediate emergency care.
    emergency: If you think you or your baby has symptoms of botulism, call
    symptoms:
    - Adults may develop blurred or double vision, slurred speech or trouble swallowing before weakness spreads. Breathing can become difficult.
    - In babies, a weak cry, poor feeding, constipation and an unusually floppy head or limbs can be signs. Tell emergency staff if these symptoms are new or getting worse.
    causes:
    - Botulism results from a toxin that interferes with the signals nerves send to muscles. Clinicians consider foodborne, infant and wound botulism depending on symptoms and history.
    diagnosis:
    - Emergency teams assess breathing, swallowing and muscle weakness. Tell them when symptoms began and whether anyone else who shared a meal has similar symptoms. Treatment decisions can be urgent while confirmatory testing is arranged.
    care:
    - Hospital treatment may include antitoxin and support with breathing. Recovery can require rehabilitation as muscle function returns. The HSE advises against giving honey to a child under one year old.
    complications:
    - Breathing failure can develop if respiratory muscles weaken. A person may require intensive care, and recovery can take weeks or months.
    help:
    - Call emergency services or go to an emergency department if you suspect botulism. Do not wait for a scheduled appointment, particularly if swallowing, speech or breathing changes.
    sources:
      HSE botulism emergency and treatment guidance: https://www2.hse.ie/conditions/botulism/
  eczema:
    aliases: eczema adult eczema atopic dermatitis itchy skin eczema flare
    summary: Eczema can make the skin itchy, dry and sore and interrupt sleep. A GP or pharmacist can help you build a routine for everyday skin care and a plan for flares.
    symptoms:
    - Itching, dryness and patches of inflamed or cracked skin are typical. Patches often affect the hands, elbows, knees or face. On brown or black skin, changes in colour or texture may be easier to see than redness.
    - Ask for help if itching disrupts sleep or work. If the rash keeps returning, note whether wet work, detergents, gloves, jewellery or a new skincare product coincide with it.
    causes:
    - In atopic eczema the skin barrier holds less moisture, and inflammation makes the skin more sensitive. Other types of eczema have different causes, including repeated contact with irritants or allergy to something touching the skin.
    diagnosis:
    - A GP will examine the rash and ask about where it starts, how long it lasts and what makes it worse. If a contact allergy is suspected, a dermatologist may arrange patch testing.
    care:
    - Use an emollient regularly and ask a pharmacist about suitable cleansers. A GP may prescribe a topical steroid for flares and explain how much to use, where to apply it and for how long.
    - Seek a treatment review if you need repeated courses, if a sensitive area such as the eyelids is affected, or if the plan is difficult to follow around work or sleep.
    complications:
    - Scratching can break the skin and make infection more likely. Fluid, yellow crusts, swelling, pain or fever can signal infection. Rapidly worsening painful patches with clusters of blisters can be eczema herpeticum.
    help:
    - Contact your GP for a rash that persists or interferes with daily life. Get urgent assessment for rapidly worsening painful eczema or clusters of blisters, particularly if you feel feverish or unwell.
    sources:
      HSE eczema diagnosis and signs of infection: https://www2.hse.ie/conditions/eczema/
      HSE eczema treatment: https://www2.hse.ie/conditions/eczema/treatment/
  eczema-babies-children:
    aliases: baby eczema infant eczema child eczema atopic dermatitis children
    summary: In babies and children, eczema often causes itchy, sore patches and broken sleep. A GP can diagnose the rash and give you a plan for daily care, flares and signs of infection.
    symptoms:
    - Babies may have patches on the face. Children can also get them in the neck, inside the elbows, behind the knees or on the hands. Inflamed skin may darken or look purple or grey on brown or black skin.
    - A baby may rub their face or seem unsettled at night. Older children may scratch until their skin bleeds, especially when warm or tired.
    causes:
    - Atopic eczema affects the skin barrier, which lets moisture escape more easily. Heat, some soaps and other irritants can trigger flares. A family history of eczema, asthma or hay fever makes atopic eczema more likely.
    diagnosis:
    - The GP can usually recognise eczema by examining the skin. A swab may help if the skin appears infected. Photographs from a bad flare can help when the skin looks better by the appointment.
    care:
    - Use an emollient regularly, including when the skin is settled. Ask the GP to show you how and where to use any prescribed steroid cream. Share the instructions with anyone who regularly looks after your child.
    - Keep fingernails short and use a soap substitute if recommended. Keep clothing and bedding exposed to emollients away from cigarettes, candles and open flames.
    complications:
    - Oozing, crusting, warmth or pain can suggest infection. Painful rash with rapidly spreading blisters, especially after contact with a cold sore, needs urgent assessment for eczema herpeticum.
    help:
    - Contact your GP if your child’s eczema flares and fails to improve after a few days of their usual treatment or if you see signs of infection. Seek urgent help for rapidly spreading painful blisters or a child who is becoming unwell.
    sources:
      HSE eczema in babies and children: https://www2.hse.ie/conditions/eczema-babies-children/
      HSE urgent advice for eczema herpeticum: https://www2.hse.ie/conditions/eczema/
  psoriasis:
    aliases: psoriasis plaque psoriasis scalp psoriasis nail psoriasis psoriatic arthritis
    summary: Psoriasis can cause persistent scaly patches on the skin or changes in the nails. Tell your GP if you also have swollen or stiff joints, as this can need separate treatment.
    symptoms:
    - Plaque psoriasis often causes thick, scaly patches on the scalp, elbows, knees or lower back. Their colour varies with skin tone. Patches can itch, crack or bleed.
    - Nail changes can include tiny pits, thickening or separation from the nail bed. Mention joint swelling, morning stiffness or a whole swollen finger or toe to your GP.
    causes:
    - Inflammation speeds up the turnover of skin cells, allowing them to build up into plaques. The pattern can change over time and symptoms may flare after illness or skin injury.
    diagnosis:
    - A GP usually examines the skin and nails and may refer you to a dermatologist if the diagnosis is unclear or the impact is significant. Joint symptoms may need assessment by a rheumatologist.
    care:
    - Treatment depends on where the plaques are, how extensive they are and their effect on everyday life. Creams or ointments are often used first. Specialists can offer light therapy or medicines that act throughout the body when appropriate.
    - Tell your GP if applying treatment to the scalp, hands or other areas is difficult or if it affects sleep, work or confidence. These details can inform treatment choices.
    complications:
    - Psoriatic arthritis can damage joints over time if untreated. Uncommon forms of psoriasis can cause widespread redness or pus-filled blisters and may need emergency treatment.
    help:
    - Book a GP visit if you think you have psoriasis or if an existing treatment is no longer controlling it. Seek urgent assessment for a rapidly spreading painful rash or widespread pustules, particularly with fever or chills.
    sources:
      HSE diagnosis and joint symptoms: https://www2.hse.ie/conditions/psoriasis/
      HSE treatment options: https://www2.hse.ie/conditions/psoriasis/treatment/
  hidradenitis-suppurativa:
    aliases: hidradenitis suppurativa HS recurrent boils armpit groin abscess
    summary: Hidradenitis suppurativa causes recurrent painful lumps in places such as the armpits or groin. Recognising the pattern early can help prevent scarring and make treatment easier to plan.
    symptoms:
    - Tender lumps or abscesses can arise in the same area repeatedly, including beneath the breasts or around the buttocks. Some drain, leaving scars or small openings in the skin.
    - Tell your GP if lumps recur in skin folds or on both sides of the body. Photographs and a record of when each lump appeared can help if it has settled before the visit.
    causes:
    - Inflammation starts around blocked hair follicles. The condition can run in families. It cannot be passed on by touching affected skin, and washing more frequently will not resolve it.
    diagnosis:
    - A clinician looks at where lumps occur, how often they recur and whether there are scars or channels under the skin. A swab can help if a secondary infection is suspected.
    care:
    - Your GP can discuss pain relief and medicines to reduce inflammation. A dermatologist can offer other treatment for persistent or extensive disease, including specialist medicines or surgery. Ask about dressings if draining areas are difficult to manage.
    complications:
    - Repeated inflammation can leave scars and channels under the skin. Pain or drainage can interfere with movement, work and relationships. A sudden change with spreading redness or fever can suggest a secondary infection.
    help:
    - Arrange a GP visit for recurrent boils or drainage in skin folds. Seek prompt care if pain is escalating, redness is spreading or you feel feverish.
    sources:
      HSE hidradenitis suppurativa diagnosis and care: https://www2.hse.ie/conditions/hidradenitis-suppurativa/
  rosacea:
    aliases: rosacea facial flushing papulopustular rosacea ocular rosacea
    summary: Rosacea can cause facial flushing, stinging and bumps. Eye pain, blurred vision or new sensitivity to light need urgent assessment.
    symptoms:
    - Flushing may come and go at first. Later, the cheeks or nose can stay discoloured or feel hot or sting. Some people develop visible fine blood vessels or small bumps.
    - Eye symptoms can include dry or gritty eyes and crusted or sore eyelids. Facial colour changes can be harder to see on darker skin, so burning or new sensitivity is worth mentioning.
    causes:
    - Rosacea involves inflammation in facial skin. Sun exposure, heat, exercise or alcohol can trigger symptoms for some people. A brief diary can help identify what brings on your own flares.
    diagnosis:
    - A GP assesses the pattern and considers conditions such as acne, eczema and other causes of a facial rash. Tell them about eye symptoms, recent skincare changes and any products you have already tried.
    care:
    - Gentle skin care and daily sun protection can help. A GP may prescribe a cream or tablets depending on the symptoms. Persistent symptoms may need a dermatology review.
    complications:
    - Rosacea can affect the surface of the eye. Inflammation of the cornea can threaten sight if it goes untreated. Some people also develop thicker skin around the nose over time.
    help:
    - Make a GP appointment if facial symptoms keep returning or bother you. Contact a GP urgently for a painful, red or gritty eye, blurred vision or new difficulty looking at light.
    sources:
      HSE rosacea symptoms, treatment and eye advice: https://www2.hse.ie/conditions/rosacea/
  abdominal-aortic-aneurysm:
    aliases: AAA abdominal aortic aneurysm aorta rupture aneurysm
    summary: An abdominal aortic aneurysm is a widening of the main artery in the abdomen. Many are found incidentally. A rupture
      is a medical emergency.
    emergency: If there is sudden severe pain in the abdomen or back, especially with faintness or collapse, call
    symptoms:
    - An unruptured aneurysm often causes no symptoms. Some people notice recurring abdominal or back pain or a pulsating feeling
      in the abdomen. Sudden severe pain, sweating or collapse can occur if it bursts.
    causes:
    - The wall of the abdominal aorta weakens and stretches. Age, smoking and family history can raise risk. An aneurysm can enlarge
      over time, which is why measurements matter.
    diagnosis:
    - An abdominal ultrasound usually provides the first measurement. A hospital team can use CT to plan treatment or investigate
      an emergency. Ask what the diameter was and when it should be checked again.
    care:
    - Smaller aneurysms are often monitored with repeat scans. A vascular specialist considers repair when size, symptoms, growth
      or other factors make the risks of waiting greater. Blood-pressure control and stopping smoking are also part of care.
    complications:
    - Rupture can cause major internal bleeding. Repair can lower that risk but brings its own risks and may require long-term follow-up,
      especially after a stent graft.
    help:
    - Keep scan appointments even if you feel well. New pain in someone with a known aneurysm should be assessed promptly. Sudden
      severe pain or collapse needs emergency help.
  abortion:
    kind: procedure
    aliases: abortion termination of pregnancy Ireland My Options medical surgical abortion
    summary: The HSE's My Options service can explain how to access abortion care in Ireland. Contact it early if you think you may
      want an abortion, especially if you are unsure how far along you are.
    symptoms:
    - People seek abortion care for different reasons. A GP, clinic or hospital can discuss your situation confidentially. My Options
      provides information about services and supports for people making a decision.
    causes:
    - Care may involve medicines or a procedure. The appropriate method and location depend on the stage of pregnancy and medical
      circumstances. The HSE explains when abortion is available under Irish law.
    diagnosis:
    - The clinician will check how far along you are, ask about medical history and explain consent and the next steps. Ask about
      pain relief, what to expect at home and how to contact the service out of hours.
    care:
    - Medical abortion usually involves prescribed medicines that cause cramps and bleeding. Surgical abortion takes place in hospital.
      Your treating team will give instructions specific to the care arranged.
    complications:
    - Heavy bleeding, fever, severe pain or increasing illness can need urgent help. Your team may give you a follow-up pregnancy
      test. Follow the instructions for when to use it and what to do if the result is positive.
    help:
    - Contact the treating clinician or the HSE My Options service if you have concerns before or afterwards. If you have severe
      pain with faintness, collapse or very heavy bleeding, seek emergency help.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/abortion/after/
  acute-cholecystitis:
    aliases: acute cholecystitis inflamed gallbladder gallstones right upper abdominal pain
    summary: Acute cholecystitis is inflammation of the gallbladder. Persistent pain under the right ribs, especially with fever
      or jaundice, needs urgent assessment.
    symptoms:
    - The pain is often steady and can spread to the right shoulder or back. It may worsen during a deep breath. Fever, nausea or
      vomiting can occur.
    causes:
    - A gallstone can block the tube draining the gallbladder. The trapped bile and pressure can cause inflammation and sometimes
      infection. Less commonly, cholecystitis occurs without a stone.
    diagnosis:
    - A clinician examines the abdomen and checks blood tests for inflammation and liver problems. Ultrasound is often the first
      scan. Other imaging may be needed if the diagnosis remains uncertain.
    care:
    - Hospital treatment can include pain relief, fluid through a vein and antibiotics where indicated. A surgical team decides when
      gallbladder removal is suitable or whether another approach is safer.
    complications:
    - Untreated inflammation can damage or perforate the gallbladder. A stone in the main bile duct can cause jaundice, serious infection
      or pancreatitis.
    help:
    - Seek urgent help for persistent severe pain under the right ribs. Fever, yellowing of the eyes or skin, faintness or rapidly
      worsening illness warrant prompt emergency assessment.
  ada-scid:
    aliases: ADA SCID adenosine deaminase deficiency severe combined immunodeficiency
    summary: ADA-SCID is an inherited immune condition. Newborn screening can identify babies who need urgent specialist assessment
      before serious infections occur.
    symptoms:
    - A baby can seem well at birth. Untreated babies may develop repeated or severe infections, persistent diarrhoea, oral thrush
      or poor weight gain in the first months of life.
    causes:
    - Without enough adenosine deaminase, substances that damage developing immune cells build up. This weakens several parts of
      the immune system and makes otherwise ordinary infections dangerous.
    diagnosis:
    - A high-risk heel-prick result needs urgent specialist assessment and confirmatory blood tests. Clinicians may check different
      immune cells, enzyme activity and the responsible gene.
    care:
    - An immunology team can advise on infection precautions and decide which treatment is appropriate. Options can include enzyme
      replacement, a stem-cell transplant or gene therapy, depending on the case and access.
    complications:
    - Serious infections can affect the lungs or other organs. Early detection and specialist treatment improve the outlook. Discuss
      vaccines, feeding and contact with sick people directly with the baby's team.
    help:
    - If the screening team contacts you, follow its instructions immediately even if your baby seems well. For fever or signs of
      infection in a baby with suspected or confirmed ADA-SCID, use the emergency plan given by the team.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/heel-prick-screening/conditions/ada-scid/
  alpha-1-antitrypsin-deficiency:
    aliases: alpha 1 AATD SERPINA1 alpha one inherited COPD liver disease
    summary: Alpha-1 antitrypsin deficiency can contribute to lung or liver disease. A blood test can help explain otherwise unexpected
      lung disease or identify who in a family might need follow-up.
    symptoms:
    - Lung problems can cause breathlessness, wheeze or a persistent cough, often in adulthood. Liver problems can occur in childhood
      or adulthood and may cause jaundice or an abnormal liver blood test.
    causes:
    - The liver makes a protein that helps protect the lungs from damage. Some inherited variants decrease the amount reaching the
      bloodstream or cause abnormal protein to build up in the liver.
    diagnosis:
    - Clinicians can measure alpha-1 antitrypsin in the blood and use further tests to identify its type or the gene variant. They
      may offer breathing tests and liver assessment and discuss testing relatives.
    care:
    - Care depends on which organs are affected. It can involve avoiding tobacco smoke, treating associated lung disease, vaccination
      advice and specialist liver or respiratory follow-up.
    complications:
    - Possible complications include emphysema, bronchiectasis or liver scarring. A carrier result and severe deficiency carry different
      risks, so ask the team to explain your specific result.
    help:
    - Contact your GP if you have unexplained breathlessness, early COPD, abnormal liver tests or a close relative with alpha-1 deficiency.
      Ask about testing through the Irish national programme.
    sources:
      Clinical guidance and further reading: https://www.hiqa.ie/areas-we-work/health-information/data-collections/alpha-one-foundation-registry
  anaphylaxis:
    aliases: anaphylaxis severe allergic reaction adrenaline auto-injector epipen
    summary: Anaphylaxis is a severe allergic reaction that can affect breathing or circulation within minutes. Give adrenaline promptly
      if the person has an auto-injector and call for an ambulance.
    emergency: If you think someone is having anaphylaxis, use their adrenaline auto-injector if available and call
    evidence_gap: Hospital statistics can track treated episodes, but a verified national estimate covering all anaphylaxis episodes
      was not identified for this guide.
    symptoms:
    - Warning signs include swelling of the tongue or throat, difficult or noisy breathing, dizziness, faintness or collapse. A rash
      may occur, but a severe reaction can happen without one.
    causes:
    - An immune reaction releases substances that can narrow the airways and drop blood pressure. Foods, insect stings and medicines
      are common triggers, although the cause is not always identifiable.
    diagnosis:
    - Anaphylaxis is recognised and treated from its symptoms. Hospital staff may take blood samples or refer for allergy testing
      later to investigate the trigger.
    care:
    - Use the prescribed adrenaline auto-injector without delay and follow the emergency operator's instructions. Keep the person
      lying down if possible. If breathing is difficult they may need to sit up slowly, with legs extended. Do not let them stand
      or walk.
    complications:
    - Symptoms can recur after initial improvement, which is one reason hospital assessment matters. After recovery, an allergy team
      can review triggers, avoidance and the action plan.
    help:
    - Anaphylaxis always needs emergency assessment. If symptoms have not improved after five minutes, the HSE advises giving a second
      injector if available. Tell emergency staff what was given and when.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/anaphylaxis/
  angina:
    aliases: angina stable angina unstable angina coronary chest pain GTN
    summary: Angina often feels like tightness or pressure during exertion. A changing pattern, symptoms at rest or pain that persists
      can signal a heart emergency.
    emergency: If new chest pressure is severe, occurs at rest or is accompanied by breathlessness, sweating or nausea, call
    evidence_gap: Irish studies often group angina with other coronary heart disease. That broader diagnosis cannot establish how
      many people have angina specifically.
    symptoms:
    - Pressure, heaviness or a squeezing feeling may spread to the arm, jaw, neck or back. Stable angina often follows a recognisable
      pattern, such as symptoms while walking uphill that ease with rest.
    causes:
    - The heart muscle needs more oxygen during activity. Narrowed coronary arteries may limit that extra supply. Other mechanisms
      can cause angina even when larger arteries do not look blocked.
    diagnosis:
    - A clinician asks what triggers symptoms and how long they last. An ECG and other tests can help assess the heart. Suspected
      acute coronary syndrome needs emergency assessment with tests such as ECGs and blood tests.
    care:
    - Treatment can include medicines for symptoms and reduction of future heart risks. Some people need a procedure to improve blood
      flow. If you have a prescribed angina plan, follow its instructions for use of a GTN spray and for emergency help.
    complications:
    - A change in symptoms can signal unstable angina or a heart attack. Tell your GP if the same activities start to trigger symptoms
      sooner, or if daily activities are limited.
    help:
    - Seek assessment for chest discomfort brought on by effort. For new, persistent or severe symptoms, or symptoms that differ
      from your usual pattern, get emergency advice promptly.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/angina/
  anxiety-children:
    aliases: anxiety in children child worry school refusal separation anxiety
    summary: Children can show anxiety through worry, tummy aches or avoiding school and activities. Seek advice when it is persistent
      or limiting everyday life.
    evidence_gap: Irish youth surveys often measure symptoms or distress. These results should be described by age group and questionnaire,
      and do not count clinical diagnoses across children of every age.
    symptoms:
    - A child may repeatedly seek reassurance, find separation difficult or avoid participation. Younger children may appear irritable,
      clingy or complain about headaches or tummy aches rather than describe worry.
    causes:
    - Changes, bullying, family stress and developmental factors can influence anxiety. It can also occur alongside learning or sensory
      difficulties. A supportive conversation can help identify what feels hard for the child.
    diagnosis:
    - A GP or other clinician asks how symptoms affect home, sleep, school and friendships, and checks for physical causes. Input
      from school and the child's own description can help.
    care:
    - Support can include predictable routines, small steps to manage feared situations and therapy adapted to age. Work with the
      school on a realistic plan if attendance or participation is affected.
    complications:
    - Long-lasting anxiety can affect learning, sleep and friendships. Sudden changes in behaviour, low mood or avoiding food can
      signal a need for a broader assessment.
    help:
    - Speak to your GP if anxiety is persistent or interfering with ordinary life. Ask the school who can support the child. Get
      urgent help if you are concerned about immediate safety.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/anxiety-children/
  anxiety-tips-and-self-help:
    aliases: anxiety stress nervous worry anxiety symptoms self help
    summary: Anxiety is common and can show up as worry, tension or physical symptoms. If it persists or starts to affect daily life,
      a GP can help you work out which support fits.
    symptoms:
    - Anxiety can cause racing thoughts, tension, poor sleep, a fast heartbeat or feeling short of breath. Some people avoid activities
      because they fear how they will feel.
    causes:
    - Anxiety involves the body's response to a perceived threat. Stress, illness, trauma, stimulants and other factors can influence
      it. New physical symptoms may have another cause that needs assessment.
    diagnosis:
    - A GP asks about symptoms, duration, effects on day-to-day life and medicines or substances. They may check for physical causes
      or for patterns such as panic attacks or persistent worry.
    care:
    - Talking with someone you trust and taking manageable steps back into usual activity can help. For persistent or disabling symptoms,
      a clinician can discuss talking therapy, medication or other support.
    complications:
    - Avoidance can temporarily relieve anxiety while making everyday tasks harder over time. Sleep, work and relationships can be
      affected. Help is available even if you are unsure what type of anxiety you have.
    help:
    - Contact your GP if anxiety persists, keeps you from doing usual activities or leads you to use alcohol or other substances
      to cope. Seek urgent help if you feel unable to keep yourself safe.
  aortic-dissection:
    aliases: aortic dissection aorta tear acute aortic syndrome chest back pain
    summary: Aortic dissection happens when blood enters a tear in the wall of the body's main artery. Sudden severe chest or back
      pain can be an emergency.
    emergency: For sudden severe chest or upper back pain, especially with faintness, weakness or trouble breathing, call
    evidence_gap: The HSE patient guidance describes aortic dissection but does not give an Irish national rate. Hospital series
      that mix dissection with aneurysm cannot identify the frequency of dissection on its own.
    symptoms:
    - Pain can begin abruptly and may move from the chest into the back or abdomen. Some people collapse or experience shortness
      of breath, sudden weakness or changes in speech.
    causes:
    - A tear in the inner layer lets blood separate layers of the aorta. High blood pressure and some inherited conditions can increase
      risk. The tear can reduce blood flow to nearby organs.
    diagnosis:
    - Emergency staff assess symptoms and circulation and usually use urgent imaging to locate the tear. A CT scan can show which
      part of the aorta is involved and guide the next step.
    care:
    - Treatment starts in hospital and can involve medicines to reduce strain on the aorta, surgery or a stent procedure. Tears affecting
      the section closest to the heart usually need urgent surgical assessment.
    complications:
    - Complications include internal bleeding, stroke and reduced blood flow to the kidneys or other organs. Survivors usually need
      regular imaging and careful blood-pressure management.
    help:
    - Sudden severe chest or back pain needs emergency assessment. Tell staff about any known aortic condition, family history or
      previous aortic operation.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/aortic-dissection/
  appendicitis:
    aliases: appendicitis appendix right lower abdominal pain appendicectomy
    summary: Appendicitis can cause worsening abdominal pain, often on the lower right. Seek urgent care, especially if movement
      makes the pain worse or you feel sick.
    symptoms:
    - Pain can start around the belly button and move to the lower right abdomen. Loss of appetite, nausea, vomiting or fever can
      occur. Children, older people and people who are pregnant can have less typical symptoms.
    causes:
    - The appendix becomes inflamed, sometimes because its opening is blocked. Pressure and infection can build, and an untreated
      appendix can perforate.
    diagnosis:
    - Clinicians assess the pain and examine your abdomen. Blood and urine tests can help identify other causes. Depending on your
      circumstances, an ultrasound, CT or observation may be needed.
    care:
    - Most people are treated with an operation to remove the appendix. Antibiotics are used around surgery and may be used as part
      of another treatment plan in selected cases.
    complications:
    - A burst appendix can cause an abscess or infection of the abdominal lining. After surgery, contact the treating team if pain
      increases, fever returns or a wound becomes red or starts to leak.
    help:
    - Seek urgent assessment if abdominal pain is getting worse, persistent or moving to the right lower abdomen. Go to an emergency
      department if the pain is severe or you are very unwell.
  babies-who-are-small-growing-slowly:
    aliases: small baby pregnancy growth restriction FGR SGA fetal growth ultrasound
    summary: Some babies are naturally small. If a baby's growth slows or measurements are well below the expected range, the maternity
      team may offer closer monitoring.
    evidence_gap: Low birth weight and fetal growth restriction measure different things. Irish birthweight statistics also count
      some babies who are small because they were born early.
    symptoms:
    - You may notice no change. A bump measuring small or an ultrasound suggesting the baby is smaller than expected can prompt review.
      Any change in the baby's usual movements needs immediate assessment.
    causes:
    - Some babies are small because of family characteristics. In fetal growth restriction, the baby may be growing more slowly than
      expected, sometimes because the placenta is not supplying enough oxygen or nutrients.
    diagnosis:
    - The maternity team considers timing of the pregnancy and tracks growth on scans. It may use Doppler ultrasound to check blood
      flow and assess the amount of fluid around the baby.
    care:
    - Management may involve repeat scans, monitoring movements and planning when and where to give birth. If blood flow or growth
      becomes concerning, an earlier birth may be considered.
    complications:
    - Growth restriction can increase the risk of complications before and after birth. A baby's size alone does not determine the
      plan. The trend, blood flow and stage of pregnancy also matter.
    help:
    - Keep appointments for growth checks. Contact the maternity service immediately if movements decrease or change, regardless
      of when your next scan is due.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/babies-who-are-small-growing-slowly/
  bcg-vaccine:
    kind: procedure
    aliases: BCG vaccine tuberculosis TB newborn selective immunisation Ireland
    summary: BCG helps protect young children from some severe forms of tuberculosis. In Ireland it is offered to babies who are
      assessed as having a higher risk of TB exposure.
    evidence_gap: The HSE describes who is eligible for selective BCG vaccination. A national uptake figure for this newer programme
      was not identified in the reports consulted.
    symptoms:
    - The maternity or public health team may ask about family contacts, countries where family members previously lived and future
      travel or residence. Eligibility is assessed individually.
    causes:
    - BCG is a live vaccine. It helps the immune system recognise the bacteria associated with tuberculosis and is intended to reduce
      the risk of severe illness in children.
    diagnosis:
    - Tell the clinic about illnesses, medicines that affect the immune system and any relevant screening tests. The team will review
      whether the baby can safely have a live vaccine.
    care:
    - A healthcare professional injects the vaccine into the skin of the upper arm. Ask where you will be seen and what to look out
      for in the days and weeks afterwards.
    complications:
    - A small bump or sore can develop where the injection was given and may leave a scar. Ask the clinic if the area becomes unusually
      large, swollen or persistently uncomfortable.
    help:
    - Ask your maternity service or public health nurse about screening for eligibility if you think your baby may be at increased
      risk. Contact a clinician promptly if TB exposure is suspected.
    sources:
      Clinical guidance and further reading: https://healthservice.hse.ie/staff/information-healthcare-workers/selective-bcg-vaccine-programme/
  blood-clots:
    aliases: blood clots venous thromboembolism VTE deep vein thrombosis pulmonary embolism
    summary: A clot in a deep vein can cause one-sided leg symptoms. If part travels to the lungs it can cause a pulmonary embolism,
      which needs emergency care.
    emergency: If sudden breathlessness or chest pain occurs, or the person coughs blood or collapses, call
    symptoms:
    - A deep vein clot may cause swelling, pain, warmth or a change in colour in one leg. A lung clot can cause sudden breathlessness,
      chest pain with breathing, coughing blood or collapse.
    causes:
    - This guide focuses on clots in veins. Risk rises after some operations, during periods of limited mobility and around pregnancy.
      Previous clots and some types of cancer can also increase risk.
    diagnosis:
    - Clinicians use the symptoms and risk factors to decide which tests are needed. A leg ultrasound can detect a deep vein clot.
      Suspected pulmonary embolism may need chest imaging.
    care:
    - Treatment usually includes an anticoagulant to prevent the clot growing while the body clears it. The choice and duration depend
      on why the clot occurred, bleeding risk and other health conditions.
    complications:
    - A lung clot can be life-threatening. Some people have swelling or discomfort long after a leg clot. Treatment can cause bleeding,
      so ask how to recognise important warning signs.
    help:
    - Arrange urgent same-day assessment for unexplained one-sided swelling or pain. For breathing difficulty, collapse or possible
      pulmonary embolism, seek emergency help immediately.
  blood-clots-pregnancy:
    aliases: blood clots pregnancy postpartum VTE pulmonary embolism deep vein thrombosis
    summary: Pregnancy and the weeks after birth raise the risk of a blood clot. Report a new swollen, painful leg or sudden breathing
      symptoms urgently.
    emergency: If you have sudden breathlessness, chest pain or collapse during pregnancy or after birth, call
    evidence_gap: The Irish national guideline sets out prevention and diagnosis but is not a count of how many pregnancies are affected.
      Figures from all adult hospital admissions include patients outside pregnancy.
    symptoms:
    - A clot in the leg or pelvis can cause pain, tenderness or swelling on one side. A clot in the lungs can cause sudden breathlessness,
      pain on breathing, coughing blood or feeling faint.
    causes:
    - Blood clots more easily during pregnancy. Reduced movement, a caesarean birth, previous clots and some medical conditions can
      raise risk further. Risk assessment can change after birth.
    diagnosis:
    - The maternity or emergency team assesses symptoms and may arrange an ultrasound or lung imaging. Tell staff how far along you
      are or how recently you gave birth.
    care:
    - Some people are offered preventive injections during pregnancy or after birth. If a clot is diagnosed, the team chooses a suitable
      anticoagulant and explains the plan for labour, recovery and breastfeeding.
    complications:
    - A clot in the lungs can be life-threatening. Finding and treating clots promptly helps reduce that risk. Ask when to restart
      or stop prescribed injections around birth and how to manage any bleeding.
    help:
    - Contact your maternity team urgently for possible leg clot symptoms. Sudden breathing difficulty, chest pain, coughing blood
      or collapse needs emergency help even after you have left maternity care.
    sources:
      Clinical guidance and further reading: https://www2.healthservice.hse.ie/organisation/national-pppgs/prevention-and-management-of-venous-thromboembolism-in-pregnancy/
  blood-transfusion:
    kind: procedure
    aliases: blood transfusion red cells platelets haemoglobin transfusion reaction
    summary: A transfusion replaces a part of blood that your body needs. Ask which component is planned, why it is needed and what
      symptoms to report during or afterwards.
    symptoms:
    - A clinician may recommend red cells after significant blood loss or for some cases of severe anaemia. Platelets and other blood
      components have different uses, including treatment of some bleeding problems.
    causes:
    - Blood components are given through a small tube in a vein. The team checks your identity, blood group and the compatibility
      of the planned product before giving it.
    diagnosis:
    - Tell the team if you have had a reaction to blood products before or have concerns about transfusion. If there is time, ask
      whether an alternative is appropriate and how you will be monitored.
    care:
    - Your blood pressure, pulse and temperature are checked. Tell staff immediately if you feel shivery, hot, breathless or develop
      pain, itching or a rash during the transfusion.
    complications:
    - Some reactions occur after leaving the unit. Contact the treating team if you develop fever, a rash, dark urine or other unusual
      symptoms after a transfusion. Severe breathing problems or collapse need emergency help.
    help:
    - Ask whether you need a further blood test and whom to contact out of hours. Tell future treating teams about any suspected
      reaction.
  bowel-screening:
    kind: test
    aliases: bowelscreen FIT bowel cancer stool home screening kit
    summary: BowelScreen offers a home stool test for eligible people in Ireland. The result tells you whether further checks are
      needed for blood in the sample.
    symptoms:
    - Screening is for eligible people who feel well. Check the current age range and your registration with BowelScreen. Tell your
      GP about symptoms even if you are eligible for screening.
    causes:
    - The faecal immunochemical test or FIT detects small amounts of blood in a stool sample. Several conditions can cause bleeding,
      so a result above the threshold needs investigation.
    diagnosis:
    - Check the instructions and expiry date on the kit. It explains how to collect the sample so it does not touch toilet water
      and how to return it.
    care:
    - You collect a small sample at home, seal it in the tube and post it according to the kit instructions. The programme will contact
      you about the result and arrange next steps where needed.
    complications:
    - A test above the threshold usually leads to an assessment for colonoscopy. A result below the threshold cannot rule out bowel
      cancer or other causes of symptoms.
    help:
    - Contact your GP if you notice bleeding, a persistent change in bowel habits or unexplained weight loss. Contact BowelScreen
      if you are eligible and have not received an invitation or expected result.
    sources:
      Clinical guidance and further reading: https://www2.healthservice.hse.ie/organisation/nss/activity-and-performance-data/
  braxton-hicks:
    aliases: Braxton Hicks practice contractions false labour tightenings pregnancy
    summary: Braxton Hicks are intermittent tightenings of the womb. Regular, stronger or painful contractions, especially before
      37 weeks, need advice from your maternity unit.
    evidence_gap: There is no usable national denominator for brief, self-reported Braxton Hicks tightenings in the maternity data
      consulted. Birth counts do not measure this symptom.
    symptoms:
    - The abdomen may tighten and then soften. Braxton Hicks often have no regular pattern. Labour contractions tend to become stronger,
      closer together and more sustained.
    causes:
    - The womb muscles tighten briefly during pregnancy. The pattern alone cannot always distinguish early labour from practice tightenings,
      especially when pregnancy is preterm.
    diagnosis:
    - If you contact maternity triage, staff will ask how far along you are, how often the contractions come, whether they hurt and
      whether you have bleeding, fluid loss or changes in movement.
    care:
    - If the maternity team is satisfied they are practice tightenings, changing position, resting or drinking water can help you
      feel more comfortable. Follow instructions if they ask you to track the timing.
    complications:
    - Practice tightenings do not themselves indicate birth is imminent. A change in pattern alongside pelvic pressure, backache
      or fluid loss could need assessment for labour or another cause.
    help:
    - Contact the maternity unit for regular painful contractions, bleeding, possible broken waters or a change in movements. Get
      advice urgently if you may be in labour before 37 weeks.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/braxton-hicks/
  breast-screening:
    kind: test
    aliases: BreastCheck mammogram breast screening Irish national screening
    summary: BreastCheck offers mammograms to eligible people in Ireland. A recall means more information is needed and may lead
      to extra images, ultrasound or a biopsy.
    symptoms:
    - Screening aims to find breast cancer before it can be felt or causes other symptoms. Check eligibility and registration with
      BreastCheck. Arrange an examination with your GP if you notice a change in your breast.
    causes:
    - A mammogram uses low-dose X-rays to look for changes in breast tissue. Screening can find early cancers and can also find changes
      that turn out to be benign.
    diagnosis:
    - Tell the team if you have breast implants, mobility needs or a previous breast operation. Ask about adjustments if previous
      mammograms were painful or difficult.
    care:
    - A radiographer positions each breast and briefly compresses it to take clear images. Let them know if you need to pause. The
      appointment usually involves several images and the results are sent after review.
    complications:
    - Further tests after a recall can include more mammograms, ultrasound and a small tissue sample. Some cancers are missed by
      screening, and screening can also find slow-growing changes that might never have caused harm.
    help:
    - See your GP about a new lump, nipple change or any persistent unexplained breast change. Contact BreastCheck if you need to
      confirm an invitation, rearrange your appointment or follow up on a result.
    sources:
      Clinical guidance and further reading: https://www2.healthservice.hse.ie/organisation/nss/activity-and-performance-data/
  breech-presentation:
    aliases: breech baby breech presentation external cephalic version ECV
    summary: A breech baby is positioned feet or bottom first. If the baby remains breech near the end of pregnancy, your maternity
      team will discuss whether to try turning the baby and how to plan the birth.
    evidence_gap: Hospital statistics for breech vaginal births count a specific mode of delivery. They exclude breech babies delivered
      by caesarean and babies who turned before birth.
    symptoms:
    - Breech position usually causes no symptoms. The maternity team may suspect it when examining your abdomen. How kicks feel by
      itself cannot confirm the baby's position.
    causes:
    - Babies can change position during pregnancy. Some remain breech close to the birth. Breech position may be more likely with
      a multiple pregnancy or certain placental or uterine conditions.
    diagnosis:
    - An ultrasound confirms the position and helps the team decide whether external cephalic version, a procedure to try turning
      the baby from outside, is suitable.
    care:
    - The team can explain the chance of turning the baby and what birth options are appropriate. Possible plans include a caesarean
      or a vaginal breech birth in carefully selected circumstances with the right staff and facilities.
    complications:
    - A breech birth needs a plan because there can be increased risks, such as the cord slipping down if the waters break. After
      a turning attempt, the team may monitor the baby's heartbeat.
    help:
    - If your waters break or labour starts before your agreed plan, contact the maternity unit promptly and tell them the baby is
      breech. Report reduced movements or vaginal bleeding immediately.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/breech-presentation/
  bronchiolitis:
    aliases: bronchiolitis baby RSV infant wheeze breathing feeding
    summary: Bronchiolitis affects the small airways of babies and young children. Watch how hard your baby is working to breathe
      and how much they are drinking.
    emergency: If a baby stops breathing, has blue or grey lips or is very difficult to wake, call
    symptoms:
    - It often begins with a blocked nose or cough, followed by faster or noisier breathing and difficulty feeding. The illness can
      worsen over the first few days. Young babies may have pauses in breathing.
    causes:
    - A virus makes the smallest breathing tubes inflamed and clogged with mucus. RSV is one common cause, but several other viruses
      can cause the same illness.
    diagnosis:
    - A clinician checks breathing effort, feeding, hydration and sometimes oxygen level. A typical mild case can often be assessed
      without a chest X-ray or blood test.
    care:
    - Offer smaller, more frequent feeds if the baby can manage them. Hospital care may provide oxygen or fluids if needed. Medicines
      used for asthma or bacterial infection are not routinely helpful for bronchiolitis.
    complications:
    - Poor feeding can cause dehydration, and breathing can become tiring. Very young babies, premature babies and those with some
      heart or lung conditions are at greater risk.
    help:
    - Get urgent advice if breathing becomes faster or harder, feeds fall markedly or nappies are much drier than usual. Get emergency
      help for breathing pauses, a change in colour or severe breathing difficulty.
  c-auris:
    aliases: Candida auris C auris Candidozyma auris fungal colonisation infection
    summary: Candida auris is a fungus that can be carried without symptoms or cause serious infection, mainly in healthcare settings.
      A positive screen and a bloodstream infection have different implications.
    symptoms:
    - Healthy carriers can have no symptoms. In a very ill patient, fever or deterioration can prompt testing for several causes.
      Symptoms alone cannot distinguish Candida auris from other infections.
    causes:
    - The fungus can be carried on skin and spread in healthcare environments. It may resist some antifungal medicines. Patients
      who have invasive devices or need complex hospital care may be more vulnerable to infection.
    diagnosis:
    - A laboratory identifies the fungus in samples taken to screen for carriage or investigate infection. Tell staff if you have
      a previous positive result or were cared for in a hospital where there was an outbreak.
    care:
    - Carriage alone is generally managed with appropriate infection-control precautions. If it causes an infection, a hospital team
      chooses treatment using the site of infection and laboratory results.
    complications:
    - Invasive disease can cause severe illness, including bloodstream infection. A positive screening result can also affect precautions
      at later hospital visits.
    help:
    - If you are told you carry Candida auris, ask what precautions apply to you and inform future healthcare teams. Seek immediate
      medical assessment if a vulnerable patient becomes severely unwell.
    sources:
      Clinical guidance and further reading: https://hpsc.ie/a-z/microbiologyantimicrobialresistance/infectioncontrolandhai/candidaauris
  carbon-monoxide-poisoning:
    aliases: carbon monoxide poisoning CO alarm headache fumes boiler
    summary: Carbon monoxide cannot be seen or smelled. A headache or dizziness affecting more than one person indoors, or a carbon
      monoxide alarm, should prompt immediate action.
    emergency: If you suspect carbon monoxide poisoning, leave the building if you can do so safely and call
    evidence_gap: Poison-centre enquiries or hospital cases do not cover every domestic exposure or alarm. A verified Irish rate
      covering all poisonings was not identified.
    symptoms:
    - Symptoms can include headache, nausea, dizziness, weakness and confusion. Severe exposure can cause chest pain, collapse or
      seizures. Symptoms can improve outdoors and return in the building.
    causes:
    - Carbon monoxide from incomplete burning can prevent the blood from carrying oxygen effectively. Faulty or poorly ventilated
      fuel-burning appliances and use of engines or generators in enclosed spaces can cause dangerous exposure.
    diagnosis:
    - Emergency clinicians ask about exposure and other people affected. They can use a blood test to measure carbon monoxide exposure.
      A normal reading on an ordinary fingertip oxygen monitor does not rule it out.
    care:
    - Get everyone to fresh air if it is safe. Get medical advice immediately and follow emergency instructions. Hospital treatment
      may involve oxygen and monitoring.
    complications:
    - Serious exposure can harm the brain and heart. Pregnant people and those with heart or lung disease may need particular attention.
      Have the source investigated before returning or using an affected appliance.
    help:
    - Leave if you suspect exposure or an alarm sounds. Seek emergency help for symptoms and do not re-enter until it has been declared
      safe. Tell responders about others or pets still inside.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/carbon-monoxide-poisoning/
  cellulitis:
    aliases: cellulitis skin infection hot swollen spreading redness
    summary: Cellulitis is an infection of deeper skin and tissue. A painful area that is hot, swollen or spreading needs prompt
      medical assessment.
    evidence_gap: A national antimicrobial survey combines skin and soft-tissue infections. It cannot tell how many participants
      had cellulitis specifically or describe community prevalence.
    symptoms:
    - The affected area may feel tender, warm and swollen. Redness can be harder to see on darker skin. Some people feel feverish
      or shivery, or notice swollen glands nearby.
    causes:
    - Bacteria can enter through small breaks in the skin, including cracks from eczema or athlete's foot, wounds or ulcers. The
      point of entry is not always visible.
    diagnosis:
    - A clinician usually examines the area and checks how quickly it has changed and how unwell you feel. A clot or other skin problem
      can look similar, so the whole clinical picture matters.
    care:
    - Treatment usually involves antibiotics. A clinician can advise how to track the area and when it should begin to improve. More
      serious infection can require treatment through a vein.
    complications:
    - The infection may spread or enter the bloodstream. A person who becomes much more unwell, develops increasing pain or sees
      rapid spread needs urgent reassessment.
    help:
    - Contact your GP urgently for a hot, painful, swollen patch, particularly if it is spreading or near an eye. Get emergency help
      for severe illness, confusion, collapse or trouble breathing.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/cellulitis/
  cervical-screening:
    kind: test
    aliases: CervicalCheck cervical screening HPV smear test Ireland
    summary: CervicalCheck looks for high-risk HPV, which can cause changes in cervical cells over time. The programme explains what
      your result means and when a repeat test or colposcopy is needed.
    symptoms:
    - Routine screening is offered to eligible people with a cervix, usually between ages 25 and 65. It is designed for people without
      symptoms. Ask your GP about bleeding between periods, after sex or after menopause.
    causes:
    - The laboratory tests the sample for high-risk HPV. If found, the laboratory checks the cells for changes. Having HPV does not
      by itself mean you have cancer.
    diagnosis:
    - You can check your place on the register and book with a registered GP or clinic. Tell the sample taker about relevant previous
      treatment or concerns about pain, anxiety or accessibility.
    care:
    - The sample taker uses a speculum to see the cervix and a soft brush to collect cells. You can ask them to explain each step
      and pause or stop at any point.
    complications:
    - Follow-up depends on what was found. Some people are asked to repeat screening while others are referred for colposcopy. Screening
      can miss some conditions and does not investigate all causes of bleeding.
    help:
    - Check the result and the requested follow-up date. See your GP promptly if symptoms develop, even with a recent normal screen
      or while waiting for a screening appointment.
    sources:
      Clinical guidance and further reading: https://www2.healthservice.hse.ie/organisation/nss/activity-and-performance-data/
  chest-pain:
    aliases: chest pain chest tightness chest pressure heart attack pain breathing
    summary: Chest pain has many causes. New pressure, tightness or severe discomfort with sweating, nausea, breathlessness or pain
      spreading to the arm or jaw needs emergency help.
    emergency: If chest pain is sudden, severe, lasts several minutes or comes with breathlessness, sweating or faintness, call
    evidence_gap: Chest pain is a symptom with many causes. Irish heart attack or hospital attendance figures measure selected outcomes
      and cannot quantify all episodes.
    symptoms:
    - Describe when discomfort started, where it spreads and whether it is brought on by activity, breathing or movement. Heart symptoms
      can include unusual breathlessness or nausea even when pain is mild.
    causes:
    - Chest muscles, the food pipe, heart and lungs can all cause pain. Some causes are serious, including a heart attack, a lung
      clot or a problem with the aorta.
    diagnosis:
    - Emergency clinicians may check the heart tracing, blood tests and oxygen level, with imaging where indicated. A single normal
      test may need to be repeated depending on symptoms and timing.
    care:
    - Treatment depends on the cause. For possible heart or lung emergencies, call for an ambulance instead of driving yourself.
      Follow the emergency operator's instructions.
    complications:
    - A delay can matter in emergencies even if pain eases. Recurrent pain with exertion, a new pattern or other symptoms deserves
      assessment.
    help:
    - For important warning signs seek emergency help. If pain is less acute but persists or keeps coming back, arrange a GP assessment
      rather than assuming it is indigestion or a muscle problem.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/chest-pain/
  colds-coughs-children:
    aliases: cold and cough children baby viral infection congestion child cough
    summary: Most childhood colds improve with time. Breathing, feeding and alertness are more useful to watch than how noisy the
      cough sounds.
    evidence_gap: Most childhood colds are untested. Irish surveillance for individual respiratory viruses counts a different group
      from all childhood colds and coughs.
    symptoms:
    - Children may have a runny nose, cough, sore throat or fever and eat less for a short time. Babies with a blocked nose may struggle
      to feed comfortably.
    causes:
    - Many viruses can inflame the nose and throat. Cough can continue after other symptoms ease. A different assessment is needed
      if fast or difficult breathing develops.
    diagnosis:
    - Clinicians ask how long symptoms have lasted and examine breathing, hydration and alertness if needed. They may consider causes
      such as croup, pneumonia or bronchiolitis in particular age groups.
    care:
    - Offer drinks or usual feeds often. Ask a pharmacist which treatment is suitable for the child's age, since many cough and cold
      products are unsuitable for young children.
    complications:
    - Dehydration or breathing trouble can develop, especially in babies or children with other conditions. Returning fever or a
      clear decline after initial improvement deserves review.
    help:
    - Seek prompt advice if breathing becomes harder, drinking falls significantly, a baby has fever or a child becomes less alert.
      Call for emergency help for severe breathing difficulty.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/colds-coughs-children/
  colic:
    aliases: colic babies prolonged crying infant crying evening wind
    summary: Colic is a pattern of prolonged crying in a baby who is otherwise well. It can be exhausting for parents and usually
      improves as the baby gets older.
    evidence_gap: National recording would miss many episodes managed at home. Surveys also vary in how they define colic, so no
      comparable Irish population rate was identified.
    symptoms:
    - Crying may cluster in the evening and be difficult to settle. The baby may clench their fists or draw up their legs. A weak
      cry or a sudden change from the usual pattern needs assessment.
    causes:
    - The exact cause is unclear. Babies also cry because of hunger, discomfort, tiredness or illness. A repeated pattern in a thriving
      baby is different from new signs that the baby is unwell.
    diagnosis:
    - A GP or public health nurse can check feeding, growth, physical symptoms and the crying pattern. Tell them about vomiting,
      temperature, nappies and changes in feeding.
    care:
    - Try a calm routine and usual feeds and accept help from a trusted adult. If overwhelmed, place the baby safely on their back
      in their cot while you take a brief break. Never shake a baby.
    complications:
    - Crying can affect the whole household and make it hard to rest. If the baby has feeding difficulties, poor weight gain or other
      symptoms, ask for further assessment.
    help:
    - Speak to your GP or public health nurse if crying is hard to manage or changes. Seek urgent advice if there is fever in a young
      baby, poor feeding, repeated vomiting or unusual sleepiness.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/colic/
  colposcopy:
    kind: test
    aliases: colposcopy abnormal cervical screening HPV cervix biopsy LLETZ
    summary: Colposcopy is a closer examination of the cervix. It can help determine whether cell changes need monitoring, sampling
      or treatment.
    symptoms:
    - You may be referred after a cervical screening result or because a clinician wants to investigate an abnormality. A referral
      does not automatically mean that cancer was found.
    causes:
    - A microscope outside the body magnifies the cervix. Liquids applied to the surface make areas of change easier to see. A small
      tissue biopsy gives the laboratory more information if needed.
    diagnosis:
    - Read your appointment instructions and tell the clinic if you are pregnant, taking medicines that affect bleeding, or have
      concerns about the examination. Ask whether you can bring someone for support.
    care:
    - A clinician inserts a speculum to see the cervix. You may feel a brief pinch if a sample is taken. Some clinics can offer treatment
      at the same visit when appropriate and after discussing consent.
    complications:
    - Light bleeding or discharge can follow a biopsy or treatment. The clinic will give instructions for recovery. Severe pain,
      heavy bleeding, fever or unpleasant-smelling discharge need medical advice.
    help:
    - Ask how the clinic provides results and how long they usually take. If you have not heard by then, follow up with the clinic.
      Attend any return appointment after treatment or biopsy.
  congenital-hypothyroidism-cht:
    aliases: congenital hypothyroidism CHT newborn thyroid heel prick TSH
    summary: Congenital hypothyroidism means a baby is born with too little thyroid hormone. Screening helps find babies early, when
      treatment can protect growth and development.
    symptoms:
    - Many babies show no obvious signs at birth. Some develop prolonged jaundice, unusual sleepiness, feeding difficulties or constipation.
      The screening result can be the first sign.
    causes:
    - The thyroid gland may be absent, be in an unusual place or be unable to make enough hormone. Thyroid hormone is important for
      brain development and growth.
    diagnosis:
    - A high-risk heel-prick result is followed by blood tests to measure thyroid hormone and thyroid-stimulating hormone. The team
      may investigate why the gland is underactive without delaying needed treatment.
    care:
    - A specialist prescribes replacement thyroid hormone and arranges repeat blood tests as the baby grows. Ask how to give the
      medicine consistently and what to do if a dose is missed or vomited.
    complications:
    - Delayed treatment can affect development. Some babies need lifelong medicine and others may be reassessed later. Continue treatment
      and follow-up until the specialist advises a change.
    help:
    - Follow the screening team's appointment instructions promptly. If there is a problem giving the medicine, contact the prescriber
      before changing the dose or stopping it.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/heel-prick-screening/conditions/congenital-hypothyroidism/
  cot-death:
    aliases: cot death SIDS sudden infant death syndrome safer sleep
    summary: Cot death, or sudden infant death syndrome, is the unexplained death of a baby after investigation. A safer sleep environment
      lowers the risk.
    emergency: If a baby is unresponsive or not breathing normally, call
    symptoms:
    - There is no reliable symptom that predicts SIDS. Call emergency services if a baby is unresponsive or is not breathing normally
      and follow the operator's instructions.
    causes:
    - The exact cause is unknown. Risk can vary with the baby's stage of development and sleep environment. Exposure to tobacco smoke
      and unsafe sleep surfaces are important avoidable risks.
    diagnosis:
    - When a baby dies unexpectedly, specialists investigate possible causes. The term SIDS is used when the death remains unexplained
      after assessment. This investigation is different from medical care when a baby is found unresponsive.
    care:
    - Put your baby on their back for every sleep, on a flat firm surface in their own clear cot in your room. Keep pillows, loose
      bedding and soft objects away, and avoid falling asleep with a baby on a sofa or chair.
    complications:
    - Unexpected infant death can be devastating. Maternity, bereavement and GP services can support families and explain the next
      steps of an investigation.
    help:
    - Ask your midwife or public health nurse about preparing a safe place to sleep and managing night feeds. In an emergency call
      for help immediately.
    sources:
      Clinical guidance and further reading: https://www.hse.ie/conditions/cot-death/
  cpe:
    aliases: CPE carbapenemase producing enterobacterales resistant bacteria colonisation
    summary: CPE are bacteria that can be resistant to important antibiotics. Many people who test positive carry them without illness.
      The result helps healthcare teams choose precautions and treatment.
    symptoms:
    - Carrying CPE usually causes no symptoms. If it causes infection, symptoms depend on where it occurs, for example painful urination
      with a urinary infection or fever with a bloodstream infection.
    causes:
    - CPE make enzymes that can break down certain antibiotics. The bacteria can live in the gut without causing illness and can
      spread between people, particularly in healthcare settings.
    diagnosis:
    - A rectal screening sample can check for carriage. If someone is ill, clinicians use samples from the suspected site of infection.
      The lab can determine which medicines are likely to work.
    care:
    - Carriage does not usually need antibiotics. Hospitals may use precautions to prevent spread. A confirmed infection is treated
      according to the site, severity and lab findings.
    complications:
    - Some infections are difficult to treat because of resistance. Carriage can last for a long time, and a previous result remains
      useful when you are admitted to hospital.
    help:
    - Tell healthcare staff about a past CPE result. Ask how to reduce spread and whether precautions apply at home. Seek prompt
      assessment for new signs of infection.
    sources:
      Clinical guidance and further reading: https://www.hpsc.ie/a-z/microbiologyantimicrobialresistance/carbapenemresistantenterobacteriaceaecre/surveillanceofcpeinireland/cpeannualreports/
  crohns-disease:
    aliases: Crohn's disease inflammatory bowel disease IBD terminal ileitis fistula
    summary: Crohn’s disease causes long-term inflammation of the digestive tract. If diarrhoea, abdominal pain or unexplained weight
      loss persist, ask your GP about assessment.
    symptoms:
    - Symptoms include persistent diarrhoea, abdominal pain, weight loss and fatigue. Some people notice blood or mucus in stools,
      mouth ulcers or painful swelling near the anus. Children may grow more slowly.
    causes:
    - An abnormal immune response contributes to inflammation that can affect different areas of the digestive tract. Inflammation
      can extend deeper into the bowel wall, which helps explain fistulas and narrowing.
    diagnosis:
    - A GP can arrange blood or stool tests and refer to a digestive specialist. Assessment may include colonoscopy with tissue samples
      and imaging to look at parts of the bowel the scope cannot reach.
    care:
    - Treatment aims to control active inflammation and maintain remission. A specialist may prescribe medicines, recommend nutrition
      support or discuss surgery for a complication. Ask for a written plan for a flare.
    complications:
    - Persistent inflammation can contribute to anaemia or nutritional problems. Narrowing can block the bowel, and abnormal channels
      can form between it and another area. Surgery treats specific problems, and follow-up continues afterwards.
    help:
    - Contact your GP for ongoing diarrhoea, blood in stools or weight loss. Seek urgent care if you have severe pain, repeated vomiting,
      abdominal swelling or cannot pass stool or wind.
    sources:
      Clinical guidance and further reading: https://crohnscolitis.ie/support/faq/category/ibd-facts-figures/
  croup:
    aliases: croup barking cough stridor child baby hoarse breathing
    summary: Croup often causes a barking cough and a harsh sound when breathing in. A child who makes this sound while resting or
      is working hard to breathe needs urgent assessment.
    emergency: If a child is struggling to breathe, has blue or grey lips or becomes unusually difficult to wake, call
    evidence_gap: The HSE patient guidance describes care for croup but gives no national case count. RSV notifications cannot represent
      croup, which has several possible viral causes.
    symptoms:
    - Croup may start like a cold, then cause a hoarse voice and barking cough. Symptoms can be worse at night. The noise on breathing
      in is called stridor.
    causes:
    - Viruses can inflame the voice box and nearby airway. Small children have narrower airways, so swelling can be enough to make
      breathing noisy or difficult.
    diagnosis:
    - A clinician assesses the sound, effort of breathing and whether the child can swallow and drink. Other causes of noisy breathing
      can need different and more urgent treatment.
    care:
    - Keep the child calm and upright if that is comfortable. A doctor can give a steroid to reduce swelling. A child with severe
      symptoms may need urgent treatment and observation in hospital.
    complications:
    - Most cases improve over a few days. Drooling, trouble swallowing, worsening stridor or exhaustion could signal serious airway
      trouble and should be assessed urgently.
    help:
    - Contact a GP or out-of-hours service if you think your child has croup. Get urgent help for noisy breathing at rest or increased
      effort to breathe. Call emergency services for severe breathing difficulty.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/croup/
  cystitis:
    aliases: cystitis bladder infection UTI burning urine frequency
    summary: Cystitis is inflammation of the bladder, commonly from a urinary infection. Burning and frequent urination are common.
      Fever or pain in the side changes the urgency.
    evidence_gap: Community episodes are not routinely captured in a single national register. Hospital UTI data also include upper
      urinary tract infections and cannot measure cystitis alone.
    symptoms:
    - You may have a strong urge to urinate, pass small amounts more often or feel discomfort low in the abdomen. Cloudy urine alone
      cannot confirm infection. Some people see blood in the urine.
    causes:
    - Bacteria entering the bladder are a common cause. Long-standing bladder pain or irritation can occur for other reasons. Persistent
      symptoms with repeated negative cultures deserve a different assessment.
    diagnosis:
    - A clinician may diagnose an uncomplicated infection from the symptom pattern. A urine sample can be useful if symptoms are
      atypical, recur or occur during pregnancy or another higher-risk situation.
    care:
    - A GP or participating pharmacist can advise on the appropriate route for uncomplicated symptoms. An antibiotic may be recommended
      after assessment. Follow their instructions on reviewing symptoms that do not improve.
    complications:
    - Infection can travel upwards and affect a kidney. Recurring infections may need a review of contributing factors, treatments
      used before and prevention options.
    help:
    - Seek prompt help for fever, vomiting, pain in the back or side, blood in urine, or a suspected infection during pregnancy.
      Report symptoms that recur soon after treatment.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/cystitis/
  cystoscopy:
    kind: procedure
    aliases: cystoscopy bladder camera flexible cystoscopy rigid cystoscopy
    summary: A cystoscopy lets a specialist look inside the bladder. Ask whether your appointment is for a flexible examination or
      a procedure that will use anaesthesia.
    evidence_gap: Irish waiting-list figures count people awaiting care, and do not show how many diagnostic or treatment cystoscopies
      were performed. A comparable national activity count was not identified.
    symptoms:
    - A clinician may recommend it to investigate blood in the urine, some recurring urinary symptoms, or a suspected bladder abnormality.
      It can also form part of follow-up after bladder treatment.
    causes:
    - A small camera passes through the urethra into the bladder. A flexible scope is often used to inspect the bladder. A rigid
      procedure can allow samples or treatment when required.
    diagnosis:
    - Check the appointment letter for fasting and transport instructions. Tell the team if you have symptoms of a urine infection
      or take medicines that affect clotting. Ask before making any medication change.
    care:
    - The team uses an appropriate anaesthetic, depending on the type. Fluid fills the bladder so the lining can be seen. You may
      feel an urge to pass urine during a flexible examination.
    complications:
    - Mild stinging or some blood in the urine may occur briefly afterwards. Seek advice for fever, severe pain, heavy bleeding or
      difficulty passing urine.
    help:
    - Ask who will explain the findings and when a biopsy result, if any, will be available. Follow the specific driving and recovery
      advice if you had sedation or anaesthesia.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/cystoscopy/
  deep-vein-thrombosis:
    aliases: deep vein thrombosis DVT leg clot calf swelling thrombosis
    summary: Deep vein thrombosis is a clot inside a deep vein, often in the leg. New one-sided swelling and pain need urgent assessment.
    emergency: If suspected deep vein thrombosis is accompanied by breathlessness, chest pain or collapse, call
    evidence_gap: The Irish national VTE study includes deep vein thrombosis, but the overall VTE rate also includes lung clots.
      A directly comparable standalone DVT figure was not obtained for this guide.
    symptoms:
    - A dull ache, tenderness, warmth or swelling may affect one calf or thigh. Skin may change colour. Some clots cause few local
      symptoms, so the pattern and risk factors are important.
    causes:
    - Limited movement, a recent operation or injury, pregnancy and some medicines or illnesses can favour clotting. A DVT can also
      arise without an obvious trigger.
    diagnosis:
    - A GP or emergency team assesses how likely a clot is. An ultrasound checks for a clot. A blood test can help rule one out in
      some circumstances, but an abnormal result has other possible causes.
    care:
    - Anticoagulant treatment helps prevent extension or another clot. Ask what to do if you miss a dose and when you will be reviewed.
      Tell other clinicians and pharmacists that you take an anticoagulant.
    complications:
    - A clot can travel to the lungs. Long-term leg swelling and discomfort can occur after damage to the vein. A clinician can assess
      persistent symptoms and recommend measures suited to you.
    help:
    - Seek urgent assessment for a new swollen or painful leg, especially after surgery, travel or immobility. Emergency help is
      needed if you also have unexplained breathlessness, chest pain or collapse.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/deep-vein-thrombosis/
  diabetic-retina-screening:
    kind: test
    aliases: Diabetic RetinaScreen diabetic eye screening retinal photography Ireland
    summary: Diabetic RetinaScreen takes pictures of the back of the eyes to look for damage from diabetes. Changes can appear before
      you notice any problem with vision.
    symptoms:
    - People with diagnosed type 1 or type 2 diabetes can ask their GP or diabetes service about registration. Tell the team if you
      are pregnant, since pre-existing diabetes can need more frequent monitoring during pregnancy.
    causes:
    - Photographs show the retina and its small blood vessels. Graders check for signs of diabetes-related damage and decide whether
      you need early follow-up or a referral.
    diagnosis:
    - If drops will be used to widen your pupils, arrange transport home as vision may be blurred. Bring your glasses and tell the
      team about problems you have had with eye drops before.
    care:
    - The clinic may check your vision before taking images of each eye. You will see a bright flash. Some people need a different
      type of assessment if the photos cannot be graded clearly.
    complications:
    - Blurred vision and sensitivity to light can last several hours after dilating drops. An abnormal screening result can lead
      to another appointment or referral to an eye clinic.
    help:
    - Attend follow-up as advised and contact the service if you are unsure about your result or next date. Sudden visual changes
      need prompt assessment and should not wait for screening.
    sources:
      Clinical guidance and further reading: https://www2.healthservice.hse.ie/organisation/nss/activity-and-performance-data/
  diabetic-retinopathy:
    aliases: diabetic retinopathy diabetic eye disease macular oedema retinal blood vessels
    summary: Diabetic retinopathy can damage the retina before vision changes. Regular diabetic eye screening can identify people
      who need closer monitoring or treatment.
    evidence_gap: National programme counts describe screening activity. They do not tell how many people with diabetes have retinopathy,
      since attendance, severity and the number of examinations differ.
    symptoms:
    - Early changes usually cause no symptoms. Later signs can include blurred vision, new shapes floating in vision or a sudden
      loss of sight. Other eye problems can cause similar changes.
    causes:
    - High blood sugar over time can damage the retina's small blood vessels. They may leak or close off, and new fragile vessels
      can grow in more advanced disease.
    diagnosis:
    - Retinal photography can find changes during screening. An eye specialist can use a detailed examination and imaging to check
      the retina and whether there is fluid near the centre of vision.
    care:
    - Control of blood sugar and blood pressure helps lower risk. Specialist treatment may include injections, laser or surgery,
      depending on where and how severely the retina is affected.
    complications:
    - Untreated advanced disease can affect vision permanently. The pattern of follow-up depends on the findings. Pregnancy can require
      more frequent checks for people with pre-existing diabetes.
    help:
    - Attend scheduled eye screening and tell the service if your contact details change. Seek urgent assessment for sudden loss
      of vision, a curtain across vision or a sudden increase in floaters.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/diabetic-retinopathy/
  diarrhoea-babies-children:
    aliases: child diarrhoea baby loose poo dehydration wet nappies gastroenteritis
    summary: Diarrhoea can dehydrate babies and young children more quickly than adults. Pay attention to drinking, wet nappies and
      how alert the child is.
    evidence_gap: National surveillance counts certain infections and some hospitalised cases. It does not include the many episodes
      of diarrhoea in children managed at home.
    symptoms:
    - The number or consistency of stools changes noticeably from what is usual for the child. Fever, vomiting or tummy pain can
      occur. A baby may feed less or be unusually quiet.
    causes:
    - Viruses often cause acute diarrhoea. Other infections, medicines or longer-term conditions can also be responsible. Loose stools
      alone can be normal in some breastfed babies.
    diagnosis:
    - A clinician asks about stool frequency, blood, fever and how much the child is drinking and urinating. In persistent or more
      serious cases, the clinician may arrange tests.
    care:
    - Continue usual breastfeeds or formula if tolerated. Offer small amounts often and ask a pharmacist or GP about oral rehydration
      solution suitable for the child's age. Do not use adult diarrhoea remedies without advice.
    complications:
    - Drowsiness, dry mouth, few wet nappies or no tears can be signs of dehydration. A sick young baby can deteriorate rapidly.
    help:
    - Seek medical advice promptly for a young baby, blood in the stool, a child who cannot drink, or signs of dehydration. Seek
      emergency help if they are difficult to wake or severely unwell.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/diarrhoea-babies-children/
  diarrhoea-vomiting:
    aliases: diarrhoea and vomiting stomach bug gastroenteritis oral rehydration
    summary: Many short episodes of diarrhoea and vomiting improve at home. Seek medical advice if symptoms are severe, bloody or
      keep you from drinking enough.
    evidence_gap: Irish notifications cover specific pathogens such as norovirus. Many episodes are never tested, so those reports
      cannot establish how often diarrhoea and vomiting occur overall.
    symptoms:
    - Loose stools, vomiting, nausea and cramping can occur together or separately. Dark urine, dizziness and passing less urine
      can signal dehydration.
    causes:
    - Short episodes are often due to infection. Food, medicines and other bowel conditions can cause similar symptoms. The pattern
      and duration help decide whether it is likely to be a simple stomach bug.
    diagnosis:
    - A clinician may assess hydration, travel, contact with other people who are unwell and any recent antibiotics. Persistent or
      bloody symptoms may need stool or blood tests.
    care:
    - Take frequent small drinks and consider oral rehydration solution. Wash hands with soap and water and follow the HSE's advice
      about staying away from work or school while infectious.
    complications:
    - Dehydration can become serious, particularly in older adults or people with some long-term conditions. Blood in stool or increasing
      pain warrants review.
    help:
    - Get urgent advice if you cannot keep fluids down, have bloody diarrhoea, pass much less urine or have severe pain. Call emergency
      services for collapse or marked confusion.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/diarrhoea-vomiting/
  diverticular-disease-and-diverticulitis:
    aliases: diverticular disease diverticulosis diverticulitis left lower abdominal pain
    summary: Small pouches can form in the bowel wall and often cause no trouble. When a pouch becomes inflamed, persistent pain
      and fever can signal diverticulitis.
    evidence_gap: Hospital records represent treated episodes. They cannot measure silent diverticulosis or all symptomatic cases
      managed outside hospital.
    symptoms:
    - Diverticular disease can cause abdominal discomfort, bloating or bowel changes. Diverticulitis tends to cause more constant
      pain, often low on the left, sometimes with fever or a change in bowel habit.
    causes:
    - Pouches form where the bowel wall is weaker. Diverticulitis occurs when one or more pouches become inflamed. Similar pain can
      have other causes, so a previous diagnosis does not explain every new episode.
    diagnosis:
    - A clinician checks symptoms and examines the abdomen. Blood tests or CT can help confirm a suspected attack or detect complications.
      If further bowel investigation is needed, it may be arranged after recovery.
    care:
    - Mild episodes may be managed at home with advice and monitoring. A clinician decides whether antibiotics or hospital care are
      needed. When well, discuss fluid and fibre intake and how to handle returning symptoms.
    complications:
    - An abscess, perforation, blockage or bleeding can occur. The need for further tests depends on symptoms, the severity of illness
      and whether there could be another explanation.
    help:
    - Ask for urgent medical advice for persistent abdominal pain with fever, repeated vomiting or feeling very unwell. Heavy rectal
      bleeding, severe pain or collapse requires emergency assessment.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/diverticular-disease-and-diverticulitis/
  ear-infections:
    aliases: ear infections otitis media middle ear outer ear earache child
    summary: Ear infections can cause ear pain, fever or temporary hearing changes. A clinician can distinguish a middle-ear infection
      from conditions affecting the ear canal.
    evidence_gap: Irish data from prescriptions or hospital visits do not cover ear infections treated at home. No comparable population
      estimate for all types of ear infection was identified.
    symptoms:
    - A child may be irritable, sleep poorly or tug at one ear. Older children and adults can describe pain or muffled hearing. Discharge
      can occur for several reasons.
    causes:
    - A cold can affect drainage from the middle ear. Infection may develop behind the eardrum. Outer-ear infection involves the
      canal and may be associated with irritation or moisture.
    diagnosis:
    - A clinician looks in the ear and asks about pain, fever, discharge and hearing. Symptoms alone do not show whether antibiotic
      treatment is needed.
    care:
    - Pain relief can help while a mild middle-ear infection settles. Antibiotics or drops are suitable for some cases, depending
      on the type of infection and clinical advice.
    complications:
    - Fluid behind the eardrum can temporarily affect hearing. Pain or swelling behind the ear, an ear sticking out or a child getting
      much more unwell can signal a complication.
    help:
    - Seek advice for severe pain, discharge, worsening fever or symptoms in a young baby. Arrange a GP review for repeated infections
      or continuing trouble hearing.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/ear-infections/
  early-premature-menopause:
    aliases: early menopause premature menopause primary ovarian insufficiency POI under 40 under 45
    summary: Menopause before age 45 is considered early. Loss of normal ovarian function before 40 needs assessment and can affect
      fertility, bones and long-term health.
    evidence_gap: General menopause surveys cannot reliably estimate the frequency of premature ovarian insufficiency in Ireland
      because they cover different ages and definitions.
    symptoms:
    - Periods may become irregular or stop, with hot flushes, vaginal dryness or sleep changes. Symptoms can develop gradually. Missed
      periods have other possible causes, including pregnancy.
    causes:
    - Ovarian function may decline naturally or after some surgery, cancer treatment or other conditions. In some cases no cause
      is found. Ovarian activity can sometimes fluctuate in premature ovarian insufficiency.
    diagnosis:
    - A GP considers menstrual history, treatments and symptoms and may request blood tests or refer to a specialist. Tests and timing
      depend on age and use of hormonal contraception.
    care:
    - The team can discuss hormone treatment when suitable, symptom care and contraception or fertility planning. Discuss whether
      bone or other health checks are needed.
    complications:
    - Lower oestrogen at a younger age can affect bone health. Diagnosis can have emotional and practical effects, especially when
      pregnancy plans change. Ask about specialist support if needed.
    help:
    - Contact a GP if periods change or menopausal symptoms develop before age 45. If you have abruptly stopped having periods, raise
      the possibility of pregnancy and other causes during assessment.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/early-premature-menopause/
  echocardiogram:
    kind: test
    aliases: echocardiogram echo heart ultrasound heart valves ejection fraction
    summary: An echocardiogram uses ultrasound to look at the heart in motion. It can show how the heart pumps and whether blood
      flows normally through its valves.
    evidence_gap: A national count covering routine and specialist scans across both hospital and community providers was not identified.
      Public waiting lists measure people waiting rather than tests completed.
    symptoms:
    - A clinician may request an echo for a heart murmur, breathlessness, suspected heart failure or monitoring a known valve or
      heart muscle problem.
    causes:
    - The scan shows the heart chambers, valves and movement of the muscle. Doppler ultrasound can measure the direction and speed
      of blood flow.
    diagnosis:
    - Check what type of echo is planned. A routine scan from outside the chest often needs little preparation. A scan using a probe
      in the food pipe has different instructions, such as fasting.
    care:
    - For a routine echo, a healthcare professional puts gel on the chest and moves a probe over the skin. You may be asked to turn
      onto your side or briefly hold your breath.
    complications:
    - You can usually return to normal activities after a routine chest scan. Follow separate recovery instructions if you have sedation
      or a different type of echo.
    help:
    - Ask when the person who requested your scan will review the results. Get urgent assessment for new severe chest pain, collapse
      or breathlessness rather than waiting for an echo result.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/echocardiogram/
  ectopic-pregnancy:
    aliases: ectopic pregnancy tubal pregnancy early pregnancy pain hCG
    summary: An ectopic pregnancy grows outside the womb, usually in a fallopian tube. One-sided pain or bleeding in early pregnancy
      needs prompt assessment.
    emergency: If early pregnancy pain is severe or accompanied by collapse, faintness or shoulder-tip pain, call
    symptoms:
    - There may be spotting, one-sided lower abdominal pain or pain when using the toilet. Shoulder-tip pain, faintness and collapse
      can be signs of internal bleeding. Some people have no symptoms at first.
    causes:
    - The pregnancy has implanted somewhere it cannot safely continue. As it grows, it can damage the surrounding tissue and cause
      bleeding.
    diagnosis:
    - Clinicians usually use a vaginal ultrasound and blood tests for the pregnancy hormone hCG. If the pregnancy is too early to
      locate, repeat tests help clarify where it is. An uncertain scan needs follow-up until the location or outcome is clear.
    care:
    - Treatment options include close monitoring, a medicine or surgery. The choice depends on the scan, hormone levels, symptoms
      and ability to return for tests. Follow the hospital's instructions for repeat tests until it confirms follow-up is complete.
    complications:
    - A ruptured ectopic pregnancy can cause life-threatening bleeding. Following a previous ectopic pregnancy, contact your maternity
      team early in a future pregnancy to discuss a scan.
    help:
    - Contact a maternity unit, GP or early pregnancy service urgently if you have pain or bleeding and could be pregnant. For severe
      pain, collapse or feeling faint, get emergency help.
  electrocardiogram-ecg:
    kind: test
    aliases: ECG EKG electrocardiogram heart tracing palpitations heart rhythm
    summary: An ECG records the heart's electrical activity. A short tracing can identify some rhythm problems, and a longer monitor
      may be used if symptoms come and go.
    evidence_gap: There is no verified national count in the sources consulted of all ECGs performed in hospitals, ambulances and
      GP practices.
    symptoms:
    - An ECG can be part of an assessment for palpitations, fainting, chest pain or a known heart condition. Different types of ECG
      answer different questions.
    causes:
    - Adhesive sensors detect electrical signals produced by the heart. A clinician looks for changes in rhythm, rate and the pattern
      of the tracing. A normal tracing at rest can miss a problem that happens intermittently.
    diagnosis:
    - For a routine ECG, you may be asked to remove clothing from the upper body. Ask whether you are booked for a resting test,
      exercise test or a monitor to wear at home.
    care:
    - You lie still while a healthcare professional puts sensors on the chest and limbs. The machine records your heart's electrical
      signals. It does not send electricity into your body.
    complications:
    - A brief resting ECG usually needs no recovery time. When wearing a longer monitor, follow instructions for recording symptoms
      and keeping the device dry where required.
    help:
    - Ask why the test was ordered and how you will get the result. Get emergency help for severe new chest pain, collapse or breathing
      difficulty even if an earlier ECG was normal.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/electrocardiogram-ecg/
  endoscopy:
    kind: procedure
    aliases: endoscopy upper GI gastroscopy camera biopsy sedation
    summary: Endoscopy lets a clinician look inside the body with a small camera. The preparation and recovery depend on exactly
      which examination you are booked for.
    symptoms:
    - A clinician might request an endoscopy to investigate symptoms such as difficulty swallowing, bleeding, persistent digestive
      symptoms or abnormal tests. Ask which kind of endoscopy is planned.
    causes:
    - An endoscope carries a camera and can take tissue samples or treat some findings. An upper endoscopy examines the food pipe,
      stomach and first part of the small bowel.
    diagnosis:
    - Use the hospital's fasting or bowel preparation instructions for your procedure. Ask about diabetes medicines and blood thinners
      well ahead of time. If sedation is planned, arrange an escort as instructed.
    care:
    - The team explains the examination and your options for comfort. During an upper endoscopy a narrow flexible tube passes through
      the mouth, and sometimes small samples are taken.
    complications:
    - A mild sore throat or bloating can occur. Severe pain, fever, vomiting blood or passing significant blood need urgent assessment.
      Sedation can affect judgement and coordination after discharge.
    help:
    - Ask whether there were biopsies, who will explain the results and when you should contact the unit. Follow the team's instructions
      about driving, work and other activities after sedation.
  febrile-seizures:
    aliases: febrile seizure fever fit child convulsion febrile convulsion
    summary: A febrile seizure can happen in a young child with a fever. A first seizure needs emergency assessment to check for
      other causes.
    emergency: If a child has a first seizure, has difficulty breathing, or the seizure lasts more than five minutes, call
    evidence_gap: Published Irish hospital data capture some children who are assessed or admitted and cannot establish the proportion
      of children who ever have a febrile seizure.
    symptoms:
    - A child may stiffen, shake, stop responding or look pale. Afterwards they may be sleepy or confused for a short time. One-sided
      jerking or repeated seizures need urgent attention.
    causes:
    - Febrile seizures affect some young children during a febrile illness. The seizure does not identify what caused the fever,
      so assessment of the underlying illness still matters.
    diagnosis:
    - The clinician asks what happened, how long it lasted and how the child recovered. Examination guides which tests, if any, are
      needed to investigate the fever and exclude more serious causes.
    care:
    - Move nearby objects away, protect the child's head and note the time. Do not restrain them or put anything in their mouth.
      When the movements stop, place them on their side if breathing normally.
    complications:
    - Most simple febrile seizures end on their own and do not cause lasting harm. Some children have another with a later fever.
      Discuss the plan if another seizure occurs.
    help:
    - Call emergency services for a first seizure, prolonged seizure or breathing problems. Seek urgent medical advice if recovery
      is slow, movements were one-sided or seizures recur.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/febrile-seizures/
  food-allergy:
    aliases: food allergy IgE food reaction hives anaphylaxis child food allergy
    summary: A food allergy is an immune reaction to a food. Some reactions are mild, while breathing or circulation problems require
      emergency treatment.
    emergency: If a food reaction causes throat swelling, breathing difficulty, faintness or collapse, use prescribed adrenaline
      if available and call
    evidence_gap: The Irish figures consulted for broad allergies do not isolate confirmed food allergy. The rate also varies depending
      on whether surveys use symptoms, self-report or supervised testing.
    symptoms:
    - Immediate symptoms can include itching, hives, lip swelling, vomiting or breathing difficulty. Some children have delayed symptoms,
      which need a different assessment. Symptoms after a meal can have many other causes.
    causes:
    - The immune system reacts to a food protein. In immediate allergy, the reaction can be fast even after a small exposure. Some
      delayed allergies involve other immune mechanisms.
    diagnosis:
    - A clinician asks what was eaten, how much and how soon symptoms started. Depending on the pattern, a specialist can sometimes
      use skin tests, blood tests or a supervised food challenge.
    care:
    - The care plan may include avoiding the relevant food, checking labels and making a plan for accidental exposure. If an adrenaline
      auto-injector is prescribed, ask for practical training and share the plan with school or carers.
    complications:
    - Severe reactions can become life-threatening. Unnecessary restriction can also affect nutrition, particularly for children,
      so discuss elimination diets with an appropriate clinician or dietitian.
    help:
    - Speak to your GP about repeated symptoms after a specific food. For possible anaphylaxis, use the prescribed adrenaline and
      seek emergency help immediately.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/food-allergy/
  food-intolerance:
    aliases: food intolerance bloating lactose intolerance diet symptoms reaction
    summary: A food intolerance can cause digestive symptoms after some foods. Keeping a short record of meals and symptoms can help
      a clinician decide whether another condition needs to be checked.
    evidence_gap: Survey estimates for self-reported reactions can include allergies and other digestive disorders. No comparable
      Irish population estimate for all confirmed food intolerances was identified.
    symptoms:
    - Bloating, gas, abdominal pain or diarrhoea may appear hours after eating. The amount eaten can matter. A pattern may be easier
      to see over several meals than from one isolated episode.
    causes:
    - Some intolerances involve difficulty digesting part of a food, such as lactose. Similar symptoms can come from irritable bowel
      syndrome, coeliac disease or another digestive problem.
    diagnosis:
    - Discuss the pattern with your GP. Depending on symptoms, they may arrange tests or a trial of dietary change. If coeliac disease
      is possible, ask about testing before cutting out gluten.
    care:
    - A GP or dietitian can help plan a short, supervised exclusion and reintroduction where appropriate. Avoid restricting several
      foods at once without support, especially for a child.
    complications:
    - Unnecessary restriction can make it hard to get enough nutrients or obscure the true cause. Weight loss, blood in stools or
      symptoms that wake you at night need medical assessment.
    help:
    - Contact your GP for continuing or worsening symptoms. Breathing difficulty, throat swelling or collapse after food is an emergency
      and suggests a different kind of reaction.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/food-intolerance/
  food-poisoning:
    aliases: food poisoning foodborne illness gastroenteritis diarrhoea vomiting campylobacter salmonella
    summary: Food poisoning can cause diarrhoea, vomiting or abdominal cramps. Keeping up with fluids is important, and some people
      need early medical assessment.
    symptoms:
    - Fever or nausea may occur along with diarrhoea. Symptoms can start at different times after exposure depending on the cause,
      so the last meal is not always responsible.
    causes:
    - Food or drink may contain bacteria, viruses, parasites or toxins. Similar symptoms can also come from an infection passed person
      to person. Let a clinician know if others became ill after the same meal.
    diagnosis:
    - A GP assesses symptoms, hydration and who else is affected. A stool test can be useful for persistent or bloody diarrhoea,
      severe illness or a possible outbreak.
    care:
    - Small frequent drinks or oral rehydration solution may help. A clinician decides whether extra investigations or specific treatment
      are needed. Ask about returning to work if you handle food or care for others.
    complications:
    - Vomiting and diarrhoea can cause dehydration. Some infections cause complications, especially in younger children, older adults,
      pregnant people and people with weakened immune systems.
    help:
    - Seek prompt advice if you cannot keep fluids down, have blood in diarrhoea, a high fever, severe pain or signs of dehydration.
      Tell your GP if you suspect an outbreak.
  gallstones:
    aliases: gallstones bile stones biliary colic cholelithiasis gallbladder
    summary: Gallstones often cause no problems. A stone that blocks bile drainage can cause severe episodes of abdominal pain or
      require treatment for complications.
    evidence_gap: Irish hospital surgery data capture treated disease. They cannot count silent stones or reliably estimate how many
      people in Ireland have gallstones.
    symptoms:
    - Biliary colic usually causes an episode of steady pain in the upper middle abdomen or under the right ribs. It can spread to
      the back or shoulder and may be accompanied by nausea. Pain between attacks may disappear entirely.
    causes:
    - Stones form when substances in bile harden. They can move and temporarily block the outlet of the gallbladder or lodge in a
      bile duct.
    diagnosis:
    - Ultrasound can show stones in the gallbladder. Liver blood tests or further scans can help assess whether a duct is blocked.
      Stones found by coincidence may be unrelated to an individual's pain.
    care:
    - Stones without symptoms often need no treatment. For recurrent attacks or complications, a specialist may recommend removing
      the gallbladder. A separate endoscopic procedure can clear a stone in a bile duct.
    complications:
    - A blockage can cause cholecystitis, jaundice, infection of the bile ducts or pancreatitis. Persistent pain with fever differs
      from a brief uncomplicated pain episode and needs prompt assessment.
    help:
    - Contact your GP about repeated attacks. Seek urgent assessment for severe persistent pain, fever, jaundice or vomiting with
      worsening illness.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/gallstones/
  generalised-anxiety-disorder:
    aliases: generalised anxiety disorder generalized anxiety disorder GAD persistent worry
    summary: Generalised anxiety disorder involves persistent, difficult-to-control worry across several areas of life. Treatment
      can help even when the worries feel hard to name or separate.
    evidence_gap: Irish figures for anxiety disorders as a group do not identify generalised anxiety disorder separately. Broad self-reported
      worry also cannot serve as a diagnosis.
    symptoms:
    - You may feel tense, restless or unable to switch off. Sleep and concentration can suffer, and worries can recur even when an
      immediate problem has passed.
    causes:
    - Anxiety can persist through a combination of stress, past experiences and susceptibility. Looking for reassurance or avoiding
      uncertain situations may keep the worry going.
    diagnosis:
    - A clinician assesses how wide-ranging and persistent the worry is and how much it interferes with life. They may ask about
      physical health, mood, substance use and other anxiety patterns.
    care:
    - Talking therapies such as cognitive behavioural therapy can help. Medication may be considered with a GP. Ask what to expect
      from treatment, when to review progress and what support is available while waiting.
    complications:
    - Persistent anxiety can make decisions, sleep and work difficult. It can coexist with depression or other anxiety disorders.
      A change in symptoms may warrant a treatment review.
    help:
    - Contact your GP if worry affects functioning or sleep most days. Seek urgent help if you are in crisis or feel unable to keep
      yourself safe.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/generalised-anxiety-disorder/
  glutaric-aciduria-type-1-ga1:
    aliases: GA1 glutaric aciduria type 1 glutaric acidaemia
    summary: Glutaric aciduria type 1 is an inherited condition that can injure the brain during illness. Newborn screening can find
      it before the first crisis.
    symptoms:
    - A baby may look well at birth. Some have an unusually large head. During a crisis, signs can include vomiting, reduced alertness
      or changes in movement, particularly with an infection or poor feeding.
    causes:
    - The condition affects an enzyme used to break down certain amino acids. Substances build up and can injure parts of the brain
      responsible for movement, especially when illness increases energy needs.
    diagnosis:
    - Specialists use blood or urine tests and may use genetic testing after a high-risk screen. They explain what the result means
      and arrange a plan for ordinary days and for illness.
    care:
    - Care may involve a prescribed diet, specialist supplements and treatment to prevent a metabolic crisis during illness. A metabolic
      dietitian explains feeds and dietary changes to the family.
    complications:
    - A crisis can cause permanent difficulties controlling movement. Follow-up monitors growth and development and helps families
      prepare for infections, surgery or other times when feeding can be disrupted.
    help:
    - Use the metabolic team's emergency plan and contact it promptly when your child is unwell, is vomiting or cannot take their
      usual feeds. Follow an urgent screening referral even if the baby looks well.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/heel-prick-screening/conditions/
  gout:
    aliases: gout urate crystals high uric acid big toe flare joint
    summary: Gout causes sudden painful inflammation in a joint, often at the base of the big toe. A hot swollen joint with fever
      can also be due to infection and needs urgent assessment.
    evidence_gap: Some Irish sources measure urate levels or treatment, and a high urate level alone does not diagnose gout. A directly
      comparable national diagnosed prevalence estimate was not identified.
    symptoms:
    - A flare can start overnight and make the joint so tender that clothing or a sheet hurts. The ankle, knee or an upper limb joint
      can also be affected.
    causes:
    - Urate can build up and form crystals in a joint, where they trigger inflammation. Kidney function, family history and some
      medicines influence urate, as well as other health factors.
    diagnosis:
    - A clinician reviews the pattern, examines the joint and may check urate. Levels can be misleading during a flare. A joint fluid
      sample can identify crystals or help rule out infection.
    care:
    - Different anti-inflammatory medicines can relieve a flare, depending on other conditions and prescriptions. Long-term urate-lowering
      treatment can prevent recurrence. Ask about blood tests and the target if it is prescribed.
    complications:
    - Repeated uncontrolled flares can damage joints. Hard deposits called tophi may develop. Gout can coexist with kidney disease
      or kidney stones.
    help:
    - Contact your GP about a first suspected attack or frequent flares. Arrange urgent assessment if a hot swollen joint comes with
      fever or you feel generally unwell.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/gout/
  haemochromatosis:
    aliases: haemochromatosis hemochromatosis HFE hereditary iron overload ferritin
    summary: Hereditary haemochromatosis can cause the body to accumulate extra iron. Blood tests help distinguish iron overload
      from other reasons for a high ferritin result.
    symptoms:
    - Some people feel well and are diagnosed from blood tests or family testing. Fatigue, joint pain and abnormal liver tests can
      occur, but each can have other causes.
    causes:
    - Certain inherited variants affect how the body controls absorption of iron. Extra iron can accumulate in organs over time.
      Carrying an at-risk genotype does not mean organ damage will occur.
    diagnosis:
    - A GP can check ferritin and transferrin saturation. Genetic testing may help when results or family history suggest hereditary
      haemochromatosis. Some people also need liver assessment.
    care:
    - Regular removal of blood can reduce iron levels when treatment is needed. Ask about the target, test schedule and whether family
      members should discuss testing with their GP.
    complications:
    - Iron overload can affect the liver, pancreas, heart or joints. Early treatment reduces the risk of some complications. Symptoms
      such as joint pain may not resolve completely even after iron levels improve.
    help:
    - Contact your GP if a close relative has confirmed hereditary haemochromatosis or if your iron tests remain abnormal. Avoid
      starting an iron supplement until the need has been checked.
    sources:
      Clinical guidance and further reading: https://www.saolta.ie/news/hse-west-and-north-west-rolls-out-hereditary-haemochromatosis-hh-education-programme-gp
  hand-foot-mouth-disease:
    aliases: hand foot and mouth HFMD mouth ulcers hands feet child rash
    summary: Hand, foot and mouth disease often causes mouth sores and a rash on the hands and feet. Drinking comfortably matters
      more than eating normally for the first few days.
    evidence_gap: Individual cases are not routinely notifiable to HPSC. Irish outbreak reports cover reported clusters, so they
      cannot measure how often the illness occurs in children overall.
    symptoms:
    - A fever or sore throat may come before painful spots in the mouth and small blisters on the palms, soles or buttocks. A child
      may drink less because swallowing hurts.
    causes:
    - Several enteroviruses can cause this illness. They spread through close contact and contaminated hands or surfaces. It is different
      from the disease that affects farm animals.
    diagnosis:
    - A clinician can usually recognise the pattern of symptoms. Tell them how much the child is drinking and how many wet nappies
      or trips to the toilet are usual.
    care:
    - Offer cool drinks often and soft foods if the child wants them. Ask a pharmacist about suitable pain relief. Handwashing and
      avoiding shared cups can reduce spread.
    complications:
    - Most cases get better without specific treatment. Dehydration can develop if mouth sores make drinking difficult, particularly
      in young children.
    help:
    - Ask for advice if a child drinks much less, passes little urine or is getting more unwell. Talk to your GP if you are pregnant
      and think you may have been exposed.
    sources:
      Clinical guidance and further reading: https://www.hpsc.ie/a-z/other/handfootmouthdisease/
  heartburn-and-acid-reflux:
    aliases: heartburn acid reflux GORD GERD gastro oesophageal reflux
    summary: Heartburn is a burning feeling behind the breastbone that can occur when stomach contents travel upwards. Trouble swallowing
      or new, unexplained chest pain needs assessment.
    evidence_gap: A national estimate for Ireland needs to distinguish occasional heartburn from diagnosed reflux disease. Figures
      for medication use do not make that distinction.
    symptoms:
    - Symptoms may worsen after food, bending or lying down. You may notice a sour taste, regurgitation or a burning feeling that
      rises towards the throat.
    causes:
    - A muscle at the lower end of the food pipe normally helps keep stomach contents down. If it relaxes at the wrong time, acid
      can irritate the lining. Pregnancy or a hiatus hernia can also contribute.
    diagnosis:
    - A GP often starts by asking about symptom timing and medicines. Difficulty swallowing, weight loss or bleeding may need investigation
      such as endoscopy. Other causes need assessment if the pattern is atypical.
    care:
    - A pharmacist can advise on short-term relief. Smaller meals and avoiding lying down shortly after eating may help. A GP can
      decide whether a course of acid-suppressing medicine is appropriate and when to review it.
    complications:
    - Persistent reflux can inflame or narrow the food pipe. Some people develop Barrett's oesophagus, which may need specialist
      follow-up. Occasional symptoms can be managed differently from daily symptoms.
    help:
    - Contact your GP for persistent symptoms, trouble swallowing, frequent vomiting or unexplained weight loss. Seek emergency help
      for new chest pressure with breathlessness, sweating or faintness.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/heartburn-and-acid-reflux/
  heat-exhaustion-and-heatstroke-in-children:
    aliases: heat exhaustion children heatstroke baby overheating heat illness
    summary: Babies and children can overheat quickly. Move a hot, unwell child to a cooler place and get emergency help for changes
      in alertness or failure to improve.
    emergency: If a child in the heat is confused, has a seizure, collapses or is difficult to wake, call
    evidence_gap: Irish surveillance of severe heat illness does not provide a national frequency for mild episodes in children.
      A specific paediatric estimate was not identified.
    symptoms:
    - A child may become thirsty, weak, dizzy or nauseated. Babies may be unsettled or unusually sleepy. Confusion, a seizure or
      loss of consciousness can suggest heatstroke.
    causes:
    - Babies and young children rely on adults to change their environment and offer drinks or feeds. Hot rooms, direct sun and cars
      can expose them to far more heat than they can lose.
    diagnosis:
    - Assess how alert the child is and whether they can drink while arranging help. A healthcare professional can examine them for
      dehydration or signs of more serious overheating.
    care:
    - Move the child into shade or a cool room, remove excess clothing and cool the skin. If alert and able to drink, offer fluids
      appropriate for their age. Do not give anything by mouth if the child cannot swallow safely.
    complications:
    - Severe heatstroke can damage organs. Dehydration can worsen quickly in a baby, especially if feeding poorly or losing fluid
      through vomiting or diarrhoea.
    help:
    - Seek emergency help if the child is difficult to wake, confused or still very unwell after cooling. Get medical advice promptly
      if a baby has very few wet nappies or feeds poorly.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/heat-exhaustion-and-heatstroke-in-children/
  heat-exhaustion-heatstroke:
    aliases: heat exhaustion heatstroke heat stroke hot weather overheating
    summary: Heat exhaustion can improve with cooling and fluids. Confusion, a seizure or collapse after heat exposure can mean heatstroke
      and needs emergency help.
    emergency: If someone in the heat becomes confused, has a seizure, collapses or is still very unwell after cooling, call
    evidence_gap: Irish emergency and death records capture severe events. They do not establish how often mild heat exhaustion occurs
      at home, at work or during sport.
    symptoms:
    - Heat exhaustion can cause headache, dizziness, thirst, nausea, muscle cramps and heavy sweating. Heatstroke can cause confusion,
      loss of coordination, fainting or seizure. Sweating may still be present.
    causes:
    - The body can struggle to lose heat during hot weather, strenuous exercise or time in poorly ventilated places. Dehydration,
      some medicines and illness can increase vulnerability.
    diagnosis:
    - Clinicians consider heat exposure, body temperature and the person's alertness. Suspected heatstroke is treated as an emergency
      while further assessment is arranged.
    care:
    - Move the person to a cooler area, remove excess clothing and cool their skin. Offer cool fluids only if fully alert and able
      to swallow. Keep cooling while waiting for help if heatstroke is suspected.
    complications:
    - Severe overheating can affect the brain, kidneys and other organs. Even people who are normally healthy can become seriously
      ill during sustained heat or strenuous exercise.
    help:
    - Call for emergency help if there is confusion, a seizure, collapse or failure to improve after about 30 minutes of cooling.
      Check on older or isolated people during hot weather.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/heat-exhaustion-heatstroke/
  heel-prick-screening:
    kind: test
    aliases: newborn bloodspot screening heel prick newborn test Guthrie test
    summary: Ireland offers newborn bloodspot screening to find certain rare conditions early. A small blood sample from the heel
      can reveal a condition before a baby appears unwell.
    symptoms:
    - The test is offered to newborn babies as part of routine care. Early recognition can prevent serious complications for conditions
      where waiting for symptoms would delay treatment.
    causes:
    - A laboratory analyses dried spots of blood for markers associated with the programme's conditions. The HSE maintains the current
      list, which can change as the programme expands.
    diagnosis:
    - A midwife or public health nurse will explain the test, ask for consent and arrange it, usually on day 3 to 5. Ask who will
      do it and when if you leave hospital early or are unsure whether it happened.
    care:
    - A healthcare professional takes a few drops of blood from the heel onto a card for the laboratory. You can usually hold and
      comfort your baby during the sample.
    complications:
    - Sometimes a sample needs to be repeated because there was too little blood or the result needs to be clarified. A high-risk
      screen leads to more tests to check whether the condition is present.
    help:
    - Keep your contact details up to date and respond quickly to a request for another sample or specialist appointment. If your
      baby becomes unwell, seek clinical advice immediately instead of waiting for a screening result.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/heel-prick-screening/conditions/
  hepatitis:
    aliases: hepatitis liver inflammation viral hepatitis A B C E jaundice
    summary: Hepatitis means liver inflammation. Viral infections, medicines, alcohol and immune conditions can cause it. Testing
      identifies the cause and guides what happens next.
    symptoms:
    - Some people have no symptoms. Others develop tiredness, nausea, discomfort under the right ribs, dark urine or yellowing of
      the skin or whites of the eyes.
    causes:
    - Different causes damage liver cells in different ways. Some viruses cause a short illness, while hepatitis B or C can persist.
      Alcohol, medicines and autoimmune disease may also cause inflammation.
    diagnosis:
    - A clinician reviews the history and checks liver blood tests. Specific blood tests can identify viral hepatitis, and other
      tests assess liver damage or investigate a non-viral cause.
    care:
    - Treatment depends on cause and severity. Some people need monitoring and supportive care, while others need antiviral or specialist
      treatment. Ask whether testing, vaccination or advice for close contacts applies to you.
    complications:
    - Long-standing inflammation may cause liver scarring and increase the risk of liver failure or liver cancer. New jaundice or
      confusion can require urgent assessment.
    help:
    - Contact your GP promptly if you notice jaundice, dark urine or have concerns about exposure. Seek emergency help if someone
      with suspected liver illness becomes confused, collapses or is very unwell.
  high-temperature:
    aliases: fever children high temperature baby thermometer child temperature
    summary: Fever is a sign of illness. A baby younger than three months with a temperature of 38°C or higher needs urgent medical
      advice.
    emergency: If a child with fever is very difficult to wake, is struggling to breathe or has a rash that does not fade under pressure,
      call
    evidence_gap: Fever is a symptom tracked in many situations, including at home. Counts for specific infections cannot estimate
      how many children get fever overall.
    symptoms:
    - A child may feel hot, sweaty or shivery. Check temperature with a suitable thermometer, and also pay attention to drinking,
      wet nappies, breathing and alertness.
    causes:
    - Fever can occur when the body responds to an infection. The temperature alone does not show whether an illness is mild or serious.
      Age and other symptoms matter.
    diagnosis:
    - A clinician may ask when fever started, how it was measured and whether the child is drinking, urinating and behaving normally.
      Examination or tests depend on the symptoms and age.
    care:
    - Keep fluids available and avoid over-wrapping. Medicines for fever can be used for discomfort if appropriate for the child's
      age and weight. Follow the label or clinical advice.
    complications:
    - A fever can accompany serious infection, including when symptoms are incomplete early on. Reduced alertness, poor drinking
      or new breathing trouble should change the response.
    help:
    - Seek urgent advice for a young baby with fever or a child who is becoming more unwell. Call emergency services if the child
      is difficult to wake, struggling to breathe or has a non-fading rash.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/high-temperature/
  homocystinuria:
    aliases: HCU homocystinuria CBS deficiency heel prick
    summary: Homocystinuria is an inherited condition that can affect the eyes, bones and blood vessels. Early treatment can reduce
      the risk of long-term problems.
    symptoms:
    - Babies often have no visible symptoms. Later signs may include very short-sighted vision, problems with the lens in the eye,
      difficulties with development or a blood clot at an unusually young age.
    causes:
    - In the form targeted by newborn screening, a missing or underactive enzyme affects the body's handling of methionine and homocysteine.
      Raised homocysteine contributes to the risk of blood clots.
    diagnosis:
    - A high-risk screen can lead to specialist blood tests for homocysteine and other markers. The team may use genetic testing
      and assess whether the condition responds to vitamin B6.
    care:
    - Treatment can involve a prescribed diet, specific vitamins or medicines to reduce homocysteine. A dietitian and specialist
      explain monitoring and how to manage school, holidays and illness.
    complications:
    - Untreated disease can lead to dislocation of the eye lens, bone problems or thrombosis. Treatment and repeat blood tests reduce
      risk while the person grows.
    help:
    - Follow up promptly if called after newborn screening. Anyone with sudden chest pain and difficulty breathing, stroke symptoms
      or a suspected serious clot needs emergency care.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/heel-prick-screening/conditions/
  hot-flushes:
    aliases: hot flushes hot flashes night sweats menopause vasomotor symptoms
    summary: Hot flushes are sudden waves of warmth that can occur around menopause. If symptoms disturb sleep or have no clear explanation,
      discuss them with a GP.
    symptoms:
    - A flush may affect the upper chest, neck or face, sometimes with sweating, a racing sensation or chills afterwards. Similar
      episodes during sleep can soak clothes or bedding.
    causes:
    - Hormonal changes during menopause can affect how the body regulates temperature. Medicines or other conditions can also contribute,
      especially when the symptoms are new or persistent.
    diagnosis:
    - Describe the timing, frequency and any changes in periods or medicines. Mention persistent fever, unexplained weight loss or
      symptoms that occur despite a comfortable temperature.
    care:
    - Cooling the room, dressing in layers and noticing individual triggers can help some people. A GP can discuss hormone or non-hormone
      treatment if symptoms are frequent or disruptive.
    complications:
    - Frequent night sweats can disturb sleep and affect concentration or mood. Sweating that is unexplained or comes with other
      symptoms deserves assessment for a different cause.
    help:
    - Speak to your GP if flushes regularly interrupt sleep or daily activities. Get advice for persistent drenching sweats without
      an obvious cause or sweats with fever or weight loss.
  hpv-vaccine:
    kind: procedure
    aliases: HPV vaccine human papillomavirus Gardasil school vaccine cervical cancer HPV Ireland
    summary: The HPV vaccine protects against important types of human papillomavirus that can cause cancer or genital warts. The
      HSE offers it through the school programme.
    symptoms:
    - The HSE usually offers vaccination in first year of secondary school. Ask the school vaccination team or local immunisation
      service about eligibility if a dose was missed or your child is educated outside school.
    causes:
    - The vaccine prepares the immune system to recognise selected HPV types. It works best before exposure and is used to prevent
      future infection-related disease.
    diagnosis:
    - Review the information and consent form. Tell the vaccinator about past reactions, current medication or a weakened immune
      system, because the recommended schedule can differ.
    care:
    - A healthcare professional gives the vaccine into the upper arm. The team will confirm what was given and whether another dose
      is needed.
    complications:
    - Pain or redness at the injection site and short-lived symptoms such as headache can occur. Ask the team which symptoms to report.
      Keep attending cervical screening if eligible later in life.
    help:
    - Contact the school vaccination team or immunisation office if your child missed their visit. A GP or relevant service can check
      advice for adults or people outside the routine programme.
  hyperemesis-gravidarum:
    aliases: hyperemesis gravidarum severe pregnancy sickness HG vomiting pregnancy
    summary: Hyperemesis gravidarum is severe sickness in pregnancy. When vomiting prevents you from drinking, eating or taking medicines,
      ask your maternity team for assessment.
    evidence_gap: Treatment records count people who reach a service. They omit people managed solely in primary care or at home
      and cannot establish a national prevalence figure.
    symptoms:
    - Nausea and vomiting can make normal activities impossible. Passing little or dark urine, feeling faint or losing weight can
      signal that the vomiting is affecting hydration or nutrition.
    causes:
    - Pregnancy-related sickness can become severe enough to affect how the body maintains fluid and salt levels. Other causes of
      vomiting sometimes need to be ruled out, particularly if it starts later or comes with fever or pain.
    diagnosis:
    - A clinician asks about what you can keep down, weight changes and urine output. They may check pulse, blood pressure and blood
      tests and consider whether another condition explains the symptoms.
    care:
    - Anti-sickness medicines can be prescribed in pregnancy. If you cannot drink enough, hospital or day-unit treatment can replace
      fluids and manage complications. Ask for a plan if the first medicine fails or cannot be kept down.
    complications:
    - Prolonged vomiting can cause dehydration, salt imbalances and vitamin deficiencies. It can also affect work and mental health.
      Symptoms severe enough to limit eating or drinking deserve review even without weight loss.
    help:
    - Contact your GP or maternity unit urgently if you cannot keep fluids down, are passing very little urine, feel faint or are
      losing weight. Seek help earlier if you previously had severe pregnancy sickness.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/hyperemesis-gravidarum/
  idiopathic-pulmonary-fibrosis:
    aliases: IPF idiopathic pulmonary fibrosis interstitial lung disease lung scarring
    summary: Idiopathic pulmonary fibrosis causes progressive lung scarring. Persistent breathlessness on exertion and a dry cough
      are reasons to ask your GP about assessment.
    symptoms:
    - People often notice that stairs or usual walks become harder. A persistent dry cough, fatigue or clubbing of the fingertips
      can occur. Early symptoms can resemble other heart or lung conditions.
    causes:
    - Scarring thickens the tissue around the air sacs and reduces the lungs' ability to transfer oxygen. In IPF, a specialist cannot
      identify another cause for the characteristic pattern of scarring.
    diagnosis:
    - A respiratory specialist may arrange high-resolution CT and breathing tests, review medicines and possible exposures, and discuss
      the scans with an interstitial lung disease team.
    care:
    - Antifibrotic treatment can slow progression for some people. Exercise rehabilitation, oxygen when indicated and symptom support
      can help. Some people are assessed for transplant. Ask the team about a plan for worsening symptoms.
    complications:
    - Progression varies. Sudden decline may be due to infection, a clot or an exacerbation that needs urgent assessment. Regular
      lung function tests can help track change.
    help:
    - Contact your GP for unexplained breathlessness or a persistent dry cough. Seek urgent assessment for a significant new change,
      especially breathlessness at rest or fever.
  impetigo:
    aliases: impetigo school skin sores honey crust contagious infection
    summary: Impetigo is a contagious skin infection that often produces crusted sores around the nose or mouth. Prompt advice can
      reduce discomfort and the chance of spreading it.
    evidence_gap: Published Irish prescribing or pharmacy activity does not capture every untreated or recurrent episode, and was
      not used as a national prevalence estimate.
    symptoms:
    - Small sores or blisters may break and leave a golden-brown crust. They can spread to nearby areas, particularly if scratched.
      Some cases cause larger fluid-filled blisters.
    causes:
    - Bacteria can infect already irritated or scratched skin. It spreads by direct contact or shared items such as towels. Eczema
      can make the skin more susceptible.
    diagnosis:
    - A pharmacist or clinician can often recognise impetigo from its appearance. Repeated episodes, extensive disease or lack of
      improvement may lead to further assessment or a swab.
    care:
    - Treatment depends on how extensive the sores are and whether the person is unwell. Keep the area clean, wash hands after touching
      it and avoid sharing towels. Follow advice on returning to school.
    complications:
    - Infection can spread over the skin or occasionally to deeper tissue. A rapidly expanding hot area or fever needs review, particularly
      in a young or vulnerable child.
    help:
    - Get advice if you suspect impetigo. Seek prompt assessment if it spreads quickly, affects a young baby, or a child develops
      fever or worsening discomfort.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/impetigo/
  insomnia:
    aliases: insomnia sleep problems waking early difficulty falling asleep
    summary: Insomnia can mean trouble falling asleep, staying asleep or waking too early. If it persists and affects daytime function,
      effective treatment may be available.
    evidence_gap: Irish surveys of sleep duration or sleep quality do not always identify insomnia disorder. Different measures should
      be interpreted separately.
    symptoms:
    - You may stay awake for long periods, wake often or feel unrefreshed. During the day, it can affect mood, energy, concentration
      or alertness.
    causes:
    - Stress, changes in routine, caffeine, pain, some medicines and other sleep disorders can contribute. Spending longer in bed
      trying to sleep can sometimes reinforce the pattern.
    diagnosis:
    - A GP may ask about bedtime, sleep timing, work shifts, snoring, substances and mood. Keeping a brief sleep diary can help identify
      patterns and possible triggers.
    care:
    - A regular wake time and reviewing caffeine, alcohol and naps may help. Cognitive behavioural therapy for insomnia can help
      persistent problems. Sleeping tablets have limited roles and need clinical advice.
    complications:
    - Poor sleep can affect driving and work safety. Loud snoring with pauses, unusual leg sensations or mood changes can point to
      another issue that needs assessment.
    help:
    - Contact your GP if insomnia lasts, affects your functioning or does not improve with routine changes. Avoid driving or operating
      machinery if you cannot stay alert.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/insomnia/
  iron-deficiency-anaemia:
    aliases: iron deficiency anaemia anemia low ferritin low haemoglobin tiredness
    summary: Iron deficiency anaemia can cause tiredness, shortness of breath or palpitations. A blood test can confirm it, and finding
      the cause is an important part of treatment.
    evidence_gap: A low iron store and anaemia are distinct findings. Irish estimates for dietary iron intake or anaemia from all
      causes cannot establish the prevalence of iron deficiency anaemia.
    symptoms:
    - Symptoms may include fatigue, pale skin, headaches or reduced exercise tolerance. Some people notice brittle nails or a strong
      urge to chew ice. Mild deficiency can cause no obvious symptoms.
    causes:
    - Iron is needed to make haemoglobin, which carries oxygen. Heavy periods, bleeding in the digestive system, pregnancy, low intake
      or problems absorbing iron can contribute.
    diagnosis:
    - A GP may check a full blood count and ferritin. Interpretation depends on other conditions. The clinician may investigate bleeding,
      diet or absorption according to age and symptoms.
    care:
    - Treatment can include oral iron or, in selected cases, iron through a vein. Ask how long treatment should continue and when
      a repeat test is due. The underlying cause may also need attention.
    complications:
    - Untreated anaemia can affect daily functioning and make breathing or heart symptoms worse. An improvement after iron treatment
      does not remove the need to investigate unexplained blood loss.
    help:
    - Contact your GP if tiredness persists or you suspect an iron deficiency. Seek urgent care for breathlessness at rest, significant
      bleeding, collapse or chest pain.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/iron-deficiency-anaemia/
  irritable-bowel-syndrome:
    aliases: IBS irritable bowel syndrome IBS D IBS C bloating bowel pain
    summary: Irritable bowel syndrome can cause recurring abdominal pain and changes in bowel habits. A GP can check for warning
      signs and discuss ways to manage symptoms.
    evidence_gap: Population estimates differ with the diagnostic criteria used. Sources consulted did not provide a directly comparable
      national estimate for diagnosed IBS in Ireland.
    symptoms:
    - Abdominal pain may improve or change after opening your bowels. Diarrhoea, constipation or both can occur, often with bloating.
      The pattern may change over time.
    causes:
    - IBS involves changes in how the bowel and nervous system interact. Movement of the gut, sensitivity to stretching and factors
      such as some foods or stress can influence symptoms.
    diagnosis:
    - A clinician may diagnose IBS from a recurring pattern and a medical assessment. Tests can check for alternatives such as coeliac
      disease or inflammation where indicated. New warning signs may change the investigations needed.
    care:
    - Meals, physical activity and suitable changes to fibre or other foods can help some people. A GP or pharmacist can discuss
      symptom-specific medicines. A dietitian can guide a limited elimination and reintroduction plan if appropriate.
    complications:
    - Symptoms can affect work, sleep and social plans. IBS does not explain rectal bleeding, unexplained weight loss or anaemia,
      so these findings need separate assessment.
    help:
    - Speak to a GP about a persistent change in bowel habits. Seek assessment for blood in stools, loss of weight without trying,
      or symptoms that wake you at night.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/irritable-bowel-syndrome/
  ivf:
    kind: procedure
    aliases: IVF in vitro fertilisation ICSI assisted human reproduction embryo transfer fertility treatment
    summary: IVF involves collecting eggs and fertilising them in a laboratory. Before treatment, ask the fertility team about your
      chances, risks, likely timeline and eligibility for public funding.
    symptoms:
    - IVF can be an option for some kinds of infertility, including blocked fallopian tubes or some sperm-related problems. The team
      considers both partners' needs where relevant and other options.
    causes:
    - The ovaries may be stimulated to produce eggs. Eggs are collected and fertilised in the laboratory. An embryo can be transferred
      into the womb, and suitable remaining embryos may be stored under an agreed plan.
    diagnosis:
    - A clinic assesses medical and fertility history, tests and consent. Ask for clear instructions on injections, scans and appointments
      and check the current HSE funding criteria before making financial commitments.
    care:
    - A cycle can involve medication, ultrasound monitoring, egg collection and sometimes a fresh or later frozen embryo transfer.
      The clinic tells you when to take a pregnancy test.
    complications:
    - Treatment can be physically and emotionally demanding. Severe pain, marked swelling, difficulty breathing or passing less urine
      after stimulation needs urgent advice because of possible ovarian hyperstimulation.
    help:
    - Ask whom to contact outside clinic hours, when to test and what happens after a positive or negative result. Contact the clinic
      for unusual or worsening symptoms.
    sources:
      Clinical guidance and further reading: https://about.hse.ie/publications/hse-fertility-services-report-2025/
  jaundice-newborn-babies:
    aliases: newborn jaundice baby bilirubin yellow eyes phototherapy
    summary: Jaundice is common in newborns, but the timing and bilirubin level matter. A yellow colour in the first 24 hours of
      life needs urgent assessment.
    evidence_gap: Irish maternity indicators do not provide a national count of all visible jaundice. Phototherapy activity, where
      reported, covers babies treated above certain thresholds.
    symptoms:
    - The skin or whites of the eyes can look yellow. On darker skin the change may be easier to see in the eyes or gums. Poor feeding,
      unusual sleepiness, pale stools or dark urine need attention.
    causes:
    - Bilirubin forms as red blood cells break down. A newborn's liver may take time to clear it. Prematurity, blood group incompatibility
      and other conditions can raise bilirubin.
    diagnosis:
    - A maternity clinician can use a skin reading or blood sample to check bilirubin. They interpret the result using the baby's
      age in hours and any risk factors.
    care:
    - Feeding support and monitoring may be enough for mild jaundice. High bilirubin levels may need phototherapy, which uses special
      light. Follow instructions for any repeat check.
    complications:
    - Very high untreated levels can harm the brain. Jaundice that lasts longer than expected can sometimes reflect a liver or bile
      problem and should be assessed.
    help:
    - Tell the midwife or GP if your baby looks yellow. Get urgent help if the colour appears on the first day, the baby is sleepy
      or feeding poorly, or stools are very pale.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/jaundice-newborn-babies/
  kidney-infection:
    aliases: kidney infection pyelonephritis fever flank pain UTI
    summary: Fever or shaking chills with pain in the side or back can be signs of a kidney infection. Contact a clinician urgently,
      particularly if you are pregnant or have a kidney condition.
    symptoms:
    - Symptoms can include pain under the ribs on one side, fever, nausea and vomiting. There may also be burning or a frequent urge
      to urinate, though bladder symptoms are not always present.
    causes:
    - A kidney infection often starts when bacteria travel from the bladder up a ureter. A blocked urinary tract can make it harder
      to clear an infection.
    diagnosis:
    - The clinician reviews symptoms and often sends urine for culture. Blood tests or imaging may be useful if you are very unwell,
      have recurrent infections or might have a blockage.
    care:
    - Antibiotics are used to treat a kidney infection. The clinician may change the prescription after the culture result. Hospital
      care may be needed if you cannot keep medicine down or have signs of severe infection.
    complications:
    - A kidney infection can cause sepsis or damage the kidney in severe cases. A fever with a suspected blocked kidney needs prompt
      hospital assessment.
    help:
    - Seek same-day advice if you have possible kidney infection, especially with fever, vomiting, pregnancy or pain in the side.
      Call for emergency help for confusion, collapse or severe breathing difficulty.
  kidney-stones:
    aliases: kidney stones renal colic ureteric stone flank pain blood urine
    summary: A kidney stone can cause intense pain in waves as it moves into the tube to the bladder. Severe pain with a fever needs
      emergency assessment.
    evidence_gap: Hospital treatment is only one part of kidney stone care. Published procedure counts exclude stones that pass at
      home and cannot establish national prevalence.
    symptoms:
    - Pain may start at the side of the back and move towards the groin. Nausea or blood in the urine can occur. Some stones are
      found during scans for other reasons before they cause symptoms.
    causes:
    - Stones form when minerals crystallise in urine. Smaller stones can become painful if they block the ureter as they move. Risk
      can depend on hydration, family history and the type of stone.
    diagnosis:
    - A clinician checks for infection and whether urine can drain. Tests may include urine and blood samples and an ultrasound or
      CT. Tell staff if you have a single kidney or could be pregnant.
    care:
    - Many small stones pass without a procedure. A clinician can advise on pain relief, follow-up and when to return. Larger or
      persistent stones may need specialist treatment to break them up or remove them.
    complications:
    - A blocked kidney with infection can become life-threatening. Recurrent stones may warrant assessment of what they are made
      of and an individual prevention plan.
    help:
    - Get urgent help with severe pain, fever, shivering, repeated vomiting or difficulty passing urine. Contact a GP for blood in
      the urine even if the pain has stopped.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/kidney-stones/
  maple-syrup-urine-disease-overview:
    aliases: MSUD maple syrup urine disease newborn screening
    summary: Maple syrup urine disease is an inherited metabolic condition. Babies with severe forms can become ill in the first
      days after birth and need specialist treatment.
    symptoms:
    - A baby may feed poorly, vomit or become unusually sleepy. There may be unusual movements or a distinctive sweet smell. Seek
      help for signs of illness even if you notice no change in smell.
    causes:
    - The body cannot properly break down three branched-chain amino acids. These and their by-products can build up, particularly
      when a baby is ill or unable to feed.
    diagnosis:
    - A high-risk heel-prick result is followed by urgent specialist blood tests and sometimes genetic testing. Similar symptoms
      in a newborn can also signal infection or another emergency.
    care:
    - A metabolic team uses a carefully measured diet and specialist formula. It gives a written illness plan. Severe illness can
      require urgent hospital treatment to bring amino acid levels down.
    complications:
    - If levels rise severely, the brain can be affected, causing seizures or reduced consciousness. Regular blood monitoring supports
      safe growth and helps the team adjust treatment.
    help:
    - Contact the team immediately if a baby with confirmed or suspected MSUD feeds poorly, vomits or seems unusually sleepy. Follow
      the team's emergency instructions while arranging help.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/heel-prick-screening/conditions/
  mastoiditis:
    aliases: mastoiditis ear infection swelling behind ear child protruding ear
    summary: Mastoiditis is an uncommon but serious complication of some ear infections. Pain, redness or swelling behind the ear
      needs urgent assessment.
    evidence_gap: An overall Irish ear infection rate would include many milder illnesses and cannot estimate the frequency of mastoiditis.
      A specific national figure was not identified.
    symptoms:
    - A person may have fever, discharge or ongoing ear pain. Swelling behind the ear can make the outer ear stick out. Children
      can be tired, irritable or visibly unwell.
    causes:
    - Infection can spread from the middle ear to small air spaces in the bone behind it. The tissues can swell and sometimes form
      a collection of pus.
    diagnosis:
    - A GP or emergency clinician examines the ear and area behind it. Hospital staff may do blood tests or a scan if they need to
      assess spread or plan treatment.
    care:
    - Treatment usually takes place in hospital and may include antibiotics through a vein. An ear, nose and throat specialist may
      need to drain fluid or operate if the infection is complicated.
    complications:
    - Untreated infection can affect hearing or spread to nearby areas. Follow-up can include a further ear examination or a hearing
      check once the infection resolves.
    help:
    - Seek urgent medical help for swelling behind the ear, a protruding ear, or ear infection symptoms that worsen despite treatment.
      A very unwell child needs emergency assessment.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/mastoiditis/
  mcadd-symptoms-causes-and-treatment:
    aliases: MCADD fatty acid oxidation deficiency newborn screening
    summary: MCADD makes it harder for the body to use stored fat for energy. A child who is unwell or unable to eat can need urgent
      treatment to prevent low blood sugar.
    symptoms:
    - Babies often look healthy at birth. Illness or missed feeds can lead to vomiting, unusual sleepiness, weakness or reduced responsiveness.
      Symptoms can worsen quickly.
    causes:
    - The body usually uses stored fat between meals and during illness. In MCADD, an inherited enzyme deficiency limits this source
      of energy, especially when the body runs short of readily available glucose.
    diagnosis:
    - Newborn bloodspot screening can identify a pattern that suggests MCADD. Specialist tests confirm the diagnosis and help decide
      which advice applies to the child.
    care:
    - The metabolic team advises how long the child can safely go between feeds at different ages and gives an individual sick-day
      plan. Severe illness or repeated vomiting can require glucose through a vein in hospital.
    complications:
    - A metabolic crisis can cause seizures or brain injury. With early diagnosis and a reliable emergency plan, many children remain
      well and take part in normal activities.
    help:
    - If your child with MCADD cannot keep down their feeds or sick-day drinks, contact the metabolic service or emergency department
      as directed in their plan. Seek emergency help for reduced responsiveness or a seizure.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/heel-prick-screening/conditions/
  menacwy-vaccine:
    kind: procedure
    aliases: MenACWY vaccine meningococcal A C W Y booster secondary school vaccination
    summary: MenACWY protects against four groups of meningococcal bacteria. Meningococcal infection can cause meningitis or septicaemia,
      so symptoms still need urgent assessment after vaccination.
    symptoms:
    - The HSE school programme offers MenACWY in first year of secondary school. Some people may also be advised to have it because
      of travel or a medical risk.
    causes:
    - The vaccine helps the immune system recognise groups A, C, W and Y. MenB is a different group, for which a separate vaccine
      is used.
    diagnosis:
    - Read the consent information and tell the vaccinator about previous serious reactions or health conditions. Check with the
      local school team if you are unsure whether an offer applies.
    care:
    - The vaccinator checks consent and administers an injection, normally in the upper arm. Ask about documenting the dose and whom
      to call if you have questions afterwards.
    complications:
    - An aching arm or short-lived fever or headache can occur. Severe allergic symptoms require immediate help. The vaccine cannot
      protect against every cause of meningitis.
    help:
    - Contact the school vaccination team about a missed appointment or incomplete record. Seek emergency help if you suspect meningitis
      or septicaemia, regardless of vaccination history.
  menb-vaccine:
    kind: procedure
    aliases: MenB vaccine meningococcal B Bexsero infant vaccine immunisation Ireland
    summary: The MenB vaccine helps protect babies against meningococcal group B disease. Ireland includes it in the primary childhood
      immunisation programme.
    symptoms:
    - The HSE offers MenB at several routine visits during infancy. If an appointment was missed, ask the GP to check the child's
      record and arrange a catch-up plan if needed.
    causes:
    - The vaccine helps the immune system recognise group B meningococcal bacteria, which can cause serious bloodstream infection
      or meningitis. Other vaccines protect against different groups.
    diagnosis:
    - Bring the child's vaccine record and tell the GP about a current illness or previous reaction. Ask for instructions on fever
      or discomfort after vaccination, especially when other vaccines will be given at the same visit.
    care:
    - The vaccinator checks which vaccines are due and gives the injection. They can confirm when to return. Keep track of any fever
      and how your baby feeds or behaves afterwards.
    complications:
    - Soreness or fever can occur after vaccination. Follow the HSE and GP's age-specific advice and seek help if the baby is unusually
      unwell or difficult to wake.
    help:
    - Ask your GP about missed doses or concerns after the appointment. If there are possible signs of meningitis or septicaemia,
      seek emergency help immediately.
  meningitis-and-septicaemia:
    aliases: meningitis meningococcal septicaemia sepsis stiff neck non-blanching rash
    summary: Meningitis and septicaemia can become serious very quickly. Seek emergency help if you are concerned, even if there
      is no rash.
    emergency: If you suspect meningitis or septicaemia, call
    symptoms:
    - Fever, severe headache, a stiff neck, discomfort in bright light or unusual drowsiness are possible signs. Babies may feed
      poorly, be floppy or very irritable. A rash can be absent early in illness.
    causes:
    - Meningitis is inflammation of the membranes around the brain and spinal cord. Septicaemia involves serious infection in the
      bloodstream. Meningococcal bacteria can cause either or both, and other organisms can also cause meningitis.
    diagnosis:
    - Hospital staff assess symptoms and can take blood samples or a sample of spinal fluid when safe. Treatment for suspected bacterial
      disease may start before test results come back.
    care:
    - Bacterial meningitis needs urgent antibiotics. Severe illness can need support for breathing or circulation. Public health
      staff can advise close contacts if preventive treatment is needed.
    complications:
    - People recovering from bacterial meningitis may need hearing tests, rehabilitation or other follow-up. Vaccines protect against
      some common causes but do not cover every type of meningitis.
    help:
    - Call emergency services if meningitis or sepsis is possible. Do not wait for a rash, a stiff neck or for all symptoms to appear.
      If illness worsens unexpectedly, seek help again.
  menopause:
    aliases: menopause perimenopause postmenopause HRT periods symptoms Ireland
    summary: Menopause is reached after 12 months without a period due to the natural transition. Perimenopause is the time leading
      up to it, when symptoms can start even if periods continue.
    symptoms:
    - Periods can become irregular, lighter or heavier. Hot flushes, night sweats, changes in sleep or mood, and vaginal dryness
      can affect daily life. Symptoms can change over time.
    causes:
    - The ovaries release eggs less often and hormone levels fluctuate before falling. Symptoms and timing differ between people
      and can change after medical or surgical treatment.
    diagnosis:
    - A GP usually considers age, menstrual pattern and symptoms. Hormonal contraception can make the pattern harder to interpret.
      Symptoms at a younger age can need further assessment.
    care:
    - Treatment can include hormone replacement therapy, non-hormonal options or treatment focused on vaginal symptoms. Discuss your
      medical history and preferences as well as contraception if still needed.
    complications:
    - Changes in oestrogen can affect bone health and vaginal or urinary symptoms. Bleeding after menopause should be assessed, including
      when the amount is small.
    help:
    - Contact your GP if symptoms affect work, sleep or daily life, or appear before age 45. Arrange prompt review of bleeding after
      menopause and ask about follow-up if taking HRT.
  miscarriage:
    aliases: miscarriage early pregnancy loss threatened miscarriage missed miscarriage
    summary: Bleeding in pregnancy can have several causes. A maternity team can assess whether a pregnancy is continuing and explain
      the options if a miscarriage is confirmed.
    emergency: If you are bleeding heavily and feel faint or collapse, call
    symptoms:
    - Spotting or heavier bleeding, cramps and passing tissue can occur. Some miscarriages are first found at an ultrasound when
      there has been no bleeding or pain.
    causes:
    - Many early miscarriages happen because the pregnancy could not develop normally. Ordinary activity is unlikely to cause this.
      A clinician may suggest further investigation after recurrent losses or in certain other circumstances.
    diagnosis:
    - A vaginal ultrasound and sometimes repeat scans or blood tests can clarify what has happened. If there is no confirmed pregnancy
      in the womb, the team may need to rule out ectopic pregnancy even if bleeding has started.
    care:
    - If a miscarriage is confirmed, options may include waiting, medicines or a procedure. Ask about expected bleeding, pain relief,
      how completion is checked and who to contact if you need support.
    complications:
    - Heavy bleeding, infection and retained pregnancy tissue can need further treatment. Grief varies and can affect both the pregnant
      person and their partner. Ask about the hospital's bereavement service if you would like support.
    help:
    - Contact your maternity team, early pregnancy service or GP about bleeding or pain. Seek urgent care for heavy bleeding, fever,
      severe pain, faintness or new shoulder-tip pain.
    sources:
      Clinical guidance and further reading: https://research.ucc.ie/en/publications/national-clinical-practice-guideline-first-trimester-miscarriage-/
  mmr-vaccine:
    kind: procedure
    aliases: MMR vaccine measles mumps rubella MMRV childhood vaccination catch up
    summary: MMR protects against measles, mumps and rubella. In Ireland the recommended product and schedule can depend on your
      child's age and date of birth.
    symptoms:
    - Childhood immunisation includes protection against these three infections. A GP can review the record if a dose was missed,
      you have moved to Ireland or you are planning travel.
    causes:
    - The vaccine trains the immune system against measles, mumps and rubella. Depending on the child's schedule, protection against
      chickenpox may be offered in a combined product or separately.
    diagnosis:
    - Tell the vaccinator about previous reactions, pregnancy, medicines or conditions affecting the immune system and earlier vaccination.
      Bring the vaccine record if you have it.
    care:
    - A vaccinator checks which doses are due and gives the injection. Ask whether the child still needs another dose and where subsequent
      doses will be offered.
    complications:
    - A sore arm or a short fever can occur. A temporary rash may appear later. For symptoms of severe allergy after vaccination,
      call emergency services.
    help:
    - Ask your GP or local immunisation team to review missing or uncertain records. If measles exposure is suspected, contact a
      clinician promptly and phone before attending.
  mrsa:
    aliases: MRSA methicillin resistant Staphylococcus aureus screening swabs carrier
    summary: MRSA is a type of staph bacteria resistant to several antibiotics. It can be carried on the skin or in the nose without
      making someone ill.
    symptoms:
    - Carriers usually feel well. Infection can cause a red painful area, a wound that drains or fever. The signs vary if the infection
      is deeper or affects the bloodstream.
    causes:
    - MRSA can enter the body through a break in the skin or through a medical device. It can pass by contact, so hospital teams
      may take additional hygiene precautions.
    diagnosis:
    - Swabs can check for carriage or identify bacteria in a wound. If serious infection is suspected, the team can take blood or
      other samples. Laboratory results help distinguish MRSA from other staph.
    care:
    - A hospital may use a temporary skin and nasal treatment to reduce carriage before some procedures. A confirmed infection may
      need wound care or antibiotics chosen using lab results.
    complications:
    - An infection can deepen or spread, particularly in a person with a medical device or weakened immunity. A positive carriage
      result alone does not mean this will happen.
    help:
    - Contact staff if your wound becomes more painful, hot or leaky, or if you develop a fever. Mention any previous MRSA result
      to the team looking after you.
  nappy-rash:
    aliases: nappy rash diaper rash infant sore bottom barrier cream
    summary: Nappy rash often improves with frequent changes and a simple skin barrier. Ask for advice if the rash spreads, becomes
      painful or fails to improve.
    evidence_gap: Nappy rash is commonly managed at home, and the Irish data reviewed do not establish a national rate for all episodes.
    symptoms:
    - The skin in contact with a nappy can become sore or inflamed. Spots in the skin folds or spread beyond the main rash can suggest
      a different cause such as thrush.
    causes:
    - Moisture, friction and contact with urine or stool can irritate skin. A recent bout of diarrhoea can contribute. An infection
      can sometimes develop in irritated skin.
    diagnosis:
    - A pharmacist or clinician can check the pattern. Point out any blisters, open sores or fever and describe products used, including
      wipes and creams.
    care:
    - Change wet or dirty nappies promptly, clean gently and allow the skin to dry. A suitable barrier product can protect irritated
      skin. A clinician can advise if a specific medicine is needed.
    complications:
    - Broken skin can become infected. Persistent or extensive rash may need a review for thrush, eczema or another condition.
    help:
    - Ask a pharmacist or GP for advice if the rash is not improving, is spreading or seems very sore. Seek prompt care if your baby
      develops fever or appears unwell.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/nappy-rash/
  necrotising-fasciitis:
    aliases: necrotising fasciitis necrotizing fasciitis rapidly spreading skin infection
    summary: Necrotising fasciitis is a rare infection that spreads through tissue beneath the skin. Severe pain that is much worse
      than the visible skin change is a warning sign.
    emergency: For severe and rapidly worsening pain around a wound with fever or serious illness, call
    evidence_gap: Irish invasive group A strep surveillance includes several syndromes and does not count necrotising fasciitis as
      a separate total. Other bacteria can cause the condition as well.
    symptoms:
    - Early signs can include rapidly worsening pain, swelling or warmth, sometimes after a small wound or surgery. Fever, blisters,
      dark patches, numbness or sudden confusion can develop as illness progresses.
    causes:
    - Bacteria can infect deeper tissue and damage its blood supply. The visible skin may change after the underlying infection has
      already become severe.
    diagnosis:
    - Emergency staff assess how fast symptoms have changed and whether circulation or organs are affected. Blood tests and imaging
      can help, but urgent surgery may be needed to identify and treat the infection.
    care:
    - Treatment requires urgent hospital care. It can include surgery to remove infected tissue, antibiotics through a vein and organ
      support. More than one operation may be needed.
    complications:
    - The infection can cause sepsis and permanent tissue damage. Recovery can involve wound care, rehabilitation and sometimes reconstruction.
    help:
    - Seek emergency help for severe, rapidly worsening pain or swelling with fever or severe illness. Tell staff about any recent
      injury or operation and how quickly symptoms changed.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/necrotising-fasciitis/
  newborn-hearing-screening:
    kind: test
    aliases: newborn hearing screening baby OAE AABR audiology
    summary: The newborn hearing screen checks how a baby's ears respond to sound. If either ear has no clear response, follow-up
      helps establish whether the baby needs support.
    symptoms:
    - The screening is offered to eligible babies soon after birth. Early hearing assessment and support can help with speech and
      language development.
    causes:
    - The first test records whether the inner ear responds to a soft sound. A second type may be used to record how the hearing
      nerve and brain respond.
    diagnosis:
    - The screening team usually offers the test in the maternity unit. If it was missed or could not be completed, ask about an
      outpatient appointment. A quiet, settled baby makes testing easier.
    care:
    - A screener places a small soft tip in the ear. A second test may also use small sensors on the head. The tests can be done
      while the baby rests.
    complications:
    - Temporary fluid in the ear or movement during testing can make the response unclear. Some babies receive a referral because
      of other risk factors even when the immediate screen is clear.
    help:
    - Attend any audiology appointment offered. Keep watching how your baby responds to sound and voices. Discuss later concerns
      with your public health nurse or GP even if the newborn screen was clear.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/newborn-hearing-screening/why-we-screen/
  obstructive-sleep-apnoea:
    aliases: obstructive sleep apnoea OSA sleep apnea CPAP pauses snoring
    summary: Obstructive sleep apnoea interrupts breathing repeatedly during sleep. Loud snoring with pauses or choking sounds and
      persistent daytime sleepiness is worth discussing with your GP.
    symptoms:
    - A partner may notice pauses, gasps or snoring. You may wake unrefreshed or with a headache, or struggle to stay alert in the
      day. Some people have symptoms without noticing loud snoring.
    causes:
    - During sleep the airway can narrow or close briefly. Repeated interruptions disturb sleep and can lower oxygen levels. Several
      factors, including airway anatomy and weight, can influence risk.
    diagnosis:
    - Assessment includes questions about sleep and daytime alertness. A sleep study, often performed at home, checks breathing and
      oxygen. A specialist interprets the findings and symptom burden together.
    care:
    - Treatment can involve a CPAP machine, a dental device or other measures selected with the sleep team. If CPAP is uncomfortable,
      ask about changing the mask or reviewing the fit rather than abandoning follow-up.
    complications:
    - Untreated daytime sleepiness raises accident risk. Sleep apnoea is also associated with high blood pressure. If drowsy, avoid
      driving and discuss Irish fitness-to-drive requirements with your clinician.
    help:
    - Speak to your GP if someone sees repeated breathing pauses or daytime sleepiness is affecting activity. Report any problems
      staying awake while driving promptly.
  organ-donation:
    kind: service
    aliases: organ donation transplantation Ireland donor opt out family consent living kidney donor
    summary: Organ donation can take place after death or, for some organs, during a donor's lifetime. Discussing your wishes with
      family helps them understand what you would want.
    symptoms:
    - A transplant may be considered for people with serious organ failure. A specialist team assesses whether a recipient is suitable.
      A potential living donor is assessed independently.
    causes:
    - Donor and recipient matching depends on the organ and the circumstances. Donation after death is possible only in certain situations,
      and specialist teams assess each case.
    diagnosis:
    - Ireland has a soft opt-out system for deceased donation for eligible adults. Read the HSE guidance on how it applies, who is
      excluded and how to record an objection. Tell those close to you about your decision.
    care:
    - The organ donation team checks the person's wishes and discusses donation with family when appropriate. Living donation involves
      separate medical checks, informed consent and a recovery plan.
    complications:
    - A transplant recipient will need ongoing specialist care. Living donors also need follow-up. Donation at the end of life is
      considered alongside support for the family.
    help:
    - Use the HSE's organ donation information if you want to check the opt-out process or learn about living donation. Ask your
      treating team about transplant assessment if you have organ failure.
  overactive-thyroid-hyperthyroidism:
    aliases: hyperthyroidism overactive thyroid Graves disease thyroid high hormones
    summary: An overactive thyroid can cause a fast heartbeat, tremor and weight loss. Blood tests and further assessment can identify
      the cause and guide treatment.
    evidence_gap: Prescription totals and hospital activity miss untreated cases and can include other thyroid conditions. A directly
      comparable Irish population figure was not found.
    symptoms:
    - Symptoms can include feeling hot, sweating, anxiety, loose stools or losing weight despite eating normally. Graves' disease
      can also cause eye symptoms such as irritation or prominent eyes.
    causes:
    - Excess thyroid hormone speeds up processes around the body. Graves' disease can stimulate the gland, and thyroid nodules or
      inflammation can also affect hormone levels.
    diagnosis:
    - A clinician usually checks thyroid-stimulating hormone and thyroid hormones. Further blood tests or imaging may distinguish
      Graves' disease, thyroid nodules and other possible causes.
    care:
    - Options can include medicines to control hormone levels, radioactive iodine or surgery, depending on the cause. Ask about monitoring
      and which symptoms or side effects should prompt contact.
    complications:
    - Persistent overactivity can affect heart rhythm and bone health. Rarely, severe illness with a very fast heartbeat, fever or
      confusion needs emergency assessment.
    help:
    - Contact your GP for continuing palpitations, tremor or unexplained weight loss. Seek urgent care for severe breathlessness,
      fever with confusion, collapse or chest pain.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/overactive-thyroid-hyperthyroidism/
  panic-attacks:
    aliases: panic attack sudden fear fast heart breathing tingling panic symptoms
    summary: A panic attack can cause a sudden rush of fear with real physical symptoms. A first or different episode can need medical
      assessment because other conditions can feel similar.
    evidence_gap: Surveys of diagnosed panic disorder do not count all individual panic attacks. An equivalent Irish population measure
      for attacks was not identified.
    symptoms:
    - Symptoms may include a pounding heart, trembling, dizziness, tightness in the chest, shortness of breath or tingling. The feeling
      often builds quickly and then eases.
    causes:
    - The body's threat response can activate strongly, sometimes without an obvious trigger. Rapid breathing can make light-headedness
      or tingling worse. Physical illness or substances can also cause similar symptoms.
    diagnosis:
    - A clinician asks how the episode started, how long it lasted and what else happened. They can assess heart, lung or other causes
      if features do not fit a familiar pattern.
    care:
    - If a clinician has helped you recognise panic attacks, use the plan you agreed, such as slowing your breathing and allowing
      the feeling to pass. Repeated episodes may respond to talking therapy or other treatment.
    complications:
    - Fear of future attacks can lead to avoiding places or activities. A single attack does not establish panic disorder. Recurrent
      attacks and ongoing worry can need a separate assessment.
    help:
    - Get urgent assessment for new chest pain, fainting, obvious breathing difficulty or a first episode that differs from anything
      you have had before. Contact your GP when attacks recur.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/panic-attacks/
  panic-disorder:
    aliases: panic disorder repeated panic attacks fear of panic avoidance
    summary: Panic disorder involves repeated unexpected panic attacks and continued worry or changes in behaviour because another
      might happen.
    evidence_gap: Broad anxiety survey estimates do not identify clinically diagnosed panic disorder. An Irish national estimate
      specific to the disorder was not identified.
    symptoms:
    - Attacks can include racing heartbeat, shaking, breathlessness and fear that something dangerous is happening. Between attacks,
      you may monitor physical sensations or avoid places associated with them.
    causes:
    - Panic can form a cycle in which a physical sensation is interpreted as dangerous, increasing anxiety and symptoms. The pattern
      can persist even when there is no obvious external threat.
    diagnosis:
    - A clinician considers whether the attacks recur unexpectedly and whether worry or avoidance continues between them. They can
      also check for physical conditions or substances that could account for similar symptoms.
    care:
    - Treatment may include cognitive behavioural therapy that gradually helps people face feared sensations and situations. A GP
      can discuss whether medication is appropriate and how to review response.
    complications:
    - The disorder can restrict travel, work or social life. It can occur alongside agoraphobia or depression, which are worth mentioning
      when planning treatment.
    help:
    - Ask your GP for help if attacks recur or avoidance is growing. Seek urgent medical assessment for unexplained collapse, severe
      chest pain or a new symptom that does not fit your usual pattern.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/panic-disorder/
  peak-flow-test:
    kind: test
    aliases: peak flow peak expiratory flow PEF asthma monitoring peak flow meter
    summary: A peak flow test measures how fast you can blow air out. Repeated readings can help track asthma when used with a clear
      action plan.
    evidence_gap: Many readings are taken at home. There is no national record counting home peak flow tests, and asthma prevalence
      measures something different.
    symptoms:
    - A clinician may ask for regular peak flow readings to investigate symptoms or track how well asthma is controlled. A single
      reading has limited value on its own.
    causes:
    - A peak flow meter records the fastest part of a forceful breath out. Results depend on how the test is performed and can vary
      from one person to another.
    diagnosis:
    - Ask when to measure and whether you should do so before or after inhalers. If you are using the meter at home, ask the healthcare
      professional to check your technique first.
    care:
    - After resetting the meter, take a deep breath, seal your lips around the mouthpiece and blow hard and fast. Repeat as instructed
      and record the highest of the efforts.
    complications:
    - Readings are most useful alongside symptoms, inhaler use and the person's usual best. Follow your written asthma plan for significant
      changes or worsening symptoms.
    help:
    - Tell your clinician if readings fall repeatedly or you are relying on a reliever more often. Seek urgent help for severe breathing
      difficulty, whatever the meter shows.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/peak-flow-test/
  phenylketonuria-pku-symptoms-causes-and-treatment:
    aliases: PKU phenylketonuria phenylalanine heel prick
    summary: Phenylketonuria affects how the body handles an amino acid in protein. Irish newborn screening helps start treatment
      before high levels affect brain development.
    symptoms:
    - A newborn with PKU usually looks well. Untreated PKU can later cause developmental and learning problems. A screening test
      can detect the risk long before those changes are apparent.
    causes:
    - The body has difficulty breaking down phenylalanine. It accumulates in the blood if dietary intake is higher than the person
      can process.
    diagnosis:
    - Specialists investigate a raised result with blood tests and, where appropriate, genetic confirmation. The result helps the
      team set individual monitoring and treatment targets.
    care:
    - A metabolic dietitian teaches the family to manage phenylalanine intake and give prescribed protein substitutes. The team follows
      blood levels as needs change with growth. Some people may be eligible for additional treatment.
    complications:
    - Treatment protects development. High phenylalanine levels during pregnancy can harm a developing baby, so anyone with PKU planning
      a pregnancy should seek specialist advice well in advance.
    help:
    - Follow the newborn screening team's instructions promptly. Contact the metabolic service if you are running out of prescribed
      products, having difficulties following treatment or planning a pregnancy.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/heel-prick-screening/conditions/
  placenta-praevia:
    aliases: placenta praevia placenta previa low lying placenta pregnancy bleeding
    summary: A placenta that lies close to or over the cervix can affect how you give birth. If you have a low-lying placenta and
      develop bleeding, contact your maternity unit immediately.
    emergency: If vaginal bleeding is heavy and you feel faint or collapse, call
    symptoms:
    - Many people feel well and find out at their routine scan. Bleeding later in pregnancy can be painless, although contractions
      or pain are also possible.
    causes:
    - The placenta attaches in the lower part of the womb. As the womb grows the distance between the placenta and the cervix can
      increase. A placenta still covering the cervix later in pregnancy can block the baby's route out.
    diagnosis:
    - An ultrasound shows where the placenta lies. A repeat scan later in pregnancy, sometimes performed vaginally, helps clarify
      its distance from the cervix and guide birth planning.
    care:
    - Care depends on the scan, any bleeding and the stage of pregnancy. The team will explain when to contact the unit and whether
      a planned caesarean birth is needed. Some people need hospital observation.
    complications:
    - Bleeding can be sudden or heavy, and some babies need to be born early. A low placenta over a previous caesarean scar can prompt
      additional checks for an abnormally adherent placenta.
    help:
    - Contact the maternity unit immediately for bleeding, contractions or pain if you have been told your placenta is low. Heavy
      bleeding or feeling faint needs emergency care.
  plagiocephaly:
    aliases: plagiocephaly flat head syndrome baby flattening positional brachycephaly
    summary: A flat patch on a baby's head can develop from pressure on one area. Keep using safe back sleeping and ask a healthcare
      professional if the shape worries you.
    evidence_gap: A verified Irish prevalence figure was not found. Estimates from care referrals would exclude mild flattening that
      families manage through advice or normal development.
    symptoms:
    - The back or one side of the head may look flatter. The ear or forehead on the flatter side can look slightly further forward.
      A baby may prefer to turn their head one way.
    causes:
    - A baby's skull is still developing. Repeated pressure on the same part of it can change its shape. Limited neck movement can
      contribute.
    diagnosis:
    - A GP or public health nurse looks at head shape, growth and neck movement. They can check for less common causes, including
      early fusion of skull bones, if the pattern is unusual.
    care:
    - Use supervised tummy time while the baby is awake and vary how you hold, carry or position them for play. A physiotherapist
      can help if neck movement is limited.
    complications:
    - Positional flattening often improves as the baby gains head control and moves more. A marked or changing shape may need follow-up,
      especially if it was present early.
    help:
    - Discuss concerns with your public health nurse or GP. Keep placing your baby on their back for sleep. Seek review if they struggle
      to turn their head or the shape is becoming more noticeable.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/plagiocephaly/
  pneumonia:
    aliases: pneumonia lung infection chest cough fever community acquired hospital
    summary: Pneumonia is an infection of the lungs. It may cause fever, cough, shortness of breath and chest pain that is worse
      when you breathe or cough.
    emergency: If a person is severely short of breath, has blue or grey lips, or becomes confused or difficult to wake, call
    symptoms:
    - People may have a dry cough or cough up mucus, feel feverish or become unusually tired. Older adults may first appear confused
      or weak. Children can show fast breathing or feed poorly.
    causes:
    - Infection makes air sacs inflamed and can fill them with liquid. Viruses and bacteria are common causes, and causes cannot
      always be distinguished just from the symptoms.
    diagnosis:
    - A clinician checks breathing rate, oxygen level and chest sounds. A chest X-ray can help confirm pneumonia when hospital assessment
      is needed or the diagnosis is uncertain.
    care:
    - Bacterial pneumonia is treated with antibiotics. Hospital care may provide oxygen, fluids or more intensive support. Even as
      the infection clears, energy and exercise tolerance can take time to recover.
    complications:
    - Pneumonia can cause breathing failure, sepsis or infected fluid around a lung. Tell the treating team if symptoms are getting
      worse or you are failing to improve as expected.
    help:
    - Contact a GP urgently for breathlessness, pain on breathing, coughing blood or suspected pneumonia in someone at higher risk.
      Get emergency help for severe breathing problems or confusion.
  postmenopausal-bleeding:
    aliases: postmenopausal bleeding spotting after menopause vaginal bleeding after periods stop
    summary: Bleeding after menopause needs a GP assessment, even if it happens once or is only light spotting. There are several
      possible causes, including changes that need treatment.
    evidence_gap: Irish cancer figures do not measure all postmenopausal bleeding. Many people assessed for the symptom have a non-cancerous
      cause.
    symptoms:
    - Bleeding may appear as pink or brown discharge, spotting on tissue or a larger amount of blood. Tell the clinician when your
      periods stopped and whether you are taking HRT.
    causes:
    - Thinning of vaginal or womb tissue and non-cancerous growths are possible causes. Cancer of the womb lining is another reason
      the symptom is investigated.
    diagnosis:
    - A GP reviews bleeding and medicines and may refer for an examination. Tests can include vaginal ultrasound or a sample from
      the womb lining, depending on findings.
    care:
    - Treatment depends on the cause. The clinician might manage vaginal dryness, remove a polyp or arrange specialist treatment
      for a more serious finding.
    complications:
    - Even when the first episode settles, a repeat episode can need reassessment. Ask how you will receive results, and whether
      new bleeding means you should contact the service directly.
    help:
    - Contact your GP promptly for any bleeding after menopause. Get urgent help if bleeding is heavy and you feel dizzy, faint or
      unwell.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/postmenopausal-bleeding/
  postpartum-haemorrhage1:
    aliases: postpartum haemorrhage PPH heavy bleeding after birth obstetric haemorrhage
    summary: Heavy bleeding after birth can quickly become an emergency. If you feel faint or weak or are passing large clots with
      heavy bleeding, get immediate help.
    emergency: If you are bleeding heavily after birth and feel weak, faint or breathless, call
    symptoms:
    - Bleeding may be heavy and continuous or suddenly increase after it had been settling. A fast heartbeat, sweating, dizziness
      or faintness can suggest significant blood loss. Bleeding can occur soon after delivery or later in recovery.
    causes:
    - The womb may fail to contract strongly enough after birth. Tears, retained placental tissue or problems with blood clotting
      can also cause excessive bleeding.
    diagnosis:
    - The maternity team checks the amount of bleeding, vital signs and possible causes. Examination, blood tests or ultrasound can
      help guide further treatment once emergency care has started.
    care:
    - Treatment depends on the cause and severity. It may include medicines to contract the womb, fluids or blood products and a
      procedure to stop the bleeding. Recovery can include treatment for anaemia.
    complications:
    - Severe blood loss can cause shock. Weeks later you may still feel exhausted or dizzy. Ask when your blood count should be rechecked
      and whether the bleeding should be reviewed before another pregnancy.
    help:
    - Tell maternity staff immediately if you are bleeding heavily. After discharge, contact the maternity unit for increasing bleeding,
      large clots or fever. Get emergency help if you feel faint, weak or breathless with heavy bleeding.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/pregnancy-birth/birth/health-after-birth/medical-help-after-birth/
  pre-eclampsia:
    aliases: pre eclampsia pregnancy hypertension protein urine postpartum preeclampsia
    summary: Pre-eclampsia is a pregnancy-related condition that can affect several organs. It can also develop after birth. A severe
      headache, vision changes or pain under the ribs need urgent assessment.
    emergency: If someone who is pregnant or has recently given birth has a seizure or collapses, call
    symptoms:
    - It is often first noticed during routine blood pressure or urine checks. Symptoms can include a severe headache, blurred vision,
      pain under the ribs, vomiting or a sudden increase in swelling.
    causes:
    - Pre-eclampsia involves raised blood pressure and can affect the kidneys, liver or other organs. Problems with placental function
      can also affect the baby's growth.
    diagnosis:
    - The maternity team checks blood pressure and may test urine and blood. Ultrasound or monitoring may be needed to assess how
      the baby is doing. Tell the team if you have already given birth.
    care:
    - Care depends on how unwell you are and how far along the pregnancy is. It may include hospital observation, medicine for blood
      pressure or to prevent seizures, and a plan for when to deliver.
    complications:
    - It can cause eclampsia, stroke, problems with liver or kidney function, or a need for premature delivery. Blood pressure can
      remain high after the birth, so follow the maternity team's postnatal review plan.
    help:
    - Contact your maternity unit immediately if you develop severe headache, vision changes, upper abdominal pain or sudden swelling
      during pregnancy or after birth. Do not wait until your next routine appointment.
  pregnancy:
    aliases: high blood pressure in pregnancy gestational hypertension chronic hypertension antenatal blood pressure
    summary: Raised blood pressure in pregnancy needs monitoring even when you feel well. A maternity team can help distinguish long-standing
      hypertension, gestational hypertension and pre-eclampsia.
    evidence_gap: Irish surveillance figures for seizures due to eclampsia cannot describe all high blood pressure during pregnancy.
      Those figures exclude uncomplicated gestational or chronic hypertension.
    symptoms:
    - High blood pressure often causes no symptoms. A severe headache, visual changes, pain under the ribs or new sudden swelling
      can be signs of a more serious pregnancy complication.
    causes:
    - Some people have high blood pressure before pregnancy. In others it starts during pregnancy. Pre-eclampsia can involve raised
      blood pressure with changes in urine, blood tests or how other organs are working.
    diagnosis:
    - Your team checks blood pressure, takes a history and may test urine or blood. Depending on the findings, they may assess the
      baby's growth or arrange more frequent checks.
    care:
    - A clinician can decide whether blood pressure medicine is needed and which medicines are suitable during pregnancy. If you
      are asked to check blood pressure at home, get clear instructions on when to call and whom to contact.
    complications:
    - Poorly controlled blood pressure can raise the risk of complications for the pregnant person and baby. Follow-up after birth
      is important because blood pressure can remain raised or rise again.
    help:
    - Call the maternity unit immediately if severe symptoms develop or if readings reach the limits your team gave you. If you take
      blood pressure medicine and find out you are pregnant, contact the prescriber promptly for a review.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/pre-eclampsia/
  reflux-babies:
    aliases: baby reflux infant posseting milk spit up silent reflux GORD
    summary: Many babies bring up a little milk after feeding. A baby who is growing and comfortable usually needs different care
      from a baby who feeds poorly or has concerning vomiting.
    evidence_gap: Studies use different definitions of normal posseting and reflux disease. The sources consulted do not establish
      an Irish national rate of reflux disease in babies.
    symptoms:
    - Milk may come back up during or after feeding. Some babies appear uncomfortable. Green or bloody vomit, forceful vomiting or
      poor weight gain are warning signs rather than typical mild reflux.
    causes:
    - Babies have liquid feeds and the muscle at the top of their stomach is still developing. Milk can move upwards easily. Other
      conditions can cause vomiting or feeding difficulty.
    diagnosis:
    - A GP or public health nurse asks how feeds go, whether the baby seems comfortable and how weight is changing. Testing is usually
      reserved for concerning symptoms or uncertainty.
    care:
    - Keep the baby upright while awake after feeding if this helps. Always put the baby down to sleep on their back on a flat surface.
      Ask your clinician about changes to feeding or the need for treatment.
    complications:
    - Feeding difficulties can reduce weight gain or hydration. Frequent uncomplicated posseting often improves during the first
      year, as babies develop and spend more time upright.
    help:
    - Speak to a clinician if feeds are difficult, the baby is very distressed or growth is a concern. Get urgent help for green
      or bloody vomit, forceful vomiting or signs of dehydration.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/reflux-babies/
  scarlet-fever:
    aliases: scarlet fever strep A fever sandpaper rash strawberry tongue
    summary: Scarlet fever usually causes a sore throat and a rough rash. Contact your GP if you suspect it so they can decide whether
      antibiotics are needed.
    evidence_gap: HPSC does not require notification of scarlet fever cases. Irish invasive group A strep figures cover severe infections
      and cannot stand in for scarlet fever incidence.
    symptoms:
    - A fever and sore throat may come first. A rough, fine rash often appears on the body, and the tongue can become red and bumpy.
      The rash may be easier to feel than see on dark skin.
    causes:
    - Some group A streptococcal infections cause a rash because of substances the bacteria release. Scarlet fever spreads through
      close contact, including in households and schools.
    diagnosis:
    - A GP checks the mouth, throat and rash and asks about contacts. Other illnesses can also cause a fever with rash, especially
      if the child is unusually unwell.
    care:
    - A doctor may prescribe antibiotics. Ask when it is safe to return to school or childcare. Keep drinks available and report
      any difficulty swallowing.
    complications:
    - Most people recover well. A worsening illness, increasing breathing difficulty or rapid decline can indicate a serious infection
      requiring urgent review.
    help:
    - Call your GP about a fever with a rough rash or likely exposure. Seek emergency help if a child has difficulty breathing, is
      difficult to wake or deteriorates rapidly.
    sources:
      Clinical guidance and further reading: https://www.hpsc.ie/a-z/other/scarletfever/factsheet
  shortness-breath:
    aliases: shortness of breath dyspnoea breathlessness breathing difficulty
    summary: Breathlessness can develop suddenly or gradually. Sudden severe difficulty breathing needs emergency help, particularly
      with chest pain or a change in colour.
    emergency: For severe or sudden breathing difficulty, blue lips, collapse or chest pain with breathlessness, call
    evidence_gap: Diagnosis-specific data on asthma, COPD, heart disease or other conditions do not count breathlessness as a symptom
      across the Irish population.
    symptoms:
    - Notice whether it starts at rest or with activity, gets worse lying down, or comes with wheeze, fever, chest pain or leg swelling.
      These details help identify possible causes.
    causes:
    - Heart or lung disease, infection, anaemia and anxiety can all contribute. Sometimes more than one factor is involved. A new
      or severe episode needs assessment before attributing it to a familiar cause.
    diagnosis:
    - A clinician checks oxygen level, breathing effort and other signs. Depending on how it started and the examination, they may
      use a heart tracing, blood tests, imaging or lung function tests.
    care:
    - Treatment depends on the cause and urgency. Follow any written plan for a known heart or lung condition while arranging help
      for significant changes. New symptoms may need different treatment.
    complications:
    - Severe breathlessness can signal a heart or lung emergency. Gradual symptoms can limit sleep or mobility and may point to an
      underlying condition that can be treated.
    help:
    - Get emergency help for severe or sudden symptoms. Ask your GP for assessment if your usual activity is increasingly limited
      or you are waking up short of breath.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/shortness-breath/
  sickle-cell-disease:
    aliases: sickle cell disease SCD sickle cell crisis inherited haemoglobin sickle cell anaemia
    summary: Sickle cell disease is an inherited blood condition. Fever, chest symptoms or severe pain that is difficult to control
      can need urgent treatment.
    emergency: If a person with sickle cell disease has severe breathing difficulty, signs of stroke or collapses, call
    symptoms:
    - Pain episodes can develop suddenly in bones, joints or other areas. Anaemia can cause fatigue or breathlessness. A fever can
      be particularly important even when there are no other signs of infection.
    causes:
    - A change in haemoglobin can make red blood cells rigid under certain conditions. These cells break down sooner and can obstruct
      small blood vessels, causing pain or organ injury.
    diagnosis:
    - A blood test can identify the type of haemoglobin. A specialist can explain the diagnosis, how it differs from having sickle
      cell trait and whether relatives might benefit from testing.
    care:
    - Care can include infection prevention, a personalised pain plan and medicines or transfusions where indicated. Haematology
      teams monitor for complications and advise on hydration, travel and pregnancy.
    complications:
    - Complications can include serious infection, stroke and acute chest syndrome. The latter can cause fever, chest pain and breathing
      symptoms and requires urgent hospital assessment.
    help:
    - Follow the specialist team's emergency plan. Seek urgent assessment for fever, new chest pain, breathlessness or severe pain
      not controlled by your plan. Mention sickle cell disease promptly to emergency staff.
  spirometry:
    kind: test
    aliases: spirometry breathing test FEV1 FVC asthma COPD lung function
    summary: Spirometry measures how much and how quickly you can breathe out. It can help assess conditions such as asthma and COPD.
    evidence_gap: Published programme activity does not cover all spirometry carried out in general practice and hospitals. A consistent
      national total was not identified.
    symptoms:
    - A clinician may recommend spirometry for a persistent cough, wheeze or breathlessness, or to follow a diagnosed lung condition.
    causes:
    - You breathe into a device that measures the air you blow out. A clinician compares the results with expected values and may
      compare the tracing before and after an inhaled medicine.
    diagnosis:
    - Follow the clinic's instructions about inhalers. Tell staff if you have had recent surgery, chest symptoms, a lung infection
      or another health change that might affect the test.
    care:
    - You take a deep breath and blow into a mouthpiece as instructed. You may be asked to repeat the effort several times to confirm
      that the tracing is reliable.
    complications:
    - Some people feel briefly light-headed or cough during the test. Tell the technician if this happens. A result depends partly
      on technique and has to be read alongside your symptoms.
    help:
    - Check who will go through the result with you and whether you need another test. Severe or worsening breathing difficulty needs
      assessment without waiting for spirometry.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/spirometry/
  spotting:
    aliases: spotting early pregnancy bleeding first trimester blood pregnancy
    summary: Light bleeding in early pregnancy can have more than one cause. Tell your maternity or early pregnancy team, particularly
      if you also have pain.
    emergency: For heavy bleeding with severe pain, faintness or collapse in early pregnancy, call
    evidence_gap: Irish miscarriage and ectopic pregnancy figures cannot measure all episodes of spotting. Those outcomes capture
      different events, and many people with spotting have an ongoing pregnancy.
    symptoms:
    - Spotting may be noticed when wiping or as a small amount on a pad. Describe the amount, whether it is increasing and whether
      there is pain on one side, dizziness or shoulder-tip pain.
    causes:
    - Bleeding can come from the cervix, occur during an ongoing pregnancy or be associated with miscarriage or ectopic pregnancy.
      The colour of the blood alone cannot determine the cause.
    diagnosis:
    - A healthcare professional will ask how far along you are and about symptoms and prior pregnancies. Depending on timing, an
      ultrasound or repeat blood tests may be needed to confirm where the pregnancy is and how it is progressing.
    care:
    - Follow the maternity team's instructions for monitoring and repeat tests. Ask who to call if bleeding increases before the
      appointment. Treatment depends on the cause.
    complications:
    - A scan very early in pregnancy may be inconclusive. Keep scheduled follow-up even if spotting stops, particularly if pregnancy
      location has not yet been confirmed.
    help:
    - Contact your GP or maternity team about bleeding. Get urgent assessment for severe or one-sided pain, shoulder-tip pain, heavier
      bleeding or light-headedness.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/spotting/
  tdap-vaccine:
    kind: procedure
    aliases: Tdap booster tetanus diphtheria whooping cough pertussis school vaccine
    summary: The Tdap booster refreshes protection against tetanus, diphtheria and whooping cough. The Irish school programme offers
      it during first year of secondary school.
    symptoms:
    - Children receive earlier vaccines against these infections. A booster helps keep immunity up as they get older. The separate
      pregnancy vaccination advice should be discussed with maternity care.
    causes:
    - The booster reminds the immune system how to recognise the three conditions. It includes an acellular pertussis component and
      protection against tetanus and diphtheria toxins.
    diagnosis:
    - Read the school's information and consent form and tell staff about serious reactions to previous doses. If records are incomplete,
      ask the team which doses are needed.
    care:
    - The vaccinator checks eligibility and consent and gives the injection, usually into the upper arm. Make a note of the date
      for your vaccination records.
    complications:
    - A sore arm, tiredness or mild fever can occur briefly. Emergency treatment is needed for symptoms of a severe allergic reaction.
    help:
    - Contact the school vaccination team or local immunisation office about a missed offer. Pregnant people should discuss the separately
      recommended whooping cough dose with their maternity team.
  tongue-tie-and-breastfeeding:
    aliases: tongue tie ankyloglossia breastfeeding latch feeding newborn frenotomy
    summary: Tongue-tie can limit tongue movement and sometimes affects feeding. A feeding assessment can help determine whether
      it is causing the difficulty.
    evidence_gap: Procedure counts capture babies treated in particular services. They cannot estimate how many babies have a tongue-tie,
      including those who feed without problems.
    symptoms:
    - Possible signs include trouble attaching to the breast, frequent loss of latch, nipple pain or poor milk transfer. A visible
      band under the tongue can also be present when feeding is going well.
    causes:
    - A band of tissue connects the tongue to the mouth floor. If it limits useful tongue movement, it may affect feeding. Other
      causes of a difficult latch or slow weight gain are common.
    diagnosis:
    - A clinician observes a feed, looks at how the tongue moves and checks the baby's weight pattern and nappies. A description
      based only on how the tongue looks is less informative.
    care:
    - Positioning support and feeding review can help. A specialist may discuss releasing the tie if it affects feeding after support.
      Ask about benefits, risks and the plan afterwards.
    complications:
    - Persistent poor milk transfer can affect weight or hydration and can make breastfeeding painful. A procedure does not guarantee
      that every feeding issue will resolve.
    help:
    - Contact a public health nurse, GP, midwife or lactation service if feeding is painful or a baby has trouble transferring milk.
      Get prompt advice for poor intake or fewer wet nappies.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/tongue-tie-and-breastfeeding/
  torticollis-wry-neck-in-babies:
    aliases: baby torticollis wry neck tight neck prefers looking one side
    summary: A baby with torticollis may hold their head tilted or turn mainly to one side. Early assessment can help improve movement
      and prevent pressure on one part of the head.
    evidence_gap: Some referred babies have neck tightness together with positional head flattening, but these are distinct conditions.
      No Irish population count for infant torticollis was identified.
    symptoms:
    - A baby may tilt the head toward one shoulder and turn their face the other way. They may prefer one side during feeding or
      have difficulty turning fully.
    causes:
    - Some babies have a tight neck muscle. The cause and timing vary. A head tilt that appears suddenly with pain, fever or other
      symptoms needs a different assessment.
    diagnosis:
    - A healthcare professional checks neck movement, head shape and development. They may refer for physiotherapy or investigate
      other causes if the examination is unusual.
    care:
    - A physiotherapist can demonstrate appropriate handling and exercises. Use supervised play to encourage looking both ways. Keep
      following safe sleeping advice.
    complications:
    - A persistent preference for one side can contribute to head flattening or make feeding more difficult. Follow-up checks whether
      movement and head position improve.
    help:
    - Contact your public health nurse or GP if a baby always looks one way. Seek urgent advice for a sudden painful tilt, fever
      or a baby who becomes unwell.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/torticollis-wry-neck-in-babies/
  underactive-thyroid-hypothyroidism:
    aliases: hypothyroidism underactive thyroid low thyroid TSH levothyroxine
    summary: An underactive thyroid can cause tiredness, constipation and sensitivity to cold. Blood tests can determine whether
      thyroid hormone replacement is needed.
    evidence_gap: Irish newborn screening figures concern congenital hypothyroidism and cannot estimate the frequency of acquired
      underactive thyroid in adults.
    symptoms:
    - Signs may develop gradually and include dry skin, feeling cold, constipation, slower thinking or changes in weight or periods.
      These symptoms can also occur with other conditions.
    causes:
    - The thyroid makes hormones that affect energy use in many tissues. Autoimmune disease or past treatment to the thyroid can
      reduce its function. Some medicines can also influence test results.
    diagnosis:
    - A clinician usually checks thyroid-stimulating hormone and free thyroid hormone. Different patterns require different follow-up.
      Tell the clinician if you are pregnant, take biotin or have had previous thyroid treatment.
    care:
    - Levothyroxine can replace thyroid hormone when needed. A clinician adjusts the dose using tests and symptoms. Ask about taking
      it consistently and about relevant interactions with iron or other medicines.
    complications:
    - Untreated disease can affect cholesterol, fertility or pregnancy. A dose that is too high can also cause problems, which is
      why blood monitoring remains important after symptoms improve.
    help:
    - Speak to your GP about persistent symptoms or pregnancy planning if you have thyroid disease. Contact your prescriber promptly
      if you become pregnant while on replacement treatment.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/underactive-thyroid-hypothyroidism/
  urinary-tract-infections-uti:
    aliases: urinary tract infection UTI urine infection cystitis kidney infection
    summary: A urinary tract infection can cause burning and frequent urination. Fever, pain in the side or vomiting can mean the
      infection has reached a kidney.
    evidence_gap: Hospital urine samples and prescribing records show parts of the burden. They cannot count all urinary tract infections
      treated in the community or distinguish every symptomatic episode.
    symptoms:
    - Common bladder symptoms are burning when urinating, frequent or sudden urges and discomfort low in the abdomen. New blood in
      urine should be discussed with a clinician.
    causes:
    - Most UTIs happen when bacteria enter the urinary tract. Pregnancy, a catheter, a blockage or difficulty emptying the bladder
      can alter the risk and how the infection is assessed.
    diagnosis:
    - A clinician asks about symptoms and risk factors and may send a urine sample. This is particularly important for people who
      are pregnant, people with recurrent infection and those who may have a kidney infection.
    care:
    - Treatment varies with symptoms and the person affected. An antibiotic may be appropriate. Ask whether you need a review if
      symptoms persist, and mention any recent antibiotics or resistant infections.
    complications:
    - An infection can spread to the kidneys and occasionally lead to sepsis. Repeated symptoms can also have other causes, so discuss
      patterns and lasting symptoms with a GP.
    help:
    - Seek prompt assessment for fever, back or side pain, vomiting, pregnancy or possible UTI in a child or man. Get emergency help
      if someone appears severely unwell or confused with signs of infection.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/urinary-tract-infections-uti/
  urine-infections-pregnancy:
    aliases: urine infection pregnancy UTI cystitis asymptomatic bacteriuria antenatal
    summary: Urine infections need attention during pregnancy, even when symptoms seem mild. A maternity clinician can check the
      urine and choose a treatment suitable for pregnancy.
    evidence_gap: Routine antenatal urine testing can find bacteria without symptoms. Positive cultures, symptomatic infections and
      kidney infections are different measures, and no comparable national estimate was found.
    symptoms:
    - Burning, new urgency or discomfort while urinating can suggest infection. Needing to pass urine more often can also be part
      of pregnancy. Fever, chills or pain in the side are more concerning.
    causes:
    - Bacteria can be present in the urine without symptoms. Pregnancy changes how urine drains, and bacteria can sometimes travel
      to the kidneys.
    diagnosis:
    - Contact your GP or maternity service for assessment. A urine culture helps identify bacteria and which medicines are likely
      to work. Tell the clinician how far along you are and about allergies.
    care:
    - A clinician may prescribe an antibiotic suitable for your stage of pregnancy and arrange follow-up or a repeat sample. If kidney
      infection is suspected, you may need hospital assessment.
    complications:
    - An untreated infection can spread to the kidney and cause significant illness. Your team may monitor more closely if symptoms
      return or you have had repeated infections.
    help:
    - Contact your GP or maternity unit promptly if you have symptoms. Seek urgent assessment for fever, shaking chills, pain in
      the side or vomiting. Report contractions or a change in movements to maternity triage.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/urine-infections-pregnancy/
  vitamin-b12-or-folate-deficiency-anaemia:
    aliases: vitamin B12 folate deficiency anaemia macrocytic pernicious anaemia
    summary: A vitamin B12 or folate deficiency can affect blood cell production. B12 deficiency can also cause nerve symptoms, sometimes
      before anaemia is detected.
    evidence_gap: Studies of vitamin levels cannot establish how many people have anaemia caused by the deficiency. A national count
      matching both the cause and the anaemia diagnosis was not identified.
    symptoms:
    - Fatigue, breathlessness and a sore tongue can occur. With B12 deficiency, tingling, numbness, changes in balance or memory
      difficulties can be important signs.
    causes:
    - Both vitamins are needed for healthy cell production. Low intake, poor absorption, certain medicines or a condition such as
      pernicious anaemia can contribute.
    diagnosis:
    - A GP may check a blood count and vitamin levels. Other tests can help clarify the cause. Tell the clinician about diet, previous
      stomach surgery or medicines and supplements.
    care:
    - Treatment depends on which vitamin is low and why. B12 can be given by injection or orally, depending on the cause. The clinician
      considers B12 status before giving folic acid alone.
    complications:
    - Untreated B12 deficiency can cause neurological problems that may not fully reverse. Some causes require ongoing replacement
      and follow-up even after blood counts improve.
    help:
    - Speak to your GP for persistent tiredness, tingling or poor balance. Do not delay assessment of new neurological symptoms while
      trying a vitamin supplement.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/vitamin-b12-or-folate-deficiency-anaemia/
  vre:
    aliases: VRE vancomycin resistant enterococci resistant bacteria hospital screening
    summary: VRE are bacteria that can be carried in the gut without problems. They can be harder to treat if they cause an infection.
    symptoms:
    - Carriage alone has no symptoms. Infection can cause symptoms related to the affected site, such as fever, pain when passing
      urine or signs of a worsening wound.
    causes:
    - Enterococci can live in the bowel. Some have developed resistance to an antibiotic called vancomycin, which limits treatment
      options. Hospitalised patients with devices or serious illness can be more vulnerable to infection.
    diagnosis:
    - The hospital can test a screening swab to look for carriage. Samples from blood, urine or wounds help identify what is causing
      symptoms and which antibiotics might work.
    care:
    - People who carry VRE without infection do not usually need antibiotic treatment. Hospitals may use precautions to reduce spread.
      A specialist can advise on treatment for confirmed infections.
    complications:
    - VRE can sometimes cause bloodstream infection. A positive carriage result mainly helps staff decide how to care for you safely
      and prevent the bacteria spreading.
    help:
    - Tell healthcare workers about a previous VRE result. If a patient develops fever or seems more unwell during treatment, contact
      the treating team promptly.
  warning-signs-during-pregnancy:
    aliases: pregnancy warning signs maternity triage bleeding reduced movements severe headache
    summary: Contact your maternity service immediately if your baby's usual movements change, you have bleeding or severe pain,
      or you develop other warning signs during pregnancy.
    emergency: For collapse, a seizure or severe difficulty breathing, call
    evidence_gap: This is a guide to assessing several symptoms. Irish maternity audits report individual diagnoses and outcomes,
      so there is no single prevalence figure for the warning signs together.
    symptoms:
    - Warning signs can include bleeding, fluid loss, a change in the baby's usual movement pattern, severe headache or vision changes,
      intense abdominal pain or a painful swollen leg. Sudden shortness of breath or chest pain also needs urgent attention.
    causes:
    - Different symptoms can indicate different conditions, including placental or blood-pressure problems, infection, early labour
      or a blood clot. The timing and pattern of symptoms can help the maternity team assess the possible cause.
    diagnosis:
    - The team may ask how far along you are, when the symptoms started and whether movements or fluid loss have changed. Depending
      on the concern, they may check your blood pressure, urine, blood tests or your baby's heartbeat.
    care:
    - Follow the maternity unit's instructions about where to attend. If you are asked to come in, take your maternity notes if available
      without delaying. Being assessed quickly lets staff decide whether you need tests, monitoring or treatment.
    complications:
    - Some concerns turn out to be harmless after assessment. Serious conditions can change quickly, so contact the unit again if
      symptoms return or worsen after advice or examination.
    help:
    - Use your maternity unit's urgent contact number and tell them what has changed. If your baby's movements change, seek help
      immediately, even at night. A home Doppler does not replace having the baby assessed.
    sources:
      Clinical guidance and further reading: https://www.hse.ie/conditions/warning-signs-during-pregnancy/
  who-a-hip-replacement-is-for:
    kind: procedure
    aliases: hip replacement hip arthroplasty osteoarthritis hip surgery recovery
    summary: A hip replacement can improve pain and movement when hip damage substantially limits daily life. A surgeon weighs your
      symptoms, health and expectations before recommending surgery.
    symptoms:
    - Hip replacement is often considered for severe arthritis when pain, stiffness or limited walking persists despite other care.
      The decision depends on how the hip affects daily life as well as the X-ray.
    causes:
    - A surgeon replaces damaged joint surfaces with artificial components. The implant type and surgical approach depend on the
      hip and the person's needs.
    diagnosis:
    - Bring a list of medicines and tell the team about previous clots or infections. Ask how you will manage stairs, walking aids
      and help at home while you recover.
    care:
    - An anaesthesia team discusses options and monitors you during the operation. Staff usually help you start moving soon afterwards
      and explain exercises and measures that reduce clot risk.
    complications:
    - The main short-term warning signs include increasing wound redness or discharge, fever and one-sided leg swelling. Sudden breathlessness
      or chest pain after surgery needs emergency help.
    help:
    - Keep follow-up appointments even if recovery seems straightforward. Contact the orthopaedic team if pain increases, mobility
      worsens or you suspect a wound problem.
    sources:
      Clinical guidance and further reading: https://www.noca.ie/audits/irish-national-orthopaedic-register/
  abscess:
    aliases: abscess skin abscess pus lump drainage painful swelling
    summary: An abscess is a collection of pus. An enlarging or painful lump, particularly with fever, needs a clinician to assess
      whether it should be drained.
    evidence_gap: Abscesses can be recorded under different sites and diagnoses. A single Irish rate covering all internal and external
      abscesses was not found.
    symptoms:
    - A skin abscess can be warm, tender and swollen, with a soft middle or leakage. An abscess inside the body can cause different
      symptoms depending on the site.
    causes:
    - Infection can lead to pus collecting rather than draining away. Some abscesses form after skin injury or surgery, and others
      develop near a tooth or deeper inside the body.
    diagnosis:
    - A clinician examines an external lump and checks for signs of infection. Internal abscesses may need imaging. Tell them about
      diabetes, weakened immunity or repeated episodes.
    care:
    - A clinician can drain accessible collections when appropriate. Antibiotics may be needed when there are signs of spreading
      infection or certain other risks. Do not try to drain it at home.
    complications:
    - Infection can spread locally or into the bloodstream. Some types of abscess recur if the cause remains in place, such as a
      dental source.
    help:
    - Seek prompt advice for a growing painful lump or one with fever, spreading redness or drainage. Seek emergency help for collapse,
      confusion or severe breathing difficulty.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/abscess/
  allergic-rhinitis:
    aliases: allergic rhinitis dust mite pet allergy sneezing blocked nose nasal allergy
    summary: Allergic rhinitis causes recurring sneezing, itching or a blocked nose after exposure to an allergen. The timing can
      help distinguish seasonal pollen symptoms from year-round triggers.
    symptoms:
    - Sneezing, a runny or stuffy nose and itchy eyes are common. Disturbed sleep can make children tired or irritable. Symptoms
      may recur in certain places or after contact with pets.
    causes:
    - The immune system reacts to particles such as pollen, house dust mites or animal dander. The nose becomes inflamed. Allergic
      and non-allergic causes of a blocked nose can occur together.
    diagnosis:
    - A clinician asks about timing, places, pets and other allergies. Skin or blood tests may help if the trigger is unclear or
      if the result would change management.
    care:
    - A pharmacist or GP can discuss antihistamines, nasal steroid sprays or saline. Ask how to use a spray correctly. A specialist
      may discuss further treatment if symptoms remain difficult to control.
    complications:
    - Persistent congestion can disturb sleep and affect work or school. People with asthma should mention changes in breathing alongside
      nasal symptoms.
    help:
    - Contact your GP if symptoms interfere with sleep, remain one-sided or do not respond to usual pharmacy care. Seek urgent help
      if breathing suddenly becomes difficult.
  ankle-pain:
    aliases: ankle pain sore ankle ankle sprain swollen ankle walking
    summary: Ankle pain may follow a twist or build up with activity. A change in shape or difficulty bearing weight after injury
      needs prompt assessment.
    symptoms:
    - Notice where pain is strongest and whether swelling, bruising, warmth or weakness accompanies it. Pain on the outside after
      a twist differs from soreness behind the heel or a red, hot joint.
    causes:
    - Common causes include sprains, tendon irritation, arthritis or fractures. A new hot swollen joint with no clear injury can
      have a different cause.
    diagnosis:
    - A clinician examines movement, tenderness and how well you can stand or walk. The location and cause help decide whether an
      X-ray, blood tests or another test is required.
    care:
    - Reduce painful activity at first and keep gentle movement as tolerated. A clinician can advise on support, pain relief and
      exercises once serious injury has been excluded.
    complications:
    - Instability after a previous injury can increase the chance of another sprain. Long-lasting swelling, locking or continuing
      inability to walk normally can need review.
    help:
    - Seek prompt advice if the ankle looks deformed, you cannot bear weight or it is red and hot with fever. See your GP or physiotherapist
      if pain persists.
  athletes-foot:
    aliases: athlete's foot tinea pedis itchy feet fungal infection toes
    summary: Athlete's foot often causes itching or cracked skin between the toes. Keep the area dry and ask a pharmacist about a
      suitable antifungal treatment.
    evidence_gap: Many cases are treated without a prescription. Irish pharmacy sales cannot identify who had athlete's foot or distinguish
      it from other fungal infections.
    symptoms:
    - The skin can peel, crack or look moist and whitish between the toes. Some people develop dry scaling on the sole or itchy blisters.
      Other conditions can look similar.
    causes:
    - Fungi grow more easily in warm damp areas. The infection can spread by contact with affected skin or shared surfaces. Footwear
      that keeps feet damp can contribute.
    diagnosis:
    - A pharmacist or GP may recognise a typical pattern. Persistent or atypical symptoms can need a skin sample or assessment for
      another cause, such as eczema.
    care:
    - Dry carefully between the toes, change socks and use the treatment for the directed duration. Ask about footwear and treatment
      choices if you have diabetes or poor circulation.
    complications:
    - Cracked skin can let bacteria in. The fungus can also spread to nails or other skin. A hot swollen foot or worsening pain needs
      assessment.
    help:
    - Ask for advice if the rash persists or keeps coming back. Get prompt help for a hot, red or swollen foot, particularly with
      diabetes or fever.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/athletes-foot/
  bleeding-from-the-bottom-rectal-bleeding:
    aliases: rectal bleeding bleeding from bottom blood in stool bright red black stool
    summary: Blood in or on the stool can have several causes. Tell your GP about new or unexplained bleeding, even if it stops by
      itself.
    emergency: If bleeding is heavy or continuous and you feel faint, confused or collapse, call
    evidence_gap: Irish colorectal cancer and hospital bleeding figures describe selected diagnoses or severe episodes. They do not
      count all rectal bleeding in the community.
    symptoms:
    - Blood may be bright red on wiping, mixed with stool or dark. Black, tarry stool can signal bleeding higher in the digestive
      tract. Tell the clinician about pain, change in bowel habit or weight loss.
    causes:
    - Piles or a small tear can bleed, but inflammation, a polyp, a bowel condition or cancer may also be responsible. Colour and
      amount give clues but cannot confirm the cause.
    diagnosis:
    - A clinician asks about symptoms and medicines and can examine the area. Blood tests, stool tests or a bowel investigation may
      be appropriate depending on the findings.
    care:
    - Treatment depends on the cause. Keep track of when bleeding occurs and whether other symptoms change. Ask what to do if bleeding
      returns while waiting for an appointment.
    complications:
    - Repeated bleeding can cause anaemia, and a large bleed can affect circulation. Some causes can be harder to treat if diagnosis
      is delayed.
    help:
    - Arrange GP assessment for new or unexplained bleeding. Seek urgent care for heavy bleeding, tarry stools, severe pain or dizziness,
      even if you already have piles.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/bleeding-from-the-bottom-rectal-bleeding/
  boils-carbuncles:
    aliases: boils carbuncles skin abscess furuncle staph pus lump
    summary: A boil is a painful skin lump that may fill with pus. Several boils joined together form a carbuncle and may need medical
      treatment.
    evidence_gap: Irish hospital reports on skin abscesses and bacterial infections do not capture boils managed at home or reliably
      identify carbuncles separately.
    symptoms:
    - A boil can begin as a firm tender lump that grows and develops a soft centre or leaks. A carbuncle is often larger or deeper
      and can be accompanied by fever.
    causes:
    - Bacteria can enter around hair follicles, especially in irritated skin. Repeated lumps in skin folds can also point to a different
      condition such as hidradenitis suppurativa.
    diagnosis:
    - A clinician checks size, location, surrounding skin and signs of illness. They may take a swab if infection recurs or treatment
      is not working as expected.
    care:
    - A clean warm compress may help a small boil. Avoid squeezing it. A clinician may need to drain a larger collection and decide
      if an antibiotic is appropriate.
    complications:
    - Infection can spread into deeper skin. Boils around the face, spreading redness or repeated episodes can need particular assessment.
    help:
    - Get advice for spreading redness, fever, a boil on the face, or a boil in someone with diabetes or weakened immunity. Talk
      to a GP about repeated episodes.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/boils-carbuncles/
  bowel-polyps:
    aliases: bowel polyps colon adenoma serrated polyp colonoscopy biopsy
    summary: Bowel polyps are growths in the lining of the bowel, often found during colonoscopy. The type, size and number influence
      whether you need further checks.
    symptoms:
    - Most polyps cause no symptoms. Some can bleed or affect bowel habits. Symptoms such as bleeding or unexplained weight loss
      still need assessment for other causes.
    causes:
    - A polyp forms when cells in the bowel lining grow in an unusual pattern. Some types are more likely than others to become cancer
      over a number of years.
    diagnosis:
    - A colonoscopy can identify and often remove polyps. A lab examines the removed tissue so clinicians know its type and whether
      further treatment or follow-up is needed.
    care:
    - Many polyps can be removed during colonoscopy. A difficult location or a larger polyp may require a specialist procedure. Ask
      when your results will be available.
    complications:
    - New polyps can develop later, and not everyone needs repeat colonoscopy at the same interval. Your follow-up depends on what
      was found and your broader risk.
    help:
    - Check who will explain the pathology result and any follow-up. Get urgent advice for heavy bleeding, severe pain or fever after
      removal.
  carpal-tunnel-syndrome:
    aliases: carpal tunnel syndrome CTS wrist tingling numb fingers median nerve night
    summary: Carpal tunnel syndrome can cause tingling or numbness in the hand, often at night. Persistent hand weakness needs a
      GP review.
    evidence_gap: Irish carpal tunnel surgery counts are a measure of procedures. They exclude people with milder symptoms and cannot
      establish population prevalence.
    symptoms:
    - Tingling commonly affects the thumb, index and middle fingers and part of the ring finger. It may wake you at night. Some people
      drop objects or find grip less reliable.
    causes:
    - The median nerve passes through a narrow space at the wrist. Swelling or other changes can compress it. Pregnancy, diabetes
      and some other conditions can increase risk.
    diagnosis:
    - A clinician assesses which fingers are affected and examines strength and sensation. Nerve tests can help when the pattern
      is unclear or surgery is being considered.
    care:
    - A night splint can help some people. A clinician may discuss changes to activities, an injection or a procedure to relieve
      pressure if symptoms persist.
    complications:
    - Long-lasting compression can affect hand strength and feeling. Recovery may take longer when symptoms were severe before treatment.
    help:
    - Ask your GP about persistent tingling, weakness or objects slipping from your hand. Get reassessed if symptoms worsen despite
      the treatment plan.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/carpal-tunnel-syndrome/
  chemotherapy:
    kind: procedure
    aliases: chemotherapy chemo cancer treatment systemic anticancer therapy infusion tablets
    summary: Chemotherapy can treat cancer by damaging cancer cells or preventing them from dividing. Ask your oncology team what
      the treatment is meant to achieve and which symptoms require immediate advice.
    symptoms:
    - It may be given to shrink a cancer, reduce the chance of it returning or control symptoms. Treatment recommendations depend
      on the cancer, the person's health and past treatment.
    causes:
    - Chemotherapy is a group of medicines rather than a single drug. It can be given through a vein or by mouth, often in cycles.
      Different regimens can have different side effects.
    diagnosis:
    - Before treatment, the team reviews medicines and may check blood counts, kidneys or other measurements. Ask about fertility,
      vaccination and what to do if you feel unwell between visits.
    care:
    - Staff confirm your regimen and give instructions for taking medicines safely. If you attend a day unit, check how long the
      visit is expected to take and whether you need someone to accompany you.
    complications:
    - Low blood counts can increase the risk of infection. Fever or sudden illness during treatment can be urgent. Other side effects
      depend on the regimen and should be discussed early.
    help:
    - Use the emergency contact or temperature threshold your treatment team gave you. Contact them promptly if you feel unwell even
      if you are unsure that treatment caused it.
  concussion-grassroots-sport:
    aliases: sport concussion grassroots GAA rugby football return to play head injury
    summary: Remove a player from activity immediately if concussion is suspected. They should not return on the same day, even if
      they say they feel better.
    symptoms:
    - A player may appear dazed, unsteady or slow to respond. They may have headache, nausea or memory problems. Symptoms can develop
      after leaving the pitch.
    causes:
    - A blow to the head or body can transmit force to the brain. A second injury during recovery can worsen the situation, so avoid
      testing the player by sending them back into play.
    diagnosis:
    - A clinician should assess suspected concussion. Tell them how the injury happened, what others noticed and whether there were
      previous concussions. Club staff should follow their sport's procedures.
    care:
    - Follow the clinician's and sport's gradual return plan. Progress through everyday activity and later training before contact.
      The HSE advises avoiding contact sport for at least three weeks after a head injury.
    complications:
    - Symptoms can affect sleep, classes, work or training. A slower recovery may need tailored support. New severe symptoms or rapid
      deterioration signal a need for emergency care.
    help:
    - Seek medical assessment for suspected concussion. Get emergency help for a seizure, reduced responsiveness, repeated vomiting
      with deterioration or signs of a neck or serious head injury.
  conjunctivitis:
    aliases: conjunctivitis pink eye sticky discharge infected eye viral bacterial allergic
    summary: Conjunctivitis can make an eye gritty, red, watery or sticky. Severe pain, light sensitivity or reduced vision warrant
      assessment for another condition.
    evidence_gap: Many cases resolve at home and do not enter national surveillance. A comparable Irish estimate that includes viral,
      bacterial and allergic cases was not identified.
    symptoms:
    - The eyes may water or develop discharge that sticks the lashes together. Allergy often causes itching and affects both eyes.
      A contact lens wearer with new redness needs prompt advice.
    causes:
    - Viruses, bacteria and allergens can inflame the thin membrane over the eye and inside the lids. Infectious conjunctivitis can
      pass through hands or shared items.
    diagnosis:
    - A pharmacist or clinician considers discharge, itch, pain, vision and which eye is affected. Tell them about contact lenses,
      injury, unusual exposure or a newborn with red eyes.
    care:
    - Wash hands, gently clear discharge and avoid sharing towels. Treatment depends on the cause, and antibiotics do not help viral
      or allergic irritation. Stop wearing contact lenses while symptoms are present.
    complications:
    - Most uncomplicated cases improve. A painful eye, vision change or sensitivity to light may signal corneal involvement or a
      different diagnosis and needs urgent assessment.
    help:
    - Seek urgent advice for eye pain, altered vision, light sensitivity, redness with contact lenses or red and sticky eyes in a
      newborn.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/conjunctivitis/
  constipation:
    aliases: constipation hard stool infrequent bowel movements straining laxative
    summary: Constipation can mean hard stools, difficulty passing them or going less often than usual. Persistent change, bleeding
      or unexplained weight loss needs a GP review.
    evidence_gap: Medication sales do not distinguish occasional constipation from persistent disease. A consistent Irish estimate
      across adults living at home and in care was not identified.
    symptoms:
    - Stool can be dry or lumpy and take effort to pass. You may feel bloated or as though the bowel has not emptied fully. Compare
      the pattern with what is normal for you.
    causes:
    - Fibre, fluid, activity, changes in routine and medicines can influence bowel movement. Some health conditions affect how the
      bowel works or empties.
    diagnosis:
    - A GP asks about timing, medicines, diet and any warning signs. An examination or tests may be needed if the change is persistent,
      severe or unfamiliar.
    care:
    - Gradually increasing fibre when appropriate, drinking enough and using a regular toilet routine can help. A pharmacist or GP
      can advise on a suitable laxative where needed.
    complications:
    - Long-standing constipation can cause fissures, piles or a build-up of stool. Loose leakage can sometimes occur around trapped
      stool and needs assessment.
    help:
    - Seek advice if symptoms persist or you have new bleeding or weight loss. Severe pain, vomiting, a swollen abdomen or being
      unable to pass stool or wind may need urgent care.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/constipation/
  constipation-children:
    aliases: constipation children hard stool child withholding soiling toilet training
    summary: Children can hold back stool after a painful bowel movement. Early treatment can help break the cycle and make going
      to the toilet less worrying.
    evidence_gap: Irish clinic activity does not account for symptoms managed at home or distinguish stool withholding from other
      causes. A national paediatric prevalence figure was not identified.
    symptoms:
    - Stools can be large or hard and difficult to pass. A child may cross their legs, hide or hold on. Small amounts of loose stool
      can leak around built-up stool.
    causes:
    - Pain can lead to avoidance, which makes stool harder. Changes in routine, low fluid or fibre intake and toilet-training difficulties
      can contribute.
    diagnosis:
    - A clinician asks how long symptoms have lasted, what stools look like and how the child is growing. Symptoms from early infancy
      or signs of poor growth may prompt further investigation.
    care:
    - Calm regular toilet time, foot support and positive encouragement can help. A GP may prescribe a laxative plan to clear built-up
      stool and prevent it building up again.
    complications:
    - Pain and soiling can affect confidence, school and sleep. Treatment may need time even after stools become softer, so follow
      the clinician's plan.
    help:
    - Get advice for persistent pain or soiling. Seek urgent review for vomiting with a swollen abdomen, severe pain, poor feeding
      or significant blood in the stool.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/constipation-children/
  constipation-pregnancy:
    aliases: constipation pregnancy hard stool pregnant iron supplement laxative
    summary: Constipation can become more noticeable during pregnancy. If dietary or routine changes are insufficient, a pharmacist,
      GP or midwife can discuss treatment suitable for pregnancy.
    evidence_gap: No comparable Irish estimate was identified for constipation during pregnancy. Rates depend on the stage of pregnancy
      and which symptom definition a study uses.
    symptoms:
    - You may pass hard stools less often or strain more than usual. A small amount of bleeding on wiping can come from piles or
      a fissure, but bleeding should be discussed if you are unsure of the source.
    causes:
    - Hormonal changes can slow bowel movement. The growing womb, changes in activity and some iron supplements can also contribute.
    diagnosis:
    - A clinician asks about the pattern, medicines and any pain or bleeding. Tell them if the symptoms differ from earlier constipation
      or you are unsure whether bleeding is vaginal.
    care:
    - Gradually increase suitable fibre and drink enough fluid. Exercise if your maternity team says it is appropriate. Ask before
      choosing a laxative or stopping prescribed iron.
    complications:
    - Straining can worsen piles or cause a tear near the anus. Sharp or severe pain can have another cause and should be assessed.
    help:
    - Contact your midwife or GP for persistent symptoms or bleeding. Seek urgent advice if you develop severe abdominal pain, vomiting
      or possible vaginal bleeding.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/constipation-pregnancy/
  contact-dermatitis:
    aliases: contact dermatitis irritant allergic occupational hand eczema patch test
    summary: Contact dermatitis is a skin reaction to something touching it. The pattern can help identify whether repeated irritation
      or a contact allergy is involved.
    evidence_gap: Occupational reports cover selected work-related cases. They cannot establish prevalence of contact dermatitis
      from all triggers in Ireland.
    symptoms:
    - Skin can become itchy, cracked, sore or blistered. Hands are often affected by wet work. With an allergy, a rash may appear
      after a delay or spread beyond where the substance touched.
    causes:
    - Repeated exposure to detergents, water or solvents can damage the skin barrier. An allergic reaction can be triggered by substances
      such as fragrance, preservatives, metals or products used at work.
    diagnosis:
    - A GP reviews where the rash appears and what contacts occur at work and home. A dermatologist may use patch testing when a
      contact allergy is suspected.
    care:
    - Reduce exposure where practical, use moisturisers and ask about appropriate protection. A GP may prescribe treatment for inflammation.
      Ask occupational health for help if work exposures are involved.
    complications:
    - Untreated rash can crack, bleed or become infected. Symptoms can recur if the cause is not identified or contact continues.
    help:
    - Contact a GP if the rash persists, affects work or involves the face. Seek prompt advice for rapidly spreading pain, pus or
      fever.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/contact-dermatitis/
  dental-abscess:
    aliases: dental abscess tooth abscess toothache gum swelling dental infection
    summary: A dental abscess is a pocket of infection around a tooth or gum. It needs urgent dental assessment even if pain eases
      or pus drains.
    emergency: If swelling in the mouth or neck makes breathing or swallowing difficult, call
    evidence_gap: National estimates for tooth decay do not measure dental abscesses. A comprehensive count across Irish dental and
      emergency services was not identified.
    symptoms:
    - Pain may throb and spread to the jaw or ear. There may be gum or face swelling, a bad taste, sensitivity when chewing or fever.
      A deeper infection can make opening the mouth difficult.
    causes:
    - Bacteria can reach the pulp inside a damaged or decayed tooth or enter tissues around a tooth through gum disease. The resulting
      infection may form a collection of pus.
    diagnosis:
    - A dentist checks the tooth, gums and nearby swelling. An X-ray can help find the source. Tell the dentist if you have fever,
      difficulty swallowing or a weakened immune system.
    care:
    - A dentist can drain an abscess and treat the source, for example with root canal treatment or extraction when appropriate.
      An antibiotic may be needed if infection is spreading or causing general illness.
    complications:
    - Infection can spread into the face or neck. A severe infection can threaten the airway. Relief after spontaneous drainage does
      not mean treatment is complete.
    help:
    - Contact a dentist urgently for possible abscess. Go to an emergency department for rapidly spreading swelling or inability
      to open the mouth, and seek emergency help if breathing or swallowing becomes difficult.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/dental-abscess/
  dry-eyes:
    aliases: dry eyes dry eye disease tear film burning gritty eyes screen contact lenses
    summary: Dry eyes can feel gritty, sore or watery. Redness with pain, light sensitivity or a change in vision needs medical assessment.
    evidence_gap: Rates depend on whether studies count symptoms, formal diagnoses or abnormalities on testing. A comparable Irish
      national prevalence estimate was not identified.
    symptoms:
    - Both eyes often feel dry or sting, particularly after screen use, in heated rooms or in wind. Blurring may fluctuate. Eyes
      can also water in response to irritation.
    causes:
    - The tear film may evaporate too quickly or the eyes may make too few tears. Eyelid problems, age, some medicines and health
      conditions can contribute.
    diagnosis:
    - A clinician may examine the eyelids and eye surface and ask about medicines, visual tasks and contact lenses. Symptoms that
      affect one eye or persist despite care deserve review.
    care:
    - Taking breaks from screens, avoiding direct airflow and using suitable lubricating drops can help. Ask a pharmacist or optometrist
      which product suits contact lenses or frequent use.
    complications:
    - Severe or long-standing dryness can damage the surface of the eye. Persistent pain, reduced vision or marked sensitivity to
      light should not be assumed to be ordinary dryness.
    help:
    - Seek advice if daily symptoms continue or you need drops regularly. Get urgent assessment for a painful red eye, sudden change
      in vision or redness with contact lenses.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/dry-eyes/
  fungal-nail-infection:
    aliases: fungal nail infection onychomycosis thick discoloured toenail
    summary: A fungal nail infection can thicken or discolour a nail. Because injuries and other conditions can cause similar changes,
      a sample may be useful before taking tablets.
    evidence_gap: Diagnosis based on appearance and laboratory-confirmed onychomycosis give different rates. A directly comparable
      Irish national estimate was not identified.
    symptoms:
    - A nail may turn yellow or white, become brittle or lift from the nail bed. Toenails are affected most often. Some people notice
      discomfort in shoes.
    causes:
    - Fungi can infect the nail, sometimes following athlete's foot. Age, repeated minor injuries and damp footwear can all increase
      susceptibility.
    diagnosis:
    - A pharmacist or GP can assess the nail and consider other causes. A clipping or scraping can check for fungus, particularly
      before treatment with antifungal tablets.
    care:
    - Treatment can involve a nail product or tablets when appropriate. A clinician checks for interactions and whether any monitoring
      is needed. Healthy nail takes months to grow out.
    complications:
    - The infection can recur or spread to other nails. People with diabetes, poor circulation or a painful inflamed toe need individual
      advice because other foot problems can matter.
    help:
    - Give a GP or pharmacist details of any treatment tried and how long nail changes have been present. Seek prompt advice if surrounding
      skin becomes hot, swollen or painful.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/fungal-nail-infection/
  gum-disease:
    aliases: gum disease gingivitis periodontitis bleeding gums periodontal disease loose teeth
    summary: Bleeding gums can be an early sign of gum disease. A dental examination can check whether inflammation is limited to
      the gums or has affected the support around the teeth.
    symptoms:
    - Gums may bleed when brushing, look swollen or pull back. Bad breath or loose teeth may occur in more advanced disease. Some
      people have little pain.
    causes:
    - Plaque can irritate the gum. When disease progresses beyond the gum, it can damage the tissue and bone supporting teeth. Smoking
      and diabetes can increase risk.
    diagnosis:
    - A dentist or hygienist checks bleeding and measures spaces around teeth. X-rays can help assess bone loss where appropriate.
    care:
    - Daily cleaning along the gum line and between teeth is important. Dental treatment can remove deposits above or below the gums.
      A dentist can arrange specialist care for severe disease.
    complications:
    - Once supporting bone has been lost, treatment aims to prevent further damage and keep teeth working. Untreated disease can
      lead to tooth loosening or loss.
    help:
    - Book a dental review for recurring bleeding, pain, swelling or loose teeth. Mention diabetes or smoking and ask the team to
      show you how to clean difficult areas.
  haemorrhoids-piles:
    aliases: haemorrhoids piles anal lump bright red bleeding bowel movement
    summary: Piles can cause itching, discomfort or bright red blood when passing stool. New bleeding from the bottom needs assessment
      so other causes can be considered.
    symptoms:
    - A person may notice bright blood on paper, itching, a lump or mucus. A suddenly painful lump can occur when a clot forms in
      an external pile.
    causes:
    - Vascular tissue near the anus can swell or move out of place. Straining, constipation and pregnancy can contribute. Other conditions
      can cause similar bleeding and discomfort.
    diagnosis:
    - A GP may examine the area and ask about bowel changes, bleeding and other symptoms. Further tests are sometimes needed to rule
      out causes higher in the bowel.
    care:
    - Softer stools and avoiding straining can reduce symptoms. A pharmacist can advise on short-term treatments. Persistent symptoms
      may need a specialist procedure.
    complications:
    - Bleeding can recur, and painful thrombosis can need assessment. Ongoing bleeding, a change in bowel movements or weight loss
      should be investigated.
    help:
    - Speak to your GP about rectal bleeding or symptoms that do not settle. Get urgent medical help for heavy bleeding, severe pain
      or feeling faint.
  hay-fever:
    aliases: hay fever pollen allergy seasonal allergic rhinitis grass pollen
    summary: Hay fever is a seasonal pollen allergy. Sneezing, itchy eyes and a blocked nose can flare during certain months or after
      time outdoors.
    evidence_gap: Irish studies of rhinitis do not always identify pollen as the cause. The rate for symptoms from all allergens
      cannot serve as a national hay fever estimate.
    symptoms:
    - Symptoms can include itchy eyes, an itchy roof of the mouth, sneezing and clear discharge from the nose. Cough is possible,
      particularly in someone who also has asthma.
    causes:
    - The immune system reacts to pollen. Which months cause trouble depends on the pollen that triggers you and local conditions.
      Grass, tree and weed pollens have different seasons.
    diagnosis:
    - A pharmacist or GP can often recognise a seasonal pattern. Tell them whether symptoms also happen indoors or out of season,
      which can suggest another trigger.
    care:
    - A pharmacist can advise on antihistamines, eye drops or nasal spray. Reducing pollen brought inside on clothes or hair may
      help. Discuss safety or timing if pregnant, driving or taking other medicines.
    complications:
    - Severe symptoms can disrupt sleep, work or study. Asthma may be harder to manage during pollen season. Review a breathing plan
      with your clinician if needed.
    help:
    - Contact your GP if symptoms persist despite treatment or your usual asthma symptoms increase. Seek urgent help for severe asthma
      symptoms.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/hay-fever/
  head-injury-concussion:
    aliases: head injury concussion bump head brain injury vomiting red flags
    summary: A blow or jolt to the head can cause concussion or a more serious injury. Worsening symptoms after the injury need urgent
      assessment.
    emergency: If someone is unconscious, has a seizure or develops new weakness after a head injury, call
    symptoms:
    - Headache, dizziness, nausea, sensitivity to light or difficulty concentrating can occur. Loss of consciousness is possible
      but is not needed for concussion. Repeated vomiting, weakness or increasing drowsiness are warning signs.
    causes:
    - A sudden impact or movement can disrupt how the brain works. Bleeding inside the skull can also occur. A person's age, how
      the injury happened and medicines affecting clotting can influence risk.
    diagnosis:
    - A clinician asks what happened and checks alertness, memory, movement and other signs. A scan may be needed when there are
      signs of bleeding or higher risk. A normal scan can still be consistent with concussion.
    care:
    - Follow the hospital or GP's instructions for observation and return to everyday activity. After the initial rest period, activity
      can resume gradually as advised. Avoid another head impact during recovery.
    complications:
    - Symptoms can emerge or worsen after an apparently minor injury. Some people have persistent headaches, dizziness or difficulty
      with concentration, and need further support.
    help:
    - Seek urgent help for worsening headache, repeated vomiting, new confusion or unusually difficult waking. Tell clinicians if
      the injured person takes a medicine that increases bleeding risk.
  hives:
    aliases: hives urticaria wheals itchy rash angioedema
    summary: Hives are raised patches that can move or change shape over hours. Breathing problems, faintness or swelling of the
      throat may signal a severe reaction.
    emergency: If hives occur with throat swelling, difficulty breathing or faintness, call
    evidence_gap: A national Irish estimate matching the duration and diagnosis of urticaria was not identified. General allergies
      surveys do not isolate hives.
    symptoms:
    - Wheals can be itchy or sting. Individual patches often fade while others appear. Deeper swelling can affect lips, eyelids or
      other areas.
    causes:
    - The skin releases histamine and other substances that increase swelling. Triggers can include infection, medicines, heat, pressure
      or a food allergy. No clear trigger is found in many cases.
    diagnosis:
    - A clinician asks how long patches last and whether there is swelling or illness. A photo can help if the rash has changed.
      Testing depends on the history.
    care:
    - A pharmacist or GP can advise on an antihistamine. Keep a brief record of recurring symptoms if helpful. Persistent hives may
      need a treatment review or specialist advice.
    complications:
    - Swelling of the airway is an emergency. Repeated hives can also interrupt sleep or daily activities. A widespread rash with
      fever or bruising can have a different cause.
    help:
    - Seek emergency help for signs of severe allergy or airway swelling. Ask a GP about hives that persist, recur or are accompanied
      by fever or painful skin.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/hives/
  home-oxygen-therapy:
    kind: service
    aliases: home oxygen therapy long term oxygen concentrator portable oxygen lung condition
    summary: Home oxygen is prescribed for some people whose blood oxygen is persistently low. The team will explain when to use
      it and how to handle the equipment safely.
    evidence_gap: Disease prevalence and oxygen-device supply measure different things. A national count covering all home oxygen
      prescriptions across Irish services was not identified.
    symptoms:
    - Specialists may assess people with severe lung disease or another condition affecting oxygen levels. Being breathless by itself
      does not establish that extra oxygen will help.
    causes:
    - The equipment provides oxygen through small tubes at the nostrils or another device. Flow rate and the number of hours used
      depend on the person's measured needs.
    diagnosis:
    - Ask how the prescription was set and whom to contact if you travel or lose power. Tell the supplier and team if anyone smokes
      in the household or if there are other fire risks.
    care:
    - The service or supplier sets up equipment and explains how to use it. Follow the prescribed flow rate, look after the tubing
      and report problems rather than adjusting it yourself.
    complications:
    - Oxygen supports burning. Keep it away from smoking, flames and heat sources and follow supplier safety instructions. Tubing
      can also cause trips if not positioned carefully.
    help:
    - Contact the prescribing team or supplier if the equipment fails or your needs change. Severe new breathlessness, confusion
      or blue lips needs emergency assessment.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/home-oxygen-therapy/
  hormone-therapy-for-cancer:
    kind: procedure
    aliases: hormone therapy cancer endocrine therapy breast prostate tamoxifen hormonal treatment
    summary: Hormone therapy can slow cancers that depend on hormones to grow. The medicine, expected benefit and length of treatment
      vary with the type of cancer.
    evidence_gap: Cancer incidence figures do not show who received hormone therapy. A prescription count would also include repeat
      supplies and cannot establish the national number treated.
    symptoms:
    - It can be considered for some breast and prostate cancers. It may reduce recurrence or help control disease. A clinician can
      explain which features of the cancer make it appropriate.
    causes:
    - Medicines can lower hormone production or prevent a hormone from acting on cancer cells. The treatment is different from hormone
      replacement used for menopause symptoms.
    diagnosis:
    - Discuss your medicines, bone health, fertility and side-effect concerns before starting. Ask how the team will check that the
      treatment is doing what it is intended to do.
    care:
    - Depending on the medicine, treatment may involve regular tablets, injections or a procedure. Keep appointments and ask the
      team how to handle a delayed dose.
    complications:
    - Hot flushes, sexual symptoms, fatigue or bone effects can occur. Particular drugs have specific risks. Report side effects
      so the team can discuss ways to manage them or consider alternatives.
    help:
    - Contact your cancer team if side effects are affecting daily life or you are thinking about stopping. Follow their guidance
      for symptoms that require urgent medical attention.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/hormone-therapy-for-cancer/
  immunotherapy:
    kind: procedure
    aliases: cancer immunotherapy checkpoint inhibitor immune side effects oncology
    summary: Cancer immunotherapy uses the immune system to help fight cancer. Some side effects can start during or after treatment
      and need early assessment.
    evidence_gap: Irish hospital reports may group immunotherapy with other systemic cancer treatment. A national count covering
      immunotherapy alone across all settings was not identified.
    symptoms:
    - Immunotherapy is suitable for some cancers depending on their type, stage and test results. An oncology team can explain where
      it fits in the plan and what benefit is realistic.
    causes:
    - Some immunotherapies take the brakes off immune cells so they can respond to cancer. Different products work in different ways
      and are not interchangeable.
    diagnosis:
    - Ask the team about planned scans and blood tests. Tell them about autoimmune conditions, medicines and any previous immunotherapy.
      Keep a record or alert card with the name of your treatment.
    care:
    - You may receive the medicine through a vein at planned visits. The team checks for reactions and will review symptoms between
      visits. Bring details of new symptoms to each review.
    complications:
    - An activated immune system can cause inflammation in organs such as the bowel, lungs, liver, skin or glands. Report unusual
      diarrhoea, cough, breathlessness or severe fatigue promptly, even after treatment ends.
    help:
    - Follow your oncology team's urgent contact advice and tell other clinicians that you receive or previously received immunotherapy.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/immunotherapy/
  indigestion:
    aliases: indigestion dyspepsia upper abdominal fullness belching after eating
    summary: Indigestion describes discomfort around the upper abdomen or chest after eating. Persistent symptoms or difficulty swallowing
      should be reviewed.
    evidence_gap: Self-reported indigestion and reflux disease use different definitions. Irish data for acid-suppressing medicines
      do not count all people with indigestion.
    symptoms:
    - You may feel full soon after eating, bloated, nauseated or unable to finish a usual meal. Some people also have heartburn or
      frequent belching.
    causes:
    - Reflux, some medicines, an ulcer or changes in how the stomach works can contribute. Several causes can feel similar, so the
      other symptoms and how long they have lasted matter.
    diagnosis:
    - A clinician asks when symptoms occur and checks for weight loss, anaemia, bleeding or swallowing problems. Depending on findings,
      they may arrange a test for H. pylori or further investigation.
    care:
    - A pharmacist can help with short-term symptom relief. Smaller meals or adjusting individual triggers can help some people.
      A GP can review acid medicines and possible causes if symptoms recur.
    complications:
    - Persistent indigestion often has a manageable cause, but can sometimes be a sign of a condition that needs treatment. New chest
      pain with pressure or sweating needs separate urgent assessment.
    help:
    - Contact your GP if symptoms keep returning or if you have difficulty swallowing, vomiting or unexplained weight loss. Seek
      emergency help for signs of a heart attack or major bleeding.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/indigestion/
  intensive-care:
    kind: service
    aliases: intensive care ICU critical care HDU ventilator intensive care unit
    summary: Intensive care provides close monitoring and treatment for people who are critically ill or need specialised support
      after an operation or injury.
    symptoms:
    - A person may need intensive care when breathing, circulation or another organ needs support. Staff may also admit a person
      for close observation when their condition could change quickly.
    causes:
    - ICU staff use monitors and treatments tailored to each person. Some need a breathing machine, medicines to support circulation,
      kidney support or more than one form of treatment.
    diagnosis:
    - Families can tell staff about the person's usual health, medicines and wishes if they are unable to speak. Ask when updates
      are available and how to get support with decisions.
    care:
    - Staff will explain what tubes and monitors are for and what changes they are watching. Sedation, illness and lack of sleep
      can affect the person's awareness and ability to communicate.
    complications:
    - Recovery can continue for months. Weakness, sleep disturbance or memory problems can occur after critical illness. Some hospitals
      offer follow-up or rehabilitation after discharge.
    help:
    - Ask the nursing or medical team for advice on visiting, family meetings or the plan for transfer out of the unit. Report ongoing
      symptoms to the GP or follow-up team.
  mastectomy:
    kind: procedure
    aliases: mastectomy breast removal breast cancer surgery reconstruction lymph nodes
    summary: Mastectomy removes breast tissue and can be part of breast cancer treatment or risk reduction. Your team can discuss
      the extent of surgery and reconstruction options.
    evidence_gap: Irish hospital tables can report specific mastectomy types. A single count covering all types across both public
      and private settings was not identified.
    symptoms:
    - The treatment plan depends on cancer size and location, risk, past treatment and your preferences. Some people can choose between
      breast-conserving surgery and mastectomy.
    causes:
    - A surgeon removes breast tissue and may assess or remove nearby lymph nodes. Reconstruction can sometimes take place at the
      same operation or later, depending on your circumstances.
    diagnosis:
    - Ask about reconstruction, going flat, drains, pain relief and help at home. Tell the team about blood thinners, other medicines
      and any earlier surgery or radiotherapy.
    care:
    - Surgery takes place under anaesthesia. Staff help you manage pain and teach exercises as appropriate. The tissue removed is
      examined to guide the next stage of care.
    complications:
    - A wound infection, fluid collection or persistent pain can occur. Lymph node surgery can contribute to arm swelling. Report
      worsening redness, fever or a problem with the wound.
    help:
    - Keep the appointment to review pathology and discuss further treatment. Ask who to contact about a drain, movement problems,
      a prosthesis or reconstruction follow-up.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/mastectomy/
  moles:
    aliases: mole moles changing mole ABCDE melanoma skin check
    summary: Most moles are harmless. A new or changing mark, especially one that looks different from your other moles, should be
      assessed by a GP.
    evidence_gap: Cancer registry numbers describe diagnosed skin cancers. They cannot estimate how many people have ordinary moles
      or how many moles someone has.
    symptoms:
    - Look for a changing shape, uneven edges, several colours or a mark that grows, itches or bleeds. Melanoma can also occur in
      a new mark and may be small.
    causes:
    - Moles are groups of pigment-producing cells. Genetics and sunlight affect skin and mole patterns. Changes can have a benign
      cause but may warrant a closer check.
    diagnosis:
    - A GP examines the skin and considers recent changes. They may refer you for specialist examination or removal and lab testing
      if a mole looks suspicious.
    care:
    - Take a dated photograph if a change has occurred, while arranging a clinical check. Use sun protection. Do not remove or treat
      an undiagnosed mole yourself.
    complications:
    - A suspicious lesion may be skin cancer, and prompt assessment helps guide treatment. A stable mole can still need review if
      new symptoms appear.
    help:
    - Book a GP visit if a mark is new and unusual, changes or bleeds. Tell the GP about prior skin cancer or close family history
      if relevant.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/moles/
  mouth-ulcers:
    aliases: mouth ulcers canker sores aphthous ulcer sore inside mouth
    summary: Most mouth ulcers heal within a couple of weeks. An ulcer that lasts more than three weeks needs examination by a dentist
      or GP.
    evidence_gap: Irish oral cancer or dental attendance figures do not capture temporary mouth ulcers. A national estimate based
      on consistent definitions was not identified.
    symptoms:
    - A small round sore can hurt when eating or drinking. Several can occur at once. Persistent ulcers, an unusual patch or an ulcer
      with a lump can have another cause.
    causes:
    - Minor injury from biting, a sharp tooth or braces can cause an ulcer. Recurrent ulcers can also be associated with certain
      illnesses, medicines or nutrient deficiencies.
    diagnosis:
    - A dentist or GP examines the area and asks about duration, recurrence and other symptoms. Ongoing or unexplained ulcers may
      need investigations or a specialist referral.
    care:
    - Avoid foods or products that make the area sting. A pharmacist can advise on suitable pain relief. A dentist can check whether
      a sharp edge or appliance is rubbing.
    complications:
    - Pain can make it difficult to eat or drink. A persistent sore can occasionally be a sign of a serious condition, so arrange
      review even if it is painless.
    help:
    - Contact a dentist or GP if the ulcer lasts longer than three weeks, is unusually large or keeps returning. Seek advice sooner
      if you are finding it difficult to drink.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/mouth-ulcers/
  nasal-polyps:
    aliases: nasal polyps nose blockage loss of smell chronic sinus disease
    summary: Nasal polyps are soft growths in the nose or sinuses. A persistent blocked nose or loss of smell is a reason to discuss
      an examination with a clinician.
    evidence_gap: The available Irish figures for sinus disease or surgery do not measure how many people have confirmed nasal polyps.
      A national prevalence estimate was not found.
    symptoms:
    - Congestion, reduced smell or taste, runny nose or mucus draining into the throat may develop gradually. Polyps often involve
      both sides of the nose.
    causes:
    - Long-term inflammation can cause swollen lining to form polyps. Some people also have asthma or other conditions that affect
      the airways.
    diagnosis:
    - A GP may look inside the nose. A specialist can examine it with a small camera or use imaging to check extent. Persistent one-sided
      symptoms or bleeding need separate assessment.
    care:
    - Nasal steroid treatment can shrink some polyps. A clinician may offer other medicines or surgery for more severe disease. Ask
      about continued treatment after surgery.
    complications:
    - Polyps can return after treatment. Ongoing congestion or loss of smell can affect sleep, eating and safety, such as noticing
      smoke or spoiled food.
    help:
    - Speak to your GP if symptoms persist or return. Seek prompt assessment for repeated nosebleeds, one-sided blockage, swelling
      around an eye or trouble with vision.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/nasal-polyps/
  palliative-care:
    kind: service
    aliases: palliative care hospice specialist palliative home care symptom control
    summary: Palliative care supports people living with a serious, life-limiting illness and those close to them. It can begin alongside
      treatment for the underlying illness.
    symptoms:
    - A person can benefit when pain, breathing problems, nausea or worry affect life, or when they need help with care decisions.
      People with conditions other than cancer can also receive support.
    causes:
    - General palliative care can be provided by a GP or usual team. Specialist support may help with more complex symptoms or decisions.
      Care can take place at home, in hospital or in a hospice.
    diagnosis:
    - Ask your team what you most want to improve and who will coordinate care. Discuss how support works outside normal hours and
      which services are available locally.
    care:
    - Staff may review symptoms and medicines and talk through practical, emotional and family needs. They can help with a plan if
      symptoms change and discuss preferences about where care is provided.
    complications:
    - Needs may change over time. Ask whom to contact when a home plan is becoming difficult or if carers need more help. Bereavement
      support can be available to families.
    help:
    - Ask your GP or treating team about referral or advice. Use the contact plan for severe worsening symptoms and tell new clinicians
      what matters most to the person receiving care.
  plantar-fasciitis:
    aliases: plantar fasciitis heel pain first steps plantar fascia sore arch
    summary: Plantar fasciitis commonly causes heel pain on the first steps after getting out of bed. It can also flare after standing
      or walking for a long time.
    evidence_gap: Figures for heel pain include several diagnoses. A national estimate for confirmed plantar fasciitis in Ireland
      was not identified.
    symptoms:
    - The underside of the heel may hurt when you first stand or after sitting. It can ease as you move and return after more activity.
      Some people also feel pain along the arch.
    causes:
    - The tissue supporting the arch and attaching to the heel can become irritated when loading changes. Footwear, repetitive standing,
      running or a tight calf may contribute.
    diagnosis:
    - A clinician checks the pain pattern and may examine the foot and ankle. A scan is often unnecessary unless features such as
      significant trauma or unusual pain suggest another cause.
    care:
    - Supportive shoes, adapting activity and suitable calf or foot stretches may help. A physiotherapist or podiatrist can advise
      how to rebuild activity gradually.
    complications:
    - Symptoms often improve over months but can persist. Increasing pain at rest, numbness or swelling may point to a problem needing
      a different assessment.
    help:
    - Seek review if pain prevents ordinary activity or does not improve. Arrange prompt assessment after a significant injury or
      if you cannot put weight on the foot.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/plantar-fasciitis/
  red-eye:
    aliases: red eye painful red eye blurred vision contact lens eye redness
    summary: A red eye can come from irritation or infection. Pain, vision changes, light sensitivity or a red eye in a contact lens
      wearer needs prompt assessment.
    evidence_gap: Red eye is a symptom. Irish diagnosis rates for conjunctivitis or other eye disease cannot establish how often
      it occurs from all causes.
    symptoms:
    - Look for pain, light sensitivity, discharge, gritty feeling or blurred vision. A red patch with no pain or visual change can
      have a different cause from diffuse redness.
    causes:
    - Eye redness can reflect a change on the surface, a small burst blood vessel or inflammation deeper in the eye. Contact lenses
      and eye injuries increase the need for careful assessment.
    diagnosis:
    - A clinician checks vision, symptoms, recent injury and how the surface of the eye looks. They may use dye or a specialist examination
      to look for damage to the cornea.
    care:
    - Remove contact lenses and avoid wearing them until you have appropriate advice. Use the treatment recommended for your cause.
      For a chemical splash, start rinsing immediately and seek emergency guidance.
    complications:
    - Some causes threaten vision if treatment is delayed. Worsening pain, reduced vision or increasing light sensitivity needs re-evaluation,
      even if the redness looks mild.
    help:
    - Seek urgent assessment for pain, visual changes, light sensitivity, injury or redness with contact lenses. For a chemical exposure
      or penetrating injury get emergency help.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/red-eye/
  ringworm:
    aliases: ringworm tinea fungal skin ring rash scalp ringworm
    summary: Ringworm is a fungal skin infection that can appear as a scaly, expanding patch. Infection on the scalp usually needs
      different treatment from a patch on the body.
    evidence_gap: Irish data for fungal infections treated in hospital do not cover most ringworm cases, which are often managed
      by pharmacies or general practice.
    symptoms:
    - A patch may itch and have a more raised or scaly edge. The centre can look clearer but this pattern is not always present.
      Scalp infection may cause scaling and broken hairs.
    causes:
    - Skin fungi can spread by close contact with people or animals or through shared items. The rash is caused by a fungus rather
      than a worm.
    diagnosis:
    - A pharmacist or GP checks the appearance and where it is. Sampling can help when diagnosis is uncertain, symptoms persist or
      the scalp is involved.
    care:
    - A pharmacist can advise on topical treatment for suitable body patches. Scalp infection often needs prescription treatment
      by mouth. Wash hands and avoid sharing clothes, combs or towels.
    complications:
    - Ringworm can spread to other areas or people. Significant scalp inflammation can affect the hair. Using a steroid product alone
      can alter the rash and delay diagnosis.
    help:
    - Ask a GP about a rash on the scalp or widespread infection. Get reassessed if the rash returns or does not improve with the
      advised treatment.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/ringworm/
  scabies:
    aliases: scabies itchy rash mites burrows fingers crusted scabies
    summary: Scabies causes an itchy rash that is often worse at night. If it is confirmed, coordinate treatment with household members
      and other close contacts.
    symptoms:
    - Itching can be intense, with small bumps or fine lines between fingers, on wrists or around the waist. Babies and some older
      people can have a different distribution. The first symptoms can take weeks to appear.
    causes:
    - A mite burrows into the upper layer of skin. It spreads mainly through prolonged close skin contact. A form with thick crusted
      skin can spread more readily and needs specialist advice.
    diagnosis:
    - A clinician assesses the rash, itch and whether close contacts have symptoms. Looking for mites or burrows can help when diagnosis
      is uncertain, particularly during an outbreak.
    care:
    - Use the treatment as directed and coordinate the timing with contacts as advised. Follow instructions about a repeat application,
      clothing and bedding. Ask a clinician about treatment in pregnancy or for a young child.
    complications:
    - Itch can last for weeks after successful treatment. New burrows or an ongoing rash can need reassessment, and scratched skin
      may become infected.
    help:
    - Speak to a pharmacist or GP for suspected scabies or when someone close to you is diagnosed. If symptoms continue or another
      person develops a rash after treatment, ask for a review.
  sciatica:
    aliases: sciatica leg pain nerve pain down leg numbness slipped disc
    summary: Sciatica can cause pain, tingling or numbness down a leg. New changes in bladder or bowel control or numbness around
      the genitals need emergency assessment.
    emergency: For a new inability to pass urine or loss of control of the bowel or bladder with back and leg symptoms, call
    evidence_gap: Irish back-pain surveys include many causes and cannot estimate sciatica separately. A comparable national figure
      specific to nerve-related leg pain was not identified.
    symptoms:
    - Pain can extend from the buttock down the back of the leg and into the foot. Coughing or sneezing can worsen it. There can
      be tingling, numbness or weakness.
    causes:
    - A nerve root in the lower back can become irritated, often by a disc or other changes in the spine. Similar pain can also come
      from muscles or joints.
    diagnosis:
    - A clinician checks the symptom pattern, nerve function and whether any warning signs suggest urgent imaging. Most people do
      not need a scan at the first uncomplicated visit.
    care:
    - Keep gently active as tolerated and ask about suitable pain relief and movement. Persistent pain or weakness may need physiotherapy
      or specialist support.
    complications:
    - In a rare emergency, pressure on nerves causes numbness around the genitals or buttocks, or problems with bladder or bowel
      function. Persistent leg weakness can need further assessment.
    help:
    - Seek emergency help for bladder or bowel changes, numbness around the genitals, or severe or worsening weakness in both legs.
      Contact your GP if symptoms persist or limit ordinary activity.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/sciatica/
  shoulder-pain:
    aliases: shoulder pain sore shoulder rotator cuff painful arm movement
    summary: Shoulder pain can come from tendons, joints or sometimes another area of the body. A sudden injury with deformity or
      inability to lift the arm needs prompt assessment.
    evidence_gap: Injury and compensation reports count selected shoulder injuries. They cannot capture shoulder pain from all causes
      in the Irish population.
    symptoms:
    - Pain can occur when reaching overhead, lying on one side or moving the arm behind you. Stiffness, weakness or pain spreading
      from the neck can guide assessment.
    causes:
    - Possible causes include tendon problems, bursitis, arthritis and injuries. Pain can sometimes be referred from the neck or
      chest rather than arising inside the shoulder.
    diagnosis:
    - A clinician checks the arm and neck and compares active and assisted movement. An X-ray or other scan may be needed after injury
      or if the diagnosis remains uncertain.
    care:
    - Gentle movement within comfort can help many conditions. A clinician may suggest exercise, pain relief or a treatment specific
      to the cause. Avoid forcing movement after an injury.
    complications:
    - Pain and stiffness can limit sleep and daily tasks. Progressive weakness or continuing loss of movement can need additional
      assessment.
    help:
    - Seek prompt review for severe injury, deformity or inability to move the arm. Call emergency services if shoulder or arm pain
      comes with chest pressure, sweating or breathlessness.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/shoulder-pain/
  sinusitis:
    aliases: sinusitis sinus infection facial pressure green mucus rhinosinusitis
    summary: Sinusitis often follows a cold and can cause congestion and pressure around the cheeks or forehead. Most short episodes
      improve without antibiotics.
    evidence_gap: Antibiotic and referral totals include different sinus and upper-airway problems. A verified national frequency
      for sinusitis was not identified.
    symptoms:
    - A blocked nose, reduced smell, facial pain or pressure and thick nasal discharge can occur. Symptoms may worsen when bending
      forward. Some people have tooth pain or fever.
    causes:
    - The lining around the sinuses becomes swollen and drainage slows. Viruses are a common cause. Allergy, dental problems or other
      conditions can cause similar symptoms.
    diagnosis:
    - A clinician considers symptom duration, severity and whether symptoms have worsened after improving. They may examine the nose
      and face. Scans are not usually needed for a straightforward short episode.
    care:
    - Pain relief or a saline rinse may help. A pharmacist or GP can advise on nasal treatments and whether an antibiotic is indicated.
      Repeated or longer-lasting episodes can need a specialist assessment.
    complications:
    - Rarely, infection can spread towards the eye or other areas. Swelling around an eye, double vision, severe frontal headache
      or confusion requires urgent assessment.
    help:
    - Seek prompt help for swelling around an eye, a change in vision or severe illness. Contact your GP if symptoms persist, recur
      or mostly affect one side.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/sinusitis/
  sprains-and-strains:
    aliases: sprain strain twisted joint soft tissue sports pulled muscle swelling
    summary: A sprain stretches or tears a ligament, while a strain affects muscle or tendon. An injury with marked swelling, deformity
      or inability to bear weight may need assessment for a fracture.
    evidence_gap: Claims and accident reports count selected events. They exclude sprains and strains treated outside those systems
      and cannot describe national prevalence.
    symptoms:
    - Pain, swelling and bruising can occur after a twist, fall or sudden movement. You may find it hard to move or use the area.
      A crack or change in shape needs attention.
    causes:
    - Ligaments support joints. Muscles and tendons help move them. A sudden load can damage these tissues without breaking a bone,
      but both injuries can occur together.
    diagnosis:
    - A clinician assesses movement, tenderness, circulation and how the injury occurred. They may arrange an X-ray if they suspect
      a fracture.
    care:
    - Protect the area initially and ask about compression, elevation and appropriate pain relief. Begin gentle movement as advised
      when comfortable. Recovery and return to sport depend on the injury.
    complications:
    - A more severe tear can leave joint instability or weakness. Continuing pain or repeated injuries can need physiotherapy or
      further assessment.
    help:
    - Get prompt assessment if you cannot bear weight, the limb looks misshapen or numbness develops. Review a sprain or strain that
      is not improving as expected.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/sprains-and-strains/
  stomach-ulcer:
    aliases: stomach ulcer gastric ulcer peptic ulcer H pylori upper abdominal pain
    summary: A stomach ulcer is a sore in the stomach lining. Persistent upper abdominal pain needs assessment, and signs of bleeding
      need urgent help.
    emergency: If you vomit blood, pass black tarry stool with faintness or have sudden severe abdominal pain, call
    evidence_gap: Hospital figures for bleeding ulcers exclude many less severe ulcers. Irish H. pylori estimates also do not measure
      how many people have ulcers.
    symptoms:
    - An ulcer can cause burning or aching in the upper abdomen, nausea or early fullness. Some ulcers cause little pain until bleeding
      occurs.
    causes:
    - Helicobacter pylori infection and some anti-inflammatory pain medicines can damage the normal protection of the stomach lining.
      Other causes are less common.
    diagnosis:
    - A clinician asks about symptoms and medicines and may test for H. pylori. Endoscopy can identify an ulcer and allow sampling,
      particularly with persistent symptoms or warning signs.
    care:
    - Treatment may include acid suppression and antibiotics if H. pylori is present. A clinician can review medicines that increase
      bleeding risk and decide whether a repeat test or endoscopy is needed.
    complications:
    - An ulcer can bleed or rarely create a hole through the stomach wall. Black stool, vomiting blood or sudden severe pain requires
      urgent assessment.
    help:
    - Ask your GP about persistent upper abdominal pain or nausea. Seek emergency help if you vomit blood, feel faint or have severe
      sudden pain.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/stomach-ulcer/
  stye:
    aliases: stye eyelid lump hordeolum painful bump eyelash chalazion
    summary: A stye is a tender lump near the edge of an eyelid. A warm compress can help while it settles. Worsening swelling or
      a change in vision needs assessment.
    evidence_gap: Most styes are managed outside hospital and do not have a dedicated national reporting system. No reliable Irish
      population estimate was identified.
    symptoms:
    - A small painful bump can appear near the eyelashes or inside the lid. It may be red or swollen. A deeper, less tender lump
      can have another cause such as a chalazion.
    causes:
    - An eyelash follicle or small gland near the eyelid can become inflamed or infected. Makeup and contact lenses may irritate
      the eye while it settles.
    diagnosis:
    - A pharmacist or clinician can often recognise a stye. A recurring lump in the same place, widespread swelling or symptoms affecting
      vision deserve further assessment.
    care:
    - Apply a clean warm compress and avoid squeezing or piercing the lump. Avoid contact lenses and eye makeup until it settles.
      A clinician can advise if treatment is needed.
    complications:
    - Some lumps take longer to clear or recur. Spread of redness around the eye, fever or pain moving the eye can signal a deeper
      problem.
    help:
    - Seek advice if the lump persists, swelling spreads or pain worsens. Get urgent assessment for vision changes or a very swollen
      painful eye.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/stye/
  targeted-therapy:
    kind: procedure
    aliases: targeted therapy cancer precision medicine HER2 EGFR oncology
    summary: Targeted cancer therapy acts on a specific feature involved in cancer growth. Tumour testing can help determine whether
      a given treatment is likely to help.
    evidence_gap: Systemic treatment totals can mix targeted medicines with chemotherapy, immunotherapy and other oncology treatments.
      An all-Ireland count specific to targeted therapy was not identified.
    symptoms:
    - These medicines may be offered when the type of cancer or a particular test result matches the treatment. Ask what the relevant
      target is and how treatment success will be judged.
    causes:
    - A targeted medicine can block a signal, recognise a protein or interfere with another process that a cancer relies on. Healthy
      tissues can also be affected, so side effects differ by drug.
    diagnosis:
    - The team may review tumour tests, medicines and baseline blood work. Ask how the drug interacts with other prescriptions, supplements
      or foods and whether any monitoring is needed at home.
    care:
    - Some treatments are tablets and others are infusions. The team will tell you how to take it and what to do if you miss a dose
      or vomit after taking it.
    complications:
    - The treatment may stop working if the cancer changes. Possible side effects vary and can include skin or digestive problems,
      and some medicines need heart or blood-pressure monitoring.
    help:
    - Use the treatment team's contact plan for new or worsening symptoms. Check before stopping, doubling or combining doses.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/targeted-therapy/
  tendonitis:
    aliases: tendonitis tendinitis tendinopathy overuse tendon pain
    summary: Tendon pain often worsens when a muscle repeatedly pulls on the affected tendon. A sudden pop with weakness can mean
      a tear rather than overuse.
    evidence_gap: Irish figures for sports and workplace injuries do not reliably identify all tendon problems or distinguish the
      different tendons involved.
    symptoms:
    - Pain and tenderness often sit near a joint and increase with lifting, jumping or another specific action. There may be stiffness
      after rest or mild swelling.
    causes:
    - A tendon attaches muscle to bone. A sudden increase in load can contribute to irritation or changes in the tendon. Persisting
      symptoms are often referred to as tendinopathy.
    diagnosis:
    - A clinician examines which movements provoke pain and checks strength. Imaging may be needed after a sudden injury or when
      the diagnosis is unclear.
    care:
    - Modify the activity causing painful overload, then build it back with a suitable exercise programme. A physiotherapist can
      adapt the programme to the tendon and activity.
    complications:
    - Tendon symptoms can recur if load rises more quickly than the tissue can manage. Sudden weakness or a gap in a tendon can require
      urgent assessment for rupture.
    help:
    - Seek prompt advice after a pop with loss of strength or inability to move normally. Ask for assessment if pain persists or
      limits work or sport.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/tendonitis/
  tennis-elbow:
    aliases: tennis elbow lateral epicondylitis outer elbow pain grip wrist tendon
    summary: Tennis elbow causes pain on the outside of the elbow, often when gripping or lifting. Work, household tasks and sport
      can all aggravate it.
    evidence_gap: Published Irish workplace injury records do not capture tennis elbow from all work, sports and household activities.
      A national estimate was not found.
    symptoms:
    - Pain is usually worse when gripping, twisting a lid or lifting something with the palm down. It can spread into the forearm.
      Numbness or persistent weakness can have a different cause.
    causes:
    - Repeated load on the tendons that help lift the wrist can irritate their attachment near the outside of the elbow. Symptoms
      can develop without one clear injury.
    diagnosis:
    - A clinician asks which activities cause symptoms and examines grip and movement. A straightforward case often needs no scan,
      but injuries or unusual symptoms may need investigation.
    care:
    - Change repetitive tasks where possible and ask a physiotherapist about exercises that build strength gradually. Some people
      use a short period of support while adjusting activities.
    complications:
    - Recovery can take weeks or months. Returning quickly to the same workload may bring symptoms back. Persistent swelling or reduced
      movement warrants review.
    help:
    - Contact a clinician if pain interferes with work, sleep or daily tasks. Arrange assessment sooner if the elbow is hot, swollen
      or immobile after injury.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/tennis-elbow/
  tinnitus:
    aliases: tinnitus ringing buzzing ears pulsatile tinnitus noise hearing loss
    summary: Tinnitus is hearing a sound without a matching outside source. New tinnitus with sudden hearing loss, or a sound that
      beats with your pulse, needs medical assessment.
    evidence_gap: Irish hearing loss data cannot establish the prevalence of tinnitus. The two can occur together, but not everyone
      with one has the other.
    symptoms:
    - People can hear ringing, buzzing, hissing or other sounds in one or both ears. It may come and go, be constant or be more noticeable
      in a quiet room.
    causes:
    - Tinnitus is often linked to changes in hearing or noise exposure. Wax, some medicines and other conditions can play a role.
      Sounds that follow the heartbeat can need different investigation.
    diagnosis:
    - A clinician asks about timing, hearing loss, medicines and whether the sound pulses. An examination and hearing tests can identify
      causes or guide specialist referral.
    care:
    - Treating a contributing cause or using hearing support can help some people. Sound enrichment and psychological strategies
      can reduce distress or improve sleep. Protect hearing in noisy environments.
    complications:
    - Tinnitus can affect concentration, sleep and mood. New one-sided symptoms, sudden loss of hearing or distress that prevents
      normal activity should be raised with a clinician.
    help:
    - Speak to your GP if tinnitus persists or is bothersome. Seek urgent assessment for sudden hearing loss, tinnitus after a head
      injury or tinnitus with new severe vertigo or weakness.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/tinnitus/
  vertigo:
    aliases: vertigo spinning dizziness BPPV balance inner ear
    summary: Vertigo is a sensation of spinning or movement. Symptoms triggered by rolling over in bed can have a different cause
      from continuous vertigo or dizziness with a new neurological symptom.
    emergency: If sudden dizziness comes with arm or facial weakness, trouble speaking or new inability to walk, call
    evidence_gap: Hospital and community data often group vertigo and other kinds of dizziness. A comparable Irish national figure
      specific to vertigo was not identified.
    symptoms:
    - You may feel that the room is moving and have nausea or unsteadiness. Brief episodes on head movement differ from hours of
      continuous spinning. Hearing loss or ringing can give another clue.
    causes:
    - Balance depends on signals from the inner ears, eyes and body. Loose particles in an inner ear canal can cause brief positional
      vertigo. Other inner ear or brain disorders can cause a different pattern.
    diagnosis:
    - A clinician asks about duration, triggers, hearing and neurological symptoms. They may examine balance and eye movements and
      perform positional tests. Some presentations need emergency investigation.
    care:
    - Treatment depends on the cause. A trained clinician can perform repositioning manoeuvres for confirmed positional vertigo.
      Other causes may need medicine, rehabilitation or urgent hospital care.
    complications:
    - Vertigo can increase fall risk and affect driving. Severe new imbalance, double vision, problems speaking or sudden weakness
      can signal a stroke or another emergency.
    help:
    - Ask a GP for review if vertigo recurs or interferes with activity. Seek urgent care for sudden hearing loss, severe new symptoms
      or neurological warning signs.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/vertigo/
  warts-verrucas:
    aliases: warts verrucas verruca plantar wart HPV common wart skin
    summary: Warts are small skin growths caused by a virus. A wart on the sole is called a verruca, which can hurt when standing
      or walking.
    evidence_gap: Warts managed at home are not captured in service records. Irish data for genital warts do not describe common
      skin warts or verrucas.
    symptoms:
    - Common warts can be rough and raised. Verrucas may look flatter under pressure and sometimes have small black dots. Corns and
      other lesions can look similar.
    causes:
    - Skin types of HPV can infect small breaks in the skin and spread by touch. The types involved in common skin warts differ from
      many of those associated with genital disease.
    diagnosis:
    - A pharmacist, GP or podiatrist can often recognise a wart. An unusual colour, spontaneous bleeding or uncertainty about the
      diagnosis needs assessment before treatment.
    care:
    - Many warts clear over time. A pharmacist can advise on suitable treatment for common warts. Ask for clinical advice before
      treating feet if you have diabetes or poor circulation.
    complications:
    - Treatment can irritate skin, and warts can recur or spread. Avoid trimming or picking a wart, or sharing equipment that touches
      it.
    help:
    - Ask a GP if you are unsure what a growth is, it changes rapidly or it is on the face or genitals. Seek advice if a foot lesion
      makes walking painful.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/warts-verrucas/
  wisdom-tooth-removal:
    kind: procedure
    aliases: wisdom tooth removal impacted wisdom tooth extraction oral surgery dry socket
    summary: A wisdom tooth may need removal if it repeatedly causes infection, decay or damage to a neighbouring tooth. The dentist
      can explain the plan using your examination and X-ray.
    evidence_gap: Hospital extraction figures exclude procedures done in dental practices and may combine wisdom and other teeth.
      A national activity count specific to wisdom tooth removal was not identified.
    symptoms:
    - Many wisdom teeth cause no difficulty. Removal can be considered if a partly erupted tooth leads to recurrent painful swelling
      or a tooth cannot be treated in another way.
    causes:
    - Depending on position, the tooth can sometimes be removed through the gum in one piece. A deeper tooth may need a small gum
      opening or removal in sections.
    diagnosis:
    - Tell the dentist about medicines, allergies or bleeding problems. Check instructions on fasting, sedation, transport and whether
      you will need time off.
    care:
    - Local anaesthetic numbs the area, and some people also receive sedation or need a hospital procedure. The team will explain
      how to control bleeding and manage pain at home.
    complications:
    - Pain and swelling are expected initially. Increasing pain after a few days can suggest dry socket or infection. Numbness, continued
      bleeding or fever needs advice.
    help:
    - Follow the dentist's written instructions. Contact the service for worsening swelling, uncontrolled bleeding or fever. Get
      emergency help if breathing or swallowing is affected.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/wisdom-tooth-removal/
  adenomyosis:
    aliases: adenomyosis painful heavy periods uterus muscle endometrial tissue
    summary: Adenomyosis can cause heavy bleeding and severe period pain. Discuss worsening symptoms with a GP even if you have previously
      been told period pain is normal.
    evidence_gap: Studies based on tissue removed during surgery exclude many people diagnosed by imaging or with no symptoms. An
      Irish national estimate covering these groups was not identified.
    symptoms:
    - Common symptoms include painful or heavy periods, pelvic pressure or pain during sex. Some people have no symptoms and only
      find out after a scan or operation.
    causes:
    - Gland-like tissue similar to the womb lining is present in the wall of the womb. It can contribute to inflammation, tenderness
      and enlargement of the womb.
    diagnosis:
    - A clinician reviews the bleeding and pain pattern. Ultrasound or MRI can look for features of adenomyosis and other causes,
      including fibroids. Adenomyosis and endometriosis can occur together.
    care:
    - Treatment may include pain relief, medication to reduce bleeding or a hormonal option. Surgery can be discussed in suitable
      cases. Choices depend on symptoms and whether you want a pregnancy.
    complications:
    - Heavy bleeding can lead to anaemia. Symptoms can affect work, relationships and quality of life. Ask about checking your blood
      count if you feel fatigued or breathless.
    help:
    - Arrange a GP review if pain or bleeding affects everyday life. Seek urgent advice if bleeding is very heavy, you feel faint
      or severe pain occurs with possible pregnancy.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/adenomyosis/
  anorexia-nervosa:
    aliases: anorexia nervosa severe restriction eating disorder body image
    summary: Anorexia nervosa can involve restricting food, strong fear about gaining weight or behaviours aimed at preventing weight
      gain. Early assessment matters, even if a person seems to be managing at school or work.
    evidence_gap: Irish eating-disorder referrals and hospital data group several diagnoses and capture only people who use those
      services. They cannot estimate national anorexia prevalence.
    symptoms:
    - Changes can include avoiding meals, rigid food rules, distress about changes in weight, excessive exercise, fatigue or dizziness.
      A child may stop growing at the expected rate.
    causes:
    - Physical and psychological factors reinforce each other. When the body is underfed, hunger cues, concentration and flexibility
      around food can change, making it harder to eat enough.
    diagnosis:
    - A GP checks physical health and asks about weight history, food, exercise and thoughts. An ECG or blood tests may be needed.
      An assessment considers the person's overall health, not just one weight measurement.
    care:
    - Treatment can involve specialist therapy, nutritional support and regular medical monitoring. Some people need hospital care.
      Families can have an important role in supporting a child or young person.
    complications:
    - Malnutrition can affect the heart, bones, hormones and concentration. People can be medically unwell before the seriousness
      is clear to those around them.
    help:
    - Contact a GP or treating team about persistent restriction, faintness or a fast deterioration. Get urgent medical help for
      collapse, chest pain, severe weakness or significant concerns about safety.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/anorexia-nervosa/
  binge-eating-disorder:
    aliases: binge eating disorder BED episodes loss of control food eating disorder
    summary: Binge eating disorder involves repeated distressing episodes of feeling unable to control eating. Treatment can help
      people understand the pattern and reduce the episodes.
    evidence_gap: Survey questions about occasional binge eating differ from a diagnosis of binge eating disorder. No directly comparable
      Irish population figure was identified.
    symptoms:
    - A person may eat rapidly, eat despite being uncomfortably full or eat alone because of embarrassment. There can be considerable
      distress afterwards. An isolated episode does not establish a disorder.
    causes:
    - Stress, restrictive dieting, emotions and other factors can affect eating patterns. More than one influence can be present
      and the reason for episodes can differ over time.
    diagnosis:
    - A clinician asks about how often the episodes happen, the sense of control and what happens afterwards. An assessment also
      considers mood, other eating disorder symptoms and physical health.
    care:
    - Guided self-help or talking therapy can be offered. A plan can involve regular meals and strategies to manage triggers. Ask
      for support suited to your situation.
    complications:
    - The pattern can cause distress, isolation or health concerns. Focusing entirely on weight can miss the eating disorder and
      delay the support that is needed.
    help:
    - Contact a GP if episodes recur or cause distress. Tell them if low mood, anxiety or another health issue is also affecting
      you, so support can be planned together.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/binge-eating-disorder/
  bipolar-disorder:
    aliases: bipolar disorder mania hypomania depression mood episode bipolar affective
    summary: Bipolar disorder involves distinct episodes of depression and mania or hypomania. A change in sleep, activity and judgement
      that is very different from someone's usual pattern deserves assessment.
    evidence_gap: Public hospital and mental-health service records represent people who access those services. A comparable Irish
      population prevalence estimate was not identified.
    symptoms:
    - During an elevated episode, someone may need very little sleep, talk quickly, have racing ideas or take unusual risks. Depression
      can involve low mood, loss of interest and changes in sleep or energy.
    causes:
    - Bipolar disorder has multiple contributing factors, including inherited vulnerability. Stress, changing sleep or substance
      use can affect episodes but do not explain every case.
    diagnosis:
    - A mental health assessment reviews mood and behaviour over time. It can help to bring notes or invite a trusted person with
      consent. Clinicians consider other causes and types of mood disorder.
    care:
    - Treatment may include medicines, psychological education and an agreed plan for early warning signs. Discuss sleep, alcohol,
      medication monitoring and pregnancy planning where relevant.
    complications:
    - Episodes can interfere with work, relationships and safety. Some people develop severe symptoms such as psychosis and may need
      urgent specialist treatment.
    help:
    - Seek advice promptly if someone goes for several nights with very little sleep and becomes increasingly active, reckless or
      unwell. Seek emergency care if there is an immediate risk of serious harm.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/bipolar-disorder/
  borderline-personality-disorder:
    aliases: borderline personality disorder BPD emotional dysregulation emotional instability
    summary: Borderline personality disorder can involve intense emotions and difficulty coping with distress or relationships. A
      mental health assessment can help identify support without reducing the person to a label.
    evidence_gap: Irish routine care data do not capture everyone meeting diagnostic criteria, particularly people without specialist
      contact. A directly comparable estimate was not identified.
    symptoms:
    - Emotions may shift rapidly, and situations such as rejection or conflict can feel overwhelming. Some people struggle with impulsive
      behaviour, feeling disconnected or repeated crises.
    causes:
    - Many factors can shape emotional regulation, including temperament and past experience. A person's history matters, but one
      symptom or difficult experience cannot establish the diagnosis.
    diagnosis:
    - A specialist looks at long-term patterns and how they affect life. They also consider other conditions with similar features,
      including trauma-related difficulties or mood disorders.
    care:
    - Structured therapies can teach coping, problem-solving and relationship skills. A GP or mental health team can help arrange
      support and agree a plan for crises.
    complications:
    - Symptoms can affect relationships, work and safety, particularly during severe distress. With treatment and support, people
      can develop skills and experience meaningful improvement.
    help:
    - Ask a GP or mental health team for help if distress or crises recur. Seek urgent help or attend an emergency department if
      there is a risk of serious harm.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/borderline-personality-disorder/
  bulimia:
    aliases: bulimia nervosa binge eating compensatory behaviour eating disorder
    summary: Bulimia involves episodes of binge eating followed by attempts to compensate. A person can have serious effects on health
      even when others cannot see a change in weight.
    evidence_gap: A comparable Irish national rate for bulimia was not identified. Service totals combine diagnoses and do not account
      for people who have not sought care.
    symptoms:
    - A person may feel their eating is out of control during episodes, then feel distressed or ashamed. Symptoms can include sore
      throat, dental changes, dizziness or fatigue. Some people hide what is happening.
    causes:
    - Stress, restrictive eating and concerns about weight or shape can contribute to a recurring cycle. Repeated compensatory behaviour
      can disrupt the body's fluid and salt balance.
    diagnosis:
    - A GP asks about eating, mood and physical health and may request blood tests or a heart tracing. Being as honest as you can
      helps the clinician assess risks and offer treatment.
    care:
    - Care can involve structured therapy, support with normalising eating and medical monitoring. Ask how to access local eating
      disorder services and when follow-up will happen.
    complications:
    - Fluid or salt changes can affect heart rhythm. Dental problems and digestive discomfort can occur. Shame can make it harder
      to seek help, but the condition is treatable.
    help:
    - Speak to a GP if you recognise a recurring pattern. Seek urgent assessment for fainting, chest pain, severe weakness or inability
      to keep down fluids.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/bulimia/
  combined-oral-contraception-the-pill:
    kind: procedure
    aliases: combined pill combined oral contraceptive oestrogen progestogen COC contraception
    summary: The combined pill contains two hormones to prevent pregnancy. A clinician can check whether it suits you and explain
      what to do if you miss a pill.
    evidence_gap: Healthy Ireland reports the contraceptive pill as a group. The published figure does not separate the combined
      pill from other oral contraception.
    symptoms:
    - It may suit someone who wants a daily contraceptive tablet and can take a method containing oestrogen. A history of particular
      migraines, clots or some other conditions can affect suitability.
    causes:
    - The hormones usually prevent ovulation and change cervical mucus. Different products use different schedules, so instructions
      for one brand may not apply to another.
    diagnosis:
    - Tell the prescriber about smoking, migraine symptoms, blood pressure, previous clots and medicines. Ask when protection starts
      and what to do during vomiting or diarrhoea.
    care:
    - Take the pill according to the specific prescription and leaflet. Ask a pharmacist or clinician for missed-pill advice promptly,
      especially if you recently had sex without another method.
    complications:
    - Some people have spotting or other side effects. Methods with oestrogen carry a small increased risk of a clot. Sudden chest
      pain or breathlessness needs emergency assessment.
    help:
    - Speak to your GP or clinic if you develop new migraine features, have side effects or want to change methods. Seek prompt advice
      after missed pills if pregnancy is possible.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/services/sexual-health/free-contraception/
  contraception-and-menopause:
    kind: service
    aliases: contraception menopause perimenopause over 40 HRT coil stop contraception
    summary: Periods can become irregular before menopause and pregnancy can still be possible. A GP or clinic can help you decide
      which contraception to use and when it is safe to stop.
    symptoms:
    - Anyone who could become pregnant and wants to avoid pregnancy may need contraception during perimenopause. Choice changes with
      age, health history and preferences.
    causes:
    - Menopausal hormone therapy is generally used to treat symptoms and does not provide contraception. Some devices can have more
      than one role, with different replacement intervals.
    diagnosis:
    - Tell your clinician which contraception and HRT you use and when each was started. Bleeding patterns on hormonal methods can
      make menopause timing harder to interpret.
    care:
    - Talk through options for switching, continuing or stopping a method. A clinician can advise when blood tests are relevant and
      what to do if bleeding changes.
    complications:
    - Bleeding after menopause or new unexplained bleeding needs assessment. Ask how your contraception changes which symptoms should
      prompt review.
    help:
    - Check with a GP or clinic before stopping contraception if you are unsure whether pregnancy is still possible. Ask for written
      dates if a coil or other device also has a treatment role.
  eating-disorders:
    aliases: eating disorders anorexia bulimia binge eating disordered eating support
    summary: Eating disorders can affect people at any weight or age. Changes in eating, distress about food or compulsive behaviour
      around exercise are reasons to seek help early.
    symptoms:
    - Signs can include avoiding meals, eating in secret, repeated binge episodes, distress after eating or excessive concern about
      weight. A person may also withdraw socially, feel cold or become dizzy.
    causes:
    - Several influences can contribute, including biological vulnerability, stressful experiences and social pressure. An eating
      disorder can develop without an obvious trigger and cannot be recognised from appearance alone.
    diagnosis:
    - A GP asks about eating, exercise, physical symptoms and mental health. They may check pulse, blood pressure and blood tests,
      and refer to a specialist eating disorder team.
    care:
    - Treatment can include psychological care, nutritional rehabilitation and physical monitoring. The person's age and the type
      of eating disorder help guide the plan. Family or other supporters can be involved with consent.
    complications:
    - Some eating disorders can cause dehydration, abnormal heart rhythm or nutritional problems. Depression or anxiety can occur
      alongside them. Early support can reduce medical risk and improve recovery.
    help:
    - Speak to a GP if eating patterns or distress are affecting your life. Get urgent help for fainting, chest symptoms, inability
      to keep fluids down or serious concerns about safety.
    sources:
      Clinical guidance and further reading: https://about.hse.ie/publications/hcp-eating-disorders-model-of-care/
  emergency-contraception:
    kind: procedure
    aliases: emergency contraception morning after pill emergency coil unprotected sex
    summary: Emergency contraception can reduce the chance of pregnancy after sex without contraception or after a method fails.
      Seek advice as soon as possible because options have time limits.
    evidence_gap: The national Free Contraception Scheme records access across several methods. That overall count cannot identify
      how often emergency contraception is used.
    symptoms:
    - You may need it after a missed pill, a split condom or another break in protection. A pharmacist or clinic can assess suitability
      based on when sex happened and your usual method.
    causes:
    - Options in Ireland include certain tablets and the fitting of a copper coil. The choice depends on timing, medicines, health
      history, and when you might have ovulated.
    diagnosis:
    - Tell the clinician or pharmacist the timing of sex, any contraception used and medicines taken recently. Mention if you are
      breastfeeding or could already be pregnant.
    care:
    - A pharmacist or clinician can supply suitable tablets, or a trained clinician can arrange fitting of a copper coil. Ask when
      you can restart or begin regular contraception.
    complications:
    - The next period can be earlier or later. Ask when to take a pregnancy test and what to do if you vomit soon after taking a
      tablet. The tablet does not protect against infections.
    help:
    - Seek advice promptly from a pharmacy, GP or family planning clinic. Ask about STI care if needed, and seek assessment for severe
      pain or suspected pregnancy.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/emergency-contraception/
  external-male-condom:
    kind: procedure
    aliases: external condom condom use barrier contraception STI latex
    summary: External condoms reduce the risk of pregnancy and many sexually transmitted infections. They work best when used correctly
      from the start of sex.
    symptoms:
    - Condoms are suitable for many people who want a barrier method or STI protection alongside other contraception. A pharmacist
      or clinic can advise on suitable types and sizes.
    causes:
    - A condom forms a physical barrier that reduces transfer of semen and other fluids. It may offer less protection against infections
      passed through areas of skin it does not cover.
    diagnosis:
    - Check the use-by date and packaging. Use a suitable lubricant for the material. Oil-based products can damage latex. Use a
      new condom each time.
    care:
    - Follow the packet instructions, including holding the base when withdrawing after use. Use a new one if the condom is damaged,
      put on incorrectly or removed.
    complications:
    - A condom can split or slip. If that happens, promptly ask a pharmacist or clinic about emergency contraception or whether STI
      assessment is appropriate.
    help:
    - Ask a pharmacist or sexual health service for advice about a split condom, testing, or choosing a suitable alternative if latex
      causes irritation.
  fertility:
    aliases: fertility problems infertility trying to conceive fertility hub pregnancy tests Ireland
    summary: Fertility problems can have more than one cause, and assessing both partners where relevant can help decide what to
      do next. Your GP can discuss testing and referral.
    symptoms:
    - Some people have irregular periods, pelvic pain or known sperm problems. Others have no obvious symptoms beyond difficulty
      conceiving. Age and time trying influence when to seek assessment.
    causes:
    - Factors can include problems with ovulation, fallopian tubes, sperm or the womb. Sometimes standard tests do not find a clear
      cause. Previous pregnancy does not exclude a later difficulty.
    diagnosis:
    - A clinician reviews medical history, periods and medicines. Tests may include blood samples, semen analysis and imaging. The
      timing and order depend on what has already been checked.
    care:
    - Care can involve addressing a cause, supporting ovulation or referral for assisted reproduction. Irish regional fertility hubs
      assess eligibility for publicly funded treatment. Check the current criteria with the HSE.
    complications:
    - Tests and treatment can take time and have emotional and financial effects. Ask which next step would change the plan, when
      to expect results and what support is available.
    help:
    - Contact your GP if you are struggling to conceive, particularly with irregular periods, known pelvic or sperm problems or concerns
      about age. Ask about the regional fertility hub pathway.
    sources:
      Clinical guidance and further reading: https://about.hse.ie/publications/hse-fertility-services-report-2025/
  heavy-periods:
    aliases: heavy periods heavy menstrual bleeding menorrhagia anaemia period flooding
    summary: Heavy periods can disrupt daily life and cause iron deficiency. Tell your GP how bleeding affects work, sleep or ordinary
      activity, even if it has been heavy for a long time.
    evidence_gap: Irish treatment and surgery records capture selected patients and do not identify everyone with heavy periods.
      A comparable national estimate using a consistent symptom definition was not located.
    symptoms:
    - You may need to change period products frequently, pass large clots or bleed through clothes or bedding. Fatigue or breathlessness
      can be signs of anaemia.
    causes:
    - Bleeding patterns can change with hormones, fibroids, adenomyosis, a device or other conditions. Some medicines affect bleeding,
      and sometimes there is no clear structural cause.
    diagnosis:
    - A GP asks about timing, pain and bleeding between periods or after sex. They may check for pregnancy or anaemia and arrange
      an examination, scan or specialist review.
    care:
    - Options can include medicines to reduce bleeding, hormonal treatment or a procedure. The choice depends on the cause, contraception
      needs and plans for pregnancy.
    complications:
    - Ongoing blood loss can cause iron deficiency or anaemia. Sudden heavy bleeding or bleeding after menopause should be assessed
      in its own right.
    help:
    - Contact your GP if bleeding affects your life or if you feel unusually tired. Get urgent help for very heavy bleeding with
      faintness or severe pain, particularly if pregnancy is possible.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/heavy-periods/
  intrauterine-system-ius:
    kind: procedure
    aliases: IUS hormonal coil intrauterine system LNG contraception Mirena
    summary: The hormonal coil is fitted inside the womb and releases a small amount of progestogen. Some types are also used to
      reduce heavy periods.
    symptoms:
    - The device offers long-lasting contraception without a daily tablet. Choice can depend on bleeding pattern, medical history
      and whether the coil is intended for contraception or another use.
    causes:
    - Progestogen thickens cervical mucus and thins the lining of the womb. Products differ in how long they can stay in place and
      what they are licensed to treat.
    diagnosis:
    - Ask how the clinician excludes pregnancy and whether you need extra contraception around insertion. Discuss pain relief, previous
      difficult examinations and any infection symptoms.
    care:
    - A trained clinician inserts the device through the cervix. You can ask them to explain each step and pause if needed. Before
      leaving, ask about follow-up and which symptoms to report.
    complications:
    - Spotting can be irregular at first and periods often become lighter. Severe pain or fever, concern that the device moved, or
      symptoms of pregnancy need assessment.
    help:
    - Contact the fitting clinic about a change in threads, ongoing pain or suspected pregnancy. Confirm the replacement date for
      the specific device and reason it was fitted.
  mastitis:
    aliases: mastitis breastfeeding breast inflammation breast infection fever hot red breast
    summary: Mastitis while breastfeeding can cause a painful hot area of the breast and flu-like symptoms. Get advice early if you
      feel unwell or the area worsens.
    evidence_gap: Irish service records do not cover all episodes managed with feeding support at home. A comparable national figure
      for mastitis during breastfeeding was not identified.
    symptoms:
    - A breast can become painful, firm or swollen, often in one area. There may be redness, fever, aches or chills. A persistent
      lump or a soft painful swelling needs review.
    causes:
    - Breast tissue can become inflamed when milk flow changes or the breast is irritated. Sometimes infection occurs. Pressure or
      forceful massage can worsen irritation.
    diagnosis:
    - A clinician or lactation professional checks symptoms, feeding pattern and how long the breast has been painful. Persistent
      swelling or lack of improvement can prompt tests for an abscess.
    care:
    - Continue normal feeding as tolerated and ask for support with positioning or expression. A cool compress and suitable pain
      relief may help. A clinician decides whether antibiotics are needed.
    complications:
    - An abscess can cause an increasingly painful swelling or persistent fever. It may need drainage. Persistent breast changes
      after the inflammation settles should be assessed.
    help:
    - Contact your GP or maternity service if you feel very unwell, symptoms do not improve or a lump worsens. Ask for prompt assessment
      if fever persists or redness spreads.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/mastitis/
  molar-pregnancy:
    aliases: molar pregnancy hydatidiform mole gestational trophoblastic disease GTD hCG
    summary: A molar pregnancy is an uncommon problem with the tissue that would usually form the placenta. Specialist follow-up
      is important even after the pregnancy tissue has been removed.
    symptoms:
    - Bleeding in pregnancy, severe nausea or a different scan pattern can lead to investigation. Some molar pregnancies are found
      only after tissue is examined following a pregnancy loss.
    causes:
    - The genetic material in the pregnancy is abnormal. Placental tissue can grow in an unusual way and produce pregnancy hormone.
      There are complete and partial types, which have different patterns.
    diagnosis:
    - A team uses ultrasound, blood tests for hCG and sometimes tissue examination. The type may only be confirmed after specialist
      pathology review.
    care:
    - Care usually involves removing the pregnancy tissue and measuring hCG until follow-up is complete. Follow the specialist team's
      advice about pregnancy during monitoring.
    complications:
    - In some cases abnormal tissue can continue growing and need additional treatment. Regular hCG measurements detect this early.
      A later pregnancy can usually be planned with advice once follow-up ends.
    help:
    - Contact your maternity team about bleeding or severe symptoms in pregnancy. After diagnosis, ask who will arrange blood tests
      and whom to call if you miss a result.
  obsessive-compulsive-disorder:
    aliases: OCD obsessive compulsive disorder intrusive thoughts checking rituals compulsions
    summary: OCD can cause unwanted thoughts and repeated actions or mental rituals. Treatment can help reduce how much time and
      distress the cycle causes.
    evidence_gap: General Irish estimates for anxiety or psychological distress do not isolate OCD. A consistent Irish population
      prevalence measure was not identified.
    symptoms:
    - A person may feel driven to check, wash, count, seek reassurance or repeat thoughts. These actions may provide short relief.
      Intrusive thoughts can be upsetting and do not by themselves tell you what a person intends.
    causes:
    - A distressing thought or doubt can be followed by a ritual to reduce anxiety. Relief can reinforce the ritual and make it harder
      to tolerate the uncertainty next time.
    diagnosis:
    - An assessment looks at patterns, time spent, distress and interference with daily life. Tell the clinician about mental rituals
      as well as visible actions.
    care:
    - Specialist cognitive behavioural therapy can include exposure and response prevention. Some people also benefit from medication.
      The therapist can tailor the plan and pace to the person.
    complications:
    - OCD can affect sleep, relationships, school or work. Avoidance and reassurance may gradually take up more time, and another
      condition may need support too.
    help:
    - Talk to your GP or mental health team if symptoms are distressing, time-consuming or interfering with daily life. Ask about
      specialist therapy for OCD.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/obsessive-compulsive-disorder/
  period-pain:
    aliases: period pain painful periods menstrual cramps dysmenorrhoea pelvic pain
    summary: Period cramps are common, but pain that prevents everyday activities or changes over time deserves assessment. Conditions
      such as endometriosis or adenomyosis can cause similar symptoms.
    evidence_gap: Survey estimates for cramps can include mild discomfort or disabling pain. A comparable national Irish estimate
      using a consistent severity definition was not identified.
    symptoms:
    - Cramping is often low in the abdomen and can spread to the back or thighs. Some people also feel nauseated or have loose stools.
      Note whether pain occurs outside the period.
    causes:
    - The womb contracts during a period. Hormone-like substances can make the contractions stronger. Sometimes another pelvic condition
      is responsible for unusually severe or spreading pain.
    diagnosis:
    - A clinician asks when the pain occurs and how it affects life. They may consider bleeding pattern, pregnancy, bladder or bowel
      symptoms and whether an examination or scan is needed.
    care:
    - Heat and suitable pain relief can help some people. A clinician can discuss hormonal treatment or a plan to investigate persistent
      pain. Track symptoms and what has helped.
    complications:
    - Pain can affect sleep, education and work. Delayed assessment may prolong avoidable symptoms, especially when there is an underlying
      condition needing care.
    help:
    - Speak to your GP for severe or changing pain, pain between periods or pain during sex. Get urgent advice for sudden severe
      pain, faintness or possible pregnancy.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/period-pain/
  polyendocrine-metabolic-ovarian-syndrome-pmos:
    aliases: PMOS PCOS polycystic ovary syndrome polyendocrine metabolic ovarian syndrome irregular periods
    summary: Polyendocrine metabolic ovarian syndrome, previously called PCOS, can affect ovulation, periods, skin and metabolic
      health. The effects vary from person to person.
    evidence_gap: Estimates vary with the diagnostic criteria and age group. A directly comparable Irish national estimate for PMOS
      was not identified.
    symptoms:
    - Periods may be infrequent or irregular. Some people notice acne, increased facial or body hair or difficulty conceiving. Ovaries
      that look polycystic can occur without the syndrome.
    causes:
    - A combination of hormone changes, ovarian function and metabolic factors can contribute. Some people have insulin resistance.
      The name change reflects features beyond the ovaries.
    diagnosis:
    - A clinician considers symptoms and can use blood tests and sometimes ultrasound to assess them and rule out similar conditions.
      Diagnosis in adolescents requires particular care.
    care:
    - Management depends on symptoms and priorities. Treatment can help with periods, skin symptoms, fertility or metabolic risks.
      Ask which health checks are appropriate and when to review them.
    complications:
    - Long gaps between periods can affect the womb lining. Some people have a higher risk of type 2 diabetes or other metabolic
      complications and benefit from screening.
    help:
    - Discuss persistent changes in cycles, troublesome hair growth or trouble conceiving with a GP. Ask how the diagnosis was made
      and what follow-up suits your age and circumstances.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/polyendocrine-metabolic-ovarian-syndrome-pmos/
  postnatal-depression:
    aliases: postnatal depression PND postpartum depression mental health after birth
    summary: Postnatal depression can develop in the months after birth. Persistent low mood, anxiety or loss of interest deserves
      support from your GP, midwife or public health nurse.
    emergency: If you or a baby is in immediate danger, call
    evidence_gap: Irish service figures include several perinatal conditions. A survey of symptoms or a referral count cannot show
      how many people are diagnosed with postnatal depression nationally.
    symptoms:
    - You may feel low, numb, guilty, worried or unable to enjoy things. Sleep problems beyond the baby's usual waking can occur.
      Some people find it difficult to feel connected or manage everyday tasks.
    causes:
    - Physical changes, sleep disruption, past depression, stress and available support can all contribute. You can have postnatal
      depression even if the birth went as planned.
    diagnosis:
    - A clinician asks about symptoms, duration, daily functioning and safety. They may use a short screening questionnaire and check
      for physical issues such as anaemia or thyroid problems if indicated.
    care:
    - Support can include practical help, talking therapy or medication. Tell the clinician if you are breastfeeding so you can discuss
      suitable options. Specialist perinatal services can help with more complex symptoms.
    complications:
    - Depression can interfere with self-care and caring for the baby. Severe confusion, unusual beliefs or hearing voices after
      birth can indicate a different emergency and need immediate help.
    help:
    - Speak to your GP or maternity team if you are worried, even in the first weeks. Get urgent help for thoughts of harming yourself
      or the baby, or for severe confusion or unusual beliefs.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/postnatal-depression/
  psychosis:
    aliases: psychosis hallucinations delusions hearing voices first episode psychosis mental health
    summary: Psychosis can change how someone experiences or interprets what is happening around them. New symptoms deserve prompt
      medical assessment and can have several different causes.
    evidence_gap: Irish studies of first episodes and hospital admissions measure different groups. No comparable prevalence figure
      covering psychosis from all causes was identified.
    symptoms:
    - A person may hear or see things others do not, hold unusual beliefs or seem confused and unable to organise thoughts. Behaviour,
      sleep and ability to manage daily life can change.
    causes:
    - Psychosis can occur in several mental or physical illnesses or be linked to substances, medicines or severe sleep disruption.
      The first episode needs assessment to clarify the cause.
    diagnosis:
    - A clinician assesses symptoms, timing, physical health and safety. They may arrange tests or ask for observations from someone
      who knows the person, with consent where possible.
    care:
    - Care may involve an early-intervention team, medication, psychological support and practical help with sleep, work or study.
      The plan depends on the cause and the person's needs.
    complications:
    - Someone may feel frightened or find basic tasks difficult. Early support can help reduce disruption. Sudden confusion with
      fever or physical illness can also need urgent medical care.
    help:
    - Contact a GP, mental health service or emergency department promptly about new symptoms. If there is immediate danger or the
      person cannot be kept safe, call emergency services.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/psychosis/
  ptsd:
    aliases: PTSD post traumatic stress disorder trauma flashbacks nightmares avoidance
    summary: Post-traumatic stress disorder can develop after a traumatic event. Persistent flashbacks, avoidance or feeling constantly
      on guard are reasons to seek support.
    evidence_gap: Estimates for individual trauma-exposed groups do not represent everyone living in Ireland. An equivalent Irish
      national clinical estimate was not identified.
    symptoms:
    - People may have nightmares, unwanted memories or reactions to reminders, and may avoid places or activities. They can also
      feel numb, irritable or easily startled.
    causes:
    - Some people remain highly alert or experience trauma memories as if the event is happening again. Recovery varies, and many
      people exposed to trauma do not develop PTSD.
    diagnosis:
    - A GP or mental health professional asks about symptoms, timing, safety and effects on daily life. You can ask to go at a pace
      that feels manageable.
    care:
    - Trauma-focused therapy can help. The team may also discuss help with sleep, symptoms of depression or other supports. Treatment
      can be adapted to present safety needs.
    complications:
    - Persistent symptoms can affect relationships, work and physical health. Support is useful even if the event was long ago or
      earlier treatment did not help.
    help:
    - Contact a GP or mental health service if symptoms persist or interfere with daily life. Seek urgent help if you are in immediate
      danger or cannot keep yourself safe.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/ptsd/
  schizophrenia:
    aliases: schizophrenia psychosis hallucinations delusions negative symptoms mental health
    summary: Schizophrenia can affect thinking, perception, motivation and daily life. Diagnosis involves looking at the pattern
      over time and considering other causes.
    evidence_gap: Hospitalisation and treatment data capture only some people living with schizophrenia. A directly comparable Irish
      national prevalence figure was not identified.
    symptoms:
    - Symptoms can include hearing voices, strong beliefs that others do not share, difficulty organising thoughts or reduced interest
      in everyday life. Changes in mood, sleep or self-care can also occur.
    causes:
    - Schizophrenia has several contributing influences. A psychotic episode alone does not establish the diagnosis, because similar
      symptoms can occur with other illnesses.
    diagnosis:
    - A mental health team reviews symptoms and their duration, physical health, medicines and other possible factors. They can work
      with the person and their supporters to plan follow-up.
    care:
    - Treatment can include antipsychotic medication, psychological or family support and help with education, work or daily routines.
      Discuss side effects and physical-health monitoring with the team.
    complications:
    - Symptoms may improve substantially with care. Some people need continuing support or experience relapses. A written plan can
      help recognise early changes and arrange help sooner.
    help:
    - Contact a GP or mental health team for persistent symptoms or a relapse. Seek urgent help if there is immediate danger or the
      person cannot be kept safe.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/schizophrenia/
  self-harm:
    aliases: self harm emotional distress crisis injury support safety plan Ireland
    summary: If you have hurt yourself or feel at risk of doing so, you can get help with both the physical harm and what led to
      it. You do not have to manage it on your own.
    emergency: If someone is seriously injured, in immediate danger or cannot stay safe, call
    symptoms:
    - A person may feel overwhelmed, detached, hopeless or afraid to tell anyone. Some people show little outward distress. Any injury,
      poisoning or concern about immediate safety should be taken seriously.
    causes:
    - Self-harm can be a response to intense distress. Reasons differ and can change. A compassionate conversation can help someone
      reach medical and emotional support.
    diagnosis:
    - A clinician can assess injuries or other immediate effects and ask how safe you feel. You can ask for someone you trust to
      come with you. Share what happened so staff can choose the right care.
    care:
    - If possible, tell a trusted person and stay near someone while arranging help. A GP or mental health team can help develop
      a safety plan and organise appropriate support or therapy.
    complications:
    - Physical effects may need urgent treatment even if you feel well at first. Ongoing distress and repeat episodes are reasons
      to seek follow-up and make it easier to get help quickly next time.
    help:
    - Go to an emergency department or call emergency services for serious injury or immediate danger. Contact your GP, out-of-hours
      GP or mental health team for urgent support when you are worried about staying safe.
  the-copper-coil:
    kind: procedure
    aliases: copper coil IUD intrauterine device non hormonal emergency contraception
    summary: The copper coil is a hormone-free device fitted inside the womb. It can provide long-term contraception or be used urgently
      after sex when suitable.
    symptoms:
    - It may suit someone who wants contraception they do not need to remember daily. For emergency contraception the timing matters,
      so contact a clinic promptly to check eligibility and fitting availability.
    causes:
    - Copper affects sperm, preventing fertilisation. Different devices are approved for different lengths of use. It does not protect
      against sexually transmitted infections.
    diagnosis:
    - The clinician asks about the timing of any unprotected sex, periods and medical history. They will discuss pregnancy checks,
      infection assessment and pain relief during fitting.
    care:
    - A trained clinician fits the device through the cervix. Ask whether you can have someone with you, how to check threads if
      advised and whom to contact afterwards.
    complications:
    - Cramps or heavier periods can occur. A coil can rarely move, fall out or injure the womb during insertion. Severe pain, fever
      or suspected pregnancy needs prompt assessment.
    help:
    - Contact your GP or clinic for severe pain, a change in threads or concerns about pregnancy. Ask about replacement timing and
      use backup protection when advised.
  the-implant:
    kind: procedure
    aliases: contraceptive implant arm implant progestogen Nexplanon long acting contraception
    summary: A contraceptive implant is a small rod fitted under the skin of the upper arm. It releases a hormone for long-acting
      contraception.
    symptoms:
    - The implant may suit people who want to avoid a daily tablet. It can be removed if you wish to stop or switch. Some medicines
      can reduce its effectiveness.
    causes:
    - It releases progestogen, which usually prevents ovulation and thickens cervical mucus. It does not protect against sexually
      transmitted infections.
    diagnosis:
    - Tell the clinician about medicines, supplements and recent unprotected sex. Ask when protection starts, how long the device
      lasts and what kind of bleeding changes to expect.
    care:
    - The clinician numbs the skin, places the rod under it and checks the position. You should receive instructions about caring
      for the insertion site and confirming removal or replacement dates.
    complications:
    - Bruising or soreness can occur after fitting. Bleeding can change and may remain unpredictable. Get advice if the site becomes
      hot, swollen or increasingly painful.
    help:
    - Discuss troublesome bleeding, suspected movement or inability to feel the implant with the clinic. Ask about backup contraception
      before starting medicines that might interact.
  the-mini-pill:
    kind: procedure
    aliases: mini pill progestogen only pill POP contraception progesterone daily
    summary: The mini pill is a progestogen-only contraceptive. How late you can take it and still be protected depends on which
      product was prescribed.
    evidence_gap: Irish survey figures group contraceptive pills. They do not report a separate national proportion using a progestogen-only
      pill.
    symptoms:
    - It may be suitable for people who cannot use oestrogen or prefer a daily tablet. A clinician can review your medical history,
      breastfeeding status and current medicines.
    causes:
    - Progestogen thickens mucus at the cervix. Some types also reliably stop ovulation. Different formulations have different timing
      rules.
    diagnosis:
    - Ask when to start, whether you need extra protection temporarily and what counts as a missed pill for your brand. Tell the
      prescriber about other medicines or supplements.
    care:
    - Take the tablet daily as instructed. If you miss a pill or have significant vomiting or diarrhoea, follow the product instructions
      and seek timely advice if you might need emergency contraception.
    complications:
    - Bleeding can become irregular, lighter or absent. Report severe or persistent symptoms and ask about a pregnancy test if there
      was a gap in protection.
    help:
    - Contact a GP, pharmacist or clinic for brand-specific advice after missed pills, interactions or unexpected bleeding. Read
      current HSE information about access and cost.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/services/sexual-health/free-contraception/
  the-patch:
    kind: procedure
    aliases: contraceptive patch combined hormonal patch weekly oestrogen progestogen
    summary: The contraceptive patch releases hormones through the skin. It needs replacing on the recommended schedule, and advice
      after detachment depends on how long it was off.
    evidence_gap: Irish contraception totals are reported for broad groups. A reliable separate estimate for patch use was not identified.
    symptoms:
    - It may suit someone who wants a combined hormonal method without taking a tablet every day. A clinician screens for factors
      that make oestrogen unsuitable.
    causes:
    - The patch releases oestrogen and progestogen to stop ovulation. Products have an application and replacement schedule that
      should be followed to maintain protection.
    diagnosis:
    - Tell the prescriber about migraines, smoking, blood pressure, prior blood clots and medicines. Ask which skin sites to use
      and how to check that the patch stays attached.
    care:
    - Apply it to a recommended area of clean, dry skin. Change it as directed and keep track of when the next patch is due. Check
      product instructions if it peels or falls off.
    complications:
    - Skin irritation or spotting can occur. Combined hormonal contraception carries a small risk of a blood clot. Sudden breathlessness
      or chest pain requires emergency assessment.
    help:
    - Ask a pharmacist or clinician promptly after a late change or detached patch, especially if you've recently had sex. Get a
      clinical review if new risk factors or side effects arise.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/the-patch/
  vaginal-ring:
    kind: procedure
    aliases: vaginal ring combined contraceptive ring NuvaRing hormonal vaginal contraception
    summary: The vaginal ring is a flexible contraceptive placed in the vagina. The product has a schedule for insertion, removal
      and replacement.
    evidence_gap: The Healthy Ireland figures consulted do not provide a standalone national estimate for vaginal ring use.
    symptoms:
    - Some people choose the ring to avoid taking a daily tablet. It contains oestrogen, so a clinician checks whether a combined
      hormonal method is suitable.
    causes:
    - The ring releases hormones that usually prevent ovulation. Correct timing helps maintain protection, especially around the
      break or after the ring comes out.
    diagnosis:
    - Review medical history, other medicines and potential risk factors with the prescriber. Ask when contraception begins and when
      you need to use another method temporarily.
    care:
    - You insert and remove the ring yourself. Follow the specific product's schedule. Contact a pharmacist or clinician after a
      late insertion or if it comes out for longer than allowed.
    complications:
    - Some people notice spotting, vaginal discomfort or other hormonal side effects. Rare clot symptoms, including sudden breathlessness
      or chest pain, need emergency help.
    help:
    - Contact your GP or clinic about repeated discomfort, missed changes or a suspected pregnancy. Read current HSE guidance on
      scheme eligibility if cost is a concern.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/vaginal-ring/
  vaginal-thrush:
    aliases: vaginal thrush candidiasis vaginal yeast itching white discharge
    summary: Vaginal thrush can cause itching or soreness with discharge. If symptoms are new or unusual, a clinician can check that
      another infection or skin condition is not responsible.
    evidence_gap: Many episodes are treated in pharmacies or without a consultation. Product sales do not establish a national prevalence
      figure for confirmed thrush.
    symptoms:
    - Common symptoms include vulval itching, irritation, soreness during sex or a thick white discharge. A strong smell, pain in
      the lower abdomen or bleeding can have another cause.
    causes:
    - Candida yeast can be present without symptoms. Overgrowth can lead to irritation. Antibiotic use, pregnancy and some health
      conditions can make episodes more likely.
    diagnosis:
    - A pharmacist or clinician asks about symptoms and previous episodes. An examination or swab can help if symptoms recur, do
      not improve or are difficult to identify.
    care:
    - Antifungal treatment can be offered if appropriate. Ask which products are suitable if pregnant, taking other medicines or
      having repeated episodes. Avoid using the same treatment for every change in discharge.
    complications:
    - Recurrent symptoms can disrupt daily life and may require an assessment of other causes. Some treatments can affect certain
      barrier contraceptives, so check the product information.
    help:
    - Get advice for first or recurring symptoms, pregnancy, painful urination, bleeding, fever or pelvic pain. Contact a clinician
      if treatment does not help.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/vaginal-thrush/
  alzheimers-disease:
    aliases: Alzheimer disease, Alzheimer's dementia
    summary: Alzheimer’s disease gradually changes memory, thinking and the ability to manage everyday tasks. A GP assessment can
      identify what else may be contributing and help you plan support early.
    evidence_gap: The HSE estimated 64,143 people living with dementia in 2020, across all types. The national estimate does not
      break out this specific type of dementia.
    symptoms:
    - Repeating questions, forgetting recent conversations and getting lost on familiar routes are possible early signs. Some people
      first have difficulty finding words or following multistep tasks.
    causes:
    - Changes in the brain involving amyloid and tau are linked to damage to nerve cells. Risk rises with age, and inherited changes
      cause a small proportion of cases.
    diagnosis:
    - Your GP can ask how the changes affect daily life, review medicines and request blood tests for other contributors. Memory
      testing, brain imaging and specialist assessment can clarify the diagnosis.
    care:
    - Ask what support is available locally for memory, daily activities and carers. A specialist can discuss medicines for symptoms
      and practical decisions about transport, finances and future care.
    complications:
    - As the disease progresses, eating, communication and safe movement may become harder. A plan for medication, meals and supervision
      can change with the person’s needs.
    help:
    - Arrange a GP review for persistent changes that interfere with daily life. Sudden confusion needs urgent medical assessment,
      while sudden facial droop, arm weakness or speech changes require 112 or 999.
    sources:
      Clinical guidance and further reading: https://www.hse.ie/eng/dementia-pathways/files/model-of-care-for-dementia-in-ireland.pdf
  bronchitis:
    aliases: Acute bronchitis, inflamed airways
    summary: Acute bronchitis is inflammation of the larger airways that usually follows a viral infection. The cough can continue
      after the other symptoms improve.
    evidence_gap: Many episodes resolve at home, and Irish hospital data exclude these episodes. There is no verified national estimate
      for acute bronchitis across the population.
    symptoms:
    - A cough may bring up mucus and be accompanied by tiredness, a sore throat, mild fever or discomfort when coughing. Symptoms
      can overlap with pneumonia and asthma.
    causes:
    - Respiratory viruses commonly inflame the bronchial tubes, increasing mucus and sensitivity to coughing. Smoking and inhaled
      irritants can irritate the airways and contribute to recurring symptoms.
    diagnosis:
    - A GP may ask about breathing, fever and how long the cough has lasted, then listen to the chest. Suspected pneumonia or another
      cause may require further examination or tests.
    care:
    - Rest, fluids and avoiding smoke can help during recovery. A pharmacist can advise on safe symptom relief. Antibiotics are usually
      unnecessary for acute viral bronchitis.
    complications:
    - Symptoms generally ease over several weeks. Worsening breathlessness, prolonged fever or reduced ability to drink can signal
      a complication or another illness and should prompt reassessment.
    help:
    - Contact your GP if a cough lasts more than three weeks, symptoms worsen or you cough up blood. Call 112 or 999 for severe difficulty
      breathing.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/bronchitis/
  chest-infection:
    aliases: Lower respiratory infection, chesty cough
    summary: A chest infection affects the airways or lungs. Some are mild and resolve at home, while pneumonia and other severe
      infections need medical assessment.
    evidence_gap: Chest infection is a broad term. Surveillance of individual infections and admissions for pneumonia cannot measure
      the national number of all chest infections.
    symptoms:
    - Cough, fever, wheeze, fatigue, chest discomfort and breathlessness may occur. Comparing breathing and activity with a person’s
      usual level can help identify when their health is deteriorating.
    causes:
    - Viruses commonly cause bronchitis, while pneumonia may be caused by bacteria or viruses. Older age, smoking, pregnancy or some
      long-term illnesses can increase the risk of complications.
    diagnosis:
    - A GP can check vital signs, listen to the chest and consider pneumonia or a flare of an existing condition. A chest X-ray or
      other tests may be needed if symptoms are severe.
    care:
    - Rest, fluids and suitable fever or pain relief may help. Treatment depends on the cause, and antibiotics may be prescribed
      when a significant bacterial infection is suspected.
    complications:
    - A serious infection can lead to low oxygen, dehydration or sepsis. A cough can outlast other symptoms, but new breathlessness
      or high fever needs another assessment.
    help:
    - Get medical advice promptly if you are short of breath, feel very unwell or are at higher risk. Call 112 or 999 if breathing
      becomes severely difficult or you develop blue lips or sudden confusion.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/chest-infection/
  common-cold:
    aliases: Viral cold, runny nose, head cold
    summary: A common cold is a short-lived viral infection of the nose and throat. Most people improve with time and simple symptom
      relief.
    evidence_gap: Most colds never reach medical services. Irish surveillance of selected respiratory viruses cannot measure all
      common-cold episodes in the community.
    symptoms:
    - Symptoms often develop gradually and include a stuffy or runny nose, sneezing, sore throat and cough. Young children may be
      more unsettled and have difficulty feeding when congested.
    causes:
    - Many different viruses cause colds. They spread through respiratory particles or by transfer from hands to the eyes, nose or
      mouth after contact with a contaminated surface.
    diagnosis:
    - Typical symptoms are usually recognised without tests. Because COVID-19, flu and other infections can begin similarly, symptom
      pattern alone cannot reliably identify the specific virus.
    care:
    - Rest, drink enough and ask a pharmacist about safe options for blocked nose, pain or fever. Check ingredients to avoid taking
      more than one product containing paracetamol.
    complications:
    - Cough and congestion can outlast the worst symptoms. Earache, worsening facial pain or breathlessness may indicate a different
      problem or a complication that needs assessment.
    help:
    - Contact your GP if symptoms worsen, keep returning or do not improve after around ten days. Get emergency help if breathing
      becomes severely difficult or someone is hard to wake.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/common-cold/
  cough:
    aliases: Persistent cough, dry cough, chesty cough
    summary: Cough clears material from the airways. How long it lasts and what else is happening, such as fever or breathlessness,
      help determine what to do next.
    evidence_gap: Cough occurs across many conditions. An Irish count of medical visits for particular infections would miss many
      people with cough and cannot establish symptom prevalence.
    symptoms:
    - A cough may be dry or bring up mucus. Record how long it has lasted, whether it interrupts sleep and any fever, wheeze, blood
      or unexplained weight loss.
    causes:
    - Infections commonly cause short-lived cough. Asthma, reflux, cigarette smoke, medicines and other lung problems may contribute
      to a cough that persists or keeps returning.
    diagnosis:
    - A clinician can check the lungs, review medicines and ask about exposures. Depending on the pattern, tests such as spirometry
      or a chest X-ray may be appropriate.
    care:
    - Fluids and avoiding smoke can help. Honey may soothe a cough for people older than one year. A pharmacist can advise on age
      limits and suitability of products.
    complications:
    - Persistent cough can disturb sleep, cause soreness and affect daily activity. Blood in mucus or worsening breathing may indicate
      a cause that needs medical attention.
    help:
    - Contact your GP if a cough lasts more than three weeks or worsening symptoms concern you. Seek urgent help for coughing up
      blood, and call 112 or 999 with severe breathing difficulty.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/cough/
  dementia-lewy-bodies:
    aliases: DLB, Lewy body dementia
    summary: Dementia with Lewy bodies can affect attention, movement, sleep and what a person sees. Symptoms can vary considerably
      within the same day.
    evidence_gap: The HSE estimated 64,143 people living with dementia in 2020, across all types. The national estimate does not
      break out this specific type of dementia.
    symptoms:
    - A person may see people or animals that are not there, have marked swings in alertness, move more slowly or act out dreams
      during sleep. Memory may be relatively less affected early on.
    causes:
    - Lewy bodies are deposits containing alpha-synuclein. The parts of the brain affected help explain why changes in thinking can
      occur alongside stiffness, slow movement and sleep disturbance.
    diagnosis:
    - Tell the GP about changes in alertness, falls, hallucinations and sleep, including when they began. Specialists can combine
      that history with thinking tests, examination and sometimes imaging.
    care:
    - Treatment can target specific difficulties and may include a medicine for thinking symptoms or physiotherapy for movement.
      Tell every prescriber about the diagnosis because some antipsychotics can cause serious reactions.
    complications:
    - Falls, fainting and swallowing difficulties can affect safety. Reviewing the home environment, the medicine list and the person’s
      daily routine can help support independence.
    help:
    - Ask the GP about persistent symptoms or new falls. Seek urgent help for a sudden change in alertness or confusion, especially
      with fever, injury or a recent medicine change.
    sources:
      Clinical guidance and further reading: https://www.hse.ie/eng/dementia-pathways/files/model-of-care-for-dementia-in-ireland.pdf
  diabetes-and-pregnancy:
    aliases: Gestational diabetes, diabetes in pregnancy, GDM
    summary: Diabetes in pregnancy includes diabetes diagnosed before conception and high blood glucose that first develops during
      pregnancy. The maternity and diabetes teams can help you manage either safely.
    symptoms:
    - Gestational diabetes often causes no noticeable symptoms. Thirst, tiredness and urinating more can have several explanations
      in pregnancy, so glucose testing helps identify people who need care.
    causes:
    - Pregnancy hormones make insulin less effective, especially later in pregnancy. Gestational diabetes develops when the body
      cannot produce enough insulin to keep blood glucose in the recommended range.
    diagnosis:
    - Antenatal teams assess risk and may arrange an oral glucose tolerance test, often at 24 to 28 weeks. If you already have diabetes,
      ask for specialist care early.
    care:
    - Care may involve regular glucose checks, changes to food and activity, and medication if needed. Ask about monitoring after
      birth and future diabetes checks if you had gestational diabetes.
    complications:
    - Poorly controlled blood glucose can increase the risk of a larger baby, birth complications and low blood sugar in the newborn.
      Gestational diabetes also raises future type 2 diabetes risk.
    help:
    - Contact your diabetes or maternity team promptly if glucose is outside the limits in your plan. Seek urgent care for vomiting
      with high glucose or ketones, or reduced fetal movement.
  esbls:
    aliases: Extended-spectrum beta-lactamases, ESBL-producing bacteria
    summary: Some bacteria make enzymes called ESBLs that reduce the effectiveness of certain antibiotics. A laboratory can distinguish
      carriage from a suspected infection when clinicians interpret the sample with symptoms.
    symptoms:
    - People often carry these bacteria in their gut without symptoms. Infection can cause urinary pain and urgency, fever or other
      symptoms depending on the part of the body involved.
    causes:
    - ESBL enzymes can break down some antibiotics. Bacteria bearing them can spread through contact or cause infection when they
      move from the gut to a vulnerable site.
    diagnosis:
    - A lab can test samples from a suspected infection to see which antibiotics work. A screening sample may show carriage in a
      person who feels well.
    care:
    - Carriage generally does not need antibiotics. For infection, the clinician chooses treatment using symptoms and lab results.
      Tell healthcare staff about a previous positive ESBL result.
    complications:
    - A urinary infection can spread to the kidneys or bloodstream. Resistance can narrow treatment choices and may mean that severe
      infections require antibiotics given through a vein.
    help:
    - Contact a clinician promptly if you have fever and urinary symptoms, particularly after recent admission. Seek emergency care
      for severe illness with confusion, collapse or breathing difficulty.
  frontotemporal-dementia:
    aliases: FTD, frontotemporal lobar degeneration
    summary: Frontotemporal dementia often first changes behaviour or language. It can develop at a younger age than other dementias,
      so problems sometimes appear while the person is working.
    evidence_gap: The HSE estimated 64,143 people living with dementia in 2020, across all types. The national estimate does not
      break out this specific type of dementia.
    symptoms:
    - Some people become less inhibited, lose interest in others or develop repetitive habits and food preferences. Others struggle
      to name objects, understand words or produce fluent speech.
    causes:
    - Damage to nerve cells mainly affects the frontal and temporal parts of the brain. Some cases run in families, while many people
      have no known inherited cause.
    diagnosis:
    - A GP can refer for specialist assessment when behaviour or language changes persist. A history from someone who knows the person
      well, thinking or language tests and imaging can help.
    care:
    - Speech and language therapy can support communication. Occupational therapy, routine changes and carer support can help manage
      behaviour and day-to-day activity, and specialists can advise on genetic counselling when relevant.
    complications:
    - Financial judgement, eating habits or communication may change before the person needs much physical help. In some forms, problems
      with walking or swallowing eventually develop.
    help:
    - Discuss gradual personality or speech changes with your GP. Call 112 or 999 for sudden speech difficulty or one-sided weakness,
      since those symptoms can indicate a stroke.
    sources:
      Clinical guidance and further reading: https://www.hse.ie/eng/dementia-pathways/files/model-of-care-for-dementia-in-ireland.pdf
  genital-warts:
    aliases: Anogenital warts, HPV warts, condyloma
    summary: Genital warts are small growths caused by certain types of HPV. A sexual health clinic or GP can check the diagnosis
      and explain treatment choices.
    evidence_gap: The HPSC’s 2025 STI report says anogenital wart surveillance data have not been collated since 2019. Totals for
      other STIs cannot establish current prevalence of genital warts.
    symptoms:
    - Warts may appear as individual bumps or clusters around the genitals or anus. They can be painless or cause itching, and other
      types of skin growth can look similar.
    causes:
    - HPV can spread through close skin contact during sex. Types that typically cause genital warts differ from the high-risk HPV
      types associated with most HPV-related cancers.
    diagnosis:
    - A clinician generally examines the area and may offer tests for other STIs depending on your history. Tell them if you are
      pregnant or might be pregnant.
    care:
    - Warts can clear on their own or be treated with prescribed applications or freezing. Avoid using shop-bought preparations intended
      for hand or foot warts on genital skin.
    complications:
    - Warts can recur after treatment. Condoms reduce the chance of transmission but leave some skin uncovered, and vaccination can
      prevent infection with certain wart-causing HPV types.
    help:
    - Arrange a check for growths you cannot identify, or if they change, bleed or hurt. Ask your maternity team about suitable treatment
      if you are pregnant.
    sources:
      Clinical guidance and further reading: https://file.hpsc.ie/uploads/sexuallytransmittedinfections/epidemiologicaldata/annualreports/1780666969.pdf
  healthcare-associated-infections:
    aliases: HAI, hospital-acquired infection, nosocomial infection
    summary: A healthcare-associated infection develops in connection with medical care. It can affect a wound, the urinary tract,
      the lungs or the bloodstream.
    symptoms:
    - Symptoms depend on the infection site. They may include fever, a wound becoming more painful or leaking fluid, cough, changes
      in breathing or new urinary symptoms.
    causes:
    - Surgery, medical devices and underlying illness can increase risk. Germs may come from the person’s own skin or gut or spread
      by contact in a care setting.
    diagnosis:
    - A clinician will consider the type and timing of care and examine the affected area. They may order cultures, blood tests or
      imaging to choose the right treatment.
    care:
    - Hand hygiene and appropriate device care reduce risk. Treatment can include antibiotics, wound care or removal of a device,
      depending on where the infection is and the organisms involved.
    complications:
    - A healthcare-associated infection may prolong recovery or spread to the bloodstream. People who have recently left hospital
      should tell their clinician about recent surgery and any devices.
    help:
    - Alert your healthcare team promptly about possible infection after treatment or admission. Call 112 or 999 if the person develops
      severe breathing difficulty, confusion or rapidly worsening illness.
  iv-line-infection:
    aliases: Intravenous cannula infection, line infection
    summary: An IV line infection can start where a tube enters the skin or involve the bloodstream. Tell the team early if a line
      site changes or you suddenly feel unwell.
    evidence_gap: Irish surveys measure certain catheter-related infections under separate definitions. Those categories do not provide
      a single national prevalence for infections across all types of IV line.
    symptoms:
    - Watch for pain, redness, swelling, warmth or discharge near the line. Fever and shivering can occur even without a visible
      change at the insertion site.
    causes:
    - Germs can get around the insertion site or enter through the connection used to give treatment. The risk depends in part on
      the device and how long it remains in place.
    diagnosis:
    - Staff examine the site and check your general condition. If bloodstream infection is possible, they may take blood cultures
      and decide whether to remove the line.
    care:
    - Keep the dressing clean and dry and let the team know if it loosens. Clinicians may remove or replace a suspected infected
      line and treat the infection when needed.
    complications:
    - Bloodstream infection can lead to sepsis. Protecting the site and removing a line when it is no longer needed can reduce the
      chance of problems.
    help:
    - Alert staff at once for new redness, discharge, fever or shaking chills. At home, contact the team managing your line immediately
      or seek emergency help for sudden severe illness.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/iv-line-infection/
  morning-sickness:
    aliases: Nausea and vomiting in pregnancy, NVP, pregnancy sickness
    summary: Pregnancy sickness can happen at any time of day. If vomiting makes it hard to drink or eat, ask your maternity team
      for help before dehydration sets in.
    evidence_gap: Hospital and maternity service figures miss many pregnancies with nausea managed at home. A hospital count for
      hyperemesis cannot establish the Irish prevalence of all pregnancy sickness.
    symptoms:
    - Nausea, food aversions, sensitivity to smells and vomiting are common in early pregnancy. Dark urine, dizziness and weight
      loss suggest you may be taking in too little fluid or food.
    causes:
    - Hormonal and other changes in early pregnancy contribute to sickness. Abdominal pain, fever or a change that starts later can
      prompt assessment for a different cause.
    diagnosis:
    - A clinician may ask how much you can drink and how often you pass urine, check your weight and consider looking for dehydration
      or another illness.
    care:
    - Small, frequent portions and regular sips may be easier to manage. A GP or maternity clinician can discuss anti-sickness medicines
      suitable in pregnancy and arrange fluids if needed.
    complications:
    - Severe or persistent sickness can lead to dehydration, electrolyte disturbance and weight loss. Hyperemesis gravidarum can
      need hospital assessment and support to recover safely.
    help:
    - Contact your GP or maternity unit promptly if you cannot keep fluids down, pass very little urine or feel faint. Seek urgent
      assessment for severe pain or blood in vomit.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/morning-sickness/
  parvovirus-pregnancy:
    aliases: Slapped cheek exposure in pregnancy, parvovirus B19
    summary: Parvovirus B19 can spread before a rash appears. If you are pregnant and exposed, contact your maternity team or GP
      so they can assess whether testing is needed.
    symptoms:
    - Adults can develop joint pain, mild fever or a rash, and some have no symptoms. A child with infection may have a bright cheek
      rash after earlier cold-like symptoms.
    causes:
    - Parvovirus B19 usually spreads through respiratory secretions. If a pregnant person becomes infected, it can sometimes cross
      the placenta and temporarily reduce the baby’s production of red blood cells.
    diagnosis:
    - Your GP or maternity team can arrange blood tests to check immunity or recent infection. They may repeat a test if exposure
      was too recent for a clear result.
    care:
    - If tests suggest a recent infection, your maternity team may refer you for ultrasound monitoring. A fetal medicine specialist
      can assess and treat severe fetal anaemia when necessary.
    complications:
    - Most pregnancies are unaffected. In some cases infection can lead to severe fetal anaemia, fluid accumulation or pregnancy
      loss, with the risk depending on timing.
    help:
    - Call your GP or maternity team about known exposure, a new rash or unexplained joint pain. Phone ahead before attending in
      person so the service can limit exposure to others.
  pelvic-girdle-pain-pregnancy:
    aliases: PGP, symphysis pubis dysfunction, SPD
    summary: Pregnancy-related pelvic girdle pain affects the joints and muscles around the pelvis. Daily movements like walking,
      climbing stairs and rolling over in bed can become painful.
    symptoms:
    - Pain can be felt over the pubic bone, in the groin or across the lower back or buttocks. It can worsen when standing on one
      leg or getting out of a car.
    causes:
    - Pregnancy changes the load on the pelvis and how muscles and joints share that load. A previous episode, back pain or an injury
      can contribute to symptoms.
    diagnosis:
    - A midwife, GP or physiotherapist can assess where the pain occurs and which movements trigger it. They can check whether the
      pattern suggests a different cause.
    care:
    - Ask about physiotherapy, pacing activity and adapting painful movements. Sitting down to dress, keeping your knees closer together
      when turning and using a support as advised may help.
    complications:
    - Pain can disrupt sleep and limit mobility. Very limited movement can add to the risk of blood clots in pregnancy, so tell the
      maternity team if walking becomes difficult.
    help:
    - Contact the maternity team if pelvic pain is severe or comes with bleeding, regular tightenings or reduced fetal movements.
      Get urgent help for sudden breathlessness or one-sided leg swelling.
  pleurisy:
    aliases: Pleuritic chest pain, inflamed lung lining
    summary: Pleurisy is inflammation of the thin lining around the lungs. It often hurts to breathe deeply, but several urgent conditions
      can cause similar pain.
    emergency: 'Sudden severe chest pain or difficulty breathing: call'
    evidence_gap: Pleurisy can be recorded as a symptom or under the underlying condition. Irish hospital figures cannot reliably
      establish community prevalence for pleurisy itself.
    symptoms:
    - The pain is often sharp, felt in the chest and worse with breathing in, coughing or movement. It may spread to the back or
      shoulder.
    causes:
    - A lung infection is one possible cause. A pulmonary embolism, injury, autoimmune condition or other chest problem can also
      cause inflammation or a similar pain.
    diagnosis:
    - A clinician assesses the onset, breathing and risk factors and examines the chest. They may order imaging, an ECG or blood
      tests based on likely causes.
    care:
    - Treating the underlying problem matters. A clinician may recommend suitable pain relief, prescribe antibiotics for bacterial
      infection or arrange hospital treatment when tests show a serious cause.
    complications:
    - Fluid can collect around the lung and make breathing harder. Ongoing breathlessness or a new fever may require re-evaluation
      even after the pain eases.
    help:
    - Seek urgent advice for new sharp chest pain with breathing. Call 112 or 999 if pain is sudden and severe, breathing is difficult
      or you cough up more than a few streaks of blood.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/pleurisy/
  pneumococcal-vaccine:
    kind: procedure
    aliases: Pneumococcal immunisation, pneumococcal jab, PPV23, PCV
    summary: Pneumococcal vaccines reduce the risk of serious disease caused by some types of pneumococcal bacteria. The vaccine
      and schedule depend on age and medical risk.
    symptoms:
    - Vaccination can prevent forms of pneumonia, bloodstream infection and meningitis caused by covered types of pneumococcus. People
      with some long-term illnesses or immune problems face greater risks.
    causes:
    - Vaccines help the immune system recognise the bacterium’s outer coating. Different products protect against different sets
      of pneumococcal types and are used for different age and risk groups.
    diagnosis:
    - Ireland offers pneumococcal vaccination in childhood and recommends vaccination for older adults and certain people at increased
      risk. Your GP can check which doses you need.
    care:
    - Bring any vaccination record and tell the clinic about previous serious reactions, immune treatment or removal of your spleen.
      A clinician will explain if additional doses are advised.
    complications:
    - Pain, redness or swelling near the injection site and a mild fever may occur. Protection takes time to develop and does not
      cover every cause of pneumonia.
    help:
    - Discuss a previous severe allergic reaction with a clinician before vaccination. Call 112 or 999 if someone develops breathing
      difficulty or throat swelling after a dose.
  respiratory-tract-infections:
    aliases: RTIs, upper respiratory infection, lower respiratory infection
    summary: Respiratory tract infections affect the nose, throat, airways or lungs. The location, duration and effect on breathing
      matter more for immediate care than the name alone.
    evidence_gap: HPSC surveillance tracks selected viruses and severe infections. It does not give a single measure of all upper
      and lower respiratory infections in Ireland.
    symptoms:
    - Upper infections often cause stuffiness, sore throat or sneezing. Lower infections can lead to cough, wheezing, fever, chest
      pain or difficulty breathing, although symptoms often overlap.
    causes:
    - Viruses cause many infections. Bacteria cause some, including certain types of pneumonia. Respiratory infections can spread
      through droplets, smaller airborne particles and hands contaminated with secretions.
    diagnosis:
    - Many mild illnesses can be assessed by symptoms. A GP can examine the throat or chest and check oxygen levels. Imaging or targeted
      tests are useful in some cases.
    care:
    - Most uncomplicated viral illnesses improve with time, fluids and rest. Ask a pharmacist about symptom relief. Antibiotics are
      used only when clinically indicated for a bacterial infection.
    complications:
    - Some infections can worsen asthma or COPD or progress to pneumonia. Older people, infants and people with weaker immune systems
      can deteriorate quickly and may need earlier review.
    help:
    - Ask a clinician for advice if symptoms deteriorate, you are at higher risk or a child feeds poorly. Call 112 or 999 for severe
      breathing difficulty or blue lips.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/respiratory-tract-infections/
  sexually-transmitted-infections:
    aliases: STIs, sexually transmitted diseases, sexual health testing
    summary: STIs can pass through sexual contact and often have no obvious symptoms. Taking an appropriate test helps you get treatment
      and protect partners.
    symptoms:
    - Symptoms can include discharge, pain when urinating, sores, rash, pelvic pain or testicular pain. Many infections cause no
      symptoms, so testing can matter even when you feel well.
    causes:
    - Different bacteria, viruses and parasites cause STIs. The chance of transmission depends on the type of contact, the infection
      and measures such as barriers, vaccines or HIV prevention medicines.
    diagnosis:
    - Tell the service what kind of contact occurred and when. Depending on the infection, testing may use urine, swabs or blood,
      and some tests may need repeating later.
    care:
    - In Ireland, a sexual health clinic, some GPs or an eligible home-testing pathway can help. If a result is positive, ask about
      partner notification and when to resume sexual contact.
    complications:
    - Untreated infections can sometimes cause pelvic inflammatory disease, fertility problems or pregnancy complications. Some infections
      also affect joints, nerves or other organs if they progress.
    help:
    - Seek prompt advice for possible recent HIV exposure because preventive treatment is time-sensitive. Arrange same-day assessment
      for fever with severe pelvic pain, or sudden severe testicular pain.
  shortness-of-breath-or-chest-pain-in-pregnancy:
    aliases: Pregnancy breathlessness, chest pain while pregnant
    summary: Breathing can feel different as pregnancy progresses. Sudden breathlessness, chest pain or faintness needs urgent attention
      because pregnancy increases the chance of some serious conditions.
    emergency: 'Chest pain with sudden or severe breathing difficulty: call'
    evidence_gap: Irish surveillance for individual causes, such as blood clots, cannot measure all episodes of breathlessness or
      chest pain in pregnancy.
    symptoms:
    - Take note of whether breathlessness begins at rest, happens suddenly or comes with chest pain, coughing up blood, a racing
      heart, faintness or swelling in one leg.
    causes:
    - The physical demands of pregnancy can cause gradual breathlessness. Anaemia, asthma, infection or a clot in the lungs are other
      possible causes, and chest pain warrants assessment.
    diagnosis:
    - A clinician can check oxygen levels, pulse and blood pressure and examine the heart, lungs and legs. They may arrange tests
      or imaging appropriate to pregnancy.
    care:
    - Care depends on the cause. Tell healthcare staff you are pregnant and how far along you are, and contact your maternity team
      about new breathlessness that limits normal activities.
    complications:
    - A pulmonary embolism, severe infection or heart condition can affect both the pregnant person and the baby. Acting early gives
      clinicians time to investigate and treat the cause.
    help:
    - Call 112 or 999 for sudden or severe breathing difficulty, chest pain with breathlessness, fainting or coughing up blood. Contact
      your maternity team urgently if symptoms are new or worsening.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/shortness-of-breath-or-chest-pain-in-pregnancy/
  staph-infection:
    aliases: Staphylococcus aureus, staphylococcal skin infection
    summary: Staph bacteria can live harmlessly on the skin or in the nose. If they enter a wound or deeper tissues, they can cause
      infection.
    symptoms:
    - Skin infection may cause a painful red lump, crusting or pus. A deeper infection can bring fever, chills or marked weakness,
      with symptoms varying by infection site.
    causes:
    - Staph can enter through damaged skin or medical devices. Some strains are resistant to particular antibiotics, while others
      remain susceptible to standard treatments.
    diagnosis:
    - A clinician may recognise a typical skin infection by examining it. Drainage, tissue or blood samples can show which bacteria
      are present and guide antibiotic treatment.
    care:
    - Keep cuts clean and cover draining wounds while seeking advice. A clinician may need to drain an abscess or prescribe antibiotics,
      depending on the size and severity.
    complications:
    - In some cases infection spreads through the skin, into a joint or bone, or into the bloodstream. Rapidly spreading redness
      or new fever calls for reassessment.
    help:
    - Get medical advice if redness spreads, a wound produces pus or fever develops. Call 112 or 999 for severe illness with confusion,
      collapse or difficulty breathing.
  stomach-pain-cramps-pregnancy:
    aliases: Abdominal pain in pregnancy, pregnancy cramps
    summary: Abdominal pain during pregnancy can come from digestion or stretching ligaments, but pain with other symptoms may need
      immediate assessment at any stage.
    evidence_gap: This symptom has many causes. Figures for particular diagnoses, such as ectopic pregnancy, do not capture the prevalence
      of abdominal pain in Irish pregnancies.
    symptoms:
    - Pay attention to where the pain is, whether it comes in waves and what else is happening. Bleeding, shoulder-tip pain, fever
      or painful urination may change the urgency.
    causes:
    - Constipation, trapped wind and ligament pain can cause mild discomfort. Other possibilities include urinary infection, miscarriage,
      ectopic pregnancy and, later on, labour or problems with the placenta.
    diagnosis:
    - The maternity team considers how far along the pregnancy is, your symptoms and examination. They may check urine, arrange an
      ultrasound or monitor the baby, depending on the situation.
    care:
    - If the pain is mild and settles quickly, changing position or resting may help. Tell your maternity team if pain persists,
      keeps returning or comes with other symptoms.
    complications:
    - Some causes, such as ectopic pregnancy or placental problems, can become serious quickly. If pregnancy location has not been
      confirmed, one-sided pain is especially important to report.
    help:
    - Call your maternity unit for persistent pain, bleeding, regular tightenings or reduced fetal movement. Call 112 or 999 for
      severe pain with collapse, fainting or heavy bleeding.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/stomach-pain-cramps-pregnancy/
  urinary-catheter:
    kind: procedure
    aliases: Bladder catheter, indwelling catheter, intermittent catheter
    summary: A urinary catheter drains urine from the bladder when you cannot empty it safely or when a medical procedure makes drainage
      necessary.
    symptoms:
    - A catheter may help with urinary retention, during some operations or when clinicians need to measure urine closely. Ask why
      a catheter is needed and how long it may stay.
    causes:
    - An intermittent catheter is inserted for drainage and removed. An indwelling catheter stays in place and may pass through the
      urethra or through the lower abdomen.
    diagnosis:
    - A trained clinician chooses the type and explains how it goes in. People using intermittent catheterisation at home can be
      taught the technique and what supplies they need.
    care:
    - Wash your hands before and after handling the drainage system. Keep tubing free from kinks and follow the instructions for
      securing it, emptying the bag and cleaning around it.
    complications:
    - Possible problems include infection, bladder spasms, leakage or blockage. Removing an indwelling catheter as soon as clinically
      appropriate limits how long you are exposed to these risks.
    help:
    - Contact your nurse or GP urgently for fever, new lower abdominal pain or a catheter that stops draining when you feel your
      bladder filling. Get emergency help if you become very unwell.
  urinary-incontinence-pregnancy:
    aliases: Pregnancy bladder leakage, stress incontinence in pregnancy
    summary: Urine leakage in pregnancy can happen with coughing, exercise or a sudden urge. A maternity clinician or pelvic health
      physiotherapist can help you work out what is causing it.
    symptoms:
    - Stress leakage occurs with effort such as a cough or sneeze. Urgency leakage occurs with a strong need to pass urine, sometimes
      with little warning.
    causes:
    - A growing uterus, changing pressure on the bladder and pelvic floor muscle changes can contribute. An infection can cause urinary
      symptoms as well and may need quick treatment.
    diagnosis:
    - Tell your midwife or GP when leakage happens and whether you have pain or fever. They can consider a urine test or a pelvic
      health physiotherapy assessment.
    care:
    - Pelvic floor exercises can help, particularly when taught with the right technique. Drink normally unless a clinician tells
      you otherwise and ask for help if symptoms interfere with daily activity.
    complications:
    - Leakage can limit exercise or continue after birth. Symptoms that worsen, persist after delivery or interfere with bladder
      emptying deserve a follow-up assessment and a treatment plan.
    help:
    - Contact your maternity unit if you are unsure whether watery leakage is urine or your waters breaking. Get prompt advice for
      burning with fever, back pain or feeling very unwell.
  vascular-dementia:
    aliases: Vascular cognitive impairment, post-stroke dementia
    summary: Vascular dementia develops when blood vessel damage affects the brain. Planning, concentration and movement may change
      alongside memory, sometimes after a stroke.
    evidence_gap: The HSE estimated 64,143 people living with dementia in 2020, across all types. The national estimate does not
      break out this specific type of dementia.
    symptoms:
    - A person may take longer to think, struggle with familiar routines, walk unsteadily or have changes in mood. Difficulties can
      appear after a stroke or develop gradually.
    causes:
    - Large strokes, smaller strokes or damage to small blood vessels can injure parts of the brain used for thinking. High blood
      pressure, diabetes and smoking increase vascular risk.
    diagnosis:
    - Assessment considers the timing of symptoms, stroke history and daily functioning. A clinician may use cognitive tests and
      brain imaging and check for other contributors such as depression or medicine effects.
    care:
    - Care can include rehabilitation and help with daily routines. A clinician may also manage blood pressure, diabetes, cholesterol
      or heart rhythm to reduce the chance of further vascular damage.
    complications:
    - Further strokes can cause new disability. Mixed dementia is possible when vascular brain changes occur alongside Alzheimer’s
      disease, so a person’s needs can evolve in different ways.
    help:
    - Arrange a GP review if thinking or walking has gradually changed. Call 112 or 999 for sudden facial droop, arm weakness or
      speech problems, even if they improve.
    sources:
      Clinical guidance and further reading: https://www.hse.ie/eng/dementia-pathways/files/model-of-care-for-dementia-in-ireland.pdf
  bacterial-vaginosis-pregnancy:
    aliases: BV in pregnancy, bacterial vaginosis while pregnant
    summary: Bacterial vaginosis is a change in the usual mix of bacteria in the vagina. If you have symptoms in pregnancy, your
      midwife, GP or obstetrician can assess them.
    symptoms:
    - Discharge may become thin, greyish or white and develop a fishy smell. Some people have no symptoms. Itching or pain may suggest
      another cause that needs checking.
    causes:
    - BV happens when the balance of the vaginal microbiome changes and certain bacteria grow in greater numbers. Douching and scented
      products can disrupt the vaginal environment.
    diagnosis:
    - A clinician can ask about the discharge and examine you if needed. They may take a swab or perform other tests to distinguish
      BV from thrush or other infections.
    care:
    - If treatment is needed, your maternity clinician can choose an antibiotic suitable during pregnancy. Avoid douching and discuss
      uncertain symptoms before using over-the-counter treatments for thrush.
    complications:
    - BV can recur after treatment. In pregnancy it is associated with a higher chance of some complications, including preterm birth,
      although most affected pregnancies do not have these complications.
    help:
    - Contact your GP, midwife or obstetrician if discharge changes smell or appearance. Phone the maternity unit promptly for bleeding,
      persistent watery leakage, fever or significant abdominal pain.
  blocked-plugged-duct-breastfeeding:
    aliases: Narrowed milk duct, plugged duct, localised breast inflammation
    summary: A tender area while breastfeeding can develop when swelling narrows milk ducts. Gentle care can help and a fever or
      deteriorating symptoms may signal mastitis.
    evidence_gap: Irish maternity surveys describe breastfeeding experiences and challenges. Available figures do not isolate how
      often blocked or narrowed ducts occur among people breastfeeding in Ireland.
    symptoms:
    - A small area may feel sore, firm or swollen. The skin can look red, although redness may be harder to see on darker skin.
    causes:
    - Local inflammation narrows passageways for milk. Pressure on the breast, excess milk production or changes to feeding can contribute
      and a solid plug is usually not the cause.
    diagnosis:
    - A lactation consultant, public health nurse or GP can review symptoms and feeding. Fever, widespread redness or a persistent
      lump may warrant an examination.
    care:
    - Continue feeding on your usual pattern as tolerated. A cold compress can help with discomfort. Avoid deep massage and pumping
      extra milk to try to clear the area.
    complications:
    - Symptoms can progress to mastitis or sometimes an abscess. A lump that stays or gets larger after other symptoms improve should
      be examined by a clinician.
    help:
    - Contact your GP promptly if fever or flu-like symptoms develop, the redness spreads or the area fails to improve. A lactation
      professional can help address recurring episodes.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/blocked-plugged-duct-breastfeeding/
  breast-lumps:
    aliases: Breast lump, lump in breast, lump in armpit
    summary: A new lump in the breast or armpit should be checked. Many lumps have benign causes, and examination and imaging can
      help distinguish them.
    evidence_gap: Irish cancer figures count confirmed diagnoses, and symptomatic clinic figures include several types of breast
      concern. Neither measures the prevalence of breast lumps in the community.
    symptoms:
    - You may feel a new lump or thickening or notice a change in the breast shape. Look for associated skin dimpling, nipple inversion,
      unusual discharge or an armpit lump.
    causes:
    - Cysts, fibroadenomas and several other benign changes can cause lumps. An infection and breast cancer are other possibilities.
      The feel of a lump alone cannot reliably determine the cause.
    diagnosis:
    - Your GP can examine the area and arrange referral if needed. A symptomatic breast clinic may use ultrasound, mammography and
      sometimes a needle sample according to the findings.
    care:
    - Keep a note of when you first noticed the lump and if it changes with your cycle. Treatment or follow-up depends on what the
      assessment shows.
    complications:
    - A painful lump with redness and fever may be an infection or abscess. A persistent lump may need imaging or sampling, even
      if a recent screening mammogram was normal.
    help:
    - Contact your GP promptly for a new breast or armpit lump or a change in skin or nipple. Seek same-day advice for a hot, painful
      breast with fever or feeling unwell.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/breast-lumps/
  breast-pain:
    aliases: Mastalgia, sore breasts, cyclical breast pain
    summary: Breast pain can follow a menstrual pattern, arise from the chest wall or accompany other breast symptoms. A persistent
      focal change should be assessed.
    evidence_gap: Irish symptomatic breast service activity includes several different reasons for referral. It cannot show how many
      people have breast pain or how often it occurs.
    symptoms:
    - Pain may be dull and affect both breasts before a period, or occur in one area and worsen when touched or moved. Mention redness,
      a lump or nipple changes.
    causes:
    - Hormonal changes, pregnancy and some medicines can contribute. A chest muscle strain, an ill-fitting bra or an infection can
      also feel like breast pain.
    diagnosis:
    - A GP may ask about your cycle, medicines and recent changes, then examine your breast and chest wall. Other symptoms and the
      examination guide any referral.
    care:
    - A supportive bra and keeping a pain diary may help. Ask a pharmacist about suitable pain relief, especially if pregnant or
      breastfeeding. Follow up if pain persists.
    complications:
    - Persistent pain may interfere with exercise and sleep. A hot, swollen area with fever can indicate infection, which may progress
      if it is not assessed.
    help:
    - Seek same-day advice for breast redness, swelling or heat with fever. Arrange a GP check for a new lump, nipple discharge,
      skin change or pain that persists.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/breast-pain/
  childrens-weight:
    aliases: Childhood overweight, childhood obesity, child growth and weight
    summary: Children gain weight as they grow. A healthcare professional can interpret a child’s height and weight together over
      time and discuss changes that help the whole family.
    symptoms:
    - Weight alone tells little about health. A sustained change on a growth chart, becoming noticeably less active or difficulties
      with sleep can give a clinician more context.
    causes:
    - Growth, inherited factors, medicines, food access, sleep and opportunities to be active all influence weight. A supportive
      conversation can focus on changes within the family’s control.
    diagnosis:
    - A GP or public health nurse may plot height and weight on age- and sex-specific charts. The pattern over time and how the child
      is developing are important.
    care:
    - Talk about regular meals, enjoyable movement and sleep without shaming the child. Ask a clinician about family-based support
      before starting a diet or trying to restrict a child’s intake.
    complications:
    - Children can experience bullying and distress about weight. Some children with obesity also develop sleep, joint or metabolic
      problems that can benefit from early care.
    help:
    - Talk to your GP or public health nurse if growth changes unexpectedly or there are concerns about eating, sleep or wellbeing.
      Promptly seek advice for rapid unexplained weight loss.
  headaches-pregnancy:
    aliases: Pregnancy headache, headache while pregnant
    summary: A mild headache can occur during pregnancy. New severe or persistent pain, particularly with visual symptoms, can signal
      a problem that needs urgent assessment.
    evidence_gap: Ireland tracks pre-eclampsia and related maternity outcomes. Those data cannot show how many pregnant people experience
      headache from all causes.
    symptoms:
    - A headache may feel like pressure or throbbing. Report whether it started suddenly, follows your usual migraine pattern or
      comes with vision changes, vomiting or swelling.
    causes:
    - Tiredness, changes in sleep, dehydration or migraine can contribute. After 20 weeks, headache can also be a sign of pre-eclampsia,
      especially with other symptoms.
    diagnosis:
    - A clinician may measure blood pressure, test urine and ask about pain, medicines and other symptoms. Severe, sudden or unusual
      pain may need more urgent investigation.
    care:
    - Take regular fluids, eat at regular intervals and rest when possible. Ask a pharmacist or maternity clinician about safe pain
      relief and check before taking anti-inflammatory medicines.
    complications:
    - Poor sleep and recurrent pain can affect daily life. When headache accompanies high blood pressure or other signs of pre-eclampsia,
      early assessment reduces the risk of serious complications.
    help:
    - Contact your maternity team immediately for a severe or persistent headache with visual changes, pain under the ribs or sudden
      swelling. Seek emergency help for a sudden worst-ever headache or neurological changes.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/headaches-pregnancy/
  how-to-check-your-breasts:
    kind: procedure
    aliases: Breast awareness, breast self-check, breast self-exam
    summary: Checking your breasts helps you notice new changes. Get familiar with how they normally look and feel at different times
      of the month or stages of life.
    evidence_gap: Irish breast screening records describe screening mammograms. They do not measure how often people check their
      breasts at home or what those checks find.
    symptoms:
    - Look for a change in shape, swelling, dimpling, changes on or around the nipple, or unusual discharge. Feel for an unfamiliar
      lump or thickened area.
    causes:
    - Hormones, age, pregnancy and breastfeeding can change breast tissue. Knowing your usual pattern helps you explain a change
      to your GP when you first notice it.
    diagnosis:
    - Look at both breasts with your arms in different positions and feel the whole breast and armpit. The HSE demonstration shows
      one practical way to check.
    care:
    - Raise anything new with your GP. Continue to attend eligible screening appointments and tell a clinician promptly about symptoms
      that appear between those appointments.
    complications:
    - A self-check cannot determine the cause of a change or detect all cancers. A recent normal screening result still leaves a
      new symptom worth investigating.
    help:
    - Contact your GP promptly for a new lump, unexplained change in skin or nipple, or bloody discharge. Get same-day advice about
      redness with fever or feeling unwell.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/how-to-check-your-breasts/
  malnutrition:
    aliases: Undernutrition, protein-energy malnutrition, nutrition risk
    summary: Malnutrition develops when the body does not get or use enough energy or nutrients. It can occur at any body weight
      and may show up during illness or recovery.
    symptoms:
    - Possible signs include unintended weight loss, looser clothes, poor appetite, weakness and slow recovery. In children, a change
      in the growth pattern can warrant assessment.
    causes:
    - Causes include eating too little, difficulty swallowing, poor absorption and higher needs during illness. Pain, dental problems,
      isolation or difficulty preparing food may contribute.
    diagnosis:
    - A clinician can ask about recent intake, weight change, medical history and practical barriers. Screening may be followed by
      a dietitian assessment, blood tests or swallowing review.
    care:
    - Care addresses the cause and the person’s nutritional needs. A dietitian can recommend ways to fortify food, suitable supplements
      or more specialised support when intake is inadequate.
    complications:
    - Malnutrition can reduce strength, impair healing and increase infection risk. After very little intake for several days, some
      people need medically supervised nutrition because restarting food can cause dangerous electrolyte shifts.
    help:
    - Contact your GP if weight is falling without explanation or eating has become difficult. Seek urgent advice if you cannot drink,
      are severely weak or have confusion.
  pelvic-organ-prolapse:
    aliases: POP, vaginal prolapse, cystocele, rectocele
    summary: Pelvic organ prolapse occurs when support for the bladder, uterus or bowel weakens and the organ bulges into the vagina.
      Treatment depends on which symptoms affect daily life.
    evidence_gap: Irish service activity and estimates for pelvic floor disorders group several different conditions. They cannot
      establish a current national prevalence for pelvic organ prolapse specifically.
    symptoms:
    - Typical symptoms include heaviness, dragging or a bulge in the vagina. Some people have trouble emptying the bladder or bowel,
      discomfort during sex or urinary leakage.
    causes:
    - Supporting muscles and connective tissues can weaken over time. Pregnancy and birth, constipation with straining, persistent
      cough and previous pelvic surgery can contribute.
    diagnosis:
    - A GP or specialist can ask about urinary and bowel symptoms and examine the vagina. They may check whether more than one area
      is affected.
    care:
    - Options include pelvic floor physiotherapy, addressing constipation, using a pessary or considering surgery. A specialist can
      explain the likely benefits and trade-offs for your symptoms.
    complications:
    - Prolapse can affect bowel or bladder emptying and lead to discomfort during daily activities. Follow-up matters if a pessary
      causes bleeding, pain, discharge or difficulty passing urine.
    help:
    - Arrange a GP review for a new or bothersome bulge. Seek urgent advice if you cannot pass urine, have severe pain or feel unwell
      with fever.
    sources:
      Clinical guidance and further reading: https://www2.healthservice.hse.ie/organisation/national-pppgs/national-clinical-practice-guideline-diagnosis-and-management-of-pelvic-organ-prolapse/
  pressure-ulcers:
    aliases: Pressure injuries, pressure sores, bedsores
    summary: Pressure ulcers are skin and tissue injuries caused by sustained pressure, sometimes with friction or shearing. An early
      change in colour, texture or temperature can be the first sign.
    symptoms:
    - Check skin over bones and under devices. Persistent discolouration, unusual warmth, firmness, pain, a blister or broken skin
      can signal an injury. Colour changes can be subtler on darker skin.
    causes:
    - Remaining in one position for a long time can reduce blood flow to tissue. Risk rises with limited movement, reduced sensation,
      moisture, poor nutrition and some medical conditions.
    diagnosis:
    - A nurse or clinician examines the skin and wound, checks depth and looks for infection. They also assess movement, nutrition
      and pressure from mattresses, chairs or devices.
    care:
    - A care plan can include assisted repositioning, pressure-relieving surfaces, moisture management and dressings. Avoid rubbing
      the affected area and ask a nurse how to relieve pressure safely.
    complications:
    - Deeper wounds can extend into muscle or bone. An infected ulcer can delay healing, increase pain and in severe cases lead to
      infection in the bloodstream.
    help:
    - Ask a clinician to review any persistent discolouration or wound at a pressure point. Seek urgent help for spreading redness,
      fever, rapidly worsening pain or sudden confusion.
  shingles:
    aliases: Herpes zoster, zoster, shingles rash
    summary: Shingles is a reactivation of the chickenpox virus. A painful rash usually develops on one side, and treatment can be
      time-sensitive when the eye or immune system is involved.
    symptoms:
    - Burning, itching or tingling can appear before the rash. Small blisters then often develop in a band on one side of the trunk
      or on one side of the face.
    causes:
    - After chickenpox, the virus remains in nerves. It can reactivate later, with risk increasing with age or a weakened immune
      system. Susceptible contacts can catch chickenpox from exposure to blister fluid.
    diagnosis:
    - A pharmacist or GP can advise if the rash looks like shingles. Clinicians sometimes test a blister sample if the rash is unusual
      or the diagnosis is uncertain.
    care:
    - Seek advice promptly because antiviral medicines help most when started early. Keep blisters clean and covered when possible
      and avoid close contact with susceptible people at higher risk until all lesions crust.
    complications:
    - Some people experience persistent nerve pain after the rash fades. Shingles near the eye can threaten vision, and widespread
      illness is more likely with a weakened immune system.
    help:
    - Contact a GP or out-of-hours service immediately for a rash on the nose or around the eye, visual changes, or suspected shingles
      with a severely weakened immune system.
  slapped-cheek-syndrome:
    aliases: Fifth disease, parvovirus B19, erythema infectiosum
    summary: Slapped cheek syndrome usually causes a mild illness in children. A person who is pregnant, immunocompromised or has
      a chronic red blood cell disorder may need advice after exposure.
    symptoms:
    - Children may first feel tired or have a temperature, sore throat or headache. A bright cheek rash or a lacy rash on the trunk
      and limbs may follow.
    causes:
    - Parvovirus B19 spreads between people, often before the rash appears. In most healthy children, the immune system clears the
      illness without treatment.
    diagnosis:
    - The pattern of illness and rash may be enough for a clinician to recognise it. Blood tests are sometimes used when someone
      is pregnant or at greater risk of complications.
    care:
    - Rest, fluids and suitable pain relief can help. A child who feels well is usually past the most infectious period by the time
      the typical rash appears.
    complications:
    - The virus can briefly reduce red blood cell production. This can cause important anaemia in some people with blood conditions
      and may cause complications in pregnancy.
    help:
    - Call your GP or maternity team about exposure if you are pregnant or at higher risk. Get urgent advice if a child is very pale,
      breathless or unusually drowsy.
  black-eye:
    aliases: Periorbital bruising, bruised eye, eye injury
    summary: A black eye is bruised skin around the eye, usually after a blow. Take changes in eyesight or signs of a head injury
      seriously.
    evidence_gap: Irish injury statistics capture selected diagnoses and hospital visits. They do not measure the number of black
      eyes across the community.
    symptoms:
    - Bruising, swelling and tenderness around the eye are typical. Double vision, pain when moving the eye, vomiting or an irregular
      pupil suggest more than a skin bruise.
    causes:
    - A blow can break small blood vessels below the skin. More forceful injuries can damage the eye or the bones around it, and
      can also injure the head.
    diagnosis:
    - A clinician may check vision, pupil shape, eye movement and nearby bones. An X-ray or scan may be needed if an eye socket fracture
      or head injury is suspected.
    care:
    - Use a cold pack wrapped in a cloth for short periods during the first day or two. Avoid pressing on the eye and ask about suitable
      pain relief.
    complications:
    - Bruising often fades gradually over a few weeks. Blood in the eye, a fracture or a retinal injury can affect vision and needs
      prompt assessment.
    help:
    - Go to an emergency department after an injury if you have vision changes, an irregular pupil, blood inside the eye or bruising
      around both eyes after a head blow.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/black-eye/
  cold-sores:
    aliases: Fever blister, oral herpes, HSV cold sore
    summary: Cold sores are blisters that usually develop near the lip. The virus spreads easily during an outbreak and can cause
      serious illness in newborns.
    evidence_gap: Genital herpes notifications and hospital data on severe herpes cannot estimate day-to-day cold sore episodes.
      Many episodes are managed at home or through pharmacies.
    symptoms:
    - Tingling, burning or itch may come before fluid-filled blisters. Blisters can break and crust over. A first infection can also
      cause sore gums or mouth ulcers.
    causes:
    - Herpes simplex virus remains in nerves after infection. It may reactivate during illness, stress or sun exposure. Close contact
      with a sore can pass on the virus.
    diagnosis:
    - A clinician or pharmacist can often recognise a typical sore. A lab test may be needed if there is concern about an eye infection,
      severe illness or infection in a newborn.
    care:
    - A pharmacist can advise on treatment and when to start it. Wash hands after contact with a sore, avoid touching your eyes and
      do not kiss a baby during an outbreak.
    complications:
    - The infection can spread to the eye or through areas of damaged skin. Newborns can become seriously ill after exposure and
      need early assessment if symptoms appear.
    help:
    - Seek urgent advice for a sore near the eye or symptoms in a newborn. Call 112 or 999 if a baby is hard to wake, struggles to
      breathe or has a seizure.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/cold-sores/
  dehydration:
    aliases: Fluid loss, dehydration in adults
    summary: Dehydration happens when the body loses more fluid than it takes in. Thirst can be an early clue, while confusion or
      going all day without passing urine needs urgent help.
    emergency: 'Severe confusion, collapse or inability to wake: call'
    symptoms:
    - Dry mouth, dark urine, passing urine less often, dizziness and tiredness are common clues. Older adults may have reduced thirst
      and show subtle changes in alertness.
    causes:
    - Vomiting, diarrhoea, fever, sweating and some medicines increase fluid loss. Illness or difficulty reaching a drink can reduce
      fluid intake, especially in someone who needs support.
    diagnosis:
    - A clinician may ask about intake, fluid losses and medicines, and check vital signs. Severe illness may require blood tests
      to check electrolytes and kidney function.
    care:
    - Try small frequent sips if you feel sick. A pharmacist can advise on oral rehydration solution. Ask your care team about fluid
      replacement if you have a prescribed restriction.
    complications:
    - Severe dehydration can harm the kidneys and affect blood pressure or electrolytes. Fluid given through a vein may be needed
      if drinking is unsafe or insufficient.
    help:
    - Seek emergency care if someone becomes confused or unusually drowsy, has a seizure, or has not passed urine all day. Call 112
      or 999 if they collapse or are hard to wake.
  earache:
    aliases: Ear pain, otalgia, child earache
    summary: Earache can come from the ear itself or from nearby areas such as the jaw, teeth or throat. The right treatment depends
      on what is causing it.
    evidence_gap: Ear pain has several causes, and many people manage brief episodes at home. Irish hospital counts for ear infections
      do not measure the prevalence of earache.
    symptoms:
    - Pain can be sharp, dull or burning. A young child may pull at an ear, sleep poorly or seem distressed. Watch for discharge,
      fever or a change in hearing.
    causes:
    - A middle ear infection, swollen ear canal, wax, an injury or pressure changes can hurt. Pain from a tooth, jaw or sore throat
      can also be felt in the ear.
    diagnosis:
    - A GP can look at the eardrum and ear canal, and may examine the throat, jaw or teeth if the ear itself appears healthy.
    care:
    - Ask a pharmacist about suitable pain relief while symptoms settle. Avoid putting cotton buds or other objects into the ear,
      and check before using drops if there is discharge.
    complications:
    - Most short-lived earaches settle. Infection with swelling or tenderness behind the ear, or new hearing changes, can require
      urgent treatment and should be reassessed.
    help:
    - Contact your GP for persistent or worsening pain, discharge or a very unwell child. Seek urgent care if there is swelling behind
      the ear or the ear starts to stick out.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/earache/
  earwax-build-up:
    aliases: Impacted cerumen, blocked ear wax, wax plug
    summary: Earwax normally protects the ear canal. When it builds up, sounds may become muffled and a pharmacist or clinician can
      advise on safe removal.
    evidence_gap: Earwax is often treated at home, in pharmacies or in clinics using different records. There is no verified national
      estimate for symptomatic wax build-up.
    symptoms:
    - You may notice gradual muffled hearing, a blocked feeling, ringing, itch or discomfort. A sudden hearing change can have other
      causes and needs appropriate assessment.
    causes:
    - The ear usually moves wax outward naturally. Narrow ear canals, hearing aids or attempts to clean with cotton buds can make
      it harder for wax to clear.
    diagnosis:
    - A clinician can inspect the ear canal and eardrum. They can check for wax, infection or injury and decide whether an examination
      of hearing is needed.
    care:
    - Ask a pharmacist about softening drops if suitable. Check with a clinician first if you have had ear surgery, a perforated
      eardrum, pain or discharge. Avoid ear candles and cotton buds.
    complications:
    - Compact wax can make conversation harder and cause hearing aid feedback. Inserting objects can push it deeper or injure the
      canal and eardrum.
    help:
    - Arrange a review if the ear stays blocked after appropriate treatment. Seek urgent care for sudden hearing loss, significant
      pain, blood, dizziness or a new discharge.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/earwax-build-up/
  feeling-sick-nausea:
    aliases: Nausea, feeling queasy, queasiness
    summary: Nausea is the feeling you may vomit. How it starts and what else is happening, such as pain, headache or a medicine
      change, can help identify the cause.
    evidence_gap: Nausea can occur across many conditions. Irish datasets for specific diagnoses, such as gastroenteritis or pregnancy
      sickness, cannot establish prevalence of nausea across the population.
    symptoms:
    - You may feel queasy, go off food or notice more saliva. Report whether vomiting, abdominal pain, fever, dizziness, diarrhoea
      or a headache occurs with it.
    causes:
    - Possible causes include a stomach infection, pregnancy, migraine, motion sickness, a medicine or reflux. Sudden nausea with
      chest pressure or breathlessness can indicate a heart emergency.
    diagnosis:
    - Your GP may ask about food, travel, medicines and when symptoms happen. Depending on the pattern, they may check for dehydration,
      pregnancy or an underlying illness.
    care:
    - Small sips and smaller meals may be easier to tolerate. Avoid strong food smells if they trigger symptoms. A pharmacist or
      clinician can advise on medicines when appropriate.
    complications:
    - Vomiting can lead to dehydration. Recurrent nausea can make it difficult to maintain food intake or take required medicines,
      so seek help if it persists.
    help:
    - Contact your GP if nausea persists, returns often or stops you drinking. Call 112 or 999 for sudden nausea with chest pressure,
      pain spreading to the arm or jaw, or breathlessness.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/feeling-sick-nausea/
  fever-adults:
    aliases: Pyrexia, high temperature in adults
    summary: A temperature of 38°C or higher is usually a fever in adults. The symptoms, how long the fever lasts and your medical
      risk help decide when to get care.
    evidence_gap: Fever is a symptom of many conditions. Irish surveillance of individual infections does not estimate how often
      fever occurs among adults in the community.
    symptoms:
    - You may feel hot or chilled, sweat, ache or lose your appetite. Severe headache, rash, changing alertness, breathlessness or
      a new pain may change the urgency.
    causes:
    - Infections often cause fever. Some inflammatory illnesses and medicines can also raise temperature. Heatstroke is a different
      emergency where the body cannot cool itself adequately.
    diagnosis:
    - Measure your temperature with a thermometer if available. A clinician may ask about symptoms, travel, medicines and immune
      status and examine or test for particular causes.
    care:
    - Rest, drink regularly and avoid overheating. A pharmacist can advise on fever or pain relief. Follow any emergency plan you
      were given for treatment such as chemotherapy.
    complications:
    - Fever can contribute to dehydration. A serious infection can also cause someone to deteriorate quickly, including when fever
      is mild or they later develop a low temperature.
    help:
    - Get urgent advice if pregnant, immunocompromised or rapidly worsening. Call 112 or 999 for confusion, severe breathing difficulty
      or a rash that does not fade under pressure with severe illness.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/fever-adults/
  insect-bites-stings:
    aliases: Bug bite, wasp sting, bee sting, insect reaction
    summary: Bites and stings usually cause pain or itching where they occur. Swelling of the mouth or throat, breathing difficulty
      or faintness can signal a severe allergic reaction.
    emergency: 'Breathing difficulty or throat swelling after a sting: call'
    evidence_gap: Most bites and stings are treated outside hospitals. Surveillance for particular insect-related illnesses cannot
      measure how many bites and stings happen in Ireland.
    symptoms:
    - A bite or sting can produce a small raised, itchy or painful area. A larger local swelling may spread over several hours. Watch
      for symptoms beyond the affected area.
    causes:
    - Insect saliva or venom can cause a local reaction. Some people have an allergy to venom and infection can occur later if the
      skin is scratched or broken.
    diagnosis:
    - A clinician or pharmacist can assess the skin and how the reaction progressed. Tell them if a tick may have been attached,
      or if you have had a severe reaction before.
    care:
    - Wash the area, remove a visible bee sting promptly and use a wrapped cold compress. Ask a pharmacist about suitable relief
      if swelling or itching is troublesome.
    complications:
    - Anaphylaxis can develop quickly after a sting. Worsening warmth, spreading redness, pus or fever in the following days can
      indicate a skin infection needing assessment.
    help:
    - Call 112 or 999 for breathing difficulty, throat swelling or collapse and use a prescribed adrenaline auto-injector if available.
      Seek medical advice if redness spreads or you have fever.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/insect-bites-stings/
  nosebleed:
    aliases: Epistaxis, bleeding from nose
    summary: Most nosebleeds stop with steady pressure on the soft part of the nose. Heavy bleeding, bleeding after a head injury
      or bleeding that continues needs medical assessment.
    symptoms:
    - Blood can come from one or both nostrils. If it runs down the back of the throat it can make you feel sick or cause vomiting.
    causes:
    - Dryness, nose picking, forceful nose blowing or injury can break small blood vessels. Some medicines and clotting conditions
      can make bleeding harder to stop.
    diagnosis:
    - A clinician can examine the nose, ask about injuries and medicines and check for blood loss. Repeated nosebleeds sometimes
      require tests or an ENT referral.
    care:
    - Sit upright, lean forward and pinch the soft part of your nose continuously for 10 to 15 minutes. Breathe through your mouth
      and avoid tipping your head back.
    complications:
    - A persistent bleed can cause significant blood loss, especially if you take an anticoagulant. A clinician may use cautery or
      nasal packing if pressure does not work.
    help:
    - Go to an emergency department if bleeding continues after 10 to 15 minutes of pressure, is heavy, or followed a blow to the
      head. Call 112 or 999 for collapse or serious breathing difficulty.
  oral-thrush:
    aliases: Mouth thrush, oral candidiasis, Candida in mouth
    summary: Oral thrush is an overgrowth of yeast in the mouth. Babies, people wearing dentures and people taking certain medicines
      can be more susceptible.
    evidence_gap: Most cases are managed in primary care or pharmacies. Data on invasive Candida infections describe a different
      illness and cannot estimate oral thrush prevalence in Ireland.
    symptoms:
    - Creamy white patches may leave a sore red area if wiped away. The mouth may feel sore or taste different. Babies can become
      unsettled during feeds.
    causes:
    - Candida commonly lives in the mouth in small amounts. Antibiotics, inhaled steroids, dentures, diabetes or a weakened immune
      system can allow it to grow more than usual.
    diagnosis:
    - A GP or dentist may recognise it by examining the mouth and asking about medicines and risk factors. Persistent or uncertain
      cases may need further investigation.
    care:
    - A pharmacist or GP can advise on age-appropriate antifungal treatment. Clean dentures as advised and rinse your mouth after
      using a steroid inhaler. Continue prescribed medicines unless told otherwise.
    complications:
    - Pain may make eating and drinking harder. Recurring symptoms can indicate an underlying contributor, while difficulty swallowing
      in someone immunocompromised may suggest a more extensive infection.
    help:
    - Contact a GP for persistent or recurring patches, particularly with a weakened immune system. Seek prompt help if a baby feeds
      poorly or if someone struggles to swallow fluids.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/oral-thrush/
  perforated-eardrum-overview:
    aliases: Ruptured eardrum, tympanic membrane perforation
    summary: A perforated eardrum is a hole or tear in the membrane between the ear canal and middle ear. Most small tears heal,
      but hearing changes should be checked.
    evidence_gap: Hospital procedure figures capture only people who needed interventions. They miss perforations that heal on their
      own and cannot establish national prevalence.
    symptoms:
    - Symptoms may include sudden ear pain, muffled hearing, ringing or fluid or blood coming from the ear. Some people feel dizzy
      or notice the pain ease after discharge begins.
    causes:
    - A middle ear infection can build pressure behind the membrane. A blow, sudden pressure change, very loud sound or an object
      inserted into the ear can also tear it.
    diagnosis:
    - A GP can look at the eardrum and check for infection. Hearing tests or a specialist examination may be needed if symptoms follow
      significant trauma or persist.
    care:
    - Keep the ear dry while it heals, and avoid swimming and putting anything into the ear. Use ear drops only if a clinician confirms
      they are suitable for a perforation.
    complications:
    - An opening can allow infection into the middle ear. Ongoing hearing loss, repeated discharge or a tear that does not close
      may require an ENT review.
    help:
    - Contact your GP for hearing loss, discharge or suspected perforation. Seek urgent care for sudden major hearing loss, severe
      dizziness or discharge after a significant head injury.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/perforated-eardrum-overview/
  sore-throat:
    aliases: Pharyngitis, painful throat, throat pain
    summary: Sore throat is often caused by a short-lived infection. Difficulty breathing, drooling or rapid deterioration can signal
      a problem that needs emergency care.
    evidence_gap: Irish studies of people attending with throat pain describe selected patient groups. These studies cannot establish
      how many people experience sore throat in the wider population.
    symptoms:
    - The throat may feel dry, scratchy or painful on swallowing. A cough, hoarseness, swollen glands or fever may occur and can
      help guide the next step.
    causes:
    - Viral infections cause many cases, and group A streptococcus causes some bacterial sore throats. Smoke, dry air or reflux may
      also irritate the throat.
    diagnosis:
    - A clinician can ask about duration, check the throat and consider testing where it would change treatment. Persistent symptoms
      may justify an assessment for other causes.
    care:
    - Drink regularly and ask a pharmacist about suitable pain relief. Most acute sore throats settle without antibiotics. Only use
      antibiotics that a clinician prescribes for this episode.
    complications:
    - Throat pain can make drinking harder and lead to dehydration. A rapidly worsening infection can occasionally cause an abscess
      or swelling that affects the airway.
    help:
    - Contact your GP if the sore throat persists or keeps returning. Call 112 or 999 for breathing difficulty, drooling because
      you cannot swallow, or severe rapidly worsening symptoms.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/sore-throat/
  tonsillitis:
    aliases: Inflamed tonsils, infected tonsils, recurrent tonsillitis
    summary: Tonsillitis means the tonsils at the back of your throat are inflamed. Viruses are a common cause, and some bacterial
      infections also need treatment.
    symptoms:
    - A sore throat, painful swallowing, fever and tender glands can occur. Tonsils may look enlarged or have a coating, but appearance
      alone cannot reliably identify the cause.
    causes:
    - Viruses and bacteria such as group A streptococcus can cause tonsillitis. The infection can spread through contact with saliva
      or respiratory secretions.
    diagnosis:
    - A GP can examine the throat, assess symptoms and decide whether testing or an antibiotic is likely to help. They may consider
      glandular fever or an abscess if the pattern differs.
    care:
    - Drink regularly and use suitable pain relief if needed. Antibiotics are used when clinically appropriate, and a specialist
      may discuss surgery for frequent severe episodes.
    complications:
    - Occasionally, an abscess develops beside a tonsil. One-sided worsening pain, difficulty opening your mouth or a change in voice
      can be warning signs.
    help:
    - Seek urgent care for severe one-sided pain, difficulty opening your mouth or inability to drink. Call 112 or 999 if breathing
      is difficult or you cannot swallow your saliva.
  addisons-disease:
    aliases: Primary adrenal insufficiency, Addisonian crisis, adrenal hormones
    summary: Addison's disease occurs when the adrenal glands cannot make enough cortisol and often aldosterone. Treatment replaces
      the missing hormones, with a separate plan for illness or injury.
    emergency: 'Collapse, severe confusion or suspected adrenal crisis: call'
    evidence_gap: The HSE gives an estimate of the proportion of Irish Addison's cases that are autoimmune, but does not give a national
      estimate of the number living with primary adrenal insufficiency.
    symptoms:
    - Tiredness, muscle weakness, weight loss without trying and dizziness when standing can develop gradually. Some people notice
      patches of darker skin or darkening inside the mouth.
    causes:
    - An autoimmune reaction can damage the adrenal cortex. Cortisol supports the body's response to stress, while aldosterone helps
      regulate fluid balance and blood pressure.
    diagnosis:
    - A clinician can check cortisol and related hormones and may arrange a stimulation test to see how the adrenal glands respond.
      Other tests help find the cause.
    care:
    - Prescription hormone replacement is usually lifelong. Ask the endocrine team for written sick-day rules, emergency injection
      training if prescribed, and advice on carrying a steroid emergency card.
    complications:
    - A severe fall in cortisol can cause an adrenal crisis. Vomiting or diarrhoea is especially concerning if you cannot keep replacement
      medicine down. People can usually live actively with appropriate treatment.
    help:
    - Contact your doctor if fatigue, weight loss and dizziness persist. If an adrenal crisis is suspected, follow your emergency
      plan and call 112 or 999.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/addisons-disease/
  agoraphobia:
    aliases: Fear of leaving home, panic on public transport, agoraphobia
    summary: Agoraphobia involves strong fear in places where it may feel difficult to escape or get help. Avoidance can gradually
      narrow daily activities.
    evidence_gap: General Irish anxiety statistics combine different conditions. The sources reviewed did not establish how many
      people in Ireland specifically have agoraphobia.
    symptoms:
    - Public transport, queues, open areas or leaving home alone can feel overwhelming. Some people experience a racing heart, shaking,
      dizziness or a fear of losing control.
    causes:
    - A panic attack or other frightening experience can lead to anticipatory fear. Avoidance brings short-term relief but can make
      feared situations harder to return to.
    diagnosis:
    - A GP or mental health professional asks which situations you fear, how long this has been happening and how it affects daily
      life. They can assess overlapping panic or physical symptoms.
    care:
    - Cognitive behavioural therapy can help identify predictions about what will happen and practise facing feared situations gradually.
      A clinician may discuss medicine when appropriate.
    complications:
    - Avoidance can affect work, study, relationships and medical appointments. A plan that starts with manageable steps can help
      people regain independence over time.
    help:
    - Talk to your GP if fear or avoidance is restricting daily life. If leaving home makes appointments difficult, ask whether the
      service can start with a phone or video consultation.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/agoraphobia/
  angelman-syndrome:
    aliases: Angelman syndrome, UBE3A, developmental delay
    summary: Angelman syndrome is a rare genetic condition affecting development, communication and movement. Specialist support
      often starts well before a child has a confirmed diagnosis.
    symptoms:
    - Babies may have feeding difficulties or develop motor skills slowly. Speech often remains very limited, and problems with balance,
      seizures and difficulty sleeping can emerge.
    causes:
    - Brain cells normally rely mainly on the copy of UBE3A inherited from the mother. Angelman syndrome occurs when that copy is
      missing or does not work as expected.
    diagnosis:
    - A paediatrician or paediatric neurologist considers the child's development and examination and arranges genetic tests. Clinical
      genetics can explain what the result means for the family.
    care:
    - Physiotherapy, occupational therapy and communication support can help a child take part in daily life. Their team can also
      make an individual plan for seizures, sleep and feeding.
    complications:
    - Support needs often continue into adulthood. Regular reviews can pick up changes in movement, spinal curvature, feeding or
      seizure control and help plan the transition to adult services.
    help:
    - Speak to the public health nurse or GP if your child is missing milestones, losing skills or having possible seizures. Ask
      for a written seizure plan if diagnosed.
  arthroscopy:
    kind: procedure
    aliases: Keyhole joint surgery, knee arthroscopy, joint camera
    summary: Arthroscopy lets a surgeon look inside a joint and sometimes treat a problem using small incisions. What you gain from
      it depends on the exact diagnosis.
    symptoms:
    - It can help when a specialist suspects a particular injury or joint problem that can be assessed or treated with keyhole surgery.
      It is not needed for every sore joint.
    causes:
    - A slim camera sends an image to a screen. The surgeon can introduce small instruments through separate incisions to perform
      the treatment agreed before the operation.
    diagnosis:
    - Ask what the procedure aims to change, what alternatives exist and how recovery will affect work or caring duties. Follow the
      hospital's fasting and medicine instructions.
    care:
    - Your anaesthetic depends on the joint, operation and health history. Many people go home the same day after the team checks
      pain control and safe mobility.
    complications:
    - Pain, stiffness and swelling can follow surgery. Physiotherapy or mobility aids may help. Recovery can differ substantially
      between an examination and a repair inside the joint.
    help:
    - Follow the hospital's wound and exercise instructions. Contact the team for fever or increasing redness, and seek emergency
      care for chest pain or new severe breathlessness.
  bird-flu:
    aliases: Avian influenza, bird flu exposure, HPSC
    summary: Avian influenza mainly affects birds. Human infection is uncommon, but someone who becomes unwell after relevant contact
      with an infected animal should seek prompt advice.
    symptoms:
    - People who become ill may have fever, cough, muscle aches, headache or red eyes. Worsening breathlessness or feeling very unwell
      can signal a more serious illness.
    causes:
    - In Ireland, public advice is to avoid handling sick or dead wild birds. People who work with poultry or other potentially affected
      animals should follow workplace health guidance.
    diagnosis:
    - A clinician asks about recent animal exposure, travel and symptom timing. Public health teams can advise the clinician on safe
      assessment and whether specialist testing is appropriate.
    care:
    - Phone ahead before attending a healthcare setting if you have symptoms after a relevant exposure. A hospital team may use antiviral
      medicines and supportive care if needed.
    complications:
    - Some infections can develop into serious respiratory illness. Public health may follow up people with relevant exposures, depending
      on the circumstances and current guidance.
    help:
    - If you become unwell after relevant animal contact, phone a GP or GP out-of-hours service and describe the exposure. Call 112
      or 999 for severe breathing difficulty.
  circumcision-in-boys:
    kind: procedure
    aliases: Child circumcision, foreskin surgery in boys, phimosis operation
    summary: Circumcision removes the foreskin. For a child, a specialist can explain whether surgery is medically indicated and
      whether a less invasive treatment may help first.
    symptoms:
    - Doctors may discuss it for scarring, repeated inflammation or specific foreskin problems. In younger children, a foreskin that
      still cannot be pulled back is often a normal stage.
    causes:
    - The surgeon removes the foreskin and typically uses stitches that dissolve. A clinician will discuss alternatives such as a
      steroid cream when these are appropriate.
    diagnosis:
    - Ask about anaesthesia, fasting, regular medicines and how pain will be managed. Tell the hospital if your child develops a
      cough or fever before the operation.
    care:
    - A child usually has a general anaesthetic. The team checks recovery and explains how to help with washing, pain relief and
      loose clothing before going home.
    complications:
    - Swelling or bruising is common early in recovery. Follow the surgeon's instructions about school, sport, swimming and when
      your child can become active again.
    help:
    - Ask the hospital for urgent advice if your child cannot pass urine, has increasing pain or has significant bleeding. Follow
      their instructions if you suspect a wound infection.
  circumcision-men:
    kind: procedure
    aliases: Adult circumcision, foreskin removal, surgery for tight foreskin
    summary: Adult circumcision is surgery to remove the foreskin. It can help with some persistent foreskin problems, and the specialist
      can explain how recovery may affect daily activities.
    symptoms:
    - It may be offered for a very tight or scarred foreskin or recurrent inflammation. Ask which alternatives remain suitable for
      the cause and severity of your symptoms.
    causes:
    - The surgeon removes the foreskin and closes the incision, usually with dissolvable stitches. The team explains the expected
      appearance and practical effects of the operation.
    diagnosis:
    - Tell the team about medicines and any allergies. Follow their fasting advice and arrange collection afterwards if your anaesthetic
      means you cannot travel home alone.
    care:
    - The operation may use general or local anaesthesia depending on the situation. Before discharge, ask how to care for the wound
      and use pain relief safely.
    complications:
    - Temporary swelling and sensitivity are common. Bleeding or infection can occur. Return to sport or sexual activity according
      to the team's advice and allow the wound to heal.
    help:
    - Contact the hospital promptly for significant bleeding, inability to pass urine, fever or worsening pain. Ask how to arrange
      review if the wound does not heal as expected.
  coronary-artery-bypass-graft:
    kind: procedure
    aliases: CABG, heart bypass, coronary bypass surgery
    summary: Coronary artery bypass graft surgery creates new routes for blood to reach parts of the heart muscle. Follow-up includes
      rehabilitation and ongoing care for coronary heart disease.
    emergency: 'Severe chest pain or sudden breathing difficulty: call'
    symptoms:
    - A heart team may consider bypass surgery for some people with narrowed coronary arteries, depending on the pattern of disease,
      symptoms and overall health.
    causes:
    - A surgeon uses blood vessels from another part of the body to direct blood around blocked or narrowed sections. The number
      of grafts depends on which arteries are affected.
    diagnosis:
    - Before surgery, the team may review heart tests and check for factors that affect recovery. Follow their instructions about
      medicines, fasting and who will help after discharge.
    care:
    - The operation uses general anaesthesia. After surgery, a hospital team monitors breathing, heart rhythm and pain and helps
      you start moving safely as you recover.
    complications:
    - Recovery takes weeks. Cardiac rehabilitation can guide activity and support long-term heart health. Possible complications
      include infection, rhythm changes, stroke or heart attack.
    help:
    - Raise concerns about wounds, fever or worsening symptoms with your surgical team. Call 112 or 999 for severe chest pain, collapse
      or sudden severe breathing difficulty.
  digeorge-syndrome:
    aliases: DiGeorge syndrome, 22q11.2 deletion syndrome, velocardiofacial syndrome
    summary: A small missing segment of chromosome 22 can affect the heart, immune system, palate and development. The combination
      varies widely, even within the same family.
    evidence_gap: The HSE gives a general frequency estimate without identifying it as a measured Irish rate. A national count of
      people living with the deletion was not available from the sources reviewed.
    symptoms:
    - Some babies have heart problems, feeding or speech difficulties, repeated infections or symptoms of low calcium. Learning and
      mental health difficulties can become clearer later in life.
    causes:
    - A missing segment of chromosome 22 affects several genes involved in early development. The deletion often arises for the first
      time, but it can also be inherited.
    diagnosis:
    - A specialist can confirm the deletion with a genetic blood test. The team may also check the heart, palate, calcium level,
      immune function and developmental needs.
    care:
    - Treatment is tailored to the findings. It can include cardiology care, immunology advice and speech and language therapy. The
      team can advise on vaccines if immunity is affected.
    complications:
    - Follow-up can identify new concerns as a child grows. Clinical genetics can discuss testing for relatives and explain the chance
      of passing the deletion on.
    help:
    - Speak to a GP or paediatric team about feeding or recurrent infections. Seek urgent medical assessment for a first seizure,
      breathing difficulty or sudden deterioration.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/digeorge-syndrome/
  epidermolysis-bullosa:
    aliases: EB skin fragility, butterfly skin, inherited blistering disorder
    summary: Epidermolysis bullosa describes inherited conditions in which skin blisters or tears after relatively minor rubbing
      or injury. The affected parts of the body and severity depend on the subtype.
    symptoms:
    - Blisters can appear soon after birth or become more obvious later. Some people mainly have painful blisters on hands or feet,
      while others develop widespread wounds or mouth problems.
    causes:
    - Gene changes affect the proteins that hold layers of skin together. Different changes account for different patterns of blistering,
      scarring and involvement inside the body.
    diagnosis:
    - A dermatologist or specialist EB service assesses the blistering pattern and can arrange genetic testing or a skin biopsy to
      confirm the subtype and guide treatment.
    care:
    - Specialist nurses can teach families how to handle skin and dress wounds. Pain relief, nutrition, dental care and physiotherapy
      can be planned around the person's needs.
    complications:
    - Recurrent wounds can become infected. Some forms cause scarring, swallowing problems or a higher risk of skin cancer, so specialist
      teams arrange follow-up according to the subtype.
    help:
    - Seek medical advice promptly for unexplained blistering in a newborn or spreading redness, fever or increasing pain around
      a wound. Contact the specialist team about a wound that does not heal.
  female-genital-mutilation:
    aliases: FGM, female genital cutting, specialist FGM clinic Ireland
    summary: Female genital mutilation can have lasting effects on physical and mental health. In Ireland, specialist care is available
      and concerns about a child can be reported to Gardaí or Tusla.
    emergency: 'Immediate danger or life-threatening bleeding: call'
    symptoms:
    - Survivors may have pain, difficulty passing urine, infections, difficulties with periods or sex, or distress. Troubles can
      emerge years later, including during pregnancy or childbirth.
    causes:
    - FGM changes or injures genital tissue for non-medical reasons. Healing can leave scar tissue, and the nature and severity of
      long-term effects differ from person to person.
    diagnosis:
    - A clinician can listen to your concerns and discuss options confidentially. If an examination could help, the clinician should
      explain the reason and seek your consent first.
    care:
    - The HSE describes free specialist care and counselling, with self-referral available. Your maternity team can discuss a plan
      for pregnancy and birth and arrange specialist support.
    complications:
    - Treatment may help with pain, urinary or sexual difficulties, childbirth planning and emotional wellbeing. A specialist can
      explain whether surgery to relieve certain complications is appropriate.
    help:
    - If a child may be at risk, contact Tusla or Gardaí. If someone is in immediate danger, call 112 or 999. Seek prompt medical
      care for bleeding, infection or severe pain.
  fetal-alcohol-spectrum-disorders:
    aliases: FASD, fetal alcohol syndrome, prenatal alcohol exposure
    summary: Fetal alcohol spectrum disorders describe lasting effects of alcohol exposure before birth. Assessment can help match
      support to a child's learning and daily living needs.
    symptoms:
    - A child may struggle with attention, language, memory, coordination or coping with changes. Some have growth or physical differences,
      while others have difficulties that are less visible.
    causes:
    - Alcohol crosses the placenta and can interfere with development, including development of the brain. The HSE advises avoiding
      alcohol throughout pregnancy because a safe amount has not been established.
    diagnosis:
    - Specialists consider developmental and medical history along with physical and neurodevelopmental findings. A GP or paediatrician
      can help assess other explanations and identify appropriate referrals.
    care:
    - Individual supports may include speech and language therapy, occupational therapy, school accommodations and regular routines.
      A care plan should reflect what helps the child participate and learn.
    complications:
    - Needs can change as schoolwork and social demands become more complex. Earlier recognition can help families and teachers adapt
      expectations and provide practical support.
    help:
    - If you are concerned about drinking in pregnancy, talk to your GP or midwife for confidential support. For concerns about a
      child's development, speak to the public health nurse or GP.
  having-surgery:
    kind: procedure
    aliases: Paediatric spinal surgery, spinal fusion recovery, Children's Health Ireland
    summary: Children's spinal surgery is planned with a specialist team. The team explains the operation, what preparation is needed
      and how parents can support recovery at home.
    evidence_gap: Children’s Health Ireland reports activity across its paediatric spinal service. Service totals can include multiple
      diagnoses and procedures and cannot give prevalence of any one condition.
    symptoms:
    - Specialists may offer surgery when a spinal curve is severe or growing and an operation is expected to improve alignment, function
      or the risk of further progression.
    causes:
    - The operation depends on the child's diagnosis and growth. Spinal fusion uses implants to hold the spine in an improved position
      while selected bones heal together.
    diagnosis:
    - The team explains medicines, fasting and any pre-operative assessments. Tell them about recent illness and ask who to call
      if your child becomes unwell before admission.
    care:
    - The care team manages anaesthesia, pain relief and early mobilisation. A physiotherapist or nurse usually helps with moving,
      and parents receive instructions before the child goes home.
    complications:
    - Recovery varies with the operation and child. Infection, bleeding and nerve injury are among the risks the surgeon discusses.
      Ask for individual guidance on school and activity.
    help:
    - Follow the discharge plan for wound reviews and appointments. Contact the team for fever, increasing wound redness or uncontrolled
      pain. Seek emergency care for sudden new weakness or trouble breathing.
    sources:
      Clinical guidance and further reading: https://www.childrenshealthireland.ie/news/spinal-surgery-updates/
  hoarding-disorder:
    aliases: Compulsive hoarding, difficulty discarding possessions, unsafe clutter
    summary: Hoarding disorder involves ongoing difficulty parting with possessions, leading to clutter that interferes with ordinary
      use of rooms or causes significant distress.
    evidence_gap: Housing or fire-service reports describe selected incidents. The sources reviewed did not establish national prevalence
      of clinically defined hoarding disorder in Ireland.
    symptoms:
    - Discarding items can cause intense distress. Walkways, cooking areas or beds may become hard to use. Some people avoid visitors
      because they feel embarrassed about the clutter.
    causes:
    - Items may feel essential for future use, memory or security. Difficulty making decisions can add to the problem. Hoarding can
      coexist with anxiety, depression or other difficulties.
    diagnosis:
    - Assessment explores the impact on living spaces, safety and wellbeing, and whether a medical or another mental health issue
      is contributing. The person should be involved throughout.
    care:
    - Treatment often includes adapted cognitive behavioural therapy and gradual practice sorting, organising and letting go of items.
      Collaborating on realistic goals helps build trust.
    complications:
    - Blocked exits can increase fire risk, and clutter can contribute to falls or difficulties with hygiene and repairs. A sustainable
      safety plan may need support over time.
    help:
    - Contact a GP if clutter causes distress or makes essential rooms unusable. For an immediate danger such as a fire, leave the
      area and contact emergency services.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/hoarding-disorder/
  human-papillomavirus-hpv:
    aliases: HPV infection, high-risk HPV, cervical screening, genital warts
    summary: Human papillomavirus is a group of common viruses. Many infections clear without treatment. Some types cause genital
      warts and persistent infection with certain types can lead to cancer.
    symptoms:
    - Most people have no symptoms. Warts, a persistent lump or unusual vaginal bleeding are reasons to get advice, even if you recently
      attended routine screening.
    causes:
    - HPV can pass through intimate skin contact. Persistent infection with certain high-risk types can change cells over time. The
      types that cause genital warts usually differ from those causing cancer.
    diagnosis:
    - CervicalCheck looks for high-risk HPV as part of cervical screening. A clinician can assess symptoms separately and explain
      when a positive result needs repeat testing or colposcopy.
    care:
    - Vaccination lowers the risk from the types it covers. Attend cervical screening if eligible, even if vaccinated. Warts or abnormal
      cells can be treated where appropriate.
    complications:
    - A positive cervical HPV result often clears, and follow-up helps find cell changes early. Keeping appointments matters because
      persistence increases the chance of changes needing care.
    help:
    - Contact your GP, sexual health clinic or screening provider as appropriate. Bring symptoms such as bleeding after sex to a
      clinician without waiting for your next screening invitation.
  hypochondria:
    aliases: Health anxiety, illness anxiety, fear of illness, hypochondria
    summary: Health anxiety can make worries about being seriously ill dominate everyday life. The distress is real, and it can continue
      alongside a diagnosed physical condition.
    evidence_gap: General anxiety data cannot establish the number of people with health anxiety specifically. The sources reviewed
      did not provide a reliable Irish population estimate.
    symptoms:
    - People may repeatedly check their body, search for symptoms, seek reassurance or avoid appointments altogether. Reassurance
      can relieve worry for a while before it returns.
    causes:
    - Normal sensations, changes in health or a frightening experience can trigger worry. Focusing on sensations and searching for
      explanations can make them feel more threatening.
    diagnosis:
    - A GP can consider physical symptoms on their merits and ask how much time worry takes up. A mental health assessment looks
      at checking, avoidance and the impact on daily routines.
    care:
    - Cognitive behavioural therapy can help people change checking and reassurance habits and respond differently to uncertainty.
      A clinician may discuss other treatments if anxiety or depression is also present.
    complications:
    - Health anxiety can affect sleep, relationships and work. Agreeing a follow-up plan with your GP can help you act on new symptoms
      without repeatedly checking the same concern.
    help:
    - Ask for help if worrying about illness is taking over your day. Discuss a new or changing physical symptom normally and tell
      your GP how much worry it is causing.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/hypochondria/
  lynch-syndrome:
    aliases: Hereditary colorectal cancer, HNPCC, mismatch repair, Lynch genetic testing
    summary: Lynch syndrome is an inherited tendency to develop certain cancers, especially bowel and womb cancer. A confirmed result
      can change the screening and prevention options available to you.
    evidence_gap: The HSE gives a worldwide estimate, which cannot establish prevalence in Ireland. Counts of families referred for
      testing would omit people whose variant has never been identified.
    symptoms:
    - People with Lynch syndrome usually feel well from the inherited change itself. Persistent bowel changes, bleeding or unusual
      vaginal bleeding still need assessment regardless of genetic testing status.
    causes:
    - A change affecting DNA mismatch repair makes it harder for cells to fix some copying errors. A parent with the change has a
      one-in-two chance of passing it to each child.
    diagnosis:
    - Genetics teams review the family history and may use tumour results to guide a blood or saliva test. Relatives can discuss
      a test for a known family variant.
    care:
    - Surveillance is tailored to the gene and family history. It can include scheduled colonoscopy and discussion of approaches
      to lowering risk, including options related to womb or ovarian cancer.
    complications:
    - Cancer risk varies by gene, age and family history. A confirmed result also helps relatives decide whether they want predictive
      testing and a personalised care plan.
    help:
    - Talk to your GP if several close relatives have had related cancers, particularly at younger ages, or if a relative shares
      a confirmed Lynch result.
    sources:
      Clinical guidance and further reading: https://www.cancer.ie/cancer-information/cancer-types/lynch-syndrome
  pacemaker:
    kind: procedure
    aliases: Heart pacemaker, pacemaker insertion, slow heart rate
    summary: A pacemaker helps keep the heart beating at an appropriate rate. Your cardiology team can explain why you need it and
      what follow-up will involve.
    symptoms:
    - A pacemaker can be offered when a slow heart rhythm or an interruption in the heart's electrical signals causes symptoms such
      as dizziness, tiredness or fainting.
    causes:
    - The device monitors the heart's rhythm and sends electrical impulses when needed. Many systems use leads inside the heart,
      and some people may be offered a leadless device.
    diagnosis:
    - Tell the team about medicines, especially blood thinners, and follow their instructions on which to take. Ask who will take
      you home and when you can return to normal activities.
    care:
    - In many cases the device is inserted under local anaesthetic. The team checks its position and settings and observes you for
      complications before discharge.
    complications:
    - The insertion site may be sore or bruised. Infection, bleeding and a lead moving are possible complications. Regular checks
      confirm the device is working and monitor the battery.
    help:
    - Contact your device clinic for increasing wound redness, a fever or returning dizzy spells. Call 112 or 999 for severe chest
      pain, collapse or serious breathing difficulty.
  phobias:
    aliases: Specific phobia, intense fear, exposure therapy
    summary: A phobia is intense fear related to a particular object or situation. A fear becomes a clinical concern when it causes
      ongoing distress or disrupts daily life.
    evidence_gap: Irish surveys that group anxiety conditions cannot identify the proportion with a specific phobia. The sources
      reviewed did not establish a national prevalence estimate.
    symptoms:
    - Anticipating or facing the trigger can cause trembling, nausea, sweating or a racing heart. People may change their routines
      to avoid the feared object or situation.
    causes:
    - Fear can develop after an upsetting experience, by observing others or without a clear starting point. Avoidance can make it
      harder to learn that a situation can be tolerated.
    diagnosis:
    - A clinician asks what triggers the fear, what you expect to happen and how much avoidance affects you. Other patterns of anxiety
      sometimes call for a different assessment.
    care:
    - Cognitive behavioural therapy may include planned, gradual exposure with a trained practitioner. Progress starts at a manageable
      level and builds as confidence grows.
    complications:
    - A phobia can affect travel, education or healthcare, depending on the trigger. Treatment can help someone do things they previously
      avoided, even if some anxiety remains.
    help:
    - Speak to your GP if fear is limiting everyday activities or preventing treatment such as dental care. Tell the healthcare team
      early if an appointment involves a known trigger.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/phobias/
  pilonidal-sinus:
    aliases: Pilonidal cyst, painful lump near tailbone, pilonidal abscess
    summary: A pilonidal sinus is a small channel in the skin near the top of the cleft between the buttocks. Some cause no problems
      until they become infected.
    evidence_gap: The available HIPE group combines perianal and pilonidal procedures and cannot isolate pilonidal sinus nationally.
      It also excludes cases managed without hospital care.
    symptoms:
    - An infection may cause a painful lump, swelling, bleeding or a discharge. Sitting can be uncomfortable, and symptoms can worsen
      quickly if an abscess forms.
    causes:
    - Hair and pressure or friction in the cleft can contribute to inflammation. An opening can persist after the acute infection
      improves and sometimes causes repeated problems.
    diagnosis:
    - A clinician can usually identify the condition by examining the area and asking when swelling or discharge began. Different
      problems near the anus can need other assessment.
    care:
    - An infected abscess may need drainage. A surgical team can explain options for recurrent disease, how each wound heals and
      what dressing changes are likely to involve.
    complications:
    - Recovery ranges from simple wound care to several weeks of dressings after some operations. Recurrence is possible, and continued
      pain or discharge warrants follow-up with the treating team.
    help:
    - Ask for an urgent GP appointment for a painful lump that bleeds or leaks pus. Seek medical assessment promptly for fever, spreading
      redness or worsening illness.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/pilonidal-sinus/
  scoliosis:
    aliases: Curved spine, adolescent idiopathic scoliosis, spinal curvature
    summary: Scoliosis is a sideways curve and rotation of the spine. In children and teenagers, decisions about monitoring or treatment
      depend partly on how much growth remains.
    symptoms:
    - One shoulder or hip may sit higher, clothing may hang unevenly, or ribs may stand out on one side. Some people have back pain,
      especially in adulthood.
    causes:
    - Many curves that develop in adolescence have no identifiable cause. Others are present at birth, are related to a neuromuscular
      condition or appear with age-related spinal changes.
    diagnosis:
    - The clinician examines the back and may ask the person to bend forward. An X-ray can confirm the curve and measure its degree
      if a specialist recommends it.
    care:
    - Smaller curves may simply need monitoring. A brace can reduce progression for some growing children. A spinal team may discuss
      surgery for a severe or progressing curve.
    complications:
    - Some curves increase during growth, so follow-up timing matters. Severe curves can affect function and rarely breathing. Physiotherapy
      can help manage some symptoms or support recovery after treatment.
    help:
    - Contact a GP if you notice a new asymmetry in your child's back. Seek urgent care for new weakness, loss of bladder or bowel
      control or numbness around the groin.
  seasonal-affective-disorder:
    aliases: SAD, depression in winter, seasonal depression
    summary: Seasonal affective disorder is depression that returns in a seasonal pattern, most often worsening during autumn or
      winter and improving at another time of year.
    evidence_gap: Irish surveys asking about depression generally do not distinguish a recurring seasonal pattern. The sources reviewed
      did not establish a national prevalence figure for SAD.
    symptoms:
    - Low mood, loss of interest and low energy can occur. Some people sleep more, crave carbohydrate-rich food or find it harder
      to get up and keep a routine.
    causes:
    - Changes in daylight may affect body rhythms and sleep timing. The cause is not fully understood and factors such as existing
      mood difficulties can also matter.
    diagnosis:
    - A clinician asks about symptoms, their impact and how mood changes over more than one season. They can assess other possible
      causes and check for past episodes of unusually high mood.
    care:
    - Treatment can include psychological therapy or prescribed medicine. Regular daylight exposure and activity may support a routine.
      Discuss light therapy with a clinician first if you are considering it.
    complications:
    - A recurring pattern can affect relationships, sleep and work. Planning ahead with a clinician can help you recognise a change
      early and start the care that previously helped.
    help:
    - Speak to your GP if symptoms persist, recur or disrupt daily life. Seek immediate help through emergency services if you are
      at immediate risk of harming yourself.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/seasonal-affective-disorder/
  selective-mutism:
    aliases: Child speaking at home but not school, situational mutism, selective mutism
    summary: Selective mutism is an anxiety-related difficulty speaking in specific situations, even though the person can speak
      in settings where they feel comfortable.
    evidence_gap: Clinical referrals miss children who have not reached services. The sources reviewed did not establish a reliable
      population estimate for selective mutism in Ireland.
    symptoms:
    - A child may talk freely at home but become still, look away or communicate with gestures at school. The pattern can also occur
      in particular activities or public places.
    causes:
    - Anxiety can make speaking feel impossible in certain settings. A new environment or pressure to respond publicly can make participation
      harder for the child.
    diagnosis:
    - Assessment considers where speech occurs, how long the pattern has lasted and the child's language, hearing and development.
      Parents, school and clinicians can share observations across settings.
    care:
    - Small, planned steps can make communication more comfortable. Adults can agree ways to reduce pressure and support responses,
      with input from a speech and language therapist or psychologist when needed.
    complications:
    - The difficulty can affect participation, learning and friendships. A consistent plan across home and school helps give the
      child more opportunities to communicate without being singled out.
    help:
    - Talk to the child's teacher and GP if the pattern persists and interferes with school life. Ask which local assessment and
      communication supports can help.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/selective-mutism/
  social-anxiety:
    aliases: Social phobia, fear of being judged, social anxiety disorder
    summary: Social anxiety involves a strong fear of being watched, embarrassed or judged in social situations. It can affect ordinary
      activities like eating in public or speaking at work.
    evidence_gap: Irish estimates for all anxiety disorders do not give the prevalence of social anxiety disorder. The sources reviewed
      did not establish a national estimate for this diagnosis.
    symptoms:
    - People may worry long before an event, blush, shake or feel sick during it, and replay conversations afterwards. Some avoid
      activities they would otherwise enjoy.
    causes:
    - Fear of negative judgement can become linked to specific situations or occur more widely. Avoidance and habits such as relying
      on rehearsed answers can keep the fear going.
    diagnosis:
    - A GP or mental health professional asks about the situations involved, how long the fear has lasted and whether it affects
      work, school or friendships.
    care:
    - Individual cognitive behavioural therapy can help test fears and practise social situations gradually. A clinician can talk
      through other treatment options if therapy is unavailable or insufficient.
    complications:
    - Social anxiety may lead to isolation, difficulty at school or work or low mood. Treatment goals can focus on concrete activities
      the person wants to take part in again.
    help:
    - Speak to a GP if social fear interferes with attendance, relationships or work. For a young person, ask about support from
      their GP, school or local services.
    sources:
      Clinical guidance and further reading: https://www2.hse.ie/conditions/social-anxiety/
  spiking:
    aliases: Drink spiking, suspected spiking, SATU
    summary: Spiking means someone was given a substance without their agreement. If you suspect it, getting to a safe place with
      someone you trust and getting medical help are the immediate priorities.
    emergency: 'Unconsciousness, seizure or trouble breathing: call'
    symptoms:
    - Someone may suddenly feel unusually sleepy, confused, sick or unable to move as expected. Memory gaps, loss of consciousness
      or feeling far more affected than expected are possible.
    causes:
    - Symptoms can overlap with effects of alcohol and other medical problems. How someone feels alone cannot confirm whether spiking
      occurred or reveal the substance involved.
    diagnosis:
    - A clinician can check consciousness, breathing and injuries and decide what tests are appropriate. Tell them the approximate
      timing, any medicines taken and what you remember.
    care:
    - Tell someone you trust or a member of staff. Stay with the affected person, check breathing and follow emergency instructions
      if they become difficult to wake or have a seizure.
    complications:
    - If sexual assault may have occurred, a Sexual Assault Treatment Unit can explain healthcare, support and forensic options.
      You can ask for care before deciding whether to report.
    help:
    - Call 112 or 999 if the person is hard to wake, has a seizure or has trouble breathing. If you are safe, Gardaí can also advise
      how to report an incident.
  varicose-veins:
    aliases: Varicose veins in legs, swollen visible veins, venous reflux
    summary: Varicose veins are enlarged veins that often appear on the legs. They can cause aching or skin changes, although some
      people mainly notice how the veins look.
    symptoms:
    - Veins can appear swollen or twisted. Legs may feel heavy, itchy or achy, especially after standing. Ankle swelling or skin
      colour changes can occur over time.
    causes:
    - Vein valves usually help blood return towards the heart. When valves do not close properly, blood can pool and stretch the
      vein. Pregnancy and age can affect risk.
    diagnosis:
    - A clinician examines the legs and asks when symptoms occur. A specialist may use duplex ultrasound to show how blood moves
      through the veins before selecting treatment.
    care:
    - Activity and raising the legs can ease some symptoms. Depending on the assessment, treatment may include methods that close
      or remove affected veins. Ask before using compression if circulation is uncertain.
    complications:
    - Some people develop skin inflammation, a persistent ulcer or bleeding from a vein. A painful swollen leg can have other causes
      and needs assessment rather than relying on appearance.
    help:
    - Seek urgent help for new one-sided leg swelling or persistent bleeding. Apply direct pressure to a bleeding vein and call 112
      or 999 if bleeding is heavy or you feel faint.
