# Builds the static site from content/ and publishes it to GitHub Pages whenever an article is
# committed. The bot's DEPLOY_COMMAND does the commit and push; this does the rest. Enable once in
# the repo: Settings -> Pages -> Source: GitHub Actions.
name: site
on:
  push:
    paths: ["content/**", "compound/site/**", ".github/workflows/site.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - run: compound build
        env:
          SITE_BASE_URL: https://compound.ie
          PREVIEW_BASE_URL: https://compound.ie
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
