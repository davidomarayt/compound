# Builds the static site from content/ and publishes it to GitHub Pages whenever an article is
# committed to the publishing branch. The bot's DEPLOY_COMMAND does the commit and push; this does
# the rest. Enable once in the repo: Settings -> Pages -> Source: GitHub Actions.
name: site
on:
  push:
    branches: ["claude/clever-babbage-uibieq"]
    paths: ["content/**", "compound/site/**", "scripts/news_images.py", "scripts/verify_solar_mobile.py", ".github/workflows/site.yml", "scripts/verify_changed_articles.py"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-v2
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - name: Attach images to published News stories
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python scripts/news_images.py
      - name: Verify approved TV licence stock photograph
        run: |
          test -s compound/site/static/images/evergreen/ireland-tv-licence-decline-2026.jpg
          python - <<'PY'
          from PIL import Image
          p = 'compound/site/static/images/evergreen/ireland-tv-licence-decline-2026.jpg'
          with Image.open(p) as img:
              img.verify()
          with Image.open(p) as img:
              assert img.width >= 1000 and img.height >= 500, img.size
          print('Approved TV licence image validated')
          PY
      - run: compound build
        env:
          SITE_BASE_URL: https://compound.ie
          PREVIEW_BASE_URL: https://compound.ie
      - name: Verify changed article routes, canonical tags and social images
        run: python scripts/verify_changed_articles.py --mode built
      - name: Verify Solar hub pages and client script
        shell: bash
        run: |
          set -euo pipefail
          node --check compound/site/static/solar-hub.js
          node --check compound/site/static/solar-sponsors.js
          node --check compound/site/static/solar-research.js
          for path in solar solar/compare-quotes solar/grants solar/costs solar/installers solar/get-quotes solar/for-installers solar/batteries solar/export-rates solar/equipment; do
            test -s "public/$path/index.html"
            grep -q 'rel="canonical"' "public/$path/index.html"
            grep -q 'solar-hub.css' "public/$path/index.html"
          done
          grep -q 'https://compound.ie/solar/compare-quotes/' public/solar/compare-quotes/index.html
          grep -q '/solar/' public/wealth/index.html
          grep -q 'data-solar-sponsor-form' public/solar/for-installers/index.html
          grep -Fq 'https://formsubmit.co/david@compound.ie' public/solar/for-installers/index.html
          grep -Fq 'data-sponsor-counties' public/solar/for-installers/index.html
          ! grep -q 'action="mailto:' public/solar/for-installers/index.html
          ! grep -q 'Prepare my application email' public/solar/for-installers/index.html
          grep -q 'solar-sponsors.css' public/solar/for-installers/index.html
          ! grep -q 'pagead2.googlesyndication.com' public/solar/for-installers/index.html
          ! grep -q '<ins class="adsbygoogle"' public/solar/for-installers/index.html
          test "$(grep -o 'data-county' content/pages/solar-for-installers.md | wc -l)" -eq 32
          grep -q 'solar-payback-calculator/' public/solar/index.html
          ! grep -R -F 'built and occupied before 2021' public/solar public/solar-payback-calculator public/wealth/solar-panels-ireland public/wealth/solar-panels-vs-battery-ireland
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  verify-live:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install PyYAML
      - name: Verify changed published URLs, canonical tags and new News images
        run: python scripts/verify_changed_articles.py --mode live
