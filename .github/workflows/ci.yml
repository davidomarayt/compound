# Fast correctness gate for article and code changes.
# Run once on a PR, and once on the publishing branch after merge.
# Expensive image, Lighthouse and browser checks live in site.yml / quality-audit.yml.
name: ci
on:
  pull_request:
    branches: ["claude/clever-babbage-uibieq"]
  push:
    branches: ["claude/clever-babbage-uibieq"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Fast changed-article editorial preflight
        shell: bash
        run: |
          set -euo pipefail
          if git rev-parse HEAD^ >/dev/null 2>&1; then
            git diff --name-only HEAD^ HEAD > "${RUNNER_TEMP}/changed-articles.txt"
          else
            # No parent reachable (e.g. a manually dispatched run): review all articles.
            find content -type f -name '*.md' > "${RUNNER_TEMP}/changed-articles.txt"
          fi
          python scripts/article_preflight.py --file-list "${RUNNER_TEMP}/changed-articles.txt"
      - run: pytest -q
      - run: python -m py_compile scripts/article_preflight.py
      - run: python -m py_compile scripts/news_images.py
      - run: python -m py_compile scripts/earnings.py
      - run: python -m py_compile scripts/earnings_backfill.py
      - run: python -m py_compile scripts/global_earnings_watch.py
      - run: python -m py_compile scripts/sp500_registry.py
      - run: node --check compound/site/static/earnings-directory.js
      - run: node --check compound/site/static/wealth-hub.js
      - run: node --check compound/site/static/tools.js
      - run: node --check compound/site/static/mortgage-calculator.js
      - run: node --check compound/site/static/debt-repayment.js
      - run: node tests/tools_arithmetic.cjs
      - run: node tests/solar_funnel_attribution.cjs
      - run: node --check compound/site/static/pia-providers.js
      - run: node tests/pia_provider_fees.cjs
