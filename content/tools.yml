    results:
      - {id: final, label: Projected balance}
      - {id: contributed, label: Total money contributed}
      - {id: growth, label: Estimated growth}
    guide: |
      ## Small regular amounts can become meaningful
      This tool compounds the starting balance monthly and assumes each new monthly contribution is added at the end of the month. It is useful for testing different saving rates and time horizons.

      The return is an assumption, not a forecast. Investment returns are uneven and can be negative, while deposit-account returns can change and may be taxable.
