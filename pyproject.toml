[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "compound"
version = "0.1.0"
description = "Compound.ie content pipeline: poll Irish government sources, interview the owner over Telegram, draft with Claude, publish on approval."
requires-python = ">=3.11"
dependencies = [
    "python-telegram-bot[job-queue]>=22,<23",
    "anthropic>=1.5,<2",
    "feedparser>=6",
    "httpx>=0.27",
    "jinja2>=3.1",
    "markdown>=3.5",
    "pyyaml>=6",
    "python-dotenv>=1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
compound = "compound.cli:main"

[tool.setuptools.packages.find]
include = ["compound*"]

[tool.setuptools.package-data]
compound = ["prompts/*.md", "site/templates/*.html", "site/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
