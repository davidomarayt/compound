          grep -Fq 'type="date"' /tmp/pregnancy.html
          grep -Fq 'first-trimester ultrasound' /tmp/pregnancy.html

          fetch https://compound.ie/alcohol-units-calories-cost-calculator/ /tmp/alcohol.html
          grep -Fq 'data-calculator="alcohol_ireland"' /tmp/alcohol.html
          grep -Fq '10 grams of pure alcohol' /tmp/alcohol.html
          grep -Fq '0.789' /tmp/alcohol.html

          fetch https://compound.ie/bmi-calculator/ /tmp/bmi.html
          grep -Fq 'BMI REFERENCE RANGE' /tmp/bmi.html
          grep -Fq '300,000 adults' /tmp/bmi.html

          fetch https://compound.ie/solar-ev-battery-optimiser/ /tmp/solar-opt.html
          grep -Fq 'data-calculator="solar_optimizer"' /tmp/solar-opt.html

          fetch https://compound.ie/wealth/solar-panels-vs-battery-ireland/ /tmp/solar-battery-article.html
          grep -Fq 'Do you actually need a battery with solar panels in Ireland?' /tmp/solar-battery-article.html
          grep -Fq '/solar-payback-calculator/' /tmp/solar-battery-article.html
          grep -Fq '/solar-ev-battery-optimiser/' /tmp/solar-battery-article.html
          grep -Fq '/ev-charging-cost-calculator/' /tmp/solar-battery-article.html

          grep -Fq '/wealth/solar-panels-vs-battery-ireland/' /tmp/solar-opt.html

          fetch https://compound.ie/whole-house-retrofit-planner/ /tmp/retrofit.html
          grep -Fq 'data-calculator="retrofit_planner"' /tmp/retrofit.html

          fetch https://compound.ie/static/tools.js?v=20260921e /tmp/tools.js
          grep -Fq 'take_home_2026' /tmp/tools.js
          grep -Fq 'renderToolChart' /tmp/tools.js
          grep -Fq 'myfuturefund' /tmp/tools.js
          grep -Fq 'childcare_return' /tmp/tools.js
          grep -Fq 'mortgage_switch' /tmp/tools.js
          grep -Fq 'lifetime_cost' /tmp/tools.js
          grep -Fq 'car_finance' /tmp/tools.js
          grep -Fq 'balloonPayment' /tmp/tools.js
          grep -Fq 'nutrition_needs' /tmp/tools.js
          grep -Fq 'pregnancy_timeline' /tmp/tools.js
          grep -Fq 'alcohol_ireland' /tmp/tools.js
          grep -Fq 'parseDateOnly' /tmp/tools.js
          grep -Fq 'solar_optimizer' /tmp/tools.js
          grep -Fq 'retrofit_planner' /tmp/tools.js

          fetch https://compound.ie/sitemap.xml /tmp/sitemap.xml
          grep -Fq 'https://compound.ie/tools/' /tmp/sitemap.xml
          grep -Fq 'https://compound.ie/take-home-pay-calculator/' /tmp/sitemap.xml
          grep -Fq 'https://compound.ie/pension-projection-calculator/' /tmp/sitemap.xml
          grep -Fq 'https://compound.ie/rent-vs-buy-calculator/' /tmp/sitemap.xml
          grep -Fq 'https://compound.ie/solar-payback-calculator/' /tmp/sitemap.xml

          echo 'Live verification passed for Compound tools, calculator pages, assets and sitemap.'
