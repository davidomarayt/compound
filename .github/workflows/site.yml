# Builds the static site from content/ and publishes it to GitHub Pages whenever an article is
# committed. The bot's DEPLOY_COMMAND does the commit and push; this does the rest. Enable once in
# the repo: Settings -> Pages -> Source: GitHub Actions.
name: site
on:
  push:
    paths: ["content/**", "compound/site/**", ".github/workflows/site.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - run: compound build
        env:
          SITE_BASE_URL: https://compound.ie
          PREVIEW_BASE_URL: https://compound.ie
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  verify-live:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify public Compound deployment
        shell: bash
        run: |
          set -euo pipefail
          fetch() {
            curl --fail --silent --show-error --location \
              --retry 12 --retry-delay 5 --retry-all-errors \
              --connect-timeout 10 --max-time 30 \
              "$1" -o "$2"
          }

          fetch https://compound.ie/tools/ /tmp/tools.html
          grep -Fq '<title>Free Calculators &amp; Tools for Ireland | Compound</title>' /tmp/tools.html || \
            grep -Fq '<title>Free Calculators & Tools for Ireland | Compound</title>' /tmp/tools.html
          grep -Fq '/take-home-pay-calculator/' /tmp/tools.html
          grep -Fq '/pension-projection-calculator/' /tmp/tools.html
          grep -Fq '/rent-vs-buy-calculator/' /tmp/tools.html
          grep -Fq '/solar-payback-calculator/' /tmp/tools.html

          fetch https://compound.ie/take-home-pay-calculator/ /tmp/take-home.html
          grep -Fq 'Take-Home Pay Calculator Ireland 2026' /tmp/take-home.html
          grep -Fq 'data-calculator="take_home_2026"' /tmp/take-home.html

          fetch https://compound.ie/pension-projection-calculator/ /tmp/pension.html
          grep -Fq 'data-calculator="pension_projection"' /tmp/pension.html
          grep -Fq 'data-tool-chart' /tmp/pension.html

          fetch https://compound.ie/myfuturefund-calculator/ /tmp/mff.html
          grep -Fq 'data-calculator="myfuturefund"' /tmp/mff.html
          grep -Fq 'MyFutureFund Auto-Enrolment Calculator Ireland' /tmp/mff.html

          fetch https://compound.ie/wealth/myfuturefund-vs-private-pension-ireland/ /tmp/mff-article.html
          grep -Fq 'MyFutureFund vs a private pension in Ireland' /tmp/mff-article.html
          grep -Fq '/myfuturefund-calculator/' /tmp/mff-article.html
          grep -Fq '/pension-tax-relief-calculator/' /tmp/mff-article.html
          grep -Fq '/pension-projection-calculator/' /tmp/mff-article.html
          grep -Fq '/wealth/pension-tax-relief-ireland-how-to-claim/' /tmp/mff-article.html

          grep -Fq '/wealth/myfuturefund-vs-private-pension-ireland/' /tmp/mff.html

          fetch https://compound.ie/childcare-return-to-work-calculator/ /tmp/childcare.html
          grep -Fq 'data-calculator="childcare_return"' /tmp/childcare.html
          grep -Fq '2.14' /tmp/childcare.html

          fetch https://compound.ie/mortgage-switch-calculator/ /tmp/switch.html
          grep -Fq 'data-calculator="mortgage_switch"' /tmp/switch.html

          fetch https://compound.ie/wealth/is-switching-your-mortgage-worth-it-ireland/ /tmp/switch-article.html
          grep -Fq 'Is switching your mortgage worth it in Ireland?' /tmp/switch-article.html
          grep -Fq '/mortgage-switch-calculator/' /tmp/switch-article.html
          grep -Fq '/mortgage-calculator/' /tmp/switch-article.html
          grep -Fq '/mortgage-overpayment-calculator/' /tmp/switch-article.html

          grep -Fq '/wealth/is-switching-your-mortgage-worth-it-ireland/' /tmp/switch.html

          fetch https://compound.ie/wealth/mortgage-overpayments-100-euro-ireland/ /tmp/mortgage-article.html
          grep -Fq '/mortgage-overpayment-calculator/' /tmp/mortgage-article.html
          grep -Fq '/mortgage-switch-calculator/' /tmp/mortgage-article.html

          fetch https://compound.ie/mortgage-overpayment-calculator/ /tmp/mortgage-tool.html
          grep -Fq '/wealth/mortgage-overpayments-100-euro-ireland/' /tmp/mortgage-tool.html

          fetch https://compound.ie/health/macronutrients-micronutrients-guide-ireland/ /tmp/macros-article.html
          grep -Fq '/nutrition-needs-calculator/' /tmp/macros-article.html

          fetch https://compound.ie/nutrition-needs-calculator/ /tmp/nutrition-tool-links.html
          grep -Fq '/health/macronutrients-micronutrients-guide-ireland/' /tmp/nutrition-tool-links.html

          fetch https://compound.ie/lifetime-cost-calculator/ /tmp/lifetime.html
          grep -Fq 'data-calculator="lifetime_cost"' /tmp/lifetime.html

          fetch https://compound.ie/car-finance-calculator/ /tmp/car-finance.html
          grep -Fq 'data-calculator="car_finance"' /tmp/car-finance.html
          grep -Fq 'Basic calculation' /tmp/car-finance.html
          grep -Fq 'Advanced calculation' /tmp/car-finance.html
          grep -Fq 'PCP final balloon / GMFV' /tmp/car-finance.html

          fetch https://compound.ie/nutrition-needs-calculator/ /tmp/nutrition.html
          grep -Fq 'data-calculator="nutrition_needs"' /tmp/nutrition.html
          grep -Fq 'Mifflin' /tmp/nutrition.html
          grep -Fq 'Morton et al. 2018' /tmp/nutrition.html

          fetch https://compound.ie/pregnancy-due-date-calculator/ /tmp/pregnancy.html
