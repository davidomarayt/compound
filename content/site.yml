# Site-wide settings that are safe to commit (nothing secret goes here).
#
# Google AdSense. Leave client blank until your site is approved, then fill in your publisher id
# (ca-pub-...) and the slot ids of three display ad units created in the AdSense console. Blank
# slots are simply not rendered. Also turn on Google's consent message under Privacy & messaging in
# the AdSense console: EU readers must be asked before personalised ads are shown.
adsense:
  client: "ca-pub-6115783809711785"
  slots:
    article_top: ""      # under the standfirst, above the article body
    article_bottom: ""   # after the article body
    feed: ""             # on the pillar listing pages, after the list

# Google Analytics 4. The measurement ID is public by design. Analytics storage defaults to
# denied until the reader makes a choice in the site's privacy control.
analytics:
  measurement_id: "G-S7LGYWZDC8"

# Email signup. The form posts to this URL; leave blank and the signup boxes are not shown at all.
# Kit (kit.com) and MailerLite both give a form "action" URL for an embedded form; paste it here.
# The field name posted is email_address (Kit's default); MailerLite forms accept it too.
email_form_action: ""
