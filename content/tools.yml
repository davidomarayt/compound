      - {id: withdrawal_rate, label: Illustrative annual withdrawal rate, type: number, suffix: "%", default: 4, min: 0, max: 15, step: 0.1}
      - {id: state_pension, label: Annual State Pension or social-welfare income to include, type: number, prefix: "€", default: 0, min: 0, step: 100}
