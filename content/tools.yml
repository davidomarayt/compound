  - slug: net-worth-calculator
    title: Net Worth Calculator Ireland
    category: Pensions & Investing
    formula: net_worth
    summary: Build a clear household balance-sheet snapshot from your assets and debts, then see what is driving your net worth.
    meta_description: Net worth calculator Ireland. Add savings, investments, pensions, property and debts to estimate household net worth, property equity and debt-to-assets.
    updated: 2026-09-22
    basic_note: Start with the big balance-sheet items. You can get a useful first snapshot in under two minutes.
    advanced_note: Advanced mode adds other property, vehicles, business interests and additional liabilities. Use current values and avoid counting the same asset twice.
    result_note: A balance-sheet snapshot, not a measure of income or financial security. Some assets are difficult to value or access quickly, and market values can change.
    fields:
      - id: cash
        label: Cash & bank accounts
        type: number
        prefix: "€"
        default: 15000
        min: 0
        step: 100
        section_start: Assets
        help: "Current accounts, savings accounts, credit-union balances and cash. Use today's balance rather than an annual average."
      - id: investments
        label: Shares, funds & other investments
        type: number
        prefix: "€"
        default: 10000
        min: 0
        step: 100
        help: "Use current market value before any tax that might arise on a future sale. Do not include pension funds here."
      - id: pensions
        label: Pension & retirement pots
        type: number
        prefix: "€"
        default: 50000
        min: 0
        step: 100
        help: "Use the current fund or transfer value if you know it — not a projected retirement value or future pension income."
      - id: home_value
        label: Main home market value
        type: number
        prefix: "€"
        default: 350000
        min: 0
        step: 1000
        help: "Use a realistic current estimate, not necessarily the price you paid. Leave at €0 if you do not own your home."
      - id: other_property
        label: Other property / land
        type: number
        prefix: "€"
        default: 0
        min: 0
        step: 1000
        advanced: true
        help: "Estimated current value of rental property, holiday homes, land or other real estate."
      - id: vehicles
        label: Vehicles
        type: number
        prefix: "€"
        default: 0
        min: 0
        step: 500
        advanced: true
        help: "Use realistic resale value, not the original purchase price."
      - id: business_value
        label: Business ownership
        type: number
        prefix: "€"
        default: 0
        min: 0
        step: 1000
        advanced: true
        help: "Only include a defensible estimate of the value of your ownership interest. Private businesses can be especially difficult to value."
      - id: other_assets
        label: Other material assets
        type: number
        prefix: "€"
        default: 0
        min: 0
        step: 100
        advanced: true
        help: "For example valuables or other assets you would genuinely include on a household balance sheet. Avoid double counting."
      - id: mortgage
        label: Main home mortgage balance
        type: number
        prefix: "€"
        default: 250000
        min: 0
        step: 1000
        section_start: Debts
        help: "Enter the outstanding principal balance, not the sum of all future scheduled repayments."
      - id: other_property_mortgage
        label: Mortgage on other property
        type: number
        prefix: "€"
        default: 0
        min: 0
        step: 1000
        advanced: true
        help: "Outstanding mortgage or secured borrowing linked to the other property entered above."
      - id: loans
        label: Personal & car loans
        type: number
        prefix: "€"
        default: 10000
        min: 0
        step: 100
        help: "Outstanding balances on personal loans, car loans or hire-purchase borrowing."
      - id: credit_cards
        label: Credit cards & overdrafts
        type: number
        prefix: "€"
        default: 0
        min: 0
        step: 50
        help: "Use the amount currently owed, including any overdraft balance you want included."
      - id: other_debt
        label: Other debts
        type: number
        prefix: "€"
        default: 0
        min: 0
        step: 100
        help: "Other personal liabilities not already counted above."
      - id: tax_liabilities
        label: Tax / other material liabilities
        type: number
        prefix: "€"
        default: 0
        min: 0
        step: 100
        advanced: true
        help: "Include known material amounts owed if you want them reflected in the snapshot."
    results:
      - {id: net_worth, label: Estimated net worth}
      - {id: total_assets, label: Total assets}
      - {id: total_liabilities, label: Total liabilities}
      - {id: property_equity, label: Property equity}
      - {id: financial_assets, label: Cash + investments + pensions}
      - {id: net_ex_pension, label: Net worth excluding pension pots}
      - {id: debt_asset_ratio, label: Debt-to-assets ratio}
    guide: |
      ## What net worth actually measures

      **Net worth is a balance-sheet number:** the current value of what you own minus the current amount you owe.

      The Central Statistics Office uses essentially the same framework when measuring Irish household wealth. In the Household Finance and Consumption Survey, **gross wealth** is the value of real and financial assets, while **net wealth** is gross wealth less debt.

      That sounds simple, but the quality of the result depends on the quality of the values you enter. A bank balance is precise. The value of a home, private business, vehicle or collection of valuables is an estimate. This calculator is designed to make those assumptions visible rather than create false precision.

      ## What to count as an asset

      For a personal or household net-worth snapshot, common assets include:

      - cash in current, savings and credit-union accounts;
      - shares, funds and other investments at current market value;
      - pension and retirement funds at their current fund value;
      - your main home and other property at a realistic current market value;
      - vehicles, business interests and other material assets where a reasonable current value can be estimated.

      The CSO's Irish household wealth survey similarly includes main residences, other property, land, businesses, vehicles and valuables as real assets, alongside deposits, shares, funds, voluntary pensions and other financial assets.

      The important rule is **do not count the same value twice**. If a business owns a property and your estimate of the business already includes that property, do not add the property again personally. Likewise, do not include a pension fund inside “investments” and then again under “pensions”.

      ## Use current value, not what you originally paid

      Net worth is intended to be a snapshot of the balance sheet **today**.

      A home bought for €250,000 that could reasonably sell for €350,000 is a €350,000 asset for this purpose. A car bought for €40,000 that might now sell for €22,000 is closer to a €22,000 asset.

      The opposite is true for debt. Enter the **current outstanding balance**, not the original amount borrowed and not the total of all future repayments including future interest.

      ## Why pensions are included — and also shown separately

      Pension assets can be a major part of long-term household wealth, but they are not the same as cash in a savings account. Access is restricted and the eventual amount available can be affected by investment performance, pension rules and taxation.

      Compound therefore includes pension pots in the main net-worth figure but also shows **net worth excluding pensions**. That second number is not “liquid net worth” — your home and other illiquid assets may still be included — but it helps separate retirement assets from the rest of the balance sheet.

      ## Property equity is not the same as property value

      If a home is worth €400,000 and the mortgage balance is €250,000, the household has approximately **€150,000 of home equity** before selling costs and any other adjustments.

      Compound's property-equity result combines the property values you enter and subtracts the related mortgage balances. Property equity can be negative if secured debt exceeds the estimated property value.

      ## Debt-to-assets: useful, but not a score

      The debt-to-assets ratio divides total liabilities by total assets. A household with €100,000 of debt and €400,000 of assets has a 25% ratio.

      Lower leverage generally means more of the asset base is financed by the household's own equity, but there is no universal “good” percentage for an individual household. Age, income stability, mortgage stage, interest rates, liquidity and the type of assets and debts all matter.

      The Central Bank also tracks household debt relative to assets at an economy-wide level. Those national figures are useful context, but they should not be treated as a personal target.

      ## Irish context: useful perspective, not a leaderboard

      The CSO's 2023 Household Finance and Consumption Survey reported **median household net wealth of €256,900**. The main residence represented 46% of gross household wealth, and 66% of households had some form of debt.

      Those statistics describe households across Ireland, not an appropriate target for any one person. Household size, age, home ownership, pension coverage, region and life stage all have a large effect on the number. A 28-year-old renter and a mortgage-free retired couple should not expect similar balance sheets.

      More recent Central Bank aggregate data show the same broad lesson: housing and pension/financial assets make up a large share of Irish household wealth, while household liabilities are dominated by long-term loans.

      ## Net worth is not the same as financial health

      A high net worth can coexist with poor cash flow. Someone may own a valuable home but have little accessible cash and a stretched monthly budget. Conversely, someone early in their career may have a low or negative net worth while having a strong income, manageable debt and a high savings rate.

      For that reason, use this number alongside other questions:

      - Do you have enough accessible cash for emergencies?
      - Is expensive debt falling over time?
      - Are pension and long-term investment contributions on track?
      - Is your monthly cash flow sustainable?
      - Is too much of your wealth concentrated in one asset?

      Net worth is most useful as a **trend you track against your own previous position**, not as a single score.

      ## A simple way to use this calculator

      Pick a date — for example the end of each quarter or year — and use reasonably consistent valuation methods each time.

      Keep bank and investment balances exact where possible. For property, vehicles and private businesses, avoid changing the valuation method merely to make the result look better. Over time, the change in your balance sheet can then be separated into things such as saving, debt repayment and changes in asset values.

      ## Important limitations

      This is an educational balance-sheet calculator, not a formal valuation, insolvency assessment or financial-planning recommendation.

      It does not deduct hypothetical Capital Gains Tax, transaction costs, pension tax, estate costs or selling costs from the asset values you enter. Those amounts may matter if an asset is actually sold or transferred. Private-company interests, property and valuables may also sell for materially more or less than an estimate.

      The calculator runs entirely in your browser. Compound does not receive the values you enter.

    sources:
      - {title: "CSO — Household Finance and Consumption Survey 2023: Wealth and Debt", url: "https://www.cso.ie/en/releasesandpublications/ep/p-hfcs/householdfinanceandconsumptionsurvey2023/wealthanddebt/"}
      - {title: "CSO — Household Finance and Consumption Survey 2023: Key Findings", url: "https://www.cso.ie/en/releasesandpublications/ep/p-hfcs/householdfinanceandconsumptionsurvey2023/keyfindings/"}
      - {title: "Central Bank of Ireland — Household Wealth, Q1 2026", url: "https://www.centralbank.ie/statistics/data-and-analysis/household-wealth"}

  - slug: regular-savings-calculator
    title: Regular Savings Calculator Ireland
    category: Pensions & Investing
    formula: regular_savings
    summary: Project a regular saving or investment plan, then show the effect of contribution increases, annual fees and inflation.
    meta_description: Regular savings calculator Ireland. Project a future balance from starting savings and monthly contributions, with advanced fees, contribution growth and inflation-adjusted results.
    updated: 2026-09-22
    basic_note: "Basic mode keeps the monthly contribution constant and treats the annual return as the return received by the account or investment."
    advanced_note: "Advanced mode can increase contributions each year, apply an annual percentage fee and translate the final balance into today's purchasing power."
    fields:
      - {id: current, label: Starting balance, type: number, prefix: "€", default: 5000, min: 0, step: 100, section_start: Starting point}
      - {id: monthly, label: Monthly saving now, type: number, prefix: "€", default: 300, min: 0, step: 10}
      - {id: years, label: Time horizon, type: number, suffix: years, default: 10, min: 0.25, max: 70, step: 0.25, section_start: Growth}
      - {id: rate, label: Annual return before advanced fee, type: number, suffix: "%", default: 4, min: -20, max: 30, step: 0.1, help: "In Basic mode treat this as the return received by the account. In Advanced mode it is the return before the annual percentage fee entered below."}
      - {id: annual_contribution_growth, label: Increase monthly saving each year, type: number, suffix: "%", default: 0, min: -20, max: 30, step: 0.5, advanced: true, section_start: Advanced assumptions}
      - {id: annual_fee, label: Annual percentage fee, type: number, suffix: "%", default: 0, min: 0, max: 10, step: 0.05, advanced: true, help: "Enter a recurring percentage charge not already reflected in the return assumption. Do not double-count a fee already embedded in a quoted net return."}
      - {id: inflation_rate, label: Annual inflation assumption, type: number, suffix: "%", default: 2, min: -5, max: 20, step: 0.1, advanced: true}
    results:
      - {id: final, label: Projected nominal balance}
      - {id: contributed, label: Total money contributed}
      - {id: growth, label: Estimated net growth}
      - {id: net_return, label: Implied annual return after fee, advanced: true}
      - {id: real_balance, label: Final balance in today's money, advanced: true}
      - {id: ending_monthly, label: Monthly saving in final year, advanced: true}
      - {id: fee_drag, label: Modelled balance reduction from fee, advanced: true}
    guide: |
      ## Build a savings path, not just an end number
      The calculator compounds monthly and adds each regular contribution at the end of the month. Advanced mode lets the contribution rise annually and separates nominal balance from today's purchasing power.

      Investment returns are uneven in real life. The model uses a constant return for planning and does not calculate Irish investment tax. Use a return assumption appropriate to the product you are modelling.
    sources:
      - {title: "CCPC — About savings", url: "https://www.ccpc.ie/manage-your-money/saving-and-investments/savings"}
      - {title: "Revenue — Deposit Interest Retention Tax", url: "https://www.revenue.ie/en/additional-incomes/dirt/index.aspx"}
      - {title: "CSO — Consumer Price Index methodology", url: "https://www.cso.ie/en/methods/prices/consumerpriceindex/methodologydocuments/csoconsumerpriceindexmethodology/"}

  - slug: pension-tax-relief-calculator
    title: Pension Tax Relief Calculator Ireland 2026
    category: Pensions & Investing
    formula: pension_relief
    summary: Estimate how much of a new employee or personal pension contribution falls within Revenue's age-related relief limit after allowing for contributions already using that limit.
    meta_description: Pension tax relief calculator Ireland 2026. Apply Revenue age-related contribution limits, the €115,000 earnings cap and existing employee contributions.
    updated: 2026-09-22
    basic_note: "Basic mode assumes no other employee/personal pension contribution has already used this year's age-related limit."
    advanced_note: "Advanced mode subtracts employee/personal contributions already made for the relevant earnings. Do not enter employer contributions here: Revenue says employer contributions are not counted against the employee's earnings threshold."
    fields:
      - {id: age, label: Age, type: number, default: 35, min: 16, max: 100, step: 1, section_start: Revenue limit}
      - {id: earnings, label: Relevant annual earnings, type: number, prefix: "€", default: 60000, min: 0, step: 1000, help: "Revenue caps the earnings used for this relief-limit calculation at €115,000. If you have multiple income sources, relief can depend on the source to which the contribution relates."}
      - {id: contribution, label: New employee / personal contribution to model, type: number, prefix: "€", default: 6000, min: 0, step: 100, section_start: Contribution}
      - {id: existing_contributions, label: Other employee / personal contributions already using this year's limit, type: number, prefix: "€", default: 0, min: 0, step: 100, advanced: true, help: "Include employee/personal contributions already using this annual limit. Do not include employer contributions or the new contribution being modelled."}
      - id: tax_rate
        label: Income-tax rate available for this illustration
        type: select
        default: "40"
        options:
          - {value: "20", label: 20%}
          - {value: "40", label: 40%}
    results:
      - {id: age_percentage, label: Revenue age-related percentage}
      - {id: earnings_used, label: Earnings used for relief limit}
      - {id: limit, label: Maximum employee/personal contributions within age limit}
      - {id: remaining_limit, label: Remaining limit before new contribution}
      - {id: eligible, label: New contribution potentially eligible}
      - {id: excess, label: New contribution above remaining limit}
      - {id: relief, label: Estimated Income Tax relief}
      - {id: net_cost, label: New contribution less estimated relief}
    guide: |
      ## Revenue's age and earnings limits
      Tax relief for employee/personal pension contributions is limited by an age-related percentage and an annual earnings ceiling of €115,000. The percentages are 15% under 30, 20% from 30–39, 25% from 40–49, 30% from 50–54, 35% from 55–59 and 40% from age 60.

      Revenue states that qualifying employee pension contributions receive Income Tax relief at the marginal rate, subject to the limits, but do not receive USC or PRSI relief. The selected 20%/40% rate is an illustration; actual usable relief depends on your taxable income and circumstances.
    sources:
      - {title: "Revenue — Tax relief limits on pension contributions", url: "https://www.revenue.ie/en/jobs-and-pensions/pension/relief/tax-relief-limits.aspx"}
      - {title: "Revenue — Tax relief on pension contributions", url: "https://www.revenue.ie/en/jobs-and-pensions/pension/relief/index.aspx"}

  - slug: capital-gains-tax-calculator
    title: Capital Gains Tax Calculator Ireland
    category: Tax & Take-Home Pay
    formula: cgt
    summary: Estimate CGT on a straightforward disposal using the 33% standard rate and €1,270 annual exemption.
    meta_description: Capital Gains Tax calculator Ireland. Estimate CGT using the standard 33% rate, allowable costs, losses and the €1,270 annual exemption.
    updated: 2026-09-22
    fields:
      - {id: sale, label: Sale proceeds, type: number, prefix: "€", default: 30000, min: 0, step: 100}
      - {id: purchase, label: Original purchase cost, type: number, prefix: "€", default: 15000, min: 0, step: 100}
      - {id: costs, label: Allowable acquisition, disposal and enhancement costs, type: number, prefix: "€", default: 500, min: 0, step: 10}
      - {id: losses, label: Allowable capital losses to use, type: number, prefix: "€", default: 0, min: 0, step: 10}
    results:
      - {id: gain, label: Gain before losses and exemption}
      - {id: taxable, label: Taxable gain after losses and exemption}
      - {id: tax, label: Estimated CGT at 33%}
    guide: |
      ## A simple CGT estimate
      Revenue states that the standard CGT rate is 33% for most gains and that an individual has a €1,270 annual personal exemption. Allowable capital losses are generally deducted before the annual exemption.

      This calculator does not determine whether a disposal is exempt, whether a relief such as Principal Private Residence relief applies, or whether a special CGT rate applies. It also does not calculate tax on Irish-domiciled investment funds, which can fall under different tax rules.
    sources:
      - {title: "Revenue — How to calculate CGT", url: "https://www.revenue.ie/en/gains-gifts-and-inheritance/transfering-an-asset/how-to-calculate-cgt.aspx"}
      - {title: "Revenue — CGT exemptions", url: "https://www.revenue.ie/en/gains-gifts-and-inheritance/transfering-an-asset/what-is-exempt-from-cgt.aspx"}

  - slug: vat-calculator
    title: VAT Calculator Ireland 2026
    category: Tax & Take-Home Pay
    formula: vat
    summary: Add or remove Irish VAT at common 2026 rates.
    meta_description: VAT calculator Ireland 2026. Add or remove VAT at 23%, 13.5%, 9%, 4.8% or 0% and see the net, VAT and gross amounts.
    updated: 2026-09-22
    fields:
      - {id: amount, label: Amount, type: number, prefix: "€", default: 100, min: 0, step: 0.01}
      - id: direction
        label: Amount entered is
        type: select
        default: net
        options:
          - {value: net, label: Net — add VAT}
          - {value: gross, label: Gross — remove VAT}
      - id: rate
        label: VAT rate
        type: select
        default: "23"
        options:
          - {value: "23", label: 23% standard rate}
          - {value: "13.5", label: 13.5% reduced rate}
          - {value: "9", label: 9% second reduced rate}
          - {value: "4.8", label: 4.8% livestock rate}
          - {value: "0", label: 0% zero rate}
    results:
      - {id: net, label: Net amount}
      - {id: vat, label: VAT amount}
      - {id: gross, label: Gross amount}
    guide: |
      ## Irish VAT rates in 2026
      Revenue lists the 2026 standard rate as 23%, with 13.5%, 9%, 4.8% and zero rates applying to qualifying supplies. Selecting the correct VAT rate depends on what is being supplied, not simply on the seller's preference.

      Use this calculator only after identifying the correct rate. It does not decide whether a business must register for VAT or whether a particular product or service qualifies for a reduced or zero rate.
    sources:
      - {title: "Revenue — Current VAT rates", url: "https://www.revenue.ie/en/vat/vat-rates/search-vat-rates/current-VAT-rates.aspx"}

  - slug: inflation-calculator
    title: Inflation Calculator Ireland
    category: Pensions & Investing
    formula: inflation
    summary: See how inflation compounds future prices, erodes a fixed amount of cash and changes the real return on savings or investments.
    meta_description: Inflation calculator Ireland. Estimate future prices, lost purchasing power and the inflation-adjusted real return on a savings or investment assumption.
    updated: 2026-09-22
    basic_note: "Basic mode compares the future cost of today's basket with the purchasing power of holding the same nominal euro amount."
    advanced_note: "Advanced mode adds a nominal investment/savings return and converts it to a real return using the compounding relationship between growth and inflation."
    fields:
      - {id: amount, label: Amount today, type: number, prefix: "€", default: 10000, min: 0, step: 100}
      - {id: rate, label: Assumed annual inflation, type: number, suffix: "%", default: 2, min: -20, max: 30, step: 0.1, help: "Use this as a scenario rate. The CSO CPI is Ireland's official broad inflation measure, but your household's costs can move differently."}
      - {id: years, label: Years, type: number, default: 10, min: 0, max: 100, step: 1}
      - {id: nominal_return, label: Nominal annual savings / investment return, type: number, suffix: "%", default: 5, min: -20, max: 30, step: 0.1, advanced: true, section_start: Advanced real-return check, help: "Enter a nominal return on the same basis as your inflation assumption. The calculator converts it to an exact real return; it does not model tax or fees separately."}
    results:
      - {id: future_cost, label: Future cost of the same basket}
      - {id: purchasing_power, label: Purchasing power of the same nominal amount}
      - {id: lost_power, label: Purchasing power lost}
      - {id: price_multiplier, label: Modelled price multiplier, advanced: true}
      - {id: real_return, label: Inflation-adjusted annual return, advanced: true}
      - {id: nominal_growth_value, label: Value after nominal return, advanced: true}
      - {id: real_growth_value, label: That value in today's money, advanced: true}
    guide: |
      ## Nominal euros and real purchasing power are different
      A constant inflation rate compounds the future cost of today's basket upward while the purchasing power of a fixed nominal cash amount falls.

      Advanced mode uses the exact real-return relationship rather than simply subtracting inflation from the nominal return. Actual inflation and market returns vary from year to year; this is a deterministic scenario.
    sources:
      - {title: "CSO — Consumer Price Index methodology", url: "https://www.cso.ie/en/methods/prices/consumerpriceindex/methodologydocuments/csoconsumerpriceindexmethodology/"}
      - {title: "CSO — Consumer Price Index", url: "https://www.cso.ie/en/methods/prices/consumerpriceindex/"}

