# Builds the static site from content/ and publishes it to GitHub Pages whenever an article is
# committed to the publishing branch. The bot's DEPLOY_COMMAND does the commit and push; this does
# the rest. Enable once in the repo: Settings -> Pages -> Source: GitHub Actions.
name: site
on:
  push:
    branches: ["claude/clever-babbage-uibieq"]
    paths: ["content/**", "compound/site/**", "scripts/news_images.py", "scripts/verify_solar_mobile.py", ".github/workflows/site.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-v2
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - name: Attach images to published News stories
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python scripts/news_images.py
      - name: Verify approved TV licence stock photograph
        run: |
          test -s compound/site/static/images/evergreen/ireland-tv-licence-decline-2026.jpg
          python - <<'PY'
          from PIL import Image
          p = 'compound/site/static/images/evergreen/ireland-tv-licence-decline-2026.jpg'
          with Image.open(p) as img:
              img.verify()
          with Image.open(p) as img:
              assert img.width >= 1000 and img.height >= 500, img.size
          print('Approved TV licence image validated')
          PY
      - run: compound build
        env:
          SITE_BASE_URL: https://compound.ie
          PREVIEW_BASE_URL: https://compound.ie
      - name: Validate interactive 360-degree solar direction tool
        shell: bash
        run: |
          set -euo pipefail
          node --check compound/site/static/solar-orientation.js
          node --check compound/site/static/solar-project.js
          grep -Fq 'data-solar-project' public/solar/get-quotes/index.html
          grep -Fq 'solar-project.js?v=2' public/solar/get-quotes/index.html
          grep -Fq 'solar-project.css?v=2' public/solar/get-quotes/index.html
          grep -Fq 'data-orientation-embedded' public/solar/get-quotes/index.html
          grep -Fq 'data-sp-face-button="2"' public/solar/get-quotes/index.html
          ! grep -Fq 'sol-project-photo-guide' public/solar/get-quotes/index.html
          ! grep -Fq 'data-sp="photoRoof"' public/solar/get-quotes/index.html


          python - <<'PY'
          from pathlib import Path
          page = Path("public/solar/roof-direction/index.html")
          hub = Path("public/solar/index.html")
          sitemap = Path("public/sitemap.xml")
          checks = {
              "new roof direction route": page.is_file() and page.stat().st_size > 0,
              "page canonical": page.is_file() and "https://compound.ie/solar/roof-direction/" in page.read_text(),
              "interactive compass": page.is_file() and "data-solar-orientation" in page.read_text(),
              "calculator JavaScript": page.is_file() and "/static/solar-orientation.js?v=3" in page.read_text(),
              "calculator stylesheet": page.is_file() and "/static/solar-orientation.css?v=2" in page.read_text(),
              "solar hub links to tool": hub.is_file() and "/solar/roof-direction/" in hub.read_text(),
              "sitemap indexable entry": sitemap.is_file() and "https://compound.ie/solar/roof-direction/" in sitemap.read_text(),
          }
          for label, result in checks.items():
              print(f'{"PASS" if result else "FAIL"}: {label}', flush=True)
          if page.exists():
              html = page.read_text()
              marker = html.find('rel="canonical"')
              print("Rendered canonical excerpt:", html[max(0, marker - 35):marker + 220] if marker >= 0 else "NO CANONICAL TAG", flush=True)
              print("Path in rendered HTML:", '/solar/roof-direction/' in html, flush=True)
          if sitemap.exists():
              print("Sitemap roof entries:", [line.strip() for line in sitemap.read_text().splitlines() if 'roof-direction' in line][:3], flush=True)
          required = ("new roof direction route", "page canonical", "interactive compass",
                      "calculator JavaScript", "calculator stylesheet", "solar hub links to tool",
                      "sitemap indexable entry")
          missing = [key for key in required if not checks[key]]
          if missing:
              raise SystemExit("Missing critical solar page checks: " + ", ".join(missing))
          PY
      - name: Ensure Budget 2027 electricity article and corrected proposal are in the publish artifact
        shell: bash
        run: |
          set -euo pipefail
          test -s public/news/no-energy-credit-budget-2027-electricity-bills-winter/index.html
          test -s public/news/heat-pump-grant-14500-oil-vs-heat-pump-ireland/index.html
          test -s public/news/boiler-scrappage-grant-ireland-2027/index.html
          grep -Fq '€14,500' public/news/heat-pump-grant-14500-oil-vs-heat-pump-ireland/index.html
          grep -Fq '/solar-payback-calculator/' public/news/heat-pump-grant-14500-oil-vs-heat-pump-ireland/index.html
          grep -Fq '€14,500' public/wealth/heat-pumps-ireland/index.html
          grep -Fq 'no longer just a proposal' public/news/boiler-scrappage-grant-ireland-2027/index.html
          test -s public/news/social-democrats-400-energy-credit-budget-2027/index.html
          grep -Fq 'https://compound.ie/news/no-energy-credit-budget-2027-electricity-bills-winter/' public/news/no-energy-credit-budget-2027-electricity-bills-winter/index.html
          grep -Fq 'What Will Electricity Cost This Winter?' public/news/no-energy-credit-budget-2027-electricity-bills-winter/index.html
          grep -Fq 'was NOT included in Budget 2027' public/news/social-democrats-400-energy-credit-budget-2027/index.html
          grep -Fq '/solar-payback-calculator/' public/news/no-energy-credit-budget-2027-electricity-bills-winter/index.html
          grep -Fq '/electricity-cost-calculator/' public/news/no-energy-credit-budget-2027-electricity-bills-winter/index.html
      - name: Verify published 4kW vs 6kW vs 8kW solar guide
        shell: bash
        run: |
          set -euo pipefail
          page=public/wealth/how-many-solar-panels-do-i-need-ireland/index.html
          test -s "$page"
          grep -Fq 'https://compound.ie/wealth/how-many-solar-panels-do-i-need-ireland/' "$page"
          grep -Fq 'How Many Solar Panels Do You Need in Ireland?' "$page"
          grep -Fq '/solar-payback-calculator/' "$page"
          grep -Fq '/solar/compare-quotes/' "$page"
          grep -Fq 'chart-svg' "$page"
          grep -Fq '/static/images/evergreen/how-many-solar-panels-do-i-need-ireland.jpg' "$page"
          test -s public/static/images/evergreen/how-many-solar-panels-do-i-need-ireland.jpg
      - name: Verify east-west orientation article and approved rooftop photo
        shell: bash
        run: |
          set -euo pipefail
          page=public/wealth/east-west-facing-solar-panels-ireland/index.html
          test -s "$page"
          grep -Fq 'https://compound.ie/wealth/east-west-facing-solar-panels-ireland/' "$page"
          grep -Fq 'East- and West-Facing Solar Panels' "$page"
          grep -Fq 'Same roof pitch. Different sunlight.' "$page"
          grep -Fq '/solar-payback-calculator/' "$page"
          grep -Fq '/solar/compare-quotes/' "$page"
          grep -Fq '/wealth/east-west-facing-solar-panels-ireland/' public/solar/index.html
          test -s public/static/images/evergreen/east-west-facing-solar-panels-ireland.jpg
      - name: Verify winter solar evergreen and pinned cover
        shell: bash
        run: |
          set -euo pipefail
          page=public/wealth/solar-panels-winter-ireland/index.html
          test -s "$page"
          grep -Fq 'https://compound.ie/wealth/solar-panels-winter-ireland/' "$page"
          grep -Fq 'Do Solar Panels Work in Winter in Ireland?' "$page"
          grep -Fq 'Electricity produced per month' "$page"
          test "$(grep -o 'class="chart-svg"' "$page" | wc -l)" -ge 2
          grep -Fq 'Monthly' "$page"
          grep -Fq '/solar-payback-calculator/' "$page"
          grep -Fq '/solar/compare-quotes/' "$page"
          grep -Fq '/wealth/solar-panels-winter-ireland/' public/solar/index.html
          grep -Fq 'solar-panels-winter-ireland.jpg' "$page"
          test -s public/static/images/evergreen/solar-panels-winter-ireland.jpg
      - name: Verify Solar hub pages and client script
        shell: bash
        run: |
          set -euo pipefail
          node --check compound/site/static/solar-hub.js
          node --check compound/site/static/solar-sponsors.js
          node --check compound/site/static/solar-research.js
          for path in solar solar/compare-quotes solar/grants solar/costs solar/installers solar/get-quotes solar/for-installers solar/batteries solar/export-rates solar/equipment; do
            test -s "public/$path/index.html"
            grep -q 'rel="canonical"' "public/$path/index.html"
            grep -q 'solar-hub.css' "public/$path/index.html"
          done
          grep -q 'https://compound.ie/solar/compare-quotes/' public/solar/compare-quotes/index.html
          grep -q '/solar/' public/wealth/index.html
          grep -q 'data-solar-sponsor-form' public/solar/for-installers/index.html
          grep -Fq 'https://formsubmit.co/david@compound.ie' public/solar/for-installers/index.html
          grep -Fq 'data-sponsor-counties' public/solar/for-installers/index.html
          ! grep -q 'action="mailto:' public/solar/for-installers/index.html
          ! grep -q 'Prepare my application email' public/solar/for-installers/index.html
          grep -q 'solar-sponsors.css' public/solar/for-installers/index.html
          ! grep -q 'pagead2.googlesyndication.com' public/solar/for-installers/index.html
          ! grep -q '<ins class="adsbygoogle"' public/solar/for-installers/index.html
          test "$(grep -o 'data-county' content/pages/solar-for-installers.md | wc -l)" -eq 32
          grep -q 'solar-payback-calculator/' public/solar/index.html
          ! grep -R -F 'built and occupied before 2021' public/solar public/solar-payback-calculator public/wealth/solar-panels-ireland public/wealth/solar-panels-vs-battery-ireland
      - name: Check private solar installer portal
        shell: bash
        run: |
          set -euo pipefail
          node --check compound/site/static/solar-installer-portal.js
          test -s public/solar/installer-portal/index.html
          grep -Fq 'noindex,nofollow,noarchive' public/solar/installer-portal/index.html
          grep -Fq 'data-installer-portal' public/solar/installer-portal/index.html
          grep -Fq 'solar-installer-portal.js?v=1' public/solar/installer-portal/index.html
          grep -Fq 'solar-installer-portal.css?v=1' public/solar/installer-portal/index.html
          ! grep -Fq 'pagead2.googlesyndication.com' public/solar/installer-portal/index.html
          ! grep -Fq 'googletagmanager.com' public/solar/installer-portal/index.html
          ! grep -Fq '/solar/installer-portal/' public/sitemap.xml
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  mobile-audit:
    # Independent QA: a Playwright/mobile failure must not leave newly published
    # articles returning 404. Production itself is gated by the build checks above.
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - name: Attach required News photos before the QA rebuild
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python scripts/news_images.py
      - run: compound build
        env:
          SITE_BASE_URL: https://compound.ie
          PREVIEW_BASE_URL: https://compound.ie
      - name: Install browser for Solar Hub mobile audit
        run: |
          python -m pip install "playwright==1.55.0"
          python -m playwright install chromium
      - name: Audit every solar page at mobile and tablet widths
        run: python scripts/verify_solar_mobile.py

  verify-live:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify public Compound deployment
        shell: bash
        run: |
          set -euxo pipefail
          fetch() {
            curl --fail --silent --show-error --location               --retry 12 --retry-delay 5 --retry-all-errors               --connect-timeout 10 --max-time 30               "$1" -o "$2"
          }

          fetch https://compound.ie/ /tmp/home.html
          fetch https://compound.ie/wealth/how-many-solar-panels-do-i-need-ireland/ /tmp/solar-sizing-2026.html
          grep -Fq 'How Many Solar Panels Do You Need in Ireland?' /tmp/solar-sizing-2026.html
          grep -Fq '/solar-payback-calculator/' /tmp/solar-sizing-2026.html
          grep -Fq '/solar/compare-quotes/' /tmp/solar-sizing-2026.html
          grep -Fq 'chart-svg' /tmp/solar-sizing-2026.html
          grep -Fq 'how-many-solar-panels-do-i-need-ireland.jpg' /tmp/solar-sizing-2026.html
          fetch https://compound.ie/static/images/evergreen/how-many-solar-panels-do-i-need-ireland.jpg /tmp/solar-sizing-2026.jpg
          test -s /tmp/solar-sizing-2026.jpg

          # Ensure the new winter solar evergreen is visible to readers, not only in the build artifact.
          fetch https://compound.ie/wealth/solar-panels-winter-ireland/ /tmp/solar-winter-2026.html
          grep -Fq 'https://compound.ie/wealth/solar-panels-winter-ireland/' /tmp/solar-winter-2026.html
          grep -Fq 'Do Solar Panels Work in Winter in Ireland?' /tmp/solar-winter-2026.html
          test "$(grep -o 'class="chart-svg"' /tmp/solar-winter-2026.html | wc -l)" -ge 2
          grep -Fq '/solar-payback-calculator/' /tmp/solar-winter-2026.html
          grep -Fq '/solar/compare-quotes/' /tmp/solar-winter-2026.html
          grep -Fq 'solar-panels-winter-ireland.jpg' /tmp/solar-winter-2026.html
          fetch https://compound.ie/static/images/evergreen/solar-panels-winter-ireland.jpg /tmp/solar-winter-2026.jpg
          test -s /tmp/solar-winter-2026.jpg
          # Catch missing routes and stale corrections immediately after publishing.
          fetch https://compound.ie/news/heat-pump-grant-14500-oil-vs-heat-pump-ireland/ /tmp/heat-pump-grant.html
          grep -Fq '€14,500' /tmp/heat-pump-grant.html
          grep -Fq '/solar-payback-calculator/' /tmp/heat-pump-grant.html
          fetch https://compound.ie/wealth/heat-pumps-ireland/ /tmp/heat-pump-evergreen.html
          grep -Fq '€14,500' /tmp/heat-pump-evergreen.html
          fetch https://compound.ie/news/boiler-scrappage-grant-ireland-2027/ /tmp/boiler-scrappage.html
          grep -Fq 'no longer just a proposal' /tmp/boiler-scrappage.html
          fetch https://compound.ie/news/no-energy-credit-budget-2027-electricity-bills-winter/ /tmp/winter-electricity.html
          grep -Fq 'What Will Electricity Cost This Winter?' /tmp/winter-electricity.html
          grep -Fq '/solar-payback-calculator/' /tmp/winter-electricity.html
          fetch https://compound.ie/news/social-democrats-400-energy-credit-budget-2027/ /tmp/energy-credit-proposal.html
          grep -Fq 'was NOT included in Budget 2027' /tmp/energy-credit-proposal.html
          grep -Fq 'pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6115783809711785' /tmp/home.html

          # Verify solar hub canonical URLs, on-page tools and AdSense script on the public domain.
          for slug in solar solar/compare-quotes solar/grants solar/costs solar/installers solar/get-quotes solar/for-installers solar/batteries solar/export-rates solar/equipment; do
            target="/tmp/solar-${slug//\//-}.html"
            fetch "https://compound.ie/${slug}/" "$target"
            grep -Fq 'solar-hub.css' "$target"
            grep -Fq "<link rel=\"canonical\" href=\"https://compound.ie/${slug}/\">" "$target"
          done
          grep -Fq '/solar/compare-quotes/' /tmp/solar-solar.html
          ! grep -Fq 'pagead2.googlesyndication.com' /tmp/solar-solar-for-installers.html
          grep -Fq 'data-solar-sponsor-form' /tmp/solar-solar-for-installers.html
          grep -Fq 'https://formsubmit.co/david@compound.ie' /tmp/solar-solar-for-installers.html
          ! grep -Fq 'action="mailto:' /tmp/solar-solar-for-installers.html
          grep -Fq 'data-solar-quotes' /tmp/solar-solar-compare-quotes.html
          grep -Fq 'data-solar-grants' /tmp/solar-solar-grants.html
          grep -Fq 'data-solar-battery' /tmp/solar-solar-batteries.html
          grep -Fq 'data-solar-export' /tmp/solar-solar-export-rates.html
          grep -Fq 'data-solar-equipment' /tmp/solar-solar-equipment.html
          grep -Fq 'data-orientation-embedded' /tmp/solar-solar-get-quotes.html
          grep -Fq 'data-or="chart"' /tmp/solar-solar-get-quotes.html
          grep -Fq 'data-or="dial"' /tmp/solar-solar-get-quotes.html
          grep -Fq 'data-sp-face-button="2"' /tmp/solar-solar-get-quotes.html
          ! grep -Fq 'sol-project-photo-guide' /tmp/solar-solar-get-quotes.html
          grep -Fq 'solar-orientation.js?v=3' /tmp/solar-solar-get-quotes.html
          grep -Fq 'solar-project.js?v=2' /tmp/solar-solar-get-quotes.html

          fetch https://compound.ie/static/solar-research.js /tmp/solar-research.js
          grep -Fq 'data-solar-battery' /tmp/solar-research.js
          grep -Fq 'pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6115783809711785' /tmp/solar-solar.html
          fetch https://compound.ie/static/solar-hub.js /tmp/solar-hub.js
          grep -Fq 'data-solar-quotes' /tmp/solar-hub.js

          # Solar orientation explorer must be visible, legible and have fresh chart assets.
          fetch https://compound.ie/solar/roof-direction/ /tmp/solar-roof-direction.html
          grep -Fq 'data-solar-orientation' /tmp/solar-roof-direction.html
          grep -Fq 'class="sor-canvas"' /tmp/solar-roof-direction.html
          grep -Fq 'data-or="chart-amount"' /tmp/solar-roof-direction.html
          grep -Fq 'solar-orientation.js?v=3' /tmp/solar-roof-direction.html
          grep -Fq 'solar-orientation.css?v=2' /tmp/solar-roof-direction.html
          grep -Fq '/solar/roof-direction/' /tmp/solar-solar.html
          fetch https://compound.ie/static/solar-orientation.js?v=3 /tmp/solar-orientation-v2.js
          fetch https://compound.ie/static/solar-orientation.css?v=2 /tmp/solar-orientation-v2.css
          grep -Fq 'function drawChart' /tmp/solar-orientation-v2.js
          grep -Fq 'color-scheme:only light' /tmp/solar-orientation-v2.css

          fetch https://compound.ie/ads.txt /tmp/ads.txt
          grep -Fq 'google.com, pub-6115783809711785, DIRECT, f08c47fec0942fa0' /tmp/ads.txt

          # Budget 2027 is a flagship live article with bespoke artwork. Verify the
          # exact hero/social asset so an old fallback image cannot silently return.
          fetch https://compound.ie/wealth/budget-2027-what-to-watch/ /tmp/budget-2027.html
          grep -Fq '<img src="/static/images/budget-2027-hero.webp"' /tmp/budget-2027.html
          grep -Fq 'alt="Red Budget 2027 folder surrounded by a payslip, house keys, childcare, energy, pension and household-cost elements."' /tmp/budget-2027.html
          grep -Fq 'content="https://compound.ie/static/images/budget-2027-hero.webp"' /tmp/budget-2027.html
          grep -Fq 'Illustration: Compound' /tmp/budget-2027.html
          ! grep -Fq 'Illustrative retirement photograph' /tmp/budget-2027.html
          fetch https://compound.ie/static/images/budget-2027-hero.webp /tmp/budget-2027-hero.webp
          test -s /tmp/budget-2027-hero.webp

          fetch https://compound.ie/tools/ /tmp/tools.html
          grep -Fq 'Mortgages &amp; Home Buying' /tmp/tools.html || grep -Fq 'Mortgages & Home Buying' /tmp/tools.html
          grep -Fq 'Pensions &amp; Investing' /tmp/tools.html || grep -Fq 'Pensions & Investing' /tmp/tools.html
          grep -Fq '/net-worth-calculator/' /tmp/tools.html
          grep -Fq '/debt-repayment-calculator/' /tmp/tools.html
          grep -Fq '/solar-payback-calculator/' /tmp/tools.html
          grep -Fq '/nutrition-needs-calculator/' /tmp/tools.html
          grep -Fq '/budget-2027-calculator/' /tmp/tools.html
          grep -Fq '/employer-cost-calculator/' /tmp/tools.html

          fetch https://compound.ie/budget-2027-calculator/ /tmp/budget-calculator.html
          grep -Fq 'Budget 2027 Calculator Ireland' /tmp/budget-calculator.html
          grep -Fq 'data-tool-name="budget-2027-calculator"' /tmp/budget-calculator.html
          grep -Fq 'pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6115783809711785' /tmp/budget-calculator.html
          grep -Fq 'id="tool-interaction-zone"' /tmp/budget-calculator.html

          fetch https://compound.ie/employer-cost-calculator/ /tmp/employer-cost.html
          grep -Fq 'Employer Cost Calculator Ireland 2027' /tmp/employer-cost.html
          grep -Fq 'data-tool-name="employer-cost-calculator"' /tmp/employer-cost.html
          grep -Fq 'pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6115783809711785' /tmp/employer-cost.html
          grep -Fq 'id="tool-interaction-zone"' /tmp/employer-cost.html

          fetch https://compound.ie/take-home-pay-calculator/ /tmp/take-home-2027.html
          grep -Fq 'Take-Home Pay Calculator Ireland 2027' /tmp/take-home-2027.html
          grep -Fq '€46,500' /tmp/take-home-2027.html

          fetch https://compound.ie/capital-gains-tax-calculator/ /tmp/cgt-2027.html
          grep -Fq '31%' /tmp/cgt-2027.html

          fetch https://compound.ie/inheritance-tax-calculator/ /tmp/cat-2027.html
          grep -Fq '€420,000' /tmp/cat-2027.html
          grep -Fq '7 October 2026' /tmp/cat-2027.html

          fetch https://compound.ie/wealth/inheritance-tax-ireland/ /tmp/inheritance-tax-2027.html
          grep -Fq '€420,000' /tmp/inheritance-tax-2027.html
          grep -Fq '€44,000' /tmp/inheritance-tax-2027.html
          grep -Fq '€22,000' /tmp/inheritance-tax-2027.html
          grep -Fq 'What changed in Budget 2027?' /tmp/inheritance-tax-2027.html
          grep -Fq '€336,000' /tmp/inheritance-tax-2027.html

          fetch https://compound.ie/help-to-buy-calculator/ /tmp/htb-2027.html
          grep -Fq '€35,000' /tmp/htb-2027.html

          fetch https://compound.ie/rent-tax-credit-calculator/ /tmp/rent-credit-2027.html
