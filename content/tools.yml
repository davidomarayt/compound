      - {id: employee_total, label: Total employee contributions in projection}
      - {id: employer_total, label: Total employer contributions in projection, advanced: true}
      - {id: state_total, label: Total State contributions in projection, advanced: true}
      - {id: projected_real, label: Projected fund in today's money, advanced: true}
      - {id: investment_growth, label: Modelled investment growth, advanced: true}
    guide: |
      ## MyFutureFund rules used by this calculator
      In 2026, eligible employees are automatically enrolled where they are aged 23 to under 60, earn more than €20,000 across employments and are not already paying into a pension through payroll. Certain employees outside those age/income thresholds can opt in; self-employed people cannot currently opt in.

      Employee and employer contributions are 1.5% in 2026–2028 and the State adds 0.5%. The rates rise to 3% / 3% / 1% in 2029–2031, 4.5% / 4.5% / 1.5% in 2032–2034 and 6% / 6% / 2% from 2035. Contributions stop after the €80,000 annual gross-pay threshold is reached, subject to pay-period timing.
    sources:
      - {title: "MyFutureFund — participant eligibility", url: "https://myfuturefund.ie/participant"}
      - {title: "MyFutureFund — contribution rates and €80,000 threshold", url: "https://myfuturefund.ie/participant/contributions"}
      - {title: "MyFutureFund — participant guide", url: "https://myfuturefund.ie/participant-guide"}

  - slug: childcare-return-to-work-calculator
    title: Childcare Cost vs Returning to Work Calculator Ireland
    category: Family & Life Planning
    formula: childcare_return
    summary: Estimate what returning to paid work adds to household finances after PAYE, childcare, NCS support, commuting and work-related costs.
    meta_description: Childcare vs returning to work calculator Ireland. Estimate net salary after PAYE, childcare fees, NCS subsidy, commuting and work costs.
    updated: 2026-09-22
    fields:
      - {id: salary, label: Gross annual salary on returning to work, type: number, prefix: "€", default: 45000, min: 0, step: 500, section_start: Work income}
      - {id: pension_pct, label: Employee pension contribution, type: number, suffix: "%", default: 0, min: 0, max: 30, step: 0.5}
      - {id: work_hours, label: Paid working hours per week, type: number, default: 37.5, min: 1, max: 80, step: 0.5}
      - {id: children, label: Children using paid childcare, type: number, default: 1, min: 1, max: 10, step: 1, section_start: Childcare}
      - {id: childcare_hours, label: Paid childcare hours per child per week, type: number, default: 40, min: 0, max: 80, step: 1}
      - {id: childcare_fee, label: Childcare fee before NCS, type: number, prefix: "€", suffix: "/hour", default: 8, min: 0, step: 0.10}
      - {id: ncs_rate, label: NCS hourly subsidy actually available to you, type: number, prefix: "€", suffix: "/hour", default: 2.14, min: 0, step: 0.01}
      - {id: childcare_weeks, label: Childcare / working weeks per year, type: number, default: 48, min: 1, max: 52, step: 1}
      - {id: commute_weekly, label: Weekly commuting cost, type: number, prefix: "€", default: 60, min: 0, step: 5, section_start: Work-related costs}
      - {id: work_cost_weekly, label: Other weekly work costs, type: number, prefix: "€", default: 30, min: 0, step: 5}
      - {id: other_annual, label: Other annual costs caused by returning to work, type: number, prefix: "€", default: 0, min: 0, step: 100}
    results:
      - {id: take_home, label: Estimated annual take-home pay}
      - {id: childcare_gross, label: Gross annual childcare cost}
      - {id: ncs_support, label: NCS support modelled}
      - {id: childcare_net, label: Net childcare cost}
      - {id: work_costs, label: Commute + other work costs}
      - {id: household_gain, label: Estimated annual household financial gain from working}
      - {id: effective_hourly, label: Financial gain per paid working hour}
    guide: |
      ## Start with the actual NCS award if you have one

      The current universal NCS subsidy is €2.14 per hour for up to 45 hours a week. Income-assessed awards can be higher and depend on household circumstances, child age, educational stage and family composition. From September 2026, the income-assessed thresholds increased to €34,000 at the lower threshold and €68,000 at the upper threshold. Enter your actual hourly NCS award if you have it rather than relying on the default.

      This calculator asks a different question from a normal salary calculator: **after tax and the costs created by going to work, how much additional household cash is left?**

      The model estimates single-person PAYE/USC/Class A PRSI using the 2026 default tax assumptions, then subtracts net childcare, commuting and other work costs. It does not value pension benefits, career progression, employment rights, future earnings, social insurance entitlements or the non-financial value of work.

      Childcare fees remain provider-specific. Use your provider's actual weekly/hourly fee and your actual NCS award for the most meaningful answer.
    sources:
      - {title: "Department of Children — 2026 National Childcare Scheme income-threshold changes", url: "https://www.gov.ie/en/department-of-children-disability-and-equality/press-releases/minister-foley-publishes-two-new-action-plans-for-the-early-learning-and-care-and-school-age-childcare-sector/"}
      - {title: "HSE — childcare options and NCS support", url: "https://www2.hse.ie/babies-children/parenting-advice/services-supports/childcare-options-free-pre-school-scheme/"}
      - {title: "Revenue — 2026 tax rates, bands and credits", url: "https://www.revenue.ie/en/personal-tax-credits-reliefs-and-exemptions/tax-relief-charts/index.aspx"}

