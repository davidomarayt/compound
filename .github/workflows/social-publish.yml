name: Publish social posts

on:
  workflow_run:
    workflows: ["site"]
    types: [completed]
  workflow_dispatch:
    inputs:
      article_path:
        description: 'Article markdown path, e.g. content/wealth/example.md'
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish-social:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: social-production
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests PyYAML

      - name: Publish social posts
        env:
          ARTICLE_PATH: ${{ inputs.article_path }}
          BASE_SHA: ""
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          SOCIAL_DRY_RUN: ${{ vars.SOCIAL_DRY_RUN }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_AUTHOR_URN: ${{ secrets.LINKEDIN_AUTHOR_URN }}
          LINKEDIN_VERSION: ${{ vars.LINKEDIN_VERSION }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION }}
        run: python scripts/social_publish.py
