  - slug: take-home-pay-calculator
    title: Take-Home Pay Calculator Ireland 2026
    category: Tax & Take-Home Pay
    formula: take_home_2026
    summary: Estimate 2026 PAYE, USC, Class A PRSI, pension deductions and net pay, with an advanced mode for your own Revenue band, credits and reduced-USC status.
    meta_description: Take-home pay calculator Ireland 2026. Estimate PAYE, USC, Class A PRSI, pension deductions and monthly net salary using current 2026 rules.
    updated: 2026-09-22
    basic_note: "Basic mode models a single PAYE employee using the €44,000 standard-rate band, the standard Single Person and Employee tax credits, standard USC and no employee pension contribution."
    advanced_note: "Advanced mode lets you add an employee pension percentage, replace the tax band, add extra credits and model Revenue's reduced USC rates where the qualifying conditions are met."
    fields:
      - {id: salary, label: Annual gross salary, type: number, prefix: "€", default: 60000, min: 0, step: 500, section_start: Gross pay}
      - {id: pension_pct, label: Employee pension contribution, type: number, suffix: "%", default: 0, min: 0, max: 40, step: 0.5, advanced: true, section_start: Advanced PAYE assumptions, help: "The model treats this as an employee/personal contribution receiving Income Tax relief. It does not test the Revenue age-related relief limit."}
      - {id: band, label: Your annual 20% tax band, type: number, prefix: "€", default: 44000, min: 0, step: 500, advanced: true, help: "The 2026 single-person standard-rate band is €44,000. Use the band on your Revenue Tax Credit Certificate if different."}
      - {id: other_credits, label: Extra annual tax credits beyond the standard personal/employee credits, type: number, prefix: "€", default: 0, min: 0, step: 50, advanced: true, help: "Do not re-enter the standard Single Person Tax Credit or Employee Tax Credit; the calculator already includes them."}
      - id: usc_reduced
        label: Reduced USC rates apply?
        type: select
        default: no
        advanced: true
        help: "Revenue's 2026 reduced rates can apply to a qualifying person aged 70+ or a full Medical Card holder where aggregate income is €60,000 or less. A GP visit card is not a full Medical Card."
        options:
          - {value: no, label: No — use standard USC rates}
          - {value: yes, label: Yes — I meet the reduced-rate conditions}
    results:
      - {id: annual_net, label: Estimated annual take-home}
      - {id: monthly_net, label: Estimated monthly take-home}
      - {id: paye, label: PAYE Income Tax}
      - {id: usc, label: USC}
      - {id: prsi, label: Employee PRSI}
      - {id: pension, label: Employee pension contribution}
      - {id: deductions, label: Total deductions modelled, advanced: true}
      - {id: effective_deductions, label: Effective deduction rate, advanced: true}
      - {id: next_1000_net, label: Extra take-home from next €1,000 gross, advanced: true}
    guide: |
      ## What this calculator is doing

      Irish payslips combine several separate systems. PAYE Income Tax uses tax bands and credits. USC uses its own progressive bands and exemption rules. PRSI uses social-insurance classes and pay-period rules. Pension deductions can affect Income Tax without necessarily reducing USC or PRSI.

      Compound keeps those components separate in the results so the final take-home figure can be audited rather than presented as a single unexplained number.

      ## Basic mode: a clean 2026 single-PAYE baseline

      The basic calculation uses the 2026 single-person standard-rate band of **€44,000**. Revenue's 2026 examples also show a €2,000 Single Person Tax Credit and a maximum €2,000 Employee Tax Credit.

      The Employee Tax Credit is capped at 20% of PAYE income where annual PAYE income is below €10,000. The calculator applies that cap automatically.

      Standard 2026 USC is 0.5% on the first €12,012, 2% on the next €16,688, 3% on the next €41,344 and 8% on the balance. If annual income subject to USC is €13,000 or less, the standard exemption applies.

      For Class A PRSI, the employee rate is 4.20% up to 30 September 2026 and 4.35% from 1 October 2026 above the relevant threshold, with the weekly PRSI credit applied in the taper range. The annual result is therefore an approximation built from a weekly-equivalent salary.

      ## Advanced mode: use your own Revenue position

      Your actual Revenue Tax Credit Certificate can differ materially from the single-person defaults. Married couples, single-person child carers, people with transferred bands, multiple jobs and people claiming additional credits can have different figures.

      Advanced mode therefore lets you replace the annual 20% band and add credits beyond the standard personal and employee credits already built into the model.

      It also lets you model Revenue's reduced USC regime. For 2026, the reduced rates are 0.5% on the first €12,012 and 2% on the balance for qualifying people aged 70 or over or full Medical Card holders, provided aggregate income is €60,000 or less. If income entered exceeds €60,000, Compound automatically falls back to the standard USC bands.

      ## Pension deductions

      The pension input is deliberately labelled as an **employee pension contribution**. The model treats it as reducing income exposed to PAYE Income Tax, but not USC or PRSI. Revenue's pension tax relief is subject to age-related percentage limits and an earnings ceiling, so a large contribution may not obtain all of the relief implied here. Use the Pension Tax Relief Calculator to test that limit separately.

      ## Why payroll can differ from an annual estimate

      Revenue normally operates PAYE on a cumulative basis through the year, but Week 1 treatment can apply in some circumstances. PRSI is also calculated by pay period, and payroll may contain benefits in kind, taxable bonuses, arrears, share remuneration or other adjustments.

      This calculator is therefore best used as a planning estimate and cross-check. Your Revenue Payroll Notification and actual payslip remain the authoritative inputs for your own position.

    sources:
      - {title: "Revenue — 2026 tax rates, bands and credits", url: "https://www.revenue.ie/en/personal-tax-credits-reliefs-and-exemptions/tax-relief-charts/index.aspx"}
      - {title: "Revenue — How Income Tax is calculated", url: "https://www.revenue.ie/en/jobs-and-pensions/calculating-your-income-tax/how-income-tax-is-calculated.aspx"}
      - {title: "Revenue — 2026 USC rates and thresholds", url: "https://www.revenue.ie/en/jobs-and-pensions/usc/standard-rates-thresholds.aspx"}
      - {title: "Revenue — Reduced USC rates", url: "https://www.revenue.ie/en/jobs-and-pensions/usc/reduced-rates.aspx"}
      - {title: "Department of Social Protection — PRSI Class A rates", url: "https://www.gov.ie/en/department-of-social-protection/publications/prsi-class-a-rates/"}

  - slug: income-tax-calculator
    title: Income Tax Calculator Ireland 2026
    category: Tax & Take-Home Pay
    formula: income_tax_2026
    summary: Calculate 2026 Income Tax before and after credits, with an advanced mode for pension relief, your actual standard-rate band and tax credits.
    meta_description: Income Tax calculator Ireland 2026. Estimate tax at 20% and 40%, pension tax relief and tax credits using current Revenue bands.
    updated: 2026-09-22
    basic_note: "Basic mode uses the 2026 €44,000 single-person standard-rate band and €4,000 of standard personal plus employee tax credits."
    advanced_note: "Advanced mode lets you enter a pension contribution eligible for Income Tax relief and replace the tax band and credits with the figures on your own Revenue record."
    fields:
      - {id: income, label: Annual taxable PAYE earnings before pension, type: number, prefix: "€", default: 60000, min: 0, step: 500}
      - {id: pension, label: Pension contribution eligible for Income Tax relief, type: number, prefix: "€", default: 0, min: 0, step: 100, advanced: true, section_start: Advanced Revenue inputs, help: "Enter only the contribution you expect to qualify for Income Tax relief. Revenue age-related limits can restrict the relief."}
      - {id: band, label: Annual 20% tax band, type: number, prefix: "€", default: 44000, min: 0, step: 500, advanced: true, help: "Use the standard-rate band shown on your Tax Credit Certificate where available."}
      - {id: credits, label: Annual tax credits, type: number, prefix: "€", default: 4000, min: 0, step: 50, advanced: true, help: "The €4,000 default represents the 2026 Single Person Tax Credit plus the maximum Employee Tax Credit."}
    results:
      - {id: taxable, label: Income used for this tax estimate}
      - {id: tax20, label: Tax charged at 20%}
      - {id: tax40, label: Tax charged at 40%}
      - {id: gross_tax, label: Income Tax before credits}
      - {id: final_tax, label: Income Tax after credits}
    guide: |
      ## Income Tax is only one part of an Irish payslip

      This calculator isolates PAYE Income Tax so you can see the 20% and 40% bands separately. It does **not** calculate USC or PRSI; the Take-Home Pay Calculator combines those systems.

      For a single person without qualifying children, the 2026 standard-rate band is €44,000. Income within that band is taxed at 20% and income above it at 40%, before tax credits are deducted.

      ## Tax credits reduce tax, not taxable income

      The 2026 Single Person Tax Credit is €2,000 and the maximum Employee Tax Credit is €2,000. Credits are deducted from gross Income Tax after the 20%/40% calculation. A tax credit is therefore different from a deduction or relief that reduces the amount of income being taxed.

      Your own credits may be higher or lower. Married/civil-partner assessment, the Single Person Child Carer Credit, Home Carer Tax Credit and other reliefs can alter the result. Advanced mode lets you enter the figures Revenue has actually allocated to you.

      ## Pension relief is modelled before the tax bands

      A qualifying employee or personal pension contribution can receive Income Tax relief, subject to Revenue's age-related percentage limits and the €115,000 earnings ceiling used for pension-relief purposes. This calculator assumes the pension amount you enter is eligible; it does not test those limits.

      Pension contributions do not generally receive USC or PRSI relief, which is another reason not to use this standalone Income Tax result as a take-home-pay figure.

      ## Annual versus payroll calculation

      Revenue normally calculates PAYE cumulatively through the year, spreading tax bands and credits across pay periods. A yearly model is useful for planning, but exact payroll deductions can differ because of pay timing, Week 1 treatment, bonuses, multiple employments or mid-year changes to credits and bands.

      Use your Revenue Tax Credit Certificate or Revenue Payroll Notification when you want the most accurate personal inputs.

    sources:
      - {title: "Revenue — 2026 tax rates, bands and credits", url: "https://www.revenue.ie/en/personal-tax-credits-reliefs-and-exemptions/tax-relief-charts/index.aspx"}
      - {title: "Revenue — How Income Tax is calculated", url: "https://www.revenue.ie/en/jobs-and-pensions/calculating-your-income-tax/how-income-tax-is-calculated.aspx"}
      - {title: "Revenue — Tax rate bands", url: "https://www.revenue.ie/en/jobs-and-pensions/calculating-your-income-tax/tax-rate-band.aspx"}
      - {title: "Revenue — Employee Tax Credit", url: "https://www.revenue.ie/en/personal-tax-credits-reliefs-and-exemptions/income-and-employment/employee-tax-credit/index.aspx"}

  - slug: usc-calculator
    title: USC Calculator Ireland 2026
    category: Tax & Take-Home Pay
    formula: usc_2026
    summary: Estimate 2026 Universal Social Charge using the standard bands or, in Advanced mode, Revenue's reduced rates for qualifying taxpayers.
    meta_description: USC calculator Ireland 2026. Apply the €13,000 exemption and current standard or qualifying reduced USC rates.
    updated: 2026-09-22
    basic_note: "Basic mode applies the standard 2026 USC exemption and rate bands."
    advanced_note: "Advanced mode can apply the reduced 2026 USC rates for a qualifying person aged 70+ or full Medical Card holder where aggregate income is €60,000 or less."
    fields:
      - {id: income, label: Annual income subject to USC, type: number, prefix: "€", default: 50000, min: 0, step: 500}
      - id: reduced_rate
        label: Reduced USC rates apply?
        type: select
        default: no
        advanced: true
        help: "Choose Yes only if you meet Revenue's age/full-Medical-Card condition. Income above €60,000 automatically uses standard rates."
        options:
          - {value: no, label: No — standard rates}
          - {value: yes, label: Yes — qualifying reduced rates}
    results:
      - {id: usc, label: Estimated annual USC}
      - {id: effective, label: Effective USC rate}
      - {id: monthly, label: Average monthly USC}
      - {id: rate_basis, label: Rate basis used, advanced: true}
    guide: |
      ## Standard USC in 2026

      If annual income subject to USC is **€13,000 or less**, the standard USC exemption applies. Once income is above €13,000, USC is charged on the full relevant income rather than only on the excess over €13,000.

      The standard 2026 bands are 0.5% on the first €12,012, 2% on the next €16,688, 3% on the next €41,344 and 8% on the balance.

      This progressive structure means the highest rate you touch is not your effective USC rate. The calculator shows the total charge and the percentage of income it represents.

      ## Reduced USC rates

      Revenue provides reduced rates where aggregate income is €60,000 or less and the person is aged 70 or older or holds a full Medical Card. A GP visit card does not qualify.

      The 2026 reduced rates are 0.5% on the first €12,012 and 2% on the balance. If you select the reduced-rate option but enter income above €60,000, Compound uses the standard rates because the reduced regime cannot apply above that income ceiling.

      ## What this calculator does not model

      USC has additional rules for some categories of income and taxpayers. In particular, a 3% USC surcharge can apply to certain non-PAYE income above €100,000. That surcharge is modelled in Compound's contractor comparison where relevant, but it is not included in this general employee-style USC calculator.

      Revenue also has specific exemptions and treatment for certain payments. Use this page as a transparent band calculation, then check Revenue guidance where your income mix is unusual.

    sources:
      - {title: "Revenue — Standard USC rates and thresholds", url: "https://www.revenue.ie/en/jobs-and-pensions/usc/standard-rates-thresholds.aspx"}
      - {title: "Revenue — Calculating your USC", url: "https://www.revenue.ie/en/jobs-and-pensions/usc/calculating-usc.aspx"}
      - {title: "Revenue — Reduced USC rates", url: "https://www.revenue.ie/en/jobs-and-pensions/usc/reduced-rates.aspx"}
      - {title: "Revenue — USC exemptions", url: "https://www.revenue.ie/en/jobs-and-pensions/usc/exempt-payments-income.aspx"}

