name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - run: node --check compound/site/static/tools.js
      - run: node --check compound/site/static/debt-repayment.js
      - run: node tests/tools_arithmetic.cjs

  performance:
    needs: test
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -e .
      - name: Attach images to published News stories
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python scripts/news_images.py
      - run: compound build
        env:
          SITE_BASE_URL: https://compound.ie
          PREVIEW_BASE_URL: https://compound.ie
      - name: Run Lighthouse CI against representative mobile pages
        id: lighthouse
        continue-on-error: true
        run: npx --yes @lhci/cli@0.14.0 autorun --config=.lighthouserc.json
      - name: Print Lighthouse diagnostics
        if: always()
        run: python scripts/lighthouse_diagnostics.py .lighthouseci
      - name: Enforce Lighthouse thresholds
        if: steps.lighthouse.outcome == 'failure'
        run: exit 1
