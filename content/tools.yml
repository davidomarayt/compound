  - slug: salary-hourly-rate-calculator
    title: Salary to Hourly Rate Calculator Ireland
    category: Tax & Take-Home Pay
    formula: salary_hourly
    summary: Convert an annual gross salary into monthly, weekly, daily and hourly gross pay using the working pattern you actually want to compare.
    meta_description: Salary to hourly rate calculator Ireland. Convert annual gross pay into monthly, weekly, daily and hourly rates and see the annual paid hours behind the result.
    updated: 2026-09-22
    fields:
      - {id: salary, label: Annual gross salary, type: number, prefix: "€", default: 50000, min: 0, step: 500, section_start: Gross pay}
      - {id: hours, label: Paid working hours per week, type: number, default: 39, min: 1, max: 100, step: 0.5, section_start: Working pattern, help: "Use paid hours for the comparison. Unpaid breaks should normally be excluded."}
      - {id: weeks, label: Paid weeks per year, type: number, default: 52, min: 1, max: 53, step: 1, help: "For a normal salaried job with paid annual leave, 52 is usually the appropriate denominator. Reducing this to 48 would overstate the hourly equivalent if the annual salary continues during leave."}
      - {id: days, label: Working days per week, type: number, default: 5, min: 1, max: 7, step: 1}
    results:
      - {id: monthly, label: Gross per month}
      - {id: weekly, label: Gross per paid week}
      - {id: daily, label: Gross per working day}
      - {id: hourly, label: Gross per paid hour}
      - {id: annual_hours, label: Paid hours represented}
    guide: |
      ## Put an annual salary on the same basis as hourly work

      Annual salary figures can be awkward to compare with contracting, overtime or shift work. This calculator converts the same gross annual salary into monthly, weekly, daily and hourly equivalents using the working pattern you enter.

      The key input is the denominator. A €50,000 salary divided by 39 hours × 52 paid weeks represents a different hourly equivalent from the same salary attached to a 35-hour week.

      ## Paid leave matters

      Most Irish employees are entitled to four working weeks of paid annual leave under the Organisation of Working Time rules. If you are a normal salaried employee and your salary continues while you take annual leave, those leave weeks are still paid weeks. In that situation, **52 paid weeks** is normally the sensible input.

      Do not automatically change the calculator to 48 weeks simply because you receive four weeks of annual leave. Doing so would divide the same annual salary by too few paid hours and make the hourly equivalent look artificially high.

      The WRC also states that the maximum average working week is generally 48 hours, subject to the statutory averaging rules and exceptions. That is a working-time protection, not a suggested normal working week.

      ## What this number does not include

      This is a gross-pay conversion only. It does not deduct PAYE, USC, PRSI or pension contributions, and it does not assign a value to employer pension contributions, paid sick leave, bonuses, health insurance, share awards, overtime premia or other benefits.

      When comparing employment with contracting, use the hourly figure as a starting point rather than treating it as a break-even contractor rate. A contractor may need to fund unpaid leave, insurance, administration, equipment, accounting and periods without billable work. Compound's Contractor Day Rate vs Salary Calculator is designed for that next step.

      ## A useful comparison method

      First convert the salary to a gross hourly equivalent using the real paid weekly hours. Then separately compare annual take-home pay and benefits. Keeping those two questions separate avoids mixing gross-time economics with tax and employment-package differences.

    sources:
      - {title: "Workplace Relations Commission — Annual Leave", url: "https://www.workplacerelations.ie/en/what_you_should_know/leave/annual-leave/"}
      - {title: "Workplace Relations Commission — Working Hours & Breaks", url: "https://workplacerelations.ie/en/what_you_should_know/hours-and-wages/"}
